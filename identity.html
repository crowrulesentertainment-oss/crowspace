<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace — Identity & Trust</title><link rel="stylesheet" href="crowspace-rebuild.css"><script src="crowspace-auth.js"></script><script src="js/crowspace-identity.js"></script><style>.identity{max-width:1050px;margin:auto}.profile{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center}.avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan);background:#0b1220}.handle{color:var(--cyan)}.badges{display:flex;gap:10px;flex-wrap:wrap}.badge{padding:12px;border:1px solid var(--line);border-radius:12px;background:#ffffff06}.badge i{font-size:22px}.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.trust .card{text-align:center;padding:16px}.trust b{display:block;font:800 20px Orbitron;color:var(--cyan)}@media(max-width:700px){.profile{grid-template-columns:1fr;text-align:center}.trust{grid-template-columns:repeat(2,1fr)}} </style><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script>
</head><body><main class="shell identity"><div class="kicker">CROWRULES // IDENTITY & TRUST</div><section id="state" class="hero"><div class="loading">LOADING UNIVERSAL IDENTITY</div></section></main><script>
(async()=>{try{await CrowSpaceIdentity.ready();let u=await CrowSpaceIdentity.user();if(!u){location.href="login.html?next=identity.html";return}await CrowSpaceAuth.ensureProfile(u);let p=await CrowSpaceIdentity.profile(u.id),b=await CrowSpaceIdentity.badges(u.id),r=await CrowSpaceIdentity.reputation(u.id),c=await CrowSpaceIdentity.counts(u.id);const av=p?.avatar_url||"https://placehold.co/300x300/071225/78efff?text=C";document.getElementById("state").innerHTML=`
<div class="profile"><img class="avatar" src="${av}" alt=""><div><div class="eyebrow">UNIVERSAL CROWRULES IDENTITY</div><h1>${esc(p?.display_name||u.email||"Crow Member")}</h1><div class="handle">@${esc(p?.username||"crow")}</div><p class="muted">${esc(p?.bio||"No bio yet.")}</p><div class="actions"><a class="btn primary" href="profile.html">Open Profile</a><a class="btn" href="settings.html">Identity Settings</a><a class="btn" href="privacy.html">Privacy Center</a></div></div></div>
<div class="trust" style="margin-top:22px"><div class="card"><b>${c.followers}</b><span>Followers</span></div><div class="card"><b>${c.following}</b><span>Following</span></div><div class="card"><b>${c.posts}</b><span>Posts</span></div><div class="card"><b>${r?.reputation_level||1}</b><span>Trust Level</span></div></div>
<div class="card" style="margin-top:18px;padding:20px"><h2>VERIFICATION</h2><p class="muted">Verification is reviewed rather than automatically assigned. Request creator verification from your identity center.</p><a class="btn" href="settings.html#verification">Request Verification</a></div>
<div class="card" style="margin-top:18px;padding:20px"><h2>ACHIEVEMENTS</h2><div class="badges">${b.length?b.map(x=>`<div class="badge"><i>${esc(x.crowspace_badges?.icon||"🏅")}</i><strong> ${esc(x.crowspace_badges?.name||"Achievement")}</strong><div class="muted">${esc(x.crowspace_badges?.description||"")}</div></div>`).join(""):"<div class='empty'>Achievements will appear here as you participate.</div>"}</div></div>`;
}catch(e){document.getElementById("state").innerHTML='<div class="status">Unable to load identity: '+esc(e.message)+'</div>'}})();
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script></body></html>

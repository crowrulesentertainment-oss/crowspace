<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Project Dashboard 7.0 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1200px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.hero{background:linear-gradient(135deg,#081923,#211334,#0d0f18)}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.box{background:var(--p2);border:1px solid #292e42;border-radius:15px;padding:15px}.metric{font-size:30px;font-weight:900;margin-top:7px}.muted{color:var(--m)}.tag{font-size:10px;color:#8ff6ff;letter-spacing:.12em;font-weight:800}.bar{height:12px;background:#202538;border-radius:20px;overflow:hidden}.fill{height:100%;background:#20e6ff}.item{padding:11px 0;border-bottom:1px solid #292e42}.live{color:#8ff6ff;font-weight:800}@media(max-width:800px){.grid,.two{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.two{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Project Dashboard 7.0</span></div><div class="actions"><a class="btn" href="./creator-project-workspace.html">Tasks</a><a class="btn" href="./creator-project-assets.html">Assets</a><a class="btn" href="./creator-team-workspace.html">Team</a><a class="btn" href="./creator-calendar.html">Calendar</a></div></div><section class="card hero"><label>Project</label><select id="pick" style="width:100%;max-width:600px;margin:8px 0;padding:11px;background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px"></select><div id="hero"></div><div id="live" class="live">● Connecting…</div></section><section id="metrics" class="grid"></section><div class="two"><section class="card"><h2>📋 Task Progress</h2><div id="progress"></div><h3>Upcoming Deadlines</h3><div id="deadlines"></div></section><section class="card"><h2>👥 Team</h2><div id="team"></div><h2>📦 Assets</h2><div id="assets"></div></section></div><div class="two"><section class="card"><h2>⚡ Project Activity</h2><div id="activity"></div></section><section class="card"><h2>🧭 Production Links</h2><div class="actions"><a class="btn primary" href="./creator-project-workspace.html">Open Task Workspace</a><a class="btn" href="./creator-project-assets.html">Open Asset Hub</a><a class="btn" href="./creator-team-workspace.html">Open Team</a><a class="btn" href="./creator-calendar.html">Open Calendar</a></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let me,projects=[],channel;async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_projects").select("id,title,description,category,status,created_at,updated_at").eq("owner_id",me.id).order("created_at",{ascending:false});projects=r.data||[];pick.innerHTML=projects.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join("")||'<option value="">No projects</option>';await render();connect()}async function render(){const p=projects.find(x=>x.id===pick.value);if(!p){hero.innerHTML="<h1>No project yet</h1>";metrics.innerHTML="";return}hero.innerHTML='<h1>'+esc(p.title)+'</h1><p class="muted">'+esc(p.description||"")+'</p><span class="tag">'+esc(p.category||"PROJECT")+' · '+esc(p.status||"")+'</span>';const [t,m,a,c]=await Promise.all([db.from("crowspace_project_tasks").select("id,title,status,priority,due_at,assigned_to").eq("project_id",p.id),db.from("crowspace_project_members").select("user_id,role,status").eq("project_id",p.id).in("status",["active","accepted"]),db.from("crowspace_project_activity").select("actor_id,activity_type,message,created_at").eq("project_id",p.id).order("created_at",{ascending:false}).limit(10),db.from("crowspace_project_assets").select("id,name,asset_type,url,created_at").eq("project_id",p.id)]);const ts=t.data||[],done=ts.filter(x=>x.status==="done").length,now=Date.now(),overdue=ts.filter(x=>x.status!=="done"&&x.due_at&&new Date(x.due_at)<new Date()).length;const pct=ts.length?Math.round(done/ts.length*100):0;metrics.innerHTML=[["Tasks",ts.length],["Completed",done],["Overdue",overdue],["Assets",(c.data||[]).length]].map(x=>'<div class="box"><span class="tag">'+x[0].toUpperCase()+'</span><div class="metric">'+x[1]+'</div></div>').join("");progress.innerHTML='<div class="row"><b>'+pct+'%</b><span class="muted">'+done+' of '+ts.length+' tasks complete</span></div><br><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div>';const due=ts.filter(x=>x.due_at&&x.status!=="done").sort((x,y)=>new Date(x.due_at)-new Date(y.due_at)).slice(0,8);deadlines.innerHTML=due.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.priority)+' · '+new Date(x.due_at).toLocaleString()+'</div></div>').join("")||'<div class="muted">No upcoming deadlines.</div>';team.innerHTML='<div class="item"><b>Project Owner</b><div class="muted">'+esc(me.email||"You")+'</div></div>'+(m.data||[]).map(x=>'<div class="item"><b>'+esc(x.role||"Member")+'</b><div class="muted">'+esc(x.user_id)+'</div></div>').join("")||'<div class="muted">No additional team members.</div>';assets.innerHTML=(c.data||[]).slice(0,8).map(x=>'<div class="item"><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.asset_type)+'</div><a class="btn" target="_blank" rel="noopener" href="'+esc(x.url)+'">Open</a></div>').join("")||'<div class="muted">No assets yet.</div>';activity.innerHTML=(a.data||[]).map(x=>'<div class="item"><span class="tag">'+esc(x.activity_type)+'</span><p>'+esc(x.message)+'</p><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div></div>').join("")||'<div class="muted">No activity yet.</div>'}function connect(){if(channel)db.removeChannel(channel);channel=db.channel("project-dashboard-"+pick.value).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_project_tasks",filter:"project_id=eq."+pick.value},render).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_project_members",filter:"project_id=eq."+pick.value},render).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_project_assets",filter:"project_id=eq."+pick.value},render).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_project_activity",filter:"project_id=eq."+pick.value},render).subscribe(s=>live.textContent=s==="SUBSCRIBED"?"● LIVE — Project dashboard updates automatically":"● "+s)}pick.onchange=()=>{render();connect()};init();</script></body></html>

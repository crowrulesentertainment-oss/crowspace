<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Reel Analytics</title><link rel="stylesheet" href="style.css"><style>
body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{border:1px solid var(--line);border-radius:16px;padding:22px;background:linear-gradient(135deg,#0b0e15,#101322)}.hero h1{margin:0 0 6px;font:800 24px Orbitron}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat,.reelCard{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px}.stat b{display:block;font:800 24px Orbitron;color:var(--cyan);margin-top:6px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.reelCard{display:grid;grid-template-columns:120px 1fr;gap:14px}.thumb{width:120px;height:160px;background:#000;border-radius:10px;overflow:hidden}.thumb video{width:100%;height:100%;object-fit:cover}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.metric{font-size:11px;color:var(--muted)}.metric b{display:block;color:var(--text);font-size:16px;margin-top:3px}.chartBox{margin:16px 0}.chart{height:150px;display:flex;align-items:flex-end;gap:6px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#080b11;overflow:hidden}.bar{flex:1;min-width:4px;background:linear-gradient(180deg,var(--cyan),var(--purple));border-radius:5px 5px 2px 2px;position:relative}.bar span{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--muted);white-space:nowrap}.rate{color:var(--cyan)!important}.window.active{border-color:var(--cyan);color:var(--cyan)}.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:14px}.back{display:inline-block;margin-top:12px;color:var(--cyan)}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.reelCard{grid-template-columns:90px 1fr}.thumb{width:90px;height:130px}}</style></head><body><header class="topbar"><a href="index.html">FEED</a><a href="discover.html">DISCOVER</a><a href="media.html">MEDIA</a><a href="reels.html">REELS</a><a href="notifications.html">NOTIFICATIONS</a></header><main class="wrap"><section class="hero"><h1>CREATOR REEL ANALYTICS</h1><div id="identity" class="muted">INITIALIZING…</div><a class="back" href="reels.html">← Back to Reels</a></section><section class="stats"><div class="stat">REELS<b id="reelCount">0</b></div><div class="stat">VIEWS<b id="views">0</b></div><div class="stat">WATCH TIME<b id="watch">0m</b></div><div class="stat">FOLLOWERS<b id="followers">0</b></div></section><section class="stats"><div class="stat">LIKES<b id="likes">0</b></div><div class="stat">COMMENTS<b id="comments">0</b></div><div class="stat">REPOSTS<b id="reposts">0</b></div><div class="stat">SAVES<b id="saves">0</b></div></section><section class="hero" style="margin:16px 0"><h2 style="margin:0">PERFORMANCE WINDOW</h2><div style="display:flex;gap:8px;margin-top:12px"><button class="window" data-days="7">7 DAYS</button><button class="window" data-days="30">30 DAYS</button><button class="window" data-days="90">90 DAYS</button></div><div id="trend" class="muted" style="margin-top:10px">Select a window.</div></section><section class="hero chartBox"><h2 style="margin:0 0 10px">VIEW TREND</h2><div id="viewChart" class="chart"></div><div id="chartNote" class="muted" style="margin-top:18px;font-size:11px"></div></section><h2>REEL PERFORMANCE</h2><div id="list" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
let allRows=[],allViews=[],allInteractions=[],allComments=[];let days=30;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const n=x=>Number(x||0).toLocaleString();
function renderWindow(){const cutoff=Date.now()-days*86400000;const v=allViews.filter(x=>new Date(x.created_at).getTime()>=cutoff);const i=allInteractions.filter(x=>new Date(x.created_at).getTime()>=cutoff);const co=allComments.filter(x=>new Date(x.created_at).getTime()>=cutoff);const likes=i.filter(x=>x.interaction_type==="like").length,saves=i.filter(x=>x.interaction_type==="save").length,reposts=i.filter(x=>x.interaction_type==="repost").length;document.getElementById("trend").textContent=v.length+" views · "+likes+" likes · "+saves+" saves · "+reposts+" reposts · "+co.length+" comments in the last "+days+" days";document.querySelectorAll(".window").forEach(b=>b.classList.toggle("active",Number(b.dataset.days)===days));const buckets=Math.min(days,14),step=Math.ceil(days/buckets),series=[];for(let n=buckets-1;n>=0;n--){const end=Date.now()-n*step*86400000,start=Date.now()-(n+1)*step*86400000;series.push({label:step===1?new Date(end).toLocaleDateString(undefined,{month:"numeric",day:"numeric"}):"D-"+(n*step+1),value:v.filter(x=>{const t=new Date(x.created_at).getTime();return t>=start&&t<end}).length})}const max=Math.max(1,...series.map(x=>x.value));document.getElementById("viewChart").innerHTML=series.map(x=>'<div class="bar" style="height:'+Math.max(4,x.value/max*100)+'%"><span>'+esc(x.label)+'</span></div>').join("");document.getElementById("chartNote").textContent="Each bar represents views collected during an equal slice of the selected window.";}
async function run(){const {data:{session}}=await db.auth.getSession();if(!session){location.href="login.html";return}const uid=session.user.id;const [{data:profile},{data:posts},{count:followers}]=await Promise.all([db.from("crowspace_profiles").select("display_name,username,avatar_url").eq("user_id",uid).maybeSingle(),db.from("crowspace_posts").select("id,body,media_url,created_at").eq("user_id",uid).not("media_url","is",null).order("created_at",{ascending:false}).limit(100),db.from("crowspace_follows").select("follower_id",{count:"exact",head:true}).eq("followed_user_id",uid)]);const rows=(posts||[]).filter(x=>/\.(mp4|webm|mov)(\?|$)/i.test(x.media_url));document.getElementById("identity").textContent=(profile?.display_name||profile?.username||"Creator")+" · @"+(profile?.username||"creator");document.getElementById("reelCount").textContent=n(rows.length);document.getElementById("followers").textContent=n(followers);if(!rows.length){document.getElementById("list").innerHTML='<div class="empty">No video Reels yet. Publish a video Caw to start building analytics.</div>';return}const ids=rows.map(x=>x.id);const [{data:views},{data:interactions},{data:comments}]=await Promise.all([db.from("crowspace_reel_views").select("reel_id,watched_seconds,created_at").in("reel_id",ids),db.from("crowspace_social_interactions").select("target_id,interaction_type,created_at").eq("target_type","post").in("target_id",ids),db.from("crowspace_comments").select("post_id,created_at").in("post_id",ids)]);allRows=rows;allViews=views||[];allInteractions=interactions||[];allComments=comments||[];renderWindow();document.getElementById("views").textContent=n((views||[]).length);document.getElementById("watch").textContent=((views||[]).reduce((a,x)=>a+Number(x.watched_seconds||0),0)/60).toFixed(1)+"m";const counts=t=>(interactions||[]).filter(x=>x.interaction_type===t).length;document.getElementById("likes").textContent=n(counts("like"));document.getElementById("reposts").textContent=n(counts("repost"));document.getElementById("saves").textContent=n(counts("save"));document.getElementById("comments").textContent=n((comments||[]).length);const by={};(views||[]).forEach(x=>{by[x.reel_id]??={views:0,watch:0};by[x.reel_id].views++;by[x.reel_id].watch+=Number(x.watched_seconds||0)});(interactions||[]).forEach(x=>{by[x.target_id]??={views:0,watch:0};by[x.target_id][x.interaction_type]=(by[x.target_id][x.interaction_type]||0)+1});(comments||[]).forEach(x=>{by[x.post_id]??={views:0,watch:0};by[x.post_id].comments=(by[x.post_id].comments||0)+1});document.getElementById("list").innerHTML=rows.map(x=>{const m=by[x.id]||{views:0,watch:0};const engagement=(m.like||0)+(m.comments||0)+(m.repost||0)+(m.save||0);const rate=m.views?(engagement/m.views)*100:0;const avg=m.views?m.watch/m.views:0;return '<article class="reelCard"><div class="thumb"><video src="'+esc(x.media_url)+'" muted playsinline preload="metadata"></video></div><div><b>'+esc(x.body||"Video Caw")+'</b><div class="muted">'+new Date(x.created_at).toLocaleDateString()+"</div><div class="metrics"><div class="metric">VIEWS<b>"+n(m.views)+"</b></div><div class="metric">WATCH<b>"+(m.watch/60).toFixed(1)+"m</b></div><div class="metric">LIKES<b>"+n(m.like)+"</b></div><div class="metric">COMMENTS<b>"+n(m.comments)+"</b></div><div class="metric">REPOSTS<b>"+n(m.repost)+"</b></div><div class="metric">SAVES<b>"+n(m.save)+"</b></div><div class="metric">AVG WATCH<b>"+avg.toFixed(1)+"s</b></div><div class="metric">ENGAGEMENT<b class="rate">"+rate.toFixed(1)+"%</b></div></div></div></article>'}).join("")}document.querySelectorAll(".window").forEach(b=>b.onclick=()=>{days=Number(b.dataset.days);renderWindow()});run();
</script></body></html>

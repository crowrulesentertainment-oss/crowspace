<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CrowSpace event"><title>Event — CrowSpace</title>
<link rel="stylesheet" href="crowspace-rebuild.css"><link rel="stylesheet" href="crowspace-universal.css">
<script src="crowspace-auth.js">\n<script src="js/crowspace-notification-badges.js" defer></script></script><script src="crowspace-universal.js" defer></script><script src="crowspace-pages.js" defer></script>
<script src="js/crowspace-youtube-events.js" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
<style>.event-notification-indicator{display:inline-flex;align-items:center;gap:7px;margin:8px 0;padding:6px 10px;border:1px solid #ff658544;border-radius:999px;background:#ff65850d;color:#ff9bb0;font:800 8px Orbitron;letter-spacing:.08em}.event-notification-indicator .dot{width:7px;height:7px;border-radius:50%;background:#ff6585;box-shadow:0 0 10px #ff6585}</style><style>
.event-detail-shell{width:min(1120px,94vw);margin:28px auto 60px}.event-detail-card{overflow:hidden;padding:0!important;background:linear-gradient(145deg,#0b1122f5,#050811fa)!important}.event-detail-head{padding:26px}.event-detail-head h1{margin:7px 0 10px;font:900 clamp(28px,5vw,54px) Orbitron;letter-spacing:-.04em}.event-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.event-chip{padding:7px 9px;border:1px solid #78efff2b;border-radius:99px;color:#aebbd0;font:800 8px Inter}.event-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.event-edit{display:none}.event-owner .event-edit{display:inline-flex}.event-form-edit{display:grid;gap:12px;padding:22px;border-top:1px solid #ffffff0d}.event-form-edit[hidden]{display:none}.event-form-edit label{display:grid;gap:6px;font:800 8px Orbitron;color:#bfcde0}.event-form-edit input,.event-form-edit textarea,.event-form-edit select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ffffff18;border-radius:9px;background:#02050c;color:#fff}.event-form-edit textarea{min-height:100px}.event-edit-actions{display:flex;gap:8px;flex-wrap:wrap}.event-danger{border-color:#ff5f8738!important;color:#ff8ca7!important}.event-rsvp{padding:22px;border-top:1px solid #ffffff0d}.rsvp-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.rsvp-btn.active{border-color:#78efff88;box-shadow:0 0 22px #78efff22}.rsvp-count{font:800 10px Inter;color:#aebbd0}.event-hero{position:relative;min-height:320px;background:#02050c;overflow:hidden}.event-cover{width:100%;height:320px;object-fit:cover;display:block}.event-cover-fallback{display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#17284d,#050811 55%,#020308);font:900 11px Orbitron;letter-spacing:.18em;color:#78efff}.event-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,#0002 0%,#0004 35%,#03060df5 100%)}.event-hero-copy{position:absolute;left:26px;right:26px;bottom:24px}.event-hero-copy h1{margin:7px 0 12px;font:900 clamp(30px,6vw,62px) Orbitron;letter-spacing:-.045em}.event-status{display:inline-flex;padding:7px 11px;border-radius:999px;font:900 9px Inter;letter-spacing:.12em;border:1px solid #ffffff18}.event-status.live{color:#ff829e;border-color:#ff5f8766;background:#ff315015}.event-status.upcoming{color:#78efff;border-color:#78efff55}.event-status.ended{color:#9aa7ba}.event-description{font-size:16px;line-height:1.7}.event-countdown{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0;padding:16px;border:1px solid #ffffff12;border-radius:12px;background:#ffffff04}.event-countdown strong{font:900 10px Orbitron;color:#78efff}.event-countdown span{font:700 16px Inter;color:#fff}.event-host,.event-attendees{padding:24px;border-top:1px solid #ffffff0d}.host-row{display:flex;gap:14px;align-items:center;margin-top:14px}.host-row>div{flex:1;display:grid;gap:5px}.host-row strong{font:900 14px Inter}.host-row small,.attendee-person small{color:#8e9cb2}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;display:block;border:1px solid #78efff33}.avatar-fallback{display:grid;place-items:center;background:#101a2c;color:#78efff;font:900 11px Orbitron}.attendee-head{display:flex;justify-content:space-between;align-items:end;gap:12px}.attendee-head h2{margin:6px 0 0}.attendee-stack{display:flex;align-items:center;padding:18px 0 8px}.attendee{margin-right:-8px}.attendee .avatar{width:42px;height:42px;border:2px solid #050811}.attendee.more{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#111a2a;border:2px solid #050811;font:800 10px Inter}.attendee-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}.attendee-person{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #ffffff0d;border-radius:10px;background:#ffffff03}.attendee-person .avatar{width:36px;height:36px}.attendee-person span{display:grid;gap:3px}.attendee-person b{font-size:12px;color:#fff}.attendee-person small{font-size:10px}@media(max-width:640px){.event-cover,.event-hero{min-height:230px;height:230px}.event-cover{height:230px}.event-hero-copy{left:18px;right:18px;bottom:18px}.event-detail-head{padding:20px}.host-row{align-items:flex-start;flex-wrap:wrap}.host-row .cs-btn{width:100%}.attendee-list{grid-template-columns:1fr}}
</style></head><body data-page="event"><main class="cs-page-shell"><section id="event-detail"><div class="cs-card">Loading event…</div></section></main>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
  const waitForReady=()=>new Promise(resolve=>{
    if(window.CrowSpaceUniversal?.db) return resolve();
    let done=false; const finish=()=>{if(done)return;done=true;resolve()};
    document.addEventListener('crowspace-universal-ready',finish,{once:true});
    setTimeout(finish,2500);
  });
  await waitForReady();
  const db=window.CrowSpaceUniversal?.db||window.CrowSpaceAuth?.client;
  const me=window.CrowSpaceUniversal?.user||window.CrowSpaceAuth?.user||null;
  const id=new URLSearchParams(location.search).get('id');
  const root=document.getElementById('event-detail');
  const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const fmtDate=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString([], {dateStyle:'full',timeStyle:'short'});};
  const fmtShort=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});};
  const initials=s=>String(s||'CR').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()||'CR';
  const avatar=(p,size='avatar')=>p?.avatar_url?'<img class="'+size+'" src="'+esc(p.avatar_url)+'" alt="'+esc(p.display_name||p.username||'CrowSpace Member')+'">':'<span class="'+size+' avatar-fallback">'+esc(initials(p?.display_name||p?.username))+'</span>';
  if(!db||!id){root.innerHTML='<div class="cs-card"><h2>Event unavailable</h2><p class="cs-muted">A valid CrowSpace event ID is required.</p></div>';return}
  try{
    const r=await db.from('crowspace_events').select('*').eq('id',id).maybeSingle();
    if(r.error)throw r.error;
    const e=r.data;
    if(!e){root.innerHTML='<div class="cs-card"><h2>Event not found</h2></div>';return}
    const owner=me&&String(e.created_by)===String(me.id);
    const hostQ=await db.from('crowspace_profiles').select('user_id,username,display_name,avatar_url,bio').eq('user_id',e.created_by).maybeSingle();
    const host=hostQ.data||null;
    const rsvpQ=await db.from('crowspace_event_rsvps').select('user_id,status,created_at').eq('event_id',id).order('created_at',{ascending:true});
    if(rsvpQ.error)throw rsvpQ.error;
    const rsvps=rsvpQ.data||[];
    const ids=[...new Set(rsvps.map(x=>x.user_id).filter(Boolean))];
    let attendeeProfiles=[];
    if(ids.length){const pq=await db.from('crowspace_profiles').select('user_id,username,display_name,avatar_url,bio').in('user_id',ids);attendeeProfiles=pq.data||[];}
    const pmap=Object.fromEntries(attendeeProfiles.map(p=>[p.user_id,p]));
    const going=rsvps.filter(x=>x.status==='going'), interested=rsvps.filter(x=>x.status==='interested');
    const opts=['community','meetup','creator','crowrules','dreamscapes','memorials','other'].map(v=>'<option value="'+v+'" '+(e.event_type===v?'selected':'')+'>'+v.toUpperCase()+'</option>').join('');
    const startAt=new Date(e.starts_at), now=Date.now(), ended=e.ends_at?new Date(e.ends_at).getTime()<now:startAt.getTime()<now&&!e.is_live;
    const status=e.is_live?'LIVE NOW':ended?'ENDED':'UPCOMING';
    const statusClass=e.is_live?'live':ended?'ended':'upcoming';
    const shareUrl=location.href;
    root.innerHTML='<article class="cs-card event-detail-card '+(owner?'event-owner':'')+'">'+
      '<div class="event-hero">'+(e.image_url?'<img class="event-cover" src="'+esc(e.image_url)+'" alt="">':'<div class="event-cover event-cover-fallback"><span>CROWSPACE EVENT</span></div>')+
      '<div class="event-hero-overlay"></div><div class="event-hero-copy"><div class="cs-eyebrow">CROWSPACE // '+esc(e.event_type||'EVENT')+'</div><h1>'+esc(e.title||'CrowSpace Event')+'</h1><div class="event-status '+statusClass+'">'+esc(status)+'</div></div></div>'+
      '<div class="event-detail-head"><p class="event-description">'+esc(e.description||'Community event')+'</p>'+
      '<div class="event-meta"><span class="event-chip">📅 '+esc(fmtDate(e.starts_at))+'</span>'+(e.location?'<span class="event-chip">📍 '+esc(e.location)+'</span>':'')+(e.is_online?'<span class="event-chip">ONLINE</span>':'')+'</div>'+
      '<div id="event-countdown" class="event-countdown" data-start="'+esc(e.starts_at)+'"></div>'+
      '<div class="event-actions"><a class="cs-btn" href="events.html">← ALL EVENTS</a><button class="cs-btn" id="share-event" type="button">↗ SHARE EVENT</button>'+(e.link_url?'<a class="cs-btn" target="_blank" rel="noopener" href="'+esc(e.link_url)+'">EVENT LINK →</a>':'')+(owner?'<button class="cs-btn event-edit" id="edit-event" type="button">EDIT EVENT</button>':'')+'</div><p id="share-status" class="cs-muted"></p></div>'+
      '<section class="event-rsvp"><div class="cs-eyebrow">JOIN THIS EVENT</div><div class="rsvp-row"><button type="button" class="cs-btn rsvp-btn" data-rsvp="going">✓ GOING</button><button type="button" class="cs-btn rsvp-btn" data-rsvp="interested">★ INTERESTED</button><button type="button" class="cs-btn rsvp-btn" data-rsvp="not_going">NOT GOING</button><span id="rsvp-count" class="rsvp-count"></span></div><p id="rsvp-status" class="cs-muted"></p></section>'+
      '<section class="event-host"><div class="cs-eyebrow">HOST</div><div class="host-row">'+avatar(host)+'<div><strong>'+esc(host?.display_name||host?.username||'CrowSpace Member')+'</strong><small>'+esc(host?.bio||'CrowSpace event host')+'</small></div><a class="cs-btn" href="profile.html?user='+encodeURIComponent(e.created_by)+'">VIEW PROFILE</a></div></section>'+
      '<section class="event-attendees"><div class="attendee-head"><div><div class="cs-eyebrow">ATTENDEES</div><h2>'+going.length+' Going</h2></div><span class="rsvp-count">'+interested.length+' interested</span></div><div class="attendee-stack">'+going.slice(0,12).map(x=>{const p=pmap[x.user_id];return '<a class="attendee" href="profile.html?user='+encodeURIComponent(x.user_id)+'" title="'+esc(p?.display_name||p?.username||'CrowSpace Member')+'">'+avatar(p)+'</a>'}).join('')+(going.length>12?'<span class="attendee more">+'+(going.length-12)+'</span>':'')+'</div><div class="attendee-list">'+going.map(x=>{const p=pmap[x.user_id];return '<a class="attendee-person" href="profile.html?user='+encodeURIComponent(x.user_id)+'">'+avatar(p)+'<span><b>'+esc(p?.display_name||p?.username||'CrowSpace Member')+'</b><small>Going</small></span></a>'}).join('')+'</div></section>'+
      '<form id="edit-form" class="event-form-edit" hidden><label>EVENT TITLE<input name="title" maxlength="160" required value="'+esc(e.title||'')+'"></label><label>EVENT TYPE<select name="event_type">'+opts+'</select></label><label>DESCRIPTION<textarea name="description" maxlength="5000">'+esc(e.description||'')+'</textarea></label><label>START DATE & TIME<input name="starts_at" type="datetime-local" required value="'+(e.starts_at?new Date(e.starts_at).toISOString().slice(0,16):'')+'"></label><label>END DATE & TIME (OPTIONAL)<input name="ends_at" type="datetime-local" value="'+(e.ends_at?new Date(e.ends_at).toISOString().slice(0,16):'')+'"><small class="cs-muted">Leave blank for an open-ended event. End must be at or after start.</small></label><label>YOUTUBE URL<input name="youtube_url" type="url" value="'+esc(e.youtube_url||'')+'"></label><label><input name="is_live" type="checkbox" '+(e.is_live?'checked':'')+'> LIVE EVENT — ENABLE LIVE CHAT</label><div class="event-edit-actions"><button class="cs-btn primary" type="submit">SAVE CHANGES</button><button class="cs-btn" id="cancel-edit" type="button">CANCEL</button><button class="cs-btn event-danger" id="delete-event" type="button">DELETE EVENT</button></div><p id="edit-status" class="cs-muted"></p></form>'+
      '<div id="event-media" data-event-card data-youtube-url="'+esc(e.youtube_url||e.youtube_video_id||'')+'" data-event-title="'+esc(e.title||'')+'" data-live="'+(e.is_live===true?'true':'false')+'"></div></article>';
    window.CrowSpaceYouTubeEvents?.scan();\n    (async()=>{try{if(me){const q=await db.from('crowspace_event_notifications').select('id,notification_type,read_at').eq('user_id',me.id).eq('event_id',id).is('read_at',null);const n=q.data||[];if(n.length){const h=document.querySelector('.event-hero')||document.querySelector('article');if(h){const x=document.createElement('div');x.className='event-notification-indicator';x.innerHTML='<i class="dot"></i>'+n.length+' UNREAD EVENT NOTIFICATION'+(n.length===1?'':'S')+' · '+n.map(v=>({rsvp_confirmation:'RSVP',reminder:'REMINDER',event_start:'STARTING SOON',rescheduled:'RESCHEDULED',cancelled:'CANCELLED',attendee_update:'ORGANIZER'}[v.notification_type]||'ALERT')).join(' · ');h.prepend(x)}}}}catch(x){}})();
    const countdown=document.getElementById('event-countdown');
    const tick=()=>{const t=new Date(e.starts_at).getTime()-Date.now();if(e.is_live){countdown.innerHTML='<strong>LIVE NOW</strong><span>Join the broadcast and conversation below.</span>';return}if(t<=0){countdown.innerHTML='<strong>'+esc(ended?'EVENT ENDED':'STARTING NOW')+'</strong>';return}const days=Math.floor(t/86400000),hrs=Math.floor(t%86400000/3600000),mins=Math.floor(t%3600000/60000),secs=Math.floor(t%60000/1000);countdown.innerHTML='<strong>STARTS IN</strong><span>'+days+'d '+hrs+'h '+mins+'m '+secs+'s</span>';};
    tick();const timer=setInterval(tick,1000);
    document.getElementById('share-event').onclick=async()=>{const msg=document.getElementById('share-status');try{if(navigator.share)await navigator.share({title:e.title,text:'Join this CrowSpace event',url:shareUrl});else{await navigator.clipboard.writeText(shareUrl);msg.textContent='Event link copied to your clipboard.'}}catch(x){if(x?.name!=='AbortError')msg.textContent='Copy this page URL to share the event.'}};
    const rsvpStatus=document.getElementById('rsvp-status'),rsvpCount=document.getElementById('rsvp-count'),rsvpButtons=[...document.querySelectorAll('[data-rsvp]')];
    const refreshRsvp=async()=>{const q=await db.from('crowspace_event_rsvps').select('status,user_id').eq('event_id',id);if(q.error){rsvpStatus.textContent=q.error.message;return}const mine=me?q.data.find(x=>String(x.user_id)===String(me.id)):null;rsvpButtons.forEach(b=>b.classList.toggle('active',mine?.status===b.dataset.rsvp));rsvpCount.textContent=q.data.filter(x=>x.status==='going').length+' going · '+q.data.filter(x=>x.status==='interested').length+' interested';};
    rsvpButtons.forEach(b=>b.onclick=async()=>{if(!me){location.href='login.html';return}const status=b.dataset.rsvp,existing=await db.from('crowspace_event_rsvps').select('id,status').eq('event_id',id).eq('user_id',me.id).maybeSingle();if(existing.error){rsvpStatus.textContent=existing.error.message;return}let q;if(existing.data)q=status===existing.data.status?await db.from('crowspace_event_rsvps').delete().eq('id',existing.data.id).eq('user_id',me.id):await db.from('crowspace_event_rsvps').update({status,updated_at:new Date().toISOString()}).eq('id',existing.data.id).eq('user_id',me.id);else q=await db.from('crowspace_event_rsvps').insert({event_id:id,user_id:me.id,status});if(q?.error)rsvpStatus.textContent=q.error.message;else{rsvpStatus.textContent='Your event response was updated.';await refreshRsvp()}});
    await refreshRsvp();
    if(!owner)return;
    const form=document.getElementById('edit-form'),openEditor=()=>{form.hidden=false;location.hash='edit'};document.getElementById('edit-event').onclick=openEditor;if(location.hash==='#edit')openEditor();document.getElementById('cancel-edit').onclick=()=>{form.hidden=true;history.replaceState(null,'',location.pathname+location.search)};
    form.onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(form),url=String(fd.get('youtube_url')||'').trim(),vid=window.CrowSpaceYouTubeEvents?.videoId(url)||null;if(url&&!vid){document.getElementById('edit-status').textContent='Enter a valid YouTube URL.';return}const startValue=String(fd.get('starts_at')||''),endValue=String(fd.get('ends_at')||''),startDate=new Date(startValue),endDate=endValue?new Date(endValue):null;if(!startValue||Number.isNaN(startDate.getTime())){document.getElementById('edit-status').textContent='Choose a valid start date and time.';return}if(endDate&&Number.isNaN(endDate.getTime())){document.getElementById('edit-status').textContent='Choose a valid end date and time.';return}if(endDate&&endDate.getTime()<startDate.getTime()){document.getElementById('edit-status').textContent='End date/time cannot be before the start date/time.';return}const payload={title:String(fd.get('title')).trim(),event_type:fd.get('event_type'),description:String(fd.get('description')||'').trim()||null,starts_at:startDate.toISOString(),ends_at:endDate?endDate.toISOString():null,youtube_url:url||null,youtube_video_id:vid,is_live:fd.get('is_live')==='on',live_chat_enabled:fd.get('is_live')==='on'&&!!vid};const x=await db.from('crowspace_events').update(payload).eq('id',id).eq('created_by',me.id);if(x.error){document.getElementById('edit-status').textContent=x.error.message;return}location.reload()};
    document.getElementById('delete-event').onclick=async()=>{if(!confirm('Delete this event? This cannot be undone.'))return;const x=await db.from('crowspace_events').delete().eq('id',id).eq('created_by',me.id);if(x.error){document.getElementById('edit-status').textContent=x.error.message;return}location.href='events.html'};
  }catch(err){root.innerHTML='<div class="cs-card"><h2>Event could not be loaded</h2><p class="cs-muted">'+esc(err.message||err)+'</p></div>'}
});
</script></body></html>

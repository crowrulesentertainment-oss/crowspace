<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CrowSpace event"><title>Event — CrowSpace</title>
<link rel="stylesheet" href="crowspace-rebuild.css"><link rel="stylesheet" href="crowspace-universal.css">
<script src="crowspace-auth.js"></script><script src="crowspace-universal.js" defer></script><script src="crowspace-pages.js" defer></script>
<script src="js/crowspace-youtube-events.js" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
<style>
.event-detail-shell{width:min(1120px,94vw);margin:28px auto 60px}.event-detail-card{overflow:hidden;padding:0!important;background:linear-gradient(145deg,#0b1122f5,#050811fa)!important}.event-detail-head{padding:26px}.event-detail-head h1{margin:7px 0 10px;font:900 clamp(28px,5vw,54px) Orbitron;letter-spacing:-.04em}.event-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.event-chip{padding:7px 9px;border:1px solid #78efff2b;border-radius:99px;color:#aebbd0;font:800 8px Inter}.event-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.event-edit{display:none}.event-owner .event-edit{display:inline-flex}.event-form-edit{display:grid;gap:12px;padding:22px;border-top:1px solid #ffffff0d}.event-form-edit[hidden]{display:none}.event-form-edit label{display:grid;gap:6px;font:800 8px Orbitron;color:#bfcde0}.event-form-edit input,.event-form-edit textarea,.event-form-edit select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ffffff18;border-radius:9px;background:#02050c;color:#fff}.event-form-edit textarea{min-height:100px}.event-edit-actions{display:flex;gap:8px;flex-wrap:wrap}.event-danger{border-color:#ff5f8738!important;color:#ff8ca7!important}.event-rsvp{padding:22px;border-top:1px solid #ffffff0d}.rsvp-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.rsvp-btn.active{border-color:#78efff88;box-shadow:0 0 22px #78efff22}.rsvp-count{font:800 10px Inter;color:#aebbd0}
</style></head><body data-page="event"><main class="cs-page-shell"><section id="event-detail"><div class="cs-card">Loading event…</div></section></main>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
 await new Promise(r=>{if(window.CrowSpaceUniversal?.db)r();else document.addEventListener('crowspace-universal-ready',r,{once:true})}); const db=window.CrowSpaceUniversal?.db||window.CrowSpaceAuth?.client; const me=window.CrowSpaceUniversal?.user||window.CrowSpaceAuth?.user||null; const id=new URLSearchParams(location.search).get('id'); const root=document.getElementById('event-detail');
 const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
 if(!db||!id){root.innerHTML='<div class="cs-card"><h2>Event unavailable</h2><p class="cs-muted">A valid CrowSpace event ID is required.</p></div>';return}
 try{
  const r=await db.from('crowspace_events').select('*').eq('id',id).maybeSingle();if(r.error)throw r.error;const e=r.data;if(!e){root.innerHTML='<div class="cs-card"><h2>Event not found</h2></div>';return}
  const owner=me&&e.created_by&&String(e.created_by)===String(me.id);
  const opts=['community','meetup','creator','crowrules','dreamscapes','memorials','other'].map(v=>'<option value="'+v+'" '+(e.event_type===v?'selected':'')+'>'+v.toUpperCase()+'</option>').join('');
  root.innerHTML='<article class="cs-card event-detail-card '+(owner?'event-owner':'')+'"><div class="event-detail-head"><div class="cs-eyebrow">CROWSPACE // '+esc(e.event_type||'EVENT')+'</div><h1>'+esc(e.title||e.name||'CrowSpace Event')+'</h1><p class="cs-muted">'+esc(e.description||e.body||'Community event')+'</p><div class="event-meta"><span class="event-chip">'+esc(e.starts_at||e.event_at||e.created_at||'')+'</span><span class="event-chip">'+(e.is_live?'● LIVE':'EVENT')+'</span></div><div class="event-actions"><a class="cs-btn" href="events.html">← ALL EVENTS</a>'+(owner?'<button class="cs-btn event-edit" id="edit-event" type="button">EDIT EVENT</button>':'')+'</div></div><form id="edit-form" class="event-form-edit" hidden><label>EVENT TITLE<input name="title" maxlength="160" required value="'+esc(e.title||e.name||'')+'"></label><label>EVENT TYPE<select name="event_type">'+opts+'</select></label><label>DESCRIPTION<textarea name="description" maxlength="5000">'+esc(e.description||e.body||'')+'</textarea></label><label>START DATE & TIME<input name="starts_at" type="datetime-local" required value="'+(e.starts_at?new Date(e.starts_at).toISOString().slice(0,16):'')+'"></label><label>YOUTUBE URL<input name="youtube_url" type="url" value="'+esc(e.youtube_url||'')+'"></label><label><input name="is_live" type="checkbox" '+(e.is_live?'checked':'')+'> LIVE EVENT — ENABLE LIVE CHAT</label><div class="event-edit-actions"><button class="cs-btn primary" type="submit">SAVE CHANGES</button><button class="cs-btn" id="cancel-edit" type="button">CANCEL</button><button class="cs-btn event-danger" id="delete-event" type="button">DELETE EVENT</button></div><p id="edit-status" class="cs-muted"></p></form><section class="event-rsvp"><div class="cs-eyebrow">JOIN THIS EVENT</div><div class="rsvp-row"><button type="button" class="cs-btn rsvp-btn" data-rsvp="going">✓ GOING</button><button type="button" class="cs-btn rsvp-btn" data-rsvp="interested">★ INTERESTED</button><button type="button" class="cs-btn rsvp-btn" data-rsvp="not_going">NOT GOING</button><span id="rsvp-count" class="rsvp-count"></span></div><p id="rsvp-status" class="cs-muted"></p></section><div id="event-media" data-event-card data-youtube-url="'+esc(e.youtube_url||e.youtube||e.video_url||e.youtube_video_id||'')+'" data-event-title="'+esc(e.title||'')+'" data-live="'+(e.is_live===true?'true':'false')+'"></div></article>';
  window.CrowSpaceYouTubeEvents?.scan();
  const rsvpStatus=document.getElementById('rsvp-status'),rsvpCount=document.getElementById('rsvp-count'),rsvpButtons=[...document.querySelectorAll('[data-rsvp]')];
  const refreshRsvp=async()=>{const q=await db.from('crowspace_event_rsvps').select('status,user_id').eq('event_id',id);if(q.error){rsvpStatus.textContent=q.error.message;return}const mine=me?q.data.find(x=>String(x.user_id)===String(me.id)):null;rsvpButtons.forEach(b=>b.classList.toggle('active',mine?.status===b.dataset.rsvp));const going=q.data.filter(x=>x.status==='going').length,interested=q.data.filter(x=>x.status==='interested').length;rsvpCount.textContent=going+' going · '+interested+' interested';};
  rsvpButtons.forEach(b=>b.onclick=async()=>{if(!me){location.href='login.html';return}const status=b.dataset.rsvp;const existing=await db.from('crowspace_event_rsvps').select('id,status').eq('event_id',id).eq('user_id',me.id).maybeSingle();let q;if(existing.data){q=status===existing.data.status?await db.from('crowspace_event_rsvps').delete().eq('id',existing.data.id).eq('user_id',me.id):await db.from('crowspace_event_rsvps').update({status,updated_at:new Date().toISOString()}).eq('id',existing.data.id).eq('user_id',me.id)}else q=await db.from('crowspace_event_rsvps').insert({event_id:id,user_id:me.id,status});if(q?.error)rsvpStatus.textContent=q.error.message;else{rsvpStatus.textContent='Your event response was updated.';await refreshRsvp();}});
  await refreshRsvp();if(!owner)return;
  const form=document.getElementById('edit-form');const openEditor=()=>{form.hidden=false;location.hash='edit'};document.getElementById('edit-event').onclick=openEditor;if(location.hash==='#edit')openEditor();document.getElementById('cancel-edit').onclick=()=>{form.hidden=true};
  form.onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(form),url=String(fd.get('youtube_url')||'').trim(),vid=window.CrowSpaceYouTubeEvents?.videoId(url)||null;if(url&&!vid){document.getElementById('edit-status').textContent='Enter a valid YouTube URL.';return}const payload={title:String(fd.get('title')).trim(),event_type:fd.get('event_type'),description:String(fd.get('description')||'').trim()||null,starts_at:new Date(fd.get('starts_at')).toISOString(),youtube_url:url||null,youtube_video_id:vid,is_live:fd.get('is_live')==='on',live_chat_enabled:fd.get('is_live')==='on'&&!!vid};const x=await db.from('crowspace_events').update(payload).eq('id',id).eq('created_by',me.id);if(x.error){document.getElementById('edit-status').textContent=x.error.message;return}location.reload()};
  document.getElementById('delete-event').onclick=async()=>{if(!confirm('Delete this event? This cannot be undone.'))return;const x=await db.from('crowspace_events').delete().eq('id',id).eq('created_by',me.id);if(x.error){document.getElementById('edit-status').textContent=x.error.message;return}location.href='events.html'};
 }catch(err){root.innerHTML='<div class="cs-card"><h2>Event could not be loaded</h2><p class="cs-muted">'+esc(err.message||err)+'</p></div>'}
});
</script></script></body></html>

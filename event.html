<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CrowSpace event"><title>Event — CrowSpace</title>
<link rel="stylesheet" href="crowspace-rebuild.css"><link rel="stylesheet" href="crowspace-universal.css">
<script src="crowspace-auth.js"></script><script src="crowspace-universal.js" defer></script><script src="crowspace-pages.js" defer></script>
<script src="js/crowspace-youtube-events.js" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
<style>
.event-detail-shell{width:min(1120px,94vw);margin:28px auto 60px}.event-detail-card{overflow:hidden;padding:0!important;background:linear-gradient(145deg,#0b1122f5,#050811fa)!important}.event-detail-head{padding:26px}.event-detail-head h1{margin:7px 0 10px;font:900 clamp(28px,5vw,54px) Orbitron;letter-spacing:-.04em}.event-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.event-chip{padding:7px 9px;border:1px solid #78efff2b;border-radius:99px;color:#aebbd0;font:800 8px Inter}.event-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.event-edit{display:none}.event-owner .event-edit{display:inline-flex}.event-form-edit{display:grid;gap:12px;padding:22px;border-top:1px solid #ffffff0d}.event-form-edit[hidden]{display:none}.event-form-edit label{display:grid;gap:6px;font:800 8px Orbitron;color:#bfcde0}.event-form-edit input,.event-form-edit textarea,.event-form-edit select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ffffff18;border-radius:9px;background:#02050c;color:#fff}.event-form-edit textarea{min-height:100px}.event-edit-actions{display:flex;gap:8px;flex-wrap:wrap}.event-danger{border-color:#ff5f8738!important;color:#ff8ca7!important}
</style></head><body data-page="event"><main class="cs-page-shell"><section id="event-detail"><div class="cs-card">Loading event…</div></section></main>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
 const db=window.CrowSpaceUniversal?.db||window.CrowSpaceAuth?.client; const id=new URLSearchParams(location.search).get('id');
 const root=document.getElementById('event-detail'); if(!db||!id){root.innerHTML='<div class="cs-card"><h2>Event unavailable</h2><p class="cs-muted">A valid CrowSpace event ID is required.</p></div>';return}
 try{
  const r=await db.from('crowspace_events').select('*').eq('id',id).maybeSingle(); if(r.error)throw r.error;
  const e=r.data;if(!e){root.innerHTML='<div class="cs-card"><h2>Event not found</h2></div>';return}
  root.innerHTML='<article class="cs-card event-card" data-event-card data-youtube-url="'+String(e.youtube_url||e.youtube||e.video_url||e.youtube_video_id||e.video_id||'').replace(/"/g,'&quot;')+'" data-event-title="'+String(e.title||e.name||'CrowSpace Event').replace(/"/g,'&quot;')+'" data-live="'+(e.is_live===true?'true':'false')+'"><div class="cs-eyebrow">CROWSPACE // EVENT</div><h1>'+String(e.title||e.name||'CrowSpace Event').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))+'</h1><p class="cs-muted">'+String(e.description||e.body||'Community event').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))+'</p><small class="cs-muted">'+String(e.starts_at||e.event_at||e.created_at||'')+'</small></article>';
  window.CrowSpaceYouTubeEvents?.scan();
 }catch(err){root.innerHTML='<div class="cs-card"><h2>Event could not be loaded</h2><p class="cs-muted">'+String(err.message||err).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))+'</p></div>'}
});
</script></body></html>

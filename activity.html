<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity — CrowSpace</title><link rel="stylesheet" href="crowspace-rebuild.css"><link rel="stylesheet" href="crowspace-universal.css"><script src="crowspace-auth.js"></script><script src="crowspace-universal.js" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=1" defer></script></head><body><main class="cs-page-shell"><section class="cs-page-hero"><div class="cs-eyebrow">CROWSPACE // V26</div><h1>Universal Activity</h1><p>A single activity surface for social relationships, content movement, community events and creator signals across CrowSpace.</p></section><section class="cs-grid"><div class="cs-card"><h2>Live Social Signals</h2><div id="social" class="cs-list"><div class="cs-muted">Loading activity…</div></div></div><div class="cs-card"><h2>Network Content</h2><div id="content" class="cs-list"><div class="cs-muted">Loading content…</div></div></div><div class="cs-card"><h2>Creator Activity</h2><div id="creators" class="cs-list"><div class="cs-muted">Loading creators…</div></div></div></section></main><script>
(function(){'use strict';const d=()=>window.CrowSpaceUniversal?.db,u=()=>window.CrowSpaceUniversal?.user;const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function q(t,s){try{const r=await d().from(t).select(s).limit(80);return r.data||[]}catch(e){return[]}}function row(icon,title,sub,href){return '<a class="cs-row" href="'+(href||'#')+'"><span class="cs-avatar">'+icon+'</span><span class="cs-row-main"><b>'+esc(title)+'</b><small>'+esc(sub)+'</small></span></a>'}async function load(){const me=u(),[p,f,fr,posts,caws]=await Promise.all([q('crowspace_profiles','user_id,display_name,username'),q('crowspace_follows','follower_id,followed_user_id,created_at'),q('crowspace_friendships','requester_id,addressee_id,status,updated_at'),q('crowspace_posts','id,user_id,title,body,created_at'),q('crowspace_caws','id,user_id,title,caption,created_at')]);const names=new Map(p.map(x=>[x.user_id,x.display_name||x.username||'Member']));const mine=f.filter(x=>x.follower_id===me?.id||x.followed_user_id===me?.id).slice(0,8);const friends=fr.filter(x=>x.status==='accepted'&&(x.requester_id===me?.id||x.addressee_id===me?.id)).slice(0,8);document.getElementById('social').innerHTML=mine.map(x=>row('◎',x.follower_id===me?.id?'You followed '+(names.get(x.followed_user_id)||'a member'):(names.get(x.follower_id)||'A member')+' followed you','Follower activity')).concat(friends.map(x=>row('👥','Friend connection with '+(names.get(x.requester_id===me?.id?x.addressee_id:x.requester_id)||'a member'),'Accepted friendship'))).join('')||'<div class="cs-muted">No recent relationship activity.</div>';const network=new Set(mine.flatMap(x=>[x.follower_id,x.followed_user_id]).concat(friends.flatMap(x=>[x.requester_id,x.addressee_id])));const cp=posts.filter(x=>network.has(x.user_id)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,8);const cc=caws.filter(x=>network.has(x.user_id)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,8);document.getElementById('content').innerHTML=cp.map(x=>row('▣',x.title||names.get(x.user_id)||'Community post',(x.body||'').slice(0,100),'feed.html#post-'+x.id)).concat(cc.map(x=>row('▶',x.title||names.get(x.user_id)||'Caw',(x.caption||'New Caw').slice(0,100),'caws.html#caw-'+x.id))).join('')||'<div class="cs-muted">Your network has no recent content yet.</div>';const creatorIds=new Set(posts.concat(caws).map(x=>x.user_id));document.getElementById('creators').innerHTML=[...creatorIds].filter(id=>id!==me?.id).slice(0,8).map(id=>row('★',names.get(id)||'Creator','Active across Posts and Caws','profile.html?user='+id)).join('')||'<div class="cs-muted">No creators discovered yet.</div>'}document.addEventListener('crowspace-universal-ready',load);setTimeout(load,900)})();
</script></body></html>

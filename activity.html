<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Activity</title>
<style>:root{--a:#20e6ff}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:900px;margin:auto;padding:18px}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:20px;margin-bottom:15px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:#9da5bd}.btn,a{display:inline-block;padding:9px 12px;border:1px solid #343c56;border-radius:10px;background:#171a29;color:#fff;text-decoration:none}.activity{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid #25293a}.activity:last-child{border-bottom:0}.avatar{width:44px;height:44px;border-radius:50%;background:#252a40;display:grid;place-items:center;font-weight:bold;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.icon{font-size:25px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;border:1px solid #405078;padding:14px 18px;border-radius:12px;box-shadow:0 10px 30px #0008}@media(max-width:600px){main{padding:10px}.top{align-items:flex-start;flex-direction:column}}</style></head>
<body><main><div class="card top"><div><h1 style="margin:0">⚡ CrowSpace Activity</h1><p class="muted">Your personal timeline across the CrowSpace community.</p></div><a href="./">← CrowSpace</a></div><div class="card"><div id="list">Loading...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini=s=>(s||"Member").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
const icon={post:"📝",media_like:"❤️",media_comment:"💬",follow:"👤",friend:"🤝"};
async function load(){me=(await db.auth.getSession()).data.session?.user;if(!me){list.innerHTML='<p class="muted">Sign in to view your activity.</p>';return}
const r=await db.from("crowspace_activity").select("*").eq("user_id",me.id).order("created_at",{ascending:false}).limit(100);if(r.error){list.textContent="Activity is unavailable.";return}
const rows=r.data||[];const ids=[...new Set(rows.map(x=>x.actor_id).filter(Boolean))];let profiles={};if(ids.length){const p=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids);(p.data||[]).forEach(x=>profiles[x.user_id]=x)}
list.innerHTML=rows.map(x=>{const p=profiles[x.actor_id]||{};const who=x.actor_id===me.id?"You":(p.display_name||"A CrowSpace member");const link=x.actor_id===me.id?"./profile.html":"./profile.html?u="+encodeURIComponent(p.username||"");return '<div class="activity"><div class="avatar">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'">':ini(who))+'</div><div><div><a href="'+link+'"><b>'+esc(who)+'</b></a> <span class="icon">'+(icon[x.type]||"⚡")+'</span></div><p style="margin:7px 0">'+esc(x.message)+'</p><small class="muted">'+new Date(x.created_at).toLocaleString()+'</small></div></div>'}).join("")||'<p class="muted">No activity yet. Start posting, following members, making friends, or sharing media.</p>'}
function live(){db.channel("crowspace-activity-live").on("postgres_changes",{event:"INSERT",schema:"public",table:"crowspace_activity",filter:"user_id=eq."+me.id},()=>{load();const t=document.createElement("div");t.className="toast";t.textContent="⚡ New activity";document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}).subscribe()}
load().then(live);
</script><script src="./js/crowspace-holiday-themes.js"></script>
</body></html>

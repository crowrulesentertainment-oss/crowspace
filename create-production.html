<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create CrowRules Production | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"><a href="login.html">Sign In</a></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">CROWRULES PRODUCTIONS</p><h1>Start a Production</h1><p class="muted">Connect a Dreamscapes story to a Creator Project and move it through the production lifecycle.</p></div></div><form id="form" class="card" style="max-width:760px"><label>Dreamscapes Project<select id="dream"><option value="">None</option></select></label><label>Creator Project<select id="creator"><option value="">None</option></select></label><label>Production Title<input id="title" required maxlength="160"></label><button class="btn" type="submit">Create Production</button><p id="msg" class="muted"></p></form></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await CS.user();if(!u){location.href='login.html';return}await CS.refreshHeader();const [d,p]=await Promise.all([crowSupabase.from('ds_projects').select('id,title').eq('owner_id',u.id).order('updated_at',{ascending:false}),crowSupabase.from('crowspace_creator_projects').select('id,title').eq('owner_id',u.id).order('updated_at',{ascending:false})]);dream.innerHTML='<option value="">None</option>'+(d.data||[]).map(x=>'<option value="'+x.id+'">'+CS.escape(x.title)+'</option>').join('');creator.innerHTML='<option value="">None</option>'+(p.data||[]).map(x=>'<option value="'+x.id+'">'+CS.escape(x.title)+'</option>').join('');form.onsubmit=async e=>{e.preventDefault();msg.textContent='Creating…';const r=await crowSupabase.rpc('crowrules_create_production',{p_dreamscapes_project_id:dream.value||null,p_creator_project_id:creator.value||null,p_title:title.value});if(r.error){msg.textContent=r.error.message;return}location.href='production.html?id='+r.data}});</script><script src="js/global-nav.js"></script></body></html>

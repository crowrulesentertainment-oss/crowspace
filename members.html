<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members · CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-page="members"><header class="topbar"><a class="brand" href="index.html">CROW<span>SPACE</span></a><nav id="nav" class="nav"></nav><a class="membership" href="membership.html">Universal Membership</a></header><main class="shell"><section class="card"><div class="eyebrow">Directory</div><h1 class="title">Members</h1><input id="memberSearch" class="input" placeholder="Search members"><button class="btn primary" style="margin-top:10px" onclick="searchMembers()">Search</button><div id="memberResults" class="list" style="margin-top:15px"></div></section><script>async function searchMembers(){const q=document.querySelector('#memberSearch').value.trim();const r=await cs.client.from('crowspace_profiles').select('user_id,username,display_name,bio,avatar_url').or('username.ilike.%'+q+'%,display_name.ilike.%'+q+'%').limit(50);document.querySelector('#memberResults').innerHTML=(r.data||[]).map(x=>'<div class="item"><b>'+esc(x.display_name||x.username||'Member')+'</b><div class="muted">@'+esc(x.username||'member')+'</div><p class="muted">'+esc(x.bio||'')+'</p></div>').join('')||'<div class="muted">No members found.</div>'}</script><div class="footer">CrowRules Entertainment · CrowSpace · One Account · One Universe</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/crowrules-membership.js"></script><script src="js/crowspace.js"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.comm-grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.comm-card{background:linear-gradient(145deg,#11182b,#090d18);border:1px solid var(--line);border-radius:18px;padding:18px}.list{display:grid;gap:8px}.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}.item.active{border-color:#55b8ff}.messages{min-height:360px;max-height:58vh;overflow:auto;display:grid;align-content:start;gap:8px}.bubble{max-width:75%;padding:10px 13px;border-radius:14px;background:rgba(255,255,255,.06)}.mine{margin-left:auto;background:rgba(85,184,255,.14)}.composer{display:flex;gap:8px;margin-top:12px}.composer input{flex:1}.room-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.live-card{position:relative}.live-dot{color:#ff5364;font-weight:900}@media(max-width:800px){.comm-grid,.room-grid{grid-template-columns:1fr}} </style></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="section"><div id="room"></div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await CS.user();if(!u){location.href='login.html';return}await CS.refreshHeader();const slug=new URLSearchParams(location.search).get('slug');const esc=CS.escape;const q=await crowSupabase.from('crowspace_rooms').select('*').eq('slug',slug).maybeSingle();if(q.error||!q.data){document.getElementById('room').innerHTML='<div class="empty">Room not found.</div>';return}const r=q.data;document.getElementById('room').innerHTML='<div class="section-head"><div><p class="eyebrow">ROOM</p><h1>'+esc(r.name)+'</h1><p class="muted">'+esc(r.description||'')+'</p></div><a class="btn" href="rooms.html">All Rooms</a></div><section class="comm-card"><div class="muted" id="presenceLine">Connecting presence…</div><div id="messages" class="messages"></div><form id="form" class="composer"><input id="body" maxlength="5000" placeholder="Say something…"><button class="btn primary">Send</button></form></section>';async function loadPresence(){const ch=window.roomPresence;if(!ch)return;const state=ch.presenceState();const n=Object.values(state).reduce((a,v)=>a+v.length,0);document.getElementById('presenceLine').textContent=n+' people here';}async function load(){const m=await crowSupabase.from('crowspace_room_messages').select('*').eq('room_id',r.id).order('created_at',{ascending:true}).limit(200);const g=await CS.socialGraphMap(500);document.getElementById('messages').innerHTML=(m.data||[]).map(x=>'<div class="bubble '+(x.user_id===u.id?'mine':'')+'"><small class="muted">'+esc((g[x.user_id]||{}).display_name||'Member')+'</small><div>'+esc(x.body)+'</div></div>').join('')||'<div class="empty">Room is quiet. Start the conversation.</div>';const b=document.getElementById('messages');b.scrollTop=b.scrollHeight}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const i=document.getElementById('body'),body=i.value.trim();if(!body)return;const x=await crowSupabase.from('crowspace_room_messages').insert({room_id:r.id,user_id:u.id,body});if(x.error)alert(x.error.message);else{i.value='';load()}};load();const roomPresence=crowSupabase.channel('crowspace-room-presence-'+r.id,{config:{presence:{key:u.id}}}).on('presence',{event:'sync'},loadPresence).on('presence',{event:'join'},loadPresence).on('presence',{event:'leave'},loadPresence).subscribe(async status=>{if(status==='SUBSCRIBED'){await roomPresence.track({online_at:new Date().toISOString()});loadPresence()}});window.roomPresence=roomPresence;setInterval(()=>roomPresence.track({online_at:new Date().toISOString()}),30000)});</script><script src="js/global-nav.js"></script></body></html>

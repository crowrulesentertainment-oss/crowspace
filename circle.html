<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circle | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.circle-cover{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;background:radial-gradient(circle at 80% 10%,rgba(155,108,255,.18),transparent 25rem),linear-gradient(145deg,#11182b,#080b15);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.circle-big-icon{width:94px;height:94px;border-radius:24px;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,rgba(85,184,255,.18),rgba(155,108,255,.24));border:1px solid var(--line)}.circle-name{font:800 clamp(27px,4vw,44px) Orbitron;margin:0}.circle-statbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}.circle-stat{color:var(--muted);font-size:11px}.circle-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.7fr);gap:18px;margin-top:18px}.circle-composer,.circle-post,.circle-side{background:linear-gradient(145deg,rgba(17,22,39,.92),rgba(10,14,27,.92));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.circle-composer textarea{min-height:105px}.circle-post{margin-top:12px}.circle-post-head{display:flex;align-items:center;gap:10px}.circle-post-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2998f4,#8b5cf6);font-weight:900}.circle-post-author strong,.circle-post-author small{display:block}.circle-post-author small{color:var(--muted);font-size:10px}.circle-post h3{margin:14px 0 7px}.circle-post-body{white-space:pre-wrap;color:#c7d0df;line-height:1.75}.circle-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}.circle-side h3{font:800 17px Orbitron;margin-top:0}.member-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}.member-row:last-child{border-bottom:0}.rank-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.rank-row:last-child{border-bottom:0}.empty{padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}.join-state{font-weight:800;color:#48d67a;font-size:11px}.comment-box{margin-top:10px}.comment-box input{min-height:42px}.comment{font-size:11px;color:var(--muted);padding:8px 0;border-top:1px solid var(--line)}.activity-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.activity-item:last-child{border-bottom:0}.activity-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.05);flex:0 0 34px}.activity-detail{margin-top:6px;color:#c7d0df}.activity-detail .btn{margin-top:4px}
@media(max-width:850px){.circle-cover{grid-template-columns:auto 1fr}.circle-cover>.actions{grid-column:1/-1}.circle-layout{grid-template-columns:1fr}}@media(max-width:560px){.circle-cover{grid-template-columns:1fr;text-align:center}.circle-big-icon{margin:auto}.circle-statbar{justify-content:center}}.circle-admin{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(17,22,39,.92),rgba(10,14,27,.92))}.circle-admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.circle-notice{border:1px solid rgba(89,231,255,.25);background:rgba(89,231,255,.06);padding:14px;border-radius:14px;margin-top:12px}.pinned-badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:rgba(155,108,255,.12);border:1px solid rgba(155,108,255,.25);font-size:9px;font-weight:800;color:#cbb8ff}.circle-invite-row{display:flex;gap:8px}.circle-invite-row input{flex:1}.circle-post.pinned{border-color:rgba(155,108,255,.45);box-shadow:0 0 0 1px rgba(155,108,255,.08),var(--shadow)}.circle-notification{padding:10px 0;border-bottom:1px solid var(--line);font-size:11px}.circle-notification:last-child{border-bottom:0}</style>
<style>.circle-tools{margin-top:18px;display:grid;gap:18px}.circle-tool{background:linear-gradient(145deg,rgba(17,22,39,.92),rgba(10,14,27,.92));border:1px solid var(--line);border-radius:16px;padding:18px}.tool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tool-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:rgba(255,255,255,.02)}.poll-option{display:flex;gap:8px;align-items:center;padding:9px 0}.poll-option button{flex:1;text-align:left}.channel-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;margin:4px;background:rgba(85,184,255,.06)}@media(max-width:850px){.tool-grid{grid-template-columns:1fr}}</style></head>
<body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"><a href="login.html">Sign In</a></div></header>
<main class="section"><div id="page"><div class="card empty">Loading Circle…</div></div></main><footer>CrowSpace · One Account. One Universe.</footer>
<script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function(){
  const page=document.getElementById('page');
  const esc=(s)=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const fail=(title,msg)=>{page.innerHTML='<div class="card empty"><h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p><a class="btn primary" href="circles.html">Back to Circles</a></div>';};
  try{
    if(!window.crowSupabase){fail('Circle could not start','The CrowSpace database client did not load.');return;}
    const {data:{user},error:authError}=await crowSupabase.auth.getUser();
    if(authError||!user){location.href='login.html';return;}
    const slug=new URLSearchParams(location.search).get('slug');
    if(!slug){location.href='circles.html';return;}
    page.innerHTML='<div class="card empty">Loading Circle data…</div>';

    const {data:circle,error:circleError}=await crowSupabase.from('crowspace_circles').select('*').eq('slug',slug).maybeSingle();
    if(circleError) throw new Error(circleError.message);
    if(!circle) {fail('Circle not found','No Circle exists for “'+slug+'”.');return;}

    const [membersQ,postsQ,likesQ,commentsQ,channelsQ]=await Promise.all([
      crowSupabase.from('crowspace_circle_members').select('user_id,role,created_at').eq('circle_id',circle.id).order('created_at',{ascending:true}),
      crowSupabase.from('crowspace_circle_posts').select('*').eq('circle_id',circle.id).order('created_at',{ascending:false}).limit(50),
      crowSupabase.from('crowspace_circle_post_likes').select('post_id,user_id'),
      crowSupabase.from('crowspace_circle_comments').select('*').order('created_at',{ascending:true}),
      crowSupabase.from('crowspace_circle_channels').select('id,name,created_by,created_at').eq('circle_id',circle.id).order('name')
    ]);
    const members=membersQ.data||[],posts=postsQ.data||[],likes=likesQ.data||[],comments=commentsQ.data||[],channels=channelsQ.data||[];
    const joined=members.some(m=>m.user_id===user.id);
    const ids=[...new Set([...members.map(x=>x.user_id),...posts.map(x=>x.user_id),...comments.map(x=>x.user_id)])];
    let profiles={};
    if(ids.length){
      const p=await crowSupabase.from('membership_profiles').select('id,username,display_name,avatar_url').in('id',ids);
      (p.data||[]).forEach(x=>profiles[x.id]=x);
    }
    const likeCounts={}; const myLikes={};
    likes.forEach(x=>{likeCounts[x.post_id]=(likeCounts[x.post_id]||0)+1;if(x.user_id===user.id)myLikes[x.post_id]=true;});
    const commentsBy={};comments.forEach(x=>(commentsBy[x.post_id]||(commentsBy[x.post_id]=[])).push(x));
    const nameFor=(id)=>{const p=profiles[id]||{};return p.display_name||p.username||'Member';};

    const postsHtml=posts.length?posts.map(p=>{
      const commentsFor=commentsBy[p.id]||[], name=nameFor(p.user_id);
      return '<article class="circle-post"><div class="circle-post-head"><span class="circle-post-avatar">'+esc(name.slice(0,1).toUpperCase())+'</span><div class="circle-post-author"><strong>'+esc(name)+'</strong><small>'+new Date(p.created_at).toLocaleString()+'</small></div></div>'+(p.title?'<h3>'+esc(p.title)+'</h3>':'')+'<div class="circle-post-body">'+esc(p.body)+'</div><div class="circle-actions"><button class="btn like-post" data-id="'+esc(p.id)+'">'+(myLikes[p.id]?'♥':'♡')+' '+(likeCounts[p.id]||0)+'</button><span class="btn">💬 '+commentsFor.length+'</span></div>'+commentsFor.slice(0,3).map(cm=>'<div class="comment"><strong>'+esc(nameFor(cm.user_id))+'</strong> · '+esc(cm.body)+'</div>').join('')+'</article>';
    }).join(''):'<div class="empty">No discussions yet. Be the first to start one.</div>';

    const memberHtml=members.length?members.slice(0,20).map(m=>'<div class="member-row"><span class="avatar sm">'+esc(nameFor(m.user_id).slice(0,1).toUpperCase())+'</span><span><a href="profile.html?id='+encodeURIComponent(m.user_id)+'">'+esc(nameFor(m.user_id))+'</a><br><small class="muted">'+esc(m.role||'member')+'</small></span></div>').join(''):'<div class="empty">No members yet.</div>';

    page.innerHTML='<section class="circle-cover"><div class="circle-big-icon">'+esc(circle.emoji||'◉')+'</div><div><p class="eyebrow">CROWSPACE CIRCLE</p><h1 class="circle-name">'+esc(circle.name)+'</h1><p class="lead">'+esc(circle.description||'')+'</p><div class="circle-statbar"><span class="circle-stat">'+members.length+' members</span><span class="circle-stat">'+posts.length+' discussions</span><span class="circle-stat">'+comments.length+' comments</span></div></div><div class="actions"><button id="joinBtn" class="btn primary">'+(joined?'Leave Circle':'Join Circle')+'</button><a class="btn" href="circles.html">All Circles</a></div></section><div class="circle-layout"><section><div class="circle-composer"><p class="eyebrow">COMMUNITY DISCUSSION</p><h2>Start a conversation</h2><input id="postTitle" placeholder="Discussion title (optional)"><textarea id="postBody" placeholder="Share something with the '+esc(circle.name)+' community…"></textarea><button id="postBtn" class="btn primary">Publish Discussion</button><p id="postMsg" class="muted"></p></div><div class="section-head" style="margin-top:20px"><div><p class="eyebrow">THE FEED</p><h2>Latest discussions</h2></div></div><div id="feed">'+postsHtml+'</div><div class="circle-tool" style="margin-top:18px"><div class="section-head"><div><p class="eyebrow">CIRCLE CHANNELS</p><h2>Topics & Channels</h2></div></div><div id="channels">'+(channels.length?channels.map(x=>'<span class="channel-pill"># '+esc(x.name)+'</span>').join(''):'<div class="empty">No channels yet.</div>')+'</div></div></section><aside><div class="circle-side"><h3>Community</h3><p class="muted">'+(joined?'<span class="join-state">● You are a member</span>':'Join this Circle to post and participate.')+'</p><h3 style="margin-top:22px">Members</h3><div id="memberResults">'+memberHtml+'</div></div></aside></div>';

    document.getElementById('joinBtn').onclick=async()=>{const b=document.getElementById('joinBtn');b.disabled=true;const r=joined?await crowSupabase.from('crowspace_circle_members').delete().eq('circle_id',circle.id).eq('user_id',user.id):await crowSupabase.from('crowspace_circle_members').insert({circle_id:circle.id,user_id:user.id,role:'member'});if(r.error){b.disabled=false;alert(r.error.message);return;}location.reload();};
    document.getElementById('postBtn').onclick=async()=>{const body=document.getElementById('postBody').value.trim(),title=document.getElementById('postTitle').value.trim(),msg=document.getElementById('postMsg'),b=document.getElementById('postBtn');if(!joined){msg.textContent='Join this Circle before posting.';return;}if(!body){msg.textContent='Write something first.';return;}b.disabled=true;b.textContent='Publishing…';const r=await crowSupabase.from('crowspace_circle_posts').insert({circle_id:circle.id,user_id:user.id,title:title||null,body}).select('id').single();if(r.error)msg.textContent=r.error.message;else location.reload();b.disabled=false;b.textContent='Publish Discussion';};
    document.querySelectorAll('.like-post').forEach(b=>b.onclick=async()=>{if(!joined){alert('Join this Circle to react.');return;}const id=b.dataset.id;const r=myLikes[id]?await crowSupabase.from('crowspace_circle_post_likes').delete().eq('post_id',id).eq('user_id',user.id):await crowSupabase.from('crowspace_circle_post_likes').insert({post_id:id,user_id:user.id});if(r.error)alert(r.error.message);else location.reload();});
    if(window.CS&&typeof CS.refreshHeader==='function'){try{await CS.refreshHeader();}catch(e){console.warn('Header:',e);}}
  }catch(e){console.error('Circle error:',e);fail('Circle could not be loaded',e?.message||'Please refresh the page and try again.');}
});
</script></script><script src="js/global-nav.js?v=20260927-5"></script></body></html>

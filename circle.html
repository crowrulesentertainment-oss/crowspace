<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circle — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body><header class="topbar"></header><main class="page"><section class="community-hero"><div class="community-art">🔵</div><div><span class="eyebrow">CIRCLE</span><h1>Creators Circle</h1><p class="muted">A smaller network for collaboration, conversation and shared Caws.</p><div class="actions"><button class="primary">Join Circle</button><button class="secondary" type="button" data-context-share>↗ Share Circle</button></div></div></section><div class="community-tabs"><a class="active">Feed</a><a>Members</a><a>About</a><a>Events</a></div><section class="panel"><h2>Circle Feed</h2><div class="empty">🐦<h3>No Caws yet</h3><p class="muted">The Circle feed will appear here.</p></div></section></main><footer><b>🐦 CROWSPACE</b><span>One Account. One Universe.</span><span>© 2026 CrowRules Entertainment</span></footer><nav class="mobile-nav"><a href="index.html">⌂<small>Home</small></a><a href="search.html">⌕<small>Search</small></a><a href="caw-feed.html">＋<small>Caw</small></a><a href="notifications.html">◉<small>Alerts</small></a><a href="profile.html">●<small>Profile</small></a></nav><script src="js/navigation.js"></script><script src="js/crowspace.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>document.addEventListener("DOMContentLoaded",async()=>{if(!window.CROW_CONFIG?.supabaseUrl)return;const sb=supabase.createClient(CROW_CONFIG.supabaseUrl,CROW_CONFIG.supabaseKey),id=new URLSearchParams(location.search).get("id");if(!id)return;const {data:c}=await sb.from("crowspace_circles").select("id,name,emoji,description,image_url").eq("id",id).maybeSingle();if(!c)return;document.querySelector(".community-art").textContent=c.emoji||"🔵";document.querySelector(".community-hero h1").textContent=c.name;document.querySelector(".community-hero p").textContent=c.description||"A CrowSpace Circle.";const {count}=await sb.from("crowspace_circle_members").select("user_id",{count:"exact",head:true}).eq("circle_id",id);document.querySelector(".community-hero .actions").insertAdjacentHTML("beforeend",'<span class="muted community-count">'+(count||0)+' members</span>');const {data:posts}=await sb.from("crowspace_circle_posts").select("id,user_id,body,title,created_at").eq("circle_id",id).order("created_at",{ascending:false}).limit(20);const feed=document.querySelector(".panel:last-child");feed.innerHTML='<div class="section-head"><h2>Circle Feed</h2></div>'+(posts?.length?posts.map(p=>'<article class="feed-card"><h3>'+String(p.title||"").replace(/[&<>]/g,"")+'</h3><p>'+String(p.body||"").replace(/[&<>]/g,"")+'</p><small class="muted">'+new Date(p.created_at).toLocaleString()+'</small></article>').join(""):'<div class="empty">🐦<h3>No Caws yet</h3></div>')})</script><script src="js/crowspace-invites.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/crowspace-community-membership.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/crowspace-community-membership.js"></script><script src="js/crowspace-community-members.js"></script><script src="js/crowspace-community-feed.js"></script></body></html>

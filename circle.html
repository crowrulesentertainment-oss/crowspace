<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circle | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.circle-cover{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;background:radial-gradient(circle at 80% 10%,rgba(155,108,255,.18),transparent 25rem),linear-gradient(145deg,#11182b,#080b15);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.circle-big-icon{width:94px;height:94px;border-radius:24px;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,rgba(85,184,255,.18),rgba(155,108,255,.24));border:1px solid var(--line)}.circle-name{font:800 clamp(27px,4vw,44px) Orbitron;margin:0}.circle-statbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}.circle-stat{color:var(--muted);font-size:11px}.circle-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.7fr);gap:18px;margin-top:18px}.circle-composer,.circle-post,.circle-side{background:linear-gradient(145deg,rgba(17,22,39,.92),rgba(10,14,27,.92));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.circle-composer textarea{min-height:105px}.circle-post{margin-top:12px}.circle-post-head{display:flex;align-items:center;gap:10px}.circle-post-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2998f4,#8b5cf6);font-weight:900}.circle-post-author strong,.circle-post-author small{display:block}.circle-post-author small{color:var(--muted);font-size:10px}.circle-post h3{margin:14px 0 7px}.circle-post-body{white-space:pre-wrap;color:#c7d0df;line-height:1.75}.circle-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}.circle-side h3{font:800 17px Orbitron;margin-top:0}.member-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}.member-row:last-child{border-bottom:0}.rank-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.rank-row:last-child{border-bottom:0}.empty{padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}.join-state{font-weight:800;color:#48d67a;font-size:11px}.comment-box{margin-top:10px}.comment-box input{min-height:42px}.comment{font-size:11px;color:var(--muted);padding:8px 0;border-top:1px solid var(--line)}
@media(max-width:850px){.circle-cover{grid-template-columns:auto 1fr}.circle-cover>.actions{grid-column:1/-1}.circle-layout{grid-template-columns:1fr}}@media(max-width:560px){.circle-cover{grid-template-columns:1fr;text-align:center}.circle-big-icon{margin:auto}.circle-statbar{justify-content:center}}
<style>.circle-tools{margin-top:18px;display:grid;gap:18px}.circle-tool{background:linear-gradient(145deg,rgba(17,22,39,.92),rgba(10,14,27,.92));border:1px solid var(--line);border-radius:16px;padding:18px}.tool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tool-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:rgba(255,255,255,.02)}.poll-option{display:flex;gap:8px;align-items:center;padding:9px 0}.poll-option button{flex:1;text-align:left}.channel-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;margin:4px;background:rgba(85,184,255,.06)}@media(max-width:850px){.tool-grid{grid-template-columns:1fr}}</style></head>
<body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header>
<main class="section"><div id="page"><div class="card empty">Loading Circle…</div></div></main><footer>CrowSpace · One Account. One Universe.</footer>
<script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script>
<script>
document.addEventListener('DOMContentLoaded',async()=>{const esc=CS.escape,u=await CS.user();if(!u){location.href='login.html';return;}await CS.refreshHeader();const slug=new URLSearchParams(location.search).get('slug');if(!slug){location.href='circles.html';return;}
const {data:c,error}=await crowSupabase.from('crowspace_circles').select('*').eq('slug',slug).maybeSingle();if(error||!c){document.getElementById('page').innerHTML='<div class="card empty">Circle not found. <a href="circles.html">Return to Circles</a></div>';return;}
const page=document.getElementById('page');let joined=false;
async function circleCaws(circleId,channelId=''){let q=crowSupabase.from('crowspace_circle_caws').select('caw_id,user_id,channel_id,created_at').eq('circle_id',circleId).order('created_at',{ascending:false}).limit(24);if(channelId)q=q.eq('channel_id',channelId);const l=await q;if(l.error)throw l.error;if(!l.data?.length)return [];const r=await crowSupabase.from('crowspace_caws').select('id,user_id,title,caption,video_url,thumbnail_url,views,created_at').in('id',l.data.map(x=>x.caw_id));const map=Object.fromEntries((r.data||[]).map(x=>[x.id,x]));const graph=await CS.socialGraphMap(500);return l.data.map(x=>({...map[x.caw_id],circle_created_at:x.created_at})).filter(x=>x.id&&x.video_url).map(x=>{const p=graph[x.user_id]||{};return '<article class="card"><video controls playsinline preload="metadata" src="'+esc(x.video_url)+'" '+(x.thumbnail_url?'poster="'+esc(x.thumbnail_url)+'"':'')+' style="width:100%;aspect-ratio:16/9;object-fit:cover"></video><h3>'+esc(x.title||'Untitled Caw')+'</h3><p>'+esc(x.caption||'')+'</p><small class="muted">By <a href="profile.html?id='+encodeURIComponent(x.user_id)+'">'+esc(p.display_name||p.username||'Member')+'</a> · '+Number(x.views||0)+' views</small><div class="actions" style="margin-top:10px"><a class="btn" href="caw-feed.html?caw='+encodeURIComponent(x.id)+'">Open in Caw Feed →</a></div></article>'})}
async function load(){const [{data:members},{data:posts},{data:likes},{data:comments}]=await Promise.all([
 crowSupabase.from('crowspace_circle_members').select('user_id,role,created_at').eq('circle_id',c.id),
 crowSupabase.from('crowspace_circle_posts').select('*').eq('circle_id',c.id).order('created_at',{ascending:false}).limit(50),
 crowSupabase.from('crowspace_circle_post_likes').select('post_id,user_id'),
 crowSupabase.from('crowspace_circle_comments').select('*').order('created_at',{ascending:true})
]);
 joined=(members||[]).some(m=>m.user_id===u.id);const graph=await CS.socialGraphMap(500);const likesBy={},myLikes={};(likes||[]).forEach(l=>{likesBy[l.post_id]=(likesBy[l.post_id]||0)+1;if(l.user_id===u.id)myLikes[l.post_id]=true;});const commentsBy={};(comments||[]).forEach(x=>(commentsBy[x.post_id]||(commentsBy[x.post_id]=[])).push(x));
 page.innerHTML='<section class="circle-cover"><div class="circle-big-icon">'+esc(c.emoji)+'</div><div><p class="eyebrow">CROWSPACE CIRCLE</p><h1 class="circle-name">'+esc(c.name)+'</h1><p class="lead">'+esc(c.description)+'</p><div class="circle-statbar"><span class="circle-stat">'+(members||[]).length+' members</span><span class="circle-stat">'+(posts||[]).length+' discussions</span><span class="circle-stat">'+(comments||[]).length+' comments</span></div></div><div class="actions"><button id="joinBtn" class="btn '+(joined?'':'primary')+'">'+(joined?'Leave Circle':'Join Circle')+'</button><a class="btn" href="circles.html">All Circles</a></div></section><div class="circle-layout"><section><div class="circle-composer"><p class="eyebrow">COMMUNITY DISCUSSION</p><h2>Start a conversation</h2><input id="postTitle" placeholder="Discussion title (optional)"><textarea id="postBody" placeholder="Share something with the '+esc(c.name)+' community…"></textarea><label>Channel <span class="muted">(optional)</span><select id="postChannel"><option value="">General Circle</option></select></label><div class="actions"><button id="postBtn" class="btn primary">Publish Discussion</button></div><p id="postMsg" class="muted"></p></div><div class="section-head" style="margin-top:20px"><div><p class="eyebrow">THE FEED</p><h2>Latest discussions</h2></div></div><div id="feed">'+renderPosts(posts||[],graph,likesBy,myLikes,commentsBy)+'</div><div class="section-head" style="margin-top:20px"><div><p class="eyebrow">CIRCLE CAWS</p><h2>Community Caws</h2></div><select id="cawChannelFilter" style="max-width:260px"><option value="">All channels</option></select></div><div id="cawFeed" class="grid two"><div class="empty">Loading Caws…</div></div></section><aside><div class="circle-side"><h3>Community</h3><p class="muted">'+(joined?'<span class="join-state">● You are a member</span>':'Join this Circle to post and participate.')+'</p><h3 style="margin-top:22px">Members</h3><div>'+renderMembers(members||[],graph)+'</div></div><div class="circle-side" style="margin-top:18px"><h3>Circle Activity</h3><div id="ranking">'+renderRanking(posts||[],graph,likesBy)+'</div></div></aside></div>';
 const toolsWrap=document.createElement('section');toolsWrap.className='circle-tools';toolsWrap.innerHTML='<div class="circle-tool"><div class="section-head"><div><p class="eyebrow">CIRCLE CHANNELS</p><h2>Topics & Channels</h2><p class="muted">Give this Circle focused places for conversations.</p></div><button id="addChannelBtn" class="btn">+ Channel</button></div><div id="channels"></div></div><div class="circle-tool"><div class="section-head"><div><p class="eyebrow">COMMUNITY POLLS</p><h2>Ask the Circle</h2><p class="muted">Create a poll and let members vote.</p></div><button id="newPollBtn" class="btn">+ Poll</button></div><div id="pollComposer" style="display:none"><input id="pollQuestion" maxlength="240" placeholder="What do you want to ask?"><input id="pollOptions" maxlength="500" placeholder="Options separated by commas"><div class="actions" style="margin-top:10px"><button id="publishPollBtn" class="btn primary">Publish Poll</button><button id="cancelPollBtn" class="btn">Cancel</button></div></div><div id="polls"></div></div><div class="circle-tool"><div class="section-head"><div><p class="eyebrow">CIRCLE EVENTS</p><h2>What's happening</h2><p class="muted">Meetups and events connected to this community.</p></div><a id="createCircleEvent" class="btn primary">+ Event</a></div><div id="circleEvents"></div></div>';
page.appendChild(toolsWrap);
document.getElementById('createCircleEvent').href='create-event.html?circle_id='+encodeURIComponent(c.id)+'&slug='+encodeURIComponent(c.slug);
async function loadChannelControls(){const q=await crowSupabase.from('crowspace_circle_channels').select('id,name').eq('circle_id',c.id).order('name');if(q.error)return;const opts=(q.data||[]).map(x=>'<option value="'+esc(x.id)+'">'+esc('# '+x.name)+'</option>').join('');const pc=document.getElementById('postChannel'),cf=document.getElementById('cawChannelFilter');if(pc)pc.innerHTML='<option value="">General Circle</option>'+opts;if(cf)cf.innerHTML='<option value="">All channels</option>'+opts;if(cf)cf.onchange=()=>loadCaws(cf.value);}
async function loadCaws(channelId=''){const el=document.getElementById('cawFeed');try{const cards=await circleCaws(c.id,channelId);el.innerHTML=cards.join('')||'<div class="empty">No Caws in this channel yet.</div>';}catch(e){el.innerHTML='<div class="empty">Caws could not be loaded.</div>';}}
async function loadChannels(){const q=await crowSupabase.from('crowspace_circle_channels').select('*').eq('circle_id',c.id).order('created_at',{ascending:true});const el=document.getElementById('channels');if(q.error){el.innerHTML='<div class="empty">'+esc(q.error.message)+'</div>';return;}el.innerHTML=(q.data||[]).map(x=>'<span class="channel-pill"># '+esc(x.name)+'</span>').join('')||'<div class="empty">No channels yet. Create the first topic.</div>';}
async function loadPolls(){const [pq,oq,vq]=await Promise.all([crowSupabase.from('crowspace_circle_polls').select('*').eq('circle_id',c.id).order('created_at',{ascending:false}).limit(12),crowSupabase.from('crowspace_circle_poll_options').select('*').order('position',{ascending:true}),crowSupabase.from('crowspace_circle_poll_votes').select('poll_id,option_id,user_id')]);const el=document.getElementById('polls');if(pq.error||oq.error||vq.error){el.innerHTML='<div class="empty">Polls could not be loaded.</div>';return;}const opts={};(oq.data||[]).forEach(o=>(opts[o.poll_id]||(opts[o.poll_id]=[])).push(o));const votes=vq.data||[];el.innerHTML=(pq.data||[]).map(p=>{const os=opts[p.id]||[],total=votes.filter(v=>v.poll_id===p.id).length,my=votes.find(v=>v.poll_id===p.id&&v.user_id===u.id);return '<div class="tool-card"><h3>'+esc(p.question)+'</h3><small class="muted">'+total+' vote'+(total===1?'':'s')+'</small>'+os.map(o=>'<div class="poll-option"><button class="btn" data-poll="'+esc(p.id)+'" data-option="'+esc(o.id)+'">'+esc(o.option_text)+'</button><span class="muted">'+votes.filter(v=>v.option_id===o.id).length+'</span></div>').join('')+(my?'<small class="join-state">● You voted</small>':'')+'</div>';}).join('')||'<div class="empty">No polls yet.</div>';el.querySelectorAll('[data-poll]').forEach(b=>b.onclick=async()=>{if(!joined){alert('Join this Circle to vote.');return;}const r=await crowSupabase.from('crowspace_circle_poll_votes').upsert({poll_id:b.dataset.poll,option_id:b.dataset.option,user_id:u.id},{onConflict:'poll_id'});if(r.error)alert(r.error.message);else loadPolls();});}
async function loadCircleEvents(){const links=await crowSupabase.from('crowspace_circle_events').select('event_id').eq('circle_id',c.id).order('created_at',{ascending:false}).limit(12);const el=document.getElementById('circleEvents');if(links.error){el.innerHTML='<div class="empty">'+esc(links.error.message)+'</div>';return;}const ids=(links.data||[]).map(x=>x.event_id);if(!ids.length){el.innerHTML='<div class="empty">No Circle events yet. Create the first one.</div>';return;}const ev=await crowSupabase.from('crowspace_events').select('*').in('id',ids).order('starts_at',{ascending:true});el.innerHTML=(ev.data||[]).map(x=>{const d=new Date(x.starts_at);return '<div class="tool-card"><p class="eyebrow">'+d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</p><h3>'+esc(x.title)+'</h3><p>'+esc(x.description||'')+'</p><small class="muted">🕒 '+d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})+' · '+esc(x.is_online?'Online':(x.location||'Location TBA'))+'</small>'+(x.link_url?'<div class="actions" style="margin-top:10px"><a class="btn" href="'+esc(x.link_url)+'" target="_blank" rel="noopener">Event Link →</a></div>':'')+'</div>';}).join('');}
 document.getElementById('addChannelBtn').onclick=async()=>{if(!joined){alert('Join this Circle to create a channel.');return;}const name=prompt('Channel name');if(!name||!name.trim())return;const slug=name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const r=await crowSupabase.from('crowspace_circle_channels').insert({circle_id:c.id,name:name.trim(),slug,created_by:u.id});if(r.error)alert(r.error.message);else loadChannels();};
document.getElementById('newPollBtn').onclick=()=>{if(!joined){alert('Join this Circle to create a poll.');return;}document.getElementById('pollComposer').style.display='block';};
document.getElementById('cancelPollBtn').onclick=()=>document.getElementById('pollComposer').style.display='none';
document.getElementById('publishPollBtn').onclick=async()=>{const q=document.getElementById('pollQuestion').value.trim(),os=document.getElementById('pollOptions').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,8);if(!q||os.length<2){alert('Enter a question and at least two options.');return;}const p=await crowSupabase.from('crowspace_circle_polls').insert({circle_id:c.id,user_id:u.id,question:q}).select('id').single();if(p.error){alert(p.error.message);return;}const r=await crowSupabase.from('crowspace_circle_poll_options').insert(os.map((x,i)=>({poll_id:p.data.id,option_text:x,position:i})));if(r.error)alert(r.error.message);else{document.getElementById('pollQuestion').value='';document.getElementById('pollOptions').value='';document.getElementById('pollComposer').style.display='none';loadPolls();}};
loadChannels();loadChannelControls();loadPolls();loadCircleEvents();loadCaws();
 document.getElementById('joinBtn').onclick=async()=>{const b=document.getElementById('joinBtn');b.disabled=true;if(joined){const r=await crowSupabase.from('crowspace_circle_members').delete().eq('circle_id',c.id).eq('user_id',u.id);if(r.error)alert(r.error.message);else{joined=false;load();}}else{const r=await crowSupabase.from('crowspace_circle_members').insert({circle_id:c.id,user_id:u.id,role:'member'});if(r.error)alert(r.error.message);else{joined=true;load();}}};
 document.getElementById('postBtn').onclick=async()=>{const body=document.getElementById('postBody').value.trim(),title=document.getElementById('postTitle').value.trim(),msg=document.getElementById('postMsg');if(!joined){msg.textContent='Join this Circle before posting.';return;}if(!body){msg.textContent='Write something first.';return;}const b=document.getElementById('postBtn');b.disabled=true;b.textContent='Publishing…';const r=await crowSupabase.from('crowspace_circle_posts').insert({circle_id:c.id,user_id:u.id,title:title||null,body,channel_id:document.getElementById('postChannel').value||null});if(r.error)msg.textContent=r.error.message;else load();b.disabled=false;b.textContent='Publish Discussion';};
 document.querySelectorAll('[data-like]').forEach(b=>b.onclick=async()=>{if(!joined){alert('Join this Circle to react.');return;}const id=b.dataset.like;if(myLikes[id]){await crowSupabase.from('crowspace_circle_post_likes').delete().eq('post_id',id).eq('user_id',u.id);}else{await crowSupabase.from('crowspace_circle_post_likes').insert({post_id:id,user_id:u.id});}load();});
}
function renderMembers(ms,g){if(!ms.length)return '<div class="empty">No members yet.</div>';return ms.slice(0,12).map(m=>{const p=g[m.user_id]||{};const n=p.display_name||p.username||'Member';return '<div class="member-row"><span class="avatar sm">'+esc(n.slice(0,1).toUpperCase())+'</span><span><a href="profile.html?id='+encodeURIComponent(m.user_id)+'">'+esc(n)+'</a><br><small class="muted">'+esc(m.role||'member')+'</small></span></div>';}).join('');}
function renderPosts(ps,g,lb,ml,cb){if(!ps.length)return '<div class="empty">No discussions yet. Be the first to start one.</div>';return ps.map(p=>{const x=g[p.user_id]||{},n=x.display_name||x.username||'Member';const comments=cb[p.id]||[];return '<article class="circle-post"><div class="circle-post-head"><span class="circle-post-avatar">'+esc(n.slice(0,1).toUpperCase())+'</span><div class="circle-post-author"><strong>'+esc(n)+'</strong><small>'+new Date(p.created_at).toLocaleString()+'</small></div></div>'+(p.title?'<h3>'+esc(p.title)+'</h3>':'')+'<div class="circle-post-body">'+esc(p.body)+'</div><div class="circle-actions"><button class="btn" data-like="'+esc(p.id)+'">'+(ml[p.id]?'♥':'♡')+' '+Number(lb[p.id]||0)+'</button><span class="btn" style="cursor:default">💬 '+comments.length+'</span></div>'+comments.slice(0,3).map(cm=>{const q=g[cm.user_id]||{};return '<div class="comment"><strong>'+esc(q.display_name||q.username||'Member')+'</strong> · '+esc(cm.body)+'</div>';}).join('')+'</article>';}).join('');}
function renderRanking(ps,g,lb){const scores={};ps.forEach(p=>{scores[p.user_id]=(scores[p.user_id]||0)+1+Number(lb[p.id]||0);});const arr=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,5);if(!arr.length)return '<div class="empty">Activity appears here as the Circle grows.</div>';return arr.map((r,i)=>{const p=g[r[0]]||{};return '<div class="rank-row"><strong>#'+(i+1)+'</strong><span>'+esc(p.display_name||p.username||'Member')+'</span><strong>'+r[1]+'</strong></div>';}).join('');}
 load();
});
</script><script src="js/global-nav.js"></script></body></html>

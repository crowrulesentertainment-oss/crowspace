<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrowSpace — Search</title>
<link rel="stylesheet" href="style.css">
<style>
.discovery-hero{margin-bottom:18px}.search-big{display:flex;gap:10px;margin-top:20px}.search-big input{flex:1;min-width:0}.discovery-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}.discovery-results{display:grid;gap:12px;margin-top:12px}.discovery-result{display:block;text-decoration:none}.discovery-result h3{margin:6px 0}.result-kind{font-size:11px;letter-spacing:.12em;opacity:.7}.filter-stack{display:grid;gap:8px}.filter-stack .btn{text-align:left}.mini-list{display:grid;gap:10px}.mini-list a{display:flex;flex-direction:column;gap:3px;text-decoration:none}.mini-list span{font-size:12px;opacity:.65}@media(max-width:850px){.discovery-layout{grid-template-columns:1fr}.search-big{flex-direction:column}}
 .intel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}.intel-grid section{min-width:0}.intel-row{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);text-decoration:none}.intel-row:last-child{border-bottom:0}.people-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.person-card{display:flex;flex-direction:column;gap:5px;text-decoration:none}.person-card .avatar{width:54px;height:54px}.discovery-intel-wrap{margin-top:18px}.personalization-card{border:1px solid rgba(255,255,255,.12)}@media(max-width:850px){.intel-grid{grid-template-columns:1fr}}\n</style>
<script>window.CrowSpaceSurfaceLearning=window.CrowSpaceInstrumentation?.surface?.("search");</script><link rel="stylesheet" href="crowspace-universal.css"><script src="crowspace-universal.js" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=1" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
</head>
<body data-page="search">
<div class="navin"></div>
<div class="shell"><div id="search"></div></div>
<script src="crowspace-auth.js"></script>
<script src="crowspace-rebuild.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{const run=window.CrowSpaceConsistency?.rank;if(!run)return;const host=document.querySelector('#results');if(!host)return;const obs=new MutationObserver(async()=>{const cards=[...host.querySelectorAll('[data-kind]')];if(!cards.length)return;const ranked=await run(cards.map((el,i)=>({id:el.dataset.id||String(i),kind:el.dataset.kind,score:Number(el.dataset.score||0),created_at:el.dataset.createdAt})), 'search','view');ranked.forEach((x,i)=>{const el=cards.find(e=>(e.dataset.id||'')===String(x.id));if(el)el.style.order=String(i)});});obs.observe(host,{childList:true,subtree:true});});</script><script src="js/crowspace-search.js"></script><script>(async()=>{try{await CrowSpaceAuth.ready;const u=CrowSpaceAuth.user,db=CrowSpaceAuth.client;const q=document.querySelector('input[type="search"],#searchInput,#search');if(!q||!u)return;let timer;const box=document.createElement('div');box.id='crow18-results';box.style='display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:20px 0';q.parentNode.after(box);const esc=CrowSpaceSearch.escape;async function go(){const v=q.value.trim();if(!v){box.innerHTML='';return}const a=await CrowSpaceSearch.search(db,u,v);box.innerHTML=a.map(x=>'<article style="padding:15px;border:1px solid #ffffff18;border-radius:12px"><small>'+esc(x.type)+'</small><h3>'+esc(x.title)+'</h3><p>'+esc(x.description)+'</p></article>').join('')||'<p>No results found.</p>'}q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(go,250)})}catch(e){console.warn('CrowSpace 18.0',e)}})();</script><section id="crow19" style="margin:24px 0"><div style="display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap"><div><small style="letter-spacing:.18em;opacity:.65">CROWRULES // DISCOVERY 19.0</small><h2>DISCOVER THE UNIVERSE</h2></div><div><select id="crow19-sort"><option value="relevant">RELEVANT</option><option value="newest">NEWEST</option><option value="popular">POPULAR</option></select></div></div><div id="crow19-cats" style="display:flex;gap:7px;flex-wrap:wrap;margin:12px 0"><button type="button" data-c19="all">ALL</button><button type="button" data-c19="people">PEOPLE</button><button type="button" data-c19="creators">CREATORS</button><button type="button" data-c19="posts">POSTS</button><button type="button" data-c19="caws">CAWS</button><button type="button" data-c19="events">EVENTS</button></div><div id="crow19-results" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px"></div></section><script src="js/crowspace-discovery-19.js"></script><script>(async()=>{try{await CrowSpaceAuth.ready;const db=CrowSpaceAuth.client,u=CrowSpaceAuth.user,root=document.getElementById('crow19'),input=document.querySelector('input[type="search"],#searchInput,#search');if(!db||!root)return;let cat='all',timer;const results=root.querySelector('#crow19-results'),sort=root.querySelector('#crow19-sort'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function render(){results.innerHTML='<p>DISCOVERING…</p>';const a=await CrowSpaceDiscovery19.load(db,u,{query:input?.value||'',category:cat,sort:sort.value});const follows=u?await CrowSpaceDiscovery19.following(db,u,a.filter(x=>x._type==='creator').map(x=>x.user_id)):new Set();results.innerHTML=a.map(x=>{const creator=x._type==='creator';const id=x.user_id||x.created_by||x.id;const title=x.display_name||x.username||x.title||'CrowSpace';const desc=x.bio||x.portfolio_tagline||x.body||x.caption||x.description||'';return '<article style="padding:17px;border:1px solid rgba(255,255,255,.12);border-radius:14px"><small>'+esc(x._type.toUpperCase())+'</small><h3>'+esc(title)+'</h3><p>'+esc(desc).slice(0,180)+'</p>'+(creator&&u&&u.id!==id?'<button type="button" data-follow="'+esc(id)+'">'+(follows.has(id)?'FOLLOWING':'FOLLOW')+'</button>':'')+'</article>'}).join('')||'<p>No discovery results yet.</p>';results.querySelectorAll('[data-follow]').forEach(b=>b.onclick=async()=>{const id=b.dataset.follow;if(b.textContent==='FOLLOW')await CrowSpaceDiscovery19.follow(db,u,id);else await CrowSpaceDiscovery19.unfollow(db,u,id);render()})}if(input)input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,250)});sort.onchange=render;root.querySelectorAll('[data-c19]').forEach(b=>b.onclick=()=>{cat=b.dataset.c19;render()});render()}catch(e){console.warn('CrowSpace 19.0',e)}})();</script><section id="crow20" style="margin:24px 0"><small style="letter-spacing:.18em;opacity:.65">CROWRULES // CONTENT GRAPH 20.0</small><h2>CONNECTED DISCOVERY</h2><p>Creators, projects, media, Caws, communities and events can now be connected into one discovery graph.</p><div id="crow20-state" style="padding:14px;border:1px solid rgba(255,255,255,.12);border-radius:12px">GRAPH READY · SEARCH FOR AN ITEM TO EXPLORE RELATIONSHIPS</div></section><script src="js/crowspace-content-graph-20.js"></script><script>(async()=>{try{await CrowSpaceAuth.ready;const db=CrowSpaceAuth.client;const input=document.querySelector('input[type="search"],#searchInput,#search');const state=document.getElementById('crow20-state');if(!db||!input)return;const render=async()=>{const q=input.value.trim();if(!q){state.textContent='GRAPH READY · SEARCH FOR AN ITEM TO EXPLORE RELATIONSHIPS';return}const r=await CrowSpaceDiscovery19.load(db,CrowSpaceAuth.user,{query:q,limit:1});if(!r.length){state.textContent='NO GRAPH NODE FOUND';return}const x=r[0];const rel=await CrowSpaceGraph20.related(db,x._type,x.id,12);state.innerHTML='<strong>'+CrowSpaceGraph20.version+' · '+rel.length+' CONNECTIONS</strong><br>'+rel.map(e=>e.relation+' → '+e.target_type).join(' · ')||'NODE FOUND · NO EXPLICIT CONNECTIONS YET';if(CrowSpaceAuth.user)CrowSpaceGraph20.track(db,CrowSpaceAuth.user,x._type,x.id,'open')};input.addEventListener('change',render);})();catch(e){console.warn('CrowSpace 20.0',e)}})();</script><script src="js/crowspace-graph-20-1.js"></script><script>(async()=>{try{await CrowSpaceAuth.ready;if(CrowSpaceAuth.client&&CrowSpaceAuth.user)CrowSpaceGraph20_1.refresh(CrowSpaceAuth.client)}catch(e){console.warn("CrowSpace 20.1 auto population",e)}})();</script></body>
</html>

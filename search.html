<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Members — CrowSpace</title><style>:root{--a:#20e6ff}body{margin:0;background:#05050b;color:#fff;font:14px Arial}main{max-width:900px;margin:auto;padding:20px}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:20px;margin-bottom:15px}.search{display:flex;gap:8px}.search input{flex:1;padding:13px;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px}.btn{padding:11px 14px;background:#182033;color:#fff;border:1px solid #343c56;border-radius:10px;cursor:pointer;text-decoration:none}.person{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #25293a}.avatar{width:52px;height:52px;border-radius:50%;background:#252a40;display:grid;place-items:center;overflow:hidden;font-weight:bold}.avatar img{width:100%;height:100%;object-fit:cover}.muted{color:#9da5bd}.person a{color:#fff;text-decoration:none}</style></head><body><main><div class="card"><h1>Find CrowSpace Members</h1><div class="search"><input id="q" placeholder="Search by name or @username"><button class="btn" id="go">Search</button></div><p class="muted">Discover people across the CrowRules universe.</p></div><div class="card"><div id="results">Enter a name or username to search.</div><p><a class="btn" href="./">← CrowSpace</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const ini=s=>(s||"M").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();async function run(){const qv=q.value.trim();if(!qv){results.textContent="Enter a search term.";return}results.textContent="Searching…";const term="%"+qv.replace(/[%_]/g,"")+"%";const r=await db.from("crowspace_profiles").select("user_id,username,display_name,bio,avatar_url,location").or("username.ilike."+term+",display_name.ilike."+term).order("display_name").limit(50);if(r.error){results.textContent=r.error.message;return}results.innerHTML=(r.data||[]).map(p=>'<div class="person"><div class="avatar">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'">':ini(p.display_name))+'</div><div><a href="./profile.html?u='+encodeURIComponent(p.username||"")+'"><b>'+esc(p.display_name||"Member")+'</b></a><div class="muted">@'+esc(p.username||"member")+(p.location?" · "+esc(p.location):"")+'</div><div>'+esc(p.bio||"")+'</div></div></div>').join("")||"No members found."}go.onclick=run;q.addEventListener("keydown",e=>{if(e.key==="Enter")run()});const initial=new URLSearchParams(location.search).get("q");if(initial){q.value=initial;run()}</script></body></html>

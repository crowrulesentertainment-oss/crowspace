<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Albums</title><style>body{margin:0;background:#05050b;color:#fff;font:14px Arial}main{max-width:1100px;margin:auto;padding:20px}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:20px;margin-bottom:15px}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px}button,a{padding:10px 14px;border-radius:10px;background:#171a29;color:#fff;border:1px solid #343c56;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.album{background:#111522;border-radius:12px;overflow:hidden}.cover{height:150px;background:linear-gradient(135deg,#123,#624);background-size:cover;background-position:center}.pad{padding:13px}.muted{color:#9da5bd}.actions{display:flex;gap:7px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{max-width:850px;width:100%;max-height:90vh;overflow:auto;background:#0b0e18;border:1px solid #303752;border-radius:18px;padding:20px}.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.media{background:#151927;border-radius:12px;padding:10px}.thumb{width:100%;height:140px;object-fit:cover;border-radius:9px}@media(max-width:700px){.grid,.media-grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid,.media-grid{grid-template-columns:1fr}}</style></head><body><main><div class="card"><h1>📚 CrowSpace Albums</h1><p class="muted">Create, customize, and manage your CrowSpace photo and video collections.</p><input id="title" placeholder="Album title"><textarea id="desc" placeholder="Description"></textarea><input id="cover" placeholder="Cover image URL"><select id="privacy"><option value="public">Public</option><option value="private">Private</option></select><button id="create">Create Album</button> <span id="status" class="muted"></span></div><div class="card"><h2>My Albums</h2><div id="list" class="grid">Loading...</div><p><a href="./">← CrowSpace</a></p></div></main><div id="modal" class="modal"><div class="modalbox"><div class="actions"><button onclick="closeManager()">✕ Close</button></div><h2 id="mTitle">Manage Album</h2><input id="eTitle" placeholder="Album title"><textarea id="eDesc" placeholder="Description"></textarea><input id="eCover" placeholder="Cover image URL"><select id="ePrivacy"><option value="public">Public</option><option value="private">Private</option></select><button onclick="saveAlbum()">Save Changes</button><hr><h3>Media in this album</h3><p class="muted">Use ↑/↓ to reorder. Remove keeps the media in CrowSpace but takes it out of this album.</p><div id="mediaList" class="media-grid">Loading...</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me,currentAlbum;const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const $=id=>document.getElementById(id);
async function load(){me=(await db.auth.getSession()).data.session?.user;if(!me){$("list").innerHTML='<span class="muted">Sign in to create and manage albums.</span>';return}const r=await db.from("crowspace_albums").select("*").eq("user_id",me.id).order("created_at",{ascending:false});if(r.error){$("list").textContent=r.error.message;return}$("list").innerHTML=(r.data||[]).map(a=>'<article class="album"><div class="cover" style="background-image:url(\''+esc(a.cover_url||"")+'\')"></div><div class="pad"><h3>'+esc(a.title)+'</h3><p class="muted">'+esc(a.description||"")+'</p><p class="muted">'+(a.visibility==="public"?"🌐 Public":"🔒 Private")+'</p><div class="actions"><a href="./media.html?album='+a.id+'">Open Album</a><button onclick="manageAlbum(\''+a.id+'\')">Manage</button><button onclick="deleteAlbum(\''+a.id+'\')">Delete</button></div></div></article>').join("")||'<span class="muted">No albums yet.</span>'}
async function manageAlbum(id){const r=await db.from("crowspace_albums").select("*").eq("id",id).eq("user_id",me.id).single();if(r.error)return alert(r.error.message);currentAlbum=r.data;$("mTitle").textContent="Manage: "+r.data.title;$("eTitle").value=r.data.title;$("eDesc").value=r.data.description||"";$("eCover").value=r.data.cover_url||"";$("ePrivacy").value=r.data.visibility||"public";$("modal").classList.add("show");loadMedia()}
function closeManager(){$("modal").classList.remove("show");currentAlbum=null}
async function saveAlbum(){if(!currentAlbum)return;const r=await db.from("crowspace_albums").update({title:$("eTitle").value.trim(),description:$("eDesc").value.trim(),cover_url:$("eCover").value.trim()||null,visibility:$("ePrivacy").value,updated_at:new Date().toISOString()}).eq("id",currentAlbum.id).eq("user_id",me.id);if(r.error)return alert(r.error.message);currentAlbum.title=$("eTitle").value.trim();$("mTitle").textContent="Manage: "+currentAlbum.title;load()}
async function loadMedia(){const r=await db.from("crowspace_media").select("id,title,media_type,media_url,thumbnail_url,album_position").eq("album_id",currentAlbum.id).eq("user_id",me.id).order("album_position",{ascending:true}).order("created_at",{ascending:true});if(r.error){$("mediaList").textContent=r.error.message;return}const rows=r.data||[];$("mediaList").innerHTML=rows.map((m,i)=>'<div class="media"><img class="thumb" src="'+esc(m.thumbnail_url||m.media_url)+'" onerror="this.style.display=\'none\'"><b>'+esc(m.title||"Untitled")+'</b><div class="actions"><button '+(i===0?"disabled":"")+' onclick="moveMedia(\''+m.id+'\','+(i-1)+')">↑</button><button '+(i===rows.length-1?"disabled":"")+' onclick="moveMedia(\''+m.id+'\','+(i+1)+')">↓</button><button onclick="removeMedia(\''+m.id+'\')">Remove</button></div></div>').join("")||'<span class="muted">No media in this album.</span>'}
async function moveMedia(id,newIndex){const r=await db.from("crowspace_media").select("id,album_position").eq("album_id",currentAlbum.id).eq("user_id",me.id).order("album_position",{ascending:true}).order("created_at",{ascending:true});if(r.error)return alert(r.error.message);const rows=r.data||[],idx=rows.findIndex(x=>x.id===id);if(idx<0||newIndex<0||newIndex>=rows.length)return;const other=rows[newIndex];await db.from("crowspace_media").update({album_position:other.album_position}).eq("id",id).eq("user_id",me.id);await db.from("crowspace_media").update({album_position:rows[idx].album_position}).eq("id",other.id).eq("user_id",me.id);loadMedia()}
async function removeMedia(id){if(!confirm("Remove this media from the album?"))return;const r=await db.from("crowspace_media").update({album_id:null,album_position:0}).eq("id",id).eq("user_id",me.id);if(r.error)alert(r.error.message);else loadMedia()}
async function deleteAlbum(id){if(!confirm("Delete this album? Its media will remain in CrowSpace but become unassigned."))return;const r=await db.from("crowspace_albums").delete().eq("id",id).eq("user_id",me.id);if(r.error)alert(r.error.message);else load()}
$("create").onclick=async()=>{if(!me)return;const t=$("title").value.trim();if(!t)return;$("create").disabled=true;const r=await db.from("crowspace_albums").insert({user_id:me.id,title:t,description:$("desc").value.trim(),cover_url:$("cover").value.trim()||null,visibility:$("privacy").value});$("create").disabled=false;if(r.error){$("status").textContent=r.error.message;return}$("title").value="";$("desc").value="";$("cover").value="";$("privacy").value="public";$("status").textContent="Album created.";load()};load();
</script></body></html>

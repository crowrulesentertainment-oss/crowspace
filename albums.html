<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Albums</title><style>body{margin:0;background:#05050b;color:#fff;font:14px Arial}main{max-width:1000px;margin:auto;padding:20px}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:20px;margin-bottom:15px}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px}button,a{padding:10px 14px;border-radius:10px;background:#171a29;color:#fff;border:1px solid #343c56;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.album{background:#111522;border-radius:12px;overflow:hidden}.cover{height:150px;background:linear-gradient(135deg,#123,#624);background-size:cover;background-position:center}.pad{padding:13px}.muted{color:#9da5bd}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="card"><h1>📚 CrowSpace Albums</h1><p class="muted">Create and manage your CrowSpace photo and video collections.</p><input id="title" placeholder="Album title"><textarea id="desc" placeholder="Description"></textarea><input id="cover" placeholder="Cover image URL"><select id="privacy"><option value="public">Public</option><option value="private">Private</option></select><button id="create">Create Album</button> <span id="status" class="muted"></span></div><div class="card"><h2>My Albums</h2><div id="list" class="grid">Loading...</div><p><a href="./">← CrowSpace</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){me=(await db.auth.getSession()).data.session?.user;if(!me){list.innerHTML='<span class="muted">Sign in to create and manage albums.</span>';return}const r=await db.from("crowspace_albums").select("*").eq("user_id",me.id).order("created_at",{ascending:false});if(r.error){list.textContent=r.error.message;return}list.innerHTML=(r.data||[]).map(a=>'<article class="album"><div class="cover" style="background-image:url(\''+esc(a.cover_url||"")+'\')"></div><div class="pad"><h3>'+esc(a.title)+'</h3><p class="muted">'+esc(a.description||"")+'</p><p class="muted">🔒 '+esc(a.visibility)+'</p><div class="actions"><a href="./media.html?album='+a.id+'">Open Album</a><button onclick="editAlbum(\''+a.id+'\')">Edit</button><button onclick="deleteAlbum(\''+a.id+'\')">Delete</button></div></div></article>').join("")||'<span class="muted">No albums yet.</span>'}
async function editAlbum(id){const r=await db.from("crowspace_albums").select("*").eq("id",id).eq("user_id",me.id).single();if(r.error)return alert(r.error.message);const t=prompt("Album title",r.data.title);if(t===null)return;const d=prompt("Description",r.data.description||"");if(d===null)return;const cover=prompt("Cover image URL",r.data.cover_url||"");if(cover===null)return;const visibility=confirm("Make this album public? Click Cancel for private.")?"public":"private";const u=await db.from("crowspace_albums").update({title:t.trim(),description:d,cover_url:cover.trim()||null,visibility,updated_at:new Date().toISOString()}).eq("id",id).eq("user_id",me.id);if(u.error)alert(u.error.message);else load()}
async function deleteAlbum(id){if(!confirm("Delete this album? Its media will remain in CrowSpace but become unassigned."))return;const r=await db.from("crowspace_albums").delete().eq("id",id).eq("user_id",me.id);if(r.error)alert(r.error.message);else load()}
create.onclick=async()=>{if(!me)return;const t=title.value.trim();if(!t)return;create.disabled=true;const r=await db.from("crowspace_albums").insert({user_id:me.id,title:t,description:desc.value.trim(),cover_url:cover.value.trim()||null,visibility:privacy.value});create.disabled=false;if(r.error){status.textContent=r.error.message;return}title.value="";desc.value="";cover.value="";privacy.value="public";status.textContent="Album created.";load()};load();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Albums | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">My Nest</a><a href="caws.html">Caws</a><a href="groups.html">Groups</a><a href="events.html">Events</a><a class="active" href="albums.html">Photos</a></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">MEMORIES</p><h1>Photo Albums</h1><p class="muted">Build the visual history of your CrowSpace.</p></div><a class="btn primary" href="create-album.html">Create Album</a></div><div id="albums" class="grid three"></div></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const {data}=await crowSupabase.from("crowspace_albums").select("*").eq("visibility","public").order("created_at",{ascending:false});albums.innerHTML=(data||[]).map(a=>'<article class="card"><div class="caw-placeholder" style="aspect-ratio:16/9;background:'+(a.cover_url?'url('+CS.escape(a.cover_url)+') center/cover':'#e8ebf0')+'"></div><h3>'+CS.escape(a.title)+'</h3><p>'+CS.escape(a.description||"")+'</p></article>').join("")||'<div class="card"><h3>No albums yet.</h3><p>Create the first photo album.</p></div>'});</script></body></html>

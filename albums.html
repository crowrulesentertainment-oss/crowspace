<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Albums | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">MEMORIES</p><h1>Photo Albums</h1><p class="muted">Photos connected to members, creators and their CrowSpace activity.</p></div><a class="btn primary" href="create-album.html">Create Album</a></div><div id="filter" class="filter-banner"></div><div id="albums" class="grid three"></div></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{if(!await CS.user()){location.href="login.html";return}await CS.refreshHeader();const params=new URLSearchParams(location.search),user=params.get("user");const [{data,error},{data:photos}]=await Promise.all([crowSupabase.from("crowspace_albums").select("*").eq("visibility","public").order("created_at",{ascending:false}),crowSupabase.from("crowspace_album_photos").select("album_id")]);if(error){albums.innerHTML='<div class="card"><p>'+CS.escape(error.message)+'</p></div>';return}let rows=data||[];if(user){rows=rows.filter(x=>x.user_id===user);filter.innerHTML='<div class="card"><strong>Showing public albums from this member.</strong> <a href="albums.html">Show all albums</a></div>'}const graph=await CS.socialGraphMap(250),counts={};const esc=CS.escape;(photos||[]).forEach(x=>counts[x.album_id]=(counts[x.album_id]||0)+1);albums.innerHTML=rows.map(a=>{const p=graph[a.user_id]||{};return '<article class="card social-card">'+(a.cover_url?'<img class="card-media" src="'+CS.escape(a.cover_url)+'" alt="">':'<div class="caw-placeholder" style="aspect-ratio:16/9">📷</div>')+'<h3>'+CS.escape(a.title)+'</h3><p>'+CS.escape(a.description||"")+'</p><p class="group-members">'+Number(counts[a.id]||0)+' photos</p><div class="media-owner"><a class="avatar sm" href="profile.html?id='+encodeURIComponent(a.user_id)+'">'+esc((p.display_name||p.username||"C").slice(0,1).toUpperCase())+'</a><span><a href="profile.html?id='+encodeURIComponent(a.user_id)+'">'+esc(p.display_name||p.username||"CrowSpace Member")+'</a><br>'+CS.socialPersonMeta(p)+'</span></div><div class="activity-links"><a href="albums.html?user='+encodeURIComponent(a.user_id)+'">All Photos</a><a href="caws.html?user='+encodeURIComponent(a.user_id)+'">'+Number(p.caw_count||0)+' Caws</a><a href="events.html?user='+encodeURIComponent(a.user_id)+'">'+Number(p.event_count||0)+' Events</a></div></article>'}).join("")||'<div class="card"><h3>No albums yet.</h3><p>Create the first photo album.</p></div>'});
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Media</title><style>body{margin:0;background:#05050b;color:#fff;font:14px Arial;padding:25px}main{max-width:1000px;margin:auto}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:20px;margin-bottom:15px}.media{display:inline-block;vertical-align:top;width:30%;margin:1%;background:#111522;padding:12px;border-radius:12px}.media img{width:100%;aspect-ratio:1.5;object-fit:cover;border-radius:8px}.muted{color:#9da5bd}@media(max-width:700px){.media{width:100%;margin:0 0 12px}}</style></head><body><main><div class="card"><h1>📸 CrowSpace Media</h1><div id="status" class="muted"></div><div class="card" style="background:#111522"><h2>Upload Media</h2><input id="title" placeholder="Title"><textarea id="desc" placeholder="Description" style="width:100%;box-sizing:border-box;min-height:70px;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px;padding:12px"></textarea><input id="url" placeholder="Media URL (YouTube, image, video, etc.)"><button id="add">Add to My Media</button></div><div id="albumbar" class="card" style="background:#111522;display:none"><h2 id="albumTitle"></h2><div id="albumDesc" class="muted"></div><a id="allAlbums" href="./albums.html" style="color:#8fefff">View My Albums</a></div><div id="list">Loading...</div><a href="./" style="color:#fff">← CrowSpace</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me;const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){status.textContent="Sign in to add media.";return}const albumId=new URLSearchParams(location.search).get("album");if(albumId){const ar=await db.from("crowspace_albums").select("id,title,description").eq("id",albumId).maybeSingle();if(ar.data){albumbar.style.display="block";albumTitle.textContent=ar.data.title;albumDesc.textContent=ar.data.description||""}}const r=await db.from("crowspace_media").select("*").eq("visibility","public").order("created_at",{ascending:false}).limit(60);if(r.error){list.textContent="Media is being prepared.";return}const items=albumId?(r.data||[]).filter(x=>x.album_id===albumId):(r.data||[]);list.innerHTML=items.map(x=>'<article class="media">'+(x.thumbnail_url?'<img src="'+esc(x.thumbnail_url)+'">':"")+'<h3>'+esc(x.title||"Untitled")+'</h3><p class="muted">'+esc(x.description||"")+'</p>'+(x.media_url?'<a href="'+esc(x.media_url)+'" target="_blank" rel="noopener" style="color:#8fefff">Open Media</a>':"")+'</article>').join("")||'<p class="muted">No public media yet.</p>'}
add.onclick=async()=>{if(!me)return;const t=title.value.trim(),u=url.value.trim();if(!t||!u)return;add.disabled=true;const r=await db.from("crowspace_media").insert({user_id:me.id,media_type:"link",title:t,description:desc.value.trim(),media_url:u,visibility:"public",is_featured:false});add.disabled=false;if(r.error){status.textContent=r.error.message;return}title.value="";desc.value="";url.value="";status.textContent="Media added.";init()};init();
</script></body></html>

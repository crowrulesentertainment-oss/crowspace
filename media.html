<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Media</title><link rel="stylesheet" href="style.css"><style>.mediaPage{max-width:1100px;margin:auto;padding:28px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{display:block;position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#070a10}.tile img{width:100%;height:100%;object-fit:cover;display:block}.tileText{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.9));color:white;font-size:12px}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;place-items:center;z-index:50}.lightbox.open{display:grid}.lightbox img{max-width:95vw;max-height:90vh}.close{position:fixed;right:20px;top:18px}@media(max-width:700px){.gallery{grid-template-columns:repeat(2,1fr)}}.empty{padding:30px;text-align:center;color:var(--muted)}</style></head><body><div class="scanlines"></div><div class="ambient"></div><header class="topbar"><a class="brand" href="index.html"><span class="mark">C</span><span>CROWSPACE</span></a><nav><a href="index.html">Feed</a><a href="discover.html">Discover</a><a href="profile.html">Profile</a><a class="active" href="media.html">Media</a><a href="notifications.html">Notifications</a></nav><div class="account"><span id="memberState">CONNECTING…</span><button id="authBtn">Sign In</button></div></header><main class="shell"><section class="card mediaPage"><div class="eyebrow">CROWSPACE MEDIA</div><h1 style="font:800 28px Orbitron">MEDIA GALLERY</h1><p id="sub" style="color:var(--muted)">Loading…</p><a id="back" class="btn ghost" href="profile.html">PROFILE</a><div id="gallery" class="gallery" style="margin-top:22px"></div></section></main><div id="lightbox" class="lightbox"><button id="close" class="btn ghost close">CLOSE</button><img id="lightboxImg" alt="CrowSpace media"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>const uid=new URLSearchParams(location.search).get("u"),gallery=document.getElementById("gallery");const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));async function load(){if(!uid){gallery.innerHTML="<div class='empty'>No creator selected.</div>";return}const [pr,po]=await Promise.all([db.from("crowspace_profiles").select("username,display_name").eq("user_id",uid).maybeSingle(),db.from("crowspace_posts").select("id,body,media_url,created_at").eq("user_id",uid).not("media_url","is",null).order("created_at",{ascending:false}).limit(100)]);if(pr.error||!pr.data){gallery.innerHTML="<div class='empty'>Profile not found.</div>";return}document.getElementById("sub").textContent=(pr.data.display_name||pr.data.username||"Creator")+" · "+(po.data?.length||0)+" media posts";document.getElementById("back").href="profile.html?u="+encodeURIComponent(uid);if(po.error||!po.data?.length){gallery.innerHTML="<div class='empty'>No media Caws yet.</div>";return}gallery.innerHTML=po.data.map(x=>'<a class="tile" href="'+esc(x.media_url)+'" data-media="'+esc(x.media_url)+'"><img src="'+esc(x.media_url)+'" alt="CrowSpace media" loading="lazy"><div class="tileText">'+esc(x.body||"Media Caw")+'</div></a>').join("")}gallery.onclick=e=>{const a=e.target.closest("[data-media]");if(!a)return;e.preventDefault();document.getElementById("lightboxImg").src=a.dataset.media;document.getElementById("lightbox").classList.add("open")};document.getElementById("close").onclick=()=>document.getElementById("lightbox").classList.remove("open");load();</script></body></html>

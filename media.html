<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Media</title><style>body{margin:0;background:#05050b;color:#fff;font:14px Arial;padding:25px}main{max-width:1000px;margin:auto}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:20px;margin-bottom:15px}.media{display:inline-block;vertical-align:top;width:30%;margin:1%;background:#111522;padding:12px;border-radius:12px}.media img{width:100%;aspect-ratio:1.5;object-fit:cover;border-radius:8px}.muted{color:#9da5bd}@media(max-width:700px){.media{width:100%;margin:0 0 12px}}</style></head><body><main><div class="card"><h1>📸 CrowSpace Media</h1><div id="status" class="muted"></div><div class="card" style="background:#111522"><h2>Upload Media</h2><input id="title" placeholder="Title"><textarea id="desc" placeholder="Description" style="width:100%;box-sizing:border-box;min-height:70px;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px;padding:12px"></textarea><input id="file" type="file" accept="image/*,video/mp4,video/webm"><select id="albumSelect"><option value="">No Album</option></select><input id="url" placeholder="Or paste a Media URL"><button id="add">Upload / Add to My Media</button></div><div id="albumbar" class="card" style="background:#111522;display:none"><h2 id="albumTitle"></h2><div id="albumDesc" class="muted"></div><a id="allAlbums" href="./albums.html" style="color:#8fefff">View My Albums</a></div><div id="list">Loading...</div><a href="./" style="color:#fff">← CrowSpace</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me,albumId;const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){status.textContent="Sign in to add media.";return}albumId=new URLSearchParams(location.search).get("album");if(albumId){const ar=await db.from("crowspace_albums").select("id,title,description").eq("id",albumId).maybeSingle();if(ar.data){albumbar.style.display="block";albumTitle.textContent=ar.data.title;albumDesc.textContent=ar.data.description||""}}await loadAlbums();const r=await db.from("crowspace_media").select("*").eq("visibility","public").order("created_at",{ascending:false}).limit(60);if(r.error){list.textContent="Media is being prepared.";return}const items=albumId?(r.data||[]).filter(x=>x.album_id===albumId):(r.data||[]);list.innerHTML=items.map(x=>'<article class="media">'+(x.thumbnail_url?'<img src="'+esc(x.thumbnail_url)+'">':"")+'<h3>'+esc(x.title||"Untitled")+'</h3><p class="muted">'+esc(x.description||"")+'</p>'+(x.media_url?'<a href="'+esc(x.media_url)+'" target="_blank" rel="noopener" style="color:#8fefff">Open Media</a>':"")+'</article>').join("")||'<p class="muted">No public media yet.</p>'}
async function loadAlbums(){const r=await db.from("crowspace_albums").select("id,title").eq("user_id",me.id).order("created_at",{ascending:false});if(!r.error)(r.data||[]).forEach(a=>{const o=document.createElement("option");o.value=a.id;o.textContent=a.title;albumSelect.appendChild(o)});if(albumId)albumSelect.value=albumId} add.onclick=async()=>{if(!me)return;const t=title.value.trim(),u=url.value.trim(),f=file.files[0];if(!t||(!u&&!f))return;add.disabled=true;let mediaUrl=u,mediaType="link";if(f){const ext=f.name.split(".").pop().toLowerCase();const path=me.id+"/"+crypto.randomUUID()+"."+ext;const up=await db.storage.from("crowspace-media").upload(path,f,{contentType:f.type,upsert:false});if(up.error){status.textContent=up.error.message;add.disabled=false;return}mediaUrl=db.storage.from("crowspace-media").getPublicUrl(path).data.publicUrl;mediaType=f.type.startsWith("video/")?"video":"image"}const r=await db.from("crowspace_media").insert({user_id:me.id,album_id:albumSelect.value||null,media_type:mediaType,title:t,description:desc.value.trim(),media_url:mediaUrl,storage_path:f?me.id+"/"+path.split("/").pop():null,visibility:"public",is_featured:false});add.disabled=false;if(r.error){status.textContent=r.error.message;return}title.value="";desc.value="";url.value="";status.textContent="Media added.";init()};init();
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrowSpace Media 2.0</title>
<style>
:root{--a:#20e6ff}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.brand{font-size:25px;font-weight:900}.pill{color:#8ff6ff}.muted{color:#9da5bd}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.hero{background:linear-gradient(135deg,#101d2c,#30194b,#0d0f18)}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.search{display:flex;gap:8px;flex:1;min-width:240px}.search input{width:100%;padding:12px;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px}.btn,a.btn{display:inline-block;padding:10px 13px;border:1px solid #343c56;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(90deg,#126d7a,#56358c)!important;border:0!important}.filter.active{outline:2px solid var(--a)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#111522;padding:12px;border-radius:12px;text-align:center}.stat b{font-size:21px;display:block}.mediaGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.media{background:#10131f;border:1px solid #292e42;border-radius:15px;overflow:hidden}.thumb{width:100%;aspect-ratio:16/10;background:#050508;display:grid;place-items:center;overflow:hidden}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.play{font-size:42px}.mediaBody{padding:13px}.title{font-size:16px;font-weight:800}.meta{font-size:12px;color:#9da5bd;margin-top:5px}.desc{color:#d8ddeb;line-height:1.4;margin:7px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;padding:35px}.uploadGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.uploadGrid input,.uploadGrid textarea,.uploadGrid select{width:100%;padding:11px;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px}.uploadGrid textarea{min-height:70px;resize:vertical}.wide{grid-column:1/-1}.viewer{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:15px;z-index:50}.viewer.show{display:flex}.viewerbox{max-width:1050px;width:100%;max-height:94vh;overflow:auto;background:#0b0e18;border:1px solid #303752;border-radius:18px;padding:18px}.viewerbox img,.viewerbox video{width:100%;max-height:62vh;object-fit:contain;background:#000;border-radius:10px}.viewerbar,.vieweractions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.viewerbar{justify-content:space-between}.viewer input{flex:1;min-width:180px;padding:10px;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px}.comments{max-height:200px;overflow:auto;margin-top:10px}.comment{padding:8px;border-bottom:1px solid #25293a}.likeon{color:#ff6bcb}.toast{min-height:18px}@media(max-width:850px){.mediaGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){main{padding:10px}.top{align-items:flex-start;flex-direction:column}.mediaGrid,.uploadGrid{grid-template-columns:1fr}.wide{grid-column:auto}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main>
<div class="top"><div class="brand">🖤 CrowSpace <span class="pill">Media 2.0</span></div><a class="btn" href="./">← CrowSpace</a></div>
<section class="card hero"><h1>📸 CrowSpace Media</h1><p class="muted">Explore photos, videos, links, albums and community media across CrowSpace.</p>
<div class="stats"><div class="stat"><b id="total">0</b><span class="muted">Media</span></div><div class="stat"><b id="photos">0</b><span class="muted">Images</span></div><div class="stat"><b id="videos">0</b><span class="muted">Videos</span></div><div class="stat"><b id="views">0</b><span class="muted">Views</span></div></div></section>
<section class="card"><h2>Upload Media</h2><div class="uploadGrid"><input id="title" placeholder="Title"><select id="albumSelect"><option value="">No Album</option></select><textarea id="desc" class="wide" placeholder="Description"></textarea><input id="file" type="file" accept="image/*,video/mp4,video/webm"><input id="url" placeholder="Or paste a Media URL"><button id="add" class="btn primary wide">Upload / Add to My Media</button></div><div id="status" class="muted" style="margin-top:9px"></div></section>
<section class="card"><div class="toolbar"><div class="search"><input id="q" placeholder="Search titles, descriptions, creators, albums…"><button class="btn primary" id="go">Search</button></div><button class="btn filter active" data-filter="all">All</button><button class="btn filter" data-filter="image">📷 Images</button><button class="btn filter" data-filter="video">🎬 Videos</button><button class="btn filter" data-filter="link">🔗 Links</button><button class="btn filter" data-filter="featured">⭐ Featured</button><button class="btn filter" data-filter="mine">My Media</button><a class="btn" href="./albums.html">Albums</a></div></section>
<section class="card"><div id="count" class="muted"></div><div id="list" class="mediaGrid"><div class="empty">Loading…</div></div></section>
<div id="viewer" class="viewer"><div class="viewerbox"><div class="viewerbar"><button class="btn" onclick="closeViewer()">✕ Close</button><div class="vieweractions"><button class="btn" onclick="prevMedia()">← Previous</button><button class="btn" onclick="nextMedia()">Next →</button></div></div><div id="viewerContent" style="margin-top:10px"></div><h2 id="viewerTitle"></h2><p id="viewerDesc" class="muted"></p><div id="viewerMeta" class="meta"></div><div class="vieweractions" style="margin-top:10px"><button id="likeBtn" class="btn" onclick="toggleViewerLike()">♡ Like</button></div><div id="viewerComments" class="comments"></div><div class="vieweractions"><input id="commentText" placeholder="Write a comment"><button class="btn primary" onclick="postViewerComment()">Post</button></div></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me=null,items=[],baseItems=[],filter="all",viewerIndex=0,currentViewerId=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini=s=>(s||"Member").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
async function init(){me=(await db.auth.getSession()).data.session?.user||null;await loadAlbums();await loadMedia()}
async function loadAlbums(){albumSelect.innerHTML='<option value="">No Album</option>';if(!me)return;const r=await db.from("crowspace_albums").select("id,title").eq("user_id",me.id).order("created_at",{ascending:false});(r.data||[]).forEach(a=>{const o=document.createElement("option");o.value=a.id;o.textContent=a.title;albumSelect.appendChild(o)})}
async function loadMedia(){
 list.innerHTML='<div class="empty">Loading media…</div>';
 const r=await db.from("crowspace_media").select("id,user_id,album_id,media_type,title,description,media_url,thumbnail_url,visibility,is_featured,created_at").eq("visibility","public").order("created_at",{ascending:false}).limit(150);
 if(r.error){list.innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}
 baseItems=r.data||[];
 if(me){const own=await db.from("crowspace_media").select("id,user_id,album_id,media_type,title,description,media_url,thumbnail_url,visibility,is_featured,created_at").eq("user_id",me.id).order("created_at",{ascending:false}).limit(150);const map=new Map(baseItems.map(x=>[x.id,x]));(own.data||[]).forEach(x=>map.set(x.id,x));baseItems=[...map.values()].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))}
 const ids=[...new Set(baseItems.map(x=>x.user_id).filter(Boolean))], aids=[...new Set(baseItems.map(x=>x.album_id).filter(Boolean))], mapP={},mapA={};
 if(ids.length){const p=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids);(p.data||[]).forEach(x=>mapP[x.user_id]=x)}
 if(aids.length){const a=await db.from("crowspace_albums").select("id,title").in("id",aids);(a.data||[]).forEach(x=>mapA[x.id]=x)}
 const mids=baseItems.map(x=>x.id);let likes={},comments={},views={};
 if(mids.length){const [l,c,v]=await Promise.all([db.from("crowspace_media_likes").select("media_id,user_id").in("media_id",mids),db.from("crowspace_media_comments").select("media_id").in("media_id",mids),db.from("crowspace_media_views").select("media_id").in("media_id",mids)]);(l.data||[]).forEach(x=>likes[x.media_id]=(likes[x.media_id]||0)+1);(c.data||[]).forEach(x=>comments[x.media_id]=(comments[x.media_id]||0)+1);(v.data||[]).forEach(x=>views[x.media_id]=(views[x.media_id]||0)+1)}
 items=baseItems.map(x=>({...x,profile:mapP[x.user_id]||{},album:mapA[x.album_id]||{},likeCount:likes[x.id]||0,commentCount:comments[x.id]||0,viewCount:views[x.id]||0}));
 render();
}
function visible(){const term=q.value.trim().toLowerCase();return items.filter(x=>{if(filter==="image"&&x.media_type!=="image")return false;if(filter==="video"&&x.media_type!=="video")return false;if(filter==="link"&&x.media_type!=="link")return false;if(filter==="featured"&&!x.is_featured)return false;if(filter==="mine"&&x.user_id!==me?.id)return false;if(!term)return true;return [x.title,x.description,x.profile.display_name,x.profile.username,x.album.title].some(v=>String(v||"").toLowerCase().includes(term))})}
function render(){const all=visible();count.textContent=all.length+" item"+(all.length===1?"":"s")+" shown";total.textContent=items.length;photos.textContent=items.filter(x=>x.media_type==="image").length;videos.textContent=items.filter(x=>x.media_type==="video").length;views.textContent=items.reduce((n,x)=>n+x.viewCount,0);if(!all.length){list.innerHTML='<div class="empty">No media matches your search or filter.</div>';return}list.innerHTML=all.map(x=>{const i=items.indexOf(x);return '<article class="media"><div class="thumb">'+(x.media_type==="video"?(x.thumbnail_url?'<img src="'+esc(x.thumbnail_url)+'">':'<span class="play">▶</span>'):(x.thumbnail_url||x.media_type==="image"?'<img src="'+esc(x.thumbnail_url||x.media_url)+'" alt="">':'<span class="play">🔗</span>'))+'</div><div class="mediaBody"><div class="title">'+esc(x.title||"Untitled")+(x.is_featured?' ⭐':"")+'</div><div class="meta">'+(x.profile.display_name?esc(x.profile.display_name):"Member")+(x.album.title?" · 📁 "+esc(x.album.title):"")+' · '+x.likeCount+' ♥ · '+x.commentCount+' 💬 · '+x.viewCount+' views</div><div class="desc">'+esc(x.description||"")+'</div><div class="actions"><button class="btn primary" onclick="openViewer('+i+')">Open Viewer</button><a class="btn" href="./profile.html?u='+encodeURIComponent(x.profile.username||"")+'">Profile</a></div></div></article>'}).join("")}
async function openViewer(i){viewerIndex=i;currentViewerId=items[i]?.id;if(!items[i])return;viewer.classList.add("show");document.body.style.overflow="hidden";await renderViewer()}
function closeViewer(){viewer.classList.remove("show");document.body.style.overflow=""}
async function prevMedia(){if(items.length){viewerIndex=(viewerIndex-1+items.length)%items.length;currentViewerId=items[viewerIndex].id;await renderViewer()}}
async function nextMedia(){if(items.length){viewerIndex=(viewerIndex+1)%items.length;currentViewerId=items[viewerIndex].id;await renderViewer()}}
async function renderViewer(){const x=items[viewerIndex];viewerTitle.textContent=x.title||"Untitled";viewerDesc.textContent=x.description||"";viewerMeta.textContent=(x.profile.display_name||"Member")+(x.album.title?" · "+x.album.title:"")+" · "+x.likeCount+" likes · "+x.commentCount+" comments · "+x.viewCount+" views";viewerContent.innerHTML=x.media_type==="video"?'<video controls autoplay src="'+esc(x.media_url)+'"></video>':x.media_type==="link"?'<p><a class="btn primary" target="_blank" rel="noopener" href="'+esc(x.media_url)+'">Open Media Link</a></p>':'<img src="'+esc(x.media_url)+'" alt="'+esc(x.title||"Media")+'">';if(me){const l=await db.from("crowspace_media_likes").select("media_id").eq("media_id",x.id).eq("user_id",me.id).maybeSingle();likeBtn.textContent=l.data?"♥ Liked":"♡ Like";likeBtn.className=l.data?"btn likeon":"btn";await db.from("crowspace_media_views").upsert({media_id:x.id,user_id:me.id,viewed_at:new Date().toISOString()},{onConflict:"media_id,user_id"})}await loadViewerComments()}
async function toggleViewerLike(){if(!me)return alert("Sign in to like media.");const x=items[viewerIndex];const ql=await db.from("crowspace_media_likes").select("media_id").eq("media_id",x.id).eq("user_id",me.id).maybeSingle();if(ql.data)await db.from("crowspace_media_likes").delete().eq("media_id",x.id).eq("user_id",me.id);else await db.from("crowspace_media_likes").insert({media_id:x.id,user_id:me.id});await loadMedia();viewerIndex=Math.max(0,items.findIndex(y=>y.id===x.id));currentViewerId=x.id;await renderViewer()}
async function loadViewerComments(){const r=await db.from("crowspace_media_comments").select("content,created_at,author_id").eq("media_id",currentViewerId).order("created_at",{ascending:false}).limit(30);viewerComments.innerHTML=(r.data||[]).map(c=>'<div class="comment">'+esc(c.content)+' <span class="muted">'+new Date(c.created_at).toLocaleString()+'</span></div>').join("")||'<span class="muted">No comments yet.</span>'}
async function postViewerComment(){if(!me)return alert("Sign in to comment.");const v=commentText.value.trim();if(!v||!currentViewerId)return;const r=await db.from("crowspace_media_comments").insert({media_id:currentViewerId,author_id:me.id,content:v});if(r.error)return alert(r.error.message);commentText.value="";await loadMedia();viewerIndex=Math.max(0,items.findIndex(y=>y.id===currentViewerId));await renderViewer()}
add.onclick=async()=>{if(!me){status.textContent="Sign in to upload media.";return}const t=title.value.trim(),u=url.value.trim(),f=file.files[0];if(!t||(!u&&!f)){status.textContent="Add a title and either a file or URL.";return}add.disabled=true;status.textContent="Uploading…";let mediaUrl=u,mediaType="link",storagePath=null;if(f){const ext=f.name.split(".").pop().toLowerCase(),path=me.id+"/"+crypto.randomUUID()+"."+ext;const up=await db.storage.from("crowspace-media").upload(path,f,{contentType:f.type,upsert:false});if(up.error){status.textContent=up.error.message;add.disabled=false;return}mediaUrl=db.storage.from("crowspace-media").getPublicUrl(path).data.publicUrl;mediaType=f.type.startsWith("video/")?"video":"image";storagePath=path}const r=await db.from("crowspace_media").insert({user_id:me.id,album_id:albumSelect.value||null,media_type:mediaType,title:t,description:desc.value.trim(),media_url:mediaUrl,storage_path:storagePath,visibility:"public",is_featured:false});add.disabled=false;if(r.error){status.textContent=r.error.message;return}title.value="";desc.value="";url.value="";file.value="";status.textContent="Media added.";await loadMedia()}
go.onclick=render;q.addEventListener("keydown",e=>{if(e.key==="Enter")render()});document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});document.addEventListener("keydown",e=>{if(!viewer.classList.contains("show"))return;if(e.key==="Escape")closeViewer();if(e.key==="ArrowLeft")prevMedia();if(e.key==="ArrowRight")nextMedia()});
init();
</script></body></html>

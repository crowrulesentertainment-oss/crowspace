<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Media</title><link rel="stylesheet" href="style.css"><style>.mediaPage{max-width:1100px;margin:auto;padding:28px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{display:block;position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#070a10}.tile img{width:100%;height:100%;object-fit:cover;display:block}.tile video{width:100%;height:100%;object-fit:cover;display:block}.reel video{width:100%;height:100%;object-fit:cover;display:block}.reel{position:relative}.tileText{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.9));color:white;font-size:12px}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;place-items:center;z-index:50}.lightbox.open{display:grid}.lightbox img,.lightbox video{max-width:90vw;max-height:82vh;object-fit:contain}.nav{position:fixed;top:50%;transform:translateY(-50%);font-size:28px}.prev{left:20px}.next{right:20px}.lightbox{padding:60px 70px}.viewerMeta{position:fixed;bottom:20px}.close{position:fixed;right:20px;top:18px}@media(max-width:700px){.gallery{grid-template-columns:repeat(2,1fr)}}.empty{padding:30px;text-align:center;color:var(--muted)}.reels{display:block;margin:24px auto;max-width:520px}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.sectionHead h2{font-family:Orbitron;margin:0;font-size:16px}.sectionHead span{color:var(--muted);font-size:11px}.reelFeed{display:grid;gap:18px}.reel{max-width:430px;margin:20px auto;aspect-ratio:9/16;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#000} .reel video{object-fit:cover}</style></head><body><div class="scanlines"></div><div class="ambient"></div><header class="topbar"><a class="brand" href="index.html"><span class="mark">C</span><span>CROWSPACE</span></a><nav><a href="index.html">Feed</a><a href="discover.html">Discover</a><a href="profile.html">Profile</a><a class="active" href="media.html">Media</a><a href="notifications.html">Notifications</a></nav><div class="account"><span id="memberState">CONNECTING…</span><button id="authBtn">Sign In</button></div></header><main class="shell"><section class="card mediaPage"><div class="eyebrow">CROWSPACE MEDIA</div><h1 style="font:800 28px Orbitron">MEDIA GALLERY</h1><p id="sub" style="color:var(--muted)">Loading…</p><a id="back" class="btn ghost" href="profile.html">PROFILE</a><div id="gallery" class="gallery" style="margin-top:22px"></div></section></main><section id="reels" class="reels"><div class="sectionHead"><h2>🎬 CROW REELS</h2><span>Vertical video Caws</span></div><div id="reelFeed"></div></section><div id="lightbox" class="lightbox"><button id="prev" class="btn ghost nav prev">‹</button><div id="viewer"></div><button id="next" class="btn ghost nav next">›</button><button id="close" class="btn ghost close">CLOSE</button><div id="viewerMeta"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>const uid=new URLSearchParams(location.search).get("u"),gallery=document.getElementById("gallery");let items=[],current=0;const reelFeed=document.getElementById("reelFeed");const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));async function load(){if(!uid){gallery.innerHTML="<div class='empty'>No creator selected.</div>";return}const [pr,po]=await Promise.all([db.from("crowspace_profiles").select("username,display_name").eq("user_id",uid).maybeSingle(),db.from("crowspace_posts").select("id,user_id,body,media_url,created_at").eq("user_id",uid).not("media_url","is",null).order("created_at",{ascending:false}).limit(100)]);if(pr.error||!pr.data){gallery.innerHTML="<div class='empty'>Profile not found.</div>";return}document.getElementById("sub").textContent=(pr.data.display_name||pr.data.username||"Creator")+" · "+(po.data?.length||0)+" media posts";document.getElementById("back").href="profile.html?u="+encodeURIComponent(uid);if(po.error||!po.data?.length){gallery.innerHTML="<div class='empty'>No media Caws yet.</div>";return}items=po.data;const ids=[...new Set(items.map(x=>x.user_id).filter(Boolean))];let creators={};if(ids.length){const {data:ps}=await db.from("crowspace_profiles").select("user_id,display_name,username,avatar_url").in("user_id",ids);(ps||[]).forEach(p=>creators[p.user_id]=p)}gallery.innerHTML=po.data.map(x=>'<a class="tile" href="'+esc(x.media_url)+'" data-media="'+esc(x.media_url)+'">'+(/\\.(mp4|webm|mov)(\\?|$)/i.test(x.media_url)?'<video src="'+esc(x.media_url)+'" muted preload="metadata" playsinline></video>':'<img src="'+esc(x.media_url)+'" alt="CrowSpace media" loading="lazy">')+'<div class="tileText">'+esc(x.body||"Media Caw")+'</div></a>').join("")}function isVideo(u){return /\.(mp4|webm|mov)(\?|$)/i.test(u)}\nif(reelFeed)reelFeed.innerHTML=items.filter(x=>isVideo(x.media_url)).map(x=>`<article class="reel" data-id="${x.id}"><a class="reelCreator" href="profile.html?u=${x.user_id}" onclick="event.stopPropagation()">${creators[x.user_id]?.avatar_url?`<img src="${esc(creators[x.user_id].avatar_url)}" alt="">`:`<span class="avatar">${esc((creators[x.user_id]?.display_name||"CR").slice(0,2).toUpperCase())}</span>`}<span>${esc(creators[x.user_id]?.display_name||creators[x.user_id]?.username||"CREATOR")}</span></a><button class="reelFollow" data-follow="${x.user_id}">FOLLOW</button><video src="${esc(x.media_url)}" muted loop playsinline preload="metadata"></video><div class="commentPanel"><div class="commentsList">Loading comments…</div><form class="commentForm"><input maxlength="500" placeholder="Add a comment…"><button>SEND</button></form></div><div class="reelActions"><button data-act="like">♥ <span>0</span></button><button data-act="comment">💬 <span>0</span></button><button data-act="repost">↻ <span>0</span></button><button data-act="save">🔖 <span>0</span></button></div><div class="reelInfo"><strong>${esc(x.body||"Video Caw")}</strong></div></article>`).join("");\nasync function loadComments(card,id){const list=card.querySelector(".commentsList");const {data}=await db.from("crowspace_comments").select("id,user_id,body,created_at").eq("post_id",id).order("created_at",{ascending:true}).limit(50);const ids=[...new Set((data||[]).map(x=>x.user_id))];let ps={};if(ids.length){const {data:p}=await db.from("crowspace_profiles").select("user_id,display_name,username").in("user_id",ids);(p||[]).forEach(x=>ps[x.user_id]=x)}list.innerHTML=(data||[]).map(x=>`<div class="commentRow"><strong>${esc(ps[x.user_id]?.display_name||ps[x.user_id]?.username||"Crow")}</strong> ${esc(x.body)}<br><small>${new Date(x.created_at).toLocaleString()}</small></div>`).join("")||"<small>No comments yet.</small>"}\nif(reelFeed){(async()=>{const {data:{session}}=await db.auth.getSession();if(session){const ids=[...new Set(items.map(x=>x.user_id).filter(Boolean))];if(ids.length){const {data:f}=await db.from("crowspace_follows").select("followed_user_id").eq("follower_id",session.user.id).in("followed_user_id",ids);(f||[]).forEach(z=>{const b=reelFeed.querySelector(`[data-follow="${z.followed_user_id}"]`);if(b)b.textContent="FOLLOWING"})}}})();reelFeed.onclick=async e=>{const cf=e.target.closest("[data-act="+"comment"+"]");if(cf){const card=cf.closest(".reel"),panel=card.querySelector(".commentPanel");panel.classList.toggle("open");if(panel.classList.contains("open"))loadComments(card,card.dataset.id);return}const form=e.target.closest(".commentForm");if(fb){e.preventDefault();const {data:{session}}=await db.auth.getSession();if(!session){location.href="login.html";return}const target=fb.dataset.follow;if(target===session.user.id)return;const {data:old}=await db.from("crowspace_follows").select("follower_id").eq("follower_id",session.user.id).eq("followed_user_id",target).maybeSingle();if(old){await db.from("crowspace_follows").delete().eq("follower_id",session.user.id).eq("followed_user_id",target);fb.textContent="FOLLOW"}else{await db.from("crowspace_follows").insert({follower_id:session.user.id,followed_user_id:target});fb.textContent="FOLLOWING"}return}if(reelFeed.onclick&&false)return;const b=e.target.closest("button[data-act]");if(!b)return;const card=b.closest(".reel"),id=card.dataset.id,act=b.dataset.act;const {data:{session}}=await db.auth.getSession();if(!session){location.href="login.html";return}const map={like:"like",comment:"comment",repost:"repost",save:"save"};const {data:old}=await db.from("crowspace_social_interactions").select("id").eq("target_type","post").eq("target_id",id).eq("user_id",session.user.id).eq("interaction_type",map[act]).maybeSingle();if(old)await db.from("crowspace_social_interactions").delete().eq("id",old.id);else await db.from("crowspace_social_interactions").insert({target_type:"post",target_id:id,user_id:session.user.id,interaction_type:map[act]});const {count}=await db.from("crowspace_social_interactions").select("id",{count:"exact",head:true}).eq("target_type","post").eq("target_id",id).eq("interaction_type",map[act]);b.querySelector("span").textContent=count||0};const observer=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector("video");if(e.isIntersecting){v.play().catch(()=>{})}else v.pause()}),{threshold:.65});reelFeed.querySelectorAll(".reel").forEach(r=>observer.observe(r));}\ngallery.onclick=e=>{const a=e.target.closest("[data-media]");if(!a)return;e.preventDefault();current=[...gallery.querySelectorAll("[data-media]")].indexOf(a);show(current)};function show(i){if(!items.length)return;current=(i+items.length)%items.length;const x=items[current],u=x.media_url,v=document.getElementById("viewer");v.innerHTML=/\.(mp4|webm|mov)(\?|$)/i.test(u)?'<video src="'+esc(u)+'" controls autoplay playsinline></video>':'<img src="'+esc(u)+'" alt="CrowSpace media">';document.getElementById("viewerMeta").textContent=(current+1)+" / "+items.length+" · "+(x.body||"Media Caw");document.getElementById("lightbox").classList.add("open")}document.getElementById("close").onclick=()=>document.getElementById("lightbox").classList.remove("open");document.getElementById("prev").onclick=()=>show(current-1);document.getElementById("next").onclick=()=>show(current+1);document.addEventListener("keydown",e=>{if(!document.getElementById("lightbox").classList.contains("open"))return;if(e.key==="Escape")document.getElementById("lightbox").classList.remove("open");if(e.key==="ArrowLeft")show(current-1);if(e.key==="ArrowRight")show(current+1)});load();</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrowSpace Media 5.0</title>
<style>
:root{--a:#20e6ff;--p:#8d5cff;--bg:#05050b;--card:#0d101a;--line:#292e42;--muted:#9da5bd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17132d 0,transparent 35%),var(--bg);color:#f5f7ff;font:14px Arial,sans-serif}
main{max-width:1250px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.brand{font-size:25px;font-weight:900}.pill{color:var(--a)}
.card{background:rgba(13,16,26,.94);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 12px 35px #0005}.hero{background:linear-gradient(135deg,#101d2c,#30194b,#0d0f18)}
.muted{color:var(--muted)}h1,h2{margin-top:0}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.search{display:flex;gap:8px;flex:1;min-width:250px}.search input,.uploadGrid input,.uploadGrid textarea,.uploadGrid select,.viewer input{width:100%;padding:12px;background:#080a12;color:#fff;border:1px solid var(--line);border-radius:10px}
.btn,a.btn{display:inline-block;padding:10px 13px;border:1px solid #343c56;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(90deg,#126d7a,#56358c)!important;border:0!important}.filter.active{outline:2px solid var(--a)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{background:#111522;padding:12px;border-radius:12px;text-align:center}.stat b{font-size:21px;display:block}
.uploadGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.uploadGrid textarea{min-height:75px;resize:vertical}.wide{grid-column:1/-1}
.mediaGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.media{background:#10131f;border:1px solid var(--line);border-radius:15px;overflow:hidden;transition:.18s}.media:hover{transform:translateY(-2px);border-color:#4d5879}
.thumb{width:100%;aspect-ratio:16/10;background:#050508;display:grid;place-items:center;overflow:hidden;position:relative}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.play{font-size:45px}.badge{position:absolute;top:9px;left:9px;background:#05050bcc;padding:5px 8px;border-radius:99px;font-size:11px}.mediaBody{padding:13px}.creator{display:flex;align-items:center;gap:8px;margin:7px 0}.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#20253a;display:grid;place-items:center;font-size:11px;font-weight:800}.title{font-size:16px;font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px}.desc{color:#d8ddeb;line-height:1.4;margin:7px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;padding:40px}.sortline{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
.albumRow{display:flex;gap:10px;overflow:auto;padding-bottom:4px}.album{min-width:150px;background:#111522;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}.album img{width:100%;height:75px;object-fit:cover;border-radius:8px;background:#050508}.album b{display:block;margin-top:7px}
.viewer{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:15px;z-index:50}.viewer.show{display:flex}.viewerbox{max-width:1080px;width:100%;max-height:94vh;overflow:auto;background:#0b0e18;border:1px solid #303752;border-radius:18px;padding:18px}.viewerbox img,.viewerbox video{width:100%;max-height:60vh;object-fit:contain;background:#000;border-radius:10px}.viewerbar,.vieweractions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.viewerbar{justify-content:space-between}.comments{max-height:220px;overflow:auto;margin-top:10px}.comment{padding:9px;border-bottom:1px solid #25293a}.likeon{color:#ff6bcb}.toast{position:fixed;right:18px;bottom:18px;background:#111522;border:1px solid #3a4260;padding:12px 15px;border-radius:12px;display:none;z-index:80}.toast.show{display:block}
@media(max-width:900px){.mediaGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){main{padding:10px}.top{flex-direction:column;align-items:flex-start}.mediaGrid,.uploadGrid{grid-template-columns:1fr}.wide{grid-column:auto}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main>
<div class="top"><div class="brand">🖤 CrowSpace <span class="pill">Media 4.0</span></div><a class="btn" href="./">← CrowSpace</a></div>
<section class="card hero"><h1>📸 CrowSpace Media</h1><p class="muted">A community media hub for photos, videos, links and albums.</p>
<div class="stats"><div class="stat"><b id="total">0</b><span class="muted">Media</span></div><div class="stat"><b id="photos">0</b><span class="muted">Images</span></div><div class="stat"><b id="videos">0</b><span class="muted">Videos</span></div><div class="stat"><b id="likes">0</b><span class="muted">Likes</span></div><div class="stat"><b id="views">0</b><span class="muted">Views</span></div></div></section>

<section class="card"><h2>Upload to CrowSpace</h2><div class="uploadGrid"><input id="title" placeholder="Title"><select id="albumSelect"><option value="">No Album</option></select><textarea id="desc" class="wide" placeholder="Description"></textarea><input id="file" type="file" accept="image/*,video/mp4,video/webm"><input id="url" placeholder="Or paste a media URL"><button id="add" class="btn primary wide">Upload / Add Media</button></div><div id="status" class="muted" style="margin-top:9px"></div></section>

<section class="card"><div class="toolbar"><div class="search"><input id="q" placeholder="Search titles, descriptions, creators, albums…"><button class="btn primary" id="go">Search</button></div>
<button class="btn filter active" data-filter="foryou">For You</button><button class="btn filter" data-filter="following">Following</button><button class="btn filter" data-filter="latest">Latest</button><button class="btn filter" data-filter="featured">Featured</button><button class="btn filter" data-filter="trending">Trending</button><button class="btn filter" data-filter="image">Images</button><button class="btn filter" data-filter="video">Videos</button><button class="btn filter" data-filter="mine">My Media</button><a class="btn" href="./albums.html">📁 Albums</a></div></section>

<section class="card"><h2>Creators</h2><div id="creators" class="albumRow"><span class="muted">Loading creators…</span></div></section>\n<section class="card"><h2>Albums</h2><div id="albums" class="albumRow"><span class="muted">Loading albums…</span></div></section>
<section class="card"><div class="sortline"><div id="context" class="muted"></div><button class="btn" id="clearContext" style="display:none">Clear</button></div><div id="list" class="mediaGrid"><div class="empty">Loading media…</div></div></section>

<div id="viewer" class="viewer"><div class="viewerbox"><div class="viewerbar"><button class="btn" onclick="closeViewer()">✕ Close</button><div class="vieweractions"><button class="btn" onclick="prevMedia()">← Previous</button><button class="btn" onclick="nextMedia()">Next →</button></div></div><div id="viewerContent" style="margin-top:10px"></div><h2 id="viewerTitle"></h2><div id="viewerCreator" class="creator"></div><p id="viewerDesc" class="muted"></p><div id="viewerMeta" class="meta"></div><div class="vieweractions" style="margin-top:10px"><button id="likeBtn" class="btn" onclick="toggleViewerLike()">♡ Like</button><button id="shareBtn" class="btn">🔗 Share</button><a id="profileBtn" class="btn" href="#">Profile</a></div><div id="viewerComments" class="comments"></div><div class="vieweractions"><input id="commentText" placeholder="Write a comment"><button class="btn primary" onclick="postViewerComment()">Post</button></div></div></div>
<div id="toast" class="toast"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");
let me=null,items=[],viewItems=[],filter="foryou",viewerIndex=0,currentViewerId=null,contextAlbum=null,contextCreator=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini=s=>(s||"Member").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
const toast=m=>{toastEl.textContent=m;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),2200)};
const toastEl=document.getElementById("toast");

async function init(){
 me=(await db.auth.getSession()).data.session?.user||null;
 const p=new URLSearchParams(location.search); contextAlbum=p.get("album");contextCreator=p.get("creator");
 await loadAlbums(); await loadMedia(); loadCreators(); subscribeRealtime();
}
async function loadCreators(){
 const map={};items.forEach(x=>{if(x.user_id)map[x.user_id]=x.profile||{}});const rows=Object.entries(map).map(([id,p])=>({id,p})).sort((a,b)=>String(a.p.display_name||a.p.username).localeCompare(String(b.p.display_name||b.p.username)));
 creators.innerHTML=rows.length?rows.map(x=>'<div class="album" onclick="selectCreator(\\''+x.id+'\\')">'+(x.p.avatar_url?'<img src="'+esc(x.p.avatar_url)+'">':'<div style="height:75px;display:grid;place-items:center">👤</div>')+'<b>'+esc(x.p.display_name||x.p.username||"Member")+'</b><span class="muted">@'+esc(x.p.username||"member")+'</span></div>').join(""):'<span class="muted">No creators yet.</span>';
}
function selectCreator(id){contextCreator=id;contextAlbum=null;history.replaceState({},'',"?creator="+encodeURIComponent(id));filter="foryou";syncFilters();render()}
async function loadAlbums(){
 const r=await db.from("crowspace_albums").select("id,user_id,title,description,cover_url,visibility").order("created_at",{ascending:false}).limit(60);
 const rows=(r.data||[]).filter(a=>a.visibility==="public"||a.user_id===me?.id);
 albums.innerHTML=rows.length?rows.map(a=>'<div class="album" onclick="selectAlbum(\''+a.id+'\')">'+(a.cover_url?'<img src="'+esc(a.cover_url)+'">':'<div style="height:75px;display:grid;place-items:center">📁</div>')+'<b>'+esc(a.title)+'</b><span class="muted">'+esc(a.description||"")+'</span></div>').join(""):'<span class="muted">No albums yet.</span>';
 if(me){const mine=rows.filter(a=>a.user_id===me.id);albumSelect.innerHTML='<option value="">No Album</option>'+mine.map(a=>'<option value="'+a.id+'">'+esc(a.title)+'</option>').join("")}
}
function selectAlbum(id){contextAlbum=id;history.replaceState({},'',"?album="+encodeURIComponent(id));contextCreator=null;filter="foryou";syncFilters();render()}
function clearContext(){contextAlbum=null;contextCreator=null;history.replaceState({},'',location.pathname);clearContextBtn.style.display="none";render()}
async function loadMedia(){
 list.innerHTML='<div class="empty">Loading media…</div>';
 const pub=await db.from("crowspace_media").select("id,user_id,album_id,media_type,title,description,media_url,thumbnail_url,storage_path,visibility,is_featured,created_at,updated_at").eq("visibility","public").order("created_at",{ascending:false}).limit(250);
 let all=pub.data||[];
 if(me){const own=await db.from("crowspace_media").select("id,user_id,album_id,media_type,title,description,media_url,thumbnail_url,storage_path,visibility,is_featured,created_at,updated_at").eq("user_id",me.id).order("created_at",{ascending:false}).limit(250);const map=new Map(all.map(x=>[x.id,x]));(own.data||[]).forEach(x=>map.set(x.id,x));all=[...map.values()]}
 const ids=[...new Set(all.map(x=>x.user_id).filter(Boolean))],aids=[...new Set(all.map(x=>x.album_id).filter(Boolean))];
 const [pr,ar]=await Promise.all([ids.length?db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids):Promise.resolve({data:[]}),aids.length?db.from("crowspace_albums").select("id,title,cover_url,visibility").in("id",aids):Promise.resolve({data:[]})]);
 const pm={},am={};(pr.data||[]).forEach(x=>pm[x.user_id]=x);(ar.data||[]).forEach(x=>am[x.id]=x);
 const mids=all.map(x=>x.id);let lm=[],cm=[],vm=[];
 if(mids.length){const [l,c,v]=await Promise.all([db.from("crowspace_media_likes").select("media_id,user_id").in("media_id",mids),db.from("crowspace_media_comments").select("media_id").in("media_id",mids),db.from("crowspace_media_views").select("media_id").in("media_id",mids)]);lm=l.data||[];cm=c.data||[];vm=v.data||[]}
 const lc={},cc={},vc={},mineLikes=new Set();
 lm.forEach(x=>{lc[x.media_id]=(lc[x.media_id]||0)+1;if(x.user_id===me?.id)mineLikes.add(x.media_id)});
 cm.forEach(x=>cc[x.media_id]=(cc[x.media_id]||0)+1);vm.forEach(x=>vc[x.media_id]=(vc[x.media_id]||0)+1);
 items=all.map(x=>({...x,profile:pm[x.user_id]||{},album:am[x.album_id]||{},likeCount:lc[x.id]||0,commentCount:cc[x.id]||0,viewCount:vc[x.id]||0,liked:mineLikes.has(x.id)}));
 render();
}
async function followingIds(){
 if(!me)return new Set();
 const r=await db.from("crowspace_follows").select("following_id").eq("follower_id",me.id);return new Set((r.data||[]).map(x=>x.following_id));
}
async function render(){
 let all=[...items];
 if(contextAlbum)all=all.filter(x=>x.album_id===contextAlbum);
 if(contextCreator)all=all.filter(x=>x.user_id===contextCreator);
 const term=q.value.trim().toLowerCase();
 if(term)all=all.filter(x=>[x.title,x.description,x.profile.display_name,x.profile.username,x.album.title].some(v=>String(v||"").toLowerCase().includes(term)));
 if(filter==="image")all=all.filter(x=>x.media_type==="image");
 if(filter==="video")all=all.filter(x=>x.media_type==="video");
 if(filter==="mine")all=all.filter(x=>x.user_id===me?.id);
 if(filter==="featured")all=all.filter(x=>x.is_featured);
 if(filter==="following"){const ids=await followingIds();all=all.filter(x=>ids.has(x.user_id))}
 if(filter==="trending")all.sort((a,b)=>(b.likeCount*3+b.commentCount*2+b.viewCount)-(a.likeCount*3+a.commentCount*2+a.viewCount));
 if(filter==="latest"||filter==="foryou")all.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
 viewItems=all;
 total.textContent=items.length;photos.textContent=items.filter(x=>x.media_type==="image").length;videos.textContent=items.filter(x=>x.media_type==="video").length;likes.textContent=items.reduce((n,x)=>n+x.likeCount,0);views.textContent=items.reduce((n,x)=>n+x.viewCount,0);
 context.textContent=(contextAlbum?"Album view":"")+(contextCreator?"Creator view":"")+(contextAlbum||contextCreator?" · ":"")+all.length+" item"+(all.length===1?"":"s")+" shown";
 clearContextBtn.style.display=(contextAlbum||contextCreator)?"inline-block":"none";
 list.innerHTML=all.length?all.map((x,i)=>card(x,i)).join(""):'<div class="empty">No media matches your search or filter.</div>';
}
function card(x,i){
 const avatar=x.profile.avatar_url?'<img class="avatar" src="'+esc(x.profile.avatar_url)+'">':'<span class="avatar">'+ini(x.profile.display_name||x.profile.username)+'</span>';
 const thumb=x.media_type==="video"?(x.thumbnail_url?'<img src="'+esc(x.thumbnail_url)+'">':'<span class="play">▶</span>'):x.media_type==="image"?'<img src="'+esc(x.thumbnail_url||x.media_url)+'" alt="">':'<span class="play">🔗</span>';
 return '<article class="media"><div class="thumb">'+thumb+'<span class="badge">'+esc(x.media_type.toUpperCase())+(x.is_featured?" · FEATURED":"")+'</span></div><div class="mediaBody"><div class="title">'+esc(x.title||"Untitled")+'</div><div class="creator">'+avatar+'<a class="muted" href="./profile.html?u='+encodeURIComponent(x.profile.username||"")+'">'+esc(x.profile.display_name||x.profile.username||"Member")+'</a></div><div class="meta">'+(x.album.title?"📁 "+esc(x.album.title)+" · ":"")+x.likeCount+" ♥ · "+x.commentCount+" 💬 · "+x.viewCount+" views</div><div class="desc">'+esc(x.description||"")+'</div><div class="actions"><button class="btn primary" onclick="openViewer('+i+')">Open Viewer</button><a class="btn" href="./profile.html?u='+encodeURIComponent(x.profile.username||"")+'">Profile</a></div></div></article>';
}
async function openViewer(i){if(!viewItems[i])return;viewerIndex=i;currentViewerId=viewItems[i].id;viewer.classList.add("show");document.body.style.overflow="hidden";await renderViewer()}
function closeViewer(){viewer.classList.remove("show");document.body.style.overflow=""}
async function prevMedia(){if(viewItems.length){viewerIndex=(viewerIndex-1+viewItems.length)%viewItems.length;currentViewerId=viewItems[viewerIndex].id;await renderViewer()}}
async function nextMedia(){if(viewItems.length){viewerIndex=(viewerIndex+1)%viewItems.length;currentViewerId=viewItems[viewerIndex].id;await renderViewer()}}
document.getElementById("shareBtn").onclick=async()=>{const x=viewItems[viewerIndex];if(!x)return;const url=location.origin+location.pathname+"?"+(x.album_id?"album="+encodeURIComponent(x.album_id):"creator="+encodeURIComponent(x.user_id));try{await navigator.clipboard.writeText(url);toast("Media link copied")}catch(_){toast(url)}};\nasync function renderViewer(){
 const x=viewItems[viewerIndex];viewerTitle.textContent=x.title||"Untitled";viewerDesc.textContent=x.description||"";
 const av=x.profile.avatar_url?'<img class="avatar" src="'+esc(x.profile.avatar_url)+'">':'<span class="avatar">'+ini(x.profile.display_name||x.profile.username)+'</span>';
 viewerCreator.innerHTML=av+'<a class="muted" href="./profile.html?u='+encodeURIComponent(x.profile.username||"")+'">'+esc(x.profile.display_name||x.profile.username||"Member")+'</a>';
 profileBtn.href="./profile.html?u="+encodeURIComponent(x.profile.username||"");
 viewerMeta.textContent=(x.album.title?x.album.title+" · ":"")+x.likeCount+" likes · "+x.commentCount+" comments · "+x.viewCount+" views · "+new Date(x.created_at).toLocaleString();
 viewerContent.innerHTML=x.media_type==="video"?'<video controls autoplay src="'+esc(x.media_url)+'"></video>':x.media_type==="link"?'<p><a class="btn primary" target="_blank" rel="noopener" href="'+esc(x.media_url)+'">Open Media Link</a></p>':'<img src="'+esc(x.media_url)+'" alt="'+esc(x.title||"Media")+'">';
 likeBtn.textContent=x.liked?"♥ Liked":"♡ Like";likeBtn.className=x.liked?"btn likeon":"btn";
 if(me)await db.from("crowspace_media_views").upsert({media_id:x.id,user_id:me.id,viewed_at:new Date().toISOString()},{onConflict:"media_id,user_id"});
 await loadViewerComments();
}
async function toggleViewerLike(){
 if(!me)return alert("Sign in to like media.");
 const x=viewItems[viewerIndex];const r=await db.from("crowspace_media_likes").select("media_id").eq("media_id",x.id).eq("user_id",me.id).maybeSingle();
 const ql=r.data?await db.from("crowspace_media_likes").delete().eq("media_id",x.id).eq("user_id",me.id):await db.from("crowspace_media_likes").insert({media_id:x.id,user_id:me.id});
 if(ql.error)return alert(ql.error.message);toast(r.data?"Like removed":"Media liked");await loadMedia();
 const ni=viewItems.findIndex(y=>y.id===x.id);viewerIndex=Math.max(0,ni);await renderViewer();
}
async function loadViewerComments(){
 const r=await db.from("crowspace_media_comments").select("content,created_at,author_id").eq("media_id",currentViewerId).order("created_at",{ascending:false}).limit(30);
 const ids=[...new Set((r.data||[]).map(c=>c.author_id).filter(Boolean))];let pm={};if(ids.length){const p=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids);(p.data||[]).forEach(x=>pm[x.user_id]=x)}
 viewerComments.innerHTML=(r.data||[]).map(c=>'<div class="comment"><b>'+esc(pm[c.author_id]?.display_name||"Member")+'</b> '+esc(c.content)+' <span class="muted">'+new Date(c.created_at).toLocaleString()+'</span></div>').join("")||'<span class="muted">No comments yet.</span>';
}
async function postViewerComment(){
 if(!me)return alert("Sign in to comment.");const v=commentText.value.trim();if(!v||!currentViewerId)return;
 const r=await db.from("crowspace_media_comments").insert({media_id:currentViewerId,author_id:me.id,content:v});if(r.error)return alert(r.error.message);
 commentText.value="";toast("Comment posted");await loadMedia();const ni=viewItems.findIndex(y=>y.id===currentViewerId);viewerIndex=Math.max(0,ni);await renderViewer();
}
add.onclick=async()=>{
 if(!me){status.textContent="Sign in to upload media.";return}
 const t=title.value.trim(),u=url.value.trim(),f=file.files[0];if(!t||(!u&&!f)){status.textContent="Add a title and either a file or URL.";return}
 add.disabled=true;status.textContent="Uploading…";let mediaUrl=u,mediaType="link",storagePath=null;
 if(f){const ext=f.name.split(".").pop().toLowerCase(),path=me.id+"/"+crypto.randomUUID()+"."+ext;const up=await db.storage.from("crowspace-media").upload(path,f,{contentType:f.type,upsert:false});if(up.error){status.textContent=up.error.message;add.disabled=false;return}mediaUrl=db.storage.from("crowspace-media").getPublicUrl(path).data.publicUrl;mediaType=f.type.startsWith("video/")?"video":"image";storagePath=path}
 const r=await db.from("crowspace_media").insert({user_id:me.id,album_id:albumSelect.value||null,media_type:mediaType,title:t,description:desc.value.trim(),media_url:mediaUrl,storage_path:storagePath,visibility:"public",is_featured:false});
 add.disabled=false;if(r.error){status.textContent=r.error.message;return}title.value="";desc.value="";url.value="";file.value="";status.textContent="Media added.";toast("Media published");await loadMedia();
};
go.onclick=render;q.addEventListener("keydown",e=>{if(e.key==="Enter")render()});
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;syncFilters();render()});
function syncFilters(){document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x.dataset.filter===filter))}
clearContextBtn.onclick=clearContext;
document.addEventListener("keydown",e=>{if(!viewer.classList.contains("show"))return;if(e.key==="Escape")closeViewer();if(e.key==="ArrowLeft")prevMedia();if(e.key==="ArrowRight")nextMedia()});
function subscribeRealtime(){
 [ "crowspace_media","crowspace_media_likes","crowspace_media_comments","crowspace_media_views"].forEach(table=>db.channel("media3-"+table).on("postgres_changes",{event:"*",schema:"public",table},()=>loadMedia()).subscribe());
}
init();
</script>
<script>
(function(){
const s=document.createElement("style");s.textContent=".m5box{background:linear-gradient(135deg,#0b101b,#171027);border:1px solid #303951;border-radius:15px;padding:15px;margin-bottom:15px}.m5grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.m5item{background:#0b0e17;border:1px solid #292e42;border-radius:12px;padding:12px}.m5tag{display:inline-block;font-size:10px;color:#8ff6ff;border:1px solid #3a4660;border-radius:20px;padding:3px 7px;margin:2px}.m5save{background:#171a29}.m5playlist{max-height:250px;overflow:auto}.m5row{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #25293a}.m5row:last-child{border-bottom:0}@media(max-width:700px){.m5grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.m5grid{grid-template-columns:1fr}}";document.head.appendChild(s);
let saved=new Set(),playlist=[];
async function m5Load(){
 if(!me)return;
 const r=await db.from("crowspace_bookmarks").select("*").eq("user_id",me.id).limit(200);
 if(!r.error){saved=new Set((r.data||[]).map(x=>x.reference_id||x.media_id).filter(Boolean))}
}
async function m5Hub(){
 let box=document.getElementById("m5hub");if(!box){box=document.createElement("section");box.id="m5hub";box.className="m5box";document.querySelector("main").insertBefore(box,document.querySelector(".card:nth-of-type(2)"))}
 const creatorsMap={};items.forEach(x=>{if(x.user_id)creatorsMap[x.user_id]=x.profile||{}});const creatorsList=Object.entries(creatorsMap);
 box.innerHTML='<h2>🎛️ Media Studio</h2><div class="m5grid"><div class="m5item"><b>Creators</b><div class="m5tag">'+creatorsList.length+' active creators</div><p class="muted">Explore media by creator.</p></div><div class="m5item"><b>Collections</b><div class="m5tag">'+new Set(items.map(x=>x.album_id).filter(Boolean)).size+' albums</div><p class="muted">Albums remain your main collections.</p></div><div class="m5item"><b>Saved Media</b><div class="m5tag">'+saved.size+' saved</div><p class="muted">'+(me?"Your saved media is ready to revisit.":"Sign in to save media.")+'</p></div></div><div class="m5playlist" style="margin-top:12px"><h3>▶️ My Media Queue</h3><div id="m5queue"></div></div>';
 const ql=document.getElementById("m5queue");ql.innerHTML=playlist.length?playlist.map((x,i)=>'<div class="m5row"><span style="flex:1"><b>'+esc(x.title||"Untitled")+'</b><span class="muted"> · '+esc(x.profile?.display_name||x.profile?.username||"Member")+'</span></span><button class="btn" onclick="openViewer('+viewItems.findIndex(v=>v.id===x.id)+')">Open</button><button class="btn" onclick="m5Remove('+i+')">Remove</button></div>').join(""):'<span class="muted">Add media to your queue from the viewer.</span>';
}
window.m5Add=async function(){const x=viewItems[viewerIndex];if(!x)return;playlist.push(x);await m5Hub();toast("Added to media queue")};
window.m5Remove=async function(i){playlist.splice(i,1);await m5Hub()};
const oldViewer=window.renderViewer;
window.renderViewer=async function(){await oldViewer();const x=viewItems[viewerIndex];if(!x)return;let a=document.getElementById("m5viewerActions");if(!a){a=document.createElement("div");a.id="m5viewerActions";a.className="vieweractions";document.getElementById("viewerMeta").after(a)}a.innerHTML='<button class="btn" id="m5queueBtn">＋ Queue</button>';document.getElementById("m5queueBtn").onclick=window.m5Add};
const oldInit=window.init;
window.init=async function(){await oldInit();await m5Load();await m5Hub()};
})();
</script><script src="./js/crowspace-holiday-themes.js"></script>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrowSpace Command Center</title>
<link rel="stylesheet" href="css/crowspace.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">CrowSpace</a>
  <nav></nav>
  <div id="account"></div>
</header>
<main class="wrap command-center">
  <section class="hero card">
    <p class="eyebrow">CROWRULES · CROWSPACE 7.0</p>
    <h1>Universal Command Center</h1>
    <p>Search People, Posts, Caws, Groups, Events, Dreamscapes and Memorials from one place.</p>
    <form id="commandSearch" class="command-search">
      <input id="commandInput" type="search" autocomplete="off" placeholder="Search the CrowRules universe…" autofocus>
      <button class="btn primary" type="submit">Search</button>
    </form>
    <div id="filters" class="command-filters" aria-label="Search categories"></div>
  </section>
  <section id="status" class="section"><div class="card"><strong>Ready.</strong><p class="muted">Enter a search above.</p></div></section>
  <section id="results" class="command-results"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/crowspace.js"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{
 const input=document.getElementById("commandInput"),form=document.getElementById("commandSearch"),results=document.getElementById("results"),status=document.getElementById("status"),filters=document.getElementById("filters");
 const types=[["all","Everything"],["people","People"],["posts","Posts"],["caws","Caws"],["groups","Groups"],["events","Events"],["dreamscapes","Dreamscapes"],["memorials","Memorials"]];
 let active="all";
 filters.innerHTML=types.map(([id,label])=>'<button type="button" class="command-filter '+(id==="all"?"active":"")+'" data-type="'+id+'">'+label+'</button>').join("");
 filters.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.type;filters.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));if(input.value.trim())search()});
 const esc=CS.escape;
 const label=t=>t.charAt(0).toUpperCase()+t.slice(1);
 const search=async()=>{
   const q=input.value.trim(); if(q.length<2){status.innerHTML='<div class="card"><strong>Keep searching.</strong><p class="muted">Enter at least 2 characters.</p></div>';results.innerHTML="";return}
   status.innerHTML='<div class="card"><strong>Searching the CrowRules universe…</strong></div>';results.innerHTML="";
   const {data,error}=await CS.client.rpc("crowspace_global_search",{search_text:q,result_limit:100,result_type_filter:active==="all"?null:active});
   if(error){status.innerHTML='<div class="card"><strong>Search unavailable</strong><p>'+esc(error.message)+'</p></div>';return}
   const rows=data||[];
   status.innerHTML='<div class="card command-summary"><strong>'+rows.length+' result'+(rows.length===1?"":"s")+'</strong><span> for “'+esc(q)+'”</span></div>';
   if(!rows.length){results.innerHTML='<div class="card"><h2>No results</h2><p class="muted">Try another name, title, topic or keyword.</p></div>';return}
   results.innerHTML=rows.map(r=>'<a class="command-result card" href="'+esc(r.target_url||"#")+'">'+(r.image_url?'<img src="'+esc(r.image_url)+'" alt="">':'<div class="command-result-icon">'+esc(label(r.result_type).slice(0,1))+'</div>')+'<div class="command-result-copy"><span class="event-tag">'+esc(label(r.result_type))+'</span><h2>'+esc(r.title||"Untitled")+'</h2><strong>'+esc(r.subtitle||"")+'</strong><p>'+esc(r.description||"")+'</p><small>'+ (r.created_at?new Date(r.created_at).toLocaleString():"")+'</small></div></a>').join("");
 };
 form.addEventListener("submit",e=>{e.preventDefault();search()});
 const params=new URLSearchParams(location.search); const initial=params.get("q"); if(initial){input.value=initial;search()}
 try{await CS.refreshHeader();CS.renderUniverseBar();CS.renderUniversalStats()}catch(e){console.warn(e)}
});
</script>
<style>
:root{--cc-bg:#05070d;--cc-panel:rgba(10,15,28,.78);--cc-line:rgba(255,255,255,.09);--cc-cyan:#55e6ff;--cc-purple:#9b7cff;--cc-pink:#ff62c8;--cc-text:#f4f7ff;--cc-muted:#8794ad}
body{background:radial-gradient(circle at 10% 0%,rgba(85,230,255,.11),transparent 30%),radial-gradient(circle at 90% 10%,rgba(155,124,255,.12),transparent 30%),var(--cc-bg)!important;color:var(--cc-text)}
.command-center{max-width:1320px;margin:26px auto;padding:0 18px}
.command-center .hero{position:relative;overflow:hidden;padding:34px;border:1px solid var(--cc-line);border-radius:28px;background:linear-gradient(135deg,rgba(14,23,42,.92),rgba(12,8,28,.84));box-shadow:0 24px 80px rgba(0,0,0,.3)}
.command-center .hero:after{content:"";position:absolute;width:360px;height:360px;right:-130px;top:-180px;border:1px solid rgba(85,230,255,.16);border-radius:50%;box-shadow:0 0 0 55px rgba(155,124,255,.035),0 0 0 110px rgba(255,98,200,.025)}
.command-center .eyebrow{color:var(--cc-cyan);letter-spacing:.16em;font-size:10px;font-weight:800}
.command-center h1{font:800 clamp(32px,5vw,62px) Orbitron,Arial,sans-serif;margin:8px 0;background:linear-gradient(90deg,#fff,var(--cc-cyan),var(--cc-purple),var(--cc-pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.command-center .hero>p:not(.eyebrow){color:#9ba8c0;max-width:760px}
.command-search{display:flex;gap:10px;margin-top:22px;position:relative;z-index:2}
.command-search input{flex:1;min-width:0;padding:16px 18px;border:1px solid var(--cc-line);border-radius:14px;background:rgba(0,0,0,.3);color:#fff;font-size:16px;outline:none}
.command-search input:focus{border-color:rgba(85,230,255,.55);box-shadow:0 0 0 3px rgba(85,230,255,.08)}
.command-search .btn{border-radius:14px}
.command-filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:2}
.command-filter{border:1px solid var(--cc-line);background:rgba(255,255,255,.035);color:#b8c5dc;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer}
.command-filter:hover,.command-filter.active{background:rgba(85,230,255,.1);color:var(--cc-cyan);border-color:rgba(85,230,255,.3)}
#status{margin:18px 0}
#status .card,.command-result{border:1px solid var(--cc-line);background:var(--cc-panel);border-radius:20px;color:var(--cc-text);box-shadow:0 12px 40px rgba(0,0,0,.18)}
.command-summary{display:flex;gap:7px;align-items:center}
.command-results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:50px}
.command-result{display:flex;gap:15px;padding:17px;text-decoration:none;transition:.2s;backdrop-filter:blur(16px)}
.command-result:hover{transform:translateY(-3px);border-color:rgba(85,230,255,.32);box-shadow:0 18px 45px rgba(0,0,0,.3)}
.command-result>img,.command-result-icon{width:82px;height:82px;flex:0 0 82px;border-radius:16px;object-fit:cover;background:linear-gradient(135deg,rgba(85,230,255,.1),rgba(155,124,255,.12));display:grid;place-items:center;color:var(--cc-cyan);font-weight:900;font-size:26px}
.command-result-copy{min-width:0}.command-result h2{margin:7px 0 4px;font-size:19px}.command-result p{margin:6px 0;color:var(--cc-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.command-result small{color:#687690}
.event-tag{border:1px solid rgba(85,230,255,.18)!important;background:rgba(85,230,255,.06)!important;color:var(--cc-cyan)!important;border-radius:999px!important}
.command-empty{padding:30px;text-align:center;border:1px dashed var(--cc-line);border-radius:20px;color:var(--cc-muted)}
@media(max-width:800px){.command-results{grid-template-columns:1fr}.command-search{flex-direction:column}.command-search .btn{width:100%}}
</style>
<script src="js/global-nav.js"></script></body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Following — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body><header class="topbar"></header><main class="page"><div class="page-title"><span class="eyebrow">YOUR NETWORK</span><h1>Following</h1><p class="muted">Creators, friends and communities you follow.</p></div><section class="panel"><div id="status" class="auth-status"></div><div class="people-list" id="people"><div class="empty">Loading following…</div></div></section></main><footer><b>🐦 CROWSPACE</b><span>One Account. One Universe.</span><span>© 2026 CrowRules Entertainment</span></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/navigation.js"></script><script src="js/crowspace.js"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{
 const sb=supabase.createClient(CROW_CONFIG.supabaseUrl,CROW_CONFIG.supabaseKey), box=document.getElementById("people"),status=document.getElementById("status");
 const {data:{user}}=await sb.auth.getUser(); if(!user){status.textContent="Sign in to see who you follow.";box.innerHTML="";return}
 const {data:rows,error}=await sb.from("crowspace_follows").select("followed_user_id,created_at").eq("follower_id",user.id).order("created_at",{ascending:false});
 if(error){status.textContent=error.message;return} if(!rows?.length){box.innerHTML='<div class="empty">You are not following anyone yet.</div>';return}
 const ids=rows.map(x=>x.followed_user_id),{data:profiles}=await sb.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids),map=new Map((profiles||[]).map(x=>[x.user_id,x]));
 box.innerHTML=rows.map(x=>{const p=map.get(x.followed_user_id)||{},name=p.display_name||p.username||"CrowSpace Member";return '<div class="person"><div class="avatar">'+name.slice(0,2).toUpperCase()+'</div><div><b>'+name.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))+'</b><small class="muted">@'+String(p.username||"member").replace(/^@/,"")+'</small></div><a class="secondary" href="profile.html?user='+encodeURIComponent(x.followed_user_id)+'">View Profile</a></div>'}).join("");
});
</script></body></html>

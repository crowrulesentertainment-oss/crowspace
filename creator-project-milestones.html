<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Milestones 7.1 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{background:var(--p2);border:1px solid #292e42;border-radius:15px;padding:15px}.muted{color:var(--m)}.tag{font-size:10px;color:#8ff6ff;letter-spacing:.12em;font-weight:800}.stage{padding:8px;border:1px solid #30364c;border-radius:9px;margin:5px 0}.active{border-color:#20e6ff}.done{opacity:.72}.bar{height:12px;background:#202538;border-radius:20px;overflow:hidden}.fill{height:100%;background:#20e6ff}input,textarea,select{width:100%;background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px;padding:11px}textarea{min-height:70px}.empty{text-align:center;padding:22px;color:var(--m)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="./css/crowrules-cinematic.css">
</head><body data-crowrules-division="crowspace"><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Milestone Center 7.1</span></div><div class="actions"><a class="btn" href="./creator-project-dashboard.html">Dashboard</a><a class="btn" href="./creator-project-workspace.html">Tasks</a><a class="btn" href="./creator-calendar.html">Calendar</a></div></div><section class="card"><label>Project</label><select id="pick"></select><div id="hero"></div></section><section class="card"><h2>🎬 Production Stages</h2><div id="stages"></div></section><section class="card"><h2>➕ Add Milestone</h2><div class="grid"><input id="title" placeholder="Milestone title"><select id="stage"><option value="idea">Idea</option><option value="development" selected>Development</option><option value="pre_production">Pre-Production</option><option value="production">Production</option><option value="post_production">Post-Production</option><option value="review">Review</option><option value="published">Published</option><option value="completed">Completed</option><select id="ms"><option>planned</option><option>in_progress</option><option>blocked</option><option>completed</option></select><input id="date" type="datetime-local"></div><br><textarea id="description" placeholder="Milestone notes"></textarea><br><br><button class="btn primary" id="add">Add Milestone</button><span id="msg" class="muted"></span></section><section class="card"><h2>🧭 Milestone Timeline</h2><div id="list" class="grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let me,projects=[],channel;const stages=["idea","development","pre_production","production","post_production","review","published","completed"];const nice=s=>s.replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase());async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_projects").select("id,title,description,status").eq("owner_id",me.id).order("created_at",{ascending:false});projects=r.data||[];pick.innerHTML=projects.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join("")||'<option value="">No projects</option>';await render();connect()}async function render(){const p=projects.find(x=>x.id===pick.value);if(!p){hero.innerHTML="<h1>No project</h1>";stages.innerHTML="";list.innerHTML="";return}const r=await db.from("crowspace_project_milestones").select("id,title,description,stage,status,target_date,completed_at,sort_order").eq("project_id",p.id).order("sort_order").order("target_date",{ascending:true,nullsFirst:false});const msd=r.data||[],completed=msd.filter(x=>x.status==="completed").length,pct=msd.length?Math.round(completed/msd.length*100):0;hero.innerHTML='<h1>'+esc(p.title)+'</h1><p class="muted">'+esc(p.description||"")+'</p><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div><p class="muted">'+pct+'% of milestones completed · Project status: '+esc(p.status||"")+'</p>';const by={};msd.forEach(x=>(by[x.stage]??=[]).push(x));stages.innerHTML=stages.map(s=>'<div class="stage '+(by[s]?.some(x=>x.status==="in_progress")?"active ":"")+(by[s]?.some(x=>x.status==="completed")?"done":"")+'"><b>'+nice(s)+'</b><span class="muted"> · '+(by[s]?.length||0)+' milestone(s)</span></div>').join("");list.innerHTML=msd.map(x=>'<article class="box"><span class="tag">'+nice(x.stage).toUpperCase()+' · '+nice(x.status).toUpperCase()+'</span><h3>'+esc(x.title)+'</h3><p class="muted">'+esc(x.description||"")+'</p><p class="muted">'+(x.target_date?"Target: "+new Date(x.target_date).toLocaleString():"No target date")+'</p><div class="actions"><select onchange="updateStatus(\''+x.id+'\',this.value)">'+["planned","in_progress","blocked","completed"].map(s=>'<option '+(x.status===s?"selected":"")+'>'+s+'</option>').join("")+'</select><button class="btn" onclick="removeMilestone(\''+x.id+'\')">Delete</button></div></article>').join("")||'<div class="empty">No milestones yet.</div>'}function connect(){if(channel)db.removeChannel(channel);channel=db.channel("milestones-"+pick.value).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_project_milestones",filter:"project_id=eq."+pick.value},render).subscribe()}pick.onchange=()=>{render();connect()};add.onclick=async()=>{if(!pick.value||!title.value.trim()){msg.textContent="Project and milestone title are required.";return}const data={project_id:pick.value,created_by:me.id,title:title.value.trim(),description:description.value.trim()||null,stage:stage.value,status:ms.value,target_date:date.value?new Date(date.value).toISOString():null};if(data.status==="completed")data.completed_at=new Date().toISOString();const r=await db.from("crowspace_project_milestones").insert(data);msg.textContent=r.error?r.error.message:"Milestone added.";if(!r.error){title.value="";description.value="";date.value="";render()}}async function updateStatus(id,status){const data={status,updated_at:new Date().toISOString(),completed_at:status==="completed"?new Date().toISOString():null};const r=await db.from("crowspace_project_milestones").update(data).eq("id",id);if(r.error)alert(r.error.message);else render()}async function removeMilestone(id){if(!confirm("Delete this milestone?"))return;const r=await db.from("crowspace_project_milestones").delete().eq("id",id);if(r.error)alert(r.error.message);else render()}init();</script><script src="./js/crowspace-holiday-themes.js"></script>
<script src="./js/crowrules-cinematic.js"></script>
</body></html>

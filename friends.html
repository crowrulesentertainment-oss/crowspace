<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Friends</title><style>body{background:#05050b;color:#fff;font:15px Arial;padding:30px}main{max-width:900px;margin:auto}.card{background:#0d0f18;border:1px solid #272b3e;border-radius:18px;padding:22px;margin-bottom:15px}.friend{padding:13px;border-bottom:1px solid #25293a}.muted{color:#9da5bd}a{color:#8fefff}</style></head><body><main><div class="card"><h1>Friends</h1><p class="muted">Your CrowSpace connections.</p><div id="list">Loading...</div><a href="./">← Back to CrowSpace</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");
async function init(){const s=await db.auth.getSession();if(!s.data.session){list.innerHTML="Sign in to view friends.";return}const id=s.data.session.user.id;const r=await db.from("crowspace_friends").select("*").or("requester_id.eq."+id+",addressee_id.eq."+id);if(r.error){list.textContent="Friends are being prepared.";return}const ids=[];(r.data||[]).forEach(x=>{if(x.requester_id===id)ids.push(x.addressee_id);else ids.push(x.requester_id)});if(!ids.length){list.textContent="No friends yet.";return}const p=await db.from("crowspace_members").select("username,display_name,bio").in("user_id",ids);list.innerHTML=(p.data||[]).map(x=>'<div class="friend"><b>'+((x.display_name||"Member"))+'</b><div class="muted">@'+(x.username||"member")+'</div></div>').join("")}init();
</script></body></html>

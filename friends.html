<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrowSpace Friends 2.0</title>
<style>
:root{--a:#20e6ff}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.brand{font-size:26px;font-weight:900}.pill{color:#8ff6ff}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search{flex:1;min-width:220px}input,select{width:100%;padding:11px;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px}.btn,a.btn{display:inline-block;padding:10px 13px;border:1px solid #343c56;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.btn.active,.primary{background:linear-gradient(90deg,#126d7a,#56358c);border:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat{background:#080a12;border:1px solid #25293a;border-radius:12px;padding:13px}.stat b{display:block;font-size:22px}.muted{color:#9da5bd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.friend{background:#0a0c14;border:1px solid #25293a;border-radius:15px;padding:14px;position:relative}.person{display:flex;gap:11px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;background:#252a40;display:grid;place-items:center;overflow:hidden;font-weight:bold;font-size:17px;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.onlineDot{position:absolute;left:58px;top:57px;width:11px;height:11px;border-radius:50%;background:#4cff91;border:2px solid #0a0c14}.name{font-size:17px;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.small{font-size:11px}.badge{display:inline-block;background:#18243a;border-radius:20px;padding:4px 7px;margin-top:6px}.empty{text-align:center;padding:35px;color:#9da5bd}.top8mark{position:absolute;right:10px;top:10px;color:#ffd86b;font-size:12px}.status{margin-top:5px}.count{color:#8ff6ff}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){main{padding:10px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main>
<div class="top"><div class="brand">🖤 CrowSpace <span class="pill">Friends 2.0</span></div><a class="btn" href="./">← CrowSpace</a></div>
<div id="auth" class="card">Loading…</div>
<div id="app" style="display:none">
<div class="card"><h1 style="margin-top:0">👥 My Friends</h1><p class="muted">Your CrowSpace connections, Top 8, online friends and mutual connections.</p>
<div class="stats"><div class="stat"><b id="total">0</b><span class="muted">Friends</span></div><div class="stat"><b id="online">0</b><span class="muted">Online</span></div><div class="stat"><b id="topCount">0</b><span class="muted">Top 8</span></div><div class="stat"><b id="mutual">0</b><span class="muted">Mutual connections</span></div></div>
<div class="toolbar"><input id="search" class="search" placeholder="Search friends by name, username or bio…"><button class="btn active" data-filter="all">All</button><button class="btn" data-filter="online">Online</button><button class="btn" data-filter="top8">Top 8</button><button class="btn" data-filter="recent">Recent</button></div></div>
<div class="card"><div id="list" class="grid"><div class="empty">Loading friends…</div></div></div>
<div class="card"><a class="btn" href="./friend-requests.html">Friend Requests</a> <a class="btn" href="./search.html">Find Members</a> <a class="btn" href="./messages.html">Messages</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");
let me,rows=[],profiles={},onlineIds=new Set(),topIds=new Set(),filter="all",presence;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const ini=s=>(s||"Member").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){auth.textContent="Sign in to view your CrowSpace friends.";return}auth.innerHTML='<span class="pill">● Signed in</span>';app.style.display="block";await load();startPresence()}
async function load(){
 const f=await db.from("crowspace_friends").select("requester_id,recipient_id,status,created_at,updated_at").or("requester_id.eq."+me.id+",recipient_id.eq."+me.id).eq("status","accepted").order("updated_at",{ascending:false});
 if(f.error){list.innerHTML='<div class="empty">Friends are currently unavailable.</div>';return}
 rows=(f.data||[]).map(x=>({id:x.requester_id===me.id?x.recipient_id:x.requester_id,created_at:x.created_at,updated_at:x.updated_at}));
 const ids=rows.map(x=>x.id);profiles={};topIds=new Set();
 const p=await db.from("crowspace_profiles").select("user_id,username,display_name,bio,avatar_url,location,top_friends").in("user_id",ids);
 (p.data||[]).forEach(x=>profiles[x.user_id]=x);
 const mine=await db.from("crowspace_profiles").select("top_friends").eq("user_id",me.id).maybeSingle();
 (mine.data?.top_friends||[]).forEach(id=>{if(ids.includes(id))topIds.add(id)});
 total.textContent=rows.length;topCount.textContent=topIds.size;
 await calculateMutual(ids);render();
}
async function calculateMutual(ids){
 mutual.textContent="—";
 if(!ids.length){mutual.textContent="0";return}
 const q=await db.from("crowspace_friends").select("requester_id,recipient_id").eq("status","accepted").or("requester_id.in.("+ids.join(",")+"),recipient_id.in.("+ids.join(",")+")");
 if(q.error){mutual.textContent="—";return}
 const mine=new Set();
 (q.data||[]).forEach(x=>{if(x.requester_id===me.id)mine.add(x.recipient_id);if(x.recipient_id===me.id)mine.add(x.requester_id)});
 let n=0;(q.data||[]).forEach(x=>{const a=mine.has(x.requester_id),b=mine.has(x.recipient_id);if(a&&b)n++});
 mutual.textContent=n;
}
function render(){
 const term=search.value.trim().toLowerCase();
 let out=rows.filter(x=>{const p=profiles[x.id]||{};const hay=[p.display_name,p.username,p.bio,p.location].join(" ").toLowerCase();const matches=!term||hay.includes(term);const isTop=topIds.has(x.id),isOnline=onlineIds.has(x.id);if(filter==="online"&&!isOnline)return false;if(filter==="top8"&&!isTop)return false;return matches}).sort((a,b)=>filter==="recent"?new Date(b.updated_at)-new Date(a.updated_at):(topIds.has(b.id)-topIds.has(a.id))||String(profiles[a.id]?.display_name||"").localeCompare(String(profiles[b.id]?.display_name||"")));
 online.textContent=onlineIds.size;
 if(!out.length){list.innerHTML='<div class="empty" style="grid-column:1/-1">No friends match this view.</div>';return}
 list.innerHTML=out.map(x=>{const p=profiles[x.id]||{};const on=onlineIds.has(x.id),top=topIds.has(x.id);return '<article class="friend">'+(top?'<span class="top8mark">★ TOP 8</span>':"")+'<div class="person"><div class="avatar">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="">':ini(p.display_name))+'</div><div><div class="name">'+esc(p.display_name||"Member")+'</div><div class="muted">@'+esc(p.username||"member")+'</div><div class="status '+(on?"online":"muted")+'">'+(on?"🟢 Online":"Offline")+'</div></div></div><p class="muted">'+esc(p.bio||"")+'</p>'+(p.location?'<span class="badge">📍 '+esc(p.location)+'</span>':"")+'<div class="actions"><a class="btn primary" href="./profile.html?u='+encodeURIComponent(p.username||"")+'">Profile</a><a class="btn" href="./messages.html?u='+encodeURIComponent(p.username||"")+'">Message</a></div></article>'}).join("")
}
function startPresence(){presence=db.channel("crowspace-friends-presence",{config:{presence:{key:me.id}}}).on("presence",{event:"sync"},()=>{onlineIds=new Set();const state=presence.presenceState();Object.values(state).flat().forEach(x=>{if(x.userId&&x.userId!==me.id)onlineIds.add(x.userId)});render()}).subscribe(async s=>{if(s==="SUBSCRIBED")await presence.track({userId:me.id,onlineAt:new Date().toISOString()})})}
search.oninput=render;document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()});
db.channel("crowspace-friends-live").on("postgres_changes",{event:"*",schema:"public",table:"crowspace_friends"},()=>load()).subscribe();
init();
</script></body></html>

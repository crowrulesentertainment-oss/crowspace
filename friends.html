<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friends | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">My Nest</a><a class="active" href="friends.html">Friends</a><a href="groups.html">Groups</a><a href="events.html">Events</a></nav><div id="account"></div></header><main class="section"><p class="eyebrow">YOUR CIRCLE</p><h1>Friends & Follows</h1><div class="card"><p>Friend requests and accepted friendships are stored separately from your follows, so CrowSpace can support both classic social networking and creator-style following.</p><a class="btn primary" href="profile.html">Find people through profiles</a></div><div id="friends" class="grid three"></div></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await CS.user();if(!u){location.href="login.html";return}const {data}=await crowSupabase.from("crowspace_friendships").select("*").or("requester_id.eq."+u.id+",addressee_id.eq."+u.id).order("created_at",{ascending:false});friends.innerHTML=(data||[]).map(x=>'<article class="card"><span class="event-tag">'+CS.escape(x.status)+'</span><h3>Friend connection</h3><p>'+CS.escape(x.requester_id===u.id?"Request sent":"Incoming request")+'</p></article>').join("")||'<p class="muted">No friendships yet.</p>'});</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friends & Followers | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">CONNECTED SOCIAL GRAPH</p><h1>Friends & Followers</h1><p class="muted">Friends, follows, mutual connections, presence and activity — all connected.</p></div><a class="btn primary" href="people.html">Find People</a></div><div class="grid four"><section class="card"><p class="eyebrow">REQUESTS</p><h2 id="requestCount">0</h2></section><section class="card"><p class="eyebrow">FRIENDS</p><h2 id="friendCount">0</h2></section><section class="card"><p class="eyebrow">FOLLOWERS</p><h2 id="followerCount">0</h2></section><section class="card"><p class="eyebrow">FOLLOWING</p><h2 id="followingCount">0</h2></section></div><section class="section" style="padding:18px 0"><h2>Friend Requests</h2><div id="requests" class="grid three"></div></section><section class="section" style="padding:18px 0"><h2>Friends</h2><div id="friendGrid" class="grid three"></div></section><section class="section" style="padding:18px 0"><h2>Followers</h2><div id="followerGrid" class="grid three"></div></section><section class="section" style="padding:18px 0"><h2>Following</h2><div id="followingGrid" class="grid three"></div></section></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>
const esc=CS.escape;let me,all=[];
function card(p,actions=""){return '<article class="card social-card"><div class="media-owner"><a class="avatar sm" href="profile.html?id='+encodeURIComponent(p.id)+'">'+esc((p.display_name||p.username||"C").slice(0,1).toUpperCase())+'</a><div><h3><a href="profile.html?id='+encodeURIComponent(p.id)+'">'+esc(p.display_name||"CrowSpace Member")+'</a></h3><p class="muted">@'+esc(p.username||"member")+'</p></div></div>'+CS.socialPersonMeta(p)+CS.activityLinks(p)+'<div class="social-actions">'+actions+'<a class="btn" href="profile.html?id='+encodeURIComponent(p.id)+'">Visit Nest →</a></div></article>'}
async function respond(id,status){const {error}=await crowSupabase.from("crowspace_friendships").update({status}).eq("requester_id",id).eq("addressee_id",me.id);if(error)alert(error.message);else load()}
async function unfollow(id){const {error}=await crowSupabase.from("crowspace_follows").delete().eq("follower_id",me.id).eq("followed_user_id",id);if(error)alert(error.message);else load()}
function list(el,arr,empty){el.innerHTML=arr.map(p=>card(p,p.relationship==="incoming"?'<button class="btn primary" onclick="respond(\''+p.id+'\',\'accepted\')">Accept</button><button class="btn" onclick="respond(\''+p.id+'\',\'declined\')">Decline</button>':p.is_following?'<button class="btn" onclick="unfollow(\''+p.id+'\')">Unfollow</button>':'')).join("")||'<p class="muted">'+empty+'</p>'}
async function load(){all=await CS.socialGraph(250);const friends=all.filter(p=>p.relationship==="friend"),incoming=all.filter(p=>p.relationship==="incoming"),followers=all.filter(p=>p.follows_you&&!p.is_following),following=all.filter(p=>p.is_following);requestCount.textContent=incoming.length;friendCount.textContent=friends.length;followerCount.textContent=followers.length;followingCount.textContent=following.length;list(requests,incoming,"No new requests.");list(friendGrid,friends,"No friends yet.");list(followerGrid,followers,"No followers yet.");list(followingGrid,following,"You are not following anyone yet.")}
document.addEventListener("DOMContentLoaded",async()=>{me=await CS.user();if(!me){location.href="login.html";return}await CS.refreshHeader();load()});
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/navigation.js"></script><style>
.public-hero{padding:52px 0 28px}.public-cover{width:100%;max-height:300px;object-fit:cover;border-radius:18px;margin-bottom:18px;display:block}.collection-theme{padding:28px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#101522,#171027)}.collection-theme.midnight{background:linear-gradient(135deg,#070b14,#12182a)}.collection-theme.tacoma{background:linear-gradient(135deg,#101820,#15252b)}.collection-theme.dreamscapes{background:linear-gradient(135deg,#151026,#24112c)}.collection-theme.retro{background:linear-gradient(135deg,#21180e,#30220f)}.collection-theme.halloween{background:linear-gradient(135deg,#160b0b,#27110b)}.public-hero h1{margin:.2em 0}.public-privacy{display:inline-block;margin-top:8px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}.public-items{display:grid;gap:14px}.public-card{padding:20px}.public-card img,.public-card video{width:100%;max-height:520px;object-fit:contain;background:#000;border-radius:12px;margin-top:10px}.public-card p{white-space:pre-wrap;line-height:1.55}.public-meta{display:flex;align-items:center;gap:9px}.public-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;display:grid;place-items:center;border:1px solid var(--line)}.public-avatar img{width:100%;height:100%;object-fit:cover}.public-empty{text-align:center;padding:60px 20px}
</style></head><body><div id="app"><header class="topbar"></header><main><section class="public-hero" id="hero"><span class="eyebrow">CROWSPACE COLLECTION</span><h1 id="title">Loading…</h1><p id="sub" class="lead"></p><span id="privacy" class="public-privacy"></span></section><section class="panel"><div class="section-head"><h2>Saved Items</h2><a href="collections.html">Collections →</a></div><div id="items" class="public-items"><div class="public-empty">Loading collection…</div></div></section></main></div><script>
document.addEventListener("DOMContentLoaded",async()=>{const {supabaseUrl,supabaseKey}=window.CROW_CONFIG||{},root=document.getElementById("items"),id=new URLSearchParams(location.search).get("collection");if(!id){root.innerHTML='<div class="public-empty">No collection was specified.</div>';return}const sb=supabase.createClient(supabaseUrl,supabaseKey),{data:col}=await sb.from("crowspace_saved_collections").select("id,user_id,name,description,cover_url,theme,visibility,created_at").eq("id",id).in("visibility",["public","unlisted"]).maybeSingle();if(!col){root.innerHTML='<div class="public-empty"><h2>Collection unavailable</h2><p>This collection is private or no longer exists.</p></div>';return}const {data:owner}=await sb.from("crowspace_profiles").select("display_name,username,avatar_url").eq("user_id",col.user_id).maybeSingle();document.getElementById("title").textContent=col.name;if(col.cover_url){const img=document.createElement("img");img.className="public-cover";img.src=col.cover_url;img.alt="";document.getElementById("hero").prepend(img)}document.getElementById("hero").classList.add("collection-theme",col.theme||"cinematic");document.getElementById("privacy").textContent=col.visibility==="public"?"Public Collection":"Unlisted Collection";document.getElementById("sub").textContent=(col.description||"")+(col.description&&owner?", ":"")+"by "+(owner?.display_name||owner?.username||"CrowSpace Member");const {data:rows}=await sb.from("crowspace_saved_collection_items").select("target_type,target_id,created_at").eq("collection_id",id).order("created_at",{ascending:false});const rs=rows||[],postIds=rs.filter(x=>x.target_type==="post").map(x=>x.target_id),commIds=rs.filter(x=>x.target_type==="community_post").map(x=>x.target_id);const [{data:posts},{data:circles},{data:groups}]=await Promise.all([postIds.length?sb.from("crowspace_posts").select("id,user_id,body,media_url,created_at,title").in("id",postIds):Promise.resolve({data:[]}),commIds.length?sb.from("crowspace_circle_posts").select("id,user_id,body,media_url,created_at,title").in("id",commIds):Promise.resolve({data:[]}),commIds.length?sb.from("crowspace_group_posts").select("id,user_id,body,media_url,created_at,title").in("id",commIds):Promise.resolve({data:[]})]);const map=new Map((posts||[]).map(p=>[p.id,{...p,kind:"post"}]));(circles||[]).forEach(p=>map.set(p.id,{...p,kind:"community_post"}));(groups||[]).forEach(p=>{if(!map.has(p.id))map.set(p.id,{...p,kind:"community_post"})});const data=rs.map(x=>({...x,post:map.get(x.target_id)})).filter(x=>x.post);const uids=[...new Set(data.map(x=>x.post.user_id))];const {data:profiles}=uids.length?await sb.from("crowspace_profiles").select("user_id,display_name,username,avatar_url").in("user_id",uids):{data:[]};const pm=new Map((profiles||[]).map(p=>[p.user_id,p]));document.getElementById("sub").textContent=data.length+" saved item"+(data.length===1?"":"s")+" · shared from CrowSpace";const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));root.innerHTML=data.length?data.map(x=>{const p=x.post,pr=pm.get(p.user_id)||{},av=pr.avatar_url?'<img src="'+esc(pr.avatar_url)+'" alt="">':"🐦",media=p.media_url?(String(p.media_url).match(/\.(mp4|webm|mov|m4v)(\?|$)/i)?'<video src="'+esc(p.media_url)+'" controls preload="metadata"></video>':'<img src="'+esc(p.media_url)+'" alt="" loading="lazy">'):"";return '<article class="feed-card public-card"><div class="public-meta"><span class="public-avatar">'+av+'</span><div><strong>'+esc(pr.display_name||pr.username||"CrowSpace Member")+'</strong><small class="muted">'+new Date(p.created_at).toLocaleString()+'</small></div></div><p>'+esc(p.body)+'</p>'+media+'<div class="saved-actions"><a class="secondary" href="profile.html?user='+encodeURIComponent(p.user_id)+'">Profile</a><a class="secondary" href="'+(p.kind==="post"?"caw.html?id="+encodeURIComponent(p.id):"community-post.html?id="+encodeURIComponent(p.id))+'">Open →</a></div></article>'}).join(""):'<div class="public-empty">This collection has no visible saved items.</div>';});
</script></body></html>

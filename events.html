<style>:root{--a:#20e6ff;--p:#8d5cff;--bg:#05050b;--card:#0d101a;--line:#292e42;--muted:#9da5bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#17132d,transparent 38%),var(--bg);color:#f5f7ff;font:14px Arial}main{max-width:1200px;margin:auto;padding:18px}.top,.toolbar,.actions,.eventhead{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:15px}.brand{font-size:25px;font-weight:900}.pill{color:var(--a)}.card{background:rgba(13,16,26,.95);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:15px}.hero{background:linear-gradient(135deg,#101d2c,#30194b,#0d0f18)}.muted{color:var(--muted)}.search{display:flex;gap:8px;flex:1;min-width:240px}input,textarea,select{width:100%;padding:11px;background:#080a12;color:#fff;border:1px solid var(--line);border-radius:10px}.btn,a.btn{display:inline-block;padding:10px 13px;border:1px solid #343c56;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(90deg,#126d7a,#56358c)!important;border:0!important}.active{outline:2px solid var(--a)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#111522;padding:11px;border-radius:10px;text-align:center}.stat b{display:block;font-size:21px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.event{background:#10131f;border:1px solid var(--line);border-radius:15px;overflow:hidden}.eventimg{width:100%;aspect-ratio:16/8;background:#090a10;object-fit:cover}.eventbody{padding:15px}.type{display:inline-block;padding:5px 8px;border-radius:99px;background:#172334;color:var(--a);font-size:11px}.count{font-weight:800}.detail{display:none}.detail.show{display:block}.detailgrid{display:grid;grid-template-columns:1.4fr .8fr;gap:15px}.attendee{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #25293a}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#20253a;display:grid;place-items:center;font-size:11px;font-weight:800}.empty{text-align:center;padding:35px}@media(max-width:850px){.grid,.detailgrid{grid-template-columns:1fr}}@media(max-width:600px){main{padding:10px}.stats{grid-template-columns:1fr 1fr}}</style><style>.e3panel{background:#10131f;border:1px solid #292e42;border-radius:14px;padding:14px;margin-top:14px}.e3row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.e3comment{border-top:1px solid #25293a;padding:9px 0}.e3avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#20253a;display:inline-grid;place-items:center;font-size:10px;font-weight:800}.e3share{word-break:break-all}.e3count{color:#8ff6ff;font-weight:800}</style><link rel="stylesheet" href="./css/crowrules-cinematic.css">
</head>
<body data-crowrules-division="crowspace"><main><div class="top"><div class="brand">🖤 CrowSpace <span class="pill">Events 3.0</span></div><a class="btn" href="./">← CrowSpace</a></div>
<section class="card hero"><h1>📅 CrowSpace Events</h1><p class="muted">Discover what's happening across the CrowRules universe.</p><div class="stats"><div class="stat"><b id="total">0</b>Events</div><div class="stat"><b id="upcoming">0</b>Upcoming</div><div class="stat"><b id="going">0</b>My RSVPs</div><div class="stat"><b id="attendees">0</b>Attendees</div></div></section>
<section class="card"><div class="toolbar"><div class="search"><input id="q" placeholder="Search events, locations, types…"><button id="searchBtn" class="btn primary">Search</button></div><button class="btn filter active" data-f="upcoming">Upcoming</button><button class="btn filter" data-f="all">All</button><button class="btn filter" data-f="mine">My RSVPs</button><button class="btn filter" data-f="online">Online</button><button class="btn filter" data-f="local">In Person</button><button class="btn" id="createBtn">＋ Create Event</button></div></section>
<section id="create" class="card" style="display:none"><h2>Create an Event</h2><div class="grid" style="grid-template-columns:1fr 1fr"><input id="title" placeholder="Event title"><select id="eventType"><option value="community">Community</option><option value="live">Live</option><option value="watch_party">Watch Party</option><option value="meetup">Meetup</option><option value="online">Online</option></select><textarea id="description" placeholder="Description"></textarea><input id="starts" type="datetime-local"><input id="ends" type="datetime-local"><input id="location" placeholder="Location (optional)"><input id="stream" placeholder="Stream URL (optional)"><input id="image" placeholder="Image URL (optional)"><select id="visibility"><option value="public">Public</option><option value="members">Members</option></select></div><div class="actions" style="margin-top:10px"><button id="save" class="btn primary">Publish Event</button><button id="cancelCreate" class="btn">Cancel</button></div><div id="createStatus" class="muted"></div></section>
<section id="directory" class="card"><h2>Discover Events</h2><div id="list" class="grid"><div class="empty">Loading…</div></div></section>
<section id="detail" class="card detail"><div class="top"><div><h2 id="dtitle"></h2><div id="ddesc" class="muted"></div></div><button id="back" class="btn">← Events</button></div><div class="detailgrid"><div><img id="dimage" class="eventimg" style="display:none"><div id="dmeta" style="margin-top:12px"></div><div class="actions" style="margin-top:12px"><button id="rsvp" class="btn primary"></button><a id="streamBtn" class="btn" target="_blank" rel="noopener" style="display:none">▶ Open Stream</a><a id="owner" class="btn" href="#">Owner Profile</a></div></div><aside><h3>Attendees <span id="acount" class="count"></span></h3><div id="alist"></div></aside></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me=null,events=[],selected=null,filter="upcoming",profiles={};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":">",'"':"&quot;"}[c]));const ini=s=>(s||"Member").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();const now=()=>new Date();
async function init(){me=(await db.auth.getSession()).data.session?.user||null;await load();const id=new URLSearchParams(location.search).get("event");if(id)openEvent(id);subscribe()}
async function load(){const r=await db.from("crowspace_events").select("id,owner_id,title,description,event_type,starts_at,ends_at,location,stream_url,image_url,visibility,created_at").order("starts_at",{ascending:true}).limit(200);if(r.error){list.innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}events=r.data||[];const ids=[...new Set(events.map(x=>x.owner_id).filter(Boolean))];if(ids.length){const p=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids);(p.data||[]).forEach(x=>profiles[x.user_id]=x)}let em=[];if(events.length){const m=await db.from("crowspace_event_members").select("event_id,user_id,status");em=m.data||[]}const mine=new Set(em.filter(x=>x.user_id===me?.id&&x.status==="going").map(x=>x.event_id));total.textContent=events.length;upcoming.textContent=events.filter(x=>new Date(x.starts_at)>=now()).length;going.textContent=mine.size;attendees.textContent=em.filter(x=>x.status==="going").length;render(em,mine)}
async function render(em=[],mine=new Set()){let rows=events.filter(x=>x.visibility==="public"||x.owner_id===me?.id);const term=q.value.trim().toLowerCase();if(term)rows=rows.filter(x=>[x.title,x.description,x.location,x.event_type].some(v=>String(v||"").toLowerCase().includes(term)));if(filter==="upcoming")rows=rows.filter(x=>new Date(x.starts_at)>=now());if(filter==="mine")rows=rows.filter(x=>mine.has(x.id));if(filter==="online")rows=rows.filter(x=>x.stream_url||x.event_type==="online");if(filter==="local")rows=rows.filter(x=>!x.stream_url&&x.location);list.innerHTML=rows.length?rows.map(x=>card(x,em.filter(m=>m.event_id===x.id&&m.status==="going").length,mine.has(x.id))).join(""):'<div class="empty">No events match your filters.</div>'}
function card(x,n,isMine){return '<article class="event">'+(x.image_url?'<img class="eventimg" src="'+esc(x.image_url)+'">':'')+'<div class="eventbody"><span class="type">'+esc(x.event_type||"event")+'</span><h3>'+esc(x.title)+'</h3><p class="muted">'+esc(x.description||"")+'</p><b>'+new Date(x.starts_at).toLocaleString()+'</b><div class="muted">'+esc(x.location||"Online")+' · '+n+' going</div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="openEvent(\''+x.id+'\')">View Event</button>'+(isMine?'<span class="btn">✓ Going</span>':"")+'</div></div></article>'}
async function openEvent(id){selected=id;history.replaceState({},'',"?event="+encodeURIComponent(id));const e=events.find(x=>x.id===id)||((await db.from("crowspace_events").select("*").eq("id",id).maybeSingle()).data);if(!e)return;directory.style.display="none";detail.classList.add("show");dtitle.textContent=e.title;ddesc.textContent=e.description||"";dimage.style.display=e.image_url?"block":"none";dimage.src=e.image_url||"";dmeta.innerHTML='<p><b>📅</b> '+new Date(e.starts_at).toLocaleString()+(e.ends_at?' → '+new Date(e.ends_at).toLocaleString():"")+'</p><p><b>📍</b> '+esc(e.location||"Online")+'</p><p><b>🏷️</b> '+esc(e.event_type||"Event")+'</p>';streamBtn.style.display=e.stream_url?"inline-block":"none";streamBtn.href=e.stream_url||"#";owner.href="./profile.html?u="+encodeURIComponent(profiles[e.owner_id]?.username||"");await loadAttendees(e);const joined=membersFor(e.id).some(x=>x.user_id===me?.id&&x.status==="going");rsvp.textContent=joined?"✓ Going — Cancel RSVP":"I'm Going";rsvp.onclick=()=>toggleRSVP(e.id,joined)}
let allMembers=[];function membersFor(id){return allMembers.filter(x=>x.event_id===id)}
async function loadAttendees(e){const r=await db.from("crowspace_event_members").select("event_id,user_id,status,created_at").eq("event_id",e.id).eq("status","going").order("created_at",{ascending:true});allMembers=(r.data||[]);const ids=allMembers.map(x=>x.user_id);if(ids.length){const p=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids);(p.data||[]).forEach(x=>profiles[x.user_id]=x)}acount.textContent=allMembers.length;alist.innerHTML=allMembers.length?allMembers.map(m=>{const p=profiles[m.user_id]||{};return '<div class="attendee">'+(p.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'">':'<span class="avatar">'+ini(p.display_name||p.username)+'</span>')+'<a href="./profile.html?u='+encodeURIComponent(p.username||"")+'">'+esc(p.display_name||p.username||"Member")+'</a></div>'}).join(""):'<div class="muted">No RSVPs yet.</div>'}
async function toggleRSVP(id,joined){if(!me)return alert("Sign in to RSVP.");const r=joined?await db.from("crowspace_event_members").delete().eq("event_id",id).eq("user_id",me.id):await db.from("crowspace_event_members").upsert({event_id:id,user_id:me.id,status:"going"});if(r.error)alert(r.error.message);else{await load();if(selected)await openEvent(selected)}}
save.onclick=async()=>{if(!me)return alert("Sign in to create events.");if(!title.value.trim()||!starts.value)return alert("Title and start time are required.");save.disabled=true;const r=await db.from("crowspace_events").insert({owner_id:me.id,title:title.value.trim(),description:description.value.trim(),event_type:eventType.value,starts_at:new Date(starts.value).toISOString(),ends_at:ends.value?new Date(ends.value).toISOString():null,location:location.value.trim()||null,stream_url:stream.value.trim()||null,image_url:image.value.trim()||null,visibility:visibility.value});save.disabled=false;if(r.error){createStatus.textContent=r.error.message;return}createStatus.textContent="Event published.";create.style.display="none";title.value=description.value=location.value=stream.value=image.value=starts.value=ends.value="";await load()}
createBtn.onclick=()=>{if(!me)return alert("Sign in to create events.");create.style.display=create.style.display==="none"?"block":"none"};cancelCreate.onclick=()=>create.style.display="none";back.onclick=()=>{selected=null;history.replaceState({},'',location.pathname);detail.classList.remove("show");directory.style.display="block"};searchBtn.onclick=load;q.addEventListener("keydown",e=>{if(e.key==="Enter")load()});
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));load()});
function subscribe(){db.channel("events2").on("postgres_changes",{event:"*",schema:"public",table:"crowspace_events"},load).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_event_members"},load).subscribe()}init();
</script><script>
(function(){
let e3EventId=null,e3Timer=null;
function e3Panel(){if(!document.getElementById("e3panel")){const p=document.createElement("div");p.id="e3panel";p.className="e3panel";document.getElementById("dmeta").after(p)}}
async function e3Load(e){
 e3EventId=e.id;e3Panel();const box=document.getElementById("e3panel");
 const r=await db.from("crowspace_posts").select("id,author_id,body,created_at").eq("event_id",e.id).order("created_at",{ascending:false}).limit(50);
 const rows=r.data||[],ids=[...new Set(rows.map(x=>x.author_id).filter(Boolean))];
 if(ids.length){const p=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids);(p.data||[]).forEach(x=>profiles[x.user_id]=x)}
 box.innerHTML='<h3>💬 Event Discussion <span class="e3count">'+rows.length+'</span></h3>'+(me?'<textarea id="e3body" placeholder="Join the conversation…" style="min-height:65px"></textarea><div class="e3row" style="margin-top:8px"><button id="e3send" class="btn primary">Post Comment</button><button id="e3share" class="btn">🔗 Share Event</button><span id="e3status" class="muted"></span></div>':"<div class='muted'>Sign in to join the discussion.</div>")+'<div id="e3comments" style="margin-top:10px">'+(rows.length?rows.map(x=>{const p=profiles[x.author_id]||{};return '<div class="e3comment"><a href="./profile.html?u='+encodeURIComponent(p.username||"")+'"><b>'+esc(p.display_name||p.username||"Member")+'</b></a><span class="muted"> · '+new Date(x.created_at).toLocaleString()+'</span><div>'+esc(x.body||"")+'</div></div>'}).join(""):"<div class='muted'>No discussion yet.</div>")+'</div>';
 const send=document.getElementById("e3send");if(send)send.onclick=async()=>{const body=document.getElementById("e3body").value.trim();if(!body)return;send.disabled=true;const x=await db.from("crowspace_posts").insert({author_id:me.id,event_id:e.id,body,visibility:"public",status:"published"});send.disabled=false;if(x.error)document.getElementById("e3status").textContent=x.error.message;else e3Load(e)};
 const share=document.getElementById("e3share");if(share)share.onclick=async()=>{const url=location.origin+location.pathname+"?event="+encodeURIComponent(e.id);try{await navigator.clipboard.writeText(url);document.getElementById("e3status").textContent="Event link copied."}catch(_){document.getElementById("e3status").textContent=url}};
}

window.openEvent=async function(id){await oldOpen(id);const e=events.find(x=>x.id===id);if(e)await e3Load(e)};

</script><script>
(function(){
const st=document.createElement("style");st.textContent=".e4hub{background:linear-gradient(135deg,#0b101b,#171027);border:1px solid #303951;border-radius:15px;padding:15px;margin-top:14px}.e4grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.e4item{border:1px solid #292e42;border-radius:12px;padding:12px;background:#0b0e17}.e4thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#151a28}.e4tag{display:inline-block;font-size:10px;color:#8ff6ff;border:1px solid #3a4660;border-radius:20px;padding:3px 7px;margin:3px}.e4danger{background:#35151d!important}@media(max-width:700px){.e4grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.e4grid{grid-template-columns:1fr}}";document.head.appendChild(st);

window.openEvent=async function(id){

};
async function e4Hub(e){
 let box=document.getElementById("e4hub");if(!box){box=document.createElement("div");box.id="e4hub";box.className="e4hub";document.getElementById("dmeta").after(box)}
 const going=allMembers.filter(x=>x.status==="going").length, owner=e.owner_id===me?.id;
 const [mediaR,actR]=await Promise.all([

  db.from("crowspace_activity").select("actor_id,activity_type,created_at,reference_id").eq("reference_id",e.id).order("created_at",{ascending:false}).limit(8)
 ]);
 const media=(mediaR.data||[]).filter(x=>x.user_id&&allMembers.some(m=>m.user_id===x.user_id)).slice(0,6);
 const act=actR.data||[];
 box.innerHTML='<h3>🌐 Event Hub</h3><div><span class="e4tag">'+going+' going</span><span class="e4tag">'+(owner?"HOST":"ATTENDEE")+'</span><span class="e4tag">'+esc(e.visibility||"public")+'</span></div><div class="e4grid" style="margin-top:12px"><div class="e4item"><b>📸 Event Media</b><div id="e4media" style="margin-top:8px"></div></div><div class="e4item"><b>⚡ Event Activity</b><div id="e4activity" style="margin-top:8px"></div></div><div class="e4item"><b>📤 Share</b><p class="muted">Invite people directly to this event.</p><button id="e4share" class="btn primary">Copy Event Link</button><span id="e4shareStatus" class="muted"></span></div></div>'+(owner?'<div style="margin-top:12px"><button id="e4delete" class="btn e4danger">Delete Event</button></div>':"");
 document.getElementById("e4media").innerHTML=media.length?'<div class="e4grid">'+media.map(x=>'<a class="e4item" href="./media.html?creator='+encodeURIComponent(x.user_id)+'" style="color:#fff;text-decoration:none"><img class="e4thumb" src="'+esc(x.thumbnail_url||x.media_url)+'"><b>'+esc(x.title||"Untitled")+'</b></a>').join("")+'</div>':'<span class="muted">No recent attendee media.</span>';
 document.getElementById("e4activity").innerHTML=act.length?act.map(x=>'<div style="padding:7px 0;border-bottom:1px solid #25293a"><b>'+esc(profiles[x.actor_id]?.display_name||profiles[x.actor_id]?.username||"Member")+'</b> <span class="muted">'+esc(String(x.activity_type||"activity").replace(/_/g," "))+'</span><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div></div>').join(""):'<span class="muted">No event activity yet.</span>';
 document.getElementById("e4share").onclick=async()=>{const url=location.origin+location.pathname+"?event="+encodeURIComponent(e.id);try{await navigator.clipboard.writeText(url);e4shareStatus.textContent=" Link copied."}catch(_){e4shareStatus.textContent=" "+url}};
 const del=document.getElementById("e4delete");if(del)del.onclick=async()=>{if(!confirm("Delete this event?"))return;const r=await db.from("crowspace_events").delete().eq("id",e.id).eq("owner_id",me.id);if(r.error)alert(r.error.message);else{back.click();await load()}};
}
})();

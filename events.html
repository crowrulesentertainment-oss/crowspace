<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Events</title><style>body{margin:0;background:#05050b;color:#fff;font:14px Arial;padding:25px}main{max-width:950px;margin:auto}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:20px;margin-bottom:15px}.event{padding:16px;border-bottom:1px solid #25293a}.muted{color:#9da5bd}button,a{padding:9px 13px;border-radius:9px;background:#183f52;color:#fff;border:0;text-decoration:none}</style></head><body><main><div class="card"><h1>📅 CrowSpace Events</h1><p class="muted">Meet, create and participate across the CrowRules universe.</p><div id="list">Loading...</div><a href="./">← CrowSpace</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function init(){me=(await db.auth.getSession()).data.session?.user;const r=await db.from("crowspace_events").select("*").order("starts_at",{ascending:true}).limit(50);if(r.error){list.textContent="Events are being prepared.";return}list.innerHTML=(r.data||[]).map(x=>'<div class="event"><h3>'+esc(x.title)+'</h3><p>'+esc(x.description||"")+'</p><div class="muted">'+new Date(x.starts_at).toLocaleString()+(x.location?" · "+esc(x.location):"")+'</div>'+(me?'<br><button onclick="rsvp(\''+x.id+'\')">I\'m Interested</button>':"")+'</div>').join("")||'<p class="muted">No events yet.</p>'}
async function rsvp(id){if(!me)return;const r=await db.from("crowspace_event_members").upsert({event_id:id,user_id:me.id,status:"going"});if(r.error)alert(r.error.message);else alert("You are marked as going.");}init();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"><a href="login.html">Sign In</a></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">WHAT'S HAPPENING</p><h1>Events</h1><p class="muted">Events connected to their creators, Nests and social activity.</p></div><a class="btn primary" href="create-event.html">Create Event</a></div><div id="filter" class="filter-banner"></div><div id="events" class="grid three"></div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{
  const supa=window.crowSupabase;
  if(!supa){location.href="login.html";return}
  const user=await CS.user();
  if(!user){location.href="login.html";return}
  await CS.refreshHeader();

  const params=new URLSearchParams(location.search);
  const filterUser=params.get("user");
  const esc=CS.escape;

  const {data,error}=await supa
    .from("crowspace_events")
    .select("*")
    .order("reward_featured_until",{ascending:false,nullsFirst:false})
    .order("starts_at",{ascending:true});

  if(error){
    document.getElementById("events").innerHTML='<div class="card"><p>'+esc(error.message)+'</p></div>';
    return;
  }

  let rows=(data||[]);
  if(filterUser){
    rows=rows.filter(x=>x.created_by===filterUser);
    document.getElementById("filter").innerHTML='<div class="card"><strong>Showing events created by this member.</strong> <a href="events.html">Show all events</a></div>';
  }

  /*
   * Do not use CS.socialGraphMap() for "Created by".
   * That RPC is relationship-aware and can omit creators outside the
   * current user's social graph. Events need the actual creator profile.
   */
  const creatorIds=[...new Set(rows.map(x=>x.created_by).filter(Boolean))];
  const creators=new Map();

  if(creatorIds.length){
    const {data:profiles,error:profileError}=await supa
      .from("membership_profiles")
      .select("id,display_name,username,avatar_url")
      .in("id",creatorIds);

    if(profileError) console.warn("Event creator profiles:",profileError.message);
    (profiles||[]).forEach(p=>creators.set(p.id,p));
  }

  const rewardQ=await supa
    .from("crowspace_reward_inventory")
    .select("reward_id,crowspace_rewards(slug,name)")
    .eq("user_id",user.id);

  const ownedFeatureSlugs=new Set(
    (rewardQ.data||[])
      .map(x=>x.crowspace_rewards?.slug)
      .filter(Boolean)
  );

  const eventsEl=document.getElementById("events");

  eventsEl.innerHTML=rows.map(x=>{
    const d=new Date(x.starts_at);
    const p=creators.get(x.created_by)||{};
    const creatorName=p.display_name||p.username||"CrowSpace Member";
    const creatorUsername=p.username?"@"+p.username:"";
    const initial=(creatorName||"C").slice(0,1).toUpperCase();
    const rewardFeatured=!!(x.reward_featured_until&&new Date(x.reward_featured_until)>new Date());

    return '<article class="card event-card '+(rewardFeatured?"reward-event-featured":"")+'">'+
      (rewardFeatured?'<div class="reward-featured-banner">⭐ FEATURED EVENT · CrowPoints</div>':"")+
      (x.image_url?'<img class="card-media" src="'+esc(x.image_url)+'" alt="">':"")+
      '<div class="event-date"><span>'+d.toLocaleString(undefined,{month:"short"})+'</span><strong>'+d.getDate()+'</strong></div>'+
      '<span class="event-tag">'+esc(x.event_type||"Event")+'</span>'+
      '<h3>'+esc(x.title||"Untitled Event")+'</h3>'+
      '<p>'+esc(x.description||"")+'</p>'+
      '<div class="media-owner">'+
        '<a class="avatar sm" href="profile.html?id='+encodeURIComponent(x.created_by||"")+'">'+
          (p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="">':esc(initial))+
        '</a>'+
        '<span>Created by <a href="profile.html?id='+encodeURIComponent(x.created_by||"")+'">'+esc(creatorName)+'</a>'+
        (creatorUsername?'<br><span class="muted">'+esc(creatorUsername)+'</span>':"")+
        '</span>'+
      '</div>'+
      '<div class="event-meta">'+
        '<span>🕒 '+d.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})+'</span>'+
        '<span>📍 '+esc(x.is_online?"Online":(x.location||"Location TBA"))+'</span>'+
      '</div>'+
      '<div class="social-actions">'+
        '<a class="btn" href="profile.html?id='+encodeURIComponent(x.created_by||"")+'">Creator Nest →</a>'+
        (x.link_url?'<a class="btn primary" href="'+esc(x.link_url)+'" target="_blank" rel="noopener">Event Link →</a>':"")+
      '</div>'+
    '</article>';
  }).join("")||'<div class="card"><h3>No events yet.</h3></div>';

  /*
   * Keep reward activation separate from the rendered event card.
   * Only cards owned by the signed-in member can expose the feature action.
   */
  if(ownedFeatureSlugs.has("circle-event-feature")){
    eventsEl.querySelectorAll(".event-card").forEach(card=>{
      const title=card.querySelector("h3");
      const row=rows.find(x=>(x.title||"Untitled Event")===title?.textContent);
      if(!row || row.created_by!==user.id) return;
      const actions=card.querySelector(".social-actions");
      if(!actions || card.querySelector(".feature-event-btn")) return;
      const btn=document.createElement("button");
      btn.type="button";
      btn.className="btn feature-event-btn";
      btn.textContent="⭐ Feature Event";
      btn.addEventListener("click",async()=>{
        btn.disabled=true;
        btn.textContent="Featuring…";
        const rq=await supa.from("crowspace_rewards").select("id").eq("slug","circle-event-feature").maybeSingle();
        if(rq.error||!rq.data){
          alert(rq.error?.message||"Feature reward is unavailable.");
          btn.disabled=false;
          btn.textContent="⭐ Feature Event";
          return;
        }
        const result=await supa.rpc("crowspace_apply_reward_feature",{
          p_reward_id:rq.data.id,
          p_target_id:row.id,
          p_target_type:"event"
        });
        if(result.error){
          alert(result.error.message);
          btn.disabled=false;
          btn.textContent="⭐ Feature Event";
          return;
        }
        location.reload();
      });
      actions.appendChild(btn);
    });
  }
});
</script><script src="js/global-nav.js?v=20260927-4"></script></body></html>

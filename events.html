<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"><a href="login.html">Sign In</a></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">WHAT'S HAPPENING</p><h1>Events</h1><p class="muted">Events connected to their creators, Nests and social activity.</p></div><a class="btn primary" href="create-event.html">Create Event</a></div><div id="filter" class="filter-banner"></div><div id="events" class="grid three"></div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{if(!await CS.user()){location.href="login.html";return}await CS.refreshHeader();const params=new URLSearchParams(location.search),user=params.get("user");const {data,error}=await crowSupabase.from("crowspace_events").select("*").order("reward_featured_until",{ascending:false,nullsFirst:false}).order("starts_at",{ascending:true});if(error){events.innerHTML='<div class="card"><p>'+CS.escape(error.message)+'</p></div>';return}const graph=await CS.socialGraphMap(250); const currentUser=await CS.user(); const rewardQ=await crowSupabase.from('crowspace_reward_inventory').select('reward_id,crowspace_rewards(slug,name)').eq('user_id',currentUser.id); const ownedFeatureSlugs=new Set((rewardQ.data||[]).map(x=>x.crowspace_rewards?.slug).filter(Boolean));const esc=CS.escape;let rows=data||[];if(user){rows=rows.filter(x=>x.created_by===user);filter.innerHTML='<div class="card"><strong>Showing events created by this member.</strong> <a href="events.html">Show all events</a></div>'}events.innerHTML=rows.map(x=>{const d=new Date(x.starts_at),p=graph[x.created_by]||{},rewardFeatured=!!(x.reward_featured_until&&new Date(x.reward_featured_until)>new Date());return '<article class="card event-card '+(rewardFeatured?'reward-event-featured':'')+'">'+(rewardFeatured?'<div class="reward-featured-banner">⭐ FEATURED EVENT · CrowPoints</div>':'')+(x.image_url?'<img class="card-media" src="'+CS.escape(x.image_url)+'" alt="">':"")+'<div class="event-date"><span>'+d.toLocaleString(undefined,{month:"short"})+'</span><strong>'+d.getDate()+'</strong></div><span class="event-tag">'+CS.escape(x.event_type)+'</span><h3>'+CS.escape(x.title)+'</h3><p>'+CS.escape(x.description||"")+'</p><div class="media-owner"><span class="avatar sm">'+esc((p.display_name||p.username||"C").slice(0,1).toUpperCase())+'</span><span>Created by <a href="profile.html?id='+encodeURIComponent(x.created_by)+'">'+esc(p.display_name||p.username||"Member")+'</a><br>'+CS.socialPersonMeta(p)+'</span></div><div class="event-meta"><span>🕒 '+d.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})+'</span><span>📍 '+esc(x.is_online?"Online":(x.location||"Location TBA"))+'</span></div><div class="social-actions"><a class="btn" href="profile.html?id='+encodeURIComponent(x.created_by)+'">Creator Nest →</a>'+(x.link_url?'<a class="btn primary" href="'+CS.escape(x.link_url)+'" target="_blank" rel="noopener">Event Link →</a>':"")+'</div></article>'}).join("")||'<div class="card"><h3>No events yet.</h3></div>'});
document.querySelectorAll('.reward-event-feature').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='Featuring…';const rq=await crowSupabase.from('crowspace_rewards').select('id').eq('slug','circle-event-feature').maybeSingle();const r=rq.data&&await crowSupabase.rpc('crowspace_apply_reward_feature',{p_reward_id:rq.data.id,p_target_id:b.dataset.id,p_target_type:'event'});if(r?.error)alert(r.error.message);location.reload();});
</script><script src="js/global-nav.js?v=20260927-4"></script></body></html>

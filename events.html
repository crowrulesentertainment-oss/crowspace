<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">My Nest</a><a href="people.html">People</a><a href="friends.html">Friends</a><a href="caws.html">Caws</a><a href="albums.html">Photos</a><a href="groups.html">Groups</a><a href="events.html">Events</a><a href="notifications.html">Messages</a></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">WHAT'S HAPPENING</p><h1>Events</h1><p class="muted">Meetups, creator gatherings, CrowRules activities and community events.</p></div><a class="btn primary" href="create-event.html">Create Event</a></div><div id="events" class="grid three"></div></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{await CS.refreshHeader();const {data,error}=await crowSupabase.from("crowspace_events").select("*").order("starts_at",{ascending:true});const box=events;if(error){box.innerHTML='<div class="card"><h3>Events unavailable</h3><p>'+CS.escape(error.message)+'</p></div>';return}const ids=[...new Set((data||[]).map(x=>x.created_by).filter(Boolean))];const {data:ps}=ids.length?await crowSupabase.rpc("crowspace_public_profiles_by_ids",{ids}):{data:[]};const map=Object.fromEntries((ps||[]).map(p=>[p.id,p]));box.innerHTML=(data||[]).map(x=>{const d=new Date(x.starts_at),p=map[x.created_by]||{};return '<article class="card event-card"><div class="event-date"><span>'+d.toLocaleString(undefined,{month:"short"})+'</span><strong>'+d.getDate()+'</strong></div><span class="event-tag">'+CS.escape(x.event_type)+'</span><h3>'+CS.escape(x.title)+'</h3><p>'+CS.escape(x.description||"")+'</p><p class="muted">Created by <a href="profile.html?id='+encodeURIComponent(x.created_by)+'">'+CS.escape(p.display_name||p.username||"Member")+'</a></p><div class="event-meta"><span>🕒 '+d.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})+'</span><span>📍 '+CS.escape(x.is_online?"Online":(x.location||"Location TBA"))+'</span></div></article>'}).join("")||'<div class="card"><h3>No events yet.</h3></div>'});</script></body></html>

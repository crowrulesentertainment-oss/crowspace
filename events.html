<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html"><span>●</span> CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">My Nest</a><a href="caws.html">Caws</a><a href="groups.html">Groups</a><a class="active" href="events.html">Events</a><a href="notifications.html">Messages</a></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">WHAT'S HAPPENING</p><h1>Events</h1><p class="muted">Meetups, creator gatherings, CrowRules activities and community events.</p></div><a class="btn primary" href="create-event.html">Create Event</a></div><div id="events" class="grid three"></div></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const {data,error}=await crowSupabase.from("crowspace_events").select("*").order("starts_at",{ascending:true});const box=document.getElementById("events");if(error){box.innerHTML='<div class="card"><h3>Events unavailable</h3><p>'+CS.escape(error.message)+'</p></div>';return}box.innerHTML=(data||[]).map(e=>{const d=new Date(e.starts_at);return '<article class="card event-card"><div class="event-date"><span>'+d.toLocaleString(undefined,{month:"short"})+'</span><strong>'+d.getDate()+'</strong></div><span class="event-tag">'+CS.escape(e.event_type)+'</span><h3>'+CS.escape(e.title)+'</h3><p>'+CS.escape(e.description||"")+'</p><div class="event-meta"><span>🕒 '+d.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})+'</span><span>📍 '+CS.escape(e.is_online?"Online":(e.location||"Location TBA"))+'</span></div><div class="event-actions">'+(e.link_url?'<a class="btn primary" target="_blank" rel="noopener" href="'+CS.escape(e.link_url)+'">Event Link</a>':"")+'</div></article>'}).join("")||'<div class="card"><h3>No events yet.</h3><p>Create the first CrowSpace event.</p></div>'});</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favorites · CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-page="favorites"><header class="topbar"><a class="brand" href="index.html">CROW<span>SPACE</span></a><nav id="nav" class="nav"></nav><a class="membership" href="membership.html">Universal Membership</a></header><main class="shell"><section class="card"><div class="eyebrow">Saved</div><h1 class="title">Favorites</h1><div id="favorites" class="list"></div></section><script>document.addEventListener('DOMContentLoaded',async()=>{if(!cs.user)return;const r=await cs.client.from('crowspace_favorites').select('*').eq('user_id',cs.user.id).order('created_at',{ascending:false});document.querySelector('#favorites').innerHTML=(r.data||[]).map(x=>'<div class="item"><b>'+esc(x.target_type)+'</b><div class="muted">'+esc(x.target_id)+'</div></div>').join('')||'<div class="muted">No favorites yet.</div>'})</script><div class="footer">CrowRules Entertainment · CrowSpace · One Account · One Universe</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/crowrules-membership.js"></script><script src="js/crowspace.js"></script></body></html>

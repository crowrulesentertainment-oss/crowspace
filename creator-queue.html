<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Publishing Queue — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial;background-image:radial-gradient(circle at 10% 0,#19213d,transparent 35%)}main{max-width:1200px;margin:auto;padding:18px}.top,.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.top{justify-content:space-between;margin-bottom:15px}.brand{font-size:25px;font-weight:900}.pill,.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.hero{background:linear-gradient(135deg,#0b1824,#29143e,#0d0f18)}.btn,input.btn,select.btn,textarea.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a)!important;color:#031014!important;border:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:var(--p2);border:1px solid #292e42;border-radius:13px;padding:13px;text-align:center}.stat b{display:block;font-size:24px}.item{padding:13px 0;border-bottom:1px solid #25293a}.tag{font-size:10px;letter-spacing:.12em;color:#8ff6ff;font-weight:800}.muted{color:var(--m)}.status{display:inline-block;padding:4px 8px;border-radius:99px;background:#18243a;color:#9ff7ff;font-size:11px}.empty{text-align:center;padding:25px;color:var(--m)}form{display:grid;gap:9px}textarea{min-height:80px;width:100%;resize:vertical}input,select,textarea{font:inherit}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="./css/crowrules-cinematic.css">
</head><body data-crowrules-division="crowspace"><main><div class="top"><div class="brand">🌌 CrowSpace <span class="pill">Publishing Queue</span></div><a class="btn" href="./creator-studio.html">← Creator Studio</a></div><section class="card hero"><h1>📤 Creator Publishing Queue</h1><p class="muted">Plan what you are publishing, when it should go out, and what needs attention next.</p><div id="status" class="accent">Loading…</div></section><section class="grid" id="stats"></section><section class="card"><h2>➕ Add to Queue</h2><form id="form"><input id="title" class="btn" required placeholder="Content title"><textarea id="description" class="btn" placeholder="Description or publishing note"></textarea><div class="actions"><select id="division" class="btn"><option value="crowspace">CrowSpace</option><option value="dreamscapes">Dreamscapes</option><option value="podcasting">Podcasting</option></select><input id="type" class="btn" required placeholder="Content type (post, episode, project…)"><select id="priority" class="btn"><option value="normal">Normal Priority</option><option value="high">High Priority</option><option value="low">Low Priority</option></select><input id="scheduled" class="btn" type="datetime-local"></div><input id="url" class="btn" placeholder="Target URL (optional)"><button class="btn primary" type="submit">Add to Publishing Queue</button></form><div id="msg" class="muted"></div></section><section class="card"><h2>🎯 Command Center</h2><div class="actions"><select id="filter" class="btn"><option value="all">All Queue Items</option><option value="queued">Queued</option><option value="scheduled">Scheduled</option><option value="published">Published</option><option value="cancelled">Cancelled</option></select><input id="search" class="btn" style="flex:1;min-width:180px" placeholder="Search queue…"><select id="sort" class="btn"><option value="soonest">Soonest First</option><option value="priority">Priority First</option><option value="newest">Newest Added</option></select></div><div id="attention" class="actions"></div><div id="list"><div class="empty">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const fmt=t=>t?new Date(t).toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}):"Not scheduled";let me,items=[];async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}await load()}async function load(){const q=await db.from("crowspace_creator_queue").select("*").eq("user_id",me.id).order("scheduled_for",{ascending:true,nullsFirst:false}).order("created_at",{ascending:false});if(q.error){status.textContent=q.error.message;return}items=q.data||[];render()}function render(){const counts={queued:0,scheduled:0,published:0,cancelled:0};items.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);stats.innerHTML=[["📥",counts.queued,"Queued"],["⏰",counts.scheduled,"Scheduled"],["✅",counts.published,"Published"],["🚫",counts.cancelled,"Cancelled"]].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b><span class="muted">'+x[2]+'</span></div>').join("");const f=filter.value,q=(search.value||"").toLowerCase();const priorityRank={high:0,normal:1,low:2};let a=items.filter(x=>(f==="all"||x.status===f)&&(!q||[x.title,x.description,x.division,x.content_type,x.priority].join(" ").toLowerCase().includes(q)));if(sort.value==="priority")a.sort((x,y)=>priorityRank[x.priority]-priorityRank[y.priority]||new Date(x.scheduled_for||x.created_at)-new Date(y.scheduled_for||y.created_at));else if(sort.value==="newest")a.sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));else a.sort((x,y)=>new Date(x.scheduled_for||"2999-01-01")-new Date(y.scheduled_for||"2999-01-01"));const due=a.filter(x=>x.status==="scheduled"&&x.scheduled_for&&new Date(x.scheduled_for)<=new Date()).length;attention.innerHTML=due?'<span class="status">⚠️ '+due+' scheduled item(s) need attention</span>':'<span class="muted">✓ No scheduled items are currently overdue.</span>';status.textContent=a.length+" queue items";list.innerHTML=a.map(x=>'<div class="item"><span class="tag">'+esc(x.division.toUpperCase())+' · '+esc(x.content_type.toUpperCase())+'</span> <span class="status">'+esc(x.status)+'</span> <span class="status">'+esc(x.priority)+'</span><div style="margin-top:7px"><b>'+esc(x.title)+'</b></div><div class="muted">'+esc(x.description||"")+'</div><div class="muted">📅 '+fmt(x.scheduled_for)+'</div><div class="actions">'+(x.target_url?'<a class="btn" href="'+x.target_url+'">Open</a>':"")+(x.status!=="published"?'<button class="btn primary" onclick="setStatus(\''+x.id+'\',\'published\')">Mark Published</button>':"")+(x.status!=="cancelled"?'<button class="btn" onclick="setStatus(\''+x.id+'\',\'cancelled\')">Cancel</button>':"")+'<button class="btn" onclick="removeItem(\''+x.id+'\')">Delete</button></div></div>').join("")||'<div class="empty">No matching queue items.</div>'}async function setStatus(id,s){const q=await db.from("crowspace_creator_queue").update({status:s,updated_at:new Date().toISOString()}).eq("id",id).eq("user_id",me.id);if(q.error)msg.textContent=q.error.message;else await load()}async function removeItem(id){if(!confirm("Delete this queue item?"))return;const q=await db.from("crowspace_creator_queue").delete().eq("id",id).eq("user_id",me.id);if(q.error)msg.textContent=q.error.message;else await load()}form.onsubmit=async e=>{e.preventDefault();msg.textContent="Saving…";const scheduledFor=scheduled.value?new Date(scheduled.value).toISOString():null;const q=await db.from("crowspace_creator_queue").insert({user_id:me.id,title:title.value.trim(),description:description.value.trim()||null,division:division.value,content_type:type.value.trim(),priority:priority.value,status:scheduledFor?"scheduled":"queued",scheduled_for:scheduledFor,target_url:url.value.trim()||null});if(q.error){msg.textContent=q.error.message;return}form.reset();msg.textContent="Added to publishing queue.";await load()};filter.onchange=render;search.oninput=render;sort.onchange=render;init();</script><script src="./js/crowspace-holiday-themes.js"></script>
<script src="./js/crowrules-cinematic.js"></script>
</body></html>

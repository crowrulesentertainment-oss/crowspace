<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saved — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/navigation.js"></script>
<style>
.saved-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.saved-tools input,.saved-tools select{flex:1;min-width:180px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.saved-collections{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.collection-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:7px 10px;border-radius:999px;cursor:pointer}.collection-chip.active{border-color:var(--accent);color:var(--text)}.collection-chip button{border:0;background:transparent;color:inherit;cursor:pointer}
.saved-hero{padding:46px 0 28px;display:flex;justify-content:space-between;gap:24px;align-items:center}.saved-orb{width:150px;height:150px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#202844,#0b0d12 68%);box-shadow:0 0 60px #8cf7ff18;animation:savedPulse 3s ease-in-out infinite}.saved-orb b{font-size:42px}.saved-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 20px}.saved-tab{border:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:9px 14px;border-radius:999px;cursor:pointer}.saved-tab.active{color:var(--text);border-color:var(--accent);box-shadow:0 0 18px #8cf7ff14}.saved-grid{display:grid;gap:14px}.saved-card{padding:18px}.saved-meta{display:flex;align-items:center;gap:10px}.saved-meta small{display:block}.saved-avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line)}.saved-avatar img{width:100%;height:100%;object-fit:cover}.saved-card p{white-space:pre-wrap;line-height:1.55}.saved-card .community-post-media{max-height:480px}.saved-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.saved-empty{text-align:center;padding:55px 20px}.saved-source{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);border:1px solid var(--line);padding:4px 7px;border-radius:999px}@keyframes savedPulse{50%{transform:scale(1.035);box-shadow:0 0 75px #a98cff18}}@media(max-width:650px){.saved-hero{padding-top:28px}.saved-orb{width:105px;height:105px}.saved-orb b{font-size:30px}}
</style></head>
<body><div id="app"><header class="topbar"></header><main>
<section class="saved-hero"><div><p class="eyebrow">YOUR PERSONAL ARCHIVE</p><h1>Saved <em>Caws.</em></h1><p class="lead">Everything you bookmarked across CrowSpace, including community posts.</p></div><div class="saved-orb"><div><b>🔖</b><small class="muted">SAVED</small></div></div></section>
<section class="panel"><div class="section-head"><div><span class="eyebrow">BOOKMARKS</span><h2>Saved Library</h2></div><a href="caw-feed.html">Explore Caws →</a></div>
<div class="saved-tools"><input id="savedSearch" type="search" placeholder="Search saved Caws…" autocomplete="off"><select id="savedSort"><option value="saved">Recently saved</option><option value="created">Newest post</option><option value="oldest">Oldest post</option></select><button class="secondary" id="newCollection">＋ Collection</button></div><div id="collections" class="saved-collections"></div><div class="saved-tabs"><button class="saved-tab active" data-filter="all">All</button><button class="saved-tab" data-filter="post">Caws</button><button class="saved-tab" data-filter="community_post">Community</button></div>
<div id="savedFeed"><div class="saved-empty"><h3>Loading your saved items…</h3></div></div></section></main></div>
<script>
document.addEventListener("DOMContentLoaded",async()=>{
 const el=document.getElementById("savedFeed"); const {supabaseUrl,supabaseKey}=window.CROW_CONFIG||{};
 if(!supabaseUrl){el.innerHTML='<div class="saved-empty"><h3>CrowSpace is still initializing</h3></div>';return}
 const sb=supabase.createClient(supabaseUrl,supabaseKey); const {data:{user}}=await sb.auth.getUser();
 if(!user){el.innerHTML='<div class="saved-empty"><h3>Sign in to view your saved items</h3><a class="primary" href="login.html">Sign In</a></div>';return}
 const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 let items=[],collections=[],collectionItems=new Map(),activeCollection=null;
 const {data:saves,error}=await sb.from("crowspace_social_interactions").select("target_id,target_type,created_at").eq("user_id",user.id).eq("interaction_type","save").order("created_at",{ascending:false}).limit(200);
 if(error){el.innerHTML='<div class="saved-empty"><h3>Could not load saved items</h3><p class="muted">'+esc(error.message)+'</p></div>';return}
 const groups={post:(saves||[]).filter(x=>x.target_type==="post"),community:(saves||[]).filter(x=>x.target_type==="community_post")};
 const postIds=groups.post.map(x=>x.target_id), commIds=groups.community.map(x=>x.target_id);
 const {data:posts}=postIds.length?await sb.from("crowspace_posts").select("id,user_id,body,media_url,created_at,title").in("id",postIds):{data:[]};
 const {data:circles}=commIds.length?await sb.from("crowspace_circle_posts").select("id,circle_id,user_id,body,media_url,created_at,title").in("id",commIds):{data:[]};
 const {data:groupsP}=commIds.length?await sb.from("crowspace_group_posts").select("id,group_id,user_id,body,media_url,created_at,title").in("id",commIds):{data:[]};
 const pMap=new Map((posts||[]).map(p=>[p.id,{...p,kind:"post",savedAt:(groups.post.find(s=>s.target_id===p.id)||{}).created_at}]));
 const cMap=new Map((circles||[]).map(p=>[p.id,{...p,kind:"community_post",communityType:"circle",communityId:p.circle_id,savedAt:(groups.community.find(s=>s.target_id===p.id)||{}).created_at}]));
 (groupsP||[]).forEach(p=>{if(!cMap.has(p.id))cMap.set(p.id,{...p,kind:"community_post",communityType:"group",communityId:p.group_id,savedAt:(groups.community.find(s=>s.target_id===p.id)||{}).created_at})});
 items=[...pMap.values(),...cMap.values()].sort((a,b)=>new Date(b.savedAt||b.created_at)-new Date(a.savedAt||a.created_at));
 const uids=[...new Set(items.map(p=>p.user_id))]; const {data:profiles}=uids.length?await sb.from("crowspace_profiles").select("user_id,display_name,username,avatar_url").in("user_id",uids):{data:[]};
 const pm=new Map((profiles||[]).map(p=>[p.user_id,p]));
 const render=filter=>{let shown=filter==="all"?items:items.filter(x=>x.kind===filter);
 if(activeCollection)shown=shown.filter(x=>collectionItems.has(x.kind+"|"+x.id)&&collectionItems.get(x.kind+"|"+x.id).has(activeCollection));const q=(document.getElementById("savedSearch")?.value||"").trim().toLowerCase();if(q)shown=shown.filter(x=>(x.body||"").toLowerCase().includes(q)||(x.title||"").toLowerCase().includes(q));const sort=document.getElementById("savedSort")?.value||"saved";shown=[...shown].sort((a,b)=>new Date(sort==="created"?b.created_at:sort==="oldest"?a.created_at:b.savedAt||b.created_at)-new Date(sort==="created"?a.created_at:sort==="oldest"?b.created_at:a.savedAt||a.created_at)); if(!shown.length){el.innerHTML='<div class="saved-empty"><h3>No saved '+(filter==="community_post"?"community posts":"Caws")+' yet</h3><p class="muted">Use 🔖 Save wherever you find something worth keeping.</p></div>';return}
 el.innerHTML='<div class="saved-grid">'+shown.map(p=>{const pr=pm.get(p.user_id)||{},name=esc(pr.display_name||pr.username||"CrowSpace Member"),av=pr.avatar_url?'<img src="'+esc(pr.avatar_url)+'" alt="">':"🐦";const media=p.media_url?(String(p.media_url).match(/\.(mp4|webm|mov|m4v)(\?|$)/i)?'<video class="community-post-media" src="'+esc(p.media_url)+'" controls preload="metadata"></video>':'<img class="community-post-media" src="'+esc(p.media_url)+'" alt="Saved media" loading="lazy">'):"";const open=p.kind==="post"?'caw.html?id='+encodeURIComponent(p.id):'community-post.html?type='+p.communityType+'&community='+encodeURIComponent(p.communityId)+'&id='+encodeURIComponent(p.id);return '<article class="feed-card saved-card"><div class="saved-meta"><span class="saved-avatar">'+av+'</span><div><strong>'+name+'</strong><small class="muted">'+new Date(p.created_at).toLocaleString()+'</small></div><span class="saved-source">'+(p.kind==="post"?"CAW":p.communityType.toUpperCase())+'</span></div><p>'+esc(p.body)+'</p>'+media+'<div class="saved-actions"><a class="secondary" href="profile.html?user='+encodeURIComponent(p.user_id)+'">Profile</a><a class="secondary" href="'+open+'">Open →</a><button class="secondary collection-move" data-id="'+esc(p.id)+'" data-kind="'+p.kind+'">↔ Move</button><button class="secondary unsave" data-id="'+esc(p.id)+'" data-kind="'+p.kind+'">🔖 Remove</button></div></article>'}).join("")+'</div>';
 el.querySelectorAll(".collection-move").forEach(b=>b.onclick=async()=>{const key=b.dataset.kind+"|"+b.dataset.id;const current=collectionItems.get(key)||new Set();const options=["0. Unsorted",...collections.map((x,i)=>(i+1)+". "+x.name)].join("\n");const answer=prompt("Move this saved item. Enter a collection number:\n\n"+options);if(answer===null)return;const n=parseInt(answer,10);if(Number.isNaN(n)||n<0||n>collections.length)return;await sb.from("crowspace_saved_collection_items").delete().eq("user_id",user.id).eq("target_id",b.dataset.id).eq("target_type",b.dataset.kind);current.clear();if(n>0){const col=collections[n-1];const {error}=await sb.from("crowspace_saved_collection_items").insert({collection_id:col.id,user_id:user.id,target_type:b.dataset.kind,target_id:b.dataset.id});if(error){alert(error.message);return}current.add(col.id)}collectionItems.set(key,current);render(document.querySelector(".saved-tab.active").dataset.filter)}); el.querySelectorAll(".unsave").forEach(b=>b.onclick=async()=>{b.disabled=true;await sb.from("crowspace_social_interactions").delete().eq("user_id",user.id).eq("target_id",b.dataset.id).eq("target_type",b.dataset.kind).eq("interaction_type","save");await sb.from("crowspace_saved_collection_items").delete().eq("user_id",user.id).eq("target_id",b.dataset.id).eq("target_type",b.dataset.kind);collectionItems.delete(b.dataset.kind+"|"+b.dataset.id);items=items.filter(x=>!(x.id===b.dataset.id&&x.kind===b.dataset.kind));render(document.querySelector(".saved-tab.active").dataset.filter)})};
 const renderCollections=()=>{const box=document.getElementById("collections");box.innerHTML='<button class="collection-chip '+(!activeCollection?"active":"")+'" data-c="">All Collections</button>'+collections.map(x=>'<span class="collection-chip '+(activeCollection===x.id?"active":"")+'"><button data-c="'+x.id+'">'+esc(x.name)+'</button><button class="collection-rename" data-id="'+x.id+'" title="Rename">✎</button><button class="collection-delete" data-id="'+x.id+'" title="Delete">×</button></span>').join("");box.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{activeCollection=b.dataset.c||null;renderCollections();render(document.querySelector(".saved-tab.active").dataset.filter)});box.querySelectorAll(".collection-rename").forEach(b=>b.onclick=async()=>{const old=collections.find(x=>x.id===b.dataset.id);const name=prompt("Rename collection",old?.name||"");if(!name?.trim())return;const {error}=await sb.from("crowspace_saved_collections").update({name:name.trim()}).eq("id",b.dataset.id).eq("user_id",user.id);if(error){alert(error.message);return}old.name=name.trim();renderCollections()});box.querySelectorAll(".collection-delete").forEach(b=>b.onclick=async()=>{const old=collections.find(x=>x.id===b.dataset.id);if(!old||!confirm('Delete collection "'+old.name+'"? Saved items will remain saved.'))return;const {error}=await sb.from("crowspace_saved_collections").delete().eq("id",old.id).eq("user_id",user.id);if(error){alert(error.message);return}collections=collections.filter(x=>x.id!==old.id);collectionItems.forEach(set=>set.delete(old.id));if(activeCollection===old.id)activeCollection=null;renderCollections();render(document.querySelector(".saved-tab.active").dataset.filter)});};
 const loadCollections=async()=>{const [{data:c},{data:i}]=await Promise.all([sb.from("crowspace_saved_collections").select("id,name").eq("user_id",user.id).order("created_at",{ascending:true}),sb.from("crowspace_saved_collection_items").select("collection_id,target_type,target_id").eq("user_id",user.id)]);collections=c||[];collectionItems=new Map();(i||[]).forEach(x=>{const k=x.target_type+"|"+x.target_id;if(!collectionItems.has(k))collectionItems.set(k,new Set());collectionItems.get(k).add(x.collection_id)});renderCollections();render(document.querySelector(".saved-tab.active").dataset.filter)};
 document.getElementById("newCollection").onclick=async()=>{const name=prompt("Collection name");if(!name?.trim())return;const {data,error}=await sb.from("crowspace_saved_collections").insert({user_id:user.id,name:name.trim()}).select("id,name").single();if(error){alert(error.message);return}collections.push(data);renderCollections()};
 document.getElementById("savedSearch").oninput=()=>render(document.querySelector(".saved-tab.active").dataset.filter);document.getElementById("savedSort").onchange=()=>render(document.querySelector(".saved-tab.active").dataset.filter);
 document.querySelectorAll(".saved-tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".saved-tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");render(t.dataset.filter)}); loadCollections();render("all");
});
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saved Caws — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/navigation.js"></script></head>
<body><div id="app"><header class="topbar"></header><main><section class="hero" style="min-height:320px"><div class="hero-copy"><p class="eyebrow">YOUR PERSONAL ARCHIVE</p><h1>Saved<br><em>Caws.</em></h1><p class="lead">The posts you've bookmarked across CrowSpace, all in one place.</p></div><div class="hero-orbit"><div class="orb">🔖<br><small>SAVED</small></div></div></section>
<section class="panel"><div class="section-head"><div><span class="eyebrow">BOOKMARKS</span><h2>Your Saved Caws</h2></div><a href="caw-feed.html">Explore Caws →</a></div><div id="savedFeed"><div class="empty"><h3>Loading saved Caws…</h3></div></div></section></main></div>
<script>
document.addEventListener("DOMContentLoaded",async()=>{if(!window.CROW_CONFIG?.supabaseUrl)return;const sb=supabase.createClient(CROW_CONFIG.supabaseUrl,CROW_CONFIG.supabaseKey),el=document.getElementById("savedFeed");const {data:{user}}=await sb.auth.getUser();if(!user){el.innerHTML='<div class="empty"><h3>Sign in to view your saved Caws</h3><a class="primary" href="login.html">Sign In</a></div>';return}
const {data:saves,error}=await sb.from("crowspace_social_interactions").select("target_id,created_at").eq("user_id",user.id).eq("target_type","post").eq("interaction_type","save").order("created_at",{ascending:false});if(error){el.innerHTML='<div class="empty"><h3>Could not load saved Caws</h3><p class="muted">'+error.message+'</p></div>';return}
const ids=(saves||[]).map(x=>x.target_id);if(!ids.length){el.innerHTML='<div class="empty"><h3>No saved Caws yet</h3><p class="muted">Tap 🔖 Save on a Caw to keep it here.</p></div>';return}
const {data:posts}=await sb.from("crowspace_posts").select("id,user_id,body,media_url,created_at,title").in("id",ids);const byId=new Map((posts||[]).map(p=>[p.id,p]));const ordered=ids.map(id=>byId.get(id)).filter(Boolean);const uids=ordered.map(p=>p.user_id);const {data:profiles}=uids.length?await sb.from("crowspace_profiles").select("user_id,display_name,username,avatar_url").in("user_id",uids):{data:[]};const pm=new Map((profiles||[]).map(p=>[p.user_id,p]));const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));el.innerHTML=ordered.map(p=>{const pr=pm.get(p.user_id)||{},name=esc(pr.display_name||pr.username||"CrowSpace Member"),media=p.media_url?(String(p.media_url).match(/\.(mp4|webm|mov|m4v)(\?|$)/i)?'<video class="community-post-media" src="'+esc(p.media_url)+'" controls preload="metadata"></video>':'<img class="community-post-media" src="'+esc(p.media_url)+'" alt="Caw media" loading="lazy">'):"";return '<article class="feed-card saved-caw-card"><div class="community-post-head"><span class="community-post-avatar">🐦</span><div><strong>'+name+'</strong><small class="muted">'+new Date(p.created_at).toLocaleString()+'</small></div></div><p>'+esc(p.body)+'</p>'+media+'<div class="community-post-actions"><a class="secondary" href="profile.html?user='+encodeURIComponent(p.user_id)+'">Profile</a><a class="secondary" href="caw.html?id='+encodeURIComponent(p.id)+'">Open Caw →</a><button class="secondary unsave" data-id="'+p.id+'">🔖 Remove</button></div></article>'}).join("");
el.querySelectorAll(".unsave").forEach(b=>b.onclick=async()=>{b.disabled=true;await sb.from("crowspace_social_interactions").delete().eq("user_id",user.id).eq("target_type","post").eq("target_id",b.dataset.id).eq("interaction_type","save");location.reload()})});
</script></body></html>

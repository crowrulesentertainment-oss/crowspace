<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Projects 6.1 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{background:var(--p2);border:1px solid #292e42;border-radius:15px;padding:15px}.muted{color:var(--m)}.tag{font-size:10px;color:#8ff6ff;letter-spacing:.1em;font-weight:800}.empty{text-align:center;padding:25px;color:var(--m)}select,input{background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px;padding:11px;width:100%}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Creator Projects 6.1</span></div><a class="btn" href="./creator-dashboard.html">← Command Center</a></div><section class="card"><h1>🎬 Real Project Collaboration</h1><p class="muted">Choose an actual CrowSpace project before inviting a creator. No placeholder project IDs.</p><div id="projects" class="grid"><div class="empty">Loading your projects…</div></div></section><section class="card"><h2>🤝 Invite a Creator to a Project</h2><label>Project</label><select id="project"></select><label>Creator user ID</label><input id="creator" placeholder="Creator UUID"><label>Role</label><select id="role"><option>Collaborator</option><option>Co-Creator</option><option>Producer</option><option>Writer</option><option>Host</option><option>Editor</option></select><br><br><button class="btn primary" id="invite">Send Invitation</button><span id="msg" class="muted"></span></section><section class="card"><h2>👥 Project Teams</h2><div id="teams" class="grid"><div class="empty">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me,ps=[],members=[];const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function load(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const p=await db.from("crowspace_projects").select("id,title,description,category,status,image_url").eq("owner_id",me.id).order("created_at",{ascending:false});ps=p.data||[];project.innerHTML=ps.map(x=>'<option value="'+x.id+'">'+esc(x.title)+'</option>').join("")||'<option value="">No projects yet</option>';projects.innerHTML=ps.map(x=>'<div class="box"><span class="tag">'+esc(x.category||"PROJECT")+'</span><h2>'+esc(x.title)+'</h2><p class="muted">'+esc(x.description||"")+'</p><span class="muted">Status: '+esc(x.status||"active")+'</span></div>').join("")||'<div class="empty">Create a CrowSpace project first, then invite collaborators.</div>';const ids=ps.map(x=>x.id);if(!ids.length){teams.innerHTML='<div class="empty">No project teams yet.</div>';return}const m=await db.from("crowspace_project_members").select("project_id,user_id,role,status,created_at").in("project_id",ids).order("created_at",{ascending:false});members=m.data||[];const u=[...new Set(members.map(x=>x.user_id))];const pr=u.length?await db.from("crowspace_profiles").select("user_id,username,display_name").in("user_id",u):{data:[]};const map={};(pr.data||[]).forEach(x=>map[x.user_id]=x);teams.innerHTML=members.map(x=>'<div class="box"><span class="tag">'+esc(x.status||"member")+'</span><h3>'+esc(ps.find(p=>p.id===x.project_id)?.title||"Project")+'</h3><p>'+esc(map[x.user_id]?.display_name||map[x.user_id]?.username||"Creator")+'</p><div class="muted">'+esc(x.role||"Collaborator")+'</div></div>').join("")||'<div class="empty">No collaborators yet.</div>'}invite.onclick=async()=>{if(!project.value||!creator.value.trim()){msg.textContent="Choose a project and enter a creator ID.";return}const r=await db.from("crowspace_project_members").insert({project_id:project.value,user_id:creator.value.trim(),role:role.value,status:"pending"});msg.textContent=r.error?r.error.message:"Invitation sent.";if(!r.error)load()};load();</script><script src="./js/crowspace-holiday-themes.js"></script>
</body></html>

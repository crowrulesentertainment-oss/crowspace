<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit CrowSpace Profile</title><style>body{margin:0;background:#05050b;color:#fff;font:15px Arial;padding:30px}main{max-width:650px;margin:auto}.card{background:#0d0f18;border:1px solid #272b3e;border-radius:18px;padding:22px}input,textarea{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px}button{padding:12px 18px;background:#193e52;color:#fff;border:0;border-radius:10px;cursor:pointer}.muted{color:#9da5bd}</style></head><body><main><div class="card"><h1>Edit Your CrowSpace</h1><p class="muted">Your profile is part of your Universal CrowRules identity.</p><input id="display" placeholder="Display name"><input id="username" placeholder="Username"><input id="avatar" placeholder="Avatar image URL"><input id="location" placeholder="Location"><input id="website" placeholder="Website URL"><textarea id="bio" placeholder="Bio"></textarea><button id="save">Save Profile</button><p id="msg"></p><p><a href="./">← Back</a></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let user;
async function init(){const s=await db.auth.getSession();user=s.data.session?.user;if(!user){location.href="./";return}const r=await db.from("crowspace_profiles").select("*").eq("user_id",user.id).maybeSingle();if(r.data){display.value=r.data.display_name||"";username.value=r.data.username||"";avatar.value=r.data.avatar_url||"";bio.value=r.data.bio||"";location.value=r.data.location||"";website.value=r.data.website_url||""}}
save.onclick=async()=>{const payload={user_id:user.id,display_name:display.value.trim(),username:username.value.trim().toLowerCase(),avatar_url:avatar.value.trim()||null,location:location.value.trim()||null,website_url:website.value.trim()||null,bio:bio.value.trim()};let r=await db.from("crowspace_members").upsert(payload,{onConflict:"user_id"});msg.textContent=r.error?r.error.message:"Profile saved.";};init();
</script><script src="./js/crowspace-holiday-themes.js"></script>
</body></html>

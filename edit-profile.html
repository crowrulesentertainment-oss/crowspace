<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Profile | CrowSpace</title>
<link rel="stylesheet" href="css/crowspace.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/crowspace.js"></script>
<style>
.edit-profile-shell{max-width:760px;margin:40px auto;padding:0 18px}
.edit-profile-card{background:rgba(10,15,28,.86);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.35)}
.edit-profile-card h1{margin:4px 0 8px;font-size:clamp(2rem,5vw,3rem)}
.edit-profile-card .lead{color:#9aa8c2;margin-bottom:26px}
.profile-field{display:grid;gap:8px;margin:20px 0}
.profile-field label{font-weight:800;color:#dce7fa}
.profile-field input{width:100%;box-sizing:border-box;padding:14px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#fff;font:inherit;outline:none}
.profile-field input:focus{border-color:#55e6ff;box-shadow:0 0 0 3px rgba(85,230,255,.1)}
.profile-help{font-size:.82rem;color:#7f8da6}
.profile-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:24px}
.profile-status{min-height:22px;margin-top:14px;color:#9aa8c2}
.profile-status.success{color:#65e6a1}.profile-status.error{color:#ff8d9a}
.identity-preview{display:flex;align-items:center;gap:15px;padding:15px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.025)}
.identity-avatar{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(85,230,255,.15),rgba(155,124,255,.18));font-weight:900;font-size:1.4rem;overflow:hidden}
.identity-avatar img{width:100%;height:100%;object-fit:cover}
.identity-meta strong{display:block;font-size:1.05rem}.identity-meta span{display:block;color:#7f8da6;font-size:.85rem;margin-top:3px}
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">CrowSpace</a>
  <nav aria-label="CrowSpace"></nav>
  <div id="account"></div>
</header>
<main class="edit-profile-shell">
<section class="edit-profile-card">
<p class="eyebrow">YOUR CROWSPACE IDENTITY</p>
<h1>Edit Profile</h1>
<p class="lead">Update the display name people see across CrowSpace. Your username stays the same.</p>
<div class="identity-preview">
  <div class="identity-avatar" id="identityAvatar">C</div>
  <div class="identity-meta"><strong id="currentName">Loading…</strong><span id="currentUsername">@member</span></div>
</div>
<form id="profileForm">
  <div class="profile-field">
    <label for="displayName">Display Name</label>
    <input id="displayName" name="displayName" type="text" maxlength="80" autocomplete="name" required>
    <div class="profile-help">Up to 80 characters. This is your public name; it does not change your username or login.</div>
  </div>
  <div class="profile-actions">
    <button class="btn primary" id="saveBtn" type="submit">Save Display Name</button>
    <a class="btn" href="profile.html">Cancel</a>
  </div>
  <div id="status" class="profile-status" role="status" aria-live="polite"></div>
</form>
</section>
</main>
<script>
(async function(){
  const $=id=>document.getElementById(id);
  const esc=window.CS?.escape||((s)=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])));
  const initials=s=>String(s||"C").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"C";
  const status=(msg,type="")=>{$("status").textContent=msg;$("status").className="profile-status "+type};
  const user=await CS.user();
  if(!user){location.href="login.html";return}
  await CS.refreshHeader();
  const profile=await CS.profile(user.id);
  if(!profile){status("Your CrowSpace profile could not be loaded.","error");return}
  const name=profile.display_name||user.email?.split("@")[0]||"CrowSpace Member";
  $("displayName").value=name;
  $("currentName").textContent=name;
  $("currentUsername").textContent="@"+(profile.username||"member");
  if(profile.avatar_url)$("identityAvatar").innerHTML='<img src="'+esc(profile.avatar_url)+'" alt="">';else $("identityAvatar").textContent=initials(name);

  $("profileForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const value=$("displayName").value.trim();
    if(!value){status("Please enter a display name.","error");return}
    if(value.length>80){status("Display name must be 80 characters or fewer.","error");return}
    const btn=$("saveBtn");btn.disabled=true;btn.textContent="Saving…";status("");
    const {data,error}=await crowSupabase.rpc("crowspace_update_display_name",{new_display_name:value});
    if(error){status(error.message||"Unable to save your display name.","error");btn.disabled=false;btn.textContent="Save Display Name";return}
    $("currentName").textContent=data||value;
    status("Display name updated across CrowSpace.","success");
    btn.disabled=false;btn.textContent="Saved ✓";
    setTimeout(()=>{btn.textContent="Save Display Name"},1600);
  });
})();
</script>
<script src="js/global-nav.js?v=20260928-1" defer></script>
</body></html>

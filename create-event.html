<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Event — CrowSpace</title><link rel="stylesheet" href="crowspace-rebuild.css"><link rel="stylesheet" href="crowspace-universal.css">
<script src="crowspace-auth.js"></script><script src="crowspace-universal.js" defer></script><script src="js/crowspace-youtube-events.js" defer></script>
<style>
.event-form{max-width:820px;margin:24px auto}.event-form .field{display:grid;gap:7px;margin:0 0 14px}.event-form label{font:800 8px Montserrat;letter-spacing:.08em}.event-form input,.event-form textarea,.event-form select{box-sizing:border-box;width:100%;border:1px solid #ffffff18;background:#050914;color:#fff;border-radius:9px;padding:11px;font:600 10px Montserrat;outline:0}.event-form textarea{min-height:100px;resize:vertical}.yt-preview{margin-top:12px}.toggle{display:flex!important;align-items:center;gap:9px}.toggle input{width:auto}.hint{font-size:8px;color:#8090aa;line-height:1.5}.status{min-height:18px;font:800 8px Montserrat;color:#66e8ff}
</style></head>
<body data-page="create-event"><main class="cs-page-shell">
<section class="cs-page-hero"><div class="cs-eyebrow">CROWSPACE // EVENT STUDIO</div><h1>Create an Event</h1><p>Paste a YouTube URL and CrowSpace automatically prepares the event video and live-chat experience.</p></section>
<form id="event-form" class="cs-card event-form">
<div class="field"><label for="title">EVENT TITLE</label><input id="title" maxlength="180" required placeholder="Back Deck Live #008"></div>
<div class="field"><label for="description">DESCRIPTION</label><textarea id="description" maxlength="5000" placeholder="Tell the community what is happening."></textarea></div>
<div class="field"><label for="starts_at">START DATE & TIME</label><input id="starts_at" type="datetime-local"></div>
<div class="field"><label for="youtube_url">YOUTUBE URL</label><input id="youtube_url" type="url" placeholder="https://www.youtube.com/watch?v=XXXXXXXXXXX"><div class="hint">You can use a watch, live, youtu.be, embed, or Shorts URL. CrowSpace extracts the video ID automatically.</div><div id="yt-preview" class="yt-preview"></div></div>
<label class="toggle"><input id="is_live" type="checkbox"> THIS IS A LIVE EVENT — ENABLE YOUTUBE LIVE CHAT</label>
<div class="field" style="margin-top:14px"><label for="visibility">VISIBILITY</label><select id="visibility"><option value="public">PUBLIC</option><option value="members">MEMBERS</option></select></div>
<button class="cs-btn primary" type="submit" id="save">CREATE EVENT</button><div id="status" class="status"></div>
</form></main>
<script>
(async()=>{
 const $=id=>document.getElementById(id),db=()=>window.CrowSpaceUniversal?.db||window.CrowSpaceAuth?.client,u=()=>window.CrowSpaceUniversal?.user||window.CrowSpaceAuth?.user;
 await new Promise(r=>{if(db())r();else document.addEventListener('crowspace-universal-ready',r,{once:true})});
 function preview(){const url=$('youtube_url').value.trim(),id=window.CrowSpaceYouTubeEvents?.videoId(url);$('yt-preview').innerHTML=id?'<div class="cs-card"><b style="color:#66e8ff">✓ YOUTUBE DETECTED</b><p class="hint">Video ID: '+id+' · '+($('is_live').checked?'Live chat will be enabled.':'Video player will be enabled.')+'</p></div>':url?'<div class="cs-card"><b style="color:#ffb3c3">YouTube URL not recognized</b><p class="hint">Check the URL and try again.</p></div>':''}
 $('youtube_url').addEventListener('input',preview);$('is_live').addEventListener('change',preview);
 $('event-form').addEventListener('submit',async e=>{
  e.preventDefault();const d=db(),me=u();if(!d||!me){location.href='login.html';return}
  const yt=$('youtube_url').value.trim(),id=window.CrowSpaceYouTubeEvents?.videoId(yt)||null;
  if(yt&&!id){$('status').textContent='Enter a valid YouTube URL.';return}
  const payload={title:$('title').value.trim(),description:$('description').value.trim(),starts_at:$('starts_at').value?new Date($('starts_at').value).toISOString():null,youtube_url:yt||null,youtube_video_id:id,is_live:$('is_live').checked,live_chat_enabled:Boolean($('is_live').checked&&id),visibility:$('visibility').value,created_by:me.id,created_at:new Date().toISOString()};
  $('save').disabled=true;$('status').textContent='CREATING EVENT…';
  try{let r=await d.from('crowspace_events').insert(payload).select('id').single();if(r.error)throw r.error;$('status').textContent='EVENT CREATED ✓';location.href='event.html?id='+encodeURIComponent(r.data.id)}
  catch(err){$('status').textContent=err.message||'Unable to create event.';$('save').disabled=false}
 });
})();
</script></body></html>

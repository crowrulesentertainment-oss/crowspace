<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Event | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html"><span>●</span> CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">My Nest</a><a href="caws.html">Caws</a><a href="groups.html">Groups</a><a class="active" href="events.html">Events</a><a href="notifications.html">Messages</a></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">COMMUNITY</p><h1>Create an Event</h1><p class="muted">Put something on the CrowSpace calendar.</p></div><a class="btn" href="events.html">Back to Events</a></div><section class="card"><form id="eventForm"><label>Event title<input id="title" maxlength="160" required placeholder="Example: CrowRules Community Meetup"></label><label>Type<select id="event_type"><option value="community">Community</option><option value="meetup">Meetup</option><option value="creator">Creator</option><option value="crowrules">CrowRules</option><option value="dreamscapes">Dreamscapes</option><option value="memorials">Memorials</option><option value="other">Other</option></select></label><label>Description<textarea id="description" maxlength="5000" placeholder="What's happening?"></textarea></label><label>Start<input id="starts_at" type="datetime-local" required></label><label>End<input id="ends_at" type="datetime-local"></label><label>Location<input id="location" placeholder="Tacoma, WA or venue name"></label><label><input id="is_online" type="checkbox" style="width:auto;margin-right:8px"> Online event</label><label>Event link<input id="link_url" type="url" placeholder="https://..."></label><button class="btn primary" type="submit">Publish Event</button><p id="msg" class="muted"></p></form></section></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.getElementById("eventForm").addEventListener("submit",async ev=>{ev.preventDefault();const u=await CS.user();if(!u){location.href="login.html";return}const payload={created_by:u.id,title:title.value.trim(),event_type:event_type.value,description:description.value.trim()||null,starts_at:new Date(starts_at.value).toISOString(),ends_at:ends_at.value?new Date(ends_at.value).toISOString():null,location:location.value.trim()||null,is_online:is_online.checked,link_url:link_url.value.trim()||null};const {error}=await crowSupabase.from("crowspace_events").insert(payload);msg.textContent=error?error.message:"Event published!";if(!error)setTimeout(()=>location.href="events.html",600)});</script></body></html>

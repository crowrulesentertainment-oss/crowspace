<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Event | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"><a href="login.html">Sign In</a></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">COMMUNITY</p><h1>Create an Event</h1><p class="muted">Put something on the CrowSpace calendar.</p><div id="circleContext" class="filter-banner"></div></div><a class="btn" href="events.html">Back to Events</a></div><section class="card"><form id="eventForm"><label>Event title<input id="title" maxlength="160" required placeholder="Example: CrowRules Community Meetup"></label><label>Type<select id="event_type"><option value="community">Community</option><option value="meetup">Meetup</option><option value="creator">Creator</option><option value="crowrules">CrowRules</option><option value="dreamscapes">Dreamscapes</option><option value="memorials">Memorials</option><option value="other">Other</option></select></label><label>Description<textarea id="description" maxlength="5000" placeholder="What's happening?"></textarea></label><label>Start<input id="starts_at" type="datetime-local" required></label><label>End<input id="ends_at" type="datetime-local"></label><label>Location<input id="location" placeholder="Tacoma, WA or venue name"></label><label><input id="is_online" type="checkbox" style="width:auto;margin-right:8px"> Online event</label><label>Event link<input id="link_url" type="url" placeholder="https://..."></label><label id="eventChannelWrap" hidden>Circle Channel <select id="eventChannel"><option value="">General Circle</option></select></label><button class="btn primary" type="submit">Publish Event</button><p id="msg" class="muted"></p></form></section></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>
(function(){
  const form=document.getElementById("eventForm");
  const msg=document.getElementById("msg");
  const submitButton=form.querySelector('button[type="submit"]');
  const titleInput=document.getElementById("title");
  const typeInput=document.getElementById("event_type");
  const descriptionInput=document.getElementById("description");
  const startsInput=document.getElementById("starts_at");
  const endsInput=document.getElementById("ends_at");
  const locationInput=document.getElementById("location");
  const onlineInput=document.getElementById("is_online");
  const linkInput=document.getElementById("link_url");
  const channelInput=document.getElementById("eventChannel");

  form.addEventListener("submit",async function(ev){
    ev.preventDefault();
    msg.textContent="";
    const u=await CS.user();
    if(!u){ location.href="login.html"; return; }

    const params=new URLSearchParams(window.location.search);
    const circleId=params.get("circle_id");
    const startValue=startsInput.value;
    const endValue=endsInput.value;

    if(!startValue){
      msg.textContent="Please choose a start date and time.";
      startsInput.focus();
      return;
    }

    const startDate=new Date(startValue);
    const endDate=endValue?new Date(endValue):null;
    if(Number.isNaN(startDate.getTime())){
      msg.textContent="The start date/time is invalid.";
      startsInput.focus();
      return;
    }
    if(endDate && (Number.isNaN(endDate.getTime()) || endDate<=startDate)){
      msg.textContent="The end time must be later than the start time.";
      endsInput.focus();
      return;
    }

    let linkUrl=linkInput.value.trim()||null;
    if(linkUrl){
      try{
        const parsed=new URL(linkUrl);
        if(!["http:","https:"].includes(parsed.protocol)) throw new Error();
        linkUrl=parsed.href;
      }catch(e){
        msg.textContent="Please enter a valid http:// or https:// event link.";
        linkInput.focus();
        return;
      }
    }

    const payload={
      created_by:u.id,
      title:titleInput.value.trim(),
      event_type:typeInput.value,
      description:descriptionInput.value.trim()||null,
      starts_at:startDate.toISOString(),
      ends_at:endDate?endDate.toISOString():null,
      location:locationInput.value.trim()||null,
      is_online:onlineInput.checked,
      link_url:linkUrl
    };

    if(!payload.title){
      msg.textContent="Please enter an event title.";
      titleInput.focus();
      return;
    }

    submitButton.disabled=true;
    submitButton.textContent="Publishing…";

    try{
      const result=await window.crowSupabase
        .from("crowspace_events")
        .insert(payload)
        .select("id")
        .single();

      if(result.error) throw result.error;
      const event=result.data;

      if(circleId){
        const link=await window.crowSupabase
          .from("crowspace_circle_events")
          .insert({
            circle_id:circleId,
            event_id:event.id,
            created_by:u.id,
            channel_id:channelInput.value||null
          });
        if(link.error){
          msg.textContent="Event was published, but the Circle link failed: "+link.error.message;
          submitButton.disabled=false;
          submitButton.textContent="Publish Event";
          return;
        }

        try{
          await window.crowSupabase.rpc("crowspace_award_activity_points",{
            p_action:"circle_event",
            p_entity_type:"circle_event",
            p_entity_id:event.id
          });
        }catch(e){}
      }

      msg.textContent=circleId?"Circle event published!":"Event published!";
      setTimeout(function(){
        window.location.href=circleId
          ?"circle.html?slug="+encodeURIComponent(params.get("slug")||"")
          :"events.html";
      },700);
    }catch(error){
      console.error("CrowSpace event publish failed:",error);
      msg.textContent=error?.message||"Unable to publish the event. Please try again.";
      submitButton.disabled=false;
      submitButton.textContent="Publish Event";
    }
  });
})();
</script><script>(async()=>{const p=new URLSearchParams(location.search),cid=p.get("circle_id");if(!cid)return;const {data:c}=await crowSupabase.from("crowspace_circles").select("name,slug").eq("id",cid).maybeSingle();if(c)document.getElementById("circleContext").innerHTML="Creating an event for <strong>"+CS.escape(c.name)+"</strong>. <a href=\"circle.html?slug="+encodeURIComponent(c.slug)+"\">Back to Circle</a>";const ch=await crowSupabase.from("crowspace_circle_channels").select("id,name").eq("circle_id",cid).order("name");if(!ch.error){document.getElementById("eventChannelWrap").hidden=false;(ch.data||[]).forEach(x=>document.getElementById("eventChannel").insertAdjacentHTML("beforeend",'<option value="'+CS.escape(x.id)+'">'+CS.escape("# "+x.name)+'</option>'));}})();</script><script src="js/global-nav.js?v=20260927-4"></script></body></html>

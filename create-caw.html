<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a Caw | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="auth"><div class="auth-card"><a class="brand" href="index.html">◉ CROWSPACE</a><p class="eyebrow">CREATE</p><h1>Create a Caw</h1><form id="cawForm"><input id="title" placeholder="Title"><textarea id="caption" maxlength="2000" placeholder="Caption"></textarea><input id="video_url" type="url" placeholder="Video URL (Supabase Storage or hosted MP4)"><button class="btn primary">Publish Caw</button></form><p id="msg" class="muted"></p><a href="caws.html">Back to Caws</a></div></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>cawForm.onsubmit=async e=>{e.preventDefault();const u=await CS.user();if(!u){location.href="login.html";return}const {error}=await crowSupabase.from("crowspace_caws").insert({user_id:u.id,title:title.value,caption:caption.value,video_url:video_url.value||null});msg.textContent=error?error.message:"Caw published!";if(!error)setTimeout(()=>location.href="caws.html",500)};</script></body></html>

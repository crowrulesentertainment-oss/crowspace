<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caws | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">SHORT FORM</p><h1>Caws</h1><p class="muted">Creator videos connected to their Nests, relationships and activity.</p></div><a class="btn primary" href="create-caw.html">Create a Caw</a></div><div id="filter" class="filter-banner"></div><div id="cawsGrid" class="grid three"></div></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{if(!await CS.user()){location.href="login.html";return}await CS.refreshHeader();const params=new URLSearchParams(location.search),user=params.get("user");const {data,error}=await crowSupabase.from("crowspace_caws").select("*").order("created_at",{ascending:false}).limit(100);const box=cawsGrid;if(error){box.innerHTML='<div class="card"><h3>Caws unavailable</h3><p>'+CS.escape(error.message)+'</p></div>';return}let rows=data||[];if(user){rows=rows.filter(x=>x.user_id===user);filter.innerHTML='<div class="card"><strong>Showing Caws from this member.</strong> <a href="caws.html">Show all Caws</a></div>'}const graph=await CS.socialGraphMap(250);const esc=CS.escape;box.innerHTML=rows.map(x=>{const p=graph[x.user_id]||{};return '<article class="card caw-card">'+(x.video_url?'<video controls playsinline preload="metadata" src="'+CS.escape(x.video_url)+'"></video>':'<div class="caw-placeholder">▶</div>')+'<div class="caw-meta"><div class="media-owner"><a class="avatar sm" href="profile.html?id='+encodeURIComponent(x.user_id)+'">'+esc((p.display_name||p.username||"C").slice(0,1).toUpperCase())+'</a><span><a href="profile.html?id='+encodeURIComponent(x.user_id)+'">'+esc(p.display_name||p.username||"CrowSpace Member")+'</a><br>'+CS.socialPersonMeta(p)+'</span></div><h3>'+CS.escape(x.title||"Untitled Caw")+'</h3><p>'+CS.escape(x.caption||"")+'</p>'+CS.activityLinks(p)+'<small>'+Number(x.views||0).toLocaleString()+' views · '+new Date(x.created_at).toLocaleDateString()+'</small></div></article>'}).join("")||'<div class="card"><h3>No Caws yet.</h3><p>Be the first creator.</p></div>'});
</script></body></html>

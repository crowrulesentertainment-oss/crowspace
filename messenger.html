<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messenger | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.comm-grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.comm-card{background:linear-gradient(145deg,#11182b,#090d18);border:1px solid var(--line);border-radius:18px;padding:18px}.list{display:grid;gap:8px}.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}.item.active{border-color:#55b8ff}.messages{min-height:360px;max-height:58vh;overflow:auto;display:grid;align-content:start;gap:8px}.bubble{max-width:75%;padding:10px 13px;border-radius:14px;background:rgba(255,255,255,.06)}.mine{margin-left:auto;background:rgba(85,184,255,.14)}.composer{display:flex;gap:8px;margin-top:12px}.composer input{flex:1}.room-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.live-card{position:relative}.live-dot{color:#ff5364;font-weight:900}@media(max-width:800px){.comm-grid,.room-grid{grid-template-columns:1fr}} </style></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">PHASE 4 · COMMUNICATION</p><h1>Messenger</h1><p class="muted">Private conversations across CrowSpace.</p></div></div><div class="comm-grid"><aside class="comm-card"><div class="actions"><button id="new" class="btn primary">+ New Conversation</button></div><div id="convos" class="list" style="margin-top:12px"></div></aside><section class="comm-card"><div id="title"><h2>Select a conversation</h2></div><div id="messages" class="messages"></div><form id="form" class="composer"><input id="body" maxlength="5000" placeholder="Write a message…" autocomplete="off"><button class="btn primary">Send</button></form><p id="msg" class="muted"></p></section></div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await CS.user();if(!u){location.href='login.html';return}await CS.refreshHeader();let active=null;const esc=CS.escape;async function load(){const m=await crowSupabase.from('crowspace_conversation_members').select('conversation_id').eq('user_id',u.id);const ids=(m.data||[]).map(x=>x.conversation_id);if(!ids.length){document.getElementById('convos').innerHTML='<div class="empty">No conversations yet.</div>';return}const q=await crowSupabase.from('crowspace_conversations').select('*').in('id',ids).order('created_at',{ascending:false});document.getElementById('convos').innerHTML=(q.data||[]).map(x=>'<button class="item" data-id="'+x.id+'" style="width:100%;text-align:left"><strong>'+esc(x.title||'Conversation')+'</strong><br><small class="muted">'+(x.is_group?'Group':'Direct')+'</small></button>').join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id));}async function open(id){active=id;const q=await crowSupabase.from('crowspace_conversations').select('title,is_group').eq('id',id).single();document.getElementById('title').innerHTML='<h2>'+esc(q.data?.title||'Conversation')+'</h2>';const m=await crowSupabase.from('crowspace_messages').select('*').eq('conversation_id',id).order('created_at',{ascending:true}).limit(200);const g=await CS.socialGraphMap(500);document.getElementById('messages').innerHTML=(m.data||[]).map(x=>'<div class="bubble '+(x.sender_id===u.id?'mine':'')+'"><small class="muted">'+esc((g[x.sender_id]||{}).display_name||'Member')+'</small><div>'+esc(x.body)+'</div></div>').join('')||'<div class="empty">Start the conversation.</div>';const box=document.getElementById('messages');box.scrollTop=box.scrollHeight;}document.getElementById('new').onclick=async()=>{const title=prompt('Conversation name','New Conversation');if(!title)return;const c=await crowSupabase.from('crowspace_conversations').insert({created_by:u.id,title,is_group:false}).select('id').single();if(c.error)return alert(c.error.message);const m=await crowSupabase.from('crowspace_conversation_members').insert({conversation_id:c.data.id,user_id:u.id});if(m.error)return alert(m.error.message);await load();open(c.data.id)};document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(!active)return;const input=document.getElementById('body'),body=input.value.trim();if(!body)return;const r=await crowSupabase.from('crowspace_messages').insert({conversation_id:active,sender_id:u.id,body});if(r.error)document.getElementById('msg').textContent=r.error.message;else{input.value='';open(active)}};load();});</script><script src="js/global-nav.js"></script></body></html>

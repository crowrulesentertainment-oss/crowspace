<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messenger | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.comm-grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.comm-card{background:linear-gradient(145deg,#11182b,#090d18);border:1px solid var(--line);border-radius:18px;padding:18px}.list{display:grid;gap:8px}.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}.item.active{border-color:#55b8ff}.messages{min-height:360px;max-height:58vh;overflow:auto;display:grid;align-content:start;gap:8px}.bubble{max-width:75%;padding:10px 13px;border-radius:14px;background:rgba(255,255,255,.06)}.mine{margin-left:auto;background:rgba(85,184,255,.14)}.composer{display:flex;gap:8px;margin-top:12px}.composer input{flex:1}.room-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.live-card{position:relative}.live-dot{color:#ff5364;font-weight:900}@media(max-width:800px){.comm-grid,.room-grid{grid-template-columns:1fr}} </style></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"><a href="login.html">Sign In</a></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">PHASE 4 · COMMUNICATION</p><h1>Messenger</h1><p class="muted">Private conversations across CrowSpace.</p></div></div><div class="comm-grid"><aside class="comm-card"><div class="actions"><button id="new" class="btn primary">+ New Conversation</button></div><input id="peopleSearch" placeholder="Find people to invite…" style="width:100%;margin-top:10px"><div id="people" class="list" style="margin-top:8px"></div><div id="invites" class="list" style="margin-top:10px"></div><div id="convos" class="list" style="margin-top:12px"></div></aside><section class="comm-card"><div id="title"><h2>Select a conversation</h2></div><div id="messages" class="messages"></div><div id="presenceLine" class="muted"></div><div id="typingLine" class="muted"></div><form id="form" class="composer"><input id="body" maxlength="5000" placeholder="Write a message…" autocomplete="off"><button class="btn primary">Send</button></form><p id="msg" class="muted"></p></section></div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await CS.user();if(!u){location.href='login.html';return}await CS.refreshHeader();let active=null;const esc=CS.escape;let realtimeChannel=null;async function loadPeople(){const q=document.getElementById('peopleSearch').value.trim();if(!q){document.getElementById('people').innerHTML='';return}const p=await crowSupabase.rpc('crowspace_public_profiles_search',{q,lim:12});document.getElementById('people').innerHTML=(p.data||[]).filter(x=>x.id!==u.id).map(x=>'<button class="item" data-person="'+x.id+'" style="width:100%;text-align:left"><strong>'+esc(x.display_name||x.username||'Member')+'</strong><br><small class="muted">@'+esc(x.username||'')+'</small></button>').join('');document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>invitePerson(b.dataset.person))}async function invitePerson(person){if(!active)return alert('Select a conversation first.');const r=await crowSupabase.from('crowspace_conversation_invites').upsert({conversation_id:active,inviter_id:u.id,invitee_id:person,status:'pending'},{onConflict:'conversation_id,invitee_id'});if(r.error)alert(r.error.message);else{document.getElementById('peopleSearch').value='';loadPeople();loadInvites()}}async function loadInvites(){const q=await crowSupabase.from('crowspace_conversation_invites').select('id,conversation_id,inviter_id,created_at').eq('invitee_id',u.id).eq('status','pending').order('created_at',{ascending:false});document.getElementById('invites').innerHTML=(q.data||[]).map(x=>'<div class="item"><strong>Conversation invitation</strong><div class="actions"><button class="btn" onclick="respondInvite(\''+x.id+'\',true)">Accept</button><button class="btn" onclick="respondInvite(\''+x.id+'\',false)">Decline</button></div></div>').join('')}window.respondInvite=async(id,accept)=>{const r=await crowSupabase.rpc('crowspace_respond_conversation_invite',{p_invite_id:id,p_accept:accept});if(r.error)alert(r.error.message);else{load();loadInvites()}}async function load(){const m=await crowSupabase.from('crowspace_conversation_members').select('conversation_id').eq('user_id',u.id);const ids=(m.data||[]).map(x=>x.conversation_id);if(!ids.length){document.getElementById('convos').innerHTML='<div class="empty">No conversations yet.</div>';return}const q=await crowSupabase.from('crowspace_conversations').select('*').in('id',ids).order('created_at',{ascending:false});document.getElementById('convos').innerHTML=(q.data||[]).map(x=>'<button class="item" data-id="'+x.id+'" style="width:100%;text-align:left"><strong>'+esc(x.title||'Conversation')+'</strong><br><small class="muted">'+(x.is_group?'Group':'Direct')+'</small></button>').join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id));}async function updatePresence(){if(!active||!window.msgPresence)return;const st=window.msgPresence.presenceState();const n=Object.values(st).reduce((a,v)=>a+v.length,0);document.getElementById('presenceLine').textContent=Math.max(0,n-1)+' other member(s) here'}async function open(id){active=id;const q=await crowSupabase.from('crowspace_conversations').select('title,is_group').eq('id',id).single();document.getElementById('title').innerHTML='<h2>'+esc(q.data?.title||'Conversation')+'</h2><button id="inviteBtn" class="btn">+ Invite People</button>';document.getElementById('inviteBtn').onclick=()=>document.getElementById('peopleSearch').focus();await crowSupabase.from('crowspace_conversation_members').update({last_read_at:new Date().toISOString()}).eq('conversation_id',id).eq('user_id',u.id);if(window.msgPresence)await window.msgPresence.untrack();window.msgPresence=crowSupabase.channel('crowspace-conversation-presence-'+id,{config:{presence:{key:u.id}}}).on('presence',{event:'sync'},updatePresence).on('presence',{event:'join'},updatePresence).on('presence',{event:'leave'},updatePresence).subscribe(async status=>{if(status==='SUBSCRIBED'){await window.msgPresence.track({online_at:new Date().toISOString()});updatePresence()}});const m=await crowSupabase.from('crowspace_messages').select('*').eq('conversation_id',id).order('created_at',{ascending:true}).limit(200);const g=await CS.socialGraphMap(500);document.getElementById('messages').innerHTML=(m.data||[]).map(x=>'<div class="bubble '+(x.sender_id===u.id?'mine':'')+'"><small class="muted">'+esc((g[x.sender_id]||{}).display_name||'Member')+'</small><div>'+esc(x.body)+'</div></div>').join('')||'<div class="empty">Start the conversation.</div>';const box=document.getElementById('messages');box.scrollTop=box.scrollHeight;}document.getElementById('new').onclick=async()=>{const title=prompt('Conversation name','New Conversation');if(!title)return;const c=await crowSupabase.from('crowspace_conversations').insert({created_by:u.id,title,is_group:false}).select('id').single();if(c.error)return alert(c.error.message);const m=await crowSupabase.from('crowspace_conversation_members').insert({conversation_id:c.data.id,user_id:u.id});if(m.error)return alert(m.error.message);await load();open(c.data.id)};document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(!active)return;const input=document.getElementById('body'),body=input.value.trim();if(!body)return;const r=await crowSupabase.from('crowspace_messages').insert({conversation_id:active,sender_id:u.id,body});if(r.error)document.getElementById('msg').textContent=r.error.message;else{input.value='';open(active)}};const bodyInput=document.getElementById('body');bodyInput.addEventListener('input',async()=>{if(!window.msgPresence)return;await window.msgPresence.track({online_at:new Date().toISOString(),typing:bodyInput.value.length>0});document.getElementById('typingLine').textContent=bodyInput.value.length?'Typing status shared with this conversation.':''});document.getElementById('peopleSearch').oninput=loadPeople;load();loadInvites();realtimeChannel=crowSupabase.channel('crowspace-messenger-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'crowspace_messages'},payload=>{if(active&&payload.new.conversation_id===active)open(active);else load()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'crowspace_conversation_invites'},payload=>{if(payload.new.invitee_id===u.id)loadInvites()}).subscribe();});</script><script src="js/global-nav.js"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover Collections — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/navigation.js"></script><style>
body{overflow-x:hidden}.hero{padding:46px 0 24px}.hero h1{margin:.2em 0}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tools input,.tools select{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:inherit}.sections{display:grid;gap:24px}.collection-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{padding:0;overflow:hidden}.cover{width:100%;height:150px;object-fit:cover;display:block}.fallback{height:150px;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,#101522,#24112c)}.body{padding:17px}.meta{font-size:12px;color:var(--muted)}.empty{padding:35px;text-align:center;color:var(--muted)}.theme-cinematic{background:linear-gradient(145deg,#101522,#24112c)}.theme-midnight{background:linear-gradient(145deg,#070b14,#12182a)}.theme-tacoma{background:linear-gradient(145deg,#101820,#15252b)}.theme-dreamscapes{background:linear-gradient(145deg,#151026,#24112c)}.theme-retro{background:linear-gradient(145deg,#21180e,#30220f)}.theme-halloween{background:linear-gradient(145deg,#160b0b,#27110b)}</style></head><body><div id="app"><header class="topbar"></header><main><section class="hero"><span class="eyebrow">CROWSPACE DISCOVERY</span><h1>Explore <em>Collections.</em></h1><p class="lead">Public collections shared by the CrowSpace community.</p><div class="tools"><input id="q" type="search" placeholder="Search collections…"><select id="sort"><option value="featured">Featured</option><option value="new">Newest</option><option value="items">Most saved items</option></select></div></section><div class="sections"><section class="panel"><div class="section-head"><div><span class="eyebrow">FEATURED</span><h2>Featured Collections</h2></div></div><div id="featured" class="collection-grid"></div></section><section class="panel"><div class="section-head"><div><span class="eyebrow">TRENDING</span><h2>Trending Collections</h2></div></div><div id="trending" class="collection-grid"></div></section></div></main></div><script>
document.addEventListener("DOMContentLoaded",async()=>{const {supabaseUrl,supabaseKey}=window.CROW_CONFIG||{};if(!supabaseUrl)return;const sb=supabase.createClient(supabaseUrl,supabaseKey),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let rows=[];
async function load(){const {data,error}=await sb.from("crowspace_saved_collections").select("id,name,description,cover_url,theme,visibility,discovery_score,created_at").in("visibility",["public","unlisted"]).order("discovery_score",{ascending:false}).limit(100);if(error){document.getElementById("featured").innerHTML='<div class="empty">Unable to load collections.</div>';return}rows=data||[];const ids=rows.map(x=>x.id);let counts=new Map();if(ids.length){const {data:i}=await sb.from("crowspace_saved_collection_items").select("collection_id").in("collection_id",ids);(i||[]).forEach(x=>counts.set(x.collection_id,(counts.get(x.collection_id)||0)+1))}rows=rows.map(x=>({...x,count:counts.get(x.id)||0}));render()}
function render(){const q=document.getElementById("q").value.toLowerCase().trim(),sort=document.getElementById("sort").value;let x=rows.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.description||"").toLowerCase().includes(q));x.sort((a,b)=>sort==="new"?new Date(b.created_at)-new Date(a.created_at):sort==="items"?b.count-a.count:b.discovery_score-a.discovery_score);const card=c=>'<article class="feed-card card '+esc("theme-"+(c.theme||"cinematic"))+'">'+(c.cover_url?'<img class="cover" src="'+esc(c.cover_url)+'" alt="" loading="lazy">':'<div class="fallback">◈</div>')+'<div class="body"><span class="eyebrow">'+esc(c.visibility.toUpperCase())+'</span><h3>'+esc(c.name)+'</h3><p>'+esc(c.description||"")+'</p><div class="meta">'+c.count+' saved item'+(c.count===1?"":"s")+'</div><a class="primary collection-open" href="public-collection.html?collection='+encodeURIComponent(c.id)+'">View Collection →</a></div></article>';document.getElementById("featured").innerHTML=x.slice(0,6).map(card).join("")||'<div class="empty">No matching collections.</div>';document.getElementById("trending").innerHTML=x.slice(6,12).map(card).join("")||'<div class="empty">More collections will appear here as people share them.</div>'}
document.getElementById("q").oninput=render;document.getElementById("sort").onchange=render;load()});
</script></body></html>

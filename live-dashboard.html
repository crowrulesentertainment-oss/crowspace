<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Dashboard | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">◉ CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">Nest</a><a href="caws.html">Caws</a><a href="groups.html">Groups</a><a class="active" href="live.html">Live</a></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">CREATOR CONTROL</p><h1>Live Dashboard</h1><p class="muted">Manage your CrowSpace broadcasts, YouTube status and archived Caws.</p></div><a class="btn primary" href="go-live.html">Go Live</a></div><div id="dashboard" class="grid"></div><div id="activity" class="section" style="padding:0;margin-top:24px"></div></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>const esc=CS.escape;function subscribe(){if(window.liveChannel)crowSupabase.removeChannel(window.liveChannel);window.liveChannel=crowSupabase.channel("crowspace-live-dashboard").on("postgres_changes",{event:"*",schema:"public",table:"crowspace_live_sessions",filter:"creator_id=eq."+window.dashboardUser},p=>load()).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_live_chat"},p=>{if(window.currentSessionId&&p.new?.session_id===window.currentSessionId) loadActivity(window.currentSessionId)}).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_live_reactions"},p=>{if(window.currentSessionId&&p.new?.session_id===window.currentSessionId) loadActivity(window.currentSessionId)}).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_live_viewers"},p=>{if(window.currentSessionId&&p.new?.session_id===window.currentSessionId) loadActivity(window.currentSessionId)}).subscribe()} async function loadActivity(id){const [chat,reactions,viewers]=await Promise.all([crowSupabase.from("crowspace_live_chat").select("id,body,created_at").eq("session_id",id).order("created_at",{ascending:false}).limit(5),crowSupabase.from("crowspace_live_reactions").select("id,reaction,created_at").eq("session_id",id).order("created_at",{ascending:false}).limit(5),crowSupabase.from("crowspace_live_viewers").select("user_id,last_seen_at").eq("session_id",id)]);const el=document.getElementById("activity");if(!el)return;el.innerHTML='<div class="card"><h3>Realtime Activity</h3><p>Viewers: '+(viewers.data?.length||0)+' · Chat: '+(chat.data?.length||0)+' recent · Reactions: '+(reactions.data?.length||0)+' recent</p><div class="muted">'+(chat.data||[]).map(x=>'💬 '+esc(x.body)).join("<br>")+'</div></div>'} async function load(){const u=await CS.user();if(!u){location.href="login.html";return}const box=document.getElementById("dashboard");const {data,error}=await crowSupabase.from("crowspace_live_sessions").select("id,title,description,category,status,provider,provider_stream_id,recording_url,caw_id,viewer_count,started_at,ended_at,created_at").eq("creator_id",u.id).order("created_at",{ascending:false}).limit(50);if(error){box.innerHTML='<div class="card"><p>'+esc(error.message)+'</p></div>';return}if(data?.length){window.currentSessionId=data[0].id;loadActivity(data[0].id)} if(!data?.length){box.innerHTML='<div class="card"><h2>No broadcasts yet</h2><p>Create your first CrowSpace Live broadcast.</p><a class="btn primary" href="go-live.html">Create Broadcast</a></div>';return}box.innerHTML=data.map(x=>{const live=x.status==="live";return '<article class="card live-card"><span class="live-dot" style="'+(live?'':'opacity:.25')+'"></span><div><h2>'+esc(x.title)+'</h2><p>'+esc(x.description||"No description")+'</p><p><strong>'+esc(x.status.toUpperCase())+'</strong> · '+esc(x.provider||"external")+' · '+Number(x.viewer_count||0)+' viewers</p><p class="muted">'+(x.started_at?'Started '+new Date(x.started_at).toLocaleString():'Created '+new Date(x.created_at).toLocaleString())+'</p><div class="actions"><a class="btn" href="live.html?session='+encodeURIComponent(x.id)+'">Open Live</a>'+(x.provider_stream_id?'<a class="btn" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+encodeURIComponent(x.provider_stream_id)+'">YouTube</a>':'')+(x.recording_url?'<a class="btn" target="_blank" rel="noopener" href="'+esc(x.recording_url)+'">Recording</a>':'')+(x.caw_id?'<a class="btn primary" href="caws.html">Caw Archive</a>':'')+'</div></div></article>'}).join("")}document.addEventListener("DOMContentLoaded",async()=>{const u=await CS.user();if(!u){location.href="login.html";return}window.dashboardUser=u.id;await load();subscribe()});</script></body></html>

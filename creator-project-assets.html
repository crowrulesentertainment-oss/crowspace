<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Project Assets 6.8 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{background:var(--p2);border:1px solid #292e42;border-radius:15px;padding:15px}.muted{color:var(--m)}.tag{font-size:10px;color:#8ff6ff;letter-spacing:.1em;font-weight:800}input,textarea,select{width:100%;background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px;padding:11px}textarea{min-height:80px}.empty{text-align:center;padding:25px;color:var(--m)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Project Asset Hub 6.8</span></div><div class="actions"><a class="btn" href="./creator-project-workspace.html">Tasks</a><a class="btn" href="./creator-team-workspace.html">Team</a><a class="btn" href="./creator-calendar.html">Calendar</a></div></div><section class="card"><label>Project</label><select id="pick"></select><div id="overview"></div></section><section class="card"><h2>📦 Add Project Asset</h2><div class="grid"><input id="name" placeholder="Asset name"><select id="type"><option>link</option><option>file</option><option>image</option><option>video</option><option>audio</option><option>document</option><option>script</option><option>other</option><input id="url" placeholder="Asset URL"></select></div><br><textarea id="description" placeholder="Description / notes"></textarea><br><br><button class="btn primary" id="add">Add Asset</button> <span id="msg" class="muted"></span></section><section class="card"><h2>🗂️ Asset Library</h2><div id="assets" class="grid"><div class="empty">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let me,projects=[];async function load(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_projects").select("id,title,description").eq("owner_id",me.id).order("created_at",{ascending:false});projects=r.data||[];pick.innerHTML=projects.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join("")||'<option value="">No projects</option>';await render()}async function render(){const p=projects.find(x=>x.id===pick.value);overview.innerHTML=p?'<h1>'+esc(p.title)+'</h1><p class="muted">'+esc(p.description||"")+'</p>':"";if(!p){assets.innerHTML='<div class="empty">Create a project first.</div>';return}const r=await db.from("crowspace_project_assets").select("id,name,asset_type,url,description,uploaded_by,created_at").eq("project_id",p.id).order("created_at",{ascending:false});assets.innerHTML=(r.data||[]).map(a=>'<article class="box"><span class="tag">'+esc(a.asset_type.toUpperCase())+'</span><h3>'+esc(a.name)+'</h3><p class="muted">'+esc(a.description||"")+'</p><p class="muted">'+new Date(a.created_at).toLocaleString()+'</p><div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="'+esc(a.url)+'">Open Asset</a><button class="btn" onclick="removeAsset(\''+a.id+'\')">Delete</button></div></article>').join("")||'<div class="empty">No assets yet.</div>'}pick.onchange=render;add.onclick=async()=>{if(!pick.value||!name.value.trim()||!url.value.trim()){msg.textContent="Project, asset name and URL are required.";return}const r=await db.from("crowspace_project_assets").insert({project_id:pick.value,uploaded_by:me.id,name:name.value.trim(),asset_type:type.value,url:url.value.trim(),description:description.value.trim()||null});msg.textContent=r.error?r.error.message:"Asset added.";if(!r.error){name.value="";url.value="";description.value="";render()}}async function removeAsset(id){if(!confirm("Delete this asset?"))return;const r=await db.from("crowspace_project_assets").delete().eq("id",id);if(r.error)alert(r.error.message);else render()}load();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="CrowSpace account, privacy and discovery settings"><title>Settings — CrowSpace</title><link rel="stylesheet" href="crowspace-rebuild.css"><link rel="stylesheet" href="crowspace-universal.css"><script src="crowspace-auth.js"></script><script src="js/crowspace-identity.js"></script><style>.settings{max-width:800px;margin:auto}.section{margin-top:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:12px;color:var(--muted);line-height:1.6}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main class="shell settings"><div class="kicker">CROWRULES // ACCOUNT CONTROL CENTER</div><section class="hero"><div class="eyebrow">UNIVERSAL ACCOUNT</div><h1>SETTINGS.</h1><p class="muted">Your CrowSpace identity, privacy and discovery controls live here.</p><div id="form" class="loading">LOADING ACCOUNT</div></section></main><script>
(async()=>{try{await CrowSpaceAuth.ready;const u=CrowSpaceAuth.user;if(!u){location.href="login.html?next=settings.html";return}await CrowSpaceAuth.ensureProfile(u);const db=CrowSpaceAuth.client;const r=await db.from("crowspace_profiles").select("username,display_name,bio,creator_category,profile_theme,privacy_profile,privacy_posts,privacy_media,privacy_activity,privacy_connections,privacy_guestbook,privacy_messages,allow_guestbook").eq("user_id",u.id).single();if(r.error)throw r.error;const p=r.data;const opts=v=>["public","members","friends","private"].map(x=>'<option value="'+x+'" '+(x===v?"selected":"")+'>'+x.toUpperCase()+'</option>').join("");document.getElementById("form").className="";document.getElementById("form").innerHTML=`
<div class="section"><h2>IDENTITY</h2><div class="row"><div class="field"><label>Username</label><input id="username" value="${esc(p.username)}" maxlength="30"></div><div class="field"><label>Display name</label><input id="display" value="${esc(p.display_name)}" maxlength="80"></div></div><div class="field"><label>Bio</label><textarea id="bio" maxlength="500">${esc(p.bio)}</textarea></div><div class="row"><div class="field"><label>Creator category</label><input id="cat" value="${esc(p.creator_category)}" maxlength="80"></div><div class="field"><label>Profile theme</label><select id="theme"><option value="cinematic">Cinematic</option><option value="cyberpunk">Cyberpunk</option><option value="minimal">Minimal</option><option value="neon">Neon</option></select></div></div><button class="btn primary" id="save">Save Identity</button></div>
<div class="section"><h2>PRIVACY</h2><div class="row"><div class="field"><label>Profile</label><select data-k="privacy_profile">${opts(p.privacy_profile)}</select></div><div class="field"><label>Posts</label><select data-k="privacy_posts">${opts(p.privacy_posts)}</select></div><div class="field"><label>Media</label><select data-k="privacy_media">${opts(p.privacy_media)}</select></div><div class="field"><label>Activity</label><select data-k="privacy_activity">${opts(p.privacy_activity)}</select></div><div class="field"><label>Connections</label><select data-k="privacy_connections">${opts(p.privacy_connections)}</select></div><div class="field"><label>Guestbook</label><select data-k="privacy_guestbook">${opts(p.privacy_guestbook)}</select></div><div class="field"><label>Messages</label><select data-k="privacy_messages">${opts(p.privacy_messages)}</select></div></div><label><input id="guest" type="checkbox" ${p.allow_guestbook?"checked":""}> Allow guestbook</label><br><button class="btn" id="privacy" style="margin-top:12px">Save Privacy</button></div>
<div class="section" id="verification"><h2>CREATOR VERIFICATION</h2><p class="hint">Verification is reviewed manually. It does not change your ability to participate in CrowSpace.</p><div class="field"><label>Statement</label><textarea id="statement" maxlength="1500" placeholder="Tell CrowRules about your creator work."></textarea></div><div class="field"><label>Evidence / portfolio URL</label><input id="evidence" type="url" placeholder="https://..."></div><button class="btn" id="request">Submit Verification Request</button></div>
<div class="section"><h2>DISCOVERY</h2><p class="hint">Control whether CrowSpace learns from your activity to personalize recommendations.</p><label><input id="personal" type="checkbox" checked> Personalization enabled</label><br><label><input id="adaptive" type="checkbox" checked> Adaptive feed enabled</label><br><label><input id="recommend" type="checkbox" checked> Recommendations enabled</label></div>
<div class="actions" style="margin-top:22px"><a class="btn primary" href="identity.html">Identity Center</a><a class="btn" href="privacy.html">Privacy Center</a><a class="btn" href="discovery.html">Discover</a><a class="btn" href="profile.html">Profile</a></div><div id="msg" class="status" style="margin-top:15px"></div>`;document.getElementById("theme").value=p.profile_theme||"cinematic";const msg=x=>document.getElementById("msg").textContent=x;document.getElementById("save").onclick=async()=>{const username=document.getElementById("username").value.trim().toLowerCase().replace(/[^a-z0-9_.]/g,"").slice(0,30);if(username.length<3)return msg("Username must contain at least 3 valid characters.");const z=await db.from("crowspace_profiles").update({username,display_name:document.getElementById("display").value.trim(),bio:document.getElementById("bio").value.trim(),creator_category:document.getElementById("cat").value.trim(),profile_theme:document.getElementById("theme").value}).eq("user_id",u.id);msg(z.error?z.error.message:"Identity saved.")};document.getElementById("privacy").onclick=async()=>{const data={};document.querySelectorAll("[data-k]").forEach(x=>data[x.dataset.k]=x.value);data.allow_guestbook=document.getElementById("guest").checked;const z=await db.from("crowspace_profiles").update(data).eq("user_id",u.id);msg(z.error?z.error.message:"Privacy settings saved.")};document.getElementById("request").onclick=async()=>{const z=await db.from("crowspace_verification_requests").insert({user_id:u.id,requested_role:"verified_creator",statement:document.getElementById("statement").value.trim(),evidence_url:document.getElementById("evidence").value.trim()});msg(z.error?z.error.message:"Verification request submitted.")};const ds=await db.from("crowspace_discovery_settings").select("personalization_enabled,adaptive_feed_enabled,recommendations_enabled").eq("user_id",u.id).maybeSingle();if(ds.data){personal.checked=ds.data.personalization_enabled;adaptive.checked=ds.data.adaptive_feed_enabled;recommend.checked=ds.data.recommendations_enabled}document.querySelectorAll("#personal,#adaptive,#recommend").forEach(el=>el.onchange=async()=>{const payload={user_id:u.id,personalization_enabled:personal.checked,adaptive_feed_enabled:adaptive.checked,recommendations_enabled:recommend.checked,updated_at:new Date().toISOString()};await db.from("crowspace_discovery_settings").upsert(payload,{onConflict:"user_id"});msg("Discovery preferences saved.")})}catch(e){document.getElementById("form").innerHTML='<div class="status">'+esc(e.message)+'</div>'}})();function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings — CrowSpace</title><link rel="stylesheet" href="crowspace-rebuild.css"><link rel="stylesheet" href="crowspace-universal.css"><script src="crowspace-auth.js"></script><script src="js/crowspace-identity.js"></script><script src="js/crowspace-preference-runtime-21-12.js"></script><script src="js/crowspace-preference-center-21-16.js"></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script>
</head><body><main class="shell settings"><div class="kicker">CROWRULES // ACCOUNT CONTROL CENTER</div><section class="hero"><div class="eyebrow">UNIVERSAL ACCOUNT</div><h1>SETTINGS.</h1><p class="muted">Identity, privacy and member-controlled discovery.</p><div id="form" class="loading">LOADING ACCOUNT</div></section></main><script>
(async()=>{const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));try{await CrowSpaceAuth.ready;const u=CrowSpaceAuth.user;if(!u){location.href="login.html?next=settings.html";return}await CrowSpaceAuth.ensureProfile(u);const db=CrowSpaceAuth.client;const r=await db.from("crowspace_profiles").select("username,display_name,bio,creator_category,profile_theme").eq("user_id",u.id).single();if(r.error)throw r.error;const p=r.data;document.getElementById("form").className="";document.getElementById("form").innerHTML='<div class="section"><h2>IDENTITY</h2><p class="hint">Signed in as '+esc(p.display_name||p.username||u.email)+'</p><div class="actions"><a class="btn" href="identity.html">Identity Center</a><a class="btn" href="profile.html">Profile</a></div></div><div class="section"><h2>UNIVERSAL PERSONALIZATION</h2><p class="hint">Your recommendation controls are stored with your CrowRules account. Changes can synchronize to supported CrowSpace surfaces.</p><div id="cr2116-center"></div></div><div class="section"><h2>PRIVACY & ACCOUNT</h2><div class="actions"><a class="btn" href="privacy.html">Privacy Center</a><a class="btn" href="discovery.html">Discovery</a><a class="btn" href="index.html">CrowSpace Home</a></div></div>';window.CrowSpacePreferenceCenter21_16.install();await window.CrowSpacePreferenceCenter21_16.init(db,u,document.getElementById("cr2116-center"))}catch(e){document.getElementById("form").innerHTML='<div class="status">'+esc(e.message)+'</div>'}})();</script></body></html>

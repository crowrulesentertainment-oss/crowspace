<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>People | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">CROWSPACE SOCIAL GRAPH</p><h1>Find People</h1><p class="muted">Discover members through mutual friends, follows, presence and activity.</p></div><input id="search" class="input" placeholder="Search people…"></div><div id="people" class="grid three"></div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>
let all=[];const esc=CS.escape;
function relationButton(p){if(p.relationship==="friend")return '<span class="btn">✓ Friends</span>';if(p.relationship==="incoming")return '<button class="btn primary" onclick="connect(\''+p.id+'\')">Accept Friend</button>';if(p.relationship==="outgoing")return '<span class="btn">Request Sent</span>';return '<button class="btn primary" onclick="connect(\''+p.id+'\')">Add Friend</button>'}
function render(){const q=search.value.trim().toLowerCase();const d=all.filter(p=>(p.display_name||"").toLowerCase().includes(q)||(p.username||"").toLowerCase().includes(q)||(p.bio||"").toLowerCase().includes(q));people.innerHTML=d.map(p=>'<article class="card social-card"><div class="media-owner"><a class="avatar sm" href="profile.html?id='+encodeURIComponent(p.id)+'">'+esc((p.display_name||p.username||"C").slice(0,1).toUpperCase())+'</a><div><h3><a href="profile.html?id='+encodeURIComponent(p.id)+'">'+esc(p.display_name||"CrowSpace Member")+'</a></h3><p class="muted">@'+esc(p.username||"member")+'</p></div></div>'+CS.socialPersonMeta(p)+'<p>'+esc(p.bio||"")+'</p>'+CS.activityLinks(p)+'<div class="social-actions">'+relationButton(p)+'<button class="btn" onclick="follow(\''+p.id+'\')">'+(p.is_following?"Unfollow":"Follow")+'</button><a class="btn" href="profile.html?id='+encodeURIComponent(p.id)+'">Visit Nest →</a></div></article>').join("")||'<div class="card"><h3>No members found.</h3><p>Try another search.</p></div>'}
async function connect(id){await CS.friendAction(id);location.reload()}async function follow(id){await CS.followAction(id);location.reload()}
document.addEventListener("DOMContentLoaded",async()=>{if(!await CS.user()){location.href="login.html";return}await CS.refreshHeader();all=await CS.socialGraph(250);render();search.oninput=render});
</script><script src="js/global-nav.js"></script></body></html>

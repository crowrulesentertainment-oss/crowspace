<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>People | CrowSpace</title>
<link rel="stylesheet" href="css/crowspace.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.people-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.people-toolbar .input{flex:1;min-width:240px}
.people-status{margin:10px 0 20px}
.people-empty{text-align:center;padding:40px 20px}
.people-card .social-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.people-card .social-actions .btn{font-size:.9rem}
.people-loading{display:grid;gap:12px}
.people-skeleton{height:190px;border-radius:14px;opacity:.45}
</style>
</head>
<body>
<header class="site-header">
<a class="brand" href="index.html">● CROWSPACE</a>
<nav></nav>
<div id="account"><a href="login.html">Sign In</a></div>
</header>

<main class="section">
<div class="section-head">
<div>
<p class="eyebrow">CROWSPACE SOCIAL GRAPH</p>
<h1>Find People</h1>
<p class="muted">Discover members through mutual friends, follows, presence and activity.</p>
</div>
</div>

<div class="people-toolbar">
<input id="search" class="input" type="search" autocomplete="off" placeholder="Search people…">
<select id="sort" class="input" style="max-width:220px">
<option value="relevance">Recommended</option>
<option value="name">Name A–Z</option>
<option value="friends">Most Friends</option>
<option value="activity">Most Active</option>
<option value="online">Online First</option>
</select>
<button id="clearSearch" class="btn" type="button">Clear</button>
</div>

<div id="status" class="people-status muted" aria-live="polite">Loading people…</div>
<div id="people" class="grid three" aria-live="polite"></div>
</main>

<footer>CrowSpace · One Account. One Universe.</footer>

<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/crowspace.js"></script>
<script>
(function(){
  "use strict";

  let all=[];
  let currentUser=null;
  let busy=false;

  const $=id=>document.getElementById(id);
  const escape=window.CS.escape;

  function initials(p){
    return escape((p.display_name||p.username||"C").trim().slice(0,1).toUpperCase());
  }

  function activityTotal(p){
    return Number(p.post_count||0)+Number(p.caw_count||0)+Number(p.photo_count||0)+Number(p.event_count||0);
  }

  function relationshipLabel(p){
    if(p.relationship==="friend") return "Friends";
    if(p.relationship==="incoming") return "Friend request";
    if(p.relationship==="outgoing") return "Request sent";
    return "Not connected";
  }

  function relationshipControl(p){
    if(p.relationship==="friend"){
      return '<button class="btn" type="button" data-action="unfriend" data-id="'+p.id+'">Friends ✓</button>';
    }
    if(p.relationship==="incoming"){
      return '<button class="btn primary" type="button" data-action="friend" data-id="'+p.id+'">Accept Friend</button>';
    }
    if(p.relationship==="outgoing"){
      return '<span class="btn" aria-disabled="true">Request Sent</span>';
    }
    return '<button class="btn primary" type="button" data-action="friend" data-id="'+p.id+'">Add Friend</button>';
  }

  function followControl(p){
    return '<button class="btn" type="button" data-action="follow" data-id="'+p.id+'">'+
      (p.is_following?"Unfollow":"Follow")+'</button>';
  }

  function card(p){
    const name=escape(p.display_name||"CrowSpace Member");
    const username=escape(p.username||"member");
    const bio=escape(p.bio||"");
    const online=p.is_online
      ? '<span class="online-dot">● Online</span>'
      : '<span class="muted">Offline</span>';

    return '<article class="card social-card people-card">'+
      '<div class="media-owner">'+
        '<a class="avatar sm" href="profile.html?id='+encodeURIComponent(p.id)+'" aria-label="Open '+name+' profile">'+initials(p)+'</a>'+
        '<div><h3><a href="profile.html?id='+encodeURIComponent(p.id)+'">'+name+'</a></h3>'+
        '<p class="muted">@'+username+'</p></div>'+
      '</div>'+
      '<div class="social-meta">'+online+' · '+escape(relationshipLabel(p))+' · '+
        Number(p.mutual_friends_count||0)+' mutual · '+Number(p.friend_count||0)+' friends</div>'+
      (bio?'<p>'+bio+'</p>':'')+
      '<div class="activity-links">'+
        '<a href="profile.html?id='+encodeURIComponent(p.id)+'">Nest</a>'+
        '<a href="caws.html?user='+encodeURIComponent(p.id)+'">'+Number(p.caw_count||0)+' Caws</a>'+
        '<a href="albums.html?user='+encodeURIComponent(p.id)+'">'+Number(p.photo_count||0)+' Photos</a>'+
        '<a href="events.html?user='+encodeURIComponent(p.id)+'">'+Number(p.event_count||0)+' Events</a>'+
        '<span>'+Number(p.post_count||0)+' Posts</span>'+
        '<span>'+Number(p.group_count||0)+' Groups</span>'+
      '</div>'+
      '<div class="social-actions">'+
        '<a class="btn primary" href="messenger.html?to='+encodeURIComponent(p.id)+'">Message</a>'+
        relationshipControl(p)+
        followControl(p)+
        '<a class="btn" href="profile.html?id='+encodeURIComponent(p.id)+'">Visit Nest →</a>'+
      '</div>'+
    '</article>';
  }

  function sorted(list){
    const mode=$("sort").value;
    return list.slice().sort((a,b)=>{
      if(mode==="name") return String(a.display_name||a.username||"").localeCompare(String(b.display_name||b.username||""));
      if(mode==="friends") return Number(b.friend_count||0)-Number(a.friend_count||0);
      if(mode==="activity") return activityTotal(b)-activityTotal(a);
      if(mode==="online") return Number(b.is_online)-Number(a.is_online);
      if((b.is_online?1:0)!==(a.is_online?1:0)) return Number(b.is_online)-Number(a.is_online);
      return Number(b.mutual_friends_count||0)-Number(a.mutual_friends_count||0);
    });
  }

  function render(){
    const q=$("search").value.trim().toLowerCase();
    let list=all.filter(p=>{
      if(!q) return true;
      return String(p.display_name||"").toLowerCase().includes(q) ||
             String(p.username||"").toLowerCase().includes(q) ||
             String(p.bio||"").toLowerCase().includes(q);
    });
    list=sorted(list);

    $("status").textContent=list.length+
      (list.length===1?" person":" people")+
      (q?" matching “"+q+"”":"");
    $("people").innerHTML=list.length
      ? list.map(card).join("")
      : '<div class="card people-empty"><h3>No people found</h3><p class="muted">Try another name, username, or search term.</p></div>';
  }

  async function load(){
    if(busy)return;
    busy=true;
    $("status").textContent="Loading people…";
    $("people").innerHTML='<div class="people-loading"><div class="card people-skeleton"></div><div class="card people-skeleton"></div></div>';

    try{
      if(!window.CS || !CS.client) throw new Error("CrowSpace could not connect to Supabase.");
      currentUser=await CS.user();
      if(!currentUser){
        window.location.href="login.html";
        return;
      }
      await CS.refreshHeader();

      const {data,error}=await CS.client.rpc("crowspace_social_graph",{p_limit:500});
      if(error) throw error;

      all=(Array.isArray(data)?data:[]).filter(p=>p && p.id && p.id!==currentUser.id);
      render();
    }catch(error){
      console.error("People page failed:",error);
      $("status").textContent="Unable to load people.";
      $("people").innerHTML='<div class="card people-empty"><h3>People could not be loaded</h3><p class="muted">'+
        escape(error?.message||"Please try again.")+
        '</p><button id="retryPeople" class="btn primary" type="button">Try Again</button></div>';
      $("retryPeople").onclick=load;
    }finally{
      busy=false;
    }
  }

  async function action(type,id){
    if(!id || busy)return;
    const p=all.find(x=>x.id===id);
    if(!p)return;

    try{
      busy=true;
      if(type==="friend"){
        await CS.friendAction(id);
      }else if(type==="follow"){
        await CS.followAction(id);
      }else if(type==="unfriend"){
        await CS.unfriend(id);
        return;
      }
      await load();
    }catch(error){
      console.error("People action failed:",error);
      alert(error?.message||"That action could not be completed.");
    }finally{
      busy=false;
    }
  }

  $("people").addEventListener("click",function(ev){
    const button=ev.target.closest("[data-action]");
    if(!button)return;
    ev.preventDefault();
    action(button.dataset.action,button.dataset.id);
  });

  $("search").addEventListener("input",render);
  $("sort").addEventListener("change",render);
  $("clearSearch").addEventListener("click",function(){
    $("search").value="";
    render();
    $("search").focus();
  });

  document.addEventListener("DOMContentLoaded",load);
})();
</script>
<script src="js/global-nav.js?v=20260927-5"></script>
</body>
</html>

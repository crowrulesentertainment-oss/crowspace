<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>People | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">My Nest</a><a class="active" href="people.html">People</a><a href="friends.html">Friends</a><a href="caws.html">Caws</a><a href="albums.html">Photos</a><a href="groups.html">Groups</a><a href="events.html">Events</a><a href="notifications.html">Messages</a></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">CROWSPACE COMMUNITY</p><h1>Find People</h1><p class="muted">Discover members and visit their Nests.</p></div><input id="search" class="input" placeholder="Search people…"></div><div id="people" class="grid three"></div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>let all=[];const esc=CS.escape;function render(){const q=search.value.trim().toLowerCase();const d=all.filter(p=>(p.display_name||"").toLowerCase().includes(q)||(p.username||"").toLowerCase().includes(q)||(p.bio||"").toLowerCase().includes(q));people.innerHTML=d.map(p=>'<article class="card"><div class="avatar sm">'+esc((p.display_name||p.username||"C").slice(0,1).toUpperCase())+'</div><h3>'+esc(p.display_name||"CrowSpace Member")+'</h3><p class="muted">@'+esc(p.username||"member")+'</p><p>'+esc(p.bio||"")+'</p><a class="btn primary" href="profile.html?id='+encodeURIComponent(p.id)+'">Visit Nest →</a></article>').join("")||'<div class="card"><h3>No members found.</h3><p>Try another search.</p></div>'}document.addEventListener("DOMContentLoaded",async()=>{await CS.refreshHeader();const {data,error}=await crowSupabase.rpc("crowspace_people_public",{p_limit:100});if(error){people.innerHTML='<div class="card"><h3>People unavailable</h3><p>'+esc(error.message)+'</p></div>';return}all=data||[];render();search.oninput=render});</script></body></html>

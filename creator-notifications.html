<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Notifications — CrowSpace</title><style>body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial}main{max-width:1000px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:18px;margin:0 0 15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#151827;border-radius:12px;padding:14px;text-align:center}.stat b{display:block;font-size:24px}.item{padding:13px 0;border-bottom:1px solid #25293a}.tag{font-size:10px;letter-spacing:.1em;color:#8ff6ff;font-weight:800}.muted{color:#9da5bd}.empty{text-align:center;padding:28px}.unread{background:#111b2b;padding-left:10px;border-left:3px solid #20e6ff}select,input{font:inherit;color:#fff;background:#171a29;border:1px solid #363c55;border-radius:10px;padding:10px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Creator Notifications</span></div><a class="btn" href="./creator-dashboard.html">← Command Center</a></div><section class="card"><h1>🔔 Creator Activity Center</h1><p class="muted">One place for creator-focused alerts and workflow attention.</p><div class="grid" id="stats"></div></section><section class="card"><div class="actions"><input id="search" placeholder="Search alerts…"><select id="filter"><option value="all">All Alerts</option><option value="follow">Followers</option><option value="post">Posts</option><option value="comment">Comments</option><option value="message">Messages</option><option value="creator">CrowRules Creator Activity</option><option value="queue">Publishing Queue</option></select><button class="btn" id="read">Mark All Read</button></div></section><section class="card"><div id="list"><div class="empty">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me,data=[];const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const icon=t=>String(t||"").toLowerCase().includes("follow")?"👤":String(t||"").toLowerCase().includes("comment")?"💬":String(t||"").toLowerCase().includes("message")?"✉️":String(t||"").toLowerCase().includes("post")?"📝":"🔔";function render(){const f=filter.value,q=search.value.toLowerCase();const a=data.filter(x=>(f==="all"||(f==="creator"&&String(x.type).startsWith("creator"))||(f==="queue"&&String(x.type).includes("queue"))||String(x.type).toLowerCase().includes(f))&&(!q||[x.type,x.message].join(" ").toLowerCase().includes(q)));const unread=data.filter(x=>!x.is_read).length,today=data.filter(x=>new Date(x.created_at)>=new Date(new Date().setHours(0,0,0,0))).length;stats.innerHTML=[["🔔",data.length,"Total"],["●",unread,"Unread"],["📅",today,"Today"],["⚡",data.filter(x=>String(x.type).startsWith("creator")||String(x.type).includes("queue")).length,"Creator Alerts"]].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b><span class="muted">'+x[2]+'</span></div>').join("");list.innerHTML=a.map(x=>'<div class="item '+(!x.is_read?"unread":"")+'"><span class="tag">'+icon(x.type)+" "+esc(x.type||"ACTIVITY")+'</span><div><b>'+esc(x.message||"Creator activity")+'</b></div><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div><div class="actions">'+(!x.is_read?'<button class="btn" onclick="markOne(\''+x.id+'\')">Mark Read</button>':"")+(x.reference_id?'<button class="btn" onclick="openRef(\''+x.reference_id+'\',\''+x.type+'\')">Open</button>':"")+"</div></div>").join("")||'<div class="empty">No matching creator alerts.</div>'}async function load(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_notifications").select("id,user_id,type,actor_id,reference_id,message,is_read,created_at").eq("user_id",me.id).order("created_at",{ascending:false}).limit(300);if(r.error){list.innerHTML='<div class="empty">'+esc(r.error.message)+"</div>";return}data=r.data||[];render();db.channel("creator-notifications-"+me.id).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_notifications",filter:"user_id=eq."+me.id},()=>load()).subscribe()}async function markOne(id){await db.from("crowspace_notifications").update({is_read:true}).eq("id",id).eq("user_id",me.id);await load()}read.onclick=async()=>{await db.from("crowspace_notifications").update({is_read:true}).eq("user_id",me.id).eq("is_read",false);await load()};function openRef(id,t){const s=String(t).toLowerCase();if(s.includes("message"))location.href="./messages.html";else if(s.includes("friend"))location.href="./friend-requests.html";else if(s.includes("media"))location.href="./media.html";else if(s.includes("follow"))location.href="./search.html";else if(s.includes("creator_project")||s.includes("creator_dream"))location.href="https://crowrulesentertainment-oss.github.io/dreamscapes/";else if(s.includes("creator_podcast"))location.href="https://crowrulesentertainment-oss.github.io/podcasting/";else location.href="./creator-studio.html"}search.oninput=render;filter.onchange=render;load();</script></body></html>

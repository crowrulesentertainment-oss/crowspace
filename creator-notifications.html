<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Engagement Inbox 3.0 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin:0 0 15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stat{background:var(--p2);border-radius:12px;padding:13px;text-align:center}.stat b{display:block;font-size:23px}.layout{display:grid;grid-template-columns:250px 1fr;gap:15px}.filters button{width:100%;margin-bottom:7px;text-align:left}.filters .active{outline:2px solid var(--a)}.item{padding:14px;border-bottom:1px solid #25293a}.item:last-child{border:0}.unread{background:#111b2b;border-left:3px solid var(--a)}.tag{font-size:10px;letter-spacing:.1em;color:#8ff6ff;font-weight:800}.actor{color:#8ff6ff}.muted{color:var(--m)}.empty{text-align:center;padding:28px}.reply{margin-top:9px;width:100%;min-height:70px;background:#080a12;color:#fff;border:1px solid #363c55;border-radius:10px;padding:10px}.toast{position:fixed;right:18px;bottom:18px;background:#111827;border:1px solid #405078;padding:13px 16px;border-radius:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:450px){main{padding:9px}.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Creator Engagement Inbox 3.0</span></div><a class="btn" href="./creator-dashboard.html">← Command Center</a></div><section class="card"><h1>📥 Creator Engagement Inbox</h1><p class="muted">Turn activity around your work into actions. Review, open, acknowledge and respond.</p><div class="grid" id="stats"></div></section><div class="layout"><aside class="card filters"><h3>FILTERS</h3><button class="btn active" data-f="all">🔔 All Activity</button><button class="btn" data-f="follow">👤 Followers</button><button class="btn" data-f="like">❤️ Likes</button><button class="btn" data-f="comment">💬 Comments</button><button class="btn" data-f="message">✉️ Messages</button><button class="btn" data-f="creator">🌌 Creator Activity</button><button class="btn" data-f="queue">📤 Publishing Queue</button><button class="btn" data-f="unread">🔵 Unread</button></aside><section class="card"><div class="actions"><input id="search" placeholder="Search engagement…" style="flex:1;min-width:220px;background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px;padding:10px"><button class="btn" id="read">✓ Mark All Read</button><a class="btn" href="./creator-studio.html">Studio</a><a class="btn" href="./creator-queue.html">Queue</a></div><div id="list"><div class="empty">Loading…</div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me,data=[],mode="all";const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const kind=t=>{t=String(t||"").toLowerCase();return t.includes("follow")?"follow":t.includes("like")||t.includes("reaction")?"like":t.includes("comment")?"comment":t.includes("message")?"message":t.includes("queue")?"queue":t.startsWith("creator")?"creator":"other"};const ico=k=>({follow:"👤",like:"❤️",comment:"💬",message:"✉️",queue:"📤",creator:"🌌",other:"🔔"})[k];function render(){const q=search.value.trim().toLowerCase();const rows=data.filter(x=>{const k=kind(x.type);return(mode==="all"||mode===k||(mode==="unread"&&!x.is_read))&&(!q||[x.type,x.message].join(" ").toLowerCase().includes(q))});const u=data.filter(x=>!x.is_read).length;stats.innerHTML=[["🔔",data.length,"Total"],["🔵",u,"Unread"],["👤",data.filter(x=>kind(x.type)==="follow").length,"Followers"],["💬",data.filter(x=>kind(x.type)==="comment").length,"Comments"],["❤️",data.filter(x=>kind(x.type)==="like").length,"Likes"]].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b><span class="muted">'+x[2]+"</span></div>").join("");list.innerHTML=rows.map(x=>{const k=kind(x.type);return '<article class="item '+(!x.is_read?"unread":"")+'"><span class="tag">'+ico(k)+" "+esc(x.type||"ACTIVITY")+'</span><div style="margin-top:5px"><b>'+esc(x.message||"Creator activity")+'</b></div><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div><div class="actions">'+(!x.is_read?'<button class="btn" onclick="markOne(\''+x.id+'\')">Mark Read</button>':"")+(x.actor_id?'<a class="btn" href="./profile.html?u='+encodeURIComponent(x.actor_id)+'">View Member</a>':"")+(x.reference_id?'<button class="btn" onclick="openRef(\''+x.reference_id+'\',\''+x.type+'\')">Open</button>':"")+(k==="comment"?'<button class="btn" onclick="replyTo(\''+x.reference_id+'\')">Reply</button>':"")+"</div></article>"}) .join("")||'<div class="empty">No engagement matches this view.</div>'}async function load(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_notifications").select("id,user_id,type,actor_id,reference_id,message,is_read,created_at").eq("user_id",me.id).order("created_at",{ascending:false}).limit(500);if(r.error){list.innerHTML='<div class="empty">'+esc(r.error.message)+"</div>";return}data=r.data||[];render()}async function markOne(id){await db.from("crowspace_notifications").update({is_read:true}).eq("id",id).eq("user_id",me.id);await load()}read.onclick=async()=>{await db.from("crowspace_notifications").update({is_read:true}).eq("user_id",me.id).eq("is_read",false);await load()};function openRef(id,t){const s=String(t).toLowerCase();if(s.includes("message"))location.href="./messages.html";else if(s.includes("friend"))location.href="./friend-requests.html";else if(s.includes("media"))location.href="./media.html";else if(s.includes("follow"))location.href="./search.html";else if(s.includes("creator_project")||s.includes("creator_dream"))location.href="https://crowrulesentertainment-oss.github.io/dreamscapes/";else if(s.includes("creator_podcast"))location.href="https://crowrulesentertainment-oss.github.io/podcasting/";else location.href="./creator-studio.html"}function replyTo(id){location.href="./messages.html"+(id?"?ref="+encodeURIComponent(id):"")}document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{mode=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("active",x===b));render()});search.oninput=render;load();db.auth.onAuthStateChange(()=>setTimeout(load,0));</script></body></html>

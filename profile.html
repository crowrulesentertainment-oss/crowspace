<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Profile</title><style>
body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif;background-image:radial-gradient(circle at 20% 0,#19213d,transparent 35%)}main{max-width:1000px;margin:25px auto;padding:15px}.card{background:#0d0f18eF;border:1px solid #292e42;border-radius:18px;padding:20px;margin-bottom:16px}.cover{height:230px;border-radius:14px;background:linear-gradient(135deg,#13283a,#542b7a,#181020);background-size:cover}.avatar{width:125px;height:125px;margin:-62px 0 0 25px;border:5px solid #0d0f18;border-radius:50%;background:#252a40;display:grid;place-items:center;font-size:38px;font-weight:bold;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.muted{color:#9da5bd}.btn{display:inline-block;padding:10px 14px;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;border:1px solid #363c55;cursor:pointer}.primary{background:linear-gradient(90deg,#126d7a,#56358c);border:0}.grid{display:grid;grid-template-columns:1fr 1.7fr;gap:16px}.friendgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.friend{background:#151827;border-radius:12px;padding:12px;text-align:center}.mini{width:65px;height:65px;margin:auto;border-radius:50%;background:#252a40;display:grid;place-items:center;font-weight:bold;overflow:hidden}.mini img{width:100%;height:100%;object-fit:cover}.guest{padding:12px 0;border-bottom:1px solid #25293a}.music{padding:12px;border-radius:12px;background:#111c29;border:1px solid #24465a}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.friendgrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><div class="card"><div class="cover" id="cover"></div><div class="avatar" id="avatar">C</div><h1 id="name">CrowSpace Member</h1><div class="muted" id="handle">@member</div><p id="bio">Welcome to CrowSpace.</p><p class="muted" id="location"></p><div class="actions"><button class="btn primary" id="friendBtn">Add Friend</button><a class="btn" id="messageBtn">Message</a><a class="btn" id="editBtn" href="./edit-profile.html">Edit Profile</a><a class="btn" href="./">← CrowSpace</a></div></div><div class="grid"><div><div class="card"><h3>TOP 8 FRIENDS</h3><div class="friendgrid" id="top8"></div></div><div class="card"><h3>PROFILE MUSIC</h3><div class="music" id="music">No profile music added.</div></div><div class="card"><h3>INTERESTS</h3><p id="interests" class="muted">No interests listed.</p></div></div><div><div class="card"><h3>GUESTBOOK</h3><textarea id="guestMsg" placeholder="Leave a message..." style="width:100%;box-sizing:border-box;min-height:80px;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px;padding:12px"></textarea><button class="btn primary" id="guestBtn" style="margin-top:8px">Sign Guestbook</button><div id="guestbook"></div></div><div class="card"><h3>RECENT BULLETINS</h3><div id="posts" class="muted">Loading...</div></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const username=new URLSearchParams(location.search).get("u");let session,profile;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ini(s){return (s||"C").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}
async function init(){session=(await db.auth.getSession()).data.session;const r=await db.from("crowspace_profiles").select("*").eq("username",username).maybeSingle();if(r.error||!r.data){document.querySelector("main").innerHTML='<div class="card"><h1>Profile not found</h1><a href="./">Back to CrowSpace</a></div>';return}profile=r.data;name.textContent=profile.display_name||"CrowSpace Member";handle.textContent="@"+profile.username;bio.textContent=profile.bio||"Welcome to CrowSpace.";location.textContent=profile.location||"";interests.textContent=profile.interests||"No interests listed.";if(profile.avatar_url)avatar.innerHTML='<img src="'+esc(profile.avatar_url)+'">';if(profile.banner_url)cover.style.backgroundImage='url("'+esc(profile.banner_url)+'")';if(profile.music_text||profile.music_url)music.innerHTML=esc(profile.music_text||"Profile music")+" "+(profile.music_url?'<a href="'+esc(profile.music_url)+'" target="_blank" rel="noopener" class="btn">Open Music</a>':"");editBtn.style.display=session&&session.user.id===profile.user_id?"inline-block":"none";messageBtn.href="./messages.html?to="+profile.user_id;await loadTop8();await loadGuestbook();await loadPosts();if(session&&session.user.id!==profile.user_id)await loadFriendState();else friendBtn.style.display="none"}
async function loadTop8(){const ids=profile.top_friends||[];if(!ids.length){top8.innerHTML='<div class="muted">Your Top 8 is ready to customize.</div>';return}const r=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids.slice(0,8));top8.innerHTML=(r.data||[]).map(x=>'<a class="friend" href="./profile.html?u='+encodeURIComponent(x.username||"member")+'"><div class="mini">'+(x.avatar_url?'<img src="'+esc(x.avatar_url)+'">':ini(x.display_name))+'</div><b>'+esc(x.display_name||"Member")+'</b></a>').join("")}
async function loadGuestbook(){const r=await db.from("crowspace_guestbook").select("*").eq("profile_id",profile.user_id).eq("status","published").order("created_at",{ascending:false}).limit(20);if(r.error){guestbook.innerHTML='<p class="muted">Guestbook is unavailable for this profile.</p>';return}const ids=[...new Set((r.data||[]).map(x=>x.author_id))];let a={};if(ids.length){const q=await db.from("crowspace_profiles").select("user_id,username,display_name").in("user_id",ids);(q.data||[]).forEach(x=>a[x.user_id]=x)}guestbook.innerHTML=(r.data||[]).map(x=>'<div class="guest"><b>'+esc(a[x.author_id]?.display_name||"Member")+'</b><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div><p>'+esc(x.message)+'</p></div>').join("")||'<p class="muted">No guestbook messages yet.</p>'}
async function loadPosts(){const r=await db.from("crowspace_posts").select("body,created_at,status").eq("author_id",profile.user_id).eq("status","published").order("created_at",{ascending:false}).limit(10);posts.innerHTML=(r.data||[]).map(x=>'<div class="guest"><div>'+esc(x.body)+'</div><small class="muted">'+new Date(x.created_at).toLocaleString()+'</small></div>').join("")||"No bulletins yet."}
async function loadFriendState(){const me=session.user.id;const r=await db.from("crowspace_friends").select("requester_id,recipient_id,status").or("and(requester_id.eq."+me+",recipient_id.eq."+profile.user_id+"),and(requester_id.eq."+profile.user_id+",recipient_id.eq."+me+")").limit(1);const f=r.data?.[0];friendBtn.textContent=f?.status==="accepted"?"Friends":f?.status==="pending"?"Request Pending":"Add Friend";friendBtn.disabled=!!f}
friendBtn.onclick=async()=>{if(!session)return location.href="./";const r=await db.from("crowspace_friends").insert({requester_id:session.user.id,recipient_id:profile.user_id,status:"pending"});if(r.error)alert(r.error.message);else{friendBtn.textContent="Request Pending";friendBtn.disabled=true}}
guestBtn.onclick=async()=>{if(!session)return alert("Sign in to leave a guestbook message.");const text=guestMsg.value.trim();if(!text)return;const r=await db.from("crowspace_guestbook").insert({profile_id:profile.user_id,author_id:session.user.id,message:text,status:"published"});if(r.error)alert(r.error.message);else{guestMsg.value="";loadGuestbook()}}
init();
</script></body></html>

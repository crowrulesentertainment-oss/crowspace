<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap');
:root{--bg:#03050b;--panel:#080d18;--panel2:#0b1220;--line:#20304a;--cyan:#55efff;--violet:#a879ff;--pink:#ff5bd6;--green:#66ffb2;--red:#ff557d;--text:#edf7ff;--muted:#8190a8}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Rajdhani,Arial,sans-serif}body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#18264a 0,#080c18 34%,#03050b 72%)}a{color:inherit}.hidden{display:none!important}
.global{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:18px;padding:13px 18px;background:#05050bf2;border-bottom:1px solid #ffffff0d;backdrop-filter:blur(14px)}.brand{font:900 14px Orbitron;color:#fff;text-decoration:none}.brand span{color:var(--cyan)}.navDivider{width:1px;height:22px;background:#ffffff18}.globalnav{display:flex;gap:16px;flex:1}.navlink{font:700 8px Montserrat,Rajdhani,sans-serif;letter-spacing:.08em;color:#8d98ab;text-decoration:none;padding:8px 0}.navlink:hover,.navlink.active{color:var(--cyan)}.navright{display:flex;align-items:center;gap:9px}.statusdot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px #66ffb2}.navstate{font:700 7px Orbitron;color:#8190a5}.iconbtn,.join,.btn{border:1px solid #ffffff16;border-radius:9px;padding:8px 11px;background:#ffffff07;color:#dfe8f8;text-decoration:none;font:700 8px Montserrat,Rajdhani,sans-serif;cursor:pointer}.join,.btn.primary{border-color:#55efff44;color:#8fefff;background:#55efff0d}.btn.danger{border-color:#ff557d55;color:#ff9bb3}.mobileNav{display:none}.mobile-menu{display:none;padding:10px 18px 15px;background:#070912;border-bottom:1px solid #ffffff0d}.mobile-menu nav{display:grid;gap:4px}.mobile-menu .navlink{padding:11px}.mobile-account{display:flex;gap:7px;margin-top:9px}
.wrap{max-width:1240px;margin:auto;padding:28px 18px 80px}.state,.card,.hero{border:1px solid var(--line);border-radius:18px;background:rgba(8,13,24,.9);box-shadow:0 20px 70px #0008}.state{padding:35px;text-align:center;color:var(--muted)}.hero{overflow:hidden}.banner{height:300px;background:radial-gradient(circle at 15% 20%,#55efff24,transparent 32%),radial-gradient(circle at 80% 20%,#a879ff25,transparent 35%),linear-gradient(135deg,#091226,#251247);background-size:cover;background-position:center;position:relative}.banner:after{content:"CROWSPACE // UNIVERSAL PROFILE";position:absolute;right:20px;bottom:18px;font:700 8px Orbitron;color:#8aa1bb;letter-spacing:.16em}.hero-body{padding:0 28px 26px}.identity{display:flex;gap:18px;align-items:flex-end}.avatar{width:142px;height:142px;margin-top:-70px;flex:none;border-radius:50%;object-fit:cover;background:#0b1324;border:5px solid var(--panel);outline:1px solid #55efff88;box-shadow:0 0 35px #55efff25}.identity-copy{padding-bottom:5px;min-width:0}.identity h1{margin:0;font:800 clamp(25px,4vw,38px) Orbitron;overflow-wrap:anywhere}.handle{color:var(--cyan);font-size:12px;letter-spacing:.12em;margin-top:6px}.tagline{color:#dbe8f7;font-size:15px;margin-top:9px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.chip{padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:9px}.chip.live{color:var(--green);border-color:#66ffb233}.bio{max-width:900px;color:#b9c8db;line-height:1.65;font-size:14px;margin:16px 0}.actions,.socials{display:flex;gap:8px;flex-wrap:wrap}.social{padding:7px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:9px;color:#dcecff}.social:hover{border-color:var(--cyan);color:var(--cyan)}.counts{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.count{padding:6px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:9px}.count b{color:var(--text)}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:16px;margin-top:16px}.card{padding:19px}.title{font:800 12px Orbitron;letter-spacing:.1em;color:#dff9ff;margin-bottom:13px}.title:before{content:"// ";color:var(--cyan)}.list{display:grid;gap:9px}.item{padding:13px;border:1px solid #ffffff0e;border-radius:12px;background:#050a14}.item b{font-size:11px}.item p{margin:6px 0 0;color:#aab8ca;font-size:11px;line-height:1.55}.item small{display:block;color:#68768d;font-size:8px;margin-top:6px}.empty,.notice{padding:14px;border:1px dashed #2a3c59;border-radius:12px;color:var(--muted);font-size:10px;line-height:1.55}.people{display:grid;gap:8px}.person{display:flex;gap:9px;align-items:center;padding:9px;border:1px solid #ffffff0c;border-radius:11px;background:#050a14;text-decoration:none}.person img{width:38px;height:38px;border-radius:50%;object-fit:cover}.person b{font-size:10px}.person small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:12px;border:1px solid var(--line);border-radius:11px;background:#050a14}.metric b{display:block;color:var(--cyan);font:800 18px Orbitron}.metric span{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.bar{height:6px;background:#050912;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink))}.podgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.pod{display:grid;grid-template-columns:52px 1fr;gap:9px;padding:10px;border:1px solid #ffffff0d;border-radius:12px;background:#050a14}.pod img,.pod-art{width:52px;height:52px;border-radius:9px;object-fit:cover;background:linear-gradient(135deg,#55efff22,#a879ff22);display:grid;place-items:center;font:800 9px Orbitron}.pod b{font-size:10px}.pod small{display:block;color:var(--muted);font-size:8px;margin-top:4px}.guest{display:flex;gap:9px;padding:10px;border-bottom:1px solid #172338}.guest:last-child{border-bottom:0}.guest img{width:32px;height:32px;border-radius:50%;object-fit:cover}.guest b{font-size:10px}.guest small{color:var(--muted);font-size:8px}.guest p{margin:4px 0 0;color:#b9c6d7;font-size:10px;line-height:1.5}
.modal{position:fixed;inset:0;z-index:5000;display:none;align-items:center;justify-content:center;padding:14px;background:#01030acc;backdrop-filter:blur(12px)}.modal.open{display:flex}.dialog{width:min(900px,96vw);max-height:92vh;overflow:auto;border:1px solid #55efff44;border-radius:18px;background:#07101d;box-shadow:0 30px 100px #000}.modal-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);background:#07101df5}.form{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.wide{grid-column:1/-1}.field label{font:700 8px Montserrat;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#030711;color:#fff;font:500 10px Rajdhani;outline:none}.field textarea{min-height:90px;resize:vertical}.link-row{display:grid;grid-template-columns:1fr 1.5fr auto;gap:7px;margin-bottom:7px}.modal-foot{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:#07101df5}.diag{grid-column:1/-1;color:var(--muted);font-size:9px;line-height:1.5}.toast{position:fixed;right:18px;bottom:18px;z-index:9000;padding:12px 15px;border:1px solid var(--cyan);border-radius:10px;background:#07101df2;color:#eaf7ff;font-size:10px}.error{border-color:#ff557d55;color:#ffb2c0}
@media(max-width:800px){.globalnav{display:none}.navright{display:none}.mobileNav{display:inline-flex}.grid{grid-template-columns:1fr}.identity{align-items:flex-start;flex-direction:column}.avatar{width:118px;height:118px;margin-top:-59px}.hero-body{padding:0 18px 22px}.podgrid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.wide{grid-column:auto}.link-row{grid-template-columns:1fr}.banner{height:220px}}
</style>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url=v=>{let s=String(v||"").trim();if(!s)return"";try{let u=new URL(/^https?:\/\//i.test(s)?s:"https://"+s);return/^https?:$/.test(u.protocol)?u.href:""}catch{return""}};
const initials=s=>String(s||"CR").trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"CR";
const ago=v=>{if(!v)return"—";let d=new Date(v),n=Date.now()-d.getTime(),m=Math.floor(n/60000);if(m<1)return"just now";if(m<60)return m+"m ago";let h=Math.floor(m/60);if(h<24)return h+"h ago";let days=Math.floor(h/24);return days<30?days+"d ago":d.toLocaleDateString()};
const params=new URLSearchParams(location.search);
const state={db:null,user:null,targetId:params.get("user_id")||params.get("user")||params.get("id")||"",p:null,posts:[],caws:[],followers:[],following:[],people:new Map(),guestbook:[],badges:[],podcasts:[],errors:[],channel:null,refresh:null};
function show(id){$(id)?.classList.remove("hidden")}function hide(id){$(id)?.classList.add("hidden")}
function toast(s){$("toast").textContent=s;show("toast");clearTimeout(toast.t);toast.t=setTimeout(()=>hide("toast"),2600)}
async function db(){if(window.CrowSpaceAuth?.ready){await window.CrowSpaceAuth.ready;if(window.CrowSpaceAuth.client)return window.CrowSpaceAuth.client}if(window.CrowSpaceSupabase)return window.CrowSpaceSupabase;if(window.CROW_SUPABASE)return window.CROW_SUPABASE;throw Error("Supabase authentication is unavailable.")}
async function query(label,fn){try{let r=await fn();if(r?.error){state.errors.push(label+": "+r.error.message);return null}return r?.data??null}catch(e){state.errors.push(label+": "+e.message);return null}}
async function row(table,uid){return query("Load "+table,()=>state.db.from(table).select("*").eq("user_id",uid).maybeSingle())}
async function profile(uid){
 const rs=await Promise.all(["crowspace_profiles","podcast_member_profiles","members","podcasting_member_directory"].map(t=>row(t,uid)));
 const c=rs.find(Boolean)||{};
 const pm=rs[1]||{},m=rs[2]||{},d=rs[3]||{};
 return {user_id:uid,display_name:c.display_name||pm.display_name||m.display_name||d.display_name||c.username||pm.username||m.username||d.username||"CrowRules Member",username:c.username||pm.username||m.username||d.username||"",bio:c.bio??pm.bio??m.bio??d.bio??"",avatar_url:c.avatar_url||pm.avatar_url||m.avatar_url||d.avatar_url||"",banner_url:c.banner_url||pm.cover_url||"",portfolio_tagline:c.portfolio_tagline||pm.tagline||"",portfolio_bio:c.portfolio_bio||"",portfolio_url:c.portfolio_url||pm.website_url||"",creator_category:c.creator_category||"",location:pm.location||"",social_links:c.social_links||pm.social_links||{},is_verified:!!c.is_verified,allow_guestbook:c.allow_guestbook!==false,points:Number(m.points||0),watch_minutes:Number(m.watch_minutes||0),created_at:c.created_at||pm.created_at||m.created_at||d.created_at,updated_at:c.updated_at||pm.updated_at||m.updated_at||d.updated_at};
}
async function loadRelated(uid){
 const [f,fol,posts,caws,guest,badges,pods]=await Promise.all([
  query("Followers",()=>state.db.from("crowspace_follows").select("follower_id,created_at").eq("followed_user_id",uid).order("created_at",{ascending:false}).limit(100)),
  query("Following",()=>state.db.from("crowspace_follows").select("followed_user_id,created_at").eq("follower_id",uid).order("created_at",{ascending:false}).limit(100)),
  query("Posts",()=>state.db.from("crowspace_posts").select("id,user_id,title,body,media_url,created_at,like_count,comment_count").eq("user_id",uid).order("created_at",{ascending:false}).limit(50)),
  query("Caws",()=>state.db.from("crowspace_caws").select("id,user_id,title,caption,video_url,thumbnail_url,views,created_at").eq("user_id",uid).order("created_at",{ascending:false}).limit(30)),
  query("Guestbook",()=>state.db.from("crowspace_guestbook").select("id,profile_id,author_id,body,created_at").eq("profile_id",uid).order("created_at",{ascending:false}).limit(30)),
  query("Badges",()=>state.db.from("crowspace_user_badges").select("badge_id,user_id,awarded_at").eq("user_id",uid).limit(20)),
  query("Published podcasts",()=>state.db.from("podcasting_podcast_directory").select("*").eq("status","published").eq("creator_user_id",uid).order("created_at",{ascending:false}).limit(20))
 ]);
 state.followers=f||[];state.following=fol||[];state.posts=posts||[];state.caws=caws||[];state.guestbook=guest||[];state.podcasts=pods||[];
 const ids=(badges||[]).map(x=>x.badge_id).filter(Boolean);state.badges=ids.length?(await query("Badge details",()=>state.db.from("crowspace_badges").select("id,name,icon").in("id",ids)))||[]:[];
 const ids2=[...new Set([...(f||[]).map(x=>x.follower_id),...(fol||[]).map(x=>x.followed_user_id),...(guest||[]).map(x=>x.author_id)])].filter(x=>x&&x!==uid).slice(0,100);
 if(ids2.length){const pp=await query("Connection profiles",()=>state.db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids2))||[];state.people=new Map(pp.map(x=>[x.user_id,x]))}
}
async function load(){
 $("loading").textContent="CONNECTING TO CROWRULES UNIVERSAL ACCOUNT…";state.db=await db();state.user=(await state.db.auth.getUser()).data?.user||window.CrowSpaceAuth?.user||null;if(!state.targetId)state.targetId=state.user?.id||"";if(!state.targetId)throw Error("No profile selected. Sign in or open a member profile with ?user=<user-id>.");
 state.errors=[];state.p=await profile(state.targetId);await loadRelated(state.targetId);render();hide("loading");hide("error");show("app");subscribe();
 $("navState").textContent=state.user?"MEMBER":"GUEST";$("navProfile").href=state.user?"profile.html":"login.html";$("navJoin").textContent=state.user?"ACCOUNT":"JOIN";$("navJoin").href=state.user?"account.html":"signup.html";$("mobileAuth").textContent=state.user?"ACCOUNT":"SIGN IN";$("mobileAuth").href=state.user?"account.html":"login.html";
}
function links(){const x=state.p?.social_links;if(!x)return[];if(Array.isArray(x))return x.map(a=>({label:a.label||a.name||"Social",url:url(a.url)})).filter(a=>a.url);return Object.entries(x).map(([k,v])=>({label:k,url:url(v)})).filter(a=>a.url)}
function completeness(){const p=state.p||{};const vals=[p.display_name,p.username,p.bio,p.avatar_url,p.banner_url,p.portfolio_tagline,p.creator_category,links().length];return Math.round(vals.filter(Boolean).length/vals.length*100)}
function person(id){const p=state.people.get(id);if(!p)return"";return'<a class="person" href="profile.html?user='+encodeURIComponent(p.user_id)+'"><img src="'+esc(url(p.avatar_url))+'" alt=""><div><b>'+esc(p.display_name||p.username||"CrowSpace Member")+'</b><small>@'+esc(p.username||"crow")+'</small></div></a>'}
function render(){
 const p=state.p,banner=url(p.banner_url),sl=links(),own=!!state.user&&state.user.id===p.user_id;
 const follow=own?'<span class="chip live">YOUR PROFILE</span>':state.user?'<button class="btn '+(state.following.some(x=>x.followed_user_id===p.user_id)?"":"primary")+'" data-act="follow">'+(state.following.some(x=>x.followed_user_id===p.user_id)?"FOLLOWING":"FOLLOW")+'</button>':'<a class="btn primary" href="login.html">SIGN IN TO CONNECT</a>';
 const posts=state.posts.length?state.posts.map(x=>'<article class="item"><b>'+esc(x.title||"CrowSpace Post")+'</b><small>'+ago(x.created_at)+'</small><p>'+esc(x.body||"")+'</p>'+(url(x.media_url)?'<img src="'+esc(url(x.media_url))+'" alt="" style="max-width:100%;max-height:420px;border-radius:10px;margin-top:8px">':"")+'</article>').join(""):'<div class="empty">No public posts yet.</div>';
 const caws=state.caws.length?state.caws.map(x=>'<article class="item"><b>'+esc(x.title||"Untitled Caw")+'</b><small>'+Number(x.views||0).toLocaleString()+' views · '+ago(x.created_at)+'</small><p>'+esc(x.caption||"")+'</p>'+(url(x.video_url)?'<a class="btn" target="_blank" rel="noopener" href="'+esc(url(x.video_url))+'">WATCH CAW ↗</a>':"")+'</article>').join(""):'<div class="empty">No public Caws yet.</div>';
 const peopleF=state.followers.slice(0,12).map(x=>person(x.follower_id)).join("")||'<div class="empty">No public followers.</div>',peopleG=state.following.slice(0,12).map(x=>person(x.followed_user_id)).join("")||'<div class="empty">No public following.</div>';
 const guests=state.guestbook.map(x=>{const a=state.people.get(x.author_id)||{};return'<div class="guest"><img src="'+esc(url(a.avatar_url))+'" alt=""><div><b>'+esc(a.display_name||a.username||"CrowSpace Member")+'</b><small> · '+ago(x.created_at)+'</small><p>'+esc(x.body)+'</p></div></div>'}).join("")||'<div class="empty">No guestbook entries yet.</div>';
 const social=sl.map(x=>'<a class="social" target="_blank" rel="noopener" href="'+esc(x.url)+'">'+esc(x.label)+' ↗</a>').join("");
 const podcast=state.podcasts.length?'<section class="card"><div class="title">CrowRules Podcasting</div><div class="podgrid">'+state.podcasts.map(x=>'<article class="pod">'+(url(x.artwork_url)?'<img src="'+esc(url(x.artwork_url))+'" alt="">':'<div class="pod-art">POD</div>')+'<div><b>'+esc(x.title||x.name||"Untitled Podcast")+'</b><small>'+esc(x.status||"Published")+'</small></div></article>').join("")+'</div></section>':"";
 $("app").innerHTML='<section class="hero"><div class="banner" style="'+(banner?"background-image:linear-gradient(180deg,#0001,#03050b 100%),url(''+esc(banner)+'')":"")+'"></div><div class="hero-body"><div class="identity"><img class="avatar" src="'+esc(url(p.avatar_url))+'" alt=""><div class="identity-copy"><h1>'+esc(p.display_name)+'</h1><div class="handle">@'+esc(p.username||"crow")+'</div><div class="tagline">'+esc(p.portfolio_tagline||p.creator_category||"CrowSpace Member")+'</div><div class="meta"><span class="chip live">● CONNECTED</span>'+(p.is_verified?'<span class="chip live">✓ VERIFIED</span>':"")+(p.creator_category?'<span class="chip">'+esc(p.creator_category)+'</span>':"")+'</div></div></div><p class="bio">'+esc(p.bio||p.portfolio_bio||"This CrowRules universal profile is ready for the next chapter.")+'</p><div class="actions">'+follow+(own?'<button class="btn primary" data-act="edit">EDIT PROFILE</button>':"")+(p.portfolio_url?'<a class="btn" target="_blank" rel="noopener" href="'+esc(url(p.portfolio_url))+'">PORTFOLIO ↗</a>':"")+'</div><div class="counts"><span class="count"><b>'+state.posts.length+'</b> posts</span><span class="count"><b>'+state.caws.length+'</b> caws</span><span class="count"><b>'+state.followers.length+'</b> followers</span><span class="count"><b>'+state.following.length+'</b> following</span></div>'+(social?'<div class="socials" style="margin-top:12px">'+social+'</div>':"")+'</div></section><div class="grid"><div class="stack"><section class="card"><div class="title">Posts</div><div class="list">'+posts+'</div></section><section class="card"><div class="title">Caws</div><div class="list">'+caws+'</div></section>'+podcast+(p.allow_guestbook?'<section class="card"><div class="title">Guestbook</div>'+(state.user&&!own?'<textarea id="guest" maxlength="600" placeholder="Leave a message…" style="width:100%;min-height:75px;background:#030711;border:1px solid var(--line);border-radius:9px;color:#fff;padding:10px;font:500 10px Rajdhani"></textarea><button class="btn primary" data-act="guest" style="margin-top:7px">SIGN GUESTBOOK</button>':"")+'<div class="list" style="margin-top:10px">'+guests+'</div></section>':"")+'</div><aside class="stack"><section class="card"><div class="title">Profile Health</div><div class="metric-grid"><div class="metric"><b>'+completeness()+'%</b><span>Complete</span></div><div class="metric"><b>'+state.badges.length+'</b><span>Badges</span></div><div class="metric"><b>'+Number(p.points||0).toLocaleString()+'</b><span>CrowPoints</span></div><div class="metric"><b>'+Number(p.watch_minutes||0).toLocaleString()+'</b><span>Minutes</span></div></div><div class="bar"><i style="width:'+completeness()+'%"></i></div></section><section class="card"><div class="title">Followers</div><div class="people">'+peopleF+'</div><div class="title" style="margin-top:18px">Following</div><div class="people">'+peopleG+'</div></section><section class="card"><div class="title">Badges</div><div class="meta">'+(state.badges.map(x=>'<span class="chip">'+esc((x.icon||"★")+" "+(x.name||"Badge"))+'</span>').join("")||'<span class="muted">No badges yet.</span>')+'</div></section>'+(state.errors.length?'<section class="card"><div class="title">Connection Diagnostics</div><div class="notice">'+state.errors.map(esc).join("<br>")+'</div></section>':"")+'</aside></div>';
}
function editor(){
 const p=state.p,sl=links();
 $("form").innerHTML='<div class="field"><label>Display name<input name="display_name" maxlength="80" value="'+esc(p.display_name)+'"></label></div><div class="field"><label>Username<input name="username" maxlength="40" value="'+esc(p.username)+'"></label></div><div class="field wide"><label>Tagline<input name="tagline" maxlength="180" value="'+esc(p.portfolio_tagline)+'"></label></div><div class="field wide"><label>Bio<textarea name="bio" maxlength="1600">'+esc(p.bio)+'</textarea></label></div><div class="field"><label>Creator category<input name="creator_category" maxlength="80" value="'+esc(p.creator_category)+'"></label></div><div class="field"><label>Location<input name="location" maxlength="120" value="'+esc(p.location)+'"></label></div><div class="field"><label>Avatar URL<input name="avatar_url" maxlength="500" value="'+esc(p.avatar_url)+'"></label></div><div class="field"><label>Banner URL<input name="banner_url" maxlength="500" value="'+esc(p.banner_url)+'"></label></div><div class="field wide"><label>Portfolio / Website URL<input name="portfolio_url" maxlength="500" value="'+esc(p.portfolio_url)+'"></label></div><div class="field wide"><label>Social Links</label><div id="links"></div><button type="button" class="btn" id="addLink">+ ADD SOCIAL LINK</button></div><div class="field"><label>Profile privacy<select name="privacy_profile"><option value="public">Public</option><option value="members">Members</option><option value="private">Private</option></select></label></div><div class="field"><label>Guestbook<input type="checkbox" name="allow_guestbook" '+(p.allow_guestbook?"checked":"")+'> Allow guestbook</label></div><div class="diag" id="saveDiag">One profile edit updates CrowSpace and the universal CrowRules profile sync.</div><div class="modal-foot"><button type="button" class="btn" id="cancel">CANCEL</button><button class="btn primary" type="submit" id="save">SAVE UNIVERSAL PROFILE</button></div>';
 const box=$("links");(sl.length?sl:[{label:"",url:""}]).forEach(x=>addLink(x.label,x.url));$("addLink").onclick=()=>addLink("","");
 $("form").elements.privacy_profile.value=p.privacy_profile||"public";$("cancel").onclick=closeEditor;
}
function addLink(label,val){const box=$("links"),r=document.createElement("div");r.className="link-row";r.innerHTML='<input data-label maxlength="30" placeholder="Platform" value="'+esc(label)+'"><input data-url maxlength="500" placeholder="https://…" value="'+esc(val)+'"><button type="button" class="btn danger">×</button>';r.querySelector("button").onclick=()=>r.remove();box.appendChild(r)}
function openEditor(){if(!state.user||state.user.id!==state.p.user_id)return;editor();$("modal").classList.add("open");document.body.style.overflow="hidden"}
function closeEditor(){$("modal").classList.remove("open");document.body.style.overflow=""}
async function save(e){
 e.preventDefault();const f=e.currentTarget,btn=$("save");btn.disabled=true;btn.textContent="SAVING…";$("saveDiag").textContent="Writing profile data to Supabase…";
 const social={};document.querySelectorAll("#links .link-row").forEach(r=>{const k=r.querySelector("[data-label]").value.trim(),v=url(r.querySelector("[data-url]").value);if(k&&v)social[k]=v});
 const patch={display_name:f.elements.display_name.value.trim().slice(0,80)||null,username:f.elements.username.value.trim().toLowerCase().replace(/[^a-z0-9_.-]/g,"").slice(0,40)||null,bio:f.elements.bio.value.trim().slice(0,1600),creator_category:f.elements.creator_category.value.trim().slice(0,80)||"Creator",portfolio_tagline:f.elements.tagline.value.trim().slice(0,180),portfolio_bio:f.elements.bio.value.trim().slice(0,1600),avatar_url:url(f.elements.avatar_url.value)||null,banner_url:url(f.elements.banner_url.value)||null,portfolio_url:url(f.elements.portfolio_url.value)||null,social_links:social,allow_guestbook:f.elements.allow_guestbook.checked,updated_at:new Date().toISOString()};
 try{
  const r=await state.db.from("crowspace_profiles").update(patch).eq("user_id",state.user.id).select("*").single();if(r.error)throw r.error;
  if(window.CrowRulesUniversalProfile?.save)await window.CrowRulesUniversalProfile.save(state.db,state.user.id,{display_name:patch.display_name,username:patch.username,bio:patch.bio,tagline:patch.portfolio_tagline,avatar_url:patch.avatar_url,banner_url:patch.banner_url,portfolio_url:patch.portfolio_url,social_links:social});
  closeEditor();toast("Universal profile updated everywhere.");await load();
 }catch(err){$("saveDiag").innerHTML='<span style="color:var(--red)">Save failed: '+esc(err.message||err)+'</span>'}finally{btn.disabled=false;btn.textContent="SAVE UNIVERSAL PROFILE"}
}
async function act(name){
 if(name==="edit"){openEditor();return}if(!state.user){location.href="login.html";return}
 if(name==="follow"){const already=state.following.some(x=>x.followed_user_id===state.p.user_id);let r=already?await state.db.from("crowspace_follows").delete().eq("follower_id",state.user.id).eq("followed_user_id",state.p.user_id):await state.db.from("crowspace_follows").insert({follower_id:state.user.id,followed_user_id:state.p.user_id});if(r.error){toast(r.error.message);return}toast(already?"Unfollowed.":"Following.");await load()}
 if(name==="guest"){const b=($("guest")?.value||"").trim();if(!b)return;if(b.length>600)return toast("Guestbook message is too long.");const r=await state.db.from("crowspace_guestbook").insert({profile_id:state.p.user_id,author_id:state.user.id,body:b});if(r.error){toast(r.error.message);return}toast("Guestbook signed.");await load()}
}
function subscribe(){if(state.channel)try{state.db.removeChannel(state.channel)}catch{}state.channel=state.db.channel("profile-"+state.targetId).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_profiles",filter:"user_id=eq."+state.targetId},()=>schedule()).on("postgres_changes",{event:"*",schema:"public",table:"podcast_member_profiles",filter:"user_id=eq."+state.targetId},()=>schedule()).on("postgres_changes",{event:"*",schema:"public",table:"members",filter:"user_id=eq."+state.targetId},()=>schedule()).subscribe()}
function schedule(){clearTimeout(state.refresh);state.refresh=setTimeout(()=>load().catch(console.error),700)}
document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(a){e.preventDefault();act(a.dataset.act)}if(e.target.closest("#closeModal"))closeEditor();if(e.target.id==="modal")closeEditor()});
$("form").addEventListener("submit",save);$("mobileToggle").onclick=()=>{$("mobileMenu").style.display=$("mobileMenu").style.display==="block"?"none":"block"};
window.addEventListener("crowspace-auth-ready",()=>load().catch(console.error));window.addEventListener("crowspace-auth",()=>load().catch(console.error));window.addEventListener("online",()=>load().catch(console.error));
load().catch(e=>{console.error(e);$("loading").classList.add("hidden");$("error").textContent="PROFILE LOAD FAILED: "+(e.message||e);show("error")});
})();
</script>
</body></html>

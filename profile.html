<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#02030a"><title>Profile | CrowSpace</title>
<link rel="stylesheet" href="css/crowspace.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script>
<style>
:root{--cyan:#62f5ff;--violet:#9c78ff;--pink:#ff54d9;--green:#52f0a5;--amber:#ffd166;--bg:#02030a;--line:rgba(115,140,190,.22)}
.profile-page{max-width:1440px;margin:auto;padding:22px 18px 70px;position:relative}.profile-page:before{content:"";position:fixed;inset:68px 0 0;z-index:-1;pointer-events:none;opacity:.28;background:linear-gradient(90deg,transparent 49.8%,rgba(98,245,255,.08) 50%,transparent 50.2%),linear-gradient(0deg,transparent 49.8%,rgba(156,120,255,.06) 50%,transparent 50.2%);background-size:96px 96px}
.p-shell,.p-card{background:linear-gradient(145deg,rgba(7,10,19,.97),rgba(5,7,14,.94));border:1px solid var(--line);box-shadow:0 25px 80px #0009}.p-shell{overflow:hidden}.p-command{display:flex;justify-content:space-between;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line);background:#05070e;font:800 9px Orbitron;letter-spacing:1.7px;color:#77849a;text-transform:uppercase}.p-command b{color:var(--cyan)}.p-live{color:var(--green)}.p-live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 15px var(--green);margin-right:6px;animation:blink 1.4s infinite}@keyframes blink{50%{opacity:.2}}
.p-hero{display:grid;grid-template-columns:370px 1fr;min-height:590px}.p-identity{padding:35px 28px;text-align:center;border-right:1px solid var(--line);background:radial-gradient(circle at 50% 10%,rgba(98,245,255,.12),transparent 18rem),linear-gradient(180deg,#080c17,#05070e)}.p-avatar-wrap{width:220px;height:220px;position:relative;margin:8px auto 28px}.p-avatar{width:100%;height:100%;display:grid;place-items:center;overflow:hidden;clip-path:polygon(50% 0,93% 18%,100% 50%,93% 82%,50% 100%,7% 82%,0 50%,7% 18%);background:radial-gradient(circle,#15263a,#060912 68%);border:1px solid rgba(98,245,255,.45);box-shadow:0 0 55px rgba(98,245,255,.14),inset 0 0 45px rgba(156,120,255,.1)}.p-avatar img{width:100%;height:100%;object-fit:cover}.p-avatar-text{font:900 65px Orbitron;color:#fff;text-shadow:0 0 25px var(--cyan)}.orbit{position:absolute;inset:-17px;border:1px solid rgba(98,245,255,.22);border-radius:50%;animation:spin 11s linear infinite}.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid rgba(156,120,255,.2);border-radius:50%}.orbit:before{inset:17px;animation:spin 7s linear infinite reverse}.orbit:after{inset:34px;border-color:rgba(255,84,217,.16);animation:spin 17s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.sat{position:absolute;top:2px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 16px var(--cyan)}
.p-name{font:900 30px/1.05 Orbitron;margin:0;text-transform:uppercase}.p-handle{font:700 12px monospace;color:#7e8ca5}.p-bio{max-width:285px;margin:17px auto;color:#b6c0d1;font-size:12px;line-height:1.75}.p-location{font:800 9px Orbitron;color:#748198;letter-spacing:1px;text-transform:uppercase}.p-actions{display:grid;gap:8px;margin-top:20px}.p-btn{min-height:42px;border:1px solid var(--line);background:#080b14;color:#fff;padding:10px 12px;cursor:pointer;text-decoration:none;font:800 9px Orbitron;letter-spacing:1px;text-transform:uppercase}.p-btn:hover{color:#fff;border-color:rgba(98,245,255,.58);box-shadow:0 0 22px rgba(98,245,255,.08)}.p-btn.primary{background:linear-gradient(100deg,rgba(98,245,255,.16),rgba(156,120,255,.2));border-color:rgba(98,245,255,.4)}
.p-console{padding:35px 38px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;background:radial-gradient(circle at 75% 30%,rgba(156,120,255,.14),transparent 23rem),radial-gradient(circle at 40% 80%,rgba(98,245,255,.08),transparent 21rem)}.p-kicker{font:800 9px Orbitron;letter-spacing:3px;color:var(--cyan)}.p-console h1{font:900 clamp(45px,7vw,92px)/.88 Orbitron;letter-spacing:-4px;text-transform:uppercase;margin:12px 0 18px}.p-console h1 span{color:var(--violet);text-shadow:0 0 35px rgba(156,120,255,.25)}.p-lead{max-width:760px;color:#9da9bc;font-size:14px;line-height:1.8}.p-id{display:inline-flex;margin-top:17px;padding:9px 11px;border:1px solid var(--line);font:800 9px monospace;color:#68758a}.p-id b{color:var(--cyan);margin-left:8px}.p-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:30px}.p-metric{padding:15px;background:#060912;text-align:center}.p-metric strong{display:block;font:900 24px Orbitron}.p-metric span{display:block;color:#66748b;font:800 8px Orbitron;letter-spacing:1.1px;margin-top:5px}
.p-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,.8fr);gap:18px;margin-top:18px}.p-card{overflow:hidden}.p-card+.p-card{margin-top:18px}.p-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 17px;border-bottom:1px solid var(--line)}.p-head h2{margin:0;font:900 11px Orbitron;letter-spacing:1.6px;text-transform:uppercase}.p-head small{color:#68758a;font:800 8px Orbitron}.p-head a{font:800 8px Orbitron}.p-body{padding:17px}
.p-social-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.p-social{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);color:#fff;background:#060811}.p-social:hover{color:#fff;border-color:rgba(98,245,255,.45)}.p-social-icon{width:35px;height:35px;display:grid;place-items:center;border:1px solid rgba(98,245,255,.22);font:900 10px Orbitron;color:var(--cyan)}.p-social strong{font-size:11px}.p-social small{display:block;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#68758a;font:9px monospace;margin-top:2px}
.p-membership{display:grid;grid-template-columns:105px 1fr;gap:15px;align-items:center}.passport{height:105px;display:grid;place-items:center;border:1px solid rgba(255,209,102,.35);background:radial-gradient(circle,rgba(255,209,102,.13),transparent 65%),#080a11;position:relative}.passport:before{content:"CR";font:900 30px Orbitron;color:var(--amber)}.passport:after{content:"UNIVERSAL";position:absolute;bottom:8px;font:800 7px Orbitron;letter-spacing:1.5px;color:#8d7b52}.plan{font:900 23px Orbitron;text-transform:uppercase}.plan.active{color:var(--green)}.meta{color:#78859a;font:9px/1.7 monospace;margin-top:5px}.chip{display:inline-flex;margin-top:8px;padding:5px 8px;border:1px solid rgba(82,240,165,.25);color:var(--green);font:800 8px Orbitron;letter-spacing:1px}
.p-caws{display:grid;gap:10px}.p-caw{display:grid;grid-template-columns:175px 1fr;gap:13px;padding:11px;border:1px solid var(--line);background:#060811}.p-media{aspect-ratio:16/10;background:#020308;overflow:hidden;display:grid;place-items:center;border:1px solid rgba(98,245,255,.12)}.p-media img,.p-media video{width:100%;height:100%;object-fit:cover}.p-caw-title{font-size:13px;font-weight:900}.p-copy{font-size:11px;color:#7e8ca1;line-height:1.55;margin:6px 0}.p-date{font:9px monospace;color:#58657a}.p-mini-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.p-mini-actions a{padding:6px 8px;border:1px solid var(--line);color:#aeb8c9;font:800 8px Orbitron}.p-mini-actions a:hover{color:#fff;border-color:rgba(98,245,255,.4)}
.signal{display:grid;gap:10px}.signal-row{display:grid;grid-template-columns:78px 1fr 48px;gap:9px;align-items:center;font:800 8px Orbitron;color:#748198}.bar{height:5px;background:#111624}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 12px rgba(98,245,255,.3);transition:width 1.1s ease}.signal-row b{text-align:right;color:#aeb8c9}.friends{display:grid}.person{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(115,140,190,.12)}.person:last-child{border:0}.mini{width:38px;height:38px;display:grid;place-items:center;overflow:hidden;flex:none;background:#0b101a;border:1px solid rgba(98,245,255,.22);font:900 10px Orbitron;color:var(--cyan)}.mini img{width:100%;height:100%;object-fit:cover}.person a{color:#fff;font-size:11px;font-weight:900}.person small{display:block;color:#69768b;font:9px monospace}.empty{padding:23px 5px;text-align:center;color:#69768b;font-size:11px}.error{padding:30px;text-align:center;color:#ff9292}.toast{position:fixed;right:20px;bottom:20px;z-index:5000;padding:12px 15px;background:#070a12;border:1px solid rgba(98,245,255,.4);box-shadow:0 15px 45px #000b;color:#fff;font:800 9px Orbitron;letter-spacing:1px;opacity:0;transform:translateY(20px);transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:1050px){.p-hero{grid-template-columns:300px 1fr}.p-identity{padding:28px 18px}.p-avatar-wrap{width:180px;height:180px}.p-grid{grid-template-columns:1fr}.p-console{min-height:500px}.p-metrics{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.profile-page{padding:10px}.p-command{font-size:7px}.p-hero{display:block}.p-identity{border-right:0;border-bottom:1px solid var(--line)}.p-console{padding:25px 19px}.p-console h1{font-size:49px;letter-spacing:-2px}.p-metrics{grid-template-columns:repeat(2,1fr)}.p-social-grid{grid-template-columns:1fr}.p-membership{grid-template-columns:1fr}.passport{height:85px}.p-caw{grid-template-columns:1fr}.p-media{aspect-ratio:16/8}}
@media(prefers-reduced-motion:reduce){.orbit,.orbit:before,.orbit:after{animation:none!important}.bar i{transition:none}}

/* Profile social feed */
.profile-social-feed{margin-top:18px}.profile-social-feed .social-card{background:#060811;border:1px solid var(--line);margin-bottom:10px;padding:14px}.profile-social-feed .social-head{display:flex;align-items:center;gap:10px}.profile-social-feed .social-avatar{width:38px;height:38px;display:grid;place-items:center;overflow:hidden;background:#0b101a;border:1px solid rgba(98,245,255,.25);color:var(--cyan);font:900 10px Orbitron}.profile-social-feed .social-avatar img{width:100%;height:100%;object-fit:cover}.profile-social-feed .social-head strong{display:block;font-size:11px}.profile-social-feed .social-head small{display:block;color:#68758a;font:9px monospace;margin-top:2px}.profile-social-feed .social-kind{margin-left:auto;color:var(--cyan);font:800 8px Orbitron;letter-spacing:1px}.profile-social-feed .social-card h3{font-size:14px;margin:12px 0 5px}.profile-social-feed .social-card p{font-size:11px;line-height:1.6;color:#9aa7ba;white-space:pre-wrap}.profile-social-feed .social-media{width:100%;max-height:420px;object-fit:cover;background:#020308;margin-top:10px;border:1px solid rgba(98,245,255,.12)}.profile-social-feed .social-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.profile-social-feed .social-actions button{border:1px solid var(--line);background:#080b13;color:#aeb8c9;padding:7px 9px;font:800 8px Orbitron;cursor:pointer}.profile-social-feed .social-actions button:hover,.profile-social-feed .social-actions button.active{color:var(--cyan);border-color:rgba(98,245,255,.4)}.profile-feed-empty{padding:25px;text-align:center;color:#69768b;font-size:11px}.profile-feed-loading{padding:25px;text-align:center;color:var(--cyan);font:800 9px Orbitron;letter-spacing:1px}
.profile-feed-composer{margin-bottom:12px;padding:13px;border:1px solid rgba(98,245,255,.18);background:linear-gradient(135deg,rgba(98,245,255,.035),rgba(156,120,255,.035))}
.profile-feed-composer textarea{width:100%;min-height:82px;resize:vertical;box-sizing:border-box;background:#03050b;color:#fff;border:1px solid var(--line);padding:11px;font:11px/1.55 Montserrat,Arial,sans-serif;outline:none}
.profile-feed-composer textarea:focus{border-color:rgba(98,245,255,.5);box-shadow:0 0 20px rgba(98,245,255,.06)}
.profile-compose-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.profile-compose-count{color:#68758a;font:9px monospace}.profile-compose-btn{border:1px solid rgba(98,245,255,.35);background:linear-gradient(100deg,rgba(98,245,255,.13),rgba(156,120,255,.16));color:#fff;padding:9px 13px;cursor:pointer;font:800 8px Orbitron;letter-spacing:1px}.profile-compose-btn:disabled{opacity:.5;cursor:wait}
.profile-feed-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}.profile-feed-tabs button{border:1px solid var(--line);background:#070a12;color:#78859a;padding:7px 9px;cursor:pointer;font:800 8px Orbitron;letter-spacing:1px}.profile-feed-tabs button.active{color:var(--cyan);border-color:rgba(98,245,255,.45);box-shadow:0 0 18px rgba(98,245,255,.06)}
.profile-social-feed .social-card{transition:transform .18s ease,border-color .18s ease}.profile-social-feed .social-card:hover{transform:translateY(-1px);border-color:rgba(98,245,255,.28)}
.profile-social-feed .social-actions a,.profile-social-feed .social-actions button{display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.profile-social-feed .social-actions button.active{color:var(--cyan);background:rgba(98,245,255,.06)}
.profile-social-feed .social-stat{color:#69768b;font:8px monospace;margin-left:auto}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header>
<main class="profile-page" id="app"><section class="p-shell"><div class="p-body empty">INITIALIZING PERSONAL NODE…</div></section></main>
<div class="toast" id="toast"></div>
<footer>CrowSpace · One Account. One Universe.</footer>
<script>
(()=>{"use strict";
const db=window.crowSupabase,app=document.getElementById("app"),toast=document.getElementById("toast"),params=new URLSearchParams(location.search);let uid=params.get("id"),viewer=null,profile=null,universal=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),safe=u=>{try{let x=new URL(u,location.href);return /^https?:$/.test(x.protocol)?x.href:""}catch{return""}},initials=s=>String(s||"CS").trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()||"CS",fmt=d=>d?new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):"—";
const count=async(t,c)=>{try{let r=await db.from(t).select("*",{count:"exact",head:true}).eq(c,uid);return r.error?0:r.count||0}catch{return 0}},socials=o=>{if(!o)return[];if(Array.isArray(o))return o.map(x=>typeof x==="string"?{name:"Social",url:x}:x).filter(x=>safe(x.url));if(typeof o==="object")return Object.entries(o).map(([name,url])=>({name,url})).filter(x=>safe(x.url));return[]},icon=n=>({youtube:"YT",instagram:"IG",facebook:"FB",twitter:"X",x:"X",tiktok:"TK",twitch:"TW",discord:"DC",threads:"TH",bluesky:"BS",linkedin:"LI",github:"GH",website:"WEB"}[String(n).toLowerCase()]||"↗");
const av=(u,n)=>safe(u)?'<span class="mini"><img src="'+esc(safe(u))+'" alt=""></span>':'<span class="mini">'+esc(initials(n))+'</span>';
const note=m=>{toast.textContent=m;toast.classList.add("show");clearTimeout(note.t);note.t=setTimeout(()=>toast.classList.remove("show"),2300)};
async function getProfile(){let r=await db.from("membership_profiles").select("id,display_name,username,bio,avatar_url,favorite_show,points,watch_hours,website,location,social_links,created_at").eq("id",uid).maybeSingle();if(r.data)return r.data;r=await db.from("crowspace_profiles").select("user_id,display_name,username,bio,avatar_url,created_at").eq("user_id",uid).maybeSingle();if(r.data)return {...r.data,id:r.data.user_id,social_links:[]};r=await db.from("members").select("user_id,display_name,username,bio,avatar_url,points,watch_minutes,created_at").eq("user_id",uid).maybeSingle();if(r.data)return {...r.data,id:r.data.user_id,watch_hours:Number(r.data.watch_minutes||0)/60,social_links:[]};throw Error("This CrowSpace profile does not exist.")}
async function getUniversal(){let r=await db.from("crplus_universal_membership").select("user_id,membership_type,role,status,level,plan_key,plan_name").eq("user_id",uid).maybeSingle();if(r.data)return r.data;r=await db.from("crowspace_memberships").select("status,membership_plan_id,started_at,membership_plans:membership_plan_id(plan_key,name,level)").eq("user_id",uid).maybeSingle();if(r.data){let p=r.data.membership_plans||{};return{user_id:uid,status:r.data.status,plan_key:p.plan_key,plan_name:p.name,level:p.level,membership_type:p.plan_key,role:"member"}}return null}
async function loadCaws(){let r=await db.from("crowspace_caws").select("id,title,caption,thumbnail_url,video_url,created_at,views").eq("user_id",uid).order("created_at",{ascending:false}).limit(8),rows=r.data||[],box=document.getElementById("caws");if(!box)return;if(!rows.length){box.innerHTML='<div class="empty">No Caws yet. The broadcast channel is waiting.</div>';return}box.innerHTML='<div class="p-caws">'+rows.map(x=>{let t=safe(x.thumbnail_url),v=safe(x.video_url);return'<article class="p-caw"><div class="p-media">'+(v?'<video controls playsinline preload="metadata"'+(t?' poster="'+esc(t)+'"':"")+' src="'+esc(v)+'"></video>':t?'<img loading="lazy" src="'+esc(t)+'" alt="">':'<b style="color:var(--cyan);font:900 17px Orbitron">CAW</b>')+'</div><div><div class="p-caw-title">'+esc(x.title||"Untitled Caw")+'</div><p class="p-copy">'+esc(x.caption||"")+'</p><div class="p-date">'+esc(fmt(x.created_at))+(Number.isFinite(Number(x.views))?" · "+Number(x.views).toLocaleString()+" VIEWS":"")+'</div><div class="p-mini-actions"><a href="caw-feed.html?caw='+encodeURIComponent(x.id)+'">WATCH</a><a href="caws.html?user='+encodeURIComponent(uid)+'">CAW ARCHIVE</a></div></div></article>'}).join("")+'</div>'}
async function loadFriends(){let box=document.getElementById("friends"),r=await db.from("crowspace_friendships").select("requester_id,addressee_id").eq("status","accepted").or("requester_id.eq."+uid+",addressee_id.eq."+uid).limit(8),ids=[...new Set((r.data||[]).map(x=>x.requester_id===uid?x.addressee_id:x.requester_id))];if(!ids.length){box.innerHTML='<div class="empty">Your circle is still forming.</div>';return}let m=await db.from("membership_profiles").select("id,display_name,username,avatar_url").in("id",ids);box.innerHTML='<div class="friends">'+(m.data||[]).map(x=>'<div class="person">'+av(x.avatar_url,x.display_name||x.username)+'<div><a href="profile.html?id='+encodeURIComponent(x.id)+'">'+esc(x.display_name||"Member")+'</a><small>@'+esc(x.username||"member")+'</small></div></div>').join("")+'</div>'}
async function follow(){let b=document.getElementById("followBtn");if(!b)return;if(!viewer){b.textContent="SIGN IN TO FOLLOW";b.onclick=()=>location.href="login.html";return}let r=await db.from("crowspace_follows").select("follower_id").eq("follower_id",viewer.id).eq("followed_user_id",uid).maybeSingle();b.textContent=r.data?"Following":"Follow";b.onclick=async()=>{b.disabled=true;let q=r.data?await db.from("crowspace_follows").delete().eq("follower_id",viewer.id).eq("followed_user_id",uid):await db.from("crowspace_follows").insert({follower_id:viewer.id,followed_user_id:uid});if(q.error)note(q.error.message);else{r.data=r.data?null:{follower_id:viewer.id};b.textContent=r.data?"Following":"Follow";note(r.data?"FOLLOWING NODE":"FOLLOW REMOVED")}b.disabled=false}}
async function render(){let [followers,following,caws,groups,friends,circles]=await Promise.all([count("crowspace_follows","followed_user_id"),count("crowspace_follows","follower_id"),count("crowspace_caws","user_id"),count("crowspace_group_members","user_id"),count("crowspace_friendships","requester_id"),count("crowspace_circle_members","user_id")]),mine=viewer?.id===uid,av=safe(profile.avatar_url),ss=socials(profile.social_links),active=String(universal?.status||"").toLowerCase()==="active",plan=universal?.plan_name||universal?.membership_type||"CrowRules Member";document.title=(profile.display_name||profile.username||"Profile")+" | CrowSpace";

rcles</span></div></div></section></section></section><section class="p-grid"><div><section class="p-card"><div class="p-head"><h2>Signal Dock // Social Media</h2><small>CONNECT BEYOND CROWSPACE</small></div><div class="p-body">'+(ss.length?'<div class="p-social-grid">'+ss.map(s=>'<a class="p-social" href="'+esc(safe(s.url))+'" target="_blank" rel="noopener noreferrer"><span class="p-social-icon">'+esc(icon(s.name))+'</span><span><strong>'+esc(s.name||"Social")+'</strong><small>'+esc(s.url)+'</small></span></a>').join("")+'</div>':'<div class="empty">'+(mine?"Add your social links from Customize Nest.":"No external social links have been connected yet.")+'</div>')+'</div></section><section class="p-card"><div class="p-head"><h2>Universal Membership Passport</h2><small>ONE ACCOUNT / ONE UNIVERSE</small></div><div class="p-body"><div class="p-membership"><div class="passport"></div><div><div class="plan '+(active?"active":"")+'">'+esc(plan)+'</div><div class="meta">STATUS: '+esc(String(universal?.status||"not connected").toUpperCase())+'<br>ROLE: '+esc(String(universal?.role||"member").toUpperCase())+'<br>LEVEL: '+esc(String(universal?.level??"—"))+'<br>PLAN KEY: '+esc(universal?.plan_key||"—")+'</div>'+(active?'<span class="chip">✓ UNIVERSAL ACCESS ACTIVE</span>':'<a class="p-btn primary" style="display:inline-flex;margin-top:10px" href="membership.html">EXPLORE MEMBERSHIP →</a>')+'</div></div></div></section><section class="p-card profile-social-feed"><div class="p-head"><h2>Social Feed // Posts & Caws</h2><a href="caws.html">OPEN FEED →</a></div><div class="p-body">
<div class="profile-feed-composer" id="profileComposer" style="display:none"><textarea id="profileComposerText" maxlength="5000" placeholder="Broadcast something from this profile…"></textarea><div class="profile-compose-row"><span class="profile-compose-count" id="profileComposerCount">0 / 5000</span><button class="profile-compose-btn" id="profileComposerBtn">PUBLISH →</button></div><div class="profile-feed-empty" id="profileComposerStatus" style="display:none;padding:8px 0 0"></div></div>
<div class="profile-feed-tabs" id="profileFeedTabs"><button class="active" data-profile-filter="all">ALL</button><button data-profile-filter="post">POSTS</button><button data-profile-filter="caw">CAWS</button><button data-profile-filter="media">MEDIA</button><button data-profile-filter="newest">NEWEST</button></div>
<div id="profileSocialFeed"><div class="profile-feed-loading">SYNCING SOCIAL SIGNAL…</div></div></div></section><section class="p-card"><div class="p-head"><h2>Caw Stream // Personal Broadcasts</h2><a href="caws.html?user='+encodeURIComponent(uid)+'">OPEN ALL →</a></div><div class="p-body" id="caws"><div class="empty">SCANNING CAW ARCHIVE…</div></div></section></div><aside><section class="p-card"><div class="p-head"><h2>Connection Signal</h2><small>LIVE TELEMETRY</small></div><div class="p-body"><div class="signal">'+[["FOLLOWERS",followers],["FOLLOWING",following],["CAWS",caws],["CIRCLES",circles]].map(x=>'<div class="signal-row"><span>'+x[0]+'</span><div class="bar"><i data-v="'+Math.min(100,x[1]?Math.log10(x[1]+1)*35:0)+'"></i></div><b>'+x[1]+'</b></div>').join("")+'</div></div></section><section class="p-card"><div class="p-head"><h2>My Circle</h2><small>FRIENDS</small></div><div class="p-body" id="friends"><div class="empty">MAPPING CONNECTIONS…</div></div></section><section class="p-card"><div class="p-head"><h2>Profile File</h2><small>UNIVERSE DATA</small></div><div class="p-body"><div class="signal-row"><span>POINTS</span><div></div><b>'+Number(profile.points||0).toLocaleString()+'</b></div><div class="signal-row" style="margin-top:12px"><span>WATCH HRS</span><div></div><b>'+Number(profile.watch_hours||0).toFixed(1)+'</b></div><div class="signal-row" style="margin-top:12px"><span>SHOW</span><div></div><b style="overflow:hidden;text-overflow:ellipsis">'+esc(profile.favorite_show||"—")+'</b></div></div></section></aside></section></section>';
 await Promise.all([loadCaws(),loadFriends(),loadSocialFeed()]);bindProfileSocial();document.querySelectorAll(".bar i").forEach((e,i)=>setTimeout(()=>e.style.width=Math.max(3,Number(e.dataset.v||0))+"%",180+i*80));if(!mine)follow();document.getElementById("shareBtn")?.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(location.href);note("PROFILE SIGNAL COPIED")}catch{prompt("Copy profile signal:",location.href)}})}

let profileFeedItems=[],profileFeedFilter="all";
function renderProfileFeed(){
 const box=document.getElementById("profileSocialFeed"); if(!box)return;
 let items=[...profileFeedItems];
 if(profileFeedFilter==="post"||profileFeedFilter==="caw")items=items.filter(x=>x.kind===profileFeedFilter);
 if(profileFeedFilter==="media")items=items.filter(x=>x.media_url);
 items.sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
 if(!items.length){box.innerHTML='<div class="profile-feed-empty">No matching activity on this profile yet.</div>';return}
 box.innerHTML=items.map(x=>{
  const p=x.profile||{},name=p.display_name||p.username||"CrowSpace Member",s=x.stats||{like:0,repost:0,save:0,mine:{}};
  const avatar=safe(p.avatar_url)?'<img src="'+esc(safe(p.avatar_url))+'" alt="">':esc(initials(name));
  const media=x.media_url?(x.kind==="caw"?'<video class="social-media" controls playsinline preload="metadata"'+(safe(x.thumbnail_url)?' poster="'+esc(safe(x.thumbnail_url))+'"':"")+' src="'+esc(safe(x.media_url))+'"></video>':'<img class="social-media" loading="lazy" src="'+esc(safe(x.media_url))+'" alt="">'):"";
  return '<article class="social-card" data-profile-target="'+x.kind+':'+esc(x.id)+'"><header class="social-head"><a class="social-avatar" href="profile.html?id='+encodeURIComponent(x.user_id)+'">'+avatar+'</a><div><strong>'+esc(name)+'</strong><small>@'+esc(p.username||"member")+' · '+esc(fmt(x.created_at))+'</small></div><span class="social-kind">'+x.kind.toUpperCase()+'</span></header>'+(x.title?'<h3>'+esc(x.title)+'</h3>':"")+(x.body?'<p>'+esc(x.body)+'</p>':"")+media+'<div class="social-actions"><button data-profile-act="like" class="'+(s.mine?.like?"active":"")+'">♥ <b>'+s.like+'</b></button><button data-profile-act="comment">💬 Reply</button><button data-profile-act="repost">↻ <b>'+s.repost+'</b></button><button data-profile-act="save" class="'+(s.mine?.save?"active":"")+'">🔖 <b>'+s.save+'</b></button><button data-profile-act="react">☺ React</button><button data-profile-act="quote">↻+ Quote</button><a href="'+(x.kind==="caw"?"caw-feed.html?caw=":"caws.html?user=")+(x.kind==="caw"?encodeURIComponent(x.id):encodeURIComponent(x.user_id))+'">OPEN →</a><span class="social-stat">'+(x.kind==="caw"?(Number(x.views||0).toLocaleString()+" views"):"")+'</span></div></article>'
 }).join("");
 box.querySelectorAll(".social-card").forEach(card=>card.querySelectorAll("[data-profile-act]").forEach(btn=>btn.onclick=()=>profileSocialAction(card,btn.dataset.profileAct)));
}
async function loadSocialFeed(){
 const box=document.getElementById("profileSocialFeed");if(!box)return;
 try{
  const [pr,cr]=await Promise.all([
   db.from("crowspace_posts").select("id,user_id,title,body,media_url,created_at").eq("user_id",uid).order("created_at",{ascending:false}).limit(25),
   db.from("crowspace_caws").select("id,user_id,title,caption,video_url,thumbnail_url,created_at,views").eq("user_id",uid).order("created_at",{ascending:false}).limit(25)
  ]);
  if(pr.error)throw pr.error;if(cr.error)throw cr.error;
  const items=[...(pr.data||[]).map(x=>({...x,kind:"post",body:x.body||"",media_url:x.media_url||""})),...(cr.data||[]).map(x=>({...x,kind:"caw",body:x.caption||"",media_url:x.video_url||""}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,25);
  profileFeedItems=items;
  const people=await db.from("membership_profiles").select("id,display_name,username,avatar_url").in("id",[...new Set(items.map(x=>x.user_id))]);
  const pm=Object.fromEntries((people.data||[]).map(x=>[x.id,x]));
  const ints=items.length?await db.from("crowspace_social_interactions").select("target_type,target_id,user_id,interaction_type").in("target_id",items.map(x=>x.id)):({data:[],error:null});
  if(ints.error)console.warn("Profile interaction sync:",ints.error.message);
  const stats={};
  (ints.data||[]).forEach(i=>{const k=i.target_type+":"+i.target_id;stats[k]??={like:0,save:0,repost:0,mine:{}};if(["like","save","repost"].includes(i.interaction_type))stats[k][i.interaction_type]=(stats[k][i.interaction_type]||0)+1;if(i.user_id===viewer?.id)stats[k].mine[i.interaction_type]=1});
  profileFeedItems=items.map(x=>({...x,profile:pm[x.user_id]||{},stats:stats[x.kind+":"+x.id]||{like:0,save:0,repost:0,mine:{}}}));
  renderProfileFeed();
 }catch(e){console.error(e);box.innerHTML='<div class="profile-feed-empty">Social feed unavailable right now.</div>'}
}
async function profileSocialAction(card,type){
 if(!viewer){location.href="login.html";return}
 const [kind,id]=card.dataset.profileTarget.split(":");
 const c=db;
 if(type==="comment"||type==="quote"){
  const body=prompt(type==="quote"?"Add a comment to your repost:":"Write a reply:");if(!body?.trim())return;
  const payload={user_id:viewer.id,body:body.trim()};payload[kind==="caw"?"caw_id":"post_id"]=id;
  const r=await c.from("crowspace_comments").insert(payload);if(r.error){note(r.error.message);return}
  if(type==="quote"){const q=await c.from("crowspace_social_interactions").insert({target_type:kind,target_id:id,user_id:viewer.id,interaction_type:"repost",comment:body.trim()});if(q.error)note(q.error.message)}
  note(type==="quote"?"QUOTE PUBLISHED":"REPLY PUBLISHED");return;
 }
 if(type==="react"){const reaction=prompt("Reaction: ❤️  🔥  😂  😮  😢  👍");if(!reaction)return;const r=await c.from("crowspace_social_interactions").insert({target_type:kind,target_id:id,user_id:viewer.id,interaction_type:"like",comment:reaction});if(r.error)note(r.error.message);else note("REACTION SENT");return}
 const q=await c.from("crowspace_social_interactions").select("id").eq("target_type",kind).eq("target_id",id).eq("user_id",viewer.id).eq("interaction_type",type).maybeSingle();
 if(q.error){note(q.error.message);return}
 const r=q.data?await c.from("crowspace_social_interactions").delete().eq("id",q.data.id):await c.from("crowspace_social_interactions").insert({target_type:kind,target_id:id,user_id:viewer.id,interaction_type:type});
 if(r.error)note(r.error.message);else{note(type==="like"?"LIKE UPDATED":type==="save"?"SAVE UPDATED":"REPOST UPDATED");await loadSocialFeed()}
}
function bindProfileSocial(){
 const composer=document.getElementById("profileComposer"),ta=document.getElementById("profileComposerText"),count=document.getElementById("profileComposerCount"),btn=document.getElementById("profileComposerBtn"),status=document.getElementById("profileComposerStatus");
 if(composer&&viewer?.id===uid){composer.style.display="block";ta.oninput=()=>count.textContent=ta.value.length+" / 5000";btn.onclick=async()=>{const body=ta.value.trim();if(!body)return;btn.disabled=true;status.style.display="block";status.textContent="Publishing…";const r=await db.from("crowspace_posts").insert({user_id:viewer.id,title:"",body});if(r.error){status.textContent=r.error.message}else{ta.value="";count.textContent="0 / 5000";status.textContent="Published to your timeline.";await loadSocialFeed()}btn.disabled=false}}
 document.querySelectorAll("[data-profile-filter]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-profile-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");profileFeedFilter=b.dataset.profileFilter==="newest"?"all":b.dataset.profileFilter;renderProfileFeed()});
}
async function start(){try{if(!db)throw Error("Supabase connection is unavailable.");viewer=(await db.auth.getUser()).data?.user||null;if(!uid)uid=viewer?.id;if(!uid){app.innerHTML='<section class="p-shell"><div class="p-body empty"><h2>PROFILE NODE UNASSIGNED</h2><p>Sign in to open your CrowSpace profile.</p><a class="p-btn primary" href="login.html">SIGN IN →</a></div></section>';return}[profile,universal]=await Promise.all([getProfile(),getUniversal()]);await render()}catch(e){console.error(e);app.innerHTML='<section class="p-shell"><div class="error"><h2>PROFILE NODE OFFLINE</h2><p>'+esc(e.message||"Unable to load profile.")+'</p><button class="p-btn" onclick="location.reload()">RECONNECT</button></div></section>'}}
document.addEventListener("DOMContentLoaded",start,{once:true});
})();

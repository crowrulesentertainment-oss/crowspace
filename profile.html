</style></head><body><div class="scanlines"></div><div class="ambient"></div><header class="topbar"><a class="brand" href="index.html"><span class="mark">C</span><span>CROW<span>SPACE</span></span></a><nav><a href="index.html">Feed</a><a href="discover.html">Discover</a><a class="active" href="profile.html">Profile</a><a href="notifications.html">Notifications</a></nav><div class="account"><span id="memberState">CONNECTING…</span><button id="authBtn">Sign In</button></div></header><main class="shell"><section class="card profileCard"><div class="eyebrow">CROWSPACE IDENTITY NODE</div><div id="profile"><h1 style="font-family:Orbitron">Loading profile…</h1></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const fmt=d=>new Date(d).toLocaleString([],{dateStyle:"medium",timeStyle:"short"});let currentUser=null,viewingUserId=null,following=false;

async function loadPeople(kind){const list=$(kind+"List"),target=viewingUserId;if(!list)return;list.innerHTML="<div class='empty'>Loading…</div>";let q;if(kind==="followers")q=await db.from("crowspace_follows").select("follower_id").eq("followed_user_id",target).order("created_at",{ascending:false}).limit(100);else q=await db.from("crowspace_follows").select("followed_user_id").eq("follower_id",target).order("created_at",{ascending:false}).limit(100);if(q.error){list.innerHTML="<div class='empty'>Could not load this list.</div>";return}const ids=(q.data||[]).map(x=>kind==="followers"?x.follower_id:x.followed_user_id);if(!ids.length){list.innerHTML="<div class='empty'>No "+kind+" yet.</div>";return}const {data:ps}=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids);const map=Object.fromEntries((ps||[]).map(p=>[p.user_id,p]));list.innerHTML=ids.map(id=>map[id]?personCard(map[id]):"").join("")||"<div class='empty'>No profiles available.</div>"}
async function loadProfile(){const box=$("profile"),{data:{session}}=await db.auth.getSession(),requested=new URLSearchParams(location.search).get("u");if(!session&&!requested){box.innerHTML="<h1 style='font-family:Orbitron'>SIGN IN REQUIRED</h1><p class='notice'>Connect your universal CrowRules account to open CrowSpace.</p><a class='btn primary' href='login.html'>CONNECT ACCOUNT</a>";return}currentUser=session?.user||null;const targetId=requested||currentUser?.id;if(!targetId){box.innerHTML="<h1>PROFILE NOT FOUND</h1>";return}viewingUserId=targetId;if(currentUser&&targetId===currentUser.id)await ensureProfile(currentUser);

const p=pr.data,posts=po.data||[],m=mm.data,isOwn=!!currentUser&&targetId===currentUser.id;if(pr.error||!p){box.innerHTML="<h1 style='font-family:Orbitron'>PROFILE NOT FOUND</h1><p class='notice'>This CrowSpace profile does not exist or is unavailable.</p><a class='btn ghost' href='index.html'>BACK TO FEED</a>";return}
if(currentUser&&!isOwn){const {data:f}=await db.from("crowspace_follows").select("follower_id").eq("follower_id",currentUser.id).eq("followed_user_id",targetId).maybeSingle();following=!!f}else following=false;
const interactionIds=posts.map(x=>x.id);const {data:ints}=interactionIds.length?await db.from("crowspace_social_interactions").select("target_id,interaction_type").eq("target_type","post").in("target_id",interactionIds):{data:[]};const reactionMap={};(ints||[]).forEach(i=>{reactionMap[i.target_id]??={};reactionMap[i.target_id][i.interaction_type]=(reactionMap[i.target_id][i.interaction_type]||0)+1});const commentCounts={};if(interactionIds.length){const {data:comments}=await db.from("crowspace_comments").select("post_id").in("post_id",interactionIds);(comments||[]).forEach(v=>commentCounts[v.post_id]=(commentCounts[v.post_id]||0)+1)}const name=p.display_name||p.username||"Crow",letter=esc(name.charAt(0).toUpperCase()),avatar=p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="Profile avatar" onerror="this.remove()">':letter,status=m?.status?m.status.toUpperCase():"CONNECTED",links=p.social_links&&typeof p.social_links==="object"?p.social_links:{};
const socialHtml=socialDefs.map(([key,label,icon])=>{const u=safeUrl(links[key]);return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+icon+" "+label+"</a>":""}).join("");
const socialFields=socialDefs.map(([key,label])=>'<div class="field"><label>'+label+'</label><input id="social_'+key+'" type="url" maxlength="500" placeholder="https://…" value="'+esc(links[key]||"")+'"></div>').join("");
box.innerHTML='<div class="profileHero"><div class="avatar">'+avatar+'</div><div><h1 class="profileName">'+esc(name)+'</h1><p class="handle">@'+esc(p.username||"crow")+'</p>'+(isOwn?"<span class='badge'>UNIVERSAL "+esc(status)+"</span>":"")+'</div></div><p class="bio">'+esc(p.bio||"No bio yet.")+'</p>'+(socialHtml?"<div class='socialLinks'>"+socialHtml+"</div>":"")+'<div class="stats"><button class="stat" id="followersBtn"><strong>'+(fc.count||0)+'</strong><span>FOLLOWERS</span></button><button class="stat" id="followingBtn"><strong>'+(tc.count||0)+'</strong><span>FOLLOWING</span></button><div class="stat"><strong>'+posts.length+'</strong><span>CAWS</span></div></div><div class="profileActions">'+(isOwn?"<button class='btn primary' id='editBtn'>EDIT PROFILE</button>":"<button class='btn "+(following?"primary":"ghost")+"' id='followBtn'>"+(following?"FOLLOWING":"FOLLOW")+"</button>")+'<a class="btn ghost" href="index.html">FEED</a><a class="btn ghost" href="media.html">MEDIA</a><a class="btn ghost" href="discover.html">DISCOVER</a></div>'+(isOwn?"<div class='panel' id='editor' hidden><h2>EDIT YOUR NODE</h2><form id='editForm'><div class='formGrid'><div class='field'><label>DISPLAY NAME</label><input id='displayName' maxlength='80' value='"+esc(p.display_name||"")+"'></div><div class='field'><label>USERNAME</label><input id='username' maxlength='24' pattern='[A-Za-z0-9_]+' value='"+esc(p.username||"")+"'></div><div class='field full'><label>BIO</label><textarea id='bio' maxlength='500'>"+esc(p.bio||"")+"</textarea></div><div class='field full'><label>AVATAR URL</label><input id='avatarUrl' type='url' maxlength='500' placeholder='https://…" value='"+esc(p.avatar_url||"")+"'></div>"+socialFields+'</div><div class="profileActions"><button class="btn primary" type="submit">SAVE PROFILE</button><button class="btn ghost" type="button" id="cancelEdit">CANCEL</button></div><p class="notice" id="saveNotice"></p></form></div>":"")+'<div class="panel hidden" id="peoplePanel"><h2 id="peopleTitle">NETWORK</h2><div class="list" id="followersList"></div><div class="list" id="followingList" style="display:none"></div></div><div class="sectionHead"><div><span>CAW ARCHIVE</span><h2>'+((isOwn)?"YOUR":"")+" CAWS</h2></div><small>'+posts.length+' total</small></div><div class="cawGrid">'+(po.error?"<p class='empty'>Posts could not be loaded.</p>":posts.length?posts.map(x=>{const r=reactionMap[x.id]||{};return '<article id="caw-'+x.id+'" class="card caw"><div><div class="cawBody">'+esc(x.body)+'</div>'+(x.media_url?'<a class="profileMedia" href="'+esc(x.media_url)+'" target="_blank" rel="noopener"><img src="'+esc(x.media_url)+'" alt="Caw media" loading="lazy"></a>':'')+'<div class="cawActions"><a class="btn ghost" href="index.html#caw-'+encodeURIComponent(x.id)+'">OPEN CAW</a><button class="reactionBtn" data-id="'+x.id+'" data-type="like">♥ '+(r.like||0)+'</button><button class="reactionBtn" data-id="'+x.id+'" data-type="save">☆ '+(r.save||0)+'</button><button class="reactionBtn" data-id="'+x.id+'" data-type="repost">↻ '+(r.repost||0)+'</button><button class="commentBtn" data-id="'+x.id+'">💬 COMMENTS</button></div></div><div class="cawTime">'+esc(fmt(x.created_at))+'</div></article>'}).join(""):"<p class='empty'>No Caws yet.</p>")+'</div>';
const mediaLink=box.querySelector('a[href="media.html"]');if(mediaLink)mediaLink.href="media.html?u="+encodeURIComponent(targetId);$("followersBtn").onclick=async()=>{const panel=$("peoplePanel");panel.classList.remove("hidden");$("peopleTitle").textContent="FOLLOWERS";$("followersList").style.display="grid";$("followingList").style.display="none";await loadPeople("followers")};
$("followingBtn").onclick=async()=>{const panel=$("peoplePanel");panel.classList.remove("hidden");$("peopleTitle").textContent="FOLLOWING";$("followersList").style.display="none";$("followingList").style.display="grid";await loadPeople("following")};
if(!isOwn&&currentUser)$( "followBtn").onclick=async()=>{const b=$("followBtn");b.disabled=true;const result=following?await db.from("crowspace_follows").delete().eq("follower_id",currentUser.id).eq("followed_user_id",targetId):await db.from("crowspace_follows").insert({follower_id:currentUser.id,followed_user_id:targetId});if(result.error)alert(result.error.message);await loadProfile()};
if(isOwn){$("editBtn").onclick=()=>{$("editor").hidden=false;$("editBtn").style.display="none"};$("cancelEdit").onclick=()=>{$("editor").hidden=true;$("editBtn").style.display="inline-block"};$("editForm").onsubmit=saveProfile}}
async function saveProfile(e){e.preventDefault();const n=$("saveNotice"),username=$("username").value.trim().toLowerCase(),display_name=$("displayName").value.trim(),bio=$("bio").value.trim(),avatar_url=$("avatarUrl").value.trim();n.textContent="SAVING…";if(!/^[a-z0-9_]{1,24}$/.test(username)){n.textContent="Username must use letters, numbers, or underscores.";return}const {data:du}=await db.from("crowspace_profiles").select("user_id").eq("username",username).neq("user_id",currentUser.id).limit(1);if(du?.length){n.textContent="That username is already in use.";return}const social_links={};for(const [key] of socialDefs){const v=$("social_"+key).value.trim();if(v&&!safeUrl(v)){n.textContent=key.toUpperCase()+" must be a valid http/https URL.";return}if(v)social_links[key]=v}const {error}=await db.from("crowspace_profiles").update({username,display_name:display_name||username,bio,avatar_url:avatar_url||null,social_links,updated_at:new Date().toISOString()}).eq("user_id",currentUser.id);if(error){n.textContent=error.message;return}await loadProfile()}
loadProfile();
document.addEventListener("click",async e=>{const b=e.target.closest(".reactionBtn");if(!b)return;const {data:{session}}=await db.auth.getSession();if(!session){location.href="login.html";return}const id=b.dataset.id,type=b.dataset.type;const {data:existing}=await db.from("crowspace_social_interactions").select("id").eq("target_type","post").eq("target_id",id).eq("user_id",session.user.id).eq("interaction_type",type).maybeSingle();if(existing)await db.from("crowspace_social_interactions").delete().eq("id",existing.id);else await db.from("crowspace_social_interactions").insert({target_type:"post",target_id:id,user_id:session.user.id,interaction_type:type});await loadProfile()});
document.addEventListener("click",async e=>{const b=e.target.closest(".commentBtn");if(!b)return;const id=b.dataset.id;let box=document.getElementById("comments-"+id);if(!box){box=document.createElement("div");box.id="comments-"+id;box.className="commentPanel";b.closest(".caw").appendChild(box)}if(box.dataset.open==="1"){box.dataset.open="0";box.hidden=true;return}box.hidden=false;box.dataset.open="1";box.innerHTML="<div class='empty'>Loading comments…</div>";const {data:comments,error}=await db.from("crowspace_comments").select("id,user_id,body,media_url,created_at").eq("post_id",id).order("created_at",{ascending:true}).limit(50);if(error){box.innerHTML="<div class='empty'>Comments unavailable.</div>";return}const ids=[...new Set((comments||[]).map(x=>x.user_id))];const {data:ps}=ids.length?await db.from("crowspace_profiles").select("user_id,display_name,username,avatar_url").in("user_id",ids):{data:[]};const map=Object.fromEntries((ps||[]).map(p=>[p.user_id,p]));box.innerHTML=(comments||[]).map(x=>{const p=map[x.user_id]||{};return "<div class='comment'><strong>"+esc(p.display_name||p.username||"Crow")+"</strong><div>"+esc(x.body)+"</div><small>"+esc(fmt(x.created_at))+"</small></div>"}).join("")||"<div class='empty'>No comments yet.</div>";if(currentUser){box.innerHTML+="<form class='commentForm'><input maxlength='500' required placeholder='Write a comment…'><button class='btn primary'>POST</button></form>";box.querySelector("form").onsubmit=async ev=>{ev.preventDefault();const input=ev.target.querySelector("input");const v=input.value.trim();if(!v)return;const {error}=await db.from("crowspace_comments").insert({post_id:id,user_id:currentUser.id,body:v});if(error){alert(error.message);return}input.value="";b.click();setTimeout(()=>b.click(),50)}}});

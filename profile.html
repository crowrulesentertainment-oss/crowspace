<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap');
:root{--bg:#03050b;--panel:rgba(7,11,23,.82);--panel2:rgba(12,17,34,.9);--line:#20304a;--cyan:#55efff;--violet:#a879ff;--pink:#ff5bd6;--green:#66ffb2;--danger:#ff557d;--text:#edf7ff;--muted:#8090aa;--glow:0 0 28px rgba(85,239,255,.16)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font-family:Rajdhani,Arial,sans-serif;background:radial-gradient(ellipse at 50% -10%,#18264a 0,#080c18 34%,#03050b 72%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(85,239,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(168,121,255,.04) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 35%,rgba(255,91,214,.06),transparent 28%),radial-gradient(circle at 85% 20%,rgba(85,239,255,.08),transparent 30%)}
.profile-wrap{max-width:1240px;margin:0 auto;padding:34px 18px 70px;position:relative;z-index:1}.state{padding:34px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(16px);text-align:center;color:var(--muted);box-shadow:var(--glow)}
.hero,.card{border:1px solid rgba(85,239,255,.16);border-radius:20px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 20px 70px #0009,inset 0 1px rgba(255,255,255,.035);position:relative}.hero{overflow:hidden}.hero:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(85,239,255,.08),transparent 35%,rgba(168,121,255,.08))}
.banner{height:310px;background:linear-gradient(135deg,#0b1227,#251247);background-size:cover;background-position:center;position:relative;overflow:hidden}.banner:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(3,5,11,.2) 50%,#03050b 100%)}.banner:after{content:"CROWSPACE // PERSONAL NODE";position:absolute;right:22px;bottom:18px;color:#7e9ab5;font:700 9px Orbitron;letter-spacing:.18em;text-shadow:0 0 14px #55efff}
.hero-body{padding:0 30px 30px}.identity{display:flex;gap:20px;align-items:flex-end;position:relative}.avatar{width:150px;height:150px;margin-top:-75px;border-radius:50%;object-fit:cover;background:#080e1d;border:5px solid #050812;outline:1px solid rgba(85,239,255,.65);box-shadow:0 0 0 4px rgba(85,239,255,.08),0 0 40px rgba(85,239,255,.22)}.identity h1{margin:0;font:800 30px Orbitron;letter-spacing:.02em;text-shadow:0 0 22px rgba(85,239,255,.2)}.handle{margin-top:6px;color:var(--cyan);font-size:13px;letter-spacing:.12em;text-transform:uppercase}.bio{max-width:820px;color:#c5d3e5;line-height:1.65;font-size:15px;margin:17px 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #2a3c59;background:linear-gradient(135deg,#0d1528,#111a31);color:var(--text);border-radius:10px;padding:10px 15px;font:700 12px Rajdhani;letter-spacing:.04em;cursor:pointer;transition:.2s;box-shadow:inset 0 1px #ffffff08}.btn:hover{transform:translateY(-1px);border-color:var(--cyan);box-shadow:0 0 18px rgba(85,239,255,.12)}.btn.primary{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 20px rgba(85,239,255,.1)}.btn.danger{border-color:var(--danger);color:#ff9bb3}.btn:disabled{opacity:.5;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:17px;border:1px solid var(--line);border-radius:13px;text-align:center;background:linear-gradient(180deg,#0c1324aa,#060b15aa)}.stat b{display:block;font:800 23px Orbitron;color:var(--cyan);text-shadow:0 0 16px rgba(85,239,255,.25)}.stat span{font:600 10px Rajdhani;color:var(--muted);text-transform:uppercase;letter-spacing:.15em}
.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px;margin-top:18px}.card{padding:20px;overflow:visible}.title{font:800 13px Orbitron;letter-spacing:.1em;margin-bottom:15px;color:#dff9ff}.title:before{content:"// ";color:var(--cyan)}.notice,.empty{padding:15px;border:1px dashed #2a3c59;border-radius:12px;color:var(--muted);font-size:12px;line-height:1.55;background:#050a14aa}.people,.posts{display:flex;flex-direction:column;gap:10px}.person,.post{display:flex;gap:12px;padding:13px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(120deg,#09101e,#070b15);transition:.2s}.person:hover,.post:hover{border-color:#365473;transform:translateX(2px)}.person{text-decoration:none;color:var(--text)}.person img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid #29415b}.person b,.post b{font-size:13px}.person small,.post small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.post{display:block}.post-body{margin-top:9px;color:#cdd9e8;font-size:12px;line-height:1.6;white-space:pre-wrap}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.pill{padding:7px 11px;border-radius:999px;border:1px solid var(--line);font:600 10px Rajdhani;color:var(--muted);cursor:pointer;letter-spacing:.06em}.pill.active{border-color:var(--cyan);color:var(--cyan);background:#55efff0d;box-shadow:0 0 14px #55efff0a}
.studio{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.wide{grid-column:1/-1}.field label{font:700 9px Rajdhani;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.12em}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:#040914;color:var(--text);padding:11px;font:500 11px Rajdhani;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #55efff12}.field textarea{min-height:95px;resize:vertical}.banner-tools{position:absolute;right:18px;top:18px;z-index:2;display:flex;gap:7px;flex-wrap:wrap}.banner-tools .btn{backdrop-filter:blur(10px);background:#050a14cc}.avatar-upload{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.avatar-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan);background:#10172c;box-shadow:0 0 20px #55efff18}.avatar-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.upload-note{font-size:9px;color:var(--muted);letter-spacing:.04em}.guest{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#070c17}.guest img{width:38px;height:38px;border-radius:50%;object-fit:cover}.guest-body{font-size:12px;line-height:1.55;color:#cdd6e8;margin-top:5px}.toast{position:fixed;right:20px;bottom:20px;z-index:9999;padding:13px 17px;border:1px solid var(--cyan);border-radius:12px;background:#07101dcc;backdrop-filter:blur(14px);color:var(--text);font:600 11px Rajdhani;box-shadow:0 10px 40px #000b,0 0 25px #55efff16}.hidden{display:none!important}
.cropper{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:18px;background:#02040acc;backdrop-filter:blur(14px)}.crop-box{width:min(680px,96vw);padding:20px;border:1px solid #2d5570;border-radius:20px;background:linear-gradient(145deg,#080f1f,#040811);box-shadow:0 30px 100px #000;position:relative}.crop-stage{height:min(62vh,440px);display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle,#101d34,#030711);border-radius:15px;position:relative;touch-action:none;cursor:grab}.crop-stage.dragging{cursor:grabbing}.banner-crop-stage{height:min(48vh,360px);}.banner-crop-stage:after{width:82%;aspect-ratio:16/5;border-radius:10px}.banner-crop-stage img{max-width:none;max-height:none;width:100%;height:auto}.crop-stage:after{content:"";position:absolute;width:min(76%,320px);aspect-ratio:1;border:2px solid var(--cyan);border-radius:50%;box-shadow:0 0 0 9999px #0008,0 0 25px #55efff35;pointer-events:none}.crop-stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transform-origin:center center}.crop-controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:13px}.crop-controls input{flex:1;min-width:150px}
@media(max-width:760px){.profile-wrap{padding:18px 12px 50px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.identity{align-items:flex-start;flex-direction:column;gap:9px}.avatar{margin-top:-55px;width:120px;height:120px}.identity h1{font-size:22px}.banner{height:220px}.hero-body{padding:0 18px 22px}.studio{grid-template-columns:1fr}.field.wide{grid-column:auto}.card{padding:15px}.banner:after{font-size:7px}}
.appearance-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.appearance-choice{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.appearance-choice button{min-height:48px}.appearance-choice button.active{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 18px rgba(85,239,255,.12);background:rgba(85,239,255,.07)}.swatch{height:18px;border-radius:999px;margin-bottom:5px}.badge-strip{display:flex;gap:7px;flex-wrap:wrap}.badge-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:#070d18;color:#dcecff;font:700 10px Rajdhani}.badge-chip b{font-size:15px}.appearance-preview{border:1px solid var(--line);border-radius:14px;padding:12px;background:#050a14;display:flex;gap:10px;align-items:center}.appearance-preview .mini-banner{height:48px;flex:1;border-radius:9px;background:linear-gradient(135deg,#0b1227,#251247)}
.identity-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.creator-tag{display:inline-flex;align-items:center;padding:5px 9px;border:1px solid rgba(85,239,255,.22);border-radius:999px;background:rgba(85,239,255,.05);color:var(--cyan);font:700 10px Rajdhani;letter-spacing:.06em}
.tagline{max-width:900px;margin:10px 0 0;color:#e6f5ff;font:600 16px Rajdhani;letter-spacing:.02em}
.social-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.social-link{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#dcecff;text-decoration:none;background:#050a14;font:700 10px Rajdhani}
.social-link:hover{border-color:var(--cyan);color:var(--cyan)}
.featured-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:stretch}
.featured-copy{padding:15px;border:1px solid var(--line);border-radius:13px;background:#050a14}
.featured-copy b{font:800 14px Orbitron;color:#e9fbff}
.featured-copy p{margin:8px 0 0;color:#aebed2;font-size:12px;line-height:1.55}
.creator-studio-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.creator-studio-grid .wide{grid-column:1/-1}
.link-list{display:flex;flex-direction:column;gap:7px}
.link-row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:7px;align-items:center}
.badge-order{display:flex;flex-direction:column;gap:7px}
.badge-order-row{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:#050a14}
.badge-order-row button{min-width:34px;padding:7px}
@media(max-width:760px){.featured-hero,.creator-studio-grid{grid-template-columns:1fr}.creator-studio-grid .wide{grid-column:auto}.link-row{grid-template-columns:1fr}.badge-order-row{grid-template-columns:1fr auto auto}}body[data-theme="violet"]{--cyan:#b994ff;--violet:#55efff;--pink:#ff78e5}body[data-theme="rose"]{--cyan:#ff8bd8;--violet:#9d8cff;--pink:#ff557d}body[data-theme="emerald"]{--cyan:#66ffb2;--violet:#55efff;--pink:#a7ffcf}body[data-theme="gold"]{--cyan:#ffd36b;--violet:#ff9b5c;--pink:#ffe7a8}.profile-wrap[data-layout="wide"]{max-width:1400px}.profile-wrap[data-layout="compact"]{max-width:980px}.profile-wrap[data-layout="compact"] .banner{height:240px}.profile-wrap[data-layout="minimal"] .card{box-shadow:none;background:rgba(7,11,23,.65)}@media(max-width:760px){.appearance-grid{grid-template-columns:1fr}.appearance-choice{grid-template-columns:repeat(2,1fr)}}
</style>

<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=1" defer></script></head>
<body data-page="profile">
<main class="profile-wrap" id="profileWrap"><div id="app" class="state">Connecting to CrowSpace…</div></main>
<script>
(function(){
"use strict";
const qs=new URLSearchParams(location.search);
let db=null,me=null,target=null,relationship=null,profiles=new Map(),posts=[],caws=[],followers=[],following=[],friends=[],guestbook=[],badges=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const avatar=u=>u||"https://ui-avatars.com/api/?background=10172c&color=78efff&name=Crow";
const safe=async(fn,fallback=[])=>{try{const r=await fn();return r}catch(e){console.warn("[CrowSpace profile]",e);return fallback}};
function toast(msg){const x=document.createElement("div");x.className="toast";x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),3000)}
function profileHref(p){return "profile.html?u="+encodeURIComponent(p.username||p.user_id)}
async function getProfile(){
 const value=qs.get("u")||qs.get("id")||qs.get("user");
 let q=db.from("crowspace_profiles").select("*");
 if(value) q=/^[0-9a-f-]{36}$/i.test(value)?q.eq("user_id",value):q.eq("username",value);
 else if(me) q=q.eq("user_id",me.id); else return null;
 return (await q.limit(1).maybeSingle()).data||null;
}
async function load(){
 try{
  await window.CrowSpaceAuth.ready;
  db=window.CrowSpaceAuth.client; me=window.CrowSpaceAuth.user;
  if(!db) throw new Error("Supabase client unavailable");
  if(me) await safe(()=>window.CrowSpaceAuth.ensureProfile(me),null);
  target=await getProfile();
  if(!target){$("app").innerHTML='<div class="state">Profile not found.</div>';return}
  await Promise.all([loadSocial(),loadContent(),loadGuestbook()]);
  render();
  startRealtime();
 }catch(e){console.error(e);$("app").innerHTML='<div class="state">CrowSpace could not connect to Supabase.<br><br><small>'+esc(e.message||e)+'</small></div>'}
}
async function loadSocial(){
 const uid=target.user_id;
 const [fo,fi,fr]=await Promise.all([
  safe(()=>db.from("crowspace_follows").select("follower_id,followed_user_id,created_at").eq("followed_user_id",uid)),
  safe(()=>db.from("crowspace_follows").select("follower_id,followed_user_id,created_at").eq("follower_id",uid)),
  safe(()=>db.from("crowspace_friendships").select("*").or("requester_id.eq."+uid+",addressee_id.eq."+uid))
 ]);
 followers=fo.data||[];following=fi.data||[];friends=(fr.data||[]).filter(x=>x.status==="accepted");
 if(me&&me.id!==uid){
  relationship=await safe(async()=>{
   const [a,b,c]=await Promise.all([
    db.from("crowspace_follows").select("follower_id").eq("follower_id",me.id).eq("followed_user_id",uid).maybeSingle(),
    db.from("crowspace_follows").select("follower_id").eq("follower_id",uid).eq("followed_user_id",me.id).maybeSingle(),
    db.from("crowspace_friendships").select("*").or("and(requester_id.eq."+me.id+",addressee_id.eq."+uid+"),and(requester_id.eq."+uid+",addressee_id.eq."+me.id+")").maybeSingle()
   ]);return {following:!!a.data,followsYou:!!b.data,friendship:c.data||null}
  },{following:false,followsYou:false,friendship:null});
 }
 const ids=[...new Set([...followers.map(x=>x.follower_id),...following.map(x=>x.followed_user_id),...friends.flatMap(x=>[x.requester_id,x.addressee_id])])].filter(x=>x!==uid); if(ids.length){const r=await safe(()=>db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url,bio").in("user_id",ids));(r.data||[]).forEach(p=>profiles.set(p.user_id,p))}
}
async function loadContent(){
 const uid=target.user_id;
 const [p,c]=await Promise.all([
  safe(()=>db.from("crowspace_posts").select("id,user_id,title,body,media_url,created_at,like_count,comment_count").eq("user_id",uid).order("created_at",{ascending:false}).limit(50)),
  safe(()=>db.from("crowspace_caws").select("id,user_id,title,thumbnail_url,created_at").eq("user_id",uid).order("created_at",{ascending:false}).limit(20))
 ]);
 posts=p.data||[];caws=c.data||[];\n const ub=await safe(()=>db.from("crowspace_user_badges").select("badge_id,awarded_at").eq("user_id",uid)); const badgeIds=(ub.data||[]).map(x=>x.badge_id).filter(Boolean); if(badgeIds.length){const br=await safe(()=>db.from("crowspace_badges").select("id,name,description,icon,points").in("id",badgeIds));badges=br.data||[]}else badges=[];
 badges=badgeOrder();
}
async function loadGuestbook(){
 const r=await safe(()=>db.from("crowspace_guestbook").select("*").eq("profile_id",target.user_id).order("created_at",{ascending:false}).limit(50));
 guestbook=r.data||[];
 const ids=[...new Set(guestbook.map(x=>x.author_id).filter(Boolean))];
 if(ids.length){const p=await safe(()=>db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids));(p.data||[]).forEach(x=>profiles.set(x.user_id,x))}
}
function connectionButtons(){
 if(!me)return '<a class="btn primary" href="login.html">Log in to connect</a>'; if(me.id===target.user_id)return '<span class="pill active">Your profile</span>';
 const f=relationship?.friendship;let html="";
 if(relationship?.following)html+='<button class="btn" data-action="unfollow">Following</button>';else html+='<button class="btn primary" data-action="follow">Follow</button>';
 if(f?.status==="accepted")html+='<button class="btn" data-action="remove-friend">Friends</button>';
 else if(f?.status==="pending"&&f.addressee_id===me.id)html+='<button class="btn primary" data-action="accept-friend">Accept Friend</button>';
 else if(f?.status==="pending")html+='<button class="btn" disabled>Request Sent</button>';
 else html+='<button class="btn" data-action="friend">Add Friend</button>';
 html+='<button class="btn danger" data-action="block">Block</button>';
 return html;
}
function render(){
 const self=me?.id===target.user_id;
 $("app").innerHTML='<section class="hero"><div class="banner" id="banner"><div class="banner-tools" id="bannerTools"></div></div><div class="hero-body"><div class="identity"><img class="avatar" src="'+esc(avatar(target.avatar_url))+'"><div><h1>'+esc(target.display_name||target.username||"CrowSpace Member")+'</h1><div class="handle">@'+esc(target.username||"member")+'</div><div class="identity-meta"><span class="creator-tag">'+esc(target.creator_category||"Creator")+'</span><span class="creator-tag">CROWSPACE MEMBER</span></div></div></div>'+(target.portfolio_tagline?'<div class="tagline">'+esc(target.portfolio_tagline)+'</div>':'')+'<p class="bio">'+esc(target.bio||target.portfolio_bio||"Welcome to my CrowSpace profile.")+'</p>'+(socialHtml()?'<div class="social-row">'+socialHtml()+'</div>':'')+'<div class="actions" style="margin-top:12px">'+connectionButtons()+'</div></div></section>'+'<section class="card" style="margin-top:16px"><div class="title">CROWSPACE CONNECTIONS</div><div class="stats"><div class="stat"><b>'+friends.length+'</b><span>Friends</span></div><div class="stat"><b>'+followers.length+'</b><span>Followers</span></div><div class="stat"><b>'+following.length+'</b><span>Following</span></div><div class="stat"><b>'+posts.length+'</b><span>Posts</span></div></div></section>'+
 (self?studioHtml():"")+
 (badges.length?'<section class="card" style="margin-top:16px"><div class="title">PROFILE BADGES</div><div class="badge-strip">'+badgeOrder().map(b=>'<span class="badge-chip" title="'+esc(b.description||"")+'"><b>'+esc(b.icon||"✦")+'</b>'+esc(b.name||"Badge")+'</span>').join("")+'</div></section>':"")+publicFeaturedHtml()+
 '<div class="grid"><div>'+
 '<section class="card"><div class="title">PEOPLE & CONNECTIONS</div><div class="tabs"><span class="pill active" data-people="friends">Friends</span><span class="pill" data-people="followers">Followers</span><span class="pill" data-people="following">Following</span></div><div id="people"></div></section>'+
 '<section class="card" style="margin-top:16px"><div class="title">PROFILE WALL</div><div class="tabs"><span class="pill active" data-wall="posts">Posts</span><span class="pill" data-wall="caws">Caws</span></div><div id="wall"></div></section>'+
 '<section class="card" style="margin-top:16px"><div class="title">PROFILE GUESTBOOK</div><div id="guestbook"></div></section>'+
 '</div><aside>'+
 '<section class="card"><div class="title">SOCIAL STATUS</div><div class="notice">'+(self?"This is your CrowSpace profile. Changes saved here sync to Supabase.":(relationship?.followsYou?"This member follows you. ":"")+(relationship?.following?"You follow this member.":"Connect through CrowSpace."))+'</div></section>'+
 '<section class="card" style="margin-top:16px"><div class="title">FEATURED WORK</div><div class="notice"><b>'+esc(target.portfolio_work_title||"My Work")+'</b><br><br>'+esc(target.portfolio_collections_title||"Collections")+'</div></section>'+
 '</aside></div>';
 const b=$("banner");if(target.banner_url)b.style.backgroundImage="url('"+esc(target.banner_url)+"')";

function normalizeSocialLinks(value){
 if(!value)return [];
 if(Array.isArray(value))return value.filter(x=>x&&typeof x==="object"&&x.url).slice(0,12);
 if(typeof value==="object")return Object.entries(value).filter(([k,v])=>typeof v==="string"&&v.trim()).slice(0,12).map(([label,url])=>({label,url}));
 return [];
}
function badgeOrder(){
 const stored=Array.isArray(target?.profile_sections?.badges)?target.profile_sections.badges.map(String):[];
 const byId=new Map(badges.map(b=>[String(b.id),b]));
 const ordered=[];
 stored.forEach(id=>{const b=byId.get(id);if(b){ordered.push(b);byId.delete(id)}});
 badges.forEach(b=>{if(byId.has(String(b.id)))ordered.push(b)});
 return ordered;
}

async function uploadAvatar(){const f=croppedAvatarFile||$("sAvatarFile")?.files?.[0];if(!f)return $("sAvatar")?.value||"";if(f.size>5*1024*1024)throw new Error("Avatar must be 5 MB or smaller.");const path=me.id+"/avatar-"+Date.now()+".jpg";const up=await db.storage.from("crowspace-media").upload(path,f,{contentType:"image/jpeg",upsert:false,cacheControl:"3600"});if(up.error)throw up.error;return db.storage.from("crowspace-media").getPublicUrl(up.data.path).data.publicUrl}
async function removeAvatar(){const old=target.avatar_url||"";if(old){const m=old.match(/\/storage\/v1\/object\/public\/crowspace-media\/(.+)$/);if(m){const d=await db.storage.from("crowspace-media").remove([decodeURIComponent(m[1])]);if(d.error){toast(d.error.message);return}}}const r=await db.from("crowspace_profiles").update({avatar_url:null}).eq("user_id",me.id);if(r.error){toast(r.error.message);return}target.avatar_url=null;$("sAvatar").value="";$("sAvatarFile").value="";croppedAvatarFile=null;$("avatarPreview").src=avatar("");toast("Avatar removed")}
async function saveProfile(){const btn=$("saveProfile");if(btn)btn.disabled=true;try{const old=target.avatar_url||"",oldBanner=target.banner_url||"",newAvatar=await uploadAvatar(),newBanner=await uploadBanner(),payload={display_name:$("sDisplay").value.trim(),creator_category:$("sCreatorCategory").value.trim()||null,portfolio_tagline:$("sTagline").value.trim()||null,portfolio_bio:$("sPortfolioBio").value.trim()||null,portfolio_work_title:$("sWorkTitle").value.trim()||null,portfolio_collections_title:$("sCollectionsTitle").value.trim()||null,featured_caw_id:$("sFeaturedCaw").value||null,social_links:collectSocialLinks(),avatar_url:newAvatar||null,banner_url:newBanner||null,bio:$("sBio").value,privacy_profile:$("sProfile").value,privacy_posts:$("sPosts").value,privacy_media:$("sMedia").value,privacy_activity:$("sActivity").value,profile_theme:target.profile_theme||"cyan",profile_sections:Object.assign({},target.profile_sections||{},{layout:$("profileWrap").dataset.layout||"standard",badges:badgeOrder().map(b=>b.id)})};const r=await db.from("crowspace_profiles").update(payload).eq("user_id",me.id);if(r.error)throw r.error;if(newBanner&&oldBanner&&oldBanner!==newBanner){const m=oldBanner.match(/\/storage\/v1\/object\/public\/crowspace-media\/(.+)$/);if(m){const d=await db.storage.from("crowspace-media").remove([decodeURIComponent(m[1])]);if(d.error)console.warn("[CrowSpace banner cleanup]",d.error)}}if(newAvatar&&old&&old!==newAvatar){const m=old.match(/\/storage\/v1\/object\/public\/crowspace-media\/(.+)$/);if(m){const d=await db.storage.from("crowspace-media").remove([decodeURIComponent(m[1])]);if(d.error)console.warn("[CrowSpace avatar cleanup]",d.error)}}croppedAvatarFile=null;croppedBannerFile=null;Object.assign(target,payload);toast("Profile saved to Supabase");render()}catch(e){toast(e.message||"Avatar update failed")}finally{if(btn)btn.disabled=false}}
function showPeople(kind){
 const box=$("people");let ids=[];
 if(kind==="friends")ids=friends.flatMap(x=>[x.requester_id,x.addressee_id]).filter(x=>x!==target.user_id);
 if(kind==="followers")ids=followers.map(x=>x.follower_id);
 if(kind==="following")ids=following.map(x=>x.followed_user_id);
 ids=[...new Set(ids)];box.innerHTML=ids.length?'<div class="people">'+ids.map(id=>{const p=profiles.get(id);return p?'<a class="person" href="'+profileHref(p)+'"><img src="'+esc(avatar(p.avatar_url))+'"><div><b>'+esc(p.display_name||p.username||"Member")+'</b><small>@'+esc(p.username||"member")+'</small></div></a>':""}).join("")+'</div>':'<div class="empty">No connections to display.</div>';
}
function showWall(kind){
 const box=$("wall");
 if(kind==="posts"){box.innerHTML=posts.length?'<div class="posts">'+posts.map(p=>'<article class="post"><b>'+esc(p.title||"CrowSpace Post")+'</b><small>'+new Date(p.created_at).toLocaleString()+'</small><div class="post-body">'+esc(p.body||"")+'</div></article>').join("")+'</div>':'<div class="empty">No posts yet.</div>'}
 else {box.innerHTML=caws.length?'<div class="posts">'+caws.map(c=>'<article class="post"><b>'+esc(c.title||"Caw")+'</b><small>'+new Date(c.created_at).toLocaleString()+'</small></article>').join("")+'</div>':'<div class="empty">No Caws yet.</div>'}
}
function showGuestbook(){
 const box=$("guestbook");if(!box)return;
 const canWrite=me&&me.id!==target.user_id&&target.allow_guestbook!==false;
 let form=canWrite?'<div class="field" style="margin-bottom:12px"><textarea id="guestText" placeholder="Leave a message…"></textarea><button class="btn primary" id="guestSend">Sign Guestbook</button></div>':"";
 box.innerHTML=form+(guestbook.length?guestbook.map(g=>{const p=profiles.get(g.author_id)||{};return '<div class="guest" style="margin-top:8px"><img src="'+esc(avatar(p.avatar_url))+'"><div><b>'+esc(p.display_name||p.username||"Member")+'</b><small> · '+new Date(g.created_at).toLocaleString()+'</small><div class="guest-body">'+esc(g.body||g.message||"")+'</div></div></div>'}).join(""):'<div class="empty">No guestbook messages yet.</div>');
 $("guestSend")?.addEventListener("click",async()=>{const body=$("guestText").value.trim();if(!body)return;const r=await db.from("crowspace_guestbook").insert({profile_id:target.user_id,author_id:me.id,body});if(r.error){toast(r.error.message);return}toast("Guestbook message posted");await load()});}
let realtimeChannel=null,realtimeRefreshTimer=null;
function queueRealtimeRefresh(reason){
  clearTimeout(realtimeRefreshTimer);
  realtimeRefreshTimer=setTimeout(async()=>{try{await load();toast("Live profile updated");}catch(e){console.warn("[CrowSpace realtime]",reason,e)}},180);
}
function startRealtime(){
  if(!db||!target||realtimeChannel)return;
  const uid=target.user_id;
  realtimeChannel=db.channel("crowspace-profile-realtime-"+uid);
  realtimeChannel
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_profiles",filter:"user_id=eq."+uid},p=>{if(p.eventType==="UPDATE"){target=Object.assign({},target,p.new);queueRealtimeRefresh("profile")}})
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_follows",filter:"followed_user_id=eq."+uid},()=>queueRealtimeRefresh("followers"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_follows",filter:"follower_id=eq."+uid},()=>queueRealtimeRefresh("following"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_friendships",filter:"requester_id=eq."+uid},()=>queueRealtimeRefresh("friendships"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_friendships",filter:"addressee_id=eq."+uid},()=>queueRealtimeRefresh("friendships"))
    .on("postgres_changes",{event:"*",schema:"public",table:"member_blocks",filter:"blocker_id=eq."+uid},()=>queueRealtimeRefresh("blocks"))
    .on("postgres_changes",{event:"*",schema:"public",table:"member_blocks",filter:"blocked_id=eq."+uid},()=>queueRealtimeRefresh("blocks"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_posts",filter:"user_id=eq."+uid},()=>queueRealtimeRefresh("posts"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_caws",filter:"user_id=eq."+uid},()=>queueRealtimeRefresh("caws"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_guestbook",filter:"profile_id=eq."+uid},()=>queueRealtimeRefresh("guestbook"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_notifications",filter:"user_id=eq."+uid},()=>{queueRealtimeRefresh("notifications");document.dispatchEvent(new CustomEvent("crowspace-notification-live"))})
    .subscribe((status,error)=>{
      if(status==="SUBSCRIBED") document.body.dataset.realtime="connected";
      if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){document.body.dataset.realtime="error";console.error("[CrowSpace realtime]",status,error)}
    });
}
function stopRealtime(){if(realtimeChannel&&db){db.removeChannel(realtimeChannel);realtimeChannel=null}clearTimeout(realtimeRefreshTimer)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&db&&target&&!realtimeChannel)startRealtime()});
window.addEventListener("online",()=>{if(db&&target&&!realtimeChannel)startRealtime()});
window.addEventListener("offline",()=>{document.body.dataset.realtime="offline"});
window.addEventListener("beforeunload",stopRealtime);



window.addEventListener("crowspace:supabase-ready",load);
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",load);else load();
})();
</script>

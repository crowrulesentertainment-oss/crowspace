<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nest | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script>
<style>
.nest{max-width:1280px;margin:auto;padding:26px 18px 70px}.cover{min-height:300px;position:relative;overflow:hidden;border:1px solid rgba(85,231,255,.18);border-radius:28px;background:radial-gradient(circle at 75% 35%,rgba(85,231,255,.2),transparent 24%),linear-gradient(145deg,#071417,#100b1d 65%,#06080e);box-shadow:0 30px 100px #0008}.cover:before{content:"";position:absolute;inset:-50%;background:repeating-linear-gradient(105deg,transparent 0 75px,rgba(130,220,235,.035) 76px 77px,transparent 78px);animation:drift 10s linear infinite}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 49%,rgba(85,231,255,.035) 50%,transparent 51%);background-size:100% 7px;pointer-events:none}@keyframes drift{to{transform:translate(100px,140px)}}.cover-content{position:absolute;inset:auto 34px 28px;z-index:2;display:flex;align-items:end;gap:24px}.nest-avatar{width:150px;height:150px;flex:none;border-radius:24px;border:2px solid #55e7ff99;background:linear-gradient(135deg,#102b31,#24143d);display:grid;place-items:center;overflow:hidden;font:800 48px Orbitron;color:#55e7ff;box-shadow:0 0 50px #55e7ff22}.nest-avatar img{width:100%;height:100%;object-fit:cover}.identity{min-width:0}.eyebrow{font:800 9px Orbitron;letter-spacing:.22em;color:#55e7ff}.identity h1{font:800 clamp(30px,5vw,62px) Orbitron;margin:6px 0 0;line-height:1}.handle{color:#9aabb0;font:12px monospace}.bio{max-width:760px;color:#c0cece;line-height:1.6;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid rgba(255,255,255,.12);background:#ffffff09;color:#eef7f7;padding:9px 14px;border-radius:10px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#147e96,#7652c9);border-color:#55e7ff55}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.08);border-radius:16px;overflow:hidden}.hud div{padding:14px;background:#071114cc;text-align:center}.hud b{display:block;font:800 20px Orbitron;color:#fff}.hud span{font-size:9px;color:#849899;letter-spacing:.12em;text-transform:uppercase}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;margin-top:18px}.panel{background:#071114dd;border:1px solid rgba(255,255,255,.09);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px #0005}.head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08)}.head h2{margin:0;font:700 14px Orbitron}.head span{font-size:9px;color:#718889}.body{padding:18px}.about{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{padding:12px;border:1px solid #ffffff0c;border-radius:12px;background:#ffffff03}.detail small{display:block;color:#718889;font-size:9px;text-transform:uppercase}.detail strong{display:block;margin-top:4px;font-size:12px}.caws{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.caw{border:1px solid #ffffff0d;border-radius:14px;overflow:hidden;background:#ffffff03}.caw img{width:100%;aspect-ratio:16/9;object-fit:cover}.caw .copy{padding:12px}.caw strong{display:block}.caw small{display:block;color:#809192;margin-top:5px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.empty{color:#778989;padding:10px 0;font-size:12px}.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff0b}.person:last-child{border:0}.person img,.person .pa{width:42px;height:42px;border-radius:12px;object-fit:cover}.person .pa{display:grid;place-items:center;background:#10252a;color:#55e7ff;font-weight:800}.person a{color:#fff}.error{padding:25px;text-align:center}@media(max-width:800px){.cover-content{position:relative;inset:auto;padding:30px 22px;min-height:300px;align-items:center;flex-direction:column;text-align:center}.nest-avatar{width:120px;height:120px}.actions{justify-content:center}.layout{grid-template-columns:1fr}.hud{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.nest{padding:12px 10px 50px}.about,.caws{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){.cover:before{animation:none}}
</style></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header>
<main class="nest" id="app"><div class="panel body">Loading Nest…</div></main><footer>CrowSpace · One Account. One Universe.</footer>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id),c=window.crowSupabase,params=new URLSearchParams(location.search);let uid=params.get("id"),viewer=null;
const esc=s=>window.CS?.escape?CS.escape(s):String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),url=u=>{try{let x=new URL(u,location.href);return/^https?:$/.test(x.protocol)?x.href:""}catch{return""}},ini=s=>String(s||"C").trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()||"C";
async function count(t,field){let q=c.from(t).select("id",{count:"exact",head:true}).eq(field,uid);let r=await q;return r.error?0:r.count||0}
async function load(){try{if(!c)throw Error("Supabase is not initialized.");viewer=(await c.auth.getUser()).data?.user||null;if(!uid)uid=viewer?.id;if(!uid){$("app").innerHTML='<div class="panel body error"><h2>Open Your Nest</h2><p class="empty">Sign in to view your CrowSpace profile.</p><a class="btn primary" href="login.html">Sign In →</a></div>';return}
let p=(await c.from("membership_profiles").select("id,display_name,username,bio,avatar_url,website,location,created_at").eq("id",uid).maybeSingle());if(p.error)throw p.error;if(!p.data)throw Error("Profile not found.");p=p.data;
let [followers,following,caws,photos,groups,events]=await Promise.all([count("crowspace_follows","followed_user_id"),count("crowspace_follows","follower_id"),count("crowspace_caws","user_id"),count("crowspace_album_photos","user_id"),count("crowspace_group_members","user_id"),count("crowspace_events","created_by")]);let av=url(p.avatar_url);
$("app").innerHTML='<section class="cover"><div class="cover-content"><div class="nest-avatar">'+(av?'<img src="'+esc(av)+'" alt="">':esc(ini(p.display_name||p.username)))+'</div><div class="identity"><div class="eyebrow">CROWSPACE // NEST PROFILE</div><h1>'+esc(p.display_name||"CrowSpace Member")+'</h1><div class="handle">@'+esc(p.username||"member")+'</div><p class="bio">'+esc(p.bio||"Building my corner of the CrowSpace universe.")+'</p><div class="actions">'+(viewer?.id===uid?'<a class="btn primary" href="customize.html">✦ Customize Nest</a>':'<button class="btn primary" id="follow">Follow</button><a class="btn" href="messenger.html?user='+encodeURIComponent(uid)+'">Message</a>')+'</div></div></div></section><section class="hud"><div><b>'+followers+'</b><span>Followers</span></div><div><b>'+following+'</b><span>Following</span></div><div><b>'+caws+'</b><span>Caws</span></div><div><b>'+groups+'</b><span>Groups</span></div></section><div class="layout"><div><section class="panel"><div class="head"><h2>IDENTITY FILE</h2><span>CROWSPACE PROFILE</span></div><div class="body"><div class="about"><div class="detail"><small>Username</small><strong>@'+esc(p.username||"member")+'</strong></div><div class="detail"><small>Location</small><strong>'+esc(p.location||"Not added")+'</strong></div><div class="detail"><small>Joined</small><strong>'+esc(p.created_at?new Date(p.created_at).toLocaleDateString():"CrowSpace")+'</strong></div><div class="detail"><small>Events Created</small><strong>'+events+'</strong></div></div>'+(p.website&&url(p.website)?'<p><a class="btn" href="'+esc(url(p.website))+'" target="_blank" rel="noopener noreferrer">Open Website ↗</a></p>':"")+'</div></section><section class="panel" style="margin-top:18px"><div class="head"><h2>RECENT CAWS</h2><a href="caws.html?user='+encodeURIComponent(uid)+'">View all →</a></div><div class="body" id="caws"><div class="empty">Loading…</div></div></section><section class="panel" style="margin-top:18px"><div class="head"><h2>VISUAL ARCHIVE</h2><a href="albums.html?user='+encodeURIComponent(uid)+'">Photos →</a></div><div class="body" id="photos"><div class="empty">Loading…</div></div></section></div><aside><section class="panel"><div class="head"><h2>NETWORK</h2><span>FRIENDS</span></div><div class="body" id="friends"><div class="empty">Loading…</div></div></section><section class="panel" style="margin-top:18px"><div class="head"><h2>NEST STATUS</h2></div><div class="body"><div class="detail"><small>Member Since</small><strong>One Account · One Universe</strong></div></div></section></aside></div>';
await content();if(viewer?.id!==uid)follow();
}catch(e){console.error(e);$("app").innerHTML='<div class="panel body error"><h2>Nest Offline</h2><p class="empty">'+esc(e.message||"Unable to load profile.")+'</p><button class="btn" onclick="location.reload()">Retry</button></div>'}}
async function content(){let q=await c.from("crowspace_caws").select("id,title,caption,thumbnail_url,video_url,created_at").eq("user_id",uid).order("created_at",{ascending:false}).limit(4);$("caws").innerHTML=(q.data||[]).map(x=>'<article class="caw">'+(url(x.thumbnail_url)?'<img loading="lazy" src="'+esc(url(x.thumbnail_url))+'" alt="">':"")+'<div class="copy"><strong>'+esc(x.title||"Untitled Caw")+'</strong><small>'+esc(x.caption||"")+'</small>'+(url(x.video_url)?'<p><a class="btn" target="_blank" rel="noopener" href="'+esc(url(x.video_url))+'">Watch Caw →</a></p>':"")+'</div></article>').join("")||'<div class="empty">No Caws yet.</div>';
let p=await c.from("crowspace_album_photos").select("id,image_url,caption").eq("user_id",uid).order("created_at",{ascending:false}).limit(6);$("photos").innerHTML='<div class="photos">'+(p.data||[]).map(x=>url(x.image_url)?'<img loading="lazy" src="'+esc(url(x.image_url))+'" alt="'+esc(x.caption||"CrowSpace photo")+'">':"").join("")+'</div>'||'<div class="empty">No photos yet.</div>';
let f=await c.from("crowspace_friendships").select("requester_id,addressee_id").eq("status","accepted").or("requester_id.eq."+uid+",addressee_id.eq."+uid).limit(8);let ids=(f.data||[]).map(x=>x.requester_id===uid?x.addressee_id:x.requester_id);if(!ids.length){$("friends").innerHTML='<div class="empty">No connections listed yet.</div>';return}let m=await c.from("membership_profiles").select("id,display_name,username,avatar_url").in("id",ids);$("friends").innerHTML=(m.data||[]).map(x=>'<div class="person"><a class="pa" href="profile.html?id='+encodeURIComponent(x.id)+'">'+(url(x.avatar_url)?'<img src="'+esc(url(x.avatar_url))+'" alt="">':esc(ini(x.display_name||x.username)))+'</a><div><a href="profile.html?id='+encodeURIComponent(x.id)+'">'+esc(x.display_name||"Member")+'</a><small class="muted">@'+esc(x.username||"member")+'</small></div></div>').join("")}
async function follow(){let b=$("follow");if(!b||!viewer){if(b)b.textContent="Sign in to follow";return}let q=await c.from("crowspace_follows").select("id").eq("follower_id",viewer.id).eq("followed_user_id",uid).maybeSingle();b.textContent=q.data?"Following":"Follow";b.onclick=async()=>{b.disabled=true;let r=q.data?await c.from("crowspace_follows").delete().eq("id",q.data.id):await c.from("crowspace_follows").insert({follower_id:viewer.id,followed_user_id:uid});if(!r.error){q.data=q.data?null:{id:"new"};b.textContent=q.data?"Following":"Follow"}else alert(r.error.message);b.disabled=false}}
document.addEventListener("DOMContentLoaded",load,{once:true})})();
</script><script src="js/global-nav.js?v=20260928-4" defer></script></body></html>

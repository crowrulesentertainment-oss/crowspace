:root{--cyan:#78efff;--purple:#b58cff;--bg:#070914;--card:#0d1222;--line:#26304a;--muted:#8e9ab5}
body{background:radial-gradient(circle at 50% 0,#131a32 0,#070914 45%);color:#eef3ff;font-family:Montserrat,Arial,sans-serif}.profile-wrap{max-width:1100px;margin:30px auto;padding:0 18px}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--card);min-height:300px}.banner{height:220px;background:linear-gradient(135deg,#10172c,#1c1240);background-size:cover;background-position:center}.hero-body{position:relative;padding:0 24px 24px}.avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #070914;position:relative;margin-top:-60px;background:#10172c}.identity{display:flex;gap:18px;align-items:flex-end}.identity h1{margin:0;font:800 25px Orbitron,Arial}.handle{color:var(--muted);font-size:12px;margin-top:4px}.bio{max-width:720px;color:#c8d1e5;line-height:1.55;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);background:#11182b;color:#eef3ff;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.btn.primary{border-color:var(--cyan);color:var(--cyan)}.btn.danger{border-color:#ff718c;color:#ff9aad}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;margin-top:16px}.card{border:1px solid var(--line);border-radius:14px;background:rgba(13,18,34,.92);padding:16px}.title{font:800 12px Orbitron;margin-bottom:12px;letter-spacing:.06em}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:12px;border:1px solid var(--line);border-radius:10px;text-align:center}.stat b{display:block;font:800 18px Orbitron;color:var(--cyan)}.stat span{font-size:9px;color:var(--muted);text-transform:uppercase}.topfriends{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.friend{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);border-radius:10px}.friend img{width:42px;height:42px;border-radius:50%;object-fit:cover}.friend b{font-size:10px}.friend small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.notice{padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:10px}.section-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.pill{padding:7px 10px;border-radius:999px;border:1px solid var(--line);font-size:9px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.topfriends{grid-template-columns:1fr}.identity{align-items:flex-start;flex-direction:column;gap:6px}.avatar{margin-top:-45px}}
.post{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;background:#0a0f1d}.post-head{display:flex;align-items:center;gap:9px}.post-head img{width:38px;height:38px;border-radius:50%;object-fit:cover}.post-head b{font-size:11px}.post-head small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.post-title{font:800 13px Orbitron;margin:12px 0 7px}.post-body{white-space:pre-wrap;color:#cdd6e8;font-size:11px;line-height:1.55}.post-actions{display:flex;gap:14px;margin-top:11px;color:var(--muted);font-size:9px}.post-actions span{cursor:default}.caw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.caw{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#090d18;color:#eef3ff;text-decoration:none}.caw img{width:100%;aspect-ratio:1.3;object-fit:cover;display:block}.caw div{padding:8px;font-size:9px;font-weight:800}.wall-tabs{display:flex;gap:6px;margin-bottom:10px}.wall-tab{cursor:pointer}.wall-tab.active{border-color:var(--cyan);color:var(--cyan)}.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.media-item{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#090d18;min-height:100px}.media-item img{width:100%;height:150px;object-fit:cover;display:block}.media-item .label{padding:7px;font-size:8px;color:#cdd6e8}.media-badge{position:absolute;top:7px;left:7px;padding:4px 6px;border-radius:999px;background:#070914cc;border:1px solid var(--line);font-size:7px;color:var(--cyan)}.media-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.media-tab{cursor:pointer}.media-tab.active{border-color:var(--cyan);color:var(--cyan)}
.activity{display:flex;flex-direction:column;gap:8px}.activity-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;background:#0a0f1d}.activity-icon{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;color:var(--cyan);font-size:13px;flex:none}.activity-item b{font-size:10px}.activity-item small{display:block;color:var(--muted);font-size:8px;margin-top:4px}.activity-item a{color:var(--cyan);text-decoration:none}.activity-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.activity-tab{cursor:pointer}.activity-tab.active{border-color:var(--cyan);color:var(--cyan)}
.people-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.person-card{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#0a0f1d}.person-card img{width:42px;height:42px;border-radius:50%;object-fit:cover}.person-card b{font-size:10px}.person-card small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.people-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.people-tab{cursor:pointer}.people-tab.active{border-color:var(--cyan);color:var(--cyan)}
.guestbook-form{display:flex;gap:8px;flex-direction:column;margin-bottom:12px}.guestbook-form textarea{width:100%;min-height:85px;resize:vertical;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:#080d19;color:#eef3ff;padding:10px;font:10px Montserrat,Arial}.guestbook-meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:8px}.guestbook-list{display:flex;flex-direction:column;gap:9px}.guest-entry{padding:11px;border:1px solid var(--line);border-radius:10px;background:#0a0f1d}.guest-head{display:flex;align-items:center;gap:9px}.guest-head img{width:34px;height:34px;border-radius:50%;object-fit:cover}.guest-head b{font-size:10px}.guest-head small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.guest-body{margin-top:8px;color:#cdd6e8;font-size:10px;line-height:1.5;white-space:pre-wrap}.guest-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--muted);font-size:7px}.guest-delete{cursor:pointer;color:#ff9aad}.guestbook-private{color:var(--muted);font-size:9px}
.studio-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.studio-field{display:flex;flex-direction:column;gap:5px}.studio-field label{font-size:8px;color:var(--muted);text-transform:uppercase;font-weight:800}.studio-field input,.studio-field textarea,.studio-field select{box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:9px;background:#080d19;color:#eef3ff;padding:9px;font:9px Montserrat,Arial}.studio-field textarea{min-height:75px;resize:vertical}.studio-wide{grid-column:1/-1}.theme-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.theme-choice{padding:10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;text-align:center;font-size:8px}.theme-choice.active{border-color:var(--cyan);color:var(--cyan)}.studio-preview{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--preview-bg,#0a0f1d)}.studio-preview b{font:800 12px Orbitron}.studio-note{font-size:8px;color:var(--muted);line-height:1.5}@media(max-width:760px){.studio-grid{grid-template-columns:1fr}.studio-wide{grid-column:auto}.theme-picker{grid-template-columns:repeat(2,1fr)}}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:10px}@media(max-width:760px){.caw-grid{grid-template-columns:1fr 1fr}}

<script src="crowspace-auth.js"></script><script src="crowspace-rebuild.js"></script><script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const av=u=>u||"https://ui-avatars.com/api/?background=10172c&color=78efff&name=Crow";
const client=()=>window.CrowSpaceAuth?.client;
let db,user,profiles=[],follows=[],friendships=[],blocks=[],topFriends=[],target,wallPosts=[],wallCaws=[],activity=[],guestbook=[],studioTheme="default",privacySettings={};
const qs=new URLSearchParams(location.search);
async function load(){
 db=client(); if(!db){$("#profile").innerHTML='<div class="notice">CrowSpace account services are unavailable.</div>';return}
 const auth=await db.auth.getUser(); user=auth.data.user;
 const requested=qs.get("u")||qs.get("id");
 let q=db.from("crowspace_profiles").select("user_id,username,display_name,bio,avatar_url,banner_url,creator_category,profile_theme,portfolio_tagline,portfolio_bio,portfolio_work_title,portfolio_collections_title,featured_caw_id,privacy_profile,privacy_posts,privacy_media,privacy_activity,privacy_connections,privacy_guestbook,privacy_messages,allow_guestbook,created_at");
 if(requested) q=q.eq("username",requested);
 else if(user) q=q.eq("user_id",user.id);
 const pr=await q.limit(1).maybeSingle(); target=pr.data; if(user&&target.user_id!==user.id&&window.CrowSpaceLearning?.record) window.CrowSpaceLearning.record("profile_visit",target.user_id,"profile",null,2);
 if(!target){$("#profile").innerHTML='<div class="notice">Profile not found.</div>';return} if(user&&target.user_id!==user.id) window.CrowSpaceLearning?.record?.("profile_visit",target.user_id,"profile",null,2)
 const [fr,fo,tf,bl,postRows,cawRows,likesMade,commentsMade,guest]=await Promise.all([
  db.from("member_friendships").select("*").or("requester_id.eq."+target.user_id+",addressee_id.eq."+target.user_id),
  db.from("crowspace_follows").select("follower_id,followed_user_id").or("follower_id.eq."+target.user_id+",followed_user_id.eq."+target.user_id),
  db.from("crowspace_top_friends").select("friend_id,position").eq("user_id",target.user_id).order("position").limit(10),
  user?db.from("member_blocks").select("id,blocker_id,blocked_id").or("blocker_id.eq."+user.id+",blocked_id.eq."+user.id):Promise.resolve({data:[]}),
  db.from("crowspace_posts").select("id,user_id,title,body,media_url,created_at,like_count,comment_count").eq("user_id",target.user_id).order("created_at",{ascending:false}).limit(500),
  db.from("crowspace_caws").select("id,user_id,title,thumbnail_url,created_at").eq("user_id",target.user_id).order("created_at",{ascending:false}).limit(6),
  db.from("crowspace_likes").select("id,post_id,user_id,created_at").eq("user_id",target.user_id).order("created_at",{ascending:false}).limit(100),
  db.from("crowspace_comments").select("id,post_id,user_id,body,created_at").eq("user_id",target.user_id).order("created_at",{ascending:false}).limit(100)
 ]);
 friendships=fr.data||[];follows=fo.data||[];topFriends=tf.data||[];blocks=bl.data||[];posts=postRows.data||[];caws=cawRows.data||[];guestbook=guest.data||[];
 const ids=[...new Set([...topFriends.map(x=>x.friend_id),...friendships.flatMap(x=>[x.requester_id,x.addressee_id]),...follows.map(x=>x.follower_id),...follows.map(x=>x.followed_user_id)].filter(x=>x&&x!==target.user_id))];
 if(ids.length){const pp=await db.from("crowspace_profiles").select("user_id,username,display_name,bio,avatar_url").in("user_id",ids);profiles=pp.data||[]}
 const guestIds=[...new Set(guestbook.map(x=>x.author_user_id).filter(Boolean))]; if(guestIds.length){const gp=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",guestIds); profiles=[...profiles,...(gp.data||[])].filter((p,i,a)=>a.findIndex(x=>x.user_id===p.user_id)===i)}
 wallPosts=posts;wallCaws=caws; activity=[];
 const lm=likesMade.data||[],cm=commentsMade.data||[];
 lm.forEach(x=>activity.push({type:"like",icon:"♥",date:x.created_at,post_id:x.post_id}));
 cm.forEach(x=>activity.push({type:"comment",icon:"💬",date:x.created_at,post_id:x.post_id,body:x.body}));
 posts.slice(0,100).forEach(x=>activity.push({type:"post",icon:"✦",date:x.created_at,post_id:x.id,title:x.title}));
 caws.slice(0,100).forEach(x=>activity.push({type:"caw",icon:"🐦",date:x.created_at,caw_id:x.id,title:x.title}));
 follows.filter(x=>x.follower_id===target.user_id).forEach(x=>activity.push({type:"follow",icon:"+",date:x.created_at,uid:x.followed_user_id}));
 friendships.filter(x=>x.requester_id===target.user_id||x.addressee_id===target.user_id).forEach(x=>activity.push({type:x.status==="accepted"?"friend":"request",icon:x.status==="accepted"?"👥":"↗",date:x.accepted_at||x.requested_at||x.created_at,uid:x.requester_id===target.user_id?x.addressee_id:x.requester_id,status:x.status}));
 activity.sort((a,b)=>new Date(b.date)-new Date(a.date)); render(posts,caws); setTimeout(()=>{showPeople("friends");showGuestbook();showStudio();const sc=$("#profileStudioCard");if(sc&&user?.id!==target.user_id)sc.hidden=true;showMedia("all");showActivity("all")},0)
}
const $=s=>document.querySelector(s);
function profile(id){return"index.html"} 
function friend(){return friendships.find(x=>(x.requester_id===user?.id&&x.addressee_id===target.user_id)||(x.requester_id===target.user_id&&x.addressee_id===user?.id))}
async function action(type){
 if(!user||user.id===target.user_id)return;
 const f=friend();let r;
 if(type==="request"&&!f)r=await db.from("member_friendships").insert({requester_id:user.id,addressee_id:target.user_id,status:"pending"});
 if(type==="accept"&&f?.status==="pending"&&f.addressee_id===user.id)r=await db.from("member_friendships").update({status:"accepted",accepted_at:new Date().toISOString(),rejected_at:null,cancelled_at:null}).eq("id",f.id);
 if(type==="decline"&&f?.status==="pending"&&f.addressee_id===user.id)r=await db.from("member_friendships").update({status:"rejected",rejected_at:new Date().toISOString()}).eq("id",f.id);
 if(type==="cancel"&&f?.status==="pending"&&f.requester_id===user.id)r=await db.from("member_friendships").update({status:"cancelled",cancelled_at:new Date().toISOString()}).eq("id",f.id);
 if(type==="remove"&&f?.status==="accepted")r=await db.from("member_friendships").delete().eq("id",f.id);
 if(type==="block"){r=await db.from("member_blocks").insert({blocker_id:user.id,blocked_id:target.user_id})}
 if(type==="unblock"){const b=blocks.find(x=>x.blocker_id===user.id&&x.blocked_id===target.user_id);if(b)r=await db.from("member_blocks").delete().eq("id",b.id)}
 if(type==="follow"){r=await db.from("crowspace_follows").insert({follower_id:user.id,followed_user_id:target.user_id});if(!r.error)window.CrowSpaceLearning?.record?.("follow",target.user_id,"profile",null,5)}
 if(type==="unfollow"){r=await db.from("crowspace_follows").delete().eq("follower_id",user.id).eq("followed_user_id",target.user_id)}
 if(r?.error)alert(r.error.message);else load();
}
function showStudio(){
 const box=$("#studioContent"),card=$("#profileStudioCard"); if(!box||!card)return;
 if(!user||user.id!==target.user_id){card.hidden=true;return} card.hidden=false;
 const opts=(v)=>['public','members','friends','private'].map(x=>'<option value="'+x+'" '+(v===x?'selected':'')+'>'+({public:'Everyone',members:'CrowSpace Members',friends:'Friends',private:'Only Me'}[x])+'</option>').join('');
 box.innerHTML='<div class="studio-grid"><div class="studio-field"><label>Display Name</label><input id="studioDisplay" value="'+esc(target.display_name||'')+'"></div><div class="studio-field"><label>Avatar URL</label><input id="studioAvatar" value="'+esc(target.avatar_url||'')+'"></div><div class="studio-field studio-wide"><label>Bio</label><textarea id="studioBio">'+esc(target.bio||'')+'</textarea></div><div class="studio-wide studio-note"><b>PRIVACY & PERMISSIONS</b><br>These controls are enforced by Supabase Row Level Security across CrowSpace.</div><div class="studio-field"><label>Profile</label><select id="privacyProfile">'+opts(target.privacy_profile||'public')+'</select></div><div class="studio-field"><label>Posts</label><select id="privacyPosts">'+opts(target.privacy_posts||'public')+'</select></div><div class="studio-field"><label>Media & Caws</label><select id="privacyMedia">'+opts(target.privacy_media||'public')+'</select></div><div class="studio-field"><label>Activity</label><select id="privacyActivity">'+opts(target.privacy_activity||'friends')+'</select></div><div class="studio-field"><label>Connections</label><select id="privacyConnections">'+opts(target.privacy_connections||'public')+'</select></div><div class="studio-field"><label>Guestbook</label><select id="privacyGuestbook">'+opts(target.privacy_guestbook||'members')+'</select></div><div class="studio-field"><label>Messages</label><select id="privacyMessages">'+opts(target.privacy_messages||'friends')+'</select></div><div class="studio-field"><label>Visitor Messages</label><select id="allowGuestbook"><option value="true" '+(target.allow_guestbook!==false?'selected':'')+'>Allowed</option><option value="false" '+(target.allow_guestbook===false?'selected':'')+'>Disabled</option></select></div></div><div class="actions"><button class="btn primary" onclick="savePrivacy()">Save Privacy Settings</button></div>';
}
async function savePrivacy(){
 if(!user||user.id!==target.user_id)return;
 const payload={display_name:$("#studioDisplay")?.value?.trim()||target.display_name,bio:$("#studioBio")?.value||target.bio,avatar_url:$("#studioAvatar")?.value?.trim()||target.avatar_url,privacy_profile:$("#privacyProfile").value,privacy_posts:$("#privacyPosts").value,privacy_media:$("#privacyMedia").value,privacy_activity:$("#privacyActivity").value,privacy_connections:$("#privacyConnections").value,privacy_guestbook:$("#privacyGuestbook").value,privacy_messages:$("#privacyMessages").value,allow_guestbook:$("#allowGuestbook").value==="true"};
 const r=await db.from("crowspace_profiles").update(payload).eq("user_id",user.id);
 if(r.error){alert(r.error.message);return} Object.assign(target,payload); alert("Privacy settings saved."); load();
}
function render(posts,caws){
 const viewerCanSee=user?.id===target.user_id||!blocks.some(x=>x.blocker_id===user?.id&&x.blocked_id===target.user_id)&&!blocks.some(x=>x.blocker_id===target.user_id&&x.blocked_id===user?.id);

 const f=friend(),following=follows.some(x=>x.follower_id===user?.id&&x.followed_user_id===target.user_id),followers=follows.filter(x=>x.followed_user_id===target.user_id).length,followingCount=follows.filter(x=>x.follower_id===target.user_id).length;
 const isBlocked=blocks.some(x=>x.blocker_id===user?.id&&x.blocked_id===target.user_id);
 const friendIds=new Set(friendships.filter(x=>x.status==="accepted").flatMap(x=>[x.requester_id,x.addressee_id]).filter(x=>x!==target.user_id));
 const mutual=new Set(follows.filter(x=>x.follower_id===user?.id&&x.followed_user_id!==target.user_id).map(x=>x.followed_user_id));
 const mutualCount=[...friendIds].filter(x=>mutual.has(x)).length;
 let primary=user?.id===target.user_id?'<span class="pill">This is your profile</span>':isBlocked?'<button class="btn" onclick="action(\'unblock\')">Unblock</button>':f?.status==="accepted"?'<button class="btn primary" onclick="action(\'remove\')">Friends</button>':f?.status==="pending"?(f.requester_id===user.id?'<button class="btn" onclick="action(\'cancel\')">Request Sent</button>':'<button class="btn primary" onclick="action(\'accept\')">Accept Friend Request</button>'):'<button class="btn primary" onclick="action(\'request\')">Add Friend</button>';
 if(user?.id!==target.user_id&&!isBlocked)primary+='<button class="btn" onclick="action(\''+(following?"unfollow":"follow")+'\')">'+(following?"Following":"Follow")+'</button><button class="btn danger" onclick="action(\'block\')">Block</button>';
 const friendCards=topFriends.map(x=>profiles.find(p=>p.user_id===x.friend_id)).filter(Boolean).map(p=>'<a class="friend" href="profile.html?u='+encodeURIComponent(p.username||"")+'"><img src="'+esc(av(p.avatar_url))+'"><div><b>'+esc(p.display_name||p.username||"Member")+'</b><small>@'+esc(p.username||"member")+'</small></div></a>').join("");

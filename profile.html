<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace — Profile</title><link rel="stylesheet" href="style.css"></head><body><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><header class="topbar"><a class="brand" href="home.html"><span class="brand-mark">◉</span><span>CROW<span>SPACE</span></span></a><div class="search"><span>⌕</span><input placeholder="Search CrowSpace"></div><nav class="top-actions"><button>🔔</button><button>✉</button><a class="avatar" href="profile.html">JR</a></nav></header><div class="shell"><aside class="sidebar"><a class="nav" href="home.html"><span>⌂</span> Home</a><a class="nav" href="explore.html"><span>⌕</span> Explore</a><a class="nav" href="caws.html"><span>▶</span> Caws</a><a class="nav" href="circles.html"><span>◈</span> Circles</a><a class="nav" href="notifications.html"><span>♢</span> Notifications</a><a class="nav" href="messages.html"><span>✉</span> Messages</a><a class="nav active" href="profile.html"><span>●</span> Profile</a></aside><main class="feed"><section class="profile-hero card"><div class="profile-cover"></div><div class="profile-main"><div id="profileAvatar" class="avatar profile-avatar">CM</div><div class="profile-info"><h1 id="profileName">Crow Member</h1><span id="profileHandle">@member</span><p id="profileBio">Welcome to your CrowSpace profile.</p><div class="profile-stats"><b id="followingCount">0 <small>Following</small></b><b id="followerCount">0 <small>Followers</small></b><b id="postCount">0 <small>Posts</small></b></div></div><button id="editProfile" class="post-button">Edit Profile</button></div></section><div class="feed-tabs"><button class="selected">Posts</button><button>Caws</button><button>Media</button></div><section id="profilePosts"></section></main></div><script src="crowspace-core.js"></script><script src="crowspace-auth.js"></script><script src="crowspace-social.js"></script><script>
(async function(){
 try{
  const db=await window.CrowSpaceAuth.ready;const {data:{user}}=await db.auth.getUser();if(!user){location.href="login.html?next=profile.html";return}
  const p=await db.from("crowspace_profiles").select("*").eq("user_id",user.id).maybeSingle();if(p.error)throw p.error;
  const profile=p.data||{};const name=profile.display_name||profile.username||user.email?.split("@")[0]||"Crow Member";
  document.getElementById("profileName").textContent=name;document.getElementById("profileHandle").textContent=profile.username?"@"+profile.username:"@member";document.getElementById("profileBio").textContent=profile.bio||"Welcome to your CrowSpace profile.";
  if(profile.avatar_url)document.getElementById("profileAvatar").innerHTML='<img src="'+String(profile.avatar_url).replace(/"/g,"&quot;")+'" alt="">';
  const followIn=await db.from("crowspace_follows").select("*",{count:"exact",head:true}).eq("followed_user_id",user.id);const followOut=await db.from("crowspace_follows").select("*",{count:"exact",head:true}).eq("follower_id",user.id);document.getElementById("followingCount").innerHTML=(followOut.count||0)+' <small>Following</small>';document.getElementById("followerCount").innerHTML=(followIn.count||0)+' <small>Followers</small>';
  const posts=await db.from("crowspace_posts").select("id,body,created_at,like_count,comment_count").eq("user_id",user.id).order("created_at",{ascending:false}).limit(30);if(posts.error)throw posts.error;
  document.getElementById("postCount").innerHTML=(posts.data?.length||0)+' <small>Posts</small>';
  document.getElementById("profilePosts").innerHTML=(posts.data||[]).map(x=>'<section class="card panel"><div class="post-body">'+String(x.body).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))+'</div><div class="post-actions"><button>♡ '+(x.like_count||0)+'</button><button>💬 '+(x.comment_count||0)+'</button><button>↗ Share</button></div></section>').join("")||'<section class="card panel">No posts yet.</section>';
  document.getElementById("editProfile").onclick=async()=>{const display=prompt("Display name:",name);if(display===null)return;const bio=prompt("Bio:",profile.bio||"");if(bio===null)return;const username=prompt("Username:",profile.username||"");if(username===null)return;const r=await db.from("crowspace_profiles").update({display_name:display.trim(),bio:bio.trim(),username:username.trim()}).eq("user_id",user.id);if(r.error)alert(r.error.message);else location.reload()};
 }catch(e){console.error(e);document.querySelector(".feed").insertAdjacentHTML("afterbegin",'<section class="card panel">Unable to load your CrowSpace profile: '+String(e.message||e)+'</section>')}
})();
</script></body></html>

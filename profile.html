<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070914">
<title>CrowSpace — Profile</title>
<link rel="stylesheet" href="crowspace-rebuild.css">
<link rel="stylesheet" href="crowspace-universal.css">
<style>
:root{--bg:#070914;--card:#0d1222;--line:#27314b;--text:#eef3ff;--muted:#8e9ab5;--cyan:#78efff;--purple:#b58cff;--danger:#ff718c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#151d38 0,#070914 48%);color:var(--text);font-family:Montserrat,Arial,sans-serif}.profile-wrap{max-width:1120px;margin:34px auto;padding:0 18px}.state{padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:center;color:var(--muted)}.hero,.card{border:1px solid var(--line);border-radius:16px;background:rgba(13,18,34,.94);overflow:hidden}.banner{height:240px;background:linear-gradient(135deg,#10172c,#211443);background-size:cover;background-position:center}.hero-body{padding:0 24px 24px}.identity{display:flex;gap:18px;align-items:flex-end}.avatar{width:128px;height:128px;margin-top:-64px;border-radius:50%;object-fit:cover;background:#10172c;border:5px solid #070914}.identity h1{margin:0;font:800 26px Orbitron,Arial}.handle{margin-top:5px;color:var(--muted);font-size:11px}.bio{max-width:760px;color:#cbd4e6;line-height:1.6;font-size:12px;margin:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#11182b;color:var(--text);border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{border-color:var(--cyan);color:var(--cyan)}.btn.danger{border-color:var(--danger);color:#ff9aad}.btn:disabled{opacity:.5;cursor:wait}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:13px;border:1px solid var(--line);border-radius:10px;text-align:center}.stat b{display:block;font:800 19px Orbitron;color:var(--cyan)}.stat span{font-size:9px;color:var(--muted);text-transform:uppercase}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-top:16px}.card{padding:16px;overflow:visible}.title{font:800 12px Orbitron;letter-spacing:.06em;margin-bottom:12px}.notice,.empty{padding:13px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:10px;line-height:1.5}.people,.posts{display:flex;flex-direction:column;gap:9px}.person,.post{display:flex;gap:10px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0a0f1d}.person img{width:44px;height:44px;border-radius:50%;object-fit:cover}.person b,.post b{font-size:10px}.person small,.post small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.post{display:block}.post-body{margin-top:8px;color:#cdd6e8;font-size:10px;line-height:1.55;white-space:pre-wrap}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.pill{padding:7px 10px;border-radius:999px;border:1px solid var(--line);font-size:9px;color:var(--muted);cursor:pointer}.pill.active{border-color:var(--cyan);color:var(--cyan)}.studio{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.wide{grid-column:1/-1}.field label{font-size:8px;color:var(--muted);font-weight:800;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;background:#080d19;color:var(--text);padding:9px;font:9px Montserrat,Arial}.field textarea{min-height:85px;resize:vertical}.avatar-upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.avatar-preview{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan);background:#10172c}.upload-note{font-size:8px;color:var(--muted)}.guest{display:flex;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#0a0f1d}.guest img{width:36px;height:36px;border-radius:50%;object-fit:cover}.guest-body{font-size:10px;line-height:1.5;color:#cdd6e8;margin-top:5px}.toast{position:fixed;right:18px;bottom:18px;z-index:9999;padding:12px 15px;border:1px solid var(--cyan);border-radius:10px;background:#0b1020;color:var(--text);font-size:10px;box-shadow:0 10px 35px #0008}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.identity{align-items:flex-start;flex-direction:column;gap:8px}.avatar{margin-top:-48px}.studio{grid-template-columns:1fr}.field.wide{grid-column:auto}.banner{height:190px}}
</style>
<script src="crowspace-auth.js"></script>
<script src="crowspace-rebuild.js" defer></script>
<script src="crowspace-universal.js" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=1" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
</head>
<body data-page="profile">
<main class="profile-wrap"><div id="app" class="state">Connecting to CrowSpace…</div></main>
<script>
(function(){
"use strict";
const qs=new URLSearchParams(location.search);
let db=null,me=null,target=null,relationship=null,profiles=new Map(),posts=[],caws=[],followers=[],following=[],friends=[],guestbook=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const avatar=u=>u||"https://ui-avatars.com/api/?background=10172c&color=78efff&name=Crow";
const safe=async(fn,fallback=[])=>{try{const r=await fn();return r}catch(e){console.warn("[CrowSpace profile]",e);return fallback}};
function toast(msg){const x=document.createElement("div");x.className="toast";x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),3000)}
function profileHref(p){return "profile.html?u="+encodeURIComponent(p.username||p.user_id)}
async function getProfile(){
 const value=qs.get("u")||qs.get("id")||qs.get("user");
 let q=db.from("crowspace_profiles").select("*");
 if(value) q=/^[0-9a-f-]{36}$/i.test(value)?q.eq("user_id",value):q.eq("username",value);
 else if(me) q=q.eq("user_id",me.id); else return null;
 return (await q.limit(1).maybeSingle()).data||null;
}
async function load(){
 try{
  await window.CrowSpaceAuth.ready;
  db=window.CrowSpaceAuth.client; me=window.CrowSpaceAuth.user;
  if(!db) throw new Error("Supabase client unavailable");
  if(me) await safe(()=>window.CrowSpaceAuth.ensureProfile(me),null);
  target=await getProfile();
  if(!target){$("app").innerHTML='<div class="state">Profile not found.</div>';return}
  await Promise.all([loadSocial(),loadContent(),loadGuestbook()]);
  render();
  startRealtime();
 }catch(e){console.error(e);$("app").innerHTML='<div class="state">CrowSpace could not connect to Supabase.<br><br><small>'+esc(e.message||e)+'</small></div>'}
}
async function loadSocial(){
 const uid=target.user_id;
 const [fo,fi,fr]=await Promise.all([
  safe(()=>db.from("crowspace_follows").select("follower_id,followed_user_id,created_at").eq("followed_user_id",uid)),
  safe(()=>db.from("crowspace_follows").select("follower_id,followed_user_id,created_at").eq("follower_id",uid)),
  safe(()=>db.from("member_friendships").select("*").or("requester_id.eq."+uid+",addressee_id.eq."+uid))
 ]);
 followers=fo.data||[];following=fi.data||[];friends=(fr.data||[]).filter(x=>x.status==="accepted");
 if(me&&me.id!==uid){
  relationship=await safe(async()=>{
   const [a,b,c]=await Promise.all([
    db.from("crowspace_follows").select("follower_id").eq("follower_id",me.id).eq("followed_user_id",uid).maybeSingle(),
    db.from("crowspace_follows").select("follower_id").eq("follower_id",uid).eq("followed_user_id",me.id).maybeSingle(),
    db.from("member_friendships").select("*").or("and(requester_id.eq."+me.id+",addressee_id.eq."+uid+"),and(requester_id.eq."+uid+",addressee_id.eq."+me.id+")").maybeSingle()
   ]);return {following:!!a.data,followsYou:!!b.data,friendship:c.data||null}
  },{following:false,followsYou:false,friendship:null});
 }
 const ids=[...new Set([...followers.map(x=>x.follower_id),...following.map(x=>x.followed_user_id),...friends.flatMap(x=>[x.requester_id,x.addressee_id])])].filter(x=>x!==uid);
 if(ids.length){const r=await safe(()=>db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url,bio").in("user_id",ids));(r.data||[]).forEach(p=>profiles.set(p.user_id,p))}
}
async function loadContent(){
 const uid=target.user_id;
 const [p,c]=await Promise.all([
  safe(()=>db.from("crowspace_posts").select("id,user_id,title,body,media_url,created_at,like_count,comment_count").eq("user_id",uid).order("created_at",{ascending:false}).limit(50)),
  safe(()=>db.from("crowspace_caws").select("id,user_id,title,thumbnail_url,created_at").eq("user_id",uid).order("created_at",{ascending:false}).limit(20))
 ]);
 posts=p.data||[];caws=c.data||[];
}
async function loadGuestbook(){
 const r=await safe(()=>db.from("crowspace_guestbook").select("*").eq("profile_id",target.user_id).order("created_at",{ascending:false}).limit(50));
 guestbook=r.data||[];
 const ids=[...new Set(guestbook.map(x=>x.author_id).filter(Boolean))];
 if(ids.length){const p=await safe(()=>db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids));(p.data||[]).forEach(x=>profiles.set(x.user_id,x))}
}
function connectionButtons(){
 if(!me)return '<a class="btn primary" href="login.html">Log in to connect</a>';
 if(me.id===target.user_id)return '<span class="pill active">Your profile</span>';
 const f=relationship?.friendship;let html="";
 if(relationship?.following)html+='<button class="btn" data-action="unfollow">Following</button>';else html+='<button class="btn primary" data-action="follow">Follow</button>';
 if(f?.status==="accepted")html+='<button class="btn" data-action="remove-friend">Friends</button>';
 else if(f?.status==="pending"&&f.addressee_id===me.id)html+='<button class="btn primary" data-action="accept-friend">Accept Friend</button>';
 else if(f?.status==="pending")html+='<button class="btn" disabled>Request Sent</button>';
 else html+='<button class="btn" data-action="friend">Add Friend</button>';
 html+='<button class="btn danger" data-action="block">Block</button>';
 return html;
}
function render(){
 const self=me?.id===target.user_id;
 $("app").innerHTML='<section class="hero"><div class="banner" id="banner"></div><div class="hero-body"><div class="identity"><img class="avatar" src="'+esc(avatar(target.avatar_url))+'"><div><h1>'+esc(target.display_name||target.username||"CrowSpace Member")+'</h1><div class="handle">@'+esc(target.username||"member")+' · '+esc(target.creator_category||"member")+'</div></div></div><p class="bio">'+esc(target.bio||target.portfolio_bio||"Welcome to my CrowSpace profile.")+'</p><div class="actions">'+connectionButtons()+'</div></div></section>'+
 '<section class="card" style="margin-top:16px"><div class="title">CROWSPACE CONNECTIONS</div><div class="stats"><div class="stat"><b>'+friends.length+'</b><span>Friends</span></div><div class="stat"><b>'+followers.length+'</b><span>Followers</span></div><div class="stat"><b>'+following.length+'</b><span>Following</span></div><div class="stat"><b>'+posts.length+'</b><span>Posts</span></div></div></section>'+
 (self?studioHtml():"")+
 '<div class="grid"><div>'+
 '<section class="card"><div class="title">PEOPLE & CONNECTIONS</div><div class="tabs"><span class="pill active" data-people="friends">Friends</span><span class="pill" data-people="followers">Followers</span><span class="pill" data-people="following">Following</span></div><div id="people"></div></section>'+
 '<section class="card" style="margin-top:16px"><div class="title">PROFILE WALL</div><div class="tabs"><span class="pill active" data-wall="posts">Posts</span><span class="pill" data-wall="caws">Caws</span></div><div id="wall"></div></section>'+
 '<section class="card" style="margin-top:16px"><div class="title">PROFILE GUESTBOOK</div><div id="guestbook"></div></section>'+
 '</div><aside>'+
 '<section class="card"><div class="title">SOCIAL STATUS</div><div class="notice">'+(self?"This is your CrowSpace profile. Changes saved here sync to Supabase.":(relationship?.followsYou?"This member follows you. ":"")+(relationship?.following?"You follow this member.":"Connect through CrowSpace."))+'</div></section>'+
 '<section class="card" style="margin-top:16px"><div class="title">FEATURED WORK</div><div class="notice"><b>'+esc(target.portfolio_work_title||"My Work")+'</b><br><br>'+esc(target.portfolio_collections_title||"Collections")+'</div></section>'+
 '</aside></div>';
 const b=$("banner");if(target.banner_url)b.style.backgroundImage="url('"+esc(target.banner_url)+"')";
 bind();showPeople("friends");showWall("posts");showGuestbook();
}
function studioHtml(){
 const val=x=>esc(target[x]||"");
 const opt=(x,d)=>["public","members","friends","private"].map(v=>'<option value="'+v+'" '+((target[x]||d)===v?"selected":"")+'>'+({public:"Everyone",members:"Members",friends:"Friends",private:"Only Me"}[v])+'</option>').join("");
 return '<section class="card" style="margin-top:16px"><div class="title">PROFILE STUDIO · SUPABASE</div><div class="studio"><div class="field"><label>Display Name</label><input id="sDisplay" value="'+val("display_name")+'"></div><div class="field"><label>Avatar URL</label><input id="sAvatar" value="'+val("avatar_url")+'"></div><div class="field wide"><label>Bio</label><textarea id="sBio">'+val("bio")+'</textarea></div><div class="field"><label>Profile Privacy</label><select id="sProfile">'+opt("privacy_profile","public")+'</select></div><div class="field"><label>Posts Privacy</label><select id="sPosts">'+opt("privacy_posts","public")+'</select></div><div class="field"><label>Media Privacy</label><select id="sMedia">'+opt("privacy_media","public")+'</select></div><div class="field"><label>Activity Privacy</label><select id="sActivity">'+opt("privacy_activity","friends")+'</select></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="saveProfile">Save Profile</button></div></section>';
}
function bind(){
 document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.action,b)));
 document.querySelectorAll("[data-people]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-people]").forEach(x=>x.classList.remove("active"));b.classList.add("active");showPeople(b.dataset.people)}));
 document.querySelectorAll("[data-wall]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-wall]").forEach(x=>x.classList.remove("active"));b.classList.add("active");showWall(b.dataset.wall)}));
 $("saveProfile")?.addEventListener("click",saveProfile);\n $("sAvatarFile")?.addEventListener("change",previewAvatar);
}
async function act(type,button){
 if(!me||!target||me.id===target.user_id)return;
 button.disabled=true;let r;
 if(type==="follow")r=await db.from("crowspace_follows").insert({follower_id:me.id,followed_user_id:target.user_id});
 if(type==="unfollow")r=await db.from("crowspace_follows").delete().eq("follower_id",me.id).eq("followed_user_id",target.user_id);
 if(type==="friend")r=await db.from("member_friendships").insert({requester_id:me.id,addressee_id:target.user_id,status:"pending"});
 if(type==="accept-friend"&&relationship?.friendship)r=await db.from("member_friendships").update({status:"accepted",accepted_at:new Date().toISOString()}).eq("id",relationship.friendship.id);
 if(type==="remove-friend"&&relationship?.friendship)r=await db.from("member_friendships").delete().eq("id",relationship.friendship.id);
 if(type==="block")r=await db.from("member_blocks").insert({blocker_id:me.id,blocked_id:target.user_id});
 if(r?.error){toast(r.error.message);button.disabled=false;return}
 toast("CrowSpace connection updated");await load();
}
async function saveProfile(){
 const payload={display_name:$("sDisplay").value.trim(),avatar_url:$("sAvatar").value.trim(),bio:$("sBio").value,privacy_profile:$("sProfile").value,privacy_posts:$("sPosts").value,privacy_media:$("sMedia").value,privacy_activity:$("sActivity").value};
 const r=await db.from("crowspace_profiles").update(payload).eq("user_id",me.id);
 if(r.error){toast(r.error.message);return}Object.assign(target,payload);toast("Profile saved to Supabase");render();
}
function showPeople(kind){
 const box=$("people");let ids=[];
 if(kind==="friends")ids=friends.flatMap(x=>[x.requester_id,x.addressee_id]).filter(x=>x!==target.user_id);
 if(kind==="followers")ids=followers.map(x=>x.follower_id);
 if(kind==="following")ids=following.map(x=>x.followed_user_id);
 ids=[...new Set(ids)];box.innerHTML=ids.length?'<div class="people">'+ids.map(id=>{const p=profiles.get(id);return p?'<a class="person" href="'+profileHref(p)+'"><img src="'+esc(avatar(p.avatar_url))+'"><div><b>'+esc(p.display_name||p.username||"Member")+'</b><small>@'+esc(p.username||"member")+'</small></div></a>':""}).join("")+'</div>':'<div class="empty">No connections to display.</div>';
}
function showWall(kind){
 const box=$("wall");
 if(kind==="posts"){box.innerHTML=posts.length?'<div class="posts">'+posts.map(p=>'<article class="post"><b>'+esc(p.title||"CrowSpace Post")+'</b><small>'+new Date(p.created_at).toLocaleString()+'</small><div class="post-body">'+esc(p.body||"")+'</div></article>').join("")+'</div>':'<div class="empty">No posts yet.</div>'}
 else {box.innerHTML=caws.length?'<div class="posts">'+caws.map(c=>'<article class="post"><b>'+esc(c.title||"Caw")+'</b><small>'+new Date(c.created_at).toLocaleString()+'</small></article>').join("")+'</div>':'<div class="empty">No Caws yet.</div>'}
}
function showGuestbook(){
 const box=$("guestbook");if(!box)return;
 const canWrite=me&&me.id!==target.user_id&&target.allow_guestbook!==false;
 let form=canWrite?'<div class="field" style="margin-bottom:12px"><textarea id="guestText" placeholder="Leave a message…"></textarea><button class="btn primary" id="guestSend">Sign Guestbook</button></div>':"";
 box.innerHTML=form+(guestbook.length?guestbook.map(g=>{const p=profiles.get(g.author_id)||{};return '<div class="guest" style="margin-top:8px"><img src="'+esc(avatar(p.avatar_url))+'"><div><b>'+esc(p.display_name||p.username||"Member")+'</b><small> · '+new Date(g.created_at).toLocaleString()+'</small><div class="guest-body">'+esc(g.body||g.message||"")+'</div></div></div>'}).join(""):'<div class="empty">No guestbook messages yet.</div>');
 $("guestSend")?.addEventListener("click",async()=>{const body=$("guestText").value.trim();if(!body)return;const r=await db.from("crowspace_guestbook").insert({profile_id:target.user_id,author_id:me.id,body});if(r.error){toast(r.error.message);return}toast("Guestbook message posted");await load()});
}
let realtimeChannel=null,realtimeRefreshTimer=null;
function queueRealtimeRefresh(reason){
  clearTimeout(realtimeRefreshTimer);
  realtimeRefreshTimer=setTimeout(async()=>{try{await load();toast("Live profile updated");}catch(e){console.warn("[CrowSpace realtime]",reason,e)}},180);
}
function startRealtime(){
  if(!db||!target||realtimeChannel)return;
  const uid=target.user_id;
  realtimeChannel=db.channel("crowspace-profile-realtime-"+uid);
  realtimeChannel
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_profiles",filter:"user_id=eq."+uid},p=>{if(p.eventType==="UPDATE"){target=Object.assign({},target,p.new);queueRealtimeRefresh("profile")}})
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_follows",filter:"followed_user_id=eq."+uid},()=>queueRealtimeRefresh("followers"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_follows",filter:"follower_id=eq."+uid},()=>queueRealtimeRefresh("following"))
    .on("postgres_changes",{event:"*",schema:"public",table:"member_friendships",filter:"requester_id=eq."+uid},()=>queueRealtimeRefresh("friendships"))
    .on("postgres_changes",{event:"*",schema:"public",table:"member_friendships",filter:"addressee_id=eq."+uid},()=>queueRealtimeRefresh("friendships"))
    .on("postgres_changes",{event:"*",schema:"public",table:"member_blocks",filter:"blocker_id=eq."+uid},()=>queueRealtimeRefresh("blocks"))
    .on("postgres_changes",{event:"*",schema:"public",table:"member_blocks",filter:"blocked_id=eq."+uid},()=>queueRealtimeRefresh("blocks"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_posts",filter:"user_id=eq."+uid},()=>queueRealtimeRefresh("posts"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_caws",filter:"user_id=eq."+uid},()=>queueRealtimeRefresh("caws"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_guestbook",filter:"profile_id=eq."+uid},()=>queueRealtimeRefresh("guestbook"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_notifications",filter:"user_id=eq."+uid},()=>{queueRealtimeRefresh("notifications");document.dispatchEvent(new CustomEvent("crowspace-notification-live"))})
    .subscribe((status,error)=>{
      if(status==="SUBSCRIBED") document.body.dataset.realtime="connected";
      if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){document.body.dataset.realtime="error";console.error("[CrowSpace realtime]",status,error)}
    });
}
function stopRealtime(){if(realtimeChannel&&db){db.removeChannel(realtimeChannel);realtimeChannel=null}}
window.addEventListener("beforeunload",stopRealtime);
window.addEventListener("crowspace:supabase-ready",load);
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",load);else load();
})();
</script>
</body>
</html>

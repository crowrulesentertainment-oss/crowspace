<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace — Profile</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
.profileCard{padding:34px;max-width:900px;margin:auto}.profileHero{display:flex;gap:24px;align-items:center}.avatar{width:104px;height:104px;border:1px solid var(--cyan);border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#0a1018;color:var(--cyan);font:800 34px Orbitron}.avatar img{width:100%;height:100%;object-fit:cover}.profileName{font:800 30px Orbitron;margin:0}.handle{color:var(--cyan);margin:8px 0}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--purple);font:700 9px Orbitron;letter-spacing:1px}.bio{color:var(--muted);line-height:1.75;margin:25px 0}.stats{display:flex;gap:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}.stat strong{font:700 18px Orbitron}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.panel{margin-top:22px;padding:22px;border:1px solid var(--line);border-radius:14px;background:#080b12}.panel h2{font:700 16px Orbitron;margin:0 0 18px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font:700 10px Orbitron;color:var(--muted);letter-spacing:1px}.field input,.field textarea{width:100%;background:#05070c;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:12px;font:inherit;outline:none}.field textarea{min-height:110px;resize:vertical}.profileActions{display:flex;gap:10px;margin-top:15px}.notice{color:var(--muted);font-size:13px;min-height:20px}.post{padding:18px 0;border-bottom:1px solid var(--line)}.post:last-child{border-bottom:0}.postTime{color:var(--muted);font-size:11px}.postBody{line-height:1.7;margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.empty{color:var(--muted);padding:15px 0}@media(max-width:650px){.profileHero{align-items:flex-start}.formGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.profileCard{padding:24px}.profileName{font-size:23px}.avatar{width:82px;height:82px}}
</style></head><body><div class="scanlines"></div><header class="topbar"><a class="brand" href="index.html"><span class="mark">C</span><span>CROW<span>SPACE</span></span></a><nav><a href="index.html">Feed</a><a href="discover.html">Discover</a><a class="active" href="profile.html">Profile</a></nav><div class="account"><span id="memberState">CONNECTING…</span><button id="authBtn">Sign In</button></div></header><main class="shell"><section class="card profileCard"><div class="eyebrow">CROWSPACE PROFILE</div><div id="profile"><h1 style="font-family:Orbitron">Loading profile…</h1></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const fmt=d=>new Date(d).toLocaleString([],{dateStyle:"medium",timeStyle:"short"});let currentUser=null,viewingUserId=null;
async function loadProfile(){const box=$("profile"),{data:{session}}=await db.auth.getSession(),requested=new URLSearchParams(location.search).get("u");if(!session&&!requested){box.innerHTML="<h1 style='font-family:Orbitron'>SIGN IN REQUIRED</h1><p class='notice'>Connect your universal CrowRules account to open CrowSpace.</p><a class='btn primary' href='login.html'>CONNECT ACCOUNT</a>";return}currentUser=session?.user||null;const targetId=requested||currentUser?.id;if(!targetId){box.innerHTML="<h1>PROFILE NOT FOUND</h1>";return}viewingUserId=targetId;if(currentUser&&targetId===currentUser.id)await ensureProfile(currentUser);const [pr,po,mm]=await Promise.all([db.from("crowspace_profiles").select("*").eq("user_id",targetId).maybeSingle(),db.from("crowspace_posts").select("id,body,created_at").eq("user_id",targetId).order("created_at",{ascending:false}).limit(50),targetId===currentUser?.id?db.from("crowspace_memberships").select("status").eq("user_id",targetId).maybeSingle():Promise.resolve({data:null,error:null})]);const p=pr.data,posts=po.data||[],m=mm.data,isOwn=!!currentUser&&targetId===currentUser.id;const [fc,tc]=await Promise.all([db.from("crowspace_follows").select("follower_id",{count:"exact",head:true}).eq("followed_user_id",targetId),db.from("crowspace_follows").select("followed_user_id",{count:"exact",head:true}).eq("follower_id",targetId)]);let following=false;if(currentUser&&!isOwn){const {data:f}=await db.from("crowspace_follows").select("follower_id").eq("follower_id",currentUser.id).eq("followed_user_id",targetId).maybeSingle();following=!!f}if(pr.error||!p){box.innerHTML="<h1 style='font-family:Orbitron'>PROFILE NOT FOUND</h1><p class='notice'>This CrowSpace profile does not exist or is unavailable.</p><a class='btn ghost' href='index.html'>BACK TO FEED</a>";return}const name=p.display_name||p.username||"Crow",avatar=p.avatar_url?"<img src='"+esc(p.avatar_url)+"' alt='Profile avatar' onerror='this.remove()'>":esc(name.charAt(0).toUpperCase()),status=m?.status?m.status.toUpperCase():"CONNECTED";document.title="CrowSpace — "+name;box.innerHTML="<div class='profileHero'><div class='avatar'>"+avatar+"</div><div><h1 class='profileName'>"+esc(name)+"</h1><p class='handle'>@"+esc(p.username||"crow")+"</p>"+(isOwn?"<span class='badge'>UNIVERSAL "+esc(status)+"</span>":"")+"</div></div><p class='bio'>"+esc(p.bio||"No bio yet.")+"</p><div class='stats'><div class='stat'><strong>"+posts.length+"</strong><span>CAWS</span></div><div class='stat'><strong>1</strong><span>ACCOUNT</span></div><div class='stat'><strong>∞</strong><span>UNIVERSE</span></div></div><div class='profileActions'>"+(isOwn?"<button class='btn primary' id='editBtn'>EDIT PROFILE</button>":"")+"<a class='btn ghost' href='index.html'>BACK TO FEED</a></div>"+(isOwn?"<div class='panel' id='editor' hidden><h2>EDIT YOUR NODE</h2><form id='editForm'><div class='formGrid'><div class='field'><label>DISPLAY NAME</label><input id='displayName' maxlength='80' value='"+esc(p.display_name||"")+"'></div><div class='field'><label>USERNAME</label><input id='username' maxlength='24' pattern='[A-Za-z0-9_]+' value='"+esc(p.username||"")+"'></div><div class='field full'><label>BIO</label><textarea id='bio' maxlength='500'>"+esc(p.bio||"")+"</textarea></div><div class='field full'><label>AVATAR URL</label><input id='avatarUrl' type='url' maxlength='500' placeholder='https://…' value='"+esc(p.avatar_url||"")+"'></div></div><div class='profileActions'><button class='btn primary' type='submit'>SAVE PROFILE</button><button class='btn ghost' type='button' id='cancelEdit'>CANCEL</button></div><p class='notice' id='saveNotice'></p></form></div>":"")+"<div class='sectionHead'><div><span>ACTIVITY</span><h2>"+(isOwn?"YOUR":"")+" CAWS</h2></div><small>"+posts.length+" total</small></div><div>"+(po.error?"<p class='empty'>Posts could not be loaded.</p>":posts.length?posts.map(x=>"<article class='post'><div class='postTime'>"+esc(fmt(x.created_at))+"</div><div class='postBody'>"+esc(x.body)+"</div></article>").join(""):"<p class='empty'>No Caws yet.</p>")+"</div>";if(!isOwn&&currentUser){$("followBtn").onclick=async()=>{const b=$("followBtn");b.disabled=true;if(following){await db.from("crowspace_follows").delete().eq("follower_id",currentUser.id).eq("followed_user_id",targetId)}else{await db.from("crowspace_follows").insert({follower_id:currentUser.id,followed_user_id:targetId})}await loadProfile()}}if(isOwn){$("editBtn").onclick=()=>{$("editor").hidden=false;$("editBtn").style.display="none"};$("cancelEdit").onclick=()=>{$("editor").hidden=true;$("editBtn").style.display="inline-block"};$("editForm").onsubmit=saveProfile}}
async function saveProfile(e){e.preventDefault();const n=$("saveNotice"),username=$("username").value.trim().toLowerCase(),display_name=$("displayName").value.trim(),bio=$("bio").value.trim(),avatar_url=$("avatarUrl").value.trim();n.textContent="SAVING…";if(!/^[a-z0-9_]{1,24}$/.test(username)){n.textContent="Username must use letters, numbers, or underscores.";return}const {data:du}=await db.from("crowspace_profiles").select("user_id").eq("username",username).neq("user_id",currentUser.id).limit(1);if(du?.length){n.textContent="That username is already in use.";return}const {error}=await db.from("crowspace_profiles").update({username,display_name:display_name||username,bio,avatar_url:avatar_url||null,updated_at:new Date().toISOString()}).eq("user_id",currentUser.id);if(error){n.textContent=error.message;return}await loadProfile()}
loadProfile();
</script></body></html>

(function(){

const qs=new URLSearchParams(location.search);

async function getProfile(){

 let q=db.from("crowspace_profiles").select("*");
 if(value) q=/^[0-9a-f-]{36}$/i.test(value)?q.eq("user_id",value):q.eq("username",value);

 return (await q.limit(1).maybeSingle()).data||null;

 try{return await profileLoadInFlight}

 ]);
 followers=fo.data||[];following=fi.data||[];friends=(fr.data||[]).filter(x=>x.status==="accepted");
 if(me&&me.id!==uid){
  relationship=await safe(async()=>{
   const [a,b,c]=await Promise.all([    db.from("crowspace_follows").select("follower_id").eq("follower_id",me.id).eq("followed_user_id",uid).maybeSingle(),
    db.from("crowspace_follows").select("follower_id").eq("follower_id",uid).eq("followed_user_id",me.id).maybeSingle(),
    db.from("crowspace_friendships").select("*").or("and(requester_id.eq."+me.id+",addressee_id.eq."+uid+"),and(requester_id.eq."+uid+",addressee_id.eq."+me.id+")").maybeSingle()
   ]);return {following:!!a.data,followsYou:!!b.data,friendship:c.data||null}
  },{following:false,followsYou:false,friendship:null});
 }
 const ids=[...new Set([...followers.map(x=>x.follower_id),...following.map(x=>x.followed_user_id),...friends.flatMap(x=>[x.requester_id,x.addressee_id])])].filter(x=>x!==uid); if(ids.length){const r=await safe(()=>db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url,bio").in("user_id",ids));(r.data||[]).forEach(p=>profiles.set(p.user_id,p))}
}async function loadContent(){
 const uid=target.user_id;
 const [p,c]=await Promise.all([
  safe(()=>db.from("crowspace_posts").select("id,user_id,title,body,media_url,created_at,like_count,comment_count").eq("user_id",uid).order("created_at",{ascending:false}).limit(50)),

 ]);

 badges=badgeOrder();
}

 if(ids.length){const p=await safe(()=>db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids));(p.data||[]).forEach(x=>profiles.set(x.user_id,x))}

 (badges.length?'<section class="card" style="margin-top:16px"><div class="title">PROFILE BADGES</div><div class="badge-strip">'+badgeOrder().map(b=>'<span class="badge-chip" title="'+esc(b.description||"")+'"><b>'+esc(b.icon||"✦")+'</b>'+esc(b.name||"Badge")+'</span>').join("")+'</div></section>':"")+publicFeaturedHtml()+
 '<div class="grid"><div>'+

}

 return '<div id="profileEditModal" class="profile-edit-modal" aria-hidden="true"><div class="profile-edit-backdrop" data-profile-edit-close></div><section class="profile-edit-dialog" role="dialog" aria-modal="true" aria-labelledby="profileEditTitle"><div class="profile-edit-header"><div id="profileEditTitle" class="title">EDIT YOUR CROWSPACE PROFILE</div><button class="btn profile-edit-close" type="button" data-profile-edit-close aria-label="Close profile editor">×</button></div><div class="profile-edit-body"><section id="creator-studio" class="card creator-mode"><div class="title">PROFILE IDENTITY & CREATOR STUDIO</div>'+

function queueRealtimeRefresh(reason){

function startRealtime(){
  if(!db||!target||realtimeChannel)return;
  const uid=target.user_id;
  realtimeChannel=db.channel("crowspace-profile-realtime-"+uid);
  realtimeChannel
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_profiles",filter:"user_id=eq."+uid},p=>{if(p.eventType==="UPDATE"){target=Object.assign({},target,p.new);queueRealtimeRefresh("profile")}})
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_follows",filter:"followed_user_id=eq."+uid},()=>queueRealtimeRefresh("followers"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_follows",filter:"follower_id=eq."+uid},()=>queueRealtimeRefresh("following"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_friendships",filter:"requester_id=eq."+uid},()=>queueRealtimeRefresh("friendships"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_friendships",filter:"addressee_id=eq."+uid},()=>queueRealtimeRefresh("friendships"))
    .on("postgres_changes",{event:"*",schema:"public",table:"member_blocks",filter:"blocker_id=eq."+uid},()=>queueRealtimeRefresh("blocks"))
    .on("postgres_changes",{event:"*",schema:"public",table:"member_blocks",filter:"blocked_id=eq."+uid},()=>queueRealtimeRefresh("blocks"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_posts",filter:"user_id=eq."+uid},()=>queueRealtimeRefresh("posts"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_caws",filter:"user_id=eq."+uid},()=>queueRealtimeRefresh("caws"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_guestbook",filter:"profile_id=eq."+uid},()=>queueRealtimeRefresh("guestbook"))
    .on("postgres_changes",{event:"*",schema:"public",table:"crowspace_notifications",filter:"user_id=eq."+uid},()=>{queueRealtimeRefresh("notifications");document.dispatchEvent(new CustomEvent("crowspace-notification-live"))})
    .subscribe((status,error)=>{
      if(status==="SUBSCRIBED") document.body.dataset.realtime="connected";
      if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){document.body.dataset.realtime="error";console.error("[CrowSpace realtime]",status,error)}
    });
}
function stopRealtime(){if(realtimeChannel&&db){db.removeChannel(realtimeChannel);realtimeChannel=null}clearTimeout(realtimeRefreshTimer)}

window.addEventListener("beforeunload",stopRealtime);

      const b=e.target.closest('[data-profile-cmd]'); if(!b)return;
      const cmd=b.dataset.profileCmd;
      try{
        if(cmd==='edit'){openProfileEditor();return}
        if(cmd==='refresh'){b.disabled=true;await load();toast('Profile refreshed');b.disabled=false}
        if(cmd==='copy'){await navigator.clipboard.writeText(location.href);toast('Profile link copied')}
        if(cmd==='share'){
          if(navigator.share) await navigator.share({title:target?.display_name||'CrowSpace Profile',url:location.href});
          else {await navigator.clipboard.writeText(location.href);toast('Profile link copied')}

  const appNode=document.getElementById('app');

    const observer=new MutationObserver(enhance);
    observer.observe(appNode,{childList:true,subtree:true});
  }
  enhance();
})();

let profileStarted=false, profileRetryTimer=null, profileWatchdog=null;
function setConnectionState(mode,message){
  document.body.dataset.profileConnection=mode;
  const app=$("app"); if(!app)return;
  if(mode==="connecting"){
    app.innerHTML='<div class="state"><div style="font:800 15px Orbitron;color:var(--cyan);letter-spacing:.08em">CONNECTING TO CROWSPACE</div><div style="margin-top:9px">'+esc(message||"Initializing your profile…")+'</div><div style="margin-top:12px;font-size:10px;color:var(--muted)">Secure universal account connection • Please wait</div></div>';
  }else if(mode==="offline"){
    app.innerHTML='<div class="state"><div style="font:800 15px Orbitron;color:var(--danger)">CROWSPACE CONNECTION INTERRUPTED</div><div style="margin-top:9px">'+esc(message||"The profile could not be initialized.")+'</div><div class="actions" style="justify-content:center;margin-top:15px"><button class="btn primary" id="retryProfile">Retry Connection</button><a class="btn" href="index.html">Back to CrowSpace</a></div></div>';
    $("retryProfile")?.addEventListener("click",()=>{profileStarted=false;startProfile(true)});
  }
}
async function startProfile(force){
  if(profileStarted&&!force)return;
  profileStarted=true;
  clearTimeout(profileRetryTimer); clearTimeout(profileWatchdog);
  setConnectionState("connecting","Connecting to your universal CrowRules account…");
  profileWatchdog=setTimeout(()=>{if(document.body.dataset.profileConnection==="connecting"){console.warn("[CrowSpace profile] startup watchdog fired");profileStarted=false;setConnectionState("offline","The connection took too long. Your data was not changed. Try again.");}},12000);
  try{
    if(!window.CrowSpaceAuth?.ready)throw new Error("CrowSpace authentication service is unavailable.");
    await Promise.race([
      window.CrowSpaceAuth.ready,
      new Promise((_,reject)=>setTimeout(()=>reject(new Error("Authentication service timed out.")),10000))
    ]);
    if(!window.CrowSpaceAuth.client)throw new Error("Supabase client was not initialized.");
    await load();
    clearTimeout(profileWatchdog);
    document.body.dataset.profileConnection="connected";
  }catch(e){
    clearTimeout(profileWatchdog);
    console.error("[CrowSpace profile startup]",e);
    profileStarted=false;
    setConnectionState("offline",e?.message||"Unable to connect to CrowSpace.");
  }
}
window.addEventListener("crowspace:supabase-ready",()=>startProfile(true));
window.addEventListener("crowspace-auth-ready",()=>startProfile(true));
window.addEventListener("crowspace-auth-error",e=>{if(document.body.dataset.profileConnection!=="connected"){profileStarted=false;setConnectionState("offline",e.detail?.message||"Supabase authentication failed.")}});
window.addEventListener("online",()=>{if(document.body.dataset.profileConnection!=="connected")startProfile(true)});
window.addEventListener("offline",()=>setConnectionState("offline","Your browser is offline. Reconnect and try again."));
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>startProfile(),{once:true});else startProfile();
})();
</script>

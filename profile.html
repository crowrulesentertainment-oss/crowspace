></section></section></div><div class="card"><a class="btn" href="./friends.html">Friends</a> <a class="btn" href="./search.html">Find Members</a> <a class="btn" href="./messages.html?u='+encodeURIComponent(profile.username||"")+'">Message</a> <a class="btn" href="./">← CrowSpace</a></div>';if(profile.banner_url)cover.style.backgroundImage='url("'+esc(profile.banner_url)+'")';interests.innerHTML=(profile.interests||"").split(/[,\n]/).map(x=>x.trim()).filter(Boolean).map(x=>'<span class="tag">'+esc(x)+'</span>').join("")||'<span class="muted">No interests listed.</span>';if(profile.show_albums===false)albumsSection.classList.add("sectionHidden");if(profile.show_guestbook===false)guestSection.classList.add("sectionHidden");if(profile.show_posts===false)posts.parentElement.parentElement.classList.add("sectionHidden");if(profile.show_music===false)musicSection.classList.add("sectionHidden");if(profile.show_music!==false&&!profile.music_url)music.textContent=profile.music_text||"No profile music added.";messageBtn.href="./messages.html?u="+encodeURIComponent(profile.username||"");if(!own){loadSocialState();friendBtn.onclick=sendFriend;followBtn.onclick=toggleFollow}}
async function loadIdentityAccess(){const [roles,perms]=await Promise.all([db.from("crowspace_creator_roles").select("role,division,status").eq("user_id",profile.user_id).eq("status","active").order("division"),db.from("crowspace_creator_permissions").select("permission,division").eq("user_id",profile.user_id).order("division")]);const box=document.getElementById("identityAccessContent");if(!box)return;const r=roles.data||[],p=perms.data||[];box.innerHTML='<div style="display:flex;gap:7px;flex-wrap:wrap;margin:10px 0">'+r.map(x=>'<span class="tag">🎭 '+esc(x.role)+' · '+esc(x.division)+'</span>').join("")+'</div><div class="muted">'+(p.length?p.length+" explicit permissions across the CrowRules Universe.":"No explicit creator permissions assigned yet.")+'</div>';if(session?.user?.id!==profile.user_id)identityManage.style.display="none"}

async function loadPosts(){const r=await db.from("crowspace_posts").select("id,body,created_at").eq("author_id",member.id).eq("status","published").order("created_at",{ascending:false}).limit(12);posts.innerHTML=(r.data||[]).map(x=>'<article class="post"><div>'+esc(x.body)+'</div><small class="muted">'+new Date(x.created_at).toLocaleString()+'</small></article>').join("")||'<div class="empty">No bulletins yet.</div>'}
async function loadActivity(){const r=await db.from("crowspace_activity").select("*").eq("actor_id",profile.user_id).order("created_at",{ascending:false}).limit(10);if(r.error){activity.innerHTML='<div class="empty">Activity unavailable.</div>';return}activity.innerHTML=(r.data||[]).map(x=>'<div class="activity"><b>'+esc((x.activity_type||"activity").replaceAll("_"," "))+'</b><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div></div>').join("")||'<div class="empty">No recent activity.</div>'}
async function loadGuestbook(){if(profile.show_guestbook===false)return;guestForm.innerHTML=session?'<textarea id="guestMsg" placeholder="Leave a message…" style="width:100%;min-height:75px;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px;padding:11px"></textarea><button class="btn primary" id="guestBtn" style="margin-top:8px">Sign Guestbook</button>': '<p class="muted">Sign in to leave a guestbook message.</p>';const r=await db.from("crowspace_guestbook").select("*").eq("profile_id",profile.user_id).eq("status","published").order("created_at",{ascending:false}).limit(20);if(r.error){guestbook.innerHTML='<div class="empty">Guestbook unavailable.</div>';return}const ids=[...new Set((r.data||[]).map(x=>x.author_id))];let map={};if(ids.length){const q=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids);(q.data||[]).forEach(x=>map[x.user_id]=x)}guestbook.innerHTML=(r.data||[]).map(x=>'<div class="guest"><b>'+esc(map[x.author_id]?.display_name||"Member")+'</b><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div><div>'+esc(x.message)+'</div></div>').join("")||'<div class="empty">No guestbook messages yet.</div>';if(session){guestBtn.onclick=async()=>{const v=guestMsg.value.trim();if(!v)return;const q=await db.from("crowspace_guestbook").insert({profile_id:profile.user_id,author_id:session.user.id,message:v,status:"published"});if(q.error)toast(q.error.message);else{guestMsg.value="";loadGuestbook()}}}}
function setupMusic(){music.innerHTML='<div class="track">🎵 '+esc(profile.music_text||"Profile Music")+'</div><div class="player"><button id="play">▶ Play</button><input id="seek" type="range" min="0" max="100" value="0" style="flex:1;min-width:130px"><span id="time" class="time">0:00 / 0:00</span><input id="vol" type="range" min="0" max="1" step=".01" value=".8"></div>';audio.src=profile.music_url;audio.volume=.8;play.onclick=async()=>{try{if(audio.paused)await audio.play();else audio.pause()}catch(e){toast("Music URL could not be played.")}};audio.onplay=()=>play.textContent="⏸ Pause";audio.onpause=()=>play.textContent="▶ Play";audio.ontimeupdate=()=>{seek.value=audio.duration?audio.currentTime/audio.duration*100:0;time.textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration)};audio.onloadedmetadata=()=>time.textContent="0:00 / "+fmt(audio.duration);seek.oninput=()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration};vol.oninput=()=>audio.volume=Number(vol.value)}
async function sendFriend(){const r=await db.from("crowspace_friends").insert({requester_id:session.user.id,recipient_id:profile.user_id,status:"pending"});if(r.error)toast(r.error.message);else{friendBtn.textContent="Request Pending";friendBtn.disabled=true}}
async function toggleFollow(){const q=await db.from("crowspace_follows").select("follower_id").eq("follower_id",session.user.id).eq("following_id",profile.user_id).maybeSingle();if(q.data){const r=await db.from("crowspace_follows").delete().eq("follower_id",session.user.id).eq("following_id",profile.user_id);if(r.error)toast(r.error.message);else{followBtn.textContent="Follow";loadStats()}}else{const r=await db.from("crowspace_follows").insert({follower_id:session.user.id,following_id:profile.user_id});if(r.error)toast(r.error.message);else{followBtn.textContent="Following";loadStats()}}}
function startPresence(){presence=db.channel("crowspace-profile-"+profile.user_id,{config:{presence:{key:session?.user?.id||"visitor"}}}).on("presence",{event:"sync"},()=>{const ids=Object.values(presence.presenceState()).flat().map(x=>x.userId);online=ids.includes(profile.user_id);onlineEl()}).subscribe(async s=>{if(s==="SUBSCRIBED"&&session)await presence.track({userId:session.user.id,onlineAt:new Date().toISOString()})})}
function onlineEl(){const e=document.getElementById("online");if(e)e.textContent=online?"🟢 Online":"⚫ Offline"}
function setupRealtime(){db.channel("crowspace-profile-live-"+profile.user_id).on("postgres_changes",{event:"INSERT",schema:"public",table:"crowspace_posts",filter:"author_id=eq."+profile.user_id},()=>{loadPosts();loadStats();loadMediaShowcase()}).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_follows",filter:"following_id=eq."+profile.user_id},()=>{loadStats();loadFollowers()}).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_friends"},()=>{loadStats();loadFriends();loadSocialShowcase();if(session&&session.user.id!==profile.user_id)loadSocialState()}).on("postgres_changes",{event:"INSERT",schema:"public",table:"crowspace_guestbook",filter:"profile_id=eq."+profile.user_id},loadGuestbook).subscribe()}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent="⚡ "+m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
window.profileReady=init();
</script><script>
(function(){
const st=document.createElement("style");st.textContent=".p5dash{background:linear-gradient(135deg,#0b101b,#171027);border:1px solid #303951;border-radius:16px;padding:16px;margin:15px 0}.p5grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.p5stat{background:#101522;border:1px solid #292e42;border-radius:12px;padding:13px;text-align:center}.p5stat b{display:block;font-size:22px}.p5links{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.p5badge{font-size:10px;border:1px solid #3a4660;border-radius:99px;padding:4px 8px;color:#8ff6ff}@media(max-width:800px){.p5grid{grid-template-columns:repeat(2,1fr)}}";document.head.appendChild(st);
async function p5(){
 const uid=profile.user_id;
 const [m,g,e,f,fl,po,a]=await Promise.all([
  db.from("crowspace_media").select("id",{count:"exact",head:true}).eq("user_id",uid).eq("visibility","public"),
  db.from("crowspace_group_members").select("group_id",{count:"exact",head:true}).eq("user_id",uid).eq("status","active"),
  db.from("crowspace_event_members").select("event_id",{count:"exact",head:true}).eq("user_id",uid),
  db.from("crowspace_friends").select("requester_id",{count:"exact",head:true}).eq("status","accepted").or("requester_id.eq."+uid+",recipient_id.eq."+uid),
  db.from("crowspace_follows").select("following_id",{count:"exact",head:true}).eq("follower_id",uid),
  db.from("crowspace_posts").select("id",{count:"exact",head:true}).eq("author_id",member.id).eq("status","published"),
  db.from("crowspace_activity").select("id",{count:"exact",head:true}).eq("actor_id",uid)
 ]);
 let box=document.getElementById("p5dashboard");if(!box){box=document.createElement("section");box.id="p5dashboard";box.className="p5dash";const hero=document.querySelector(".hero");hero.after(box)}
 box.innerHTML='<div class="toolbar"><div><h2>🪶 CrowSpace Identity Hub</h2><div class="muted">One profile. Your people, content and activity in one place.</div></div><span class="p5badge">'+(session?.user?.id===uid?"YOUR PROFILE":"MEMBER PROFILE")+'</span></div><div class="p5grid" style="margin-top:12px">'+
 [['📸',m.count||0,'Media'],['👥',g.count||0,'Groups'],['📅',e.count||0,'Events'],['🤝',f.count||0,'Friends'],['❤️',fl.count||0,'Following'],['📣',po.count||0,'Posts'],['⚡',a.count||0,'Activities'],['🏆','—','Achievements']].map(x=>'<div class="p5stat"><span>'+x[0]+'</span><b>'+x[1]+'</b><span class="muted">'+x[2]+'</span></div>').join("")+
 '</div><div class="p5links"><a class="btn" href="./media.html?creator='+encodeURIComponent(uid)+'">📸 Media</a><a class="btn" href="./groups.html">👥 Groups</a><a class="btn" href="./events.html">📅 Events</a><a class="btn" href="./friends.html">🤝 Friends</a><a class="btn" href="./activity.html">⚡ Activity</a><a class="btn" href="./messages.html?u='+encodeURIComponent(profile.username||"")+'">💬 Message</a></div>';
}
window.profileReady.then(()=>p5()).catch(e=>console.error("Profile 5.0:",e));
})();
</script><script>
(function(){
const s=document.createElement("style");s.textContent=".profileError{background:#180f18;border:1px solid #63384f;border-radius:12px;padding:12px;margin-top:10px;color:#ffb7d2}.hero .avatar{flex:none}";document.head.appendChild(s);
})();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Profile</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="scanlines"></div><header class="topbar"><a class="brand" href="index.html"><span class="mark">C</span><span>CROW<span>SPACE</span></span></a><nav><a href="index.html">Home</a><a class="active" href="profile.html">Profile</a></nav><div class="account"><span id="memberState">CONNECTING…</span><button id="authBtn">Sign In</button></div></header><main class="shell"><section class="card" style="padding:40px;max-width:760px;margin:auto"><div class="eyebrow">PERSONAL NODE</div><div id="profile"><h1 style="font-family:Orbitron">Loading profile…</h1></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
(async()=>{const {data:{session}}=await db.auth.getSession();if(!session){$("profile").innerHTML="<h1 style='font-family:Orbitron'>SIGN IN REQUIRED</h1><p style='color:var(--muted)'>Connect your universal CrowRules account to open your CrowSpace profile.</p>";return}const {data:p}=await db.from("crowspace_profiles").select("*").eq("user_id",session.user.id).maybeSingle();if(!p){$("profile").innerHTML="<h1>PROFILE NODE EMPTY</h1>";return}$("profile").innerHTML=`<div style="display:flex;gap:20px;align-items:center;margin-top:22px"><div style="width:90px;height:90px;border:1px solid var(--cyan);border-radius:50%;display:grid;place-items:center;font:800 30px Orbitron;color:var(--cyan)">${(p.display_name||p.username||"C")[0].toUpperCase()}</div><div><h1 style="font:800 32px Orbitron;margin:0">${esc(p.display_name||p.username||"Crow")}</h1><p style="color:var(--cyan)">@${esc(p.username||"crow")}</p></div></div><p style="color:var(--muted);line-height:1.7;margin-top:28px">${esc(p.bio||"No bio yet. Your story starts here.")}</p>`;})();
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script></body></html>

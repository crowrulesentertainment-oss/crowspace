<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Nest | CrowSpace</title>
<link rel="stylesheet" href="css/crowspace.css">
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/crowspace.js"></script>
<style>
:root{--p:#0a0f1c;--p2:#10182a;--line:rgba(255,255,255,.09);--cyan:#59e7ff;--purple:#9b7cff;--text:#f4f7ff;--muted:#8c99b2}
body{background:radial-gradient(circle at 12% 4%,rgba(89,231,255,.12),transparent 28%),radial-gradient(circle at 88% 12%,rgba(155,124,255,.13),transparent 30%),#05070d;color:var(--text)}
.profile-wrap{max-width:1320px;margin:auto;padding:28px 4vw 60px}.identity{display:grid;grid-template-columns:190px 1fr 220px;gap:26px;align-items:center;padding:28px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(135deg,rgba(12,20,38,.96),rgba(14,10,29,.92));box-shadow:0 24px 80px rgba(0,0,0,.35)}
.avatar{width:170px;height:170px;border-radius:24px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#101b31,#1a102e);border:2px solid rgba(89,231,255,.5);color:var(--cyan);font:800 52px Orbitron,Arial}.avatar img{width:100%;height:100%;object-fit:cover}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--cyan)}h1{margin:7px 0 2px;font:800 clamp(30px,5vw,60px) Orbitron,Arial;letter-spacing:-.04em}.handle{font:12px monospace;color:#91a0ba}.bio{color:var(--muted);line-height:1.7;max-width:760px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{display:inline-block;padding:9px 13px;border:1px solid var(--line);border-radius:10px;color:#dfe7f4;text-decoration:none;background:rgba(255,255,255,.04);font:700 10px Montserrat,Arial;cursor:pointer}.btn.primary{background:linear-gradient(135deg,rgba(89,231,255,.17),rgba(155,124,255,.18));border-color:rgba(89,231,255,.3)}
.status{border-left:1px solid var(--line);padding-left:22px;display:grid;gap:10px}.status strong{font-size:11px;letter-spacing:.1em}.status small{color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#55e68a;box-shadow:0 0 10px #55e68a;margin-right:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-top:15px}.stats div{background:#081120;padding:10px;text-align:center}.stats b{display:block;font:700 19px Orbitron}.stats span{font-size:9px;color:var(--muted);text-transform:uppercase}
.tabs{display:flex;gap:5px;overflow:auto;margin:14px 0;padding:6px;border:1px solid var(--line);border-radius:14px;background:rgba(9,12,21,.8)}.tabs a{padding:9px 12px;border-radius:9px;color:var(--muted);font-size:11px;font-weight:800;text-decoration:none;white-space:nowrap}.tabs a:hover{background:rgba(89,231,255,.08);color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.stack{display:grid;gap:18px}.panel{border:1px solid var(--line);border-radius:20px;background:rgba(10,15,28,.86);overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}.head h2{margin:0;font:700 15px Orbitron}.head span{color:var(--muted);font-size:9px}.body{padding:18px}.muted{color:var(--muted)}.empty{padding:8px 0;color:var(--muted);font-size:12px}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail{padding:11px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}.detail small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.detail strong{display:block;margin-top:4px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mini{padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}.mini img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin-bottom:7px}.mini strong{display:block;font-size:12px}.mini small{display:block;color:var(--muted);margin-top:4px}.person{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.person:last-child{border-bottom:0}.person-avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#10223d;color:var(--cyan);font-weight:800;overflow:hidden}.person-avatar img{width:100%;height:100%;object-fit:cover}.person a{color:#fff;text-decoration:none}.notice{padding:12px;border:1px dashed rgba(89,231,255,.3);border-radius:12px;color:var(--muted);font-size:11px}
@media(max-width:900px){.identity{grid-template-columns:150px 1fr}.status{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:15px 0 0}.grid{grid-template-columns:1fr}}@media(max-width:560px){.profile-wrap{padding:16px 12px 40px}.identity{grid-template-columns:1fr;text-align:center;padding:20px}.avatar{margin:auto}.bio{margin-left:auto;margin-right:auto}.actions{justify-content:center}.stats{grid-template-columns:1fr 1fr}.details,.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site-header"><a href="index.html" class="brand">CrowSpace</a><div id="account"></div></header>
<main class="profile-wrap" id="app"><div class="notice">Loading Nest…</div></main>
<footer>CrowSpace · One Account. One Universe.</footer>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id), esc=window.CS?.escape||((s)=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])));
let client=window.crowSupabase,viewer=null,uid=new URLSearchParams(location.search).get("id");
const initials=s=>String(s||"C").trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()||"C";
const safeUrl=u=>{try{const x=new URL(u,location.href);return ["http:","https:"].includes(x.protocol)?x.href:""}catch{return ""}};
async function user(){if(!client)return null;const r=await client.auth.getUser();return r.data?.user||null}
async function profile(id){const {data,error}=await client.from("membership_profiles").select("id,display_name,username,bio,avatar_url,website,location,created_at").eq("id",id).maybeSingle();if(error)throw error;return data}
async function count(table,filter){let q=client.from(table).select("id",{count:"exact",head:true});Object.entries(filter||{}).forEach(([k,v])=>q=q.eq(k,v));const r=await q;return Number(r.count||0)}
function person(p){const av=safeUrl(p.avatar_url);return `<div class="person"><a class="person-avatar" href="profile.html?id=${encodeURIComponent(p.id)}">${av?`<img src="${esc(av)}" alt="">`:esc(initials(p.display_name||p.username))}</a><div><a href="profile.html?id=${encodeURIComponent(p.id)}"><strong>${esc(p.display_name||"CrowSpace Member")}</strong></a><br><small class="muted">@${esc(p.username||"member")}</small></div></div>`}
async function load(){
 try{
  viewer=await user();
  if(!uid)uid=viewer?.id||null;
  if(!uid){$("app").innerHTML='<section class="panel"><div class="body"><h2>Sign in to open your Nest</h2><p class="muted">Your CrowSpace profile is connected to your Universal CrowRules account.</p><a class="btn primary" href="login.html">Sign In →</a></div></section>';return}
  const p=await profile(uid);if(!p)throw new Error("This CrowSpace profile could not be found.");
  if(viewer?.id===uid)window.CROW_PROFILE_UID=uid;
  const [friends,followers,following,caws,photos,groups,events]=await Promise.all([
   count("crowspace_friendships",{status:"accepted"}),
   count("crowspace_follows",{followed_user_id:uid}),
   count("crowspace_follows",{follower_id:uid}),
   count("crowspace_caws",{user_id:uid}),
   count("crowspace_album_photos",{user_id:uid}),
   count("crowspace_group_members",{user_id:uid}),
   count("crowspace_events",{created_by:uid})
  ]);
  const av=safeUrl(p.avatar_url);
  $("app").innerHTML=`
  <section class="identity">
   <div class="avatar">${av?`<img src="${esc(av)}" alt="${esc(p.display_name||"CrowSpace Member")}">`:esc(initials(p.display_name||p.username))}</div>
   <div><div class="eyebrow">CROWSPACE NEST</div><h1>${esc(p.display_name||"CrowSpace Member")}</h1><div class="handle">@${esc(p.username||"member")}</div><p class="bio">${esc(p.bio||"Welcome to my CrowSpace Nest.")}</p><div class="actions">${viewer?.id===uid?'<a class="btn primary" href="customize.html">Customize Nest →</a>':'<button class="btn primary" id="followBtn">Follow</button><a class="btn" href="messenger.html?user=${encodeURIComponent(uid)}">Message</a>'}</div></div>
   <div class="status"><strong><span class="dot"></span>CROWSPACE MEMBER</strong><small>${p.location?esc(p.location):"One Account. One Universe."}</small><small>Joined ${p.created_at?esc(new Date(p.created_at).toLocaleDateString()):"CrowSpace"}</small><div class="stats"><div><b>${friends}</b><span>Friends</span></div><div><b>${followers}</b><span>Followers</span></div><div><b>${caws}</b><span>Caws</span></div></div></div>
  </section>
  <nav class="tabs"><a href="profile.html?id=${encodeURIComponent(uid)}">Nest</a><a href="caws.html?user=${encodeURIComponent(uid)}">Caws</a><a href="albums.html?user=${encodeURIComponent(uid)}">Photos</a><a href="groups.html?user=${encodeURIComponent(uid)}">Groups</a><a href="events.html?user=${encodeURIComponent(uid)}">Events</a><a href="people.html">People</a></nav>
  <div class="grid"><div class="stack">
   <section class="panel"><div class="head"><h2>About This Nest</h2><span>PROFILE</span></div><div class="body"><div class="details"><div class="detail"><small>Username</small><strong>@${esc(p.username||"member")}</strong></div><div class="detail"><small>Location</small><strong>${esc(p.location||"Not added")}</strong></div><div class="detail"><small>Following</small><strong>${following}</strong></div><div class="detail"><small>Groups</small><strong>${groups}</strong></div><div class="detail"><small>Photos</small><strong>${photos}</strong></div><div class="detail"><small>Events</small><strong>${events}</strong></div></div>${p.website?`<p><a class="btn" href="${esc(safeUrl(p.website)||"#")}" target="_blank" rel="noopener noreferrer">Visit Website →</a></p>`:""}</div></section>
   <section class="panel"><div class="head"><h2>Recent Caws</h2><a href="caws.html?user=${encodeURIComponent(uid)}">View all →</a></div><div class="body" id="caws"><div class="empty">Loading Caws…</div></div></section>
   <section class="panel"><div class="head"><h2>Photos</h2><a href="albums.html?user=${encodeURIComponent(uid)}">View all →</a></div><div class="body" id="photos"><div class="empty">Loading photos…</div></div></section>
  </div><aside class="stack">
   <section class="panel"><div class="head"><h2>Connections</h2><span>NETWORK</span></div><div class="body" id="connections"><div class="empty">Loading…</div></div></section>
   <section class="panel"><div class="head"><h2>CrowSpace</h2></div><div class="body"><div class="notice">${viewer?.id===uid?'This is your Nest. Customize it anytime.':'Explore this member across the CrowSpace universe.'}</div></div></section>
  </aside></div>`;
  if(viewer?.id!==uid)setupFollow();
  await loadContent();
 }catch(e){console.error("CrowSpace profile:",e);$("app").innerHTML=`<section class="panel"><div class="body"><h2>Unable to load this Nest</h2><p class="muted">${esc(e.message||"An unexpected error occurred.")}</p><button class="btn" onclick="location.reload()">Reload</button></div></section>`}
}
async function loadContent(){
 const cq=await client.from("crowspace_caws").select("id,title,caption,thumbnail_url,video_url,views,created_at").eq("user_id",uid).order("created_at",{ascending:false}).limit(4);if(cq.error)console.warn(cq.error);$("caws").innerHTML=(cq.data||[]).map(x=>`<article class="mini">${safeUrl(x.thumbnail_url)?`<img src="${esc(safeUrl(x.thumbnail_url))}" alt="" loading="lazy">`:""}<strong>${esc(x.title||"Untitled Caw")}</strong><small>${esc(x.caption||"")}</small>${x.video_url?`<a class="btn" href="${esc(safeUrl(x.video_url)||"#")}" target="_blank" rel="noopener">Watch Caw →</a>`:""}</article>`).join("")||'<div class="empty">No Caws yet.</div>';
 const pq=await client.from("crowspace_album_photos").select("id,image_url,caption").eq("user_id",uid).order("created_at",{ascending:false}).limit(6);if(pq.error)console.warn(pq.error);$("photos").innerHTML=(pq.data||[]).map(x=>safeUrl(x.image_url)?`<img src="${esc(safeUrl(x.image_url))}" alt="${esc(x.caption||"CrowSpace photo")}" loading="lazy" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px">`:"").filter(Boolean).length?`<div class="cards">${(pq.data||[]).map(x=>safeUrl(x.image_url)?`<div class="mini"><img src="${esc(safeUrl(x.image_url))}" alt="${esc(x.caption||"")}" loading="lazy"><small>${esc(x.caption||"")}</small></div>`:"").join("")}</div>`:'<div class="empty">No photos yet.</div>';
 const fq=await client.from("crowspace_friendships").select("requester_id,addressee_id").eq("status","accepted").or(`requester_id.eq.${uid},addressee_id.eq.${uid}`).limit(8);if(fq.error)console.warn(fq.error);const ids=(fq.data||[]).map(x=>x.requester_id===uid?x.addressee_id:x.requester_id);if(!ids.length){$("connections").innerHTML='<div class="empty">No friends listed yet.</div>';return}const mq=await client.from("membership_profiles").select("id,display_name,username,avatar_url").in("id",ids);$("connections").innerHTML=(mq.data||[]).map(person).join("")||'<div class="empty">No connections found.</div>';
}
async function setupFollow(){const b=$("followBtn");if(!b||!viewer)return;const q=await client.from("crowspace_follows").select("id").eq("follower_id",viewer.id).eq("followed_user_id",uid).maybeSingle();b.textContent=q.data?"Following":"Follow";b.onclick=async()=>{b.disabled=true;try{if(q.data){const r=await client.from("crowspace_follows").delete().eq("id",q.data.id);if(r.error)throw r.error;b.textContent="Follow"}else{const r=await client.from("crowspace_follows").insert({follower_id:viewer.id,followed_user_id:uid});if(r.error)throw r.error;b.textContent="Following"}}catch(e){alert(e.message||"Unable to update follow status.")}finally{b.disabled=false}}}
document.addEventListener("DOMContentLoaded",load,{once:true});
})();
</script>
<script src="js/global-nav.js?v=20260928-2" defer></script>
</body>
</html>

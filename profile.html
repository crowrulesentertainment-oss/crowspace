<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Profile</title><style>
body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif;background-image:radial-gradient(circle at 20% 0,#19213d,transparent 35%);--accent:#20e6ff;--panel:#0d0f18;--panel2:#151827;--muted:#9da5bd}main{max-width:1000px;margin:25px auto;padding:15px}.card{background:var(--panel);border:1px solid #292e42;border-radius:18px;padding:20px;margin-bottom:16px}.cover{height:230px;border-radius:14px;background:linear-gradient(135deg,#13283a,#542b7a,#181020);background-size:cover}.avatar{width:125px;height:125px;margin:-62px 0 0 25px;border:5px solid #0d0f18;border-radius:50%;background:#252a40;display:grid;place-items:center;font-size:38px;font-weight:bold;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.muted{color:var(--muted)}.btn{display:inline-block;padding:10px 14px;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;border:1px solid #363c55;cursor:pointer}.primary{background:var(--accent);color:#031014;border:0}.grid{display:grid;grid-template-columns:1fr 1.7fr;gap:16px}.friendgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.friend{background:var(--panel2);border-radius:12px;padding:12px;text-align:center}.mini{width:65px;height:65px;margin:auto;border-radius:50%;background:#252a40;display:grid;place-items:center;font-weight:bold;overflow:hidden}.mini img{width:100%;height:100%;object-fit:cover}.guest{padding:12px 0;border-bottom:1px solid #25293a}.music{padding:14px;border-radius:12px;background:#111c29;border:1px solid #24465a}.player{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.player button{padding:9px 13px;border-radius:9px;border:1px solid #34445a;background:#182033;color:#fff;cursor:pointer}.player input[type=range]{accent-color:var(--accent)}.track{font-weight:700;min-width:180px}.time{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.friendgrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><div class="card"><div class="cover" id="cover"></div><div class="avatar" id="avatar">C</div><h1 id="name">CrowSpace Member</h1><div class="muted" id="handle">@member</div><p id="bio">Welcome to CrowSpace.</p><p class="muted" id="location"></p><div class="muted" id="socialStats">Followers: 0 · Following: 0 · Posts: 0</div><div id="online" class="muted" style="margin-top:6px"></div><div class="actions"><button class="btn primary" id="friendBtn">Add Friend</button><button class="btn" id="followBtn">Follow</button><a class="btn" id="messageBtn">Message</a><a class="btn" id="editBtn" href="./edit-profile.html">Edit Profile</a><a class="btn" href="./">← CrowSpace</a></div></div><div class="grid"><div><div class="card"><h3>TOP 8 FRIENDS</h3><div class="friendgrid" id="top8"></div></div><div class="card"><h3>PHOTO ALBUMS</h3><div id="albums" class="friendgrid"><span class="muted">Loading albums...</span></div></div><div class="card"><h3>PROFILE MUSIC</h3><div class="music" id="music">No profile music added.</div><audio id="profileAudio" preload="metadata" style="display:none"></audio></div><div class="card"><h3>INTERESTS</h3><p id="interests" class="muted">No interests listed.</p></div></div><div><div class="card"><h3>GUESTBOOK</h3><textarea id="guestMsg" placeholder="Leave a message..." style="width:100%;box-sizing:border-box;min-height:80px;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px;padding:12px"></textarea><button class="btn primary" id="guestBtn" style="margin-top:8px">Sign Guestbook</button><div id="guestbook"></div></div><div class="card"><h3>RECENT BULLETINS</h3><div id="posts" class="muted">Loading...</div></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const audio=document.getElementById("profileAudio");const username=new URLSearchParams(location.search).get("u");let session,profile,presenceChannel;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(t){if(!isFinite(t))return "0:00";const m=Math.floor(t/60),s=Math.floor(t%60).toString().padStart(2,"0");return m+":"+s}function setupPlayer(title,url){music.innerHTML="<div class=\"track\">🎵 Profile Music</div><div class=\"player\"><button id=\"playMusic\">▶ Play</button><input id=\"seekMusic\" type=\"range\" min=\"0\" max=\"100\" value=\"0\" style=\"flex:1;min-width:140px\"><span id=\"timeMusic\" class=\"time\">0:00 / 0:00</span><label class=\"time\">🔊 <input id=\"volumeMusic\" type=\"range\" min=\"0\" max=\"1\" step=\".01\" value=\".8\"></label></div>";audio.src=url;const play=document.getElementById("playMusic"),seek=document.getElementById("seekMusic"),vol=document.getElementById("volumeMusic"),time=document.getElementById("timeMusic");audio.volume=.8;play.onclick=async()=>{if(audio.paused){try{await audio.play()}catch(e){alert("This music URL could not be played here. Use a direct audio file URL.")}}else audio.pause()};audio.onplay=()=>play.textContent="⏸ Pause";audio.onpause=()=>play.textContent="▶ Play";audio.ontimeupdate=()=>{seek.value=audio.duration?(audio.currentTime/audio.duration)*100:0;time.textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration)};audio.onloadedmetadata=()=>time.textContent="0:00 / "+fmt(audio.duration);seek.oninput=()=>{if(audio.duration)audio.currentTime=(seek.value/100)*audio.duration};vol.oninput=()=>audio.volume=Number(vol.value)}function ini(s){return (s||"C").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}
async function init(){session=(await db.auth.getSession()).data.session;const r=await db.from("crowspace_profiles").select("*").eq("username",username).maybeSingle();if(r.error||!r.data){document.querySelector("main").innerHTML='<div class="card"><h1>Profile not found</h1><a href="./">Back to CrowSpace</a></div>';return}profile=r.data;document.documentElement.style.setProperty("--accent",profile.accent_color||"#20e6ff");if(profile.background_url)document.body.style.backgroundImage='url("'+esc(profile.background_url)+'")';name.textContent=profile.display_name||"CrowSpace Member";handle.textContent="@"+profile.username;bio.textContent=profile.bio||"Welcome to CrowSpace.";location.textContent=profile.location||"";interests.textContent=profile.interests||"No interests listed.";if(profile.avatar_url)avatar.innerHTML='<img src="'+esc(profile.avatar_url)+'">';if(profile.banner_url)cover.style.backgroundImage='url("'+esc(profile.banner_url)+'")';if(profile.show_music!==false&&(profile.music_url||profile.profile_music?.url)){setupPlayer(profile.music_text||profile.profile_music?.title||"Profile Music",profile.music_url||profile.profile_music.url)}else if(profile.show_music===false){music.innerHTML="<span class=\"muted\">Profile music is hidden.</span>"}editBtn.style.display=session&&session.user.id===profile.user_id?"inline-block":"none";messageBtn.href="./messages.html?to="+profile.user_id;await loadTop8();await loadAlbums();await loadGuestbook();await loadPosts();await loadSocialStats();if(session&&session.user.id!==profile.user_id){await loadFriendState();await loadFollowState()}else{friendBtn.style.display="none";followBtn.style.display="none"}startPresence()}
async function loadSocialStats(){const f=await db.from("crowspace_follows").select("follower_id",{count:"exact",head:true}).eq("following_id",profile.user_id);const g=await db.from("crowspace_follows").select("following_id",{count:"exact",head:true}).eq("follower_id",profile.user_id);const p=await db.from("crowspace_posts").select("id",{count:"exact",head:true}).eq("author_id",profile.user_id);socialStats.textContent="Followers: "+(f.count||0)+" · Following: "+(g.count||0)+" · Posts: "+(p.count||0)}
async function loadFollowState(){const r=await db.from("crowspace_follows").select("follower_id").eq("follower_id",session.user.id).eq("following_id",profile.user_id).maybeSingle();followBtn.textContent=r.data?"Following":"Follow"}
async function startPresence(){presenceChannel=db.channel("crowspace-profile-presence",{config:{presence:{key:session?.user?.id||"visitor"}}}).on("presence",{event:"sync"},()=>{const ids=Object.values(presenceChannel.presenceState()).flat().map(x=>x.userId);online.textContent=ids.includes(profile.user_id)?"🟢 Online":"⚫ Offline"});presenceChannel.subscribe(async status=>{if(status==="SUBSCRIBED"&&session)await presenceChannel.track({userId:session.user.id,onlineAt:new Date().toISOString()})})}
async function loadTop8(){const ids=profile.top_friends||[];if(!ids.length){top8.innerHTML='<div class="muted">Your Top 8 is ready to customize.</div>';return}const r=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids.slice(0,8));top8.innerHTML=(r.data||[]).map(x=>'<a class="friend" href="./profile.html?u='+encodeURIComponent(x.username||"member")+'"><div class="mini">'+(x.avatar_url?'<img src="'+esc(x.avatar_url)+'">':ini(x.display_name))+'</div><b>'+esc(x.display_name||"Member")+'</b></a>').join("")}
async function loadAlbums(){const r=await db.from("crowspace_albums").select("id,title,description,cover_url,created_at").eq("user_id",profile.user_id).eq("visibility","public").order("created_at",{ascending:false}).limit(12);if(r.error){albums.innerHTML='<span class="muted">Albums unavailable.</span>';return}albums.innerHTML=(r.data||[]).map(a=>'<a class="friend" href="./media.html?album='+a.id+'"><div class="mini" style="border-radius:10px;background-size:cover;background-position:center;'+(a.cover_url?'background-image:url(\''+esc(a.cover_url)+'\')':'')+'"></div><b>'+esc(a.title)+'</b></a>').join('')||'<span class="muted">No public albums yet.</span>'}
async function loadGuestbook(){const r=await db.from("crowspace_guestbook").select("*").eq("profile_id",profile.user_id).eq("status","published").order("created_at",{ascending:false}).limit(20);if(r.error){guestbook.innerHTML='<p class="muted">Guestbook is unavailable for this profile.</p>';return}const ids=[...new Set((r.data||[]).map(x=>x.author_id))];let a={};if(ids.length){const q=await db.from("crowspace_profiles").select("user_id,username,display_name").in("user_id",ids);(q.data||[]).forEach(x=>a[x.user_id]=x)}guestbook.innerHTML=(r.data||[]).map(x=>'<div class="guest"><b>'+esc(a[x.author_id]?.display_name||"Member")+'</b><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div><p>'+esc(x.message)+'</p></div>').join("")||'<p class="muted">No guestbook messages yet.</p>'}
async function loadPosts(){const r=await db.from("crowspace_posts").select("body,created_at,status").eq("author_id",profile.user_id).eq("status","published").order("created_at",{ascending:false}).limit(10);posts.innerHTML=(r.data||[]).map(x=>'<div class="guest"><div>'+esc(x.body)+'</div><small class="muted">'+new Date(x.created_at).toLocaleString()+'</small></div>').join("")||"No bulletins yet."}
async function loadFriendState(){const me=session.user.id;const r=await db.from("crowspace_friends").select("requester_id,recipient_id,status").or("and(requester_id.eq."+me+",recipient_id.eq."+profile.user_id+"),and(requester_id.eq."+profile.user_id+",recipient_id.eq."+me+")").limit(1);const f=r.data?.[0];friendBtn.textContent=f?.status==="accepted"?"Friends":f?.status==="pending"?"Request Pending":"Add Friend";friendBtn.disabled=!!f}
followBtn.onclick=async()=>{if(!session)return location.href="./";const q=await db.from("crowspace_follows").select("follower_id").eq("follower_id",session.user.id).eq("following_id",profile.user_id).maybeSingle();if(q.data){const r=await db.from("crowspace_follows").delete().eq("follower_id",session.user.id).eq("following_id",profile.user_id);if(r.error)alert(r.error.message);else{followBtn.textContent="Follow";loadSocialStats()}}else{const r=await db.from("crowspace_follows").insert({follower_id:session.user.id,following_id:profile.user_id});if(r.error)alert(r.error.message);else{followBtn.textContent="Following";loadSocialStats()}}}
friendBtn.onclick=async()=>{if(!session)return location.href="./";const r=await db.from("crowspace_friends").insert({requester_id:session.user.id,recipient_id:profile.user_id,status:"pending"});if(r.error)alert(r.error.message);else{friendBtn.textContent="Request Pending";friendBtn.disabled=true}}
guestBtn.onclick=async()=>{if(!session)return alert("Sign in to leave a guestbook message.");const text=guestMsg.value.trim();if(!text)return;const r=await db.from("crowspace_guestbook").insert({profile_id:profile.user_id,author_id:session.user.id,message:text,status:"published"});if(r.error)alert(r.error.message);else{guestMsg.value="";loadGuestbook()}}
init();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Nest | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html"><span>●</span> CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">My Nest</a><a href="caws.html">Caws</a><a href="groups.html">Groups</a><a href="events.html">Events</a><a href="dreamscapes.html">Dreamscapes</a><a href="memorials.html">Memorials</a><a href="notifications.html">Messages</a></nav><div id="account"><a href="login.html">Sign In</a></div></header><main class="section"><div id="profile"></div><div class="card"><h2>Share an update</h2><textarea id="postBody" maxlength="5000" placeholder="What are you building, watching or thinking about?"></textarea><button class="btn primary" id="postBtn">Post to CrowSpace</button><p id="postMsg" class="muted"></p></div><h2>Your feed</h2><div id="feed" class="feed"></div></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await CS.user();if(!u){location.href="login.html";return}const p=await CS.ensureProfile(u);document.getElementById("profile").innerHTML='<div class="profile-hero card"><div class="avatar lg">'+CS.escape((p?.display_name||"C").slice(0,1).toUpperCase())+'</div><div><p class="eyebrow">MY NEST</p><h1>'+CS.escape(p?.display_name||"CrowSpace Member")+'</h1><p>@'+CS.escape(p?.username||"member")+'</p><p class="muted">'+CS.escape(p?.bio||"Welcome to CrowSpace.")+'</p><p><strong>Universal Membership:</strong> '+CS.escape((await CS.client.from("crplus_universal_membership").select("membership_type,status,level,plan_name").eq("user_id",u.id).maybeSingle()).data?.membership_type||"Free")+'</p></div></div>';document.getElementById("postBtn").onclick=async()=>{const body=document.getElementById("postBody").value.trim();if(!body)return;const {error}=await crowSupabase.from("crowspace_posts").insert({user_id:u.id,body});postMsg.textContent=error?error.message:"Posted!";if(!error){postBody.value="";CS.feed()}}});</script></body></html>

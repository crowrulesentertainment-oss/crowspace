<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Album | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">My Nest</a><a href="caws.html">Caws</a><a href="groups.html">Groups</a><a href="events.html">Events</a><a class="active" href="albums.html">Photos</a></nav><div id="account"></div></header><main class="section"><div class="section-head"><h1>Create Photo Album</h1><a class="btn" href="albums.html">Back</a></div><section class="card"><form id="f"><label>Album title<input id="title" required maxlength="120"></label><label>Description<textarea id="description"></textarea></label><label>Cover image URL<input id="cover_url" type="url" placeholder="https://..."></label><button class="btn primary">Create Album</button><p id="msg" class="muted"></p></form></section></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>f.onsubmit=async e=>{e.preventDefault();const u=await CS.user();if(!u){location.href="login.html";return}const {error}=await crowSupabase.from("crowspace_albums").insert({user_id:u.id,title:title.value.trim(),description:description.value.trim()||null,cover_url:cover_url.value.trim()||null});msg.textContent=error?error.message:"Album created!";if(!error)setTimeout(()=>location.href="albums.html",500)};</script><script src="js/global-nav.js"></script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Album | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">My Nest</a><a href="caws.html">Caws</a><a href="groups.html">Groups</a><a href="events.html">Events</a><a class="active" href="albums.html">Photos</a></nav><div id="account"></div></header><main class="section"><div class="section-head"><h1>Create Photo Album</h1><a class="btn" href="albums.html">Back</a></div><section class="card"><form id="f"><label>Album title<input id="title" required maxlength="120"></label><label>Description<textarea id="description" maxlength="2000"></textarea></label><label>Cover image URL <span class="muted">(optional)</span><input id="cover_url" type="url" placeholder="https://..."></label><label>Upload photos <input id="photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><small class="muted">JPG, PNG, WEBP or GIF · Up to 25 photos · 10 MB each</small></label><div id="preview" class="photo-upload-preview"></div><button class="btn primary" id="createBtn">Create Album & Upload Photos</button><p id="msg" class="muted"></p></form></section></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>
const f=document.getElementById("f"),files=document.getElementById("photos"),preview=document.getElementById("preview"),msg=document.getElementById("msg"),createBtn=document.getElementById("createBtn");
files.addEventListener("change",()=>{preview.innerHTML="";[...files.files].slice(0,25).forEach(file=>{if(!file.type.startsWith("image/"))return;const img=document.createElement("img");img.src=URL.createObjectURL(file);img.alt=file.name;preview.appendChild(img)})});
f.onsubmit=async e=>{e.preventDefault();const u=await CS.user();if(!u){location.href="login.html";return}const selected=[...files.files].slice(0,25);if(selected.some(x=>x.size>10*1024*1024)){msg.textContent="Each photo must be 10 MB or smaller.";return}createBtn.disabled=true;msg.textContent="Creating album…";try{
 const {data:album,error}=await crowSupabase.from("crowspace_albums").insert({user_id:u.id,title:title.value.trim(),description:description.value.trim()||null,cover_url:cover_url.value.trim()||null}).select("id").single();if(error)throw error;
 let uploaded=0;
 for(const file of selected){const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";const path=u.id+"/albums/"+album.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;const {error:upErr}=await crowSupabase.storage.from("crowspace-media").upload(path,file,{contentType:file.type,cacheControl:"3600",upsert:false});if(upErr)throw upErr;const {data:pub}=crowSupabase.storage.from("crowspace-media").getPublicUrl(path);const {error:dbErr}=await crowSupabase.from("crowspace_album_photos").insert({album_id:album.id,user_id:u.id,image_url:pub.publicUrl,caption:file.name});if(dbErr){await crowSupabase.storage.from("crowspace-media").remove([path]);throw dbErr}uploaded++;}
 if(!cover_url.value.trim()&&selected[0]){const {data:first}=await crowSupabase.from("crowspace_album_photos").select("image_url").eq("album_id",album.id).order("created_at",{ascending:true}).limit(1).maybeSingle();if(first?.image_url)await crowSupabase.from("crowspace_albums").update({cover_url:first.image_url}).eq("id",album.id)}
 msg.textContent="Album created with "+uploaded+" photo"+(uploaded===1?"":"s")+".";setTimeout(()=>location.href="albums.html",700);
}catch(err){msg.textContent="Upload failed: "+(err.message||"Please try again.");createBtn.disabled=false}};
</script><script src="js/global-nav.js"></script><style>.photo-upload-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:10px 0}.photo-upload-preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid rgba(89,231,255,.2)}</style></body></html>

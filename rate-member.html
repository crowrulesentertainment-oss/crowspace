<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rate Member · CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-page="rating"><header class="topbar"><a class="brand" href="index.html">CROW<span>SPACE</span></a><nav id="nav" class="nav"></nav><a class="membership" href="membership.html">Universal Membership</a></header><main class="shell"><section class="card"><div class="eyebrow">Member ratings</div><h1 class="title">Rate a Member</h1><div class="form"><input id="memberId" class="input" placeholder="Member UUID"><select id="rating" class="select"><option value="5">5 — Excellent</option><option value="4">4 — Great</option><option value="3">3 — Good</option><option value="2">2 — Fair</option><option value="1">1 — Poor</option></select><textarea id="review" class="textarea" placeholder="Optional review"></textarea><button class="btn primary" onclick="rateMember()">Submit Rating</button><div id="ratingMsg" class="muted"></div></div></section><script>async function rateMember(){if(!cs.user)return;const r=await cs.client.from('crowspace_member_ratings').upsert({rater_id:cs.user.id,member_id:memberId.value,rating:Number(rating.value),review:review.value,updated_at:new Date().toISOString()});ratingMsg.textContent=r.error?r.error.message:'Rating saved.'}</script><div class="footer">CrowRules Entertainment · CrowSpace · One Account · One Universe</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/crowrules-membership.js"></script><script src="js/crowspace.js"></script></body></html>

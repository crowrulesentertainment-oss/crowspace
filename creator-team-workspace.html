<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Team Workspace 6.4 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1150px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{background:var(--p2);border:1px solid #292e42;border-radius:15px;padding:15px}.muted{color:var(--m)}.tag{font-size:10px;color:#8ff6ff;letter-spacing:.1em;font-weight:800}input,textarea,select{width:100%;background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px;padding:11px}textarea{min-height:85px}.empty{text-align:center;padding:22px;color:var(--m)}.feed{display:grid;gap:9px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Team Workspace 6.4</span></div><div class="actions"><a class="btn" href="./creator-project-workspace.html">Tasks</a><a class="btn" href="./creator-invitations.html">Invitations</a><a class="btn" href="./creator-dashboard.html">Dashboard</a></div></div><section class="card"><label>Project</label><select id="pick"></select><div id="overview"></div></section><section class="grid"><section class="card"><h2>👥 Team</h2><div id="team" class="empty">Loading…</div></section><section class="card"><h2>⚡ Project Activity</h2><div id="activity" class="feed"><div class="empty">Loading…</div></div></section></section><section class="card"><h2>💬 Team Discussion</h2><textarea id="comment" placeholder="Share an update, question, idea, or decision…"></textarea><br><br><button class="btn primary" id="post">Post Update</button><span id="msg" class="muted"></span><div id="comments" class="feed" style="margin-top:15px"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me,projects=[],prof={};const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function load(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_projects").select("id,title,description,category,status").eq("owner_id",me.id).order("created_at",{ascending:false});projects=r.data||[];pick.innerHTML=projects.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join("")||'<option value="">No projects</option>';await render()}async function render(){const p=projects.find(x=>x.id===pick.value);overview.innerHTML=p?'<h1>'+esc(p.title)+'</h1><p class="muted">'+esc(p.description||"")+'</p><span class="tag">'+esc(p.category||"PROJECT")+' · '+esc(p.status||"active")+'</span>':'<div class="empty">Create a project first.</div>';if(!p)return;const m=await db.from("crowspace_project_members").select("project_id,user_id,role,status,created_at").eq("project_id",p.id);const ids=[me.id,...(m.data||[]).map(x=>x.user_id)];const pr=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",[...new Set(ids)]);prof={};(pr.data||[]).forEach(x=>prof[x.user_id]=x);team.innerHTML=(m.data||[]).filter(x=>x.status!=="declined").map(x=>'<div class="box"><b>'+esc(prof[x.user_id]?.display_name||prof[x.user_id]?.username||"Creator")+'</b><div class="muted">'+esc(x.role||"Collaborator")+' · '+esc(x.status)+'</div></div>').join("")||'<div class="empty">No collaborators yet.</div>';const a=await db.from("crowspace_project_activity").select("id,actor_id,activity_type,message,created_at").eq("project_id",p.id).order("created_at",{ascending:false}).limit(20);activity.innerHTML=(a.data||[]).map(x=>'<div class="box"><span class="tag">'+esc(x.activity_type)+'</span><p>'+esc(prof[x.actor_id]?.display_name||"Creator")+' — '+esc(x.message)+'</p><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div></div>').join("")||'<div class="empty">No activity yet.</div>';const c=await db.from("crowspace_project_comments").select("id,user_id,body,created_at").eq("project_id",p.id).order("created_at",{ascending:false}).limit(50);comments.innerHTML=(c.data||[]).map(x=>'<div class="box"><b>'+esc(prof[x.user_id]?.display_name||"Creator")+'</b><p>'+esc(x.body)+'</p><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div></div>').join("")||'<div class="empty">Start the discussion.</div>'}pick.onchange=render;post.onclick=async()=>{if(!pick.value||!comment.value.trim())return;let r=await db.from("crowspace_project_comments").insert({project_id:pick.value,user_id:me.id,body:comment.value.trim()});if(!r.error)await db.from("crowspace_project_activity").insert({project_id:pick.value,actor_id:me.id,activity_type:"discussion",message:"Posted a team update."});msg.textContent=r.error?r.error.message:"Update posted.";if(!r.error){comment.value="";render()}};load();</script></body></html>

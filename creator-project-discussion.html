<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Discussion Room 7.2 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.box{background:var(--p2);border:1px solid #292e42;border-radius:15px;padding:15px}.muted{color:var(--m)}.tag{font-size:10px;color:#8ff6ff;letter-spacing:.12em;font-weight:800}.msg{margin:9px 0;padding:12px;border-bottom:1px solid #292e42}.mine{border-left:3px solid #20e6ff;padding-left:12px}textarea,select{width:100%;background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px;padding:11px}textarea{min-height:100px}.live{color:#8ff6ff;font-weight:800}.empty{text-align:center;padding:22px;color:var(--m)}</style></head><body><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Discussion Room 7.2</span></div><div class="actions"><a class="btn" href="./creator-project-dashboard.html">Dashboard</a><a class="btn" href="./creator-project-workspace.html">Tasks</a><a class="btn" href="./creator-project-milestones.html">Milestones</a><a class="btn" href="./creator-team-workspace.html">Team</a></div></div><section class="card"><label>Project</label><select id="pick"></select><div id="hero"></div><div id="live" class="live">● Connecting…</div></section><section class="card"><h2>💬 Team Discussion</h2><p class="muted">Real-time project conversation. Mention a task or milestone by selecting a context below.</p><div class="actions"><select id="context"><option value="">No context</option></select></div><br><textarea id="body" maxlength="5000" placeholder="Share an update, question, decision, or production note…"></textarea><br><br><button class="btn primary" id="send">Post Update</button> <span id="msg" class="muted"></span></section><section class="card"><h2>🗣️ Conversation</h2><div id="feed"><div class="empty">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let me,projects=[],profiles={},channel;async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_projects").select("id,title,description,status").eq("owner_id",me.id).order("created_at",{ascending:false});projects=r.data||[];pick.innerHTML=projects.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join("")||'<option value="">No projects</option>';await render();connect()}async function render(){const p=projects.find(x=>x.id===pick.value);if(!p){hero.innerHTML="<h1>No project</h1>";feed.innerHTML='<div class="empty">Create a project first.</div>';return}hero.innerHTML='<h1>'+esc(p.title)+'</h1><p class="muted">'+esc(p.description||"")+'</p>';const [cr,tr,mr,pr]=await Promise.all([db.from("crowspace_project_comments").select("id,user_id,body,created_at").eq("project_id",p.id).order("created_at",{ascending:false}).limit(100),db.from("crowspace_project_tasks").select("id,title,status").eq("project_id",p.id).order("created_at",{ascending:false}),db.from("crowspace_project_milestones").select("id,title,status,stage").eq("project_id",p.id).order("sort_order"),db.from("crowspace_profiles").select("user_id,display_name,username,avatar_url").limit(100)]);const allProfiles=pr.data||[];profiles={};allProfiles.forEach(x=>profiles[x.user_id]=x);context.innerHTML='<option value="">No context</option><optgroup label="Tasks">'+(tr.data||[]).map(x=>'<option value="task:'+x.id+'">Task: '+esc(x.title)+'</option>').join("")+'</optgroup><optgroup label="Milestones">'+(mr.data||[]).map(x=>'<option value="milestone:'+x.id+'">Milestone: '+esc(x.title)+'</option>').join("")+'</optgroup>';feed.innerHTML=(cr.data||[]).map(x=>{const u=profiles[x.user_id]||{};return '<article class="msg '+(x.user_id===me.id?"mine":"")+'"><span class="tag">'+esc(u.display_name||u.username||"Creator")+'</span><p>'+esc(x.body)+'</p><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div></article>'}).join("")||'<div class="empty">No discussion yet. Start the conversation.</div>'}function connect(){if(channel)db.removeChannel(channel);channel=db.channel("project-discussion-"+pick.value).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_project_comments",filter:"project_id=eq."+pick.value},render).subscribe(s=>live.textContent=s==="SUBSCRIBED"?"● LIVE — Discussion updates automatically":"● "+s)}pick.onchange=()=>{render();connect()};send.onclick=async()=>{if(!pick.value||!body.value.trim()){msg.textContent="Choose a project and write an update.";return}const r=await db.from("crowspace_project_comments").insert({project_id:pick.value,user_id:me.id,body:body.value.trim()});if(r.error){msg.textContent=r.error.message;return}const c=context.value;let suffix="";if(c){const [type,id]=c.split(":");suffix=" ["+type+" reference: "+id+"]"}await db.from("crowspace_project_activity").insert({project_id:pick.value,actor_id:me.id,activity_type:"discussion",message:"Posted a project discussion update."+suffix});body.value="";context.value="";msg.textContent="Update posted.";render()};init();</script></body></html>

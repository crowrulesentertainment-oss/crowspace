</head><body data-crowrules-division="crowspace"><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Discussion Room 7.3</span></div><div class="actions"><a class="btn" href="./creator-project-dashboard.html">Dashboard</a><a class="btn" href="./creator-project-workspace.html">Tasks</a><a class="btn" href="./creator-project-milestones.html">Milestones</a><a class="btn" href="./creator-notifications.html">Notifications</a></div></div><section class="card"><label>Project</label><select id="pick"></select><div id="hero"></div><div id="live" class="live">● Connecting…</div></section><section class="card"><h2>💬 Team Discussion</h2><p class="muted">Mention collaborators and attach each update to a task or milestone.</p><label>Context</label><select id="context"><option value="">No context</option></select><br><br><label>Notify collaborators</label><select id="mentions" multiple size="4"></select><small class="muted">Hold Ctrl/Cmd to select multiple creators.</small><br><br><textarea id="body" maxlength="5000" placeholder="Share an update, question, decision, or production note…"></textarea><br><br><button class="btn primary" id="send">Post Update</button> <span id="msg" class="muted"></span></section><section class="card"><h2>🔔 Recent Project Mentions</h2><div id="mentionFeed"></div></section><section class="card"><h2>🗣️ Conversation</h2><div id="feed"><div class="empty">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const E=id=>document.getElementById(id);let me,projects=[],profiles={},channel;async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_projects").select("id,title,description,status").eq("owner_id",me.id).order("created_at",{ascending:false});projects=r.data||[];E("pick").innerHTML=projects.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join("")||'<option value="">No projects</option>';await render();connect()}async function render(){const p=projects.find(x=>x.id===E("pick").value);if(!p){E("hero").innerHTML="<h1>No project</h1>";return}E("hero").innerHTML='<h1>'+esc(p.title)+'</h1><p class="muted">'+esc(p.description||"")+'</p>';const [cr,tr,mr,tm,pr]=await Promise.all([db.from("crowspace_project_comments").select("id,user_id,body,created_at,mention_user_ids,context_type,context_id").eq("project_id",p.id).order("created_at",{ascending:false}).limit(100),db.from("crowspace_project_tasks").select("id,title,status").eq("project_id",p.id),db.from("crowspace_project_milestones").select("id,title,status,stage").eq("project_id",p.id).order("sort_order"),db.from("crowspace_project_members").select("user_id,role,status").eq("project_id",p.id).in("status",["active","accepted"]),db.from("crowspace_profiles").select("user_id,display_name,username,avatar_url")]);profiles={};(pr.data||[]).forEach(x=>profiles[x.user_id]=x);const teamIds=[...new Set([me.id,...(tm.data||[]).map(x=>x.user_id)])];E("mentions").innerHTML=teamIds.filter(id=>id!==me.id).map(id=>'<option value="'+id+'">'+esc(profiles[id]?.display_name||profiles[id]?.username||"Creator")+'</option>').join("")||'<option disabled>No collaborators yet</option>';E("context").innerHTML='<option value="">No context</option><optgroup label="Tasks">'+(tr.data||[]).map(x=>'<option value="task:'+x.id+'">Task: '+esc(x.title)+'</option>').join("")+'</optgroup><optgroup label="Milestones">'+(mr.data||[]).map(x=>'<option value="milestone:'+x.id+'">Milestone: '+esc(x.title)+'</option>').join("")+'</optgroup>';const comments=cr.data||[];E("feed").innerHTML=comments.map(x=>{const u=profiles[x.user_id]||{};const names=(x.mention_user_ids||[]).map(id=>profiles[id]?.display_name||profiles[id]?.username||"Creator");return '<article class="msg '+(x.user_id===me.id?"mine":"")+'"><span class="tag">'+esc(u.display_name||u.username||"Creator")+'</span>'+(names.length?'<div>'+names.map(n=>'<span class="pill mention">@'+esc(n)+'</span>').join("")+'</div>':"")+'<p>'+esc(x.body)+'</p><div class="muted">'+new Date(x.created_at).toLocaleString()+(x.context_type?" · "+esc(x.context_type):"")+'</div></article>'}).join("")||'<div class="empty">No discussion yet.</div>';const mentioned=comments.filter(x=>(x.mention_user_ids||[]).includes(me.id));E("mentionFeed").innerHTML=mentioned.map(x=>'<div class="msg"><b>'+esc(profiles[x.user_id]?.display_name||"Creator")+'</b> mentioned you.<p>'+esc(x.body)+'</p><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div></div>').join("")||'<div class="muted">No recent mentions for you in this project.</div>'}function connect(){if(channel)db.removeChannel(channel);channel=db.channel("project-discussion-73-"+E("pick").value).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_project_comments",filter:"project_id=eq."+E("pick").value},render).subscribe(s=>E("live").textContent=s==="SUBSCRIBED"?"● LIVE — Discussion & mentions update automatically":"● "+s)}E("pick").onchange=()=>{render();connect()};E("send").onclick=async()=>{const text=E("body").value.trim();if(!E("pick").value||!text){E("msg").textContent="Choose a project and write an update.";return}const ids=[...E("mentions").selectedOptions].map(o=>o.value);let contextType=null,contextId=null;if(E("context").value){[contextType,contextId]=E("context").value.split(":")}const r=await db.from("crowspace_project_comments").insert({project_id:E("pick").value,user_id:me.id,body:text,mention_user_ids:ids,context_type:contextType,context_id:contextId});if(r.error){E("msg").textContent=r.error.message;return}await db.from("crowspace_project_activity").insert({project_id:E("pick").value,actor_id:me.id,activity_type:"discussion",message:ids.length?"Posted an update and mentioned "+ids.length+" collaborator(s).":"Posted a project discussion update."});for(const uid of ids){await db.from("crowspace_notifications").insert({user_id:uid,type:"project_mention",actor_id:me.id,reference_id:E("pick").value,message:"You were mentioned in a CrowSpace project discussion.",is_read:false})}E("body").value="";E("context").value="";[...E("mentions").options].forEach(o=>o.selected=false);E("msg").textContent=ids.length?"Update posted and notifications sent.":"Update posted.";render()};init();</script><script src="./js/crowspace-holiday-themes.js"></script>

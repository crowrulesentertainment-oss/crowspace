<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Reels</title><link rel="stylesheet" href="style.css"><style>body{margin:0}.reels{height:calc(100vh - 58px);overflow-y:auto;scroll-snap-type:y mandatory}.reel{position:relative;height:calc(100vh - 58px);max-width:520px;margin:auto;scroll-snap-align:start;background:#000;overflow:hidden}.reel video{width:100%;height:100%;object-fit:cover}.caption{position:absolute;left:14px;right:82px;bottom:20px;padding:45px 0 8px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-weight:700}.actions{position:absolute;right:12px;bottom:70px;display:grid;gap:9px}.actions button{border:1px solid var(--line);background:rgba(5,6,10,.82);color:var(--text);border-radius:999px;padding:10px;cursor:pointer}.creator{position:absolute;left:14px;bottom:74px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:999px;background:rgba(5,6,10,.84);color:var(--text);text-decoration:none}.creator img{width:30px;height:30px;border-radius:50%;object-fit:cover}.creatorMeta{display:block;color:var(--muted);font-size:8px;margin-top:2px}.verified{color:var(--cyan);font-size:10px}.memberBadge{color:var(--purple);font-size:8px;margin-left:4px}.follow{position:absolute;left:14px;bottom:125px;border:1px solid var(--cyan);background:rgba(5,6,10,.88);color:var(--cyan);border-radius:999px;padding:7px 11px;font:700 9px Orbitron}.actions button.active{border-color:var(--cyan);color:var(--cyan)}.comments{position:absolute;left:0;right:0;bottom:0;max-height:52%;background:rgba(5,6,10,.97);border-top:1px solid var(--line);padding:14px;transform:translateY(100%);transition:.25s;z-index:8}.comments.open{transform:translateY(0)}.commentsList{max-height:220px;overflow:auto}.comment{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.comment small{color:var(--muted)}.commentForm{display:flex;gap:6px;margin-top:8px}.commentForm input{flex:1;min-width:0;background:#090c12;border:1px solid var(--line);color:var(--text);padding:9px;border-radius:8px}.commentForm button{border:1px solid var(--cyan);background:transparent;color:var(--cyan);border-radius:8px;padding:8px 11px}</style></head><body><header class="topbar"><a href="index.html">FEED</a><a href="discover.html">DISCOVER</a><a href="media.html">MEDIA</a><a href="reels.html">REELS</a><a href="notifications.html">NOTIFICATIONS</a><a href="reel-analytics.html">ANALYTICS</a></header><main id="reels" class="reels"></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
const feed=document.getElementById("reels");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const liveChannels={};const watchTimers={};
const following=new Set();const viewed=new Set();const interestScore={};
let session=null;

async function getRows(){
  const {data}=await db.from("crowspace_posts").select("id,user_id,body,media_url,created_at").not("media_url","is",null).order("created_at",{ascending:false}).limit(200);
  return (data||[]).filter(x=>/\.(mp4|webm|mov)(\?|$)/i.test(x.media_url));
}
async function getFollowing(){
  const {data:{session:s}}=await db.auth.getSession(); session=s;
  if(!session)return;
  const {data}=await db.from("crowspace_follows").select("followed_user_id").eq("follower_id",session.user.id);
  (data||[]).forEach(x=>following.add(x.followed_user_id));const {data:views}=await db.from("crowspace_reel_views").select("reel_id,watched_seconds").eq("user_id",session.user.id);(views||[]).forEach(x=>{viewed.add(x.reel_id);interestScore[x.reel_id]=(interestScore[x.reel_id]||0)+Math.min(10,Math.floor((x.watched_seconds||0)/5))});
}
async function buildScores(rows){if(!session)return;const [{data:likes},{data:views},{data:saves},{data:reposts}]=await Promise.all([db.from("crowspace_social_interactions").select("target_id").eq("user_id",session.user.id).eq("interaction_type","like").eq("target_type","post"),db.from("crowspace_reel_views").select("reel_id").eq("user_id",session.user.id),db.from("crowspace_social_interactions").select("target_id").eq("user_id",session.user.id).eq("interaction_type","save").eq("target_type","post"),db.from("crowspace_social_interactions").select("target_id").eq("user_id",session.user.id).eq("interaction_type","repost").eq("target_type","post")]);(likes||[]).forEach(x=>interestScore[x.target_id]=(interestScore[x.target_id]||0)+6);(saves||[]).forEach(x=>interestScore[x.target_id]=(interestScore[x.target_id]||0)+5);(reposts||[]).forEach(x=>interestScore[x.target_id]=(interestScore[x.target_id]||0)+4);(views||[]).forEach(x=>interestScore[x.reel_id]=(interestScore[x.reel_id]||0)+1)}function render(rows,profiles){
  const sorted=[...rows].sort((a,b)=>{
    const af=following.has(a.user_id),bf=following.has(b.user_id);
    if(af!==bf)return af?-1:1;
    return new Date(b.created_at)-new Date(a.created_at);
  });
  feed.innerHTML=sorted.map(x=>'<article class="reel" data-id="'+x.id+'" data-user="'+x.user_id+'"><video src="'+esc(x.media_url)+'" muted loop playsinline preload="metadata"></video><div class="actions"><button data-act="like">♥ <span>0</span></button><button data-act="comment">💬 <span>0</span></button><button data-act="repost">↗ <span>0</span></button><button data-act="save">🔖 <span>0</span></button></div><a class="creator" href="profile.html?u='+x.user_id+'">'+(profiles[x.user_id]?.avatar_url?'<img src="'+esc(profiles[x.user_id].avatar_url)+'" alt="">':'<span>CR</span>')+'<span><b>'+esc(profiles[x.user_id]?.display_name||profiles[x.user_id]?.username||"CREATOR")+'</b><small class="creatorMeta" data-meta="'+x.user_id+'"> · loading…</small></span></a><button class="follow" data-follow="'+x.user_id+'">'+(following.has(x.user_id)?"FOLLOWING":"FOLLOW")+'</button><section class="comments"><div class="commentsList">Loading…</div><form class="commentForm"><input maxlength="500" placeholder="Add a comment…"><button>SEND</button></form></section><div class="caption">'+esc(x.body||"Video Caw")+(following.has(x.user_id)?'<br><small style="color:var(--cyan)">FROM YOUR NETWORK</small>':"")+'</div></article>').join("");
  feed.querySelectorAll(".reel").forEach(card=>{refresh(card);loadCreatorMeta(card);subscribeLive(card)});
  const ob=new IntersectionObserver(es=>es.forEach(e=>{const card=e.target,v=card.querySelector("video");if(e.isIntersecting){v.play().catch(()=>{});recordView(card)}else {v.pause();if(watchTimers[card.dataset.id]){clearInterval(watchTimers[card.dataset.id]);delete watchTimers[card.dataset.id]}}}),{threshold:.7});
  feed.querySelectorAll(".reel").forEach(x=>ob.observe(x));
}
async function recordView(card){if(!session)return;const id=card.dataset.id;let viewId=card.dataset.viewId||null;if(!viewId){const {data:existing}=await db.from("crowspace_reel_views").select("id").eq("reel_id",id).eq("user_id",session.user.id).order("created_at",{ascending:false}).limit(1).maybeSingle();if(existing){viewId=existing.id;card.dataset.viewId=viewId;viewed.add(id)}else{const {data:created}=await db.from("crowspace_reel_views").insert({reel_id:id,user_id:session.user.id,watched_seconds:0}).select("id").single();if(created){viewId=created.id;card.dataset.viewId=viewId;viewed.add(id)}}}if(watchTimers[id])return;let lastTime=null,lastTick=Date.now();watchTimers[id]=setInterval(async()=>{const v=card.querySelector("video");if(!v||v.paused||document.hidden){lastTime=null;lastTick=Date.now();return}const now=Date.now(),current=Number(v.currentTime)||0;if(lastTime!==null){const elapsed=Math.min(3,Math.max(0,(now-lastTick)/1000));const delta=current>=lastTime?elapsed:Math.min(elapsed,Math.max(0,current));if(delta>0&&viewId){const {data:row}=await db.from("crowspace_reel_views").select("watched_seconds").eq("id",viewId).maybeSingle();const total=Math.min(86400,Number(row?.watched_seconds||0)+delta);await db.from("crowspace_reel_views").update({watched_seconds:Math.floor(total)}).eq("id",viewId)}}lastTime=current;lastTick=now},3000)}async function refresh(card){for(const t of ["like","comment","repost","save"]){const {count}=await db.from("crowspace_social_interactions").select("id",{count:"exact",head:true}).eq("target_type","post").eq("target_id",card.dataset.id).eq("interaction_type",t);const s=card.querySelector('[data-act="'+t+'"] span');if(s)s.textContent=count||0}}
async function loadCreatorMeta(card){const uid=card.dataset.user;const [{count:followers},{count:reels},membership]=await Promise.all([db.from("crowspace_follows").select("follower_id",{count:"exact",head:true}).eq("followed_user_id",uid),db.from("crowspace_posts").select("id",{count:"exact",head:true}).eq("user_id",uid).not("media_url","is",null),db.from("crowspace_memberships").select("*",{count:"exact",head:true}).eq("user_id",uid).limit(1)]);const el=card.querySelector(".creatorMeta");if(el)el.innerHTML=" · "+(followers||0)+" followers · "+(reels||0)+" reels"+(membership.count?' <span class="memberBadge">MEMBER</span>':"")}
async function loadComments(card){const list=card.querySelector(".commentsList");const {data}=await db.from("crowspace_comments").select("user_id,body,created_at").eq("post_id",card.dataset.id).order("created_at",{ascending:true}).limit(50);list.innerHTML=(data||[]).map(x=>"<div class=\"comment\"><strong>Crow</strong> "+esc(x.body)+"<br><small>"+new Date(x.created_at).toLocaleString()+"</small></div>").join("")||"<small>No comments yet.</small>"}
async function subscribeLive(card){const id=card.dataset.id;if(liveChannels[id])return;liveChannels[id]=db.channel("reel-live-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"crowspace_comments",filter:"post_id=eq."+id},()=>loadComments(card)).on("postgres_changes",{event:"INSERT",schema:"public",table:"crowspace_social_interactions",filter:"target_id=eq."+id},()=>refresh(card)).on("postgres_changes",{event:"DELETE",schema:"public",table:"crowspace_social_interactions",filter:"target_id=eq."+id},()=>refresh(card)).subscribe()}
feed.addEventListener("click",async e=>{
  const f=e.target.closest("[data-follow]");
  if(f){const {data:{session:s}}=await db.auth.getSession();if(!s){location.href="login.html";return}const target=f.dataset.follow;if(target===s.user.id)return;const {data:old}=await db.from("crowspace_follows").select("follower_id").eq("follower_id",s.user.id).eq("followed_user_id",target).maybeSingle();if(old){await db.from("crowspace_follows").delete().eq("follower_id",s.user.id).eq("followed_user_id",target);following.delete(target);f.textContent="FOLLOW"}else{await db.from("crowspace_follows").insert({follower_id:s.user.id,followed_user_id:target});following.add(target);f.textContent="FOLLOWING"}return}
  const cb=e.target.closest('[data-act="comment"]');if(cb){const card=cb.closest(".reel"),panel=card.querySelector(".comments");panel.classList.toggle("open");if(panel.classList.contains("open")){loadComments(card);subscribeLive(card)}return}
  const form=e.target.closest(".commentForm");if(form){e.preventDefault();const {data:{session:s}}=await db.auth.getSession();if(!s){location.href="login.html";return}const card=form.closest(".reel"),input=form.querySelector("input"),body=input.value.trim();if(!body)return;await db.from("crowspace_comments").insert({post_id:card.dataset.id,user_id:s.user.id,body});input.value="";loadComments(card);return}
  const b=e.target.closest("[data-act]");if(!b)return;const {data:{session:s}}=await db.auth.getSession();if(!s){location.href="login.html";return}const card=b.closest(".reel"),type=b.dataset.act;const {data:old}=await db.from("crowspace_social_interactions").select("id").eq("target_type","post").eq("target_id",card.dataset.id).eq("user_id",s.user.id).eq("interaction_type",type).maybeSingle();if(old)await db.from("crowspace_social_interactions").delete().eq("id",old.id);else await db.from("crowspace_social_interactions").insert({target_type:"post",target_id:card.dataset.id,user_id:s.user.id,interaction_type:type});refresh(card)
});
async function run(){
  await getFollowing();
  const rows=await getRows();await buildScores(rows);
  const ids=[...new Set(rows.map(x=>x.user_id).filter(Boolean))];
  let profiles={};
  if(ids.length){const {data:p}=await db.from("crowspace_profiles").select("user_id,display_name,username,avatar_url").in("user_id",ids);(p||[]).forEach(x=>profiles[x.user_id]=x)}
  render(rows,profiles);
}
run();
</script></script></body></html>

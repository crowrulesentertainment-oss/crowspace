<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body><header class="topbar"></header><main class="page auth-page"><section class="panel auth-card"><span class="eyebrow">UNIVERSAL CROWRULES MEMBERSHIP</span><h1>Create your account.</h1><p class="muted">One Account. One Universe.</p><form id="signupForm"><label>Display name<input id="displayName" required placeholder="Your name"></label><label>Username<input id="username" required placeholder="@yourname"></label><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></label><button class="primary" type="submit">Create Account</button></form><div id="status" class="auth-status"></div><div class="auth-links"><a href="login.html">Already have an account?</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/navigation.js"></script><script src="js/crowspace-auth.js"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account — CrowSpace</title><link rel="stylesheet" href="crowspace-rebuild.css"><style>.oauth{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.oauth button{padding:10px;border:1px solid #ffffff18;border-radius:9px;background:#ffffff08;color:#fff;font-weight:800;font-size:9px;cursor:pointer}.oauth button:hover{border-color:#66e8ff}.oauth button[data-provider="facebook"]:hover{border-color:#1877f2}.or{text-align:center;color:#8192a6;font-size:8px;margin:8px}</style><link rel="stylesheet" href="crowspace-universal.css"><script src="crowspace-universal.js" defer></script><script src="js/crowspace-notification-badges.js" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=1" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script></head><body data-page="signup"><main class="shell"><div class="kicker">CROWRULES // ONE ACCOUNT // ONE UNIVERSE</div><section class="hero" style="max-width:560px;margin:8vh auto"><div class="eyebrow">CROWSPACE AUTH</div><h1>JOIN.</h1><div class="oauth"><button type="button" data-provider="google">GOOGLE</button><button type="button" data-provider="discord">DISCORD</button><button type="button" data-provider="twitch">TWITCH</button><button type="button" data-provider="facebook">FACEBOOK</button></div><div class="or">OR CREATE WITH EMAIL</div><form id="authForm"><div class="field"><label>Display name</label><input id="display" required autocomplete="name"></div><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn primary" type="submit">Create CrowSpace Account</button></form><p id="msg" class="status"></p><p class="muted">Already a member? <a href="login.html">Log in.</a></p></section></main><script src="crowspace-auth.js"></script><script src="crowspace-rebuild.js"></script><script>(async()=>{try{await window.CrowSpaceAuth?.ready;const db=window.CrowSpaceAuth?.client;if(!db)throw new Error('CrowSpace authentication is unavailable.');document.querySelectorAll('[data-provider]').forEach(b=>b.onclick=async()=>{const p=b.dataset.provider;const msg=document.getElementById('msg');msg.textContent='Connecting to '+p+'…';b.disabled=true;try{const r=await db.auth.signInWithOAuth({provider:p,options:{redirectTo:window.location.origin+window.location.pathname}});if(r.error)throw r.error}catch(e){msg.textContent=e?.message||'Social sign-up failed.';b.disabled=false}})}catch(e){document.getElementById('msg').textContent=e?.message||'Authentication failed to initialize.'}})()</script></body></html>

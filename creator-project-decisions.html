<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Decisions 7.4 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{background:var(--p2);border:1px solid #292e42;border-radius:15px;padding:15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.muted{color:var(--m)}.tag{font-size:10px;color:#8ff6ff;letter-spacing:.12em;font-weight:800}.open{border-color:#20e6ff}.approved{border-color:#72f0a6}.changes{border-color:#ffcc66}input,textarea,select{width:100%;background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px;padding:11px}textarea{min-height:75px}.empty{text-align:center;padding:22px;color:var(--m)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="./css/crowrules-cinematic.css">
</head><body data-crowrules-division="crowspace"><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Decision Center 7.4</span></div><div class="actions"><a class="btn" href="./creator-project-dashboard.html">Dashboard</a><a class="btn" href="./creator-project-discussion.html">Discussion</a><a class="btn" href="./creator-project-milestones.html">Milestones</a><a class="btn" href="./creator-notifications.html">Notifications</a></div></div><section class="card"><label>Project</label><select id="pick"></select><div id="hero"></div></section><section class="card"><h2>➕ Request a Decision</h2><div class="grid"><input id="title" maxlength="200" placeholder="Decision title"><select id="type"><option value="approval">Approval</option><option value="creative">Creative</option><option value="production">Production</option><option value="script">Script</option><option value="asset">Asset</option><option value="schedule">Schedule</option><option value="other">Other</option><input id="due" type="datetime-local"></div><br><textarea id="description" maxlength="5000" placeholder="What needs to be decided?"></textarea><br><br><button class="btn primary" id="add">Create Decision</button><span id="msg" class="muted"></span></section><section class="card"><h2>🧭 Decision Queue</h2><div id="list" class="grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const E=id=>document.getElementById(id);let me,projects=[],channel;const nice=s=>String(s||"").replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase());async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_projects").select("id,title,description,status").eq("owner_id",me.id).order("created_at",{ascending:false});projects=r.data||[];E("pick").innerHTML=projects.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join("")||'<option value="">No projects</option>';await render();connect()}async function render(){const p=projects.find(x=>x.id===E("pick").value);if(!p){E("hero").innerHTML="<h1>No project</h1>";E("list").innerHTML="";return}E("hero").innerHTML='<h1>'+esc(p.title)+'</h1><p class="muted">'+esc(p.description||"")+'</p>';const r=await db.from("crowspace_project_decisions").select("id,title,description,decision_type,status,created_by,decided_by,decision_note,decided_at,due_at,created_at").eq("project_id",p.id).order("created_at",{ascending:false});const ds=r.data||[];E("list").innerHTML=ds.map(d=>'<article class="box '+esc(d.status)+'"><span class="tag">'+nice(d.decision_type).toUpperCase()+' · '+nice(d.status).toUpperCase()+'</span><h3>'+esc(d.title)+'</h3><p class="muted">'+esc(d.description||"")+'</p><p class="muted">'+(d.due_at?"Decision requested by: "+new Date(d.due_at).toLocaleString():"No decision deadline")+'</p>'+(d.decision_note?'<p><b>Decision note:</b> '+esc(d.decision_note)+'</p>':"")+'<div class="actions">'+(d.status==="open"?'<button class="btn primary" onclick="decide(\''+d.id+'\',\'approved\')">Approve</button><button class="btn" onclick="decide(\''+d.id+'\',\'changes_requested\')">Request Changes</button><button class="btn" onclick="decide(\''+d.id+'\',\'cancelled\')">Cancel</button>':"")+'<button class="btn" onclick="removeDecision(\''+d.id+'\')">Delete</button></div></article>').join("")||'<div class="empty">No decisions yet.</div>'}function connect(){if(channel)db.removeChannel(channel);channel=db.channel("project-decisions-"+E("pick").value).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_project_decisions",filter:"project_id=eq."+E("pick").value},render).subscribe()}E("pick").onchange=()=>{render();connect()};E("add").onclick=async()=>{if(!E("pick").value||!E("title").value.trim()){E("msg").textContent="Project and title are required.";return}const data={project_id:E("pick").value,created_by:me.id,title:E("title").value.trim(),description:E("description").value.trim()||null,decision_type:E("type").value,due_at:E("due").value?new Date(E("due").value).toISOString():null};const r=await db.from("crowspace_project_decisions").insert(data);if(r.error){E("msg").textContent=r.error.message;return}await db.from("crowspace_project_activity").insert({project_id:E("pick").value,actor_id:me.id,activity_type:"decision",message:"Created decision request: "+data.title});E("title").value="";E("description").value="";E("due").value="";E("msg").textContent="Decision request created.";render()};async function decide(id,status){const note=prompt(status==="approved"?"Approval note (optional):":"Reason / requested changes (optional):","");const r=await db.from("crowspace_project_decisions").update({status,decided_by:me.id,decision_note:note||null,decided_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq("id",id);if(r.error){alert(r.error.message);return}const d=(await db.from("crowspace_project_decisions").select("project_id,title,created_by").eq("id",id).single()).data;if(d){await db.from("crowspace_project_activity").insert({project_id:d.project_id,actor_id:me.id,activity_type:"decision",message:"Decision updated: "+d.title+" → "+nice(status)});if(d.created_by!==me.id)await db.from("crowspace_notifications").insert({user_id:d.created_by,type:"project_decision",actor_id:me.id,reference_id:id,message:"A project decision was "+nice(status)+".",is_read:false})}render()}async function removeDecision(id){if(!confirm("Delete this decision request?"))return;const r=await db.from("crowspace_project_decisions").delete().eq("id",id);if(r.error)alert(r.error.message);else render()}init();</script><script src="./js/crowspace-holiday-themes.js"></script>
<script src="./js/crowrules-cinematic.js"></script>
</body></html>

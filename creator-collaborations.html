<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Collaborations 6.0 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{background:var(--p2);border:1px solid #292e42;border-radius:15px;padding:15px}.muted{color:var(--m)}.tag{font-size:10px;color:#8ff6ff;letter-spacing:.1em;font-weight:800}.empty{text-align:center;padding:25px;color:var(--m)}input,textarea,select{width:100%;box-sizing:border-box;background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px;padding:11px}textarea{min-height:90px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">🤝 CrowSpace <span class="accent">Creator Collaborations 6.0</span></div><a class="btn" href="./creator-dashboard.html">← Command Center</a></div><section class="card"><h1>🤝 Collaboration Hub</h1><p class="muted">Turn creator connections into real projects, podcasts, shows, and CrowRules Universe work.</p><div class="actions"><a class="btn primary" href="./creator-community.html">Discover Creators</a><a class="btn" href="./creator-notifications.html">Engagement Inbox</a></div></section><section class="card"><h2>➕ Invite a Creator</h2><div class="grid"><div><label>Creator user ID</label><input id="inviteId" placeholder="Paste creator UUID"></div><div><label>Role</label><select id="role"><option>Collaborator</option><option>Co-Creator</option><option>Producer</option><option>Writer</option><option>Host</option><option>Editor</option></select></div><div style="grid-column:1/-1"><label>Project / opportunity</label><input id="title" placeholder="What are you inviting them to build?"></div><div style="grid-column:1/-1"><label>Message</label><textarea id="message" placeholder="Tell the creator what you want to build together…"></textarea></div></div><button class="btn primary" id="send">Send Collaboration Invitation</button><span id="msg" class="muted"></span></section><section class="grid"><section class="card"><h2>📨 Invitations To Me</h2><div id="incoming" class="empty">Loading…</div></section><section class="card"><h2>📤 My Invitations</h2><div id="outgoing" class="empty">Loading…</div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me,rows=[],profiles={};const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function load(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_project_members").select("project_id,user_id,role,status,created_at").or("user_id.eq."+me.id+",status.eq.pending").order("created_at",{ascending:false});rows=r.data||[];const ids=[...new Set(rows.map(x=>x.user_id))];if(ids.length){const p=await db.from("crowspace_profiles").select("user_id,username,display_name").in("user_id",ids);profiles={};(p.data||[]).forEach(x=>profiles[x.user_id]=x)}render()}function render(){const mine=rows.filter(x=>x.user_id===me.id);const sent=rows.filter(x=>x.user_id!==me.id&&x.status==="pending");incoming.innerHTML=mine.map(x=>item(x,true)).join("")||'<div class="empty">No pending invitations.</div>';outgoing.innerHTML=sent.map(x=>item(x,false)).join("")||'<div class="empty">No pending invitations sent from this account.</div>'}function item(x,inc){const p=profiles[x.user_id]||{};return '<div class="box"><span class="tag">'+esc(x.status||"INVITATION")+'</span><h3>'+esc(p.display_name||p.username||"Creator")+'</h3><p class="muted">Role: '+esc(x.role||"Collaborator")+'</p>'+(inc?'<div class="actions"><button class="btn primary" onclick="respond(\''+x.project_id+'\',\''+x.user_id+'\',\'accepted\')">Accept</button><button class="btn" onclick="respond(\''+x.project_id+'\',\''+x.user_id+'\',\'declined\')">Decline</button></div>':'')+'</div>'}async function respond(project,user,status){const r=await db.from("crowspace_project_members").update({status}).eq("project_id",project).eq("user_id",user);if(r.error)alert(r.error.message);else load()}send.onclick=async()=>{const uid=inviteId.value.trim(),t=title.value.trim();if(!uid||!t){msg.textContent="Creator ID and project are required.";return}const r=await db.from("crowspace_project_members").insert({project_id:crypto.randomUUID(),user_id:uid,role:role.value,status:"pending"});if(r.error){msg.textContent=r.error.message;return}msg.textContent="Invitation created.";inviteId.value=title.value=message.value="";load()};load();</script><script src="./js/crowspace-holiday-themes.js"></script>

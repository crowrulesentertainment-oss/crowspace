<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Project Workspace 6.3 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{background:var(--p2);border:1px solid #292e42;border-radius:15px;padding:15px}.muted{color:var(--m)}.tag{font-size:10px;color:#8ff6ff;letter-spacing:.1em;font-weight:800}input,textarea,select{width:100%;background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px;padding:11px}textarea{min-height:80px}.empty{text-align:center;padding:20px;color:var(--m)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Project Workspace 6.3</span></div><div class="actions"><a class="btn" href="./creator-projects.html">Projects</a><a class="btn" href="./creator-invitations.html">Invitations</a><a class="btn" href="./creator-dashboard.html">Dashboard</a></div></div><section class="card"><label>Project</label><select id="pick"></select><div id="overview"></div></section><section class="card"><h2>➕ Add Task</h2><div class="grid"><div><input id="title" placeholder="Task title"></div><div><select id="priority"><option>normal</option><option>low</option><option>high</option><option>urgent</option></select></div></div><br><textarea id="description" placeholder="What needs to happen?"></textarea><br><br><button class="btn primary" id="add">Add Task</button><span id="msg" class="muted"></span></section><section class="card"><h2>📋 Project Tasks</h2><div id="tasks" class="grid"><div class="empty">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me,projects=[];const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function load(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_projects").select("id,title,description,category,status").eq("owner_id",me.id).order("created_at",{ascending:false});projects=r.data||[];pick.innerHTML=projects.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join("")||'<option value="">No projects</option>';await render()}async function render(){const p=projects.find(x=>x.id===pick.value);overview.innerHTML=p?'<h1>'+esc(p.title)+'</h1><p class="muted">'+esc(p.description||"")+'</p><span class="tag">'+esc(p.category||"PROJECT")+' · '+esc(p.status||"active")+'</span>':'<div class="empty">Create a project first.</div>';if(!p){tasks.innerHTML='<div class="empty">No project selected.</div>';return}const r=await db.from("crowspace_project_tasks").select("id,title,description,status,priority,due_at,created_at,assigned_to").eq("project_id",p.id).order("created_at",{ascending:false});tasks.innerHTML=(r.data||[]).map(t=>'<article class="box"><span class="tag">'+esc(t.status)+' · '+esc(t.priority)+'</span><h3>'+esc(t.title)+'</h3><p class="muted">'+esc(t.description||"")+'</p><div class="actions"><select onchange="setStatus(\''+t.id+'\',this.value)"><option '+(t.status==="todo"?"selected":"")+'>todo</option><option '+(t.status==="in_progress"?"selected":"")+'>in_progress</option><option '+(t.status==="blocked"?"selected":"")+'>blocked</option><option '+(t.status==="done"?"selected":"")+'>done</option></select><button class="btn" onclick="removeTask(\''+t.id+'\')">Delete</button></div></article>').join("")||'<div class="empty">No tasks yet. Add the first task for this project.</div>'}pick.onchange=render;add.onclick=async()=>{if(!pick.value||!title.value.trim()){msg.textContent="Choose a project and enter a task title.";return}const r=await db.from("crowspace_project_tasks").insert({project_id:pick.value,created_by:me.id,title:title.value.trim(),description:description.value.trim()||null,priority:priority.value});msg.textContent=r.error?r.error.message:"Task added.";if(!r.error){title.value="";description.value="";render()}};async function setStatus(id,status){const r=await db.from("crowspace_project_tasks").update({status,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)alert(r.error.message);else render()}async function removeTask(id){if(!confirm("Delete this task?"))return;const r=await db.from("crowspace_project_tasks").delete().eq("id",id);if(r.error)alert(r.error.message);else render()}load();</script></body></html>

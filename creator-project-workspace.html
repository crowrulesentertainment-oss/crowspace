<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Project Workspace 6.9 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1150px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{background:var(--p2);border:1px solid #292e42;border-radius:15px;padding:15px}.muted{color:var(--m)}.tag{font-size:10px;color:#8ff6ff;letter-spacing:.1em;font-weight:800}.overdue{border-color:#ff6b8a}input,textarea,select{width:100%;background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px;padding:11px}textarea{min-height:80px}.empty{text-align:center;padding:20px;color:var(--m)}.live{color:#8ff6ff;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Live Project Workspace 6.9</span></div><div class="actions"><a class="btn" href="./creator-project-assets.html">Assets</a><a class="btn" href="./creator-team-workspace.html">Team</a><a class="btn" href="./creator-calendar.html">Calendar</a></div></div><section class="card"><label>Project</label><select id="pick"></select><div id="overview"></div><div id="live" class="live">● Connecting to live workspace…</div></section><section class="card"><h2>➕ Create & Assign Task</h2><div class="grid"><input id="title" placeholder="Task title"><select id="priority"><option>normal</option><option>low</option><option>high</option><option>urgent</option></select><select id="assignee"><option value="">Unassigned</option></select><input id="due" type="datetime-local"></div><br><textarea id="description" placeholder="What needs to happen?"></textarea><br><br><button class="btn primary" id="add">Create Task</button> <span id="msg" class="muted"></span></section><section class="card"><h2>📋 Live Tasks</h2><div id="stats" class="muted"></div><div id="tasks" class="grid"><div class="empty">Loading…</div></div></section><section class="card"><h2>⚡ Live Activity</h2><div id="activity" class="grid"><div class="empty">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let me,projects=[],members=[],profiles={},channel;async function load(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_projects").select("id,title,description,category,status").eq("owner_id",me.id).order("created_at",{ascending:false});projects=r.data||[];pick.innerHTML=projects.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join("")||'<option value="">No projects</option>';await render();connect()}async function render(){const p=projects.find(x=>x.id===pick.value);overview.innerHTML=p?'<h1>'+esc(p.title)+'</h1><p class="muted">'+esc(p.description||"")+'</p>':"";if(!p){tasks.innerHTML='<div class="empty">Create a project first.</div>';return}const mr=await db.from("crowspace_project_members").select("user_id,role,status").eq("project_id",p.id).in("status",["active","accepted"]);members=mr.data||[];const ids=[me.id,...members.map(x=>x.user_id)],pr=await db.from("crowspace_profiles").select("user_id,display_name,username").in("user_id",[...new Set(ids)]);profiles={};(pr.data||[]).forEach(x=>profiles[x.user_id]=x);assignee.innerHTML='<option value="">Unassigned</option>'+members.map(x=>'<option value="'+x.user_id+'">'+esc(profiles[x.user_id]?.display_name||profiles[x.user_id]?.username||"Creator")+' · '+esc(x.role||"Member")+'</option>').join("");const tr=await db.from("crowspace_project_tasks").select("id,title,description,status,priority,due_at,assigned_to").eq("project_id",p.id).order("due_at",{ascending:true,nullsFirst:false});const ts=tr.data||[],now=Date.now();stats.textContent=ts.length+" tasks · "+ts.filter(x=>x.status==="done").length+" done · "+ts.filter(x=>x.status!=="done"&&x.due_at&&new Date(x.due_at).getTime()<now).length+" overdue";tasks.innerHTML=ts.map(t=>{const overdue=t.status!=="done"&&t.due_at&&new Date(t.due_at).getTime()<now;return '<article class="box '+(overdue?"overdue":"")+'"><span class="tag">'+esc(t.status)+' · '+esc(t.priority)+(overdue?" · OVERDUE":"")+'</span><h3>'+esc(t.title)+'</h3><p class="muted">'+esc(t.description||"")+'</p><p>👤 '+esc(profiles[t.assigned_to]?.display_name||profiles[t.assigned_to]?.username||"Unassigned")+'</p><p class="muted">Due: '+(t.due_at?new Date(t.due_at).toLocaleString():"No deadline")+'</p><div class="actions"><select onchange="setStatus(\''+t.id+'\',this.value)"><option '+(t.status==="todo"?"selected":"")+'>todo</option><option '+(t.status==="in_progress"?"selected":"")+'>in_progress</option><option '+(t.status==="blocked"?"selected":"")+'>blocked</option><option '+(t.status==="done"?"selected":"")+'>done</option></select><select onchange="assign(\''+t.id+'\',this.value)"><option value="">Unassigned</option>'+members.map(m=>'<option value="'+m.user_id+'" '+(m.user_id===t.assigned_to?"selected":"")+'>'+esc(profiles[m.user_id]?.display_name||profiles[m.user_id]?.username||"Creator")+'</option>').join("")+'</select><button class="btn" onclick="removeTask(\''+t.id+'\')">Delete</button></div></article>'}).join("")||'<div class="empty">No tasks yet.</div>';const a=await db.from("crowspace_project_activity").select("actor_id,activity_type,message,created_at").eq("project_id",p.id).order("created_at",{ascending:false}).limit(20);activity.innerHTML=(a.data||[]).map(x=>'<div class="box"><span class="tag">'+esc(x.activity_type)+'</span><p>'+esc(profiles[x.actor_id]?.display_name||"Creator")+' — '+esc(x.message)+'</p><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div></div>').join("")||'<div class="empty">No activity yet.</div>'}async function activityLog(message){await db.from("crowspace_project_activity").insert({project_id:pick.value,actor_id:me.id,activity_type:"task",message})}function connect(){if(channel)db.removeChannel(channel);channel=db.channel("project-workspace-"+pick.value).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_project_tasks",filter:"project_id=eq."+pick.value},()=>render()).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_project_activity",filter:"project_id=eq."+pick.value},()=>render()).subscribe(s=>live.textContent=s==="SUBSCRIBED"?"● LIVE — Workspace updates automatically":"● "+s)}pick.onchange=()=>{render();connect()};add.onclick=async()=>{if(!pick.value||!title.value.trim()){msg.textContent="Choose a project and enter a title.";return}const data={project_id:pick.value,created_by:me.id,assigned_to:assignee.value||null,title:title.value.trim(),description:description.value.trim()||null,priority:priority.value,due_at:due.value?new Date(due.value).toISOString():null};const r=await db.from("crowspace_project_tasks").insert(data);msg.textContent=r.error?r.error.message:"Task created.";if(!r.error){await activityLog("Created task: "+data.title);title.value="";description.value="";due.value="";assignee.value="";render()}}async function setStatus(id,status){const r=await db.from("crowspace_project_tasks").update({status,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)alert(r.error.message);else{await activityLog("Changed task status to "+status+".");render()}}async function assign(id,uid){const r=await db.from("crowspace_project_tasks").update({assigned_to:uid||null,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)alert(r.error.message);else{await activityLog(uid?"Assigned a task to "+(profiles[uid]?.display_name||"a team member")+".":"Unassigned a task.");render()}}async function removeTask(id){if(!confirm("Delete this task?"))return;const r=await db.from("crowspace_project_tasks").delete().eq("id",id);if(r.error)alert(r.error.message);else{await activityLog("Deleted a project task.");render()}}load();</script><script src="./js/crowspace-holiday-themes.js"></script>
</body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><title>Create a post · CrowSpace</title><link rel="stylesheet" href="assets/css/global.css"></head><body data-page="create-post"><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><span class="brand-mark"></span><span>CrowSpace</span></a><nav class="primary-nav" data-primary-nav></nav></div></header><main class="layout"><div class="page-heading"><span class="eyebrow">Share with your universe</span><h1>Create a post</h1><p>Share an update with your CrowSpace community.</p></div><form class="panel post-composer" data-create-post><label>What would you like to share?<textarea name="body" rows="6" maxlength="5000" required placeholder="Write your update…"></textarea></label><div class="composer-options"><label>Share with<select name="visibility"><option value="public">Public</option><option value="followers">Followers</option><option value="friends">Friends</option><option value="private">Only me</option></select></label><label>Branch<select name="branch_key"><option value="">All CrowRules</option></select></label><label>Post type<select name="post_kind"><option value="text">Text</option><option value="announcement">Announcement</option></select></label></div><p class="muted small" data-post-status>Posting uses your existing CrowSpace account and post permissions.</p><div class="hero-actions"><a class="button" href="feed.html">Cancel</a><button class="button button-primary" type="submit">Publish post</button></div></form></main><footer class="site-footer">CrowSpace · <span data-connection-status>Connecting…</span></footer><nav class="mobile-nav" data-primary-nav></nav><div class="toast" data-toast hidden></div><script src="assets/js/config.js"></script><script type="module" src="assets/js/app.js"></script></body></html>

</head><body data-crowrules-division="crowspace"><main><div class="card"><div class="top"><div><h1 style="margin:0">🌐 Universal Activity</h1><p class="muted">One activity stream across the CrowRules Universe.</p></div><a class="btn" href="./index.html">← CrowSpace Home</a></div></div><div class="card"><div class="search"><input id="search" placeholder="Search your universe activity"><button class="btn primary" id="refresh">Refresh</button></div><div class="filters"><button class="btn active" data-source="all">All</button><button class="btn" data-source="crowspace">CrowSpace</button><button class="btn" data-source="dreamscapes">Dreamscapes</button><button class="btn" data-source="podcasting">Podcasting</button><button class="btn" data-source="sports">Sports</button><button class="btn" data-source="tv">TV</button><button class="btn" data-source="memorials">Memorials</button></div><div id="feed"><div class="empty">Loading…</div></div></div><div class="card"><span class="live">● LIVE</span> <span class="muted">Realtime Universal Activity</span></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let user=null,source="all",rows=[];const $=x=>document.getElementById(x),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),ago=d=>{const m=Math.floor((Date.now()-new Date(d))/60000);return m<1?"just now":m<60?m+"m ago":m<1440?Math.floor(m/60)+"h ago":Math.floor(m/1440)+"d ago"};async function init(){user=(await db.auth.getSession()).data.session?.user;if(!user){location.href="../login.html";return}await load();db.channel("universal-activity").on("postgres_changes",{event:"*",schema:"public",table:"crowspace_universal_activity"},load).subscribe()}async function load(){let q=db.from("crowspace_universal_activity").select("id,source,actor_id,activity_type,title,body,target_url,visibility,created_at").order("created_at",{ascending:false}).limit(100);if(source!=="all")q=q.eq("source",source);const r=await q;if(r.error){$("feed").innerHTML='<div class="empty">'+esc(r.error.message)+"</div>";return}rows=r.data||[];render()}function render(){const term=$("search").value.trim().toLowerCase();const list=rows.filter(x=>!term||[x.source,x.activity_type,x.title,x.body].join(" ").toLowerCase().includes(term));$("feed").innerHTML=list.map(x=>'<article class="item"><span class="tag">'+esc(x.source.toUpperCase())+' · '+esc((x.activity_type||"activity").replaceAll("_"," ").toUpperCase())+'</span><h3>'+esc(x.title||"CrowRules Universe Activity")+'</h3><p class="muted">'+esc(x.body||"")+'</p><small class="muted">'+ago(x.created_at)+'</small>'+(x.target_url?'<p><a class="btn" href="'+esc(x.target_url)+'">Open →</a></p>':"")+'</article>').join("")||'<div class="empty">No activity matches your current view.</div>'}$("refresh").onclick=load;$("search").oninput=render;document.querySelectorAll("[data-source]").forEach(b=>b.onclick=()=>{source=b.dataset.source;document.querySelectorAll("[data-source]").forEach(x=>x.classList.toggle("active",x===b));load()});init();</script><script src="./js/crowspace-holiday-themes.js"></script>

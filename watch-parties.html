<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watch Parties · CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-page="watch"><header class="topbar"><a class="brand" href="index.html">CROW<span>SPACE</span></a><nav id="nav" class="nav"></nav><a class="membership" href="membership.html">Universal Membership</a></header><main class="shell"><section class="card"><div class="eyebrow">Watch together</div><h1 class="title">Watch Parties</h1><button class="btn primary" onclick="createParty()">Create Watch Party</button><div id="parties" class="list" style="margin-top:15px"></div></section><script>async function createParty(){if(!cs.user)return alert('Sign in first.');const title=prompt('Watch party name');if(!title)return;await cs.client.from('crowspace_watch_parties').insert({host_id:cs.user.id,title});loadParties()}async function loadParties(){const r=await cs.client.from('crowspace_watch_parties').select('*').order('created_at',{ascending:false});document.querySelector('#parties').innerHTML=(r.data||[]).map(x=>'<div class="item"><h3>'+esc(x.title)+'</h3><div class="muted">'+esc(x.status)+'</div></div>').join('')||'<div class="muted">No watch parties yet.</div>'}document.addEventListener('DOMContentLoaded',loadParties)</script><div class="footer">CrowRules Entertainment · CrowSpace · One Account · One Universe</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/crowrules-membership.js"></script><script src="js/crowspace.js"></script></body></html>

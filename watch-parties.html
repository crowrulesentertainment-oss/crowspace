<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Watch Parties 3.0</title><style>:root{--a:#20e6ff;--p:#8d5cff;--bg:#05050b;--card:#0d101a;--line:#292e42;--muted:#9da5bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17132d,transparent 38%),var(--bg);color:#f5f7ff;font:14px Arial}main{max-width:1200px;margin:auto;padding:18px}.top,.actions,.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.brand span{color:var(--a)}.card{background:rgba(13,16,26,.96);border:1px solid var(--line);border-radius:18px;padding:18px;margin:15px 0}.hero{background:linear-gradient(135deg,#101d2c,#30194b,#0d0f18)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.party{padding:16px;border:1px solid var(--line);border-radius:14px;background:#10131f}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#172334;color:var(--a);font-size:11px}.btn,a.btn{padding:10px 13px;border:1px solid #343c56;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(90deg,#126d7a,#56358c)!important;border:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,select{width:100%;padding:11px;background:#080a12;color:#fff;border:1px solid var(--line);border-radius:10px}.room{display:none}.room.show{display:block}.roomgrid{display:grid;grid-template-columns:1.5fr .8fr;gap:15px}.video{background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9}.video iframe{width:100%;height:100%;border:0}.chat{height:440px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;background:#080a11;border:1px solid var(--line);border-radius:12px;padding:10px}.msg{padding:8px 4px;border-bottom:1px solid #1d2130}.msg b{color:var(--a)}.members{display:flex;gap: </head><body data-crowrules-division="crowspace"><main><div class="top"><div class="brand">🖤 CrowSpace <span>Watch Parties 3.0</span></div><a class="btn" href="./">← CrowSpace</a></div><section class="card hero"><h1>🎬 Watch Parties</h1><p class="muted">Watch together, chat together, and build community across the CrowRules universe.</p><span class="stat"><b id="activeCount">0</b> active</span><span class="stat"><b id="scheduledCount">0</b> scheduled</span><span class="stat"><b id="memberCount">0</b> participants</span></section><section id="browse" class="card"><div class="toolbar"><input id="q" placeholder="Search watch parties…"><button id="createBtn" class="btn primary">＋ Create Watch Party</button></div><div id="create" style="display:none;margin-top:15px"><div class="formgrid"><input id="title" placeholder="Party title"><textarea id="desc" placeholder="Description"></textarea><input id="media" placeholder="YouTube URL or video URL"><select id="mediaType"><option value="youtube">YouTube</option><option value="video">Video</option><option value="link">Link</option></select><input id="scheduled" type="datetime-local"><input id="max" type="number" min="2" max="100" value="20"><select id="public"><option value="true">Public</option><option value="false">Private</option></select></div><div class="actions" style="margin-top:10px"><button id="save" class="btn primary">Create Party</button><button id="cancel" class="btn">Cancel</button></div><div id="status" class="muted"></div></div></section><section id="directory" class="card"><h2>Discover</h2><div id="list" class="grid"><div class="empty">Loading…</div></div></section><section id="room" class="card room"><div class="top"><div><h2 id="rtitle"></h2><div id="rdesc" class="muted"></div></div><button id="leave" class="btn">← Browse</button></div><div class="roomgrid"><div><div id="player" class="video"></div><div class="actions" style="margin-top:10px"><button id="join" class="btn primary"></button><span id="roomMeta" class="muted"></span></div><div id="memList" class="members"></div><div id="syncBar" class="actions" style="margin-top:8px;display:none"><button id="playPause" class="btn">▶ Play</button><button id="syncNow" class="btn">↻ Sync Now</button><span id="syncStatus" class="muted">Synced playback</span></div></div><div class="chat"><h3>💬 Party Chat</h3><div id="messages" class="messages"></div><div class="actions" style="margin-top:8px"><input id="chatInput" placeholder="Say something…"><button id="send" class="btn primary">Send</button></div></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const yt=u=>{try{const x=new URL(u);let id=x.searchParams.get("v");if(!id&&x.hostname.includes("youtu.be"))id=x.pathname.slice(1);if(!id&&x.pathname.includes("/shorts/"))id=x.pathname.split("/shorts/")[1];return id?"https://www.youtube.com/embed/"+id+"?rel=0":null}catch{return null}};
async function init(){me=(await db.auth.getSession()).data.session?.user||null;await load();const id=new URLSearchParams(location.search).get("party");if(id)openParty(id);subscribe()}
async function load(){const r=await db.from("crowspace_watch_parties").select("*").order("scheduled_for",{ascending:true}).limit(100);if(r.error){list.innerHTML="<div class=\"empty\">"+esc(r.error.message)+"</div>";return}parties=r.data||[];const m=await db.from("crowspace_watch_party_members").select("party_id,user_id,role,last_seen_at");members=m.data||[];activeCount.textContent=parties.filter(x=>x.status==="active").length;scheduledCount.textContent=parties.filter(x=>x.status==="scheduled").length;memberCount.textContent=members.length;render()}

async function openParty(id){const p=parties.find(x=>x.id===id)||((await db.from("crowspace_watch_parties").select("*").eq("id",id).maybeSingle()).data);if(!p)return;current=p;history.replaceState({},'',"?party="+encodeURIComponent(id));browse.style.display="none";directory.style.display="none";room.classList.add("show");rtitle.textContent=p.title;rdesc.textContent=p.description||"";roomMeta.textContent=(p.status||"scheduled")+" · max "+(p.max_members||"∞");const u=p.media_type==="youtube"&&yt(p.media_url);player.innerHTML=u?"<iframe src=\""+esc(u)+"\" allow=\"autoplay; encrypted-media; picture-in-picture\" allowfullscreen></iframe>":(p.media_url?"<video src=\""+esc(p.media_url)+"\" controls style=\"width:100%;height:100%\"></video>":"<div style=\"padding:25px\">No media URL supplied.</div>");await loadParty();renderJoin();updateSyncUI();loadChat();setupPartySync()}
async function loadParty(){const r=await db.from("crowspace_watch_party_members").select("party_id,user_id,role,last_seen_at").eq("party_id",current.id).order("joined_at",{ascending:true});members=r.data||[];const ids=members.map(x=>x.user_id);if(ids.length){const p=await db.from("crowspace_profiles").select("user_id,username,display_name").in("user_id",ids);(p.data||[]).forEach(x=>profiles[x.user_id]=x)}memList.innerHTML=members.length?members.map(m=>"<span class=\"member\">"+esc(profiles[m.user_id]?.display_name||profiles[m.user_id]?.username||"Member")+(m.role==="host"?" 👑":"")+"</span>").join(""):"<span class=\"muted\">No participants yet.</span>"}

async function loadChat(){if(!current)return;const r=await db.from("crowspace_watch_party_messages").select("id,party_id,user_id,content,created_at").eq("party_id",current.id).order("created_at",{ascending:true}).limit(200);const rows=r.data||[];const ids=rows.map(x=>x.user_id);if(ids.length){const p=await db.from("crowspace_profiles").select("user_id,username,display_name").in("user_id",ids);(p.data||[]).forEach(x=>profiles[x.user_id]=x)}messages.innerHTML=rows.map(x=>"<div class=\"msg\"><b>"+esc(profiles[x.user_id]?.display_name||profiles[x.user_id]?.username||"Member")+"</b> <span class=\"muted\">"+new Date(x.created_at).toLocaleTimeString()+"</span><br>"+esc(x.content)+"</div>").join("")||"<div class=\"muted\">Start the conversation.</div>";messages.scrollTop=messages.scrollHeight}
async function sendChat(){if(!me||!current)return;const v=chatInput.value.trim();if(!v)return;if(!members.some(m=>m.user_id===me.id))return alert("Join the party before chatting.");const r=await db.from("crowspace_watch_party_messages").insert({party_id:current.id,user_id:me.id,content:v});if(r.error)alert(r.error.message);else{chatInput.value="";loadChat()}}
save.onclick=async()=>{if(!me)return alert("Sign in to create a watch party.");if(!title.value.trim()||!media.value.trim())return alert("Title and media URL are required.");const r=await db.from("crowspace_watch_parties").insert({host_id:me.id,title:title.value.trim(),description:desc.value.trim(),media_url:media.value.trim(),media_type:mediaType.value,scheduled_for:scheduled.value?new Date(scheduled.value).toISOString():new Date().toISOString(),status:"scheduled",is_public:public.value==="true",max_members:Number(max.value)||20});if(r.error){status.textContent=r.error.message;return}const p=(await db.from("crowspace_watch_parties").select("id").eq("host_id",me.id).order("created_at",{ascending:false}).limit(1).maybeSingle()).data;if(p?.id)await db.from("crowspace_watch_party_members").upsert({party_id:p.id,user_id:me.id,role:"host",last_seen_at:new Date().toISOString()});status.textContent="Watch party created.";create.style.display="none";await load()};
createBtn.onclick=()=>{if(!me)return alert("Sign in to create watch parties.");create.style.display=create.style.display==="none"?"block":"none"};cancel.onclick=()=>create.style.display="none";q.addEventListener("input",render);chatInput.addEventListener("keydown",e=>{if(e.key==="Enter")sendChat()});send.onclick=sendChat;leave.onclick=()=>{room.classList.remove("show");directory.style.display="block";browse.style.display="block";history.replaceState({},'',location.pathname);current=null};

</script><script>
let localVideo=null,lastRemoteAction=0;
function setupPartySync(){
 if(partyChannel){db.removeChannel(partyChannel);partyChannel=null}
 partyChannel=db.channel("watch-party-sync-"+current.id,{config:{broadcast:{ack:true}}})
 .on("broadcast",{event:"playback"},({payload})=>applyPlayback(payload))
 .on("broadcast",{event:"request-sync"},()=>{if(isHost)broadcastPlayback("sync")})
 .subscribe(async s=>{if(s==="SUBSCRIBED"&&me){await partyChannel.send({type:"broadcast",event:"request-sync",payload:{userId:me.id}})}});
 const video=player.querySelector("video");localVideo=video||null;
 if(video){video.addEventListener("play",()=>{if(isHost)broadcastPlayback("play")});video.addEventListener("pause",()=>{if(isHost)broadcastPlayback("pause")});video.addEventListener("seeked",()=>{if(isHost)broadcastPlayback("seek")});}
 updateSyncUI();
}
function updateSyncUI(){
 const mine=members.find(m=>m.user_id===me?.id);isHost=mine?.role==="host"||current?.host_id===me?.id;
 syncBar.style.display=members.some(m=>m.user_id===me?.id)?"flex":"none";
 playPause.textContent=isHost?"▶ / ⏸ Host Playback":"▶ / ⏸ Host Controlled";
 playPause.disabled=!isHost;
 syncStatus.textContent=isHost?"You control playback for everyone":"Playback follows the host";
}
function broadcastPlayback(action){
 if(!partyChannel||!isHost)return;
 const v=player.querySelector("video");if(!v)return;
 partyChannel.send({type:"broadcast",event:"playback",payload:{action,time:v.currentTime,at:Date.now()}});
}
async function applyPlayback(p){
 if(isHost||!localVideo||Date.now()-lastRemoteAction<400)return;
 lastRemoteAction=Date.now();
 const drift=(Number(p.time)||0)-localVideo.currentTime;
 if(Math.abs(drift)>0.75)localVideo.currentTime=Math.max(0,Number(p.time)||0);
 if(p.action==="play")await localVideo.play().catch(()=>{});
 if(p.action==="pause")localVideo.pause();
 syncStatus.textContent="Synced "+new Date().toLocaleTimeString();
}
playPause.onclick=async()=>{if(!isHost)return;const v=player.querySelector("video");if(!v)return;v.paused?await v.play():v.pause();broadcastPlayback(v.paused?"pause":"play")};
syncNow.onclick=()=>{if(partyChannel)partyChannel.send({type:"broadcast",event:"request-sync",payload:{userId:me?.id}})};
</script><script src="./js/crowspace-holiday-themes.js"></script>

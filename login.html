<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace — Sign In</title><link rel="stylesheet" href="style.css"><script src="crowspace-auth.js"></script><style>body{display:grid;place-items:center;min-height:100vh;background:#08080d;color:#eee;font-family:Montserrat,Arial}.auth{width:min(92vw,440px);padding:28px;background:#111119;border:1px solid #292936;border-radius:20px}.auth h1{margin:0 0 8px}.auth p{color:#999}.auth input{width:100%;box-sizing:border-box;margin:7px 0;padding:13px;border-radius:10px;border:1px solid #333;background:#090910;color:#fff}.auth button{width:100%;margin:7px 0;padding:12px;border:0;border-radius:10px;cursor:pointer}.primary{background:#fff;color:#08080d}.oauth{background:#171721;color:#fff;border:1px solid #333!important}.msg{min-height:22px;color:#8fe8ff;margin:8px 0}.back{display:block;margin-top:14px;color:#8fe8ff;text-decoration:none}</style></head><body><main class="auth"><h1>Welcome back.</h1><p>One Account. One Universe.</p><div id="msg" class="msg"></div><form id="form"><input id="email" type="email" placeholder="Email" autocomplete="email" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button class="primary">SIGN IN</button></form><button class="oauth" data-provider="google">Continue with Google</button><button class="oauth" data-provider="discord">Continue with Discord</button><button class="oauth" data-provider="twitch">Continue with Twitch</button><a class="back" href="signup.html">Need an account? Join CrowSpace</a><a class="back" href="home.html">← Back to CrowSpace</a></main><script>const msg=document.getElementById("msg");CrowSpaceAuth.ready.then(async db=>{const u=await db.auth.getUser();if(u.data.user)location.href="profile.html";document.getElementById("form").onsubmit=async e=>{e.preventDefault();msg.textContent="Signing in…";const r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){msg.textContent=r.error.message;return}location.href="profile.html"};document.querySelectorAll("[data-provider]").forEach(b=>b.onclick=async()=>{msg.textContent="Opening "+b.dataset.provider+"…";const r=await db.auth.signInWithOAuth({provider:b.dataset.provider,options:{redirectTo:location.origin+location.pathname.replace(/login\.html$/,"profile.html")}});if(r.error)msg.textContent=r.error.message})});</script></body></html>

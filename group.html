<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.group-page{max-width:1000px;margin:auto}.group-hero{overflow:hidden}.group-cover{width:100%;max-height:330px;object-fit:cover}.group-meta{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}.group-actions{display:flex;gap:10px;flex-wrap:wrap}.group-post-form{margin:20px 0}.group-post{margin:14px 0}.group-post-head{display:flex;align-items:center;gap:10px}.post-time{font-size:.8rem;color:#7f8ba3}.locked{border:1px dashed rgba(255,255,255,.18);padding:18px;text-align:center}.empty{padding:30px;text-align:center}.danger{border-color:rgba(255,80,130,.4)!important}.member-count{font-weight:700}
.member-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.member-panel{position:sticky;top:88px;align-self:start}.member-tools{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}.member-search{width:100%;padding:11px 13px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.035);color:#fff}.members-grid{display:grid;gap:10px;max-height:560px;overflow:auto}.member-row{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.025);text-decoration:none;color:inherit}.member-row:hover{border-color:rgba(91,238,255,.38);transform:translateY(-1px)}.member-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:0 0 42px;background:linear-gradient(135deg,rgba(91,238,255,.18),rgba(166,92,255,.2));border:1px solid rgba(255,255,255,.12);overflow:hidden;font-weight:800}.member-avatar img{width:100%;height:100%;object-fit:cover}.member-copy{min-width:0}.member-copy strong,.member-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.member-copy span{font-size:.8rem;color:#7f8ba3}.member-role{margin-left:auto;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:#7f8ba3}.member-empty{padding:24px;text-align:center;color:#7f8ba3}@media(max-width:820px){.member-layout{grid-template-columns:1fr}.member-panel{position:static}.members-grid{max-height:none}}
</style></head>935<body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="section group-page"><div id="loading" class="card">Loading group…</div><div id="app" hidden><section id="hero" class="card group-hero"></section><section id="composer"></section><div class="member-layout"><div><section><div class="section-head"><div><p class="eyebrow">GROUP CONVERSATION</p><h2>Group Posts</h2></div></div><div id="posts"></div></section></div><aside class="card member-panel"><div class="section-head"><div><p class="eyebrow">THE NETWORK</p><h2>Members <span id="memberCount" class="member-count">0</span></h2><p class="muted">Everyone who belongs to this group.</p></div></div><div class="member-tools"><input id="memberSearch" class="member-search" type="search" placeholder="Search members…" autocomplete="off"></div><div id="members" class="members-grid"><div class="member-empty">Loading members…</div></div></aside></div></div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{await CS.refreshHeader();const params=new URLSearchParams(location.search),groupId=params.get("id"),loading=document.getElementById("loading"),app=document.getElementById("app"),hero=document.getElementById("hero"),composer=document.getElementById("composer"),posts=document.getElementById("posts");if(!groupId){loading.textContent="No group selected.";return}const u=await CS.user();if(!u){location.href="login.html";return}const [{data:group,error:gError},{data:membership,error:mError}]=await Promise.all([crowSupabase.from("crowspace_groups").select("*").eq("id",groupId).maybeSingle(),crowSupabase.from("crowspace_group_members").select("group_id,user_id,role").eq("group_id",groupId).eq("user_id",u.id).maybeSingle()]);if(gError||!group){loading.textContent="Group not found.";return}const isMember=!!membership;const isOwner=group.created_by===u.id;hero.innerHTML=(group.image_url?'<img class="group-cover" src="'+CS.escape(group.image_url)+'" alt="">':"")+"<div style=\"padding:22px\"><p class=\"eyebrow\">CROWSPACE GROUP</p><div class=\"group-meta\"><div><h1>"+CS.escape(group.name)+"</h1><p class=\"muted\">"+CS.escape(group.description||"")+"</p><p class=\"member-count\">"+(isMember?"You are a member":"You are not a member")+"</p></div><div class=\"group-actions\"><a class=\"btn\" href=\"groups.html\">← Groups</a>"+(isMember?'<button class="btn" id="leaveBtn">Leave Group</button>':'<button class="btn primary" id="joinBtn">Join Group</button>')+"</div></div></div>";if(isMember){composer.innerHTML='<form id="postForm" class="card group-post-form"><p class="eyebrow">MEMBERS ONLY</p><h3>Post to '+CS.escape(group.name)+'</h3><textarea id="postBody" rows="5" maxlength="5000" required placeholder="Start a conversation with the group…"></textarea><div style="margin-top:12px"><button class="btn primary" id="postBtn" type="submit">Post to Group</button></div><p id="postMsg" class="muted"></p></form>'}else{composer.innerHTML='<div class="card locked"><h3>Join this group to post</h3><p class="muted">You can view the group, but only members can publish group posts.</p><button class="btn primary" id="joinBtn2">Join Group & Post</button></div>'}const join=async()=>{const {error}=await crowSupabase.from("crowspace_group_members").upsert({group_id:groupId,user_id:u.id,role:isOwner?"owner":"member"},{onConflict:"group_id,user_id"});if(error)alert(error.message);else location.reload()};document.getElementById("joinBtn")?.addEventListener("click",join);document.getElementById("joinBtn2")?.addEventListener("click",join);document.getElementById("leaveBtn")?.addEventListener("click",async()=>{if(isOwner){alert("Group creators should transfer ownership before leaving.");return}const {error}=await crowSupabase.from("crowspace_group_members").delete().eq("group_id",groupId).eq("user_id",u.id);if(error)alert(error.message);else location.reload()});if(isMember){document.getElementById("postForm").addEventListener("submit",async e=>{e.preventDefault();const body=document.getElementById("postBody").value.trim(),btn=document.getElementById("postBtn"),msg=document.getElementById("postMsg");if(!body)return;btn.disabled=true;msg.textContent="Publishing…";const {error}=await crowSupabase.from("crowspace_group_posts").insert({group_id:groupId,user_id:u.id,body});if(error){msg.textContent=error.message;btn.disabled=false;return}document.getElementById("postBody").value="";msg.textContent="Posted.";await loadPosts();btn.disabled=false})}async function loadMembers(){const memberBox=document.getElementById("members"),countBox=document.getElementById("memberCount"),search=document.getElementById("memberSearch");const {data:rows,error}=await crowSupabase.from("crowspace_group_members").select("user_id,role,created_at").eq("group_id",groupId).order("created_at",{ascending:true});if(error){memberBox.innerHTML='<div class="member-empty">Unable to load members.</div>';return}const ids=[...new Set((rows||[]).map(x=>x.user_id).filter(Boolean))];let profiles={};if(ids.length){const {data:ps}=await crowSupabase.rpc("crowspace_public_profiles_by_ids",{p_ids:ids});(ps||[]).forEach(p=>profiles[p.id]=p)}const all=(rows||[]).map(r=>({...r,...(profiles[r.user_id]||{})}));function render(){const q=(search?.value||"").trim().toLowerCase();const filtered=all.filter(m=>(m.display_name||"").toLowerCase().includes(q)||(m.username||"").toLowerCase().includes(q));countBox.textContent=filtered.length===all.length?all.length:filtered.length+" / "+all.length;if(!filtered.length){memberBox.innerHTML='<div class="member-empty">No members match your search.</div>';return}memberBox.innerHTML=filtered.map(m=>{const name=m.display_name||m.username||"CrowSpace Member";const initials=String(name).trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase().slice(0,2)||"C";return '<a class="member-row" href="profile.html?id='+encodeURIComponent(m.user_id)+'"><span class="member-avatar">'+(m.avatar_url?'<img src="'+CS.escape(m.avatar_url)+'" alt="">':CS.escape(initials))+'</span><span class="member-copy"><strong>'+CS.escape(name)+'</strong><span>'+(m.username?"@"+CS.escape(m.username):"CrowSpace member")+'</span></span>'+(m.role?'<span class="member-role">'+CS.escape(m.role)+'</span>':"")+'</a>'}).join("")}search?.addEventListener("input",render);render()}async function loadPosts(){const {data,error}=await crowSupabase.from("crowspace_group_posts").select("id,user_id,body,media_url,created_at").eq("group_id",groupId).order("created_at",{ascending:false});if(error){posts.innerHTML='<div class="card"><p>'+CS.escape(error.message)+'</p></div>';return}if(!data?.length){posts.innerHTML='<div class="card empty"><h3>No posts yet.</h3><p class="muted">Be the first member to start the conversation.</p></div>';return}const ids=[...new Set(data.map(x=>x.user_id))];let profiles={};const {data:ps}=await crowSupabase.rpc("crowspace_public_profiles_by_ids",{p_ids:ids});(ps||[]).forEach(p=>profiles[p.id]=p);posts.innerHTML=data.map(p=>{const person=profiles[p.user_id]||{};return '<article class="card group-post"><div class="group-post-head"><span class="avatar sm">'+CS.escape((person.display_name||person.username||"C").slice(0,1).toUpperCase())+'</span><div><strong>'+CS.escape(person.display_name||person.username||"Member")+'</strong><div class="post-time">'+new Date(p.created_at).toLocaleString()+'</div></div></div><p style="white-space:pre-wrap">'+CS.escape(p.body)+'</p>'+(p.media_url?'<img class="card-media" src="'+CS.escape(p.media_url)+'" alt="">':"")+(p.user_id===u.id?'<button class="btn danger delete-post" data-id="'+p.id+'">Delete</button>':"")+'</article>'}).join("");posts.querySelectorAll(".delete-post").forEach(btn=>btn.addEventListener("click",async()=>{const {error}=await crowSupabase.from("crowspace_group_posts").delete().eq("id",btn.dataset.id);if(error)alert(error.message);else loadPosts()}))}loading.hidden=true;app.hidden=false;await Promise.all([loadMembers(),loadPosts()])});</script></body></html>

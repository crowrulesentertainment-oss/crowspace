<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.group-page{max-width:1180px;margin:auto;padding-top:28px}.group-hero{overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.09);background:linear-gradient(145deg,rgba(91,238,255,.06),rgba(166,92,255,.07) 52%,rgba(255,92,184,.04));box-shadow:0 24px 70px rgba(0,0,0,.3)}.group-cover{width:100%;height:330px;display:block;object-fit:cover;opacity:.78;background:radial-gradient(circle at 20% 30%,rgba(91,238,255,.2),transparent 35%),radial-gradient(circle at 80% 20%,rgba(166,92,255,.2),transparent 38%),#070914}.group-hero>div{position:relative;margin-top:-80px;z-index:2;padding:34px 28px 28px!important;background:linear-gradient(180deg,transparent,rgba(5,7,15,.96) 18%)}.group-hero h1{margin:4px 0 10px;font:800 clamp(2rem,5vw,3.8rem)/1.02 Orbitron,sans-serif;letter-spacing:-.04em}.group-hero .muted{max-width:760px;line-height:1.7;color:#b8c0d4}.group-meta{display:flex;justify-content:space-between;gap:24px;align-items:end;flex-wrap:wrap}.group-actions{display:flex;gap:10px;flex-wrap:wrap}.group-actions .btn{border-radius:12px}.group-post-form{margin:20px 0;padding:20px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(135deg,rgba(91,238,255,.055),rgba(166,92,255,.045))}.group-post-form h3{font:700 1.15rem Orbitron,sans-serif}.group-post-form textarea{width:100%;box-sizing:border-box;min-height:120px}.locked{border:1px dashed rgba(255,255,255,.18);padding:28px;text-align:center;background:rgba(255,255,255,.025)}.group-workspace{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}.member-panel{position:sticky;top:82px;padding:18px;border:1px solid rgba(255,255,255,.09);background:rgba(10,13,25,.78);backdrop-filter:blur(18px)}.member-panel .section-head{margin-bottom:12px}.member-search{width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.035);color:#fff;outline:none}.member-search:focus{border-color:rgba(91,238,255,.5);box-shadow:0 0 0 3px rgba(91,238,255,.06)}.members-grid{display:grid;gap:8px;max-height:610px;overflow:auto}.member-row{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid transparent;border-radius:13px;background:rgba(255,255,255,.025);text-decoration:none;color:inherit;transition:.18s ease}.member-row:hover{border-color:rgba(91,238,255,.28);background:rgba(91,238,255,.045);transform:translateX(2px)}.member-avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;flex:0 0 43px;background:linear-gradient(135deg,rgba(91,238,255,.17),rgba(166,92,255,.2));border:1px solid rgba(255,255,255,.12);overflow:hidden;font-weight:800}.member-avatar img{width:100%;height:100%;object-fit:cover}.member-copy{min-width:0}.member-copy strong,.member-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.member-copy span{font-size:.77rem;color:#727d95}.member-role{margin-left:auto;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:#7f8ba3}.member-empty{padding:26px 10px;text-align:center;color:#727d95}.group-post{margin:0 0 12px;padding:18px;border:1px solid rgba(255,255,255,.08);background:rgba(9,12,23,.68);border-radius:16px}.group-post:hover{border-color:rgba(91,238,255,.2)}.group-post-head{display:flex;align-items:center;gap:10px}.post-time{font-size:.74rem;color:#6f7890}.group-post p{line-height:1.7}.group-post .card-media{width:100%;max-height:520px;object-fit:cover;border-radius:14px}.member-count{font-weight:700}.empty{padding:30px;text-align:center}.danger{border-color:rgba(255,80,130,.4)!important}@media(max-width:900px){.group-workspace{grid-template-columns:1fr}.member-panel{position:static}.members-grid{max-height:430px}.group-meta{align-items:start}}@media(max-width:600px){.group-page{padding-top:16px}.group-cover{height:230px}.group-hero>div{margin-top:-55px;padding:30px 16px 20px!important}.group-hero h1{font-size:2rem}.group-actions{width:100%}.group-actions .btn{flex:1}.member-panel{padding:15px}}</style></head>935<body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="section group-page"><div id="loading" class="card">Loading group…</div><div id="app" hidden><div class="group-shell"><section id="hero" class="card group-hero"></section><section id="composer"></section><div class="group-workspace"><div><section><div class="section-head"><div><p class="eyebrow">THE CONVERSATION</p><h2>Group Posts</h2><p class="muted">Share updates, ideas and moments with the group.</p></div><a class="btn" href="groups.html">All Groups →</a></div><div id="posts"></div></section></div><aside class="card member-panel"><div class="section-head"><div><p class="eyebrow">THE NETWORK</p><h2>Members <span id="memberCount" class="member-count">0</span></h2><p class="muted">Everyone who belongs to this group.</p></div></div><div class="member-tools"><input id="memberSearch" class="member-search" type="search" placeholder="Search members…" autocomplete="off"></div><div id="members" class="members-grid"><div class="member-empty">Loading members…</div></div></aside></div></div></div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{await CS.refreshHeader();const params=new URLSearchParams(location.search),groupId=params.get("id"),loading=document.getElementById("loading"),app=document.getElementById("app"),hero=document.getElementById("hero"),composer=document.getElementById("composer"),posts=document.getElementById("posts");if(!groupId){loading.textContent="No group selected.";return}const u=await CS.user();if(!u){location.href="login.html";return}const [{data:group,error:gError},{data:membership,error:mError}]=await Promise.all([crowSupabase.from("crowspace_groups").select("*").eq("id",groupId).maybeSingle(),crowSupabase.from("crowspace_group_members").select("group_id,user_id,role").eq("group_id",groupId).eq("user_id",u.id).maybeSingle()]);if(gError||!group){loading.textContent="Group not found.";return}const isMember=!!membership;const isOwner=group.created_by===u.id;hero.innerHTML=(group.image_url?'<img class="group-cover" src="'+CS.escape(group.image_url)+'" alt="">':"")+"<div style=\"padding:22px\"><p class=\"eyebrow\">CROWSPACE GROUP</p><div class=\"group-meta\"><div><h1>"+CS.escape(group.name)+"</h1><p class=\"muted\">"+CS.escape(group.description||"")+"</p><p class=\"member-count\">"+(isMember?"You are a member":"You are not a member")+"</p></div><div class=\"group-actions\"><a class=\"btn\" href=\"groups.html\">← Groups</a>"+(isMember?'<button class="btn" id="leaveBtn">Leave Group</button>':'<button class="btn primary" id="joinBtn">Join Group</button>')+"</div></div></div>";if(isMember){composer.innerHTML='<form id="postForm" class="card group-post-form"><p class="eyebrow">MEMBERS ONLY</p><h3>Post to '+CS.escape(group.name)+'</h3><textarea id="postBody" rows="5" maxlength="5000" required placeholder="Start a conversation with the group…"></textarea><div style="margin-top:12px"><button class="btn primary" id="postBtn" type="submit">Post to Group</button></div><p id="postMsg" class="muted"></p></form>'}else{composer.innerHTML='<div class="card locked"><h3>Join this group to post</h3><p class="muted">You can view the group, but only members can publish group posts.</p><button class="btn primary" id="joinBtn2">Join Group & Post</button></div>'}const join=async()=>{const {error}=await crowSupabase.from("crowspace_group_members").upsert({group_id:groupId,user_id:u.id,role:isOwner?"owner":"member"},{onConflict:"group_id,user_id"});if(error)alert(error.message);else location.reload()};document.getElementById("joinBtn")?.addEventListener("click",join);document.getElementById("joinBtn2")?.addEventListener("click",join);document.getElementById("leaveBtn")?.addEventListener("click",async()=>{if(isOwner){alert("Group creators should transfer ownership before leaving.");return}const {error}=await crowSupabase.from("crowspace_group_members").delete().eq("group_id",groupId).eq("user_id",u.id);if(error)alert(error.message);else location.reload()});if(isMember){document.getElementById("postForm").addEventListener("submit",async e=>{e.preventDefault();const body=document.getElementById("postBody").value.trim(),btn=document.getElementById("postBtn"),msg=document.getElementById("postMsg");if(!body)return;btn.disabled=true;msg.textContent="Publishing…";const {error}=await crowSupabase.from("crowspace_group_posts").insert({group_id:groupId,user_id:u.id,body});if(error){msg.textContent=error.message;btn.disabled=false;return}document.getElementById("postBody").value="";msg.textContent="Posted.";await loadPosts();btn.disabled=false})}async function loadMembers(){const memberBox=document.getElementById("members"),countBox=document.getElementById("memberCount"),search=document.getElementById("memberSearch");const {data:rows,error}=await crowSupabase.from("crowspace_group_members").select("user_id,role,created_at").eq("group_id",groupId).order("created_at",{ascending:true});if(error){memberBox.innerHTML='<div class="member-empty">Unable to load members.</div>';return}const ids=[...new Set((rows||[]).map(x=>x.user_id).filter(Boolean))];let profiles={};if(ids.length){const {data:ps}=await crowSupabase.rpc("crowspace_public_profiles_by_ids",{p_ids:ids});(ps||[]).forEach(p=>profiles[p.id]=p)}const all=(rows||[]).map(r=>({...r,...(profiles[r.user_id]||{})}));function render(){const q=(search?.value||"").trim().toLowerCase();const filtered=all.filter(m=>(m.display_name||"").toLowerCase().includes(q)||(m.username||"").toLowerCase().includes(q));countBox.textContent=filtered.length===all.length?all.length:filtered.length+" / "+all.length;if(!filtered.length){memberBox.innerHTML='<div class="member-empty">No members match your search.</div>';return}memberBox.innerHTML=filtered.map(m=>{const name=m.display_name||m.username||"CrowSpace Member";const initials=String(name).trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase().slice(0,2)||"C";return '<a class="member-row" href="profile.html?id='+encodeURIComponent(m.user_id)+'"><span class="member-avatar">'+(m.avatar_url?'<img src="'+CS.escape(m.avatar_url)+'" alt="">':CS.escape(initials))+'</span><span class="member-copy"><strong>'+CS.escape(name)+'</strong><span>'+(m.username?"@"+CS.escape(m.username):"CrowSpace member")+'</span></span>'+(m.role?'<span class="member-role">'+CS.escape(m.role)+'</span>':"")+'</a>'}).join("")}search?.addEventListener("input",render);render()}async function loadPosts(){const {data,error}=await crowSupabase.from("crowspace_group_posts").select("id,user_id,body,media_url,created_at").eq("group_id",groupId).order("created_at",{ascending:false});if(error){posts.innerHTML='<div class="card"><p>'+CS.escape(error.message)+'</p></div>';return}if(!data?.length){posts.innerHTML='<div class="card empty"><h3>No posts yet.</h3><p class="muted">Be the first member to start the conversation.</p></div>';return}const ids=[...new Set(data.map(x=>x.user_id))];let profiles={};const {data:ps}=await crowSupabase.rpc("crowspace_public_profiles_by_ids",{p_ids:ids});(ps||[]).forEach(p=>profiles[p.id]=p);posts.innerHTML=data.map(p=>{const person=profiles[p.user_id]||{};return '<article class="card group-post"><div class="group-post-head"><span class="avatar sm">'+CS.escape((person.display_name||person.username||"C").slice(0,1).toUpperCase())+'</span><div><strong>'+CS.escape(person.display_name||person.username||"Member")+'</strong><div class="post-time">'+new Date(p.created_at).toLocaleString()+'</div></div></div><p style="white-space:pre-wrap">'+CS.escape(p.body)+'</p>'+(p.media_url?'<img class="card-media" src="'+CS.escape(p.media_url)+'" alt="">':"")+(p.user_id===u.id?'<button class="btn danger delete-post" data-id="'+p.id+'">Delete</button>':"")+'</article>'}).join("");posts.querySelectorAll(".delete-post").forEach(btn=>btn.addEventListener("click",async()=>{const {error}=await crowSupabase.from("crowspace_group_posts").delete().eq("id",btn.dataset.id);if(error)alert(error.message);else loadPosts()}))}loading.hidden=true;app.hidden=false;await Promise.all([loadMembers(),loadPosts()])});</script></body></html>

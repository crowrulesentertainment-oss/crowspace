<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Watch | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.live-layout{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}.video{min-height:360px;border:1px solid var(--line);border-radius:18px;background:#05070c;display:grid;place-items:center}.chat{max-height:55vh;overflow:auto;display:grid;gap:8px}.bubble{padding:9px 12px;border:1px solid var(--line);border-radius:12px}.reaction-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:800px){.live-layout{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="section"><div id="app"><div class="empty">Loading Live…</div></div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await CS.user();if(!u){location.href='login.html';return}await CS.refreshHeader();const id=new URLSearchParams(location.search).get('id');const esc=CS.escape;const q=await crowSupabase.from('crowspace_live_sessions').select('*,crowspace_circles(name,slug),crowspace_creator_projects(title,id)').eq('id',id).maybeSingle();if(q.error||!q.data){app.innerHTML='<div class="empty">Live session not found.</div>';return}const s=q.data;app.innerHTML='<div class="section-head"><div><p class="eyebrow"><span style="color:#ff5364">● LIVE</span> · <span id="viewers">0</span> viewers</p><h1>'+esc(s.title||'Live Broadcast')+'</h1><p class="muted">'+esc(s.description||'')+'</p><p id="context" class="muted"></p></div><a class="btn" href="live.html">Live Hub</a></div><div class="live-layout"><section><div class="video">'+(s.playback_url?'<video controls autoplay playsinline style="width:100%;max-height:70vh" src="'+esc(s.playback_url)+'"></video>':'<div class="muted">Broadcast is starting. Video will appear when a playback URL is available.</div>')+'</div><div class="reaction-row"><button class="btn react" data-r="❤️">❤️</button><button class="btn react" data-r="🔥">🔥</button><button class="btn react" data-r="👏">👏</button><button class="btn react" data-r="💜">💜</button></div></section><section class="comm-card"><h2>Live Chat</h2><div id="chat" class="chat"></div><form id="form" class="composer"><input id="body" maxlength="1000" placeholder="Say something…"><button class="btn primary">Send</button></form></section></div>';context.innerHTML=(s.crowspace_circles?'Circle: <a href="circle.html?slug='+encodeURIComponent(s.crowspace_circles.slug)+'">'+esc(s.crowspace_circles.name)+'</a> ':'')+(s.crowspace_creator_projects?' · Project: <a href="creator-project.html?id='+encodeURIComponent(s.crowspace_creator_projects.id)+'">'+esc(s.crowspace_creator_projects.title)+'</a>':'');async function presence(){await crowSupabase.from('crowspace_live_viewers').upsert({session_id:s.id,user_id:u.id,last_seen_at:new Date().toISOString(),joined_at:new Date().toISOString()},{onConflict:'session_id,user_id'});const v=await crowSupabase.from('crowspace_live_viewers').select('user_id',{count:'exact',head:true}).eq('session_id',s.id);viewers.textContent=String(v.count||0);await crowSupabase.from('crowspace_live_sessions').update({viewer_count:v.count||0}).eq('id',s.id)}async function loadChat(){const m=await crowSupabase.from('crowspace_live_chat').select('*').eq('session_id',s.id).order('created_at',{ascending:true}).limit(200);const g=await CS.socialGraphMap(500);chat.innerHTML=(m.data||[]).map(x=>'<div class="bubble"><small class="muted">'+esc((g[x.user_id]||{}).display_name||'Member')+'</small><div>'+esc(x.body)+'</div></div>').join('')||'<div class="empty">Chat is quiet.</div>';chat.scrollTop=chat.scrollHeight}form.onsubmit=async e=>{e.preventDefault();const b=body.value.trim();if(!b)return;const r=await crowSupabase.from('crowspace_live_chat').insert({session_id:s.id,user_id:u.id,body:b});if(r.error)alert(r.error.message);else body.value=''}document.querySelectorAll('.react').forEach(b=>b.onclick=async()=>{const r=await crowSupabase.from('crowspace_live_reactions').insert({session_id:s.id,user_id:u.id,reaction:b.dataset.r});if(r.error)alert(r.error.message)});await presence();await loadChat();const ch=crowSupabase.channel('crowspace-live-'+s.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'crowspace_live_chat',filter:'session_id=eq.'+s.id},loadChat).on('postgres_changes',{event:'INSERT',schema:'public',table:'crowspace_live_reactions',filter:'session_id=eq.'+s.id},()=>{}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'crowspace_live_sessions',filter:'id=eq.'+s.id},payload=>{if(payload.new.playback_url&&payload.new.playback_url!==s.playback_url)location.reload()}).subscribe();setInterval(presence,15000);});</script><script src="js/global-nav.js"></script></body></html>

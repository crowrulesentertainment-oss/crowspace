<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace — Holiday Bots</title><link rel="stylesheet" href="style.css"><style>
body{min-height:100vh}.bot-shell{width:min(1100px,92vw);margin:0 auto;padding:70px 0}.hero{padding:30px}.hero h1{font:800 clamp(36px,6vw,72px) Orbitron;margin:8px 0}.hero em{font-style:normal;color:var(--cyan)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}.bot{padding:20px}.bot-head{display:flex;gap:12px;align-items:center}.bot-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(127,232,255,.18),rgba(160,100,255,.18));border:1px solid var(--line);font-size:25px}.bot h3{margin:0 0 4px;font:700 16px Orbitron}.bot small{color:var(--muted)}.rule{margin-top:15px;font:10px Orbitron;letter-spacing:1px;color:var(--cyan)}.status{margin-top:12px;color:#8b96a8;font-size:13px;line-height:1.6}.back{display:inline-block;margin-top:20px;color:var(--cyan);text-decoration:none}
</style></head><body><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><main class="bot-shell"><section class="hero card"><div class="eyebrow">CROWSPACE // AUTOMATION</div><h1>HOLIDAY <em>BOTS.</em></h1><p>Supabase-powered holiday personas that publish directly into the CrowSpace community feed. The engine runs automatically every day and only posts when a holiday rule matches.</p><a class="back" href="home.html">← Back to CrowSpace</a></section><section id="bots" class="grid"></section></main><script src="crowspace-auth.js"></script><script>
const root=document.getElementById("bots");
const esc=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const icons=["🎉","❤️","🍀","🌸","🕊️","🌎","☀️","🎃","🦃","🎄","🌙","✨"];
CrowSpaceAuth.ready.then(async db=>{
 const r=await db.from("crowspace_holiday_bots").select("display_name,holiday_name,bio,schedule_rule,active").order("holiday_name");
 if(r.error){root.innerHTML='<div class="card bot">Unable to load holiday bots.</div>';return}
 root.innerHTML=(r.data||[]).map((b,i)=>'<article class="bot card"><div class="bot-head"><div class="bot-icon">'+icons[i%icons.length]+'</div><div><h3>'+esc(b.display_name)+'</h3><small>'+esc(b.holiday_name)+'</small></div></div><div class="rule">'+esc(b.schedule_rule)+'</div><div class="status">'+esc(b.bio)+'<br><b>'+ (b.active?"AUTOMATED":"PAUSED") +'</b></div></article>').join("");
});
</script></body></html>

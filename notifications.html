<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrowSpace Notifications 4.0</title>
<style>
:root{--a:#20e6ff}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.brand{font-size:25px;font-weight:900}.pill{color:#8ff6ff}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.btn,a.btn{display:inline-block;padding:10px 13px;border:1px solid #343c56;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(90deg,#126d7a,#56358c)!important;border:0!important}.filter.active{outline:2px solid var(--a)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#111522;padding:13px;border-radius:12px;text-align:center}.stat b{display:block;font-size:22px}.muted{color:#9da5bd}.n{display:flex;gap:12px;padding:15px;border-bottom:1px solid #25293a;align-items:flex-start}.n.unread{background:#111b2b}.icon{width:42px;height:42px;border-radius:12px;background:#182033;display:grid;place-items:center;font-size:20px;flex:none}.content{min-width:0;flex:1}.message{margin:5px 0;line-height:1.4}.actor{color:#8ff6ff}.time{font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.badge{display:inline-block;background:#e33;border-radius:20px;padding:3px 7px;font-size:11px}.empty{text-align:center;padding:35px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;border:1px solid #405078;padding:14px 18px;border-radius:12px;z-index:99;box-shadow:0 10px 30px #0008}@media(max-width:600px){main{padding:10px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}.n{padding:12px}}
</style></head><body><main>
<div class="top"><div class="brand">🖤 CrowSpace <span class="pill">Notifications 3.0</span></div><a class="btn" href="./">← CrowSpace</a></div>
<section class="card"><h1>🔔 Notifications</h1><p class="muted">Stay up to date with activity across your CrowSpace.</p>
<div class="stats"><div class="stat"><b id="total">0</b><span class="muted">Total</span></div><div class="stat"><b id="unread">0</b><span class="muted">Unread</span></div><div class="stat"><b id="today">0</b><span class="muted">Today</span></div></div>
<div class="toolbar" style="margin-top:14px"><input id="search" style="flex:1;min-width:220px" placeholder="Search notifications…"><button class="btn filter active" data-filter="all">All</button><button class="btn filter" data-filter="friend">🤝 Friends</button><button class="btn filter" data-filter="follow">👤 Follows</button><button class="btn filter" data-filter="post">📝 Posts</button><button class="btn filter" data-filter="media">🖼️ Media</button><button class="btn filter" data-filter="comment">💬 Comments</button><button class="btn filter" data-filter="message">✉️ Messages</button><button class="btn" id="read">Mark All Read</button></div>
</section>
<section class="card"><div id="list"><div class="empty muted">Loading…</div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me=null,data=[],filter="all",live,actorProfiles={};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const icon=t=>{t=String(t||"").toLowerCase();if(t.includes("friend"))return"🤝";if(t.includes("follow"))return"👤";if(t.includes("media")||t.includes("photo"))return"🖼️";if(t.includes("comment"))return"💬";if(t.includes("message"))return"✉️";if(t.includes("post")||t.includes("bulletin"))return"📝";return"🔔"};
function typeMatch(t){t=String(t||"").toLowerCase();return filter==="all"||t.includes(filter)}
function actorLink(x){return x.actor_id?'<a class="actor" href="./profile.html?u='+encodeURIComponent(x.actor_id)+'">Member</a>':""}
function render(){
 const term=search.value.trim().toLowerCase();
 const rows=data.filter(x=>typeMatch(x.type)&&(!term||[x.type,x.message,actorProfiles[x.actor_id]?.display_name,actorProfiles[x.actor_id]?.username].some(v=>String(v||"").toLowerCase().includes(term))));
 const now=new Date(),day=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 total.textContent=data.length;unread.textContent=data.filter(x=>!x.is_read).length;today.textContent=data.filter(x=>new Date(x.created_at)>=day).length;
 if(!rows.length){list.innerHTML='<div class="empty muted">No notifications in this category.</div>';return}
 const groups={};rows.forEach(x=>{const d=new Date(x.created_at).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric",year:"numeric"});(groups[d]??=[]).push(x)});
 list.innerHTML=Object.entries(groups).map(([date,items])=>'<div style="padding:12px 15px;color:#8ff6ff;font-weight:800;border-bottom:1px solid #25293a">📅 '+esc(date)+'</div>'+items.map(x=>{
   const p=actorProfiles[x.actor_id]||{},name=p.display_name||p.username||"Someone";
   const avatar=p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="">':esc((name||"M").slice(0,1).toUpperCase());
   const actor=x.actor_id?'<a class="actor" href="./profile.html?u='+encodeURIComponent(p.username||"")+'">'+esc(name)+'</a>':"";
   const msg=esc(x.message||"You have a new CrowSpace notification.");
   const unreadClass=x.is_read?"":"unread";
   const open=x.reference_id?'<button class="btn" onclick="openReference(\''+String(x.reference_id).replace(/'/g,"\\'")+'\',\''+String(x.type||"").replace(/'/g,"\\'")+'\')">Open</button>':"";
   return '<article class="n '+unreadClass+'" data-id="'+esc(x.id)+'"><div class="icon actorAvatar">'+avatar+'</div><div class="content"><b>'+esc(x.type||"CrowSpace")+'</b><div class="message">'+(actor?actor+" · ":"")+msg+'</div><div class="time muted">'+relativeTime(x.created_at)+' · '+new Date(x.created_at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+'</div><div class="actions">'+(!x.is_read?'<button class="btn" onclick="markRead(\''+String(x.id).replace(/'/g,"\\'")+'\')">Mark Read</button>':"")+open+'</div></div></article>'
 }).join("")).join("");
}
function relativeTime(t){const s=Math.max(0,(Date.now()-new Date(t).getTime())/1000);if(s<60)return"Just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";if(s<604800)return Math.floor(s/86400)+"d ago";return Math.floor(s/604800)+"w ago"}
async function load(){
 const s=(await db.auth.getSession()).data.session;me=s?.user;if(!me){list.innerHTML='<div class="empty">Sign in to view notifications.</div>';return}
 const r=await db.from("crowspace_notifications").select("id,user_id,type,actor_id,reference_id,message,is_read,created_at").eq("user_id",me.id).order("created_at",{ascending:false}).limit(300);
 if(r.error){list.innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}
 data=r.data||[];actorProfiles={};const ids=[...new Set(data.map(x=>x.actor_id).filter(Boolean))];
 if(ids.length){const p=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids);(p.data||[]).forEach(x=>actorProfiles[x.user_id]=x)}
 render()
}
async function markRead(id){const r=await db.from("crowspace_notifications").update({is_read:true}).eq("id",id).eq("user_id",me.id);if(!r.error){const x=data.find(n=>n.id===id);if(x)x.is_read=true;render()}}
read.onclick=async()=>{if(!me)return;await db.from("crowspace_notifications").update({is_read:true}).eq("user_id",me.id).eq("is_read",false);data.forEach(x=>x.is_read=true);render()}
async function openReference(id,type){const t=String(type||"").toLowerCase();if(t.includes("friend")){location.href="./friend-requests.html";return}if(t.includes("message")){location.href="./messages.html";return}if(t.includes("media")){location.href="./media.html";return}if(t==="follow"&&id){const p=await db.from("crowspace_profiles").select("username").eq("user_id",id).maybeSingle();location.href=p.data?.username?"./profile.html?u="+encodeURIComponent(p.data.username):"./search.html";return}if(t==="creator_project"&&id){const p=await db.from("dream_projects").select("slug").eq("id",id).maybeSingle();location.href=p.data?.slug?"https://crowrulesentertainment-oss.github.io/dreamscapes/projects.html?slug="+encodeURIComponent(p.data.slug):"https://crowrulesentertainment-oss.github.io/dreamscapes/";return}if(t==="creator_dream"){location.href="https://crowrulesentertainment-oss.github.io/dreamscapes/";return}if(t==="creator_podcast"){location.href="https://crowrulesentertainment-oss.github.io/podcasting/";return}location.href="./";}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent="🔔 "+msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4500)}
function startLive(){if(!me||live)return;live=db.channel("crowspace-notifications-"+me.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"crowspace_notifications",filter:"user_id=eq."+me.id},async p=>{toast(p.new.message||"New CrowSpace notification");await load()}).on("postgres_changes",{event:"UPDATE",schema:"public",table:"crowspace_notifications",filter:"user_id=eq."+me.id},load).on("postgres_changes",{event:"DELETE",schema:"public",table:"crowspace_notifications",filter:"user_id=eq."+me.id},load).subscribe()}
search.oninput=render;document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});
load().then(startLive);
</script><style>
.actorAvatar{font-size:18px;font-weight:900;overflow:hidden}.actorAvatar img{width:100%;height:100%;object-fit:cover}.n{transition:background .2s,transform .2s}.n:hover{background:#151c2c;transform:translateX(2px)}.n.unread .icon{box-shadow:0 0 0 1px var(--a),0 0 18px #20e6ff22}.sectionLabel{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#8ff6ff;margin:0 0 9px}
</style>
<script>
(function(){
 const title=document.querySelector("h1");if(title)title.insertAdjacentHTML("afterend",'<p class="sectionLabel">Central Activity Center</p>');
 const oldMark=markRead;
 window.markRead=async function(id){await oldMark(id)};
})();
</script><script src="./js/crowspace-holiday-themes.js"></script>
</body></html>

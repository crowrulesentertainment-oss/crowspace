<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">My Nest</a><a href="people.html">People</a><a href="friends.html">Friends</a><a href="caws.html">Caws</a><a href="albums.html">Photos</a><a href="groups.html">Groups</a><a href="events.html">Events</a><a class="active" href="notifications.html">Messages</a></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">YOUR NEST</p><h1>Notifications</h1><p class="muted">Friend requests, follows and other CrowSpace activity.</p></div><button class="btn" onclick="markAll()">Mark all read</button></div><div id="notifications" class="grid two"></div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>const esc=CS.escape;async function load(){const u=await CS.user();if(!u){location.href="login.html";return}const {data,error}=await crowSupabase.from("crowspace_notifications").select("*").eq("user_id",u.id).order("created_at",{ascending:false}).limit(50);if(error){notifications.innerHTML='<div class="card"><p>'+esc(error.message)+'</p></div>';return}notifications.innerHTML=(data||[]).map(n=>'<article class="card" style="'+(!n.read_at?'border-left:4px solid var(--primary);':'')+'"><span class="event-tag">'+esc(n.type||"activity")+'</span><p>'+esc(n.body||"You have a new notification.")+'</p><small class="muted">'+new Date(n.created_at).toLocaleString()+'</small></article>').join("")||'<div class="card"><p class="muted">No notifications yet.</p></div>'}async function markAll(){const u=await CS.user();if(u)await crowSupabase.from("crowspace_notifications").update({read_at:new Date().toISOString()}).eq("user_id",u.id).is("read_at",null);load()}document.addEventListener("DOMContentLoaded",async()=>{await CS.refreshHeader();load()});</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">YOUR NEST</p><h1>Notifications</h1><p class="muted">Friend requests, follows and other CrowSpace activity.</p></div><div class="actions"><button class="btn" id="readAll">Mark all read</button><button class="btn" id="refresh">Refresh</button></div></div><div id="summary" class="card"><strong>Loading activity…</strong></div><div id="notifications" class="grid two"></div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>const esc=CS.escape;async function load(){const u=await CS.user();if(!u){location.href="login.html";return}const {data,error}=await crowSupabase.from("crowspace_notifications").select("*").eq("user_id",u.id).order("created_at",{ascending:false}).limit(100);if(error){notifications.innerHTML='<div class="card"><p>'+esc(error.message)+'</p></div>';return}const rows=data||[];const ids=[...new Set(rows.map(n=>n.actor_id).filter(Boolean))];const {data:ps}=ids.length?await crowSupabase.rpc("crowspace_public_profiles_by_ids",{ids}):{data:[]};const map=Object.fromEntries((ps||[]).map(p=>[p.id,p]));const unread=rows.filter(n=>!n.read_at).length;summary.innerHTML='<strong>'+unread+' unread</strong><p class="muted">'+rows.length+' recent notifications</p>';notifications.innerHTML=rows.map(n=>{const p=map[n.actor_id]||{};const name=p.display_name||p.username||"CrowSpace Member";const target=n.actor_id?'profile.html?id='+encodeURIComponent(n.actor_id):'index.html';return '<article class="card" style="'+(!n.read_at?'border-left:4px solid var(--primary);':'')+'"><div class="post-head"><a class="avatar sm" href="'+target+'">'+esc(name.slice(0,1).toUpperCase())+'</a><div><a href="'+target+'"><strong>'+esc(name)+'</strong></a><small>'+new Date(n.created_at).toLocaleString()+'</small></div></div><span class="event-tag">'+esc(n.type||"activity")+'</span><p>'+esc(n.body||"You have a new notification.")+'</p><div class="actions"><button class="btn" onclick="markOne(\''+n.id+'\')">'+(n.read_at?'Read':'Mark read')+'</button><a class="btn" href="'+target+'">Open →</a></div></article>'}).join("")||'<div class="card"><p class="muted">No notifications yet.</p></div>'}async function markOne(id){const u=await CS.user();if(!u)return;await crowSupabase.from("crowspace_notifications").update({read_at:new Date().toISOString()}).eq("id",id).eq("user_id",u.id);await load();CS.refreshNotificationBadge()}async function markAll(){const u=await CS.user();if(!u)return;await crowSupabase.from("crowspace_notifications").update({read_at:new Date().toISOString()}).eq("user_id",u.id).is("read_at",null);await load();CS.refreshNotificationBadge()}readAll.onclick=markAll;refresh.onclick=load;document.addEventListener("DOMContentLoaded",async()=>{await CS.refreshHeader();await load()});</script><script src="js/global-nav.js"></script></body></html>

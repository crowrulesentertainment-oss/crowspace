<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace — Notifications</title><link rel="stylesheet" href="style.css"></head><body><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><header class="topbar"><a class="brand" href="home.html"><span class="brand-mark">◉</span><span>CROW<span>SPACE</span></span></a><div class="search"><span>⌕</span><input placeholder="Search CrowSpace"></div><nav class="top-actions"><button>🔔</button><button>✉</button><a class="avatar" href="profile.html">JR</a></nav></header><div class="shell"><aside class="sidebar"><a class="nav" href="home.html"><span>⌂</span> Home</a><a class="nav" href="explore.html"><span>⌕</span> Explore</a><a class="nav" href="caws.html"><span>▶</span> Caws</a><a class="nav" href="circles.html"><span>◈</span> Circles</a><a class="nav active" href="notifications.html"><span>♢</span> Notifications</a><a class="nav" href="messages.html"><span>✉</span> Messages</a><a class="nav" href="profile.html"><span>●</span> Profile</a></aside><main class="feed"><section class="hero"><div><div class="eyebrow">NOTIFICATIONS // UNIVERSAL IDENTITY</div><h1>Your CrowSpace<br><em>signals.</em></h1><p>Likes, comments, follows and messages generated by your CrowRules identity.</p></div><div class="hero-orbit">♢</div></section><section class="card panel"><div style="display:flex;justify-content:space-between;align-items:center"><div class="panel-title">ACTIVITY</div><button id="markRead" class="post-button">Mark all read</button></div><div id="notificationList" class="notification-list"><div class="notification">Loading your signals…</div></div></section></main></div><script src="crowspace-core.js"></script><script src="crowspace-social.js"></script><script>
(async()=>{const list=document.getElementById("notificationList");try{const rows=await CrowSpaceSocial.loadNotifications();list.innerHTML=rows.length?rows.map(n=>{const p=n.profile||{};const name=p.display_name||p.username||"Crow Member";return '<div class="notification" style="opacity:'+(n.read_at?".6":"1")+'"><div class="avatar">'+(p.avatar_url?'<img src="'+CrowSpaceSocial.esc(p.avatar_url)+'" alt="">':CrowSpaceSocial.esc(name.slice(0,2).toUpperCase()))+'</div><div><b>'+CrowSpaceSocial.esc(n.body||n.type||"New activity")+'</b><small>'+new Date(n.created_at).toLocaleString()+'</small></div></div>'}).join(""):"<div class="notification"><div><b>No new activity.</b><small>Your CrowSpace notifications will appear here.</small></div></div>";}catch(e){list.innerHTML='<div class="notification"><b>Sign in to view notifications.</b></div>';}document.getElementById("markRead").onclick=async()=>{try{await CrowSpaceSocial.markNotificationsRead();location.reload()}catch(e){}}})();</script></body></html>

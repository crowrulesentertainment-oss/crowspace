<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><style>.n-wrap{max-width:900px;margin:auto;padding:30px 18px}.n-hero,.n-card{border:1px solid #ffffff18;background:#090c15;border-radius:8px;padding:20px}.n-list{display:grid;gap:8px;margin-top:15px}.n-card{display:flex;gap:12px;align-items:center;text-decoration:none;color:#fff}.n-card.unread{border-color:#59e7ff55;background:#59e7ff09}.n-avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#111a2a;border:1px solid #59e7ff44;font:800 13px Orbitron;flex:0 0 44px}.n-avatar img{width:100%;height:100%;object-fit:cover}.n-main{flex:1}.n-main strong{display:block;font-size:12px}.n-main span{display:block;color:#aeb9ca;margin-top:4px;font-size:11px}.n-main small{display:block;color:#68768d;margin-top:5px;font-size:9px}.n-dot{width:7px;height:7px;border-radius:50%;background:#59e7ff;box-shadow:0 0 10px #59e7ff}.n-toolbar{display:flex;gap:8px;margin-top:15px}.n-toolbar button{padding:8px 12px;border:1px solid #ffffff18;background:#0a0e17;color:#fff;border-radius:4px;cursor:pointer}.empty{padding:30px;text-align:center;color:#758197;border:1px dashed #ffffff18}</style></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="n-wrap"><section class="n-hero"><div class="eyebrow">UNIVERSAL SIGNAL</div><h1>Notifications</h1><p>Likes, replies, reposts, saves and activity connected to your Nest.</p><div class="n-toolbar"><button id="readAll">MARK ALL READ</button><button id="refresh">REFRESH</button></div></section><section class="n-list" id="notifications"><div class="empty">Syncing notifications…</div></section></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script src="js/global-nav.js"></script><script>(async()=>{const db=()=>window.crowSupabase,esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const list=document.getElementById('notifications');let me=null;async function load(){if(!db())return;me=(await db().auth.getUser()).data?.user;if(!me){location.href='login.html';return}const r=await db().from('crowspace_notifications').select('id,actor_id,type,body,read_at,created_at,post_id,caw_id,interaction_type,metadata').eq('user_id',me.id).order('created_at',{ascending:false}).limit(100);if(r.error){list.innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}const ids=[...new Set((r.data||[]).map(x=>x.actor_id).filter(Boolean))];let people={};if(ids.length){const p=await db().from('membership_profiles').select('id,display_name,username,avatar_url').in('id',ids);people=Object.fromEntries((p.data||[]).map(x=>[x.id,x]))}list.innerHTML=(r.data||[]).map(n=>{const p=people[n.actor_id]||{},name=p.display_name||p.username||'CrowSpace Member',target=n.caw_id?'caw-feed.html?caw='+encodeURIComponent(n.caw_id):n.post_id?'index.html#post-'+encodeURIComponent(n.post_id):'activity.html';return '<a class="n-card '+(!n.read_at?'unread':'')+'" href="'+target+'" data-id="'+esc(n.id)+'"><div class="n-avatar">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="">':esc(name[0]||'C'))+'</div><div class="n-main"><strong>'+esc(name)+'</strong><span>'+esc(n.body||'New CrowSpace activity')+'</span><small>'+new Date(n.created_at).toLocaleString()+'</small></div>'+(!n.read_at?'<i class="n-dot"></i>':'')+'</a>'}).join('')||'<div class="empty">No new signal yet.</div>';list.querySelectorAll('.n-card.unread').forEach(a=>a.addEventListener('click',()=>db().from('crowspace_notifications').update({read_at:new Date().toISOString()}).eq('id',a.dataset.id)))}document.getElementById('readAll').onclick=async()=>{if(me)await db().from('crowspace_notifications').update({read_at:new Date().toISOString()}).eq('user_id',me.id).is('read_at',null);load()};document.getElementById('refresh').onclick=load;window.CrowNotifications={refresh:load};await load();if(db())db().channel('crowspace-notifications-page').on('postgres_changes',{event:'*',schema:'public',table:'crowspace_notifications'},load).subscribe()})();</script></body></html>

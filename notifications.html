<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Notifications</title><style>body{margin:0;background:#05050b;color:#fff;font:14px Arial;padding:25px}main{max-width:800px;margin:auto}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:20px}.n{padding:15px;border-bottom:1px solid #25293a}.unread{background:#111b2b}.muted{color:#9da5bd}button,a{color:#fff;background:#182033;border:1px solid #343c56;padding:9px 13px;border-radius:9px;text-decoration:none}</style></head><body><main><div class="card"><h1>🔔 Notifications</h1><button id="read">Mark All Read</button><div id="list" style="margin-top:15px">Loading...</div><p><a href="./">← CrowSpace</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){me=(await db.auth.getSession()).data.session?.user;if(!me){list.textContent="Sign in to view notifications.";return}const r=await db.from("crowspace_notifications").select("*").eq("user_id",me.id).order("created_at",{ascending:false}).limit(50);if(r.error){list.textContent="Notifications are unavailable.";return}list.innerHTML=(r.data||[]).map(x=>'<div class="n '+(!x.is_read?"unread":"")+'"><b>'+esc(x.type||"CrowSpace")+'</b><p>'+esc(x.message)+'</p><small class="muted">'+new Date(x.created_at).toLocaleString()+'</small></div>').join("")||'<span class="muted">You are all caught up.</span>'}
read.onclick=async()=>{if(!me)return;await db.from("crowspace_notifications").update({is_read:true}).eq("user_id",me.id).eq("is_read",false);load()};load();
</script></body></html>

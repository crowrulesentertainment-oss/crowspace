<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html"><span>●</span> CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">My Nest</a><a href="caws.html">Caws</a><a href="groups.html">Groups</a><a href="events.html">Events</a><a href="dreamscapes.html">Dreamscapes</a><a href="memorials.html">Memorials</a><a href="notifications.html">Messages</a></nav><div id="account"><a href="login.html">Sign In</a></div></header><main class="section"><p class="eyebrow">NEST</p><h1>Notifications</h1><div id="notifications"></div><a class="btn" href="index.html">Home</a></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=(await crowSupabase.auth.getUser()).data.user;if(!u){location.href="login.html";return}const {data}=await crowSupabase.from("crowspace_notifications").select("*").order("created_at",{ascending:false}).limit(50);notifications.innerHTML=(data||[]).map(n=>'<div class="card"><strong>'+CS.escape(n.type)+'</strong><p>'+CS.escape(n.body||"You have a new notification.")+'</p><small>'+new Date(n.created_at).toLocaleString()+'</small></div>').join("")||'<p class="muted">No notifications yet.</p>';await crowSupabase.from("crowspace_notifications").update({read_at:new Date().toISOString()}).eq("user_id",u.id).is("read_at",null)})</script></body></html>

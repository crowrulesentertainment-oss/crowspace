<style>
.cs-holiday-intel{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin-top:14px}
.cs-holiday-feature,.cs-holiday-side{border:1px solid var(--cs-line);border-radius:20px;background:linear-gradient(145deg,rgba(14,20,40,.98),rgba(4,7,16,.98));box-shadow:0 18px 55px #0006;overflow:hidden}
.cs-holiday-feature{padding:24px;position:relative}.cs-holiday-feature:after{content:'';position:absolute;inset:auto -20% -45% 25%;height:240px;background:radial-gradient(circle,#78efff18,transparent 68%);pointer-events:none}
.cs-holiday-kicker{font:800 9px Orbitron;color:var(--cs-cyan);letter-spacing:.14em}.cs-holiday-feature h2{font:900 32px Orbitron;margin:8px 0 4px}.cs-holiday-feature .date{color:var(--cs-muted);font-size:11px}.cs-live-count{font:900 42px Orbitron;margin:22px 0 5px;letter-spacing:-.05em}.cs-live-count small{display:block;font:700 8px Orbitron;color:var(--cs-muted);letter-spacing:.12em;margin-top:5px}
.cs-holiday-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.cs-holiday-fact{padding:11px;border:1px solid #ffffff0b;border-radius:12px;background:#ffffff04}.cs-holiday-fact b{display:block;color:var(--cs-cyan);font:900 14px Orbitron}.cs-holiday-fact span{display:block;color:var(--cs-muted);font-size:8px;margin-top:4px}
.cs-holiday-description{position:relative;color:var(--cs-muted);font-size:10px;line-height:1.65;margin:17px 0 0;max-width:850px}
.cs-holiday-side{padding:18px}.cs-holiday-side h3{font:900 15px Orbitron;margin:2px 0 12px}.cs-holiday-status{padding:12px;border:1px solid var(--cs-line);border-radius:13px;background:#ffffff04;color:var(--cs-muted);font-size:9px;line-height:1.6}.cs-holiday-status strong{color:#fff}
.cs-holiday-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.cs-holiday-actions a,.cs-holiday-actions button{border:1px solid var(--cs-line);background:#ffffff06;color:#fff;border-radius:999px;padding:8px 11px;text-decoration:none;font:800 8px Orbitron;cursor:pointer}.cs-holiday-actions a:hover,.cs-holiday-actions button:hover{border-color:var(--cs-cyan)}
.cs-holiday-timeline{margin-top:14px;border:1px solid var(--cs-line);border-radius:20px;padding:18px;background:#050914}.cs-holiday-timeline h3{font:900 16px Orbitron;margin:0 0 12px}.cs-timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cs-tile{padding:12px;border:1px solid #ffffff0b;border-radius:13px;background:#ffffff03}.cs-tile strong{display:block;font:900 11px Orbitron}.cs-tile span{display:block;color:var(--cs-muted);font-size:8px;margin-top:5px}.cs-tile em{display:block;color:var(--cs-cyan);font:800 8px Orbitron;font-style:normal;margin-top:9px}
.cs-holiday-planner{margin-top:14px;border:1px solid var(--cs-line);border-radius:20px;padding:18px;background:#050914}.cs-planner-head{display:flex;justify-content:space-between;gap:12px;align-items:end}.cs-planner-head h3{font:900 16px Orbitron;margin:3px 0}.cs-planner-sub{color:var(--cs-muted);font-size:9px}.cs-planner-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.cs-plan-item{padding:12px;border:1px solid #ffffff0b;border-radius:13px;background:#ffffff03}.cs-plan-item label{display:flex;gap:8px;align-items:flex-start;color:var(--cs-muted);font-size:9px;line-height:1.5}.cs-plan-item input{accent-color:var(--cs-cyan);margin-top:2px}.cs-plan-progress{margin-top:12px;height:7px;border-radius:99px;background:#ffffff0a;overflow:hidden}.cs-plan-progress i{display:block;height:100%;width:0;background:var(--cs-cyan);transition:width .25s}.cs-plan-meta{margin-top:7px;color:#ffffff66;font:700 7px Orbitron}.cs-community{margin-top:14px;border:1px solid var(--cs-line);border-radius:20px;padding:20px;background:linear-gradient(145deg,rgba(14,20,40,.98),rgba(4,7,16,.98));box-shadow:0 18px 55px #0006}.cs-community-head{display:flex;justify-content:space-between;gap:16px;align-items:end}.cs-community-head h3{font:900 18px Orbitron;margin:4px 0}.cs-community-head p{color:var(--cs-muted);font-size:9px;line-height:1.6;margin:4px 0 0}.cs-community-state{color:var(--cs-cyan);font:800 8px Orbitron;text-align:right}.cs-community-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.cs-community-actions a,.cs-community-actions button,.cs-form-actions button{border:1px solid var(--cs-line);background:#ffffff06;color:#fff;border-radius:999px;padding:9px 12px;text-decoration:none;font:800 8px Orbitron;cursor:pointer}.cs-community-actions a:hover,.cs-community-actions button:hover,.cs-form-actions button:hover{border-color:var(--cs-cyan)}.cs-community-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cs-community-grid article{border:1px solid #ffffff0b;border-radius:15px;padding:14px;background:#ffffff03}.cs-community-grid article h4{font:900 10px Orbitron;color:var(--cs-cyan);margin:0 0 9px}.cs-community-item{padding:10px 0;border-top:1px solid #ffffff08}.cs-community-item:first-child{border-top:0;padding-top:0}.cs-community-item strong{display:block;font:800 10px Orbitron}.cs-community-item span,.cs-community-item small{display:block;color:#ffffff66;font-size:8px;margin-top:4px}.cs-community-item p{color:var(--cs-muted);font-size:9px;line-height:1.55;margin:7px 0}.cs-community-item a{color:var(--cs-cyan);font:800 7px Orbitron;text-decoration:none}.cs-community-empty{padding:12px;color:#ffffff66;font-size:9px;border:1px dashed #ffffff12;border-radius:10px}.cs-community-form{margin-top:12px;padding:15px;border:1px solid var(--cs-line);border-radius:15px;background:#0005}.cs-community-form h4{font:900 10px Orbitron;color:var(--cs-cyan);margin:0 0 10px}.cs-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cs-community-form input,.cs-community-form textarea{box-sizing:border-box;width:100%;border:1px solid #ffffff12;border-radius:10px;background:#ffffff05;color:#fff;padding:10px;font:600 9px Arial}.cs-community-form textarea{min-height:90px;resize:vertical;margin-top:8px}.cs-check{display:flex;gap:7px;color:var(--cs-muted);font-size:9px;margin-top:8px}.cs-form-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.cs-form-actions span{font-size:8px;color:var(--cs-muted)}.cs-form-actions span[data-error="1"]{color:#ff8f9c}
.cs-holiday-footnote{margin-top:10px;color:#ffffff55;font-size:7px;line-height:1.5}
@media(max-width:850px){.cs-holiday-intel{grid-template-columns:1fr}.cs-holiday-facts{grid-template-columns:repeat(2,1fr)}.cs-timeline{grid-template-columns:repeat(2,1fr)}.cs-live-count{font-size:32px}}
@media(max-width:520px){.cs-timeline{grid-template-columns:1fr}.cs-holiday-feature{padding:18px}.cs-planner-grid{grid-template-columns:1fr 1fr}.cs-planner-head{align-items:start;flex-direction:column}}

.cs-experience{margin-top:14px;border:1px solid var(--cs-line);border-radius:20px;padding:20px;background:linear-gradient(145deg,rgba(14,20,40,.98),rgba(4,7,16,.98));box-shadow:0 18px 55px #0006}
.cs-experience-head{display:flex;justify-content:space-between;gap:15px;align-items:end}.cs-experience h3{font:900 18px Orbitron;margin:4px 0}.cs-experience-sub{color:var(--cs-muted);font-size:9px}
.cs-exp-tabs{display:flex;gap:7px;overflow:auto;padding:12px 0}.cs-exp-tab{white-space:nowrap;border:1px solid var(--cs-line);border-radius:999px;background:#ffffff04;color:#fff;padding:8px 11px;font:800 8px Orbitron;cursor:pointer}.cs-exp-tab.active{border-color:var(--cs-cyan);color:var(--cs-cyan);background:#78efff0b}
.cs-exp-body{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.cs-exp-panel{padding:15px;border:1px solid #ffffff0b;border-radius:15px;background:#ffffff03}.cs-exp-panel h4{font:900 11px Orbitron;margin:0 0 9px;color:var(--cs-cyan)}.cs-exp-panel p,.cs-exp-panel li{color:var(--cs-muted);font-size:9px;line-height:1.65}.cs-exp-panel ul{padding-left:17px;margin:7px 0}
.cs-celebrate{margin-top:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px;border:1px solid var(--cs-line);border-radius:14px;background:radial-gradient(circle at 80% 0,#78efff12,transparent 45%),#ffffff03}.cs-celebrate strong{font:900 10px Orbitron}.cs-celebrate button{border:1px solid var(--cs-cyan);background:#78efff0d;color:#fff;border-radius:999px;padding:8px 12px;font:800 8px Orbitron;cursor:pointer}
.cs-celebration-mode{position:fixed;inset:0;z-index:99999;display:none;place-items:center;background:radial-gradient(circle at 50% 20%,#ffffff18,transparent 30%),#02030bf2;text-align:center}.cs-celebration-mode.show{display:grid}.cs-celebration-inner{max-width:800px;padding:30px}.cs-celebration-inner .big{font-size:72px}.cs-celebration-inner h2{font:900 clamp(30px,7vw,72px) Orbitron;margin:12px 0}.cs-celebration-inner p{color:var(--cs-muted);font-size:11px;line-height:1.7}.cs-celebration-close{margin-top:18px;border:1px solid var(--cs-line);background:#ffffff0a;color:#fff;border-radius:999px;padding:10px 16px;font:800 8px Orbitron;cursor:pointer}
@media(max-width:760px){.cs-community-grid{grid-template-columns:1fr}.cs-community-head{align-items:start;flex-direction:column}.cs-community-state{text-align:left}.cs-form-grid{grid-template-columns:1fr}.cs-exp-body{grid-template-columns:1fr}.cs-experience-head{align-items:start;flex-direction:column}.cs-celebration-inner .big{font-size:52px}}

</style>

<body data-page="holiday-hub">
<main class="cs-page-shell">
<section class="cs-page-hero"><div class="cs-eyebrow">CROWSPACE // HOLIDAY HUB // V31</div><h1>Holiday Hub</h1><p>Your year-round holiday calendar with live countdowns, automatic date calculations, live holiday intelligence, and a rolling 12-month timeline.</p></section>
<section id="holiday-app" class="cs-holiday-hub" aria-live="polite"></section><section id="holiday-experience" class="cs-experience" aria-live="polite"></section><section id="holiday-community" class="cs-community" aria-live="polite"></section><section id="holiday-planner" class="cs-holiday-planner" aria-live="polite"></section><div id="cs-celebration-mode" class="cs-celebration-mode" role="dialog" aria-modal="true"></div>
</main>

<script>
(function(){
'use strict';
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const nth=(y,m,d)=>new Date(y,m-1,d);
const thanksgiving=y=>{const d=new Date(y,10,1);while(d.getDay()!==4)d.setDate(d.getDate()+1);d.setDate(d.getDate()+21);return d};
const laborDay=y=>{const d=new Date(y,8,1);while(d.getDay()!==1)d.setDate(d.getDate()+1);return d};
const memorialDay=y=>{const d=new Date(y,4,31);while(d.getDay()!==1)d.setDate(d.getDate()-1);return d};
const easter=y=>{const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;return new Date(y,month-1,day)};
function holidays(y){
 const e=easter(y);
 return [
  {name:'New Year’s Day',date:nth(y,1,1),emoji:'🎆',type:'Federal holiday',facts:['Jan 1','1st day','365/366 days','Annual'],note:'Marks the first day of the Gregorian calendar year.'},
  {name:'Martin Luther King Jr. Day',date:nth(y,1,1),emoji:'✊',type:'Federal holiday',facts:['3rd Monday','January','Since 1986','Annual'],note:'A U.S. federal holiday honoring Martin Luther King Jr. and his civil-rights legacy.' ,move:(d)=>{while(d.getDay()!==1)d.setDate(d.getDate()+1);d.setDate(d.getDate()+14);return d}},
  {name:'Valentine’s Day',date:nth(y,2,14),emoji:'❤️',type:'Observance',facts:['Feb 14','Love','Friendship','Annual'],note:'Widely observed as a celebration associated with love, affection and friendship.'},
  {name:'Easter Sunday',date:e,emoji:'🐣',type:'Christian holiday',facts:['Sunday','Variable','Spring','Annual'],note:'A major Christian holiday whose date varies from year to year.'},
  {name:'Memorial Day',date:memorialDay(y),emoji:'🇺🇸',type:'Federal holiday',facts:['Last Monday','May','Since 1971','Annual'],note:'Observed on the last Monday in May to honor U.S. military personnel who died while serving.'},
  {name:'Juneteenth',date:nth(y,6,19),emoji:'🟥',type:'Federal holiday',facts:['June 19','Since 2021','Texas 1865','Annual'],note:'Commemorates June 19, 1865, when news of emancipation reached Galveston, Texas.'},
  {name:'Independence Day',date:nth(y,7,4),emoji:'🇺🇸',type:'Federal holiday',facts:['July 4','1776','Annual','U.S.'],note:'Commemorates adoption of the Declaration of Independence in 1776.'},
  {name:'Labor Day',date:laborDay(y),emoji:'🛠️',type:'Federal holiday',facts:['1st Monday','September','Since 1894','Annual'],note:'Observed on the first Monday in September and recognizes American workers.'},
  {name:'Halloween',date:nth(y,10,31),emoji:'🎃',type:'Observance',facts:['Oct 31','Costumes','Candy','Annual'],note:'Observed every October 31 with costumes, trick-or-treating and other seasonal traditions.'},
  {name:'Veterans Day',date:nth(y,11,11),emoji:'🎖️',type:'Federal holiday',facts:['Nov 11','Since 1954','Veterans','Annual'],note:'Honors people who have served in the U.S. Armed Forces.'},
  {name:'Thanksgiving Day',date:thanksgiving(y),emoji:'🦃',type:'Federal holiday',facts:['4th Thursday','November','Annual','U.S.'],note:'U.S. Thanksgiving is observed on the fourth Thursday of November.'},
  {name:'Christmas Day',date:nth(y,12,25),emoji:'🎄',type:'Federal holiday',facts:['Dec 25','Christian holiday','Annual','Winter'],note:'Observed on December 25 and associated in Christianity with the birth of Jesus.'},
  {name:'New Year’s Eve',date:nth(y,12,31),emoji:'🥂',type:'Observance',facts:['Dec 31','Final day','Countdown','Annual'],note:'New Year’s Eve is observed on December 31 as people mark the end of one calendar year and anticipate the next.'}
 ];
}
function normalize(list){
 return list.map(h=>{
  if(h.name==='Martin Luther King Jr. Day') h.date=h.move(new Date(h.date));
  return h;
 });
}
function pad(n){return String(n).padStart(2,'0')}
function diff(ms){const s=Math.max(0,Math.floor(ms/1000));return{days:Math.floor(s/86400),hours:Math.floor(s%86400/3600),mins:Math.floor(s%3600/60),secs:s%60}}
function dateKey(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
function dateText(d){return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function nextHoliday(now){
 const today=dateKey(now), pool=normalize([...holidays(now.getFullYear()),...holidays(now.getFullYear()+1)]).sort((a,b)=>a.date-b.date);
 return pool.find(h=>dateKey(h.date)>=today)||pool[0];
}
function calendar(now){
 return normalize([...holidays(now.getFullYear()),...holidays(now.getFullYear()+1)])
  .filter(h=>dateKey(h.date)>=dateKey(now))
  .sort((a,b)=>a.date-b.date);
}
function currentSeason(d){const m=d.getMonth()+1;return m<=2?'WINTER':m<=5?'SPRING':m<=8?'SUMMER':'AUTUMN'}
const experiences={
 'New Year’s Eve':{history:'A year-end observance centered on saying farewell to the current year and welcoming the next.',traditions:['Midnight countdowns','Fireworks and light displays','Gathering with friends and family','Making resolutions for the new year'],food:['Appetizers and party snacks','Sparkling beverages','Celebration desserts'],music:['Countdown playlists','Party music','Songs associated with new beginnings'],activities:['Host a countdown','Share a year-in-review','Create goals for the new year','Watch a local or televised celebration']},
 'New Year’s Day':{history:'The first day of the new Gregorian calendar year.',traditions:['New Year greetings','Resolutions','Family gatherings','Parades and seasonal celebrations'],food:['Brunch','Black-eyed peas and greens in some U.S. traditions','Celebration meals'],music:['New beginnings playlists','Festive music'],activities:['Set goals','Rest and recharge','Send greetings']},
 'Valentine’s Day':{history:'An annual observance associated with love, affection and friendship.',traditions:['Cards','Flowers','Gifts','Shared meals'],food:['Chocolate','Desserts','Special dinners'],music:['Love songs','Romantic playlists'],activities:['Send a message','Plan a meal','Celebrate friendship']},
 'Easter Sunday':{history:'A major Christian holiday commemorating the resurrection of Jesus.',traditions:['Religious services','Egg traditions','Family gatherings','Community events'],food:['Easter meals','Egg dishes','Seasonal desserts'],music:['Hymns','Spring playlists'],activities:['Attend a service','Egg hunt','Family gathering']},
 'Memorial Day':{history:'A U.S. federal holiday observed to honor military personnel who died while serving.',traditions:['Memorial observances','Flags and ceremonies','Community gatherings'],food:['Cookouts','Picnic foods'],music:['Memorial and patriotic programming'],activities:['Attend a remembrance event','Visit a memorial','Spend time with family']},
 'Juneteenth':{history:'A U.S. holiday commemorating the end of slavery in the United States, especially the June 19, 1865 announcement in Galveston, Texas.',traditions:['Community celebrations','Educational programs','Music and cultural events'],food:['Barbecue','Red foods and drinks','Community meals'],music:['Gospel','Blues','Soul','Contemporary Black music'],activities:['Learn local history','Attend cultural events','Support community programs']},
 'Independence Day':{history:'A U.S. holiday commemorating the adoption of the Declaration of Independence in 1776.',traditions:['Fireworks','Parades','Flags','Community gatherings'],food:['Barbecue','Picnic foods','Summer desserts'],music:['Patriotic music','Summer playlists'],activities:['Watch fireworks','Attend a parade','Host a cookout']},
 'Labor Day':{history:'A U.S. federal holiday observed on the first Monday in September and associated with workers and the labor movement.',traditions:['Parades','Community gatherings','End-of-summer events'],food:['Cookouts','Picnic foods'],music:['Outdoor party music'],activities:['Attend a community event','Enjoy a final summer gathering']},
 'Halloween':{history:'An October 31 observance shaped by centuries of autumn and remembrance traditions.',traditions:['Costumes','Trick-or-treating','Decorations','Parties'],food:['Candy','Pumpkin treats','Seasonal drinks'],music:['Halloween playlists','Spooky soundtracks'],activities:['Decorate','Carve pumpkins','Host a costume event']},
 'Veterans Day':{history:'A U.S. federal holiday honoring people who have served in the U.S. Armed Forces.',traditions:['Ceremonies','Parades','Veterans recognition'],food:['Community meals'],music:['Ceremonial and patriotic music'],activities:['Thank a veteran','Attend a local ceremony','Learn about veterans in your community']},
 'Thanksgiving Day':{history:'A U.S. federal holiday observed on the fourth Thursday of November and associated with gratitude, gathering and shared meals.',traditions:['Family gatherings','Gratitude','Parades','Football'],food:['Turkey','Stuffing','Cranberry dishes','Pie'],music:['Holiday playlists'],activities:['Share gratitude','Cook together','Volunteer']},
 'Christmas Day':{history:'December 25 is associated in Christianity with the celebration of the birth of Jesus and is also observed culturally in many communities.',traditions:['Gift giving','Decorations','Family gatherings','Religious services'],food:['Holiday meals','Cookies','Seasonal desserts'],music:['Christmas music','Carols'],activities:['Gather with family','Exchange gifts','Watch holiday programs']}
};
function renderExperience(now){
 const host=document.getElementById('holiday-experience');if(!host)return;
 const list=normalize([...holidays(now.getFullYear()),...holidays(now.getFullYear()+1)]).sort((a,b)=>a.date-b.date);
 const current=window.__holidayExperience||nextHoliday(now).name;
 const h=list.find(x=>x.name===current)||list[0],x=experiences[h.name]||{history:h.note,traditions:[],food:[],music:[],activities:[]};
 host.innerHTML='<div class="cs-experience-head"><div><span class="cs-holiday-kicker">V32 // HOLIDAY EXPERIENCES</span><h3>'+h.emoji+' '+esc(h.name)+'</h3><div class="cs-experience-sub">'+dateText(h.date)+' · '+esc(h.type)+'</div></div><div class="cs-experience-sub">DYNAMIC CELEBRATION STATE</div></div><div class="cs-exp-tabs">'+list.map(z=>'<button class="cs-exp-tab '+(z.name===h.name?'active':'')+'" data-exp="'+esc(z.name)+'">'+z.emoji+' '+esc(z.name)+'</button>').join('')+'</div><div class="cs-exp-body"><article class="cs-exp-panel"><h4>HISTORY & TRADITIONS</h4><p>'+esc(x.history)+'</p><ul>'+x.traditions.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul></article><article class="cs-exp-panel"><h4>FOOD · MUSIC · ACTIVITIES</h4><p><b>FOOD:</b> '+x.food.map(esc).join(' · ')+'</p><p><b>MUSIC:</b> '+x.music.map(esc).join(' · ')+'</p><p><b>ACTIVITIES:</b> '+x.activities.map(esc).join(' · ')+'</p></article></div><div class="cs-celebrate"><div><strong>LIVE HOLIDAY CELEBRATION MODE</strong><div class="cs-experience-sub">Turn the current experience into a full-screen CrowSpace celebration.</div></div><button id="cs-start-celebration" type="button">START CELEBRATION</button></div>';
 host.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{window.__holidayExperience=b.dataset.exp;renderExperience(new Date())});
 const btn=document.getElementById('cs-start-celebration');if(btn)btn.onclick=()=>startCelebration(h);renderPlanner(h);
}
function renderPlanner(h){const host=document.getElementById('holiday-planner');if(!host)return;const key='crowspace-holiday-plan-'+h.name+'-'+h.date.getFullYear();const defaults=(experiences[h.name]||{}).activities||[];let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};host.innerHTML='<div class="cs-planner-head"><div><span class="cs-holiday-kicker">V33 // HOLIDAY PLANNER</span><h3>Plan Your '+esc(h.name)+'</h3><div class="cs-planner-sub">Your checklist stays in this browser and resets for the next occurrence.</div></div><div class="cs-planner-sub" id="cs-plan-count"></div></div><div class="cs-planner-grid">'+defaults.map((v,i)=>'<div class="cs-plan-item"><label><input type="checkbox" data-plan="'+i+'" '+(saved[i]?'checked':'')+'> '+esc(v)+'</label></div>').join('')+'</div><div class="cs-plan-progress"><i id="cs-plan-progress"></i></div><div class="cs-plan-meta" id="cs-plan-meta"></div>';const update=()=>{const boxes=[...host.querySelectorAll('[data-plan]')],done=boxes.filter(x=>x.checked).length,pct=boxes.length?Math.round(done/boxes.length*100):0;boxes.forEach(x=>{saved[x.dataset.plan]=x.checked});try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){};host.querySelector('#cs-plan-progress').style.width=pct+'%';host.querySelector('#cs-plan-count').textContent=done+' / '+boxes.length+' COMPLETE';host.querySelector('#cs-plan-meta').textContent=pct===100?'PLAN COMPLETE · READY TO CELEBRATE':pct+'% READY'};host.querySelectorAll('[data-plan]').forEach(x=>x.addEventListener('change',update));update()}
function startCelebration(h){
 const modal=document.getElementById('cs-celebration-mode');if(!modal)return;
 modal.innerHTML='<div class="cs-celebration-inner"><div class="big">'+h.emoji+'</div><h2>'+esc(h.name)+'</h2><p>'+esc((experiences[h.name]||{}).history||h.note)+'</p><p>WELCOME TO THE CROWSPACE HOLIDAY EXPERIENCE</p><button class="cs-celebration-close" type="button">EXIT CELEBRATION</button></div>';
 modal.classList.add('show');const close=modal.querySelector('.cs-celebration-close');if(close)close.onclick=()=>modal.classList.remove('show');
}

function notifyCommunity(h){window.__holidayCommunityState=h;if(window.CrowSpaceHolidayCommunity?.load)window.CrowSpaceHolidayCommunity.load(h)}
function render(){
 const host=document.getElementById('holiday-app'),now=new Date(),next=nextHoliday(now),up=calendar(now),d=diff(next.date-now);
 const today=dateKey(next.date)===dateKey(now),yearDays=new Date(now.getFullYear()+1,0,1)-new Date(now.getFullYear(),0,1),yearStart=new Date(now.getFullYear(),0,1),dayOfYear=Math.floor((dateKey(now)-dateKey(yearStart))/86400000)+1,remaining=Math.max(0,Math.ceil((dateKey(new Date(now.getFullYear()+1,0,1))-dateKey(now))/86400000));
 const status=today?'TODAY · '+next.name+' is here.':d.days===1?'TOMORROW · '+next.name+' arrives tomorrow.':d.days<7?'THIS WEEK · '+next.name+' is less than a week away.':d.days<31?'THIS MONTH · '+next.name+' is coming up soon.':'UPCOMING · '+next.name+' is the next holiday on the calendar.';
 host.innerHTML=`
 <div class="cs-holiday-intel">
  <article class="cs-holiday-feature">
   <div class="cs-holiday-kicker">V31 // HOLIDAY INTELLIGENCE</div>
   <h2>${next.emoji} ${esc(next.name)}</h2>
   <div class="date">${dateText(next.date)} · ${esc(next.type)}</div>
   <div class="cs-live-count" data-live-date="${next.date.toISOString()}">${today?'TODAY':d.days+'d '+pad(d.hours)+'h '+pad(d.mins)+'m '+pad(d.secs)+'s'}<small>${today?'HOLIDAY TODAY':'TIME UNTIL NEXT HOLIDAY'}</small></div>
   <div class="cs-holiday-facts">${next.facts.map((f,i)=>'<div class="cs-holiday-fact"><b>'+esc(f)+'</b><span>Auto-updated fact</span></div>').join('')}</div>
   <p class="cs-holiday-description">${esc(next.note)}</p>
  </article>
  <aside class="cs-holiday-side">
   <h3>LIVE CALENDAR STATUS</h3>
   <div class="cs-holiday-status"><strong>${status}</strong><br>Season: ${currentSeason(now)} · Day ${dayOfYear} of ${yearDays/86400000}<br>${remaining} calendar days remain in ${now.getFullYear()}.</div>
   <div class="cs-holiday-actions"><a href="holiday-bots.html">HOLIDAY BOTS</a><a href="events.html">EVENTS</a><button id="cs-holiday-share" type="button">SHARE</button></div>
   <div class="cs-holiday-footnote">Dates are calculated in the visitor’s local browser time. Moveable holidays recalculate automatically each year.</div>
  </aside>
 </div>
 <section class="cs-holiday-timeline"><h3>UPCOMING HOLIDAY TIMELINE</h3><div class="cs-timeline">${up.slice(0,12).map(h=>{const x=diff(h.date-now);return '<div class="cs-tile"><strong>'+h.emoji+' '+esc(h.name)+'</strong><span>'+dateText(h.date)+'</span><em>'+((dateKey(h.date)===dateKey(now))?'TODAY':x.days+' DAYS')+'</em></div>'}).join('')}</div></section>`;
 const share=document.getElementById('cs-holiday-share'); if(share) share.onclick=async()=>{const txt='CrowSpace Holiday Hub: '+next.name+' · '+dateText(next.date);try{await navigator.clipboard.writeText(txt);share.textContent='COPIED'}catch(e){share.textContent='READY'}}};
function tick(){
 const el=document.querySelector('[data-live-date]');if(!el)return;
 const target=new Date(el.dataset.liveDate),now=new Date(),x=diff(target-now);
 el.firstChild.nodeValue=dateKey(target)===dateKey(now)?'TODAY':x.days+'d '+pad(x.hours)+'h '+pad(x.mins)+'m '+pad(x.secs)+'s';
}
render();renderExperience(new Date());setTimeout(()=>notifyCommunity(nextHoliday(new Date())),700);setInterval(()=>{tick();const n=new Date();if(n.getHours()===0&&n.getMinutes()===0&&n.getSeconds()<2){render();renderExperience(n);notifyCommunity(nextHoliday(n))}},1000);
})();
</script>
</body></html>

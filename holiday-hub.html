<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holiday Hub — CrowSpace</title>
<link rel="stylesheet" href="crowspace-rebuild.css"><link rel="stylesheet" href="crowspace-universal.css">
<script src="crowspace-auth.js"></script><script src="crowspace-universal.js" defer></script>
<style>
.cs-holiday-hub{margin:18px 0}.cs-holiday-intro{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:14px}.cs-holiday-intro h2{margin:4px 0;font:900 26px Orbitron}.cs-holiday-intro p{margin:0;color:var(--cs-muted);font-size:11px}.cs-holiday-clock{font:800 9px Orbitron;color:var(--cs-cyan);white-space:nowrap}
.cs-holiday-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.cs-holiday-card{position:relative;overflow:hidden;border:1px solid var(--cs-line);border-radius:18px;padding:18px;background:linear-gradient(145deg,rgba(14,20,40,.98),rgba(4,7,16,.98));box-shadow:0 18px 55px #0006}.cs-holiday-card.next{grid-column:1/-1}.cs-holiday-card:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 90% 0,#78efff12,transparent 42%);pointer-events:none}.cs-holiday-top{position:relative;display:flex;justify-content:space-between;gap:12px}.cs-holiday-name{font:900 18px Orbitron}.cs-holiday-date{color:var(--cs-muted);font-size:10px;margin-top:5px}.cs-countdown{margin:15px 0;font:900 30px Orbitron;letter-spacing:-.04em}.cs-countdown small{display:block;color:var(--cs-muted);font:700 8px Orbitron;letter-spacing:.08em;margin-top:4px}.cs-facts{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.cs-fact{padding:10px;border:1px solid #ffffff0b;border-radius:11px;background:#ffffff04}.cs-fact b{display:block;color:var(--cs-cyan);font:900 15px Orbitron}.cs-fact span{display:block;color:var(--cs-muted);font-size:8px;margin-top:3px}.cs-holiday-note{position:relative;margin:13px 0 0;color:var(--cs-muted);font-size:9px;line-height:1.55}.cs-holiday-updated{margin-top:10px;color:#ffffff66;font-size:7px}.cs-holiday-badges{display:flex;gap:6px;flex-wrap:wrap}.cs-holiday-badge{padding:5px 7px;border:1px solid var(--cs-line);border-radius:999px;color:var(--cs-muted);font:700 7px Orbitron}
@media(max-width:700px){.cs-holiday-grid{grid-template-columns:1fr}.cs-holiday-card.next{grid-column:auto}.cs-holiday-intro{align-items:start;flex-direction:column}.cs-facts{grid-template-columns:1fr 1fr}.cs-countdown{font-size:24px}}
</style>
</head>
<body data-page="holiday-hub">
<main class="cs-page-shell">
<section class="cs-page-hero"><div class="cs-eyebrow">CROWSPACE // HOLIDAY HUB // V29</div><h1>Holiday Hub</h1><p>Your year-round holiday calendar with live countdowns, automatically calculated dates, and updated holiday facts.</p></section>
<section id="holiday-app" class="cs-holiday-hub" aria-live="polite"></section>
</main>
<script>
(function(){
'use strict';
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const nth=(y,m,d)=>new Date(y,m-1,d);
const thanksgiving=y=>{const d=new Date(y,10,1);while(d.getDay()!==4)d.setDate(d.getDate()+1);d.setDate(d.getDate()+21);return d};
const laborDay=y=>{const d=new Date(y,8,1);while(d.getDay()!==1)d.setDate(d.getDate()+1);return d};
const memorialDay=y=>{const d=new Date(y,4,31);while(d.getDay()!==1)d.setDate(d.getDate()-1);return d};
const easter=y=>{const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);return new Date(y,m-1,Math.floor((h+l-7*m+114)/31),Math.floor((h+l-7*m+114)%31)+1)};
function holidays(y){
 const e=easter(y), em=new Date(e);em.setDate(e.getDate()-2);
 return [
  {key:'new-year',name:'New Year’s Day',date:nth(y,1,1),emoji:'🎆',type:'Federal holiday',facts:['January 1','365 days','First day of the year'],note:'New Year’s Day marks the beginning of the Gregorian calendar year.'},
  {key:'mlk',name:'Martin Luther King Jr. Day',date:nth(y,1,1),emoji:'✊',type:'Federal holiday',facts:['3rd Monday','January','Since 1986'],note:'A U.S. federal holiday honoring Martin Luther King Jr. and his legacy of civil rights advocacy.'},
  {key:'valentines',name:'Valentine’s Day',date:nth(y,2,14),emoji:'❤️',type:'Observance',facts:['February 14','Love & friendship','Annual'],note:'Valentine’s Day is widely observed on February 14 as a celebration associated with love, affection and friendship.'},
  {key:'easter',name:'Easter Sunday',date:e,emoji:'🐣',type:'Christian holiday',facts:['Sunday','Variable date','Spring'],note:'Easter is observed on a Sunday and its date varies from year to year.'},
  {key:'memorial',name:'Memorial Day',date:memorialDay(y),emoji:'🇺🇸',type:'Federal holiday',facts:['Last Monday','May','Since 1971'],note:'Memorial Day is observed on the last Monday in May to honor U.S. military personnel who died while serving.'},
  {key:'juneteenth',name:'Juneteenth',date:nth(y,6,19),emoji:'🟥',type:'Federal holiday',facts:['June 19','Since 2021','Texas 1865'],note:'Juneteenth commemorates June 19, 1865, when news of the Emancipation Proclamation reached Galveston, Texas.'},
  {key:'july4',name:'Independence Day',date:nth(y,7,4),emoji:'🇺🇸',type:'Federal holiday',facts:['July 4','1776','Annual'],note:'Independence Day commemorates the adoption of the Declaration of Independence in 1776.'},
  {key:'labor',name:'Labor Day',date:laborDay(y),emoji:'🛠️',type:'Federal holiday',facts:['1st Monday','September','Since 1894'],note:'Labor Day is observed on the first Monday in September and recognizes the contributions of American workers.'},
  {key:'halloween',name:'Halloween',date:nth(y,10,31),emoji:'🎃',type:'Observance',facts:['October 31','Costumes & candy','Annual'],note:'Halloween is observed every October 31 and is associated with costumes, trick-or-treating and seasonal traditions.'},
  {key:'veterans',name:'Veterans Day',date:nth(y,11,11),emoji:'🎖️',type:'Federal holiday',facts:['November 11','Since 1954','Veterans'],note:'Veterans Day honors people who have served in the U.S. Armed Forces.'},
  {key:'thanksgiving',name:'Thanksgiving Day',date:thanksgiving(y),emoji:'🦃',type:'Federal holiday',facts:['4th Thursday','November','Annual'],note:'U.S. Thanksgiving is observed on the fourth Thursday of November.'},
  {key:'christmas',name:'Christmas Day',date:nth(y,12,25),emoji:'🎄',type:'Federal holiday',facts:['December 25','Christian holiday','Annual'],note:'Christmas Day is observed on December 25 and is associated with the celebration of the birth of Jesus in Christianity.'}
 ];
}
function nextHoliday(now){
 const all=[...holidays(now.getFullYear()),...holidays(now.getFullYear()+1)].sort((a,b)=>a.date-b.date);
 return all.find(h=>h.date.getTime()>=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime())||all[0];
}
function diff(ms){const total=Math.max(0,ms),sec=Math.floor(total/1000),days=Math.floor(sec/86400),hrs=Math.floor(sec%86400/3600),mins=Math.floor(sec%3600/60),secs=sec%60;return {days,hrs,mins,secs}}
function dateText(d){return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function card(h,now,isNext){
 const d=diff(h.date-now),past=h.date<new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const years=new Date(now).getFullYear()-h.date.getFullYear();
 return '<article class="cs-holiday-card '+(isNext?'next':'')+'"><div class="cs-holiday-top"><div><div class="cs-holiday-name">'+h.emoji+' '+esc(h.name)+'</div><div class="cs-holiday-date">'+dateText(h.date)+'</div></div><div class="cs-holiday-badges"><span class="cs-holiday-badge">'+esc(h.type)+'</span></div></div><div class="cs-countdown" data-date="'+h.date.toISOString()+'">'+(past?'TODAY':d.days+'d '+String(d.hrs).padStart(2,'0')+'h '+String(d.mins).padStart(2,'0')+'m '+String(d.secs).padStart(2,'0')+'s')+'<small>'+ (isNext?'NEXT HOLIDAY':'COUNTDOWN') +'</small></div><div class="cs-facts">'+h.facts.map((x,i)=>'<div class="cs-fact"><b>'+esc(x)+'</b><span>Holiday fact</span></div>').join('')+'</div><p class="cs-holiday-note">'+esc(h.note)+'</p><div class="cs-holiday-updated">Facts/date calculations automatically refreshed from the current date · '+new Date(now).toLocaleTimeString()+'</div></article>';
}
function render(){
 const host=document.getElementById('holiday-app'),now=new Date(),next=nextHoliday(now),all=[...holidays(now.getFullYear()),...holidays(now.getFullYear()+1)].filter(h=>h.date>=new Date(now.getFullYear(),now.getMonth(),now.getDate())).sort((a,b)=>a.date-b.date);
 host.innerHTML='<div class="cs-holiday-intro"><div><span class="cs-eyebrow">LIVE HOLIDAY CALENDAR</span><h2>What’s Coming Next</h2><p>Countdowns update automatically in real time. Holiday dates recalculate each year.</p></div><div class="cs-holiday-clock">LOCAL TIME · '+now.toLocaleString()+'</div></div><div class="cs-holiday-grid">'+card(next,now,true)+all.slice(1,9).map(h=>card(h,now,false)).join('')+'</div>';
}
function tick(){
 document.querySelectorAll('.cs-countdown[data-date]').forEach(el=>{const d=new Date(el.dataset.date),now=new Date(),x=diff(d-now);el.firstChild.nodeValue=(d.toDateString()===now.toDateString()?'TODAY':x.days+'d '+String(x.hrs).padStart(2,'0')+'h '+String(x.mins).padStart(2,'0')+'m '+String(x.secs).padStart(2,'0')+'s')});
}
render();setInterval(()=>{tick();const n=new Date();if(n.getHours()===0&&n.getMinutes()===0&&n.getSeconds()<2)render()},1000);
})();
</script>
</body></html>

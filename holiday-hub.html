.cs-live-center{margin-top:14px;border:1px solid var(--cs-line);border-radius:20px;padding:20px;background:linear-gradient(145deg,rgba(14,20,40,.98),rgba(4,7,16,.98));box-shadow:0 18px 55px #0006}.cs-live-head{display:flex;justify-content:space-between;gap:15px;align-items:end}.cs-live-head h3{font:900 18px Orbitron;margin:4px 0}.cs-live-head p{color:var(--cs-muted);font-size:9px;margin:5px 0}.cs-live-pulse{color:#ff7182;font:900 8px Orbitron}.cs-live-pulse i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff7182;box-shadow:0 0 12px #ff7182;margin-right:6px}.cs-live-now{margin-top:12px}.cs-live-event{display:flex;justify-content:space-between;gap:12px;padding:14px;border-radius:14px;border:1px solid #ff718233;background:#ff35520a}.cs-live-event b,.cs-live-item b{font:900 10px Orbitron}.cs-live-event span,.cs-live-item span{display:block;color:#ffffff66;font-size:8px;margin-top:5px}.cs-live-event p,.cs-live-item p{color:var(--cs-muted);font-size:9px;line-height:1.5;margin:7px 0}.cs-live-event a{align-self:center;color:#fff;text-decoration:none;border:1px solid #ff7182;border-radius:999px;padding:8px 11px;font:800 8px Orbitron}.cs-live-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.cs-live-grid article{border:1px solid #ffffff0b;border-radius:15px;padding:14px;background:#ffffff03}.cs-live-grid h4{font:900 10px Orbitron;color:var(--cs-cyan);margin:0 0 9px}.cs-live-item{border-top:1px solid #ffffff08;padding:9px 0}.cs-live-item:first-child{border-top:0;padding-top:0}.cs-live-empty{padding:12px;color:#ffffff66;font-size:9px;border:1px dashed #ffffff12;border-radius:10px}.cs-live-footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;color:#ffffff55;font:700 7px Orbitron}.cs-live-footer button{border:1px solid var(--cs-line);background:#ffffff05;color:#fff;border-radius:999px;padding:7px 10px;font:800 7px Orbitron;cursor:pointer}
.cs-event-center{margin-top:14px;border:1px solid var(--cs-line);border-radius:22px;padding:20px;background:linear-gradient(145deg,rgba(14,20,40,.99),rgba(3,6,14,.99));box-shadow:0 20px 65px #0007}.cs-event-center-head{display:flex;justify-content:space-between;gap:18px;align-items:end}.cs-event-center-head h2{font:900 24px Orbitron;margin:5px 0}.cs-event-center-head p{color:var(--cs-muted);font-size:9px;line-height:1.6;max-width:780px}.cs-event-center-meta{text-align:right}.cs-event-center-meta strong{display:block;color:var(--holiday-a,var(--cs-cyan));font:900 30px Orbitron}.cs-event-center-meta span{color:#ffffff66;font:800 7px Orbitron}.cs-event-center-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0;color:#ffffff66;font:700 8px Orbitron}.cs-event-center-toolbar button{border:1px solid var(--cs-line);background:#ffffff06;color:#fff;border-radius:999px;padding:8px 11px;font:800 8px Orbitron;cursor:pointer}.cs-event-sync{margin-left:auto;color:var(--holiday-a,var(--cs-cyan))}.cs-event-center-grid{display:grid;grid-template-columns:1.45fr .55fr;gap:10px}.cs-event-panel{border:1px solid #ffffff0b;border-radius:16px;padding:15px;background:#ffffff03}.cs-event-panel h3{font:900 11px Orbitron;color:var(--holiday-a,var(--cs-cyan));margin:0 0 11px}.cs-event-list{display:grid;gap:8px;max-height:640px;overflow:auto}.cs-event-card{display:grid;grid-template-columns:48px 1fr auto;gap:11px;align-items:start;padding:11px;border:1px solid #ffffff09;border-radius:13px;background:#ffffff03}.cs-event-card.today{border-color:var(--holiday-a,var(--cs-cyan));background:#ffffff08}.cs-event-date{text-align:center;border:1px solid #ffffff0b;border-radius:10px;padding:7px 4px}.cs-event-date b{display:block;font:900 17px Orbitron;color:var(--holiday-a,var(--cs-cyan))}.cs-event-date span{display:block;color:#ffffff66;font:800 7px Orbitron}.cs-event-main strong{display:block;font:900 9px Orbitron}.cs-event-main>span{display:block;color:#fff9;font-size:8px;margin-top:4px}.cs-event-main p{color:var(--cs-muted);font-size:8px;line-height:1.5;margin:5px 0}.cs-event-main small{color:#ffffff44;font-size:7px}.cs-event-state{font:900 7px Orbitron;color:var(--holiday-a,var(--cs-cyan));white-space:nowrap}.cs-event-side{display:grid;gap:10px}.cs-next-event{padding:12px;border:1px solid #ffffff12;border-radius:12px;background:#ffffff04}.cs-next-event>b{display:block;font:900 10px Orbitron}.cs-next-event>span,.cs-next-event>small{display:block;color:#ffffff66;font-size:8px;margin-top:5px}.cs-next-event>strong{display:block;color:var(--holiday-a,var(--cs-cyan));font:900 17px Orbitron;margin-top:13px}.cs-mini-event{padding:9px 0;border-top:1px solid #ffffff08}.cs-mini-event:first-child{border-top:0;padding-top:0}.cs-mini-event b{display:block;font:800 8px Orbitron}.cs-mini-event span{display:block;color:#ffffff66;font-size:7px;margin-top:4px}.cs-holiday-content-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.cs-holiday-items{display:grid;gap:7px}.cs-holiday-content-item{display:block;text-decoration:none;color:#fff;border:1px solid #ffffff08;border-radius:11px;padding:10px;background:#ffffff03}.cs-holiday-content-item:hover{border-color:var(--holiday-a,var(--cs-cyan))}.cs-holiday-content-item strong{display:block;font:800 9px Orbitron}.cs-holiday-content-item span{display:block;color:var(--cs-muted);font-size:8px;line-height:1.5;margin-top:4px}.cs-holiday-content-item small{display:block;color:#ffffff44;font-size:7px;margin-top:5px}.cs-event-empty{padding:11px;border:1px dashed #ffffff12;border-radius:10px;color:#ffffff55;font-size:8px;line-height:1.5}.cs-event-center-foot{margin-top:11px;color:#ffffff44;font-size:7px;line-height:1.5}@media(max-width:850px){.cs-event-center-grid{grid-template-columns:1fr}.cs-event-center-head{align-items:start;flex-direction:column}.cs-event-center-meta{text-align:left}}@media(max-width:560px){.cs-event-card{grid-template-columns:42px 1fr}.cs-event-state{grid-column:2}.cs-holiday-content-grid{grid-template-columns:1fr}.cs-event-sync{margin-left:0}}.cs-holiday-footnote{margin-top:10px;color:#ffffff55;font-size:7px;line-height:1.5}

/* V38 Holiday-specific animated layouts */
body.cs-holiday-layout{overflow-x:hidden;transition:background .8s ease}
body.cs-holiday-layout .cs-page-hero,body.cs-holiday-layout .cs-holiday-feature,body.cs-holiday-layout .cs-holiday-side,body.cs-holiday-layout .cs-holiday-timeline,body.cs-holiday-layout .cs-experience,body.cs-holiday-layout .cs-live-center,body.cs-holiday-layout .cs-holiday-network,body.cs-holiday-layout .cs-community,body.cs-holiday-layout .cs-holiday-planner{transition:border-color .8s,box-shadow .8s,transform .5s,background .8s}
body.cs-holiday-layout .cs-page-hero{position:relative;overflow:hidden;border-radius:24px}
body.cs-holiday-layout .cs-page-hero:before{content:'';position:absolute;inset:-50%;background:radial-gradient(circle at 30% 40%,var(--holiday-a,#78efff)22,transparent 22%),radial-gradient(circle at 70% 60%,var(--holiday-b,#8b5cf6)20,transparent 22%);opacity:.13;animation:csHolidayAura 10s linear infinite}

body.cs-holiday-layout .cs-holiday-feature:after{background:radial-gradient(circle,var(--holiday-a,#78efff)25,transparent 68%);animation:csHolidayGlow 5s ease-in-out infinite alternate}
body.cs-holiday-layout .cs-live-count{color:var(--holiday-a,#78efff);text-shadow:0 0 28px color-mix(in srgb,var(--holiday-a,#78efff) 45%,transparent)}
body.cs-holiday-layout .cs-holiday-fact b,body.cs-holiday-layout .cs-holiday-kicker,body.cs-holiday-layout .cs-exp-panel h4,body.cs-holiday-layout .cs-community-grid article h4,body.cs-holiday-layout .cs-live-grid h4{color:var(--holiday-a,#78efff)}

 const selector=host.querySelector('#cs-holiday-experience-select');if(selector)selector.onchange=()=>{if(!selector.value)return;window.__holidayExperience=selector.value;const chosen=list.find(z=>z.name===selector.value);document.dispatchEvent(new CustomEvent('crowspace-holiday-selected',{detail:chosen}));renderExperience(new Date())};

function renderPlanner(h){const host=document.getElementById('holiday-planner');if(!host)return;const key='crowspace-holiday-plan-'+h.name+'-'+h.date.getFullYear();const defaults=(experiences[h.name]||{}).activities||[];let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};host.innerHTML='<div class="cs-planner-head"><div><span class="cs-holiday-kicker">V33 // HOLIDAY PLANNER</span><h3>Plan Your '+esc(h.name)+'</h3><div class="cs-planner-sub">Your checklist stays in this browser and resets for the next occurrence.</div></div><div class="cs-planner-sub" id="cs-plan-count"></div></div><div class="cs-planner-grid">'+defaults.map((v,i)=>'<div class="cs-plan-item"><label><input type="checkbox" data-plan="'+i+'" '+(saved[i]?'checked':'')+'> '+esc(v)+'</label></div>').join('')+'</div><div class="cs-plan-progress"><i id="cs-plan-progress"></i></div><div class="cs-plan-meta" id="cs-plan-meta"></div>';const update=()=>{const boxes=[...host.querySelectorAll('[data-plan]')],done=boxes.filter(x=>x.checked).length,pct=boxes.length?Math.round(done/boxes.length*100):0;boxes.forEach(x=>{saved[x.dataset.plan]=x.checked});try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){};host.querySelector('#cs-plan-progress').style.width=pct+'%';host.querySelector('#cs-plan-count').textContent=done+' / '+boxes.length+' COMPLETE';host.querySelector('#cs-plan-meta').textContent=pct===100?'PLAN COMPLETE · READY TO CELEBRATE':pct+'% READY'};host.querySelectorAll('[data-plan]').forEach(x=>x.addEventListener('change',update));update()}

 let sp=document.getElementById('cs-holiday-special');if(!sp){sp=document.createElement('div');sp.id='cs-holiday-special';sp.className='cs-holiday-special';document.getElementById('holiday-app')?.before(sp)}sp.textContent=x[2];

function notifyCommunity(h){window.__holidayCommunityState=h;holidayLayout(h);if(window.CrowSpaceHolidayCommunity?.load)window.CrowSpaceHolidayCommunity.load(h);if(window.CrowSpaceHolidayEventCenter?.load)window.CrowSpaceHolidayEventCenter.load(h);if(window.CrowSpaceHolidayNetwork?.load)window.CrowSpaceHolidayNetwork.load(h)}
function render(){
 const host=document.getElementById('holiday-app'),now=new Date(),next=nextHoliday(now),up=calendar(now),d=diff(next.date-now);
 const today=dateKey(next.date)===dateKey(now),yearDays=new Date(now.getFullYear()+1,0,1)-new Date(now.getFullYear(),0,1),yearStart=new Date(now.getFullYear(),0,1),dayOfYear=Math.floor((dateKey(now)-dateKey(yearStart))/86400000)+1,remaining=Math.max(0,Math.ceil((dateKey(new Date(now.getFullYear()+1,0,1))-dateKey(now))/86400000));
 const status=today?'TODAY · '+next.name+' is here.':d.days===1?'TOMORROW · '+next.name+' arrives tomorrow.':d.days<7?'THIS WEEK · '+next.name+' is less than a week away.':d.days<31?'THIS MONTH · '+next.name+' is coming up soon.':'UPCOMING · '+next.name+' is the next holiday on the calendar.';
 host.innerHTML=`
 <div class="cs-holiday-intel">
  <article class="cs-holiday-feature">
   <div class="cs-holiday-kicker">V31 // HOLIDAY INTELLIGENCE</div>

   <div class="cs-live-count" data-live-date="${next.date.toISOString()}">${today?'TODAY':d.days+'d '+pad(d.hours)+'h '+pad(d.mins)+'m '+pad(d.secs)+'s'}<small>${today?'HOLIDAY TODAY':'TIME UNTIL NEXT HOLIDAY'}</small></div>
   <div class="cs-holiday-facts">${next.facts.map((f,i)=>'<div class="cs-holiday-fact"><b>'+esc(f)+'</b><span>Auto-updated fact</span></div>').join('')}</div>

  </article>
  <aside class="cs-holiday-side">
   <h3>LIVE CALENDAR STATUS</h3>
   <div class="cs-holiday-status"><strong>${status}</strong><br>Season: ${currentSeason(now)} · Day ${dayOfYear} of ${yearDays/86400000}<br>${remaining} calendar days remain in ${now.getFullYear()}.</div>
   <div class="cs-holiday-actions"><a href="holiday-bots.html">HOLIDAY BOTS</a><a href="events.html">EVENTS</a><button id="cs-holiday-share" type="button">SHARE</button></div>
   <div class="cs-holiday-footnote">Dates are calculated in the visitor’s local browser time. Moveable holidays recalculate automatically each year.</div>
  </aside>
 </div>
 <section class="cs-holiday-timeline"><h3>UPCOMING HOLIDAY TIMELINE</h3><div class="cs-timeline">${up.slice(0,12).map(h=>{const x=diff(h.date-now);return '<div class="cs-tile"><strong>'+h.emoji+' '+esc(h.name)+'</strong><span>'+dateText(h.date)+'</span><em>'+((dateKey(h.date)===dateKey(now))?'TODAY':x.days+' DAYS')+'</em></div>'}).join('')}</div></section>`;
 const share=document.getElementById('cs-holiday-share'); if(share) share.onclick=async()=>{const txt='CrowSpace Holiday Hub: '+next.name+' · '+dateText(next.date);try{await navigator.clipboard.writeText(txt);share.textContent='COPIED'}catch(e){share.textContent='READY'}}};
function tick(){
 const el=document.querySelector('[data-live-date]');if(!el)return;
 const target=new Date(el.dataset.liveDate),now=new Date(),x=diff(target-now);
 el.firstChild.nodeValue=dateKey(target)===dateKey(now)?'TODAY':x.days+'d '+pad(x.hours)+'h '+pad(x.mins)+'m '+pad(x.secs)+'s';

render();renderExperience(new Date());holidayLayout(nextHoliday(new Date()));setTimeout(()=>notifyCommunity(nextHoliday(new Date())),700);setInterval(()=>{tick();const n=new Date();if(n.getHours()===0&&n.getMinutes()===0&&n.getSeconds()<2){render();renderExperience(n);notifyCommunity(nextHoliday(n))}},1000);
})();

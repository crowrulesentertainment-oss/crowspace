</head><body><main><header><div><small>CROWRULES ADMIN HQ · 21.50.87</small><h1>Consensus & State Integrity</h1><p>Canonical-state quorum, subsystem agreement and synchronization integrity.</p></div><button id="refresh">Refresh</button></header><div id="stats">Loading…</div></main><script src="crowspace-auth.js"></script><script>async function load(){await CrowSpaceAuth.ready;if(!CrowSpaceAuth.user){stats.textContent='Sign in to continue.';return}const r=await CrowSpaceAuth.client.rpc('crowspace_consensus_quorum_status_21_50_87');if(r.error){stats.textContent=r.error.message;return}const d=r.data||{};stats.innerHTML='<div class="grid">'+Object.entries(d).map(([k,v])=>'<div class="card">'+k.replaceAll('_',' ')+'<b>'+v+'</b></div>').join('')+'</div>'}refresh.onclick=load;load();setInterval(load,30000)</script></body></html>

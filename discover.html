<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace — Discover</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="scanlines"></div><div class="ambient"></div><header class="topbar"><a class="brand" href="index.html"><span class="mark">C</span><span>CROW<span>SPACE</span></span></a><nav><a href="index.html">Feed</a><a href="discover.html" class="active">Discover</a><a href="profile.html">Profile</a><a href="notifications.html">Notifications</a></nav><div class="account"><span id="memberState">CONNECTING…</span><button id="authBtn">Sign In</button></div></header><main class="shell"><section class="card" style="padding:28px;max-width:900px;margin:auto"><div class="eyebrow">CROWRULES SOCIAL DISCOVERY</div><h1 style="font:800 34px Orbitron;margin:14px 0">DISCOVER CROWSPACE</h1><p style="color:var(--muted)">Find creators, follow people, and build your universe.</p><div style="display:flex;gap:10px;margin-top:22px"><input id="search" maxlength="60" placeholder="Search name or @username…" style="flex:1;padding:14px;background:#070a10;color:white;border:1px solid var(--line);border-radius:10px"><button class="btn primary" id="go">SEARCH</button></div><div id="status" style="color:var(--muted);margin-top:18px">Loading creators…</div><div id="results" style="margin-top:14px"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
const results=document.getElementById("results"),search=document.getElementById("search"),status=document.getElementById("status");const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function discover(){const {data:{session}}=await db.auth.getSession();let q=search.value.trim().replace(/^@/,"");let query=db.from("crowspace_profiles").select("user_id,username,display_name,bio,avatar_url").order("updated_at",{ascending:false}).limit(50);if(q)query=query.or("username.ilike.%"+q+"%,display_name.ilike.%"+q+"%,bio.ilike.%"+q+"%");const {data,error}=await query;if(error){status.textContent="Discovery unavailable.";return}const rows=(data||[]).filter(x=>!session||x.user_id!==session.user.id);if(!rows.length){status.textContent=q?"No creators found.":"No other creators yet.";results.innerHTML="";return}const ids=rows.map(x=>x.user_id);const {data:following}=session?await db.from("crowspace_follows").select("followed_user_id").eq("follower_id",session.user.id).in("followed_user_id",ids):{data:[]};const fset=new Set((following||[]).map(x=>x.followed_user_id));status.textContent=rows.length+" creator"+(rows.length===1?"":"s")+" found";results.innerHTML=rows.map(p=>{const name=p.display_name||p.username||"Crow",letter=esc(name.charAt(0).toUpperCase());return '<article class="card" style="padding:18px;margin-bottom:10px;display:flex;gap:14px;align-items:center"><div class="mark">'+letter+'</div><div style="flex:1"><a href="profile.html?u='+encodeURIComponent(p.user_id)+'" style="color:var(--text);text-decoration:none;font-weight:700">'+esc(name)+'</a><div style="color:var(--cyan);font-size:12px">@'+esc(p.username||"crow")+'</div><div style="color:var(--muted);font-size:12px;margin-top:5px">'+esc((p.bio||"").slice(0,140))+'</div></div>'+(session?'<button class="btn '+(fset.has(p.user_id)?"ghost":"primary")+' follow" data-id="'+p.user_id+'">'+(fset.has(p.user_id)?"FOLLOWING":"FOLLOW")+'</button>':"")+'</article>'}).join("");document.querySelectorAll(".follow").forEach(b=>b.onclick=async()=>{b.disabled=true;const id=b.dataset.id;if(fset.has(id))await db.from("crowspace_follows").delete().eq("follower_id",session.user.id).eq("followed_user_id",id);else await db.from("crowspace_follows").insert({follower_id:session.user.id,followed_user_id:id});await discover()})}
document.getElementById("go").onclick=discover;search.addEventListener("keydown",e=>{if(e.key==="Enter")discover()});discover();
</script></body></html>

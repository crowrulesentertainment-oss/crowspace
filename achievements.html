<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Creator Achievements</title><link rel="stylesheet" href="style.css"><style>body{margin:0}.wrap{max-width:1050px;margin:auto;padding:24px}.hero{border:1px solid var(--line);border-radius:18px;padding:22px;background:linear-gradient(135deg,#0b0e15,#101322)}h1{font:800 26px Orbitron;margin:0 0 8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.badge{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:20px;min-height:150px;display:flex;flex-direction:column;gap:8px}.badge.unlocked{border-color:var(--cyan);box-shadow:0 0 24px #55f3ff18}.icon{font-size:42px}.badge b{font:800 16px Orbitron;color:var(--cyan)}.progress{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:auto}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple))}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a href="index.html">FEED</a><a href="discover.html">DISCOVER</a><a href="media.html">MEDIA</a><a href="reels.html">REELS</a><a href="notifications.html">NOTIFICATIONS</a><a href="reel-analytics.html">ANALYTICS</a></header><main class="wrap"><section class="hero"><h1>CREATOR ACHIEVEMENTS</h1><div id="identity" class="muted">INITIALIZING…</div><p class="muted">Your CrowSpace milestones, permanently recorded to your Universal CrowRules identity.</p><section class="hero" style="margin:16px 0"><h2 style="margin:0">CREATOR LEVEL</h2><div id="levelText" style="font:800 22px Orbitron;color:var(--cyan);margin-top:8px">LEVEL 1</div><div id="xpText" class="muted">0 XP</div><div class="progress" style="margin-top:12px"><i id="xpBar" style="width:0%"></i></div><div id="xpNext" class="muted" style="margin-top:8px;font-size:11px">Loading progression…</div></section><div id="badges" class="grid"></div><a class="back" href="reel-analytics.html">← Back to Analytics</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const defs=[["🎬","FIRST REEL","Publish your first Reel",1,"posts"],["👁️","100 VIEWS","Reach 100 lifetime recorded views",100,"views"],["🔥","1,000 VIEWS","Reach 1,000 lifetime recorded views",1000,"views"],["⏱️","1 HOUR WATCHED","Reach 60 minutes of lifetime watch time",3600,"watch"],["💬","FIRST ENGAGEMENT","Receive your first interaction",1,"eng"],["💯","100 ENGAGEMENTS","Reach 100 lifetime interactions",100,"eng"],["👥","10 FOLLOWERS","Reach 10 followers",10,"followers"]];const esc=x=>String(x??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){location.href="login.html";return}const uid=session.user.id;const {data:p}=await db.from("crowspace_profiles").select("display_name,username").eq("user_id",uid).maybeSingle();const {data:posts}=await db.from("crowspace_posts").select("id").eq("user_id",uid).not("media_url","is",null);const ids=(posts||[]).map(x=>x.id);const [{data:views},{data:eng},{count:followers},{data:earned}]=await Promise.all([ids.length?db.from("crowspace_reel_views").select("watched_seconds").in("reel_id",ids):Promise.resolve({data:[]}),ids.length?db.from("crowspace_social_interactions").select("id").eq("target_type","post").in("target_id",ids):Promise.resolve({data:[]}),db.from("crowspace_follows").select("follower_id",{count:"exact",head:true}).eq("followed_user_id",uid),db.from("crowspace_creator_achievements").select("achievement_key,unlocked_at").eq("user_id",uid)]);document.getElementById("identity").textContent=(p?.display_name||p?.username||"Creator")+" · @"+(p?.username||"creator");const values={posts:posts?.length||0,views:(views||[]).length,watch:(views||[]).reduce((a,x)=>a+Number(x.watched_seconds||0),0),eng:(eng||[]).length,followers:followers||0};const xp=Math.round(values.posts*100+values.views*2+values.watch/10+values.eng*5+values.followers*50+(earned||[]).length*100);const level=Math.max(1,Math.floor(xp/1000)+1),base=(level-1)*1000,progress=xp-base,next=level*1000;document.getElementById("levelText").textContent="LEVEL "+level;document.getElementById("xpText").textContent=xp.toLocaleString()+" XP";document.getElementById("xpBar").style.width=Math.min(100,progress/1000*100)+"%";document.getElementById("xpNext").textContent=(1000-progress).toLocaleString()+" XP to Level "+(level+1);const q=await db.from("crowspace_creator_xp").upsert({user_id:uid,xp,level,updated_at:new Date().toISOString()},{onConflict:"user_id"});const saved=new Map((earned||[]).map(x=>[x.achievement_key,x.unlocked_at]));document.getElementById("badges").innerHTML=defs.map(d=>{const value=values[d[4]],pct=Math.min(100,value/d[3]*100),ok=value>=d[3]||saved.has(d[1]),date=saved.get(d[1]);return '<article class="badge '+(ok?"unlocked":"")+'"><span class="icon">'+d[0]+'</span><b>'+esc(d[1])+'</b><span class="muted">'+esc(d[2])+'</span><small class="muted">'+(ok?(date?"Unlocked "+new Date(date).toLocaleDateString():"✓ UNLOCKED"):pct.toFixed(0)+"% progress")+'</small><div class="progress"><i style="width:'+pct+'%"></i></div></article>'}).join("")}boot();</script></body></html>

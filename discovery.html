<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace — Discover</title><link rel="stylesheet" href="crowspace-rebuild.css"><script src="crowspace-auth.js"></script><style>.discover{max-width:1200px;margin:auto}.search{display:flex;gap:8px}.search input{flex:1}.section{margin-top:18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.item{padding:18px;border:1px solid var(--line);border-radius:15px;background:#ffffff05}.meta{color:var(--muted);font-size:12px}.reason{margin-top:10px;color:var(--cyan);font-size:11px}</style><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script>
</head><body><main class="shell discover"><div class="kicker">CROWRULES // DISCOVERY ENGINE</div><section class="hero"><div class="eyebrow">FIND WHAT'S NEXT</div><h1>DISCOVER.</h1><p class="muted">Explore people, posts, Caws and events across CrowSpace.</p><div class="search"><input id="q" placeholder="Search CrowSpace..." autocomplete="off"><button class="btn primary" id="go">Search</button></div></section><div id="out" class="loading">BUILDING YOUR DISCOVERY FEED</div></main><script>
(async()=>{try{await CrowSpaceAuth.ready;const db=CrowSpaceAuth.client;let u=CrowSpaceAuth.user;let q=new URLSearchParams(location.search).get("q")||"";document.getElementById("q").value=q;async function load(term){let [profiles,posts,caws,events]=await Promise.all([
db.from("crowspace_profiles").select("user_id,username,display_name,bio,avatar_url,creator_category").eq("privacy_profile","public").ilike(term?"display_name":"username",term?("%"+term+"%"):"%").limit(8),
db.from("crowspace_posts").select("id,user_id,title,body,created_at").order("created_at",{ascending:false}).limit(12),
db.from("crowspace_caws").select("*").order("created_at",{ascending:false}).limit(8),
db.from("crowspace_events").select("id,title,description,starts_at,image_url,is_online,is_live,youtube_url").eq("is_cancelled",false).order("starts_at",{ascending:true}).limit(8)
]);const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));document.getElementById("out").innerHTML=`
<section class="section"><h2>PEOPLE</h2><div class="cards">${(profiles.data||[]).map(p=>`<a class="item" href="profile.html?username=${encodeURIComponent(p.username||"")}"><strong>${esc(p.display_name||p.username)}</strong><div class="meta">@${esc(p.username||"")} · ${esc(p.creator_category||"Member")}</div><p class="meta">${esc(p.bio||"")}</p></a>`).join("")||"<div class='item'>No public profiles matched.</div>"}</div></section>
<section class="section"><h2>RECENT POSTS</h2><div class="cards">${(posts.data||[]).map(p=>`<article class="item"><strong>${esc(p.title||"CrowSpace Post")}</strong><p>${esc(p.body||"")}</p><div class="meta">${new Date(p.created_at).toLocaleString()}</div></article>`).join("")||"<div class='item'>No posts yet.</div>"}</div></section>
<section class="section"><h2>UPCOMING EVENTS</h2><div class="cards">${(events.data||[]).map(e=>`<article class="item"><strong>${esc(e.title)}</strong><p class="meta">${esc(e.description||"")}</p><div class="meta">${new Date(e.starts_at).toLocaleString()} · ${e.is_live?"LIVE":e.is_online?"ONLINE":"EVENT"}</div></article>`).join("")||"<div class='item'>No upcoming events.</div>"}</div></section>
<section class="section"><h2>CAWS</h2><div class="cards">${(caws.data||[]).map(c=>`<article class="item"><strong>${esc(c.title||"Caw")}</strong><p class="meta">${esc(c.description||"")}</p><div class="reason">Because you're in the CrowSpace universe</div></article>`).join("")||"<div class='item'>No Caws available yet.</div>"}</div></section>`;};document.getElementById("go").onclick=()=>{const t=document.getElementById("q").value.trim();location.href=t?"discovery.html?q="+encodeURIComponent(t):"discovery.html"};await load(q)}catch(e){document.getElementById("out").innerHTML='<div class="status">Discovery is temporarily unavailable: '+String(e.message).replace(/[<>&]/g,"")+'</div>'}})()</script><script src="js/crowspace-recommendation-runtime-21-5.js"></script>
</body></html>

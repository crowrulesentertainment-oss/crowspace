<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Discovery</title><script src="crowspace-auth.js"></script><script src="crowspace-rebuild.js"></script><style>body{font-family:system-ui;margin:0;background:#08090d;color:#f5f5f7}.wrap{max-width:1100px;margin:auto;padding:28px}.hero{padding:24px;border:1px solid #242733;border-radius:18px;background:#11131a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}.card{padding:18px;border:1px solid #242733;border-radius:16px;background:#0e1016}.muted{opacity:.6}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{padding:7px 10px;border-radius:999px;background:#181b25}.empty{opacity:.55}.back{display:inline-block;margin-bottom:15px;color:inherit}</style></head><body><main class="wrap"><a class="back" href="home.html">← Home</a><section class="hero"><h1>DISCOVERY CENTER</h1><p class="muted">Your personal map of how CrowSpace learns what you discover and engage with.</p></section><div id="dashboard" class="grid"></div></main><script>async function initDiscovery(){const d=await window.CrowSpaceDiscoveryDashboardAPI?.load?.();const root=document.getElementById("dashboard");if(!d){root.innerHTML='<div class="card">Sign in to view your Discovery Center.</div>';return}const settings=d.settings||{};const interests=Object.entries(d.interest_graph||d.interests||{}).sort((a,b)=>Number(b[1])-Number(a[1])).slice(0,12);const creators=Object.entries(d.creators||{}).sort((a,b)=>Number(b[1])-Number(a[1])).slice(0,8);root.innerHTML=`<section class="card"><h2>⚙️ Settings</h2><p>Personalization: <b>${settings.personalization_enabled?"On":"Off"}</b></p><p>Adaptive Feed: <b>${settings.adaptive_feed_enabled?"On":"Off"}</b></p><p>Recommendations: <b>${settings.recommendations_enabled?"On":"Off"}</b></p><p>Retention: <b>${settings.learning_retention_days||90} days</b></p><a href="home.html">Manage settings</a></section><section class="card"><h2>🧠 Learned Interests</h2><div class="chips">${interests.length?interests.map(x=>`<span class="chip">${x[0]} · ${Number(x[1]).toFixed(1)}</span>`).join(""):'<span class="empty">Your interest graph is still learning.</span>'}</div></section><section class="card"><h2>👤 Creator Affinity</h2><div class="chips">${creators.length?creators.map(x=>`<span class="chip">${x[0].split(":").pop().slice(0,12)} · ${Number(x[1]).toFixed(1)}</span>`).join(""):'<span class="empty">No creator signals yet.</span>'}</div></section><section class="card"><h2>🎯 Feedback</h2><p>${(d.feedback||[]).length} recent recommendation feedback events</p><p>${(d.preferences||[]).length} active content preferences</p></section><section class="card"><h2>📊 Activity</h2><p>${(d.events||[]).length} recent learning events available to your account.</p><p class="muted">Your learning data is account-scoped.</p></section></div>`;}</script><script>initDiscovery()</script></body></html>

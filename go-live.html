<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Go Live | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">◉ CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">Nest</a><a href="caws.html">Caws</a><a href="groups.html">Groups</a><a class="active" href="go-live.html">Live</a></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">BROADCAST STUDIO</p><h1>Go Live</h1><p class="muted">Create an authenticated CrowSpace broadcast. Video ingest is provider-neutral until a streaming provider is connected.</p></div><a class="btn" href="live.html">Watch Live</a></div><section class="card"><form id="liveForm"><label>Title<input id="title" maxlength="120" required placeholder="What are you broadcasting?"></label><label>Description<textarea id="description" maxlength="2000" placeholder="Tell viewers what to expect"></textarea></label><label>Category<input id="category" maxlength="80" placeholder="Community, Gaming, Music, CrowRules..."></label><label>YouTube Live URL <span class="muted">(paste the completed/live YouTube URL)</span><input id="youtube_url" type="url" placeholder="https://www.youtube.com/watch?v=..."></label><label>YouTube Recording URL <span class="muted">(add after the broadcast ends)</span><input id="recording_url" type="url" placeholder="https://www.youtube.com/watch?v=..."></label><button class="btn primary" type="submit" id="createBtn">Create Broadcast</button><div id="controls" hidden style="margin-top:1rem"><button type="button" class="btn primary" id="startBtn">Start CrowSpace Live</button><button type="button" class="btn" id="endBtn">End Broadcast</button><p id="broadcastStatus" class="muted"></p></div><p id="msg" class="muted"></p></form></section></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.getElementById("liveForm").onsubmit=async e=>{e.preventDefault();const u=await CS.user();if(!u){location.href="login.html";return}createBtn.disabled=true;const {data,error}=await crowSupabase.from("crowspace_live_sessions").insert({creator_id:u.id,title:title.value.trim(),description:description.value.trim()||null,category:category.value.trim()||null,playback_url:null,provider:"youtube",provider_stream_id:(youtube_url.value.trim().match(/[?&]v=([^&]+)/)||youtube_url.value.trim().match(/youtu\.be\/([^?&]+)/)||[])[1]||null,status:"scheduled"}).select().single();if(error){msg.textContent=error.message;createBtn.disabled=false;return}location.href="live.html?session="+data.id}</script><script>
let liveSession=null;
async function loadSession(){
 const id=new URLSearchParams(location.search).get("session"); if(!id)return;
 const {data}=await crowSupabase.from("crowspace_live_sessions").select("*").eq("id",id).maybeSingle();
 if(!data)return; liveSession=data; controls.hidden=false; broadcastStatus.textContent="Status: "+data.status+(data.provider_stream_id?" · YouTube ID: "+data.provider_stream_id:"");
 if(data.status==="live"){startBtn.hidden=true;endBtn.hidden=false}else if(data.status==="ended"){startBtn.hidden=true;endBtn.hidden=true}
}
startBtn.onclick=async()=>{
 if(!liveSession)return; startBtn.disabled=true;
 const {error}=await crowSupabase.from("crowspace_live_sessions").update({status:"live",started_at:new Date().toISOString(),ingest_status:"waiting_for_youtube"}).eq("id",liveSession.id);
 if(error){broadcastStatus.textContent=error.message;startBtn.disabled=false;return}
 liveSession.status="live"; startBtn.hidden=true; endBtn.hidden=false; broadcastStatus.textContent="LIVE · Waiting for YouTube playback. Open live.html?session="+liveSession.id;
 try{
  const u=await CS.user(); if(u){
   const {data:follows}=await crowSupabase.from("crowspace_follows").select("follower_id").eq("followed_user_id",u.id);
   if(follows?.length) await crowSupabase.from("crowspace_notifications").insert(follows.map(x=>({user_id:x.follower_id,actor_id:u.id,type:"live",body:"A creator you follow is now live on CrowSpace."})));
  }
 }catch(_){}
};
endBtn.onclick=async()=>{
 if(!liveSession)return; endBtn.disabled=true;
 const {error}=await crowSupabase.from("crowspace_live_sessions").update({status:"ended",ended_at:new Date().toISOString(),ingest_status:"ended"}).eq("id",liveSession.id);
 if(error){broadcastStatus.textContent=error.message;endBtn.disabled=false;return}
 const recording=recording_url.value.trim(); if(recording){const vid=(recording.match(/[?&]v=([^&]+)/)||recording.match(/youtu\\.be\\/([^?&]+)/)||[])[1]||null; const {data:caw}=await crowSupabase.from("crowspace_caws").insert({user_id:liveSession.creator_id,title:liveSession.title,caption:liveSession.description||"Live broadcast archive",video_url:recording,source_type:"live_archive",live_session_id:liveSession.id}).select("id").single(); if(caw)await crowSupabase.from("crowspace_live_sessions").update({recording_url:recording,caw_id:caw.id}).eq("id",liveSession.id); } broadcastStatus.textContent=recording?"Broadcast ended and archived as a Caw.":"Broadcast ended. Add the YouTube recording URL to archive it as a Caw.";
 endBtn.hidden=true;
};
document.addEventListener("DOMContentLoaded",loadSession);
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Go Live | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">◉ CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">Nest</a><a href="caws.html">Caws</a><a href="groups.html">Groups</a><a class="active" href="go-live.html">Live</a></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">BROADCAST STUDIO</p><h1>Go Live</h1><p class="muted">Create an authenticated CrowSpace broadcast. Video ingest is provider-neutral until a streaming provider is connected.</p></div><a class="btn" href="live.html">Watch Live</a></div><section class="card"><form id="liveForm"><label>Title<input id="title" maxlength="120" required placeholder="What are you broadcasting?"></label><label>Description<textarea id="description" maxlength="2000" placeholder="Tell viewers what to expect"></textarea></label><label>Category<input id="category" maxlength="80" placeholder="Community, Gaming, Music, CrowRules..."></label><label>YouTube Live URL <span class="muted">(optional until broadcast is created)</span><input id="youtube_url" type="url" placeholder="https://www.youtube.com/watch?v=..."></label><button class="btn primary" type="submit" id="createBtn">Create Broadcast</button><p id="msg" class="muted"></p></form></section></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.getElementById("liveForm").onsubmit=async e=>{e.preventDefault();const u=await CS.user();if(!u){location.href="login.html";return}createBtn.disabled=true;const {data,error}=await crowSupabase.from("crowspace_live_sessions").insert({creator_id:u.id,title:title.value.trim(),description:description.value.trim()||null,category:category.value.trim()||null,playback_url:null,provider:"youtube",provider_stream_id:(youtube_url.value.trim().match(/[?&]v=([^&]+)/)||youtube_url.value.trim().match(/youtu\.be\/([^?&]+)/)||[])[1]||null,status:"scheduled"}).select().single();if(error){msg.textContent=error.message;createBtn.disabled=false;return}location.href="live.html?session="+data.id}</script></body></html>

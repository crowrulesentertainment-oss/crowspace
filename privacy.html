<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace — Privacy Center</title><link rel="stylesheet" href="crowspace-rebuild.css"><script src="crowspace-auth.js"></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script>
</head><body><main class="shell"><div class="kicker">CROWRULES // PRIVACY CENTER</div><section class="hero" style="max-width:760px;margin:auto"><div class="eyebrow">YOUR IDENTITY. YOUR CONTROLS.</div><h1>PRIVACY.</h1><div id="form"><div class="loading">LOADING SETTINGS</div></div></section></main><script>
(async()=>{await CrowSpaceAuth.ready;const u=CrowSpaceAuth.user;if(!u){location.href="login.html?next=privacy.html";return}await CrowSpaceAuth.ensureProfile(u);const db=CrowSpaceAuth.client;const r=await db.from("crowspace_profiles").select("privacy_profile,privacy_posts,privacy_media,privacy_activity,privacy_connections,privacy_guestbook,privacy_messages,allow_guestbook").eq("user_id",u.id).single();if(r.error)throw r.error;const p=r.data;const opts=(name,val)=>["public","members","friends","private"].map(x=>'<option value="'+x+'" '+(x===val?"selected":"")+'>'+x.toUpperCase()+'</option>').join("");document.getElementById("form").innerHTML=`
<div class="field"><label>Profile visibility</label><select data-k="privacy_profile">${opts("",p.privacy_profile)}</select></div>
<div class="field"><label>Posts visibility</label><select data-k="privacy_posts">${opts("",p.privacy_posts)}</select></div>
<div class="field"><label>Media visibility</label><select data-k="privacy_media">${opts("",p.privacy_media)}</select></div>
<div class="field"><label>Activity visibility</label><select data-k="privacy_activity">${opts("",p.privacy_activity)}</select></div>
<div class="field"><label>Connections visibility</label><select data-k="privacy_connections">${opts("",p.privacy_connections)}</select></div>
<div class="field"><label>Guestbook visibility</label><select data-k="privacy_guestbook">${opts("",p.privacy_guestbook)}</select></div>
<div class="field"><label>Messages</label><select data-k="privacy_messages">${opts("",p.privacy_messages)}</select></div>
<label><input id="guest" type="checkbox" ${p.allow_guestbook?"checked":""}> Allow guestbook</label><div class="actions"><button class="btn primary" id="save">Save Privacy</button><a class="btn" href="identity.html">Back to Identity</a></div><p id="msg" class="status"></p>`;document.getElementById("save").onclick=async()=>{const data={};document.querySelectorAll("[data-k]").forEach(x=>data[x.dataset.k]=x.value);data.allow_guestbook=document.getElementById("guest").checked;const z=await db.from("crowspace_profiles").update(data).eq("user_id",u.id);document.getElementById("msg").textContent=z.error?z.error.message:"Privacy settings saved.";}})().catch(e=>document.getElementById("form").innerHTML='<div class="status">'+String(e.message).replace(/[<>&]/g,"")+'</div>')</script></body></html>

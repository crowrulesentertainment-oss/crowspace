<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Production | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stage{padding:16px;border:1px solid var(--line);border-radius:14px;text-align:center}.stage.active{box-shadow:0 0 0 2px currentColor}.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.fill{height:100%;background:currentColor}@media(max-width:800px){.stages{grid-template-columns:1fr 1fr}}</style><style>.cu-activity{padding:13px;border:1px solid var(--line);border-radius:12px;margin-top:9px}.cu-activity small{display:block;color:var(--muted);font-size:9px;margin-top:5px}</style></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"><a href="login.html">Sign In</a></div></header><main class="section"><div id="app">Loading…</div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script src="js/universal-activity.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await CS.user();if(!u){location.href='login.html';return}await CS.refreshHeader();const id=new URLSearchParams(location.search).get('id');if(!id){app.innerHTML='<h1>Production not found</h1>';return}async function load(){const r=await crowSupabase.from('crowrules_productions').select('*').eq('id',id).single();if(r.error){app.innerHTML='<h1>Production not found</h1><p>'+CS.escape(r.error.message)+'</p>';return}const x=r.data, stages=['development','pre-production','production','post-production','tv-published'];app.innerHTML='<p class="eyebrow">CROWRULES PRODUCTION</p><h1>'+CS.escape(x.title)+'</h1><p class="muted">'+CS.escape(x.stage)+' · '+x.progress+'%</p><div class="bar"><div class="fill" style="width:'+x.progress+'%"></div></div><div class="stages">'+stages.map(s=>'<div class="stage '+(s===x.stage?'active':'')+'"><strong>'+CS.escape(s)+'</strong></div>').join('')+'</div><section class="card" style="margin-top:20px"><h3>⚡ Universal Activity</h3><div id="universalActivity"><div class="empty">Loading…</div></div></section><section class="card" style="margin-top:20px"><label>Stage<select id="stage">'+stages.map(s=>'<option '+(s===x.stage?'selected':'')+' value="'+s+'">'+s+'</option>').join('')+'</select></label><label>Progress (%)<input id="progress" type="number" min="0" max="100" value="'+x.progress+'"></label><label>Notes<textarea id="notes" rows="5">'+CS.escape(x.notes||'')+'</textarea></label><button class="btn" id="save">Save Production</button><p id="msg" class="muted"></p></section>' ;save.onclick=async()=>{msg.textContent='Saving…';const q=await crowSupabase.from('crowrules_productions').update({stage:stage.value,progress:Math.max(0,Math.min(100,Number(progress.value)||0)),notes:notes.value,updated_at:new Date().toISOString()}).eq('id',id).eq('owner_id',u.id);msg.textContent=q.error?q.error.message:'Saved';if(!q.error)load()}}load()});</script><script>document.addEventListener("DOMContentLoaded",()=>CrowUniversalActivity.mount("universalActivity",{limit:8}));</script><script src="js/global-nav.js?v=20260927-4"></script></body></html>

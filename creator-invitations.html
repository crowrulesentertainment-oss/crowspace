<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Invitation Center 6.2 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{background:var(--p2);border:1px solid #292e42;border-radius:15px;padding:15px}.muted{color:var(--m)}.tag{font-size:10px;color:#8ff6ff;letter-spacing:.1em;font-weight:800}.empty{text-align:center;padding:25px;color:var(--m)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">🤝 CrowSpace <span class="accent">Invitation Center 6.2</span></div><div class="actions"><a class="btn" href="./creator-projects.html">Projects</a><a class="btn" href="./creator-dashboard.html">Dashboard</a></div></div><section class="card"><h1>📨 Collaboration Invitations</h1><p class="muted">Accept or decline real project invitations. Accepted creators become project team members.</p></section><section class="grid"><section class="card"><h2>📥 Invitations To Me</h2><div id="incoming" class="empty">Loading…</div></section><section class="card"><h2>📤 Sent By Me</h2><div id="outgoing" class="empty">Loading…</div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me,rows=[],projects={},profiles={};const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function load(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_project_members").select("project_id,user_id,role,status,created_at,invited_by,responded_at,invitation_message").or("user_id.eq."+me.id+",invited_by.eq."+me.id).order("created_at",{ascending:false});if(r.error){incoming.innerHTML=outgoing.innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}rows=r.data||[];const pids=[...new Set(rows.map(x=>x.project_id))],uids=[...new Set(rows.flatMap(x=>[x.user_id,x.invited_by]).filter(Boolean))];if(pids.length){const p=await db.from("crowspace_projects").select("id,title,description,status,category,owner_id").in("id",pids);projects={};(p.data||[]).forEach(x=>projects[x.id]=x)}if(uids.length){const p=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",uids);profiles={};(p.data||[]).forEach(x=>profiles[x.user_id]=x)}render()}function item(x,incomingView){const p=projects[x.project_id]||{},other=profiles[incomingView?x.invited_by:x.user_id]||{},status=x.status||"pending";return '<article class="box"><span class="tag">'+esc(status.toUpperCase())+'</span><h3>'+esc(p.title||"Project")+'</h3><p class="muted">'+esc(p.description||"")+'</p><p>'+esc(other.display_name||other.username||"Creator")+' · <b>'+esc(x.role||"Collaborator")+'</b></p>'+(x.invitation_message?'<p class="muted">“'+esc(x.invitation_message)+'”</p>':"")+(incomingView&&status==="pending"?'<div class="actions"><button class="btn primary" onclick="respond(\''+x.project_id+'\',\''+x.user_id+'\',\'accepted\')">Accept</button><button class="btn" onclick="respond(\''+x.project_id+'\',\''+x.user_id+'\',\'declined\')">Decline</button></div>':"")+'</article>'}function render(){const inc=rows.filter(x=>x.user_id===me.id&&x.status==="pending"),out=rows.filter(x=>x.invited_by===me.id);incoming.innerHTML=inc.map(x=>item(x,true)).join("")||'<div class="empty">No pending invitations.</div>';outgoing.innerHTML=out.map(x=>item(x,false)).join("")||'<div class="empty">No invitations sent yet.</div>'}async function respond(pid,uid,status){const r=await db.from("crowspace_project_members").update({status,responded_at:new Date().toISOString()}).eq("project_id",pid).eq("user_id",uid).eq("status","pending");if(r.error)alert(r.error.message);else{await db.from("crowspace_notifications").insert({user_id:uid,type:"creator_collaboration_response",actor_id:me.id,reference_id:pid,message:"Your collaboration invitation was "+status+".",is_read:false});load()}}load();</script></body></html>

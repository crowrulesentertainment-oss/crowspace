<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection Analytics — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/navigation.js"></script><style>.hero{padding:46px 0 25px}.tools{display:flex;gap:10px;flex-wrap:wrap}.tools select{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:inherit}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{padding:20px}.stat b{font-size:30px;display:block}.chart{height:220px;display:flex;align-items:end;gap:8px;padding:20px 8px}.bar{flex:1;min-width:8px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#8cf7ff,#7d5cff);position:relative}.bar span{position:absolute;bottom:calc(100% + 5px);font-size:10px;left:50%;transform:translateX(-50%);color:var(--muted)}.empty{padding:35px;text-align:center;color:var(--muted)}</style></head><body><div id="app"><header class="topbar"></header><main><section class="hero"><span class="eyebrow">CREATOR INSIGHTS</span><h1>Collection <em>Analytics.</em></h1><p class="lead">See how your shared collections are being discovered.</p><div class="tools"><select id="collection"><option>Loading…</option></select></div></section><section class="stats"><article class="panel stat"><span class="eyebrow">VIEWS</span><b id="views">0</b><span class="muted">All time</span></article><article class="panel stat"><span class="eyebrow">SHARES</span><b id="shares">0</b><span class="muted">All time</span></article><article class="panel stat"><span class="eyebrow">SAVES</span><b id="saves">0</b><span class="muted">All time</span></article><article class="panel stat"><span class="eyebrow">DISCOVERY SCORE</span><b id="score">0</b><span class="muted">Current</span></article></section><section class="stats" style="margin-top:20px"><article class="panel stat"><span class="eyebrow">14-DAY CHANGE</span><b id="change">0%</b><span class="muted">Activity vs prior 14 days</span></article><article class="panel stat"><span class="eyebrow">TOP EVENT</span><b id="topEvent">—</b><span class="muted">Most frequent</span></article></section><section class="panel" style="margin-top:20px"><div class="section-head"><div><span class="eyebrow">LAST 14 DAYS</span><h2>Activity</h2></div></div><div id="chart" class="chart"></div></section></main></div><script>
document.addEventListener("DOMContentLoaded",async()=>{const cfg=window.CROW_CONFIG||{};if(!cfg.supabaseUrl)return;const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey),sel=document.getElementById("collection"),{data:{user}}=await sb.auth.getUser();if(!user){document.querySelector("main").innerHTML='<section class="panel empty"><h2>Sign in to view analytics</h2><a class="primary" href="login.html">Sign In</a></section>';return}const {data:cols}=await sb.from("crowspace_saved_collections").select("id,name,discovery_score").eq("user_id",user.id).order("created_at",{ascending:false});if(!cols?.length){sel.innerHTML='<option>No collections yet</option>';return}sel.innerHTML=cols.map(c=>'<option value="'+c.id+'">'+String(c.name).replace(/[&<>"]/g,"")+'</option>').join("");async function load(){const id=sel.value,c=cols.find(x=>x.id===id);document.getElementById("score").textContent=Number(c?.discovery_score||0).toFixed(1);const {data:e}=await sb.from("crowspace_collection_events").select("event_type,created_at").eq("collection_id",id).order("created_at",{ascending:false});const ev=e||[];document.getElementById("views").textContent=ev.filter(x=>x.event_type==="view").length;document.getElementById("shares").textContent=ev.filter(x=>x.event_type==="share").length;document.getElementById("saves").textContent=ev.filter(x=>x.event_type==="save").length;const recentCut=Date.now()-14*86400000,priorCut=Date.now()-28*86400000,recent=ev.filter(x=>new Date(x.created_at).getTime()>=recentCut).length,prior=ev.filter(x=>{const t=new Date(x.created_at).getTime();return t>=priorCut&&t<recentCut}).length;document.getElementById("change").textContent=(prior?((recent-prior)/prior*100).toFixed(0):recent?"+"+recent*100:"0")+"%";const counts={view:0,share:0,save:0};ev.forEach(x=>{if(counts[x.event_type]!=null)counts[x.event_type]++});const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];document.getElementById("topEvent").textContent=top&&top[1]?top[0].toUpperCase():"—";const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(13-i));const key=d.toISOString().slice(0,10);return {key,n:ev.filter(x=>x.created_at.slice(0,10)===key).length}});const max=Math.max(1,...days.map(x=>x.n));document.getElementById("chart").innerHTML=days.map(x=>'<div class="bar" style="height:'+Math.max(4,x.n/max*100)+'%"><span>'+x.n+'</span></div>').join("")}sel.onchange=load;load()});
</script></body></html>

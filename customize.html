<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customize My CrowSpace</title><style>body{margin:0;background:#05050b;color:#fff;font:14px Arial;padding:25px}main{max-width:850px;margin:auto}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:22px;margin-bottom:16px}input,textarea,select{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px}button,a{display:inline-block;padding:10px 14px;border-radius:10px;background:#182033;color:#fff;border:1px solid #343c56;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(90deg,#126d7a,#56358c);border:0}.muted{color:#9da5bd}.top8{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.friend{padding:10px;background:#151827;border-radius:9px}.remove{float:right}@media(max-width:650px){.top8{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><div class="card"><h1>Customize Your CrowSpace</h1><p class="muted">Bring back the personal profile experience: colors, music, interests, links and your Top 8.</p><label>Profile theme</label><select id="theme"><option value="neon">Neon</option><option value="midnight">Midnight</option><option value="cosmic">Cosmic</option><option value="classic">Classic</option></select><label>Accent color</label><input id="accent" placeholder="#20e6ff"><label>Banner image URL</label><input id="banner" placeholder="https://..."><label>Background image URL</label><input id="background" placeholder="https://..."><label>Interests</label><textarea id="interests" placeholder="Movies, music, sports, creators..."></textarea><label>Profile music title</label><input id="musicText" placeholder="Song / playlist / theme"><label>Profile music URL</label><input id="musicUrl" placeholder="https://..."><button class="primary" id="save">Save Customization</button> <a href="./profile.html" id="profileLink">View Profile</a><p id="msg"></p></div>
<div class="card"><h2>TOP 8 FRIENDS</h2><p class="muted">Enter usernames in the order you want them displayed.</p><div class="top8" id="top8"></div><button id="saveTop">Save Top 8</button></div><div class="card"><a href="./">← CrowSpace</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me,p;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="./";return}const r=await db.from("crowspace_profiles").select("*").eq("user_id",me.id).maybeSingle();p=r.data;if(!p){msg.textContent="Create your CrowSpace profile first.";return}theme.value=p.theme||"neon";accent.value=p.accent_color||"#20e6ff";banner.value=p.banner_url||"";background.value=p.background_url||"";interests.value=p.interests||"";musicText.value=p.music_text||"";musicUrl.value=p.music_url||"";profileLink.href="./profile.html?u="+encodeURIComponent(p.username||"");const ids=p.top_friends||[];let names=[];if(ids.length){const q=await db.from("crowspace_profiles").select("user_id,username").in("user_id",ids);const map={};(q.data||[]).forEach(x=>map[x.user_id]=x.username);names=ids.map(x=>map[x]||"")}top8.innerHTML=Array.from({length:8},(_,i)=>'<input class="friend" id="f'+i+'" placeholder="Top '+(i+1)+' username" value="'+esc(names[i]||"")+'">').join("")}
save.onclick=async()=>{const r=await db.from("crowspace_profiles").update({theme:theme.value,accent_color:accent.value.trim()||"#20e6ff",banner_url:banner.value.trim()||null,background_url:background.value.trim()||null,interests:interests.value.trim()||null,music_text:musicText.value.trim()||null,music_url:musicUrl.value.trim()||null,updated_at:new Date().toISOString()}).eq("user_id",me.id);msg.textContent=r.error?r.error.message:"Customization saved."};
saveTop.onclick=async()=>{const names=Array.from({length:8},(_,i)=>document.getElementById("f"+i).value.trim().toLowerCase()).filter(Boolean);if(!names.length){const r=await db.from("crowspace_profiles").update({top_friends:[],updated_at:new Date().toISOString()}).eq("user_id",me.id);msg.textContent=r.error?r.error.message:"Top 8 cleared.";return}const q=await db.from("crowspace_profiles").select("user_id,username").in("username",names);if(q.error){msg.textContent=q.error.message;return}const map={};(q.data||[]).forEach(x=>map[x.username]=x.user_id);const ids=names.map(n=>map[n]).filter(Boolean);const r=await db.from("crowspace_profiles").update({top_friends:ids,updated_at:new Date().toISOString()}).eq("user_id",me.id);msg.textContent=r.error?r.error.message:"Top 8 saved."};init();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customize My Nest | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav><a href="index.html">Home</a><a class="active" href="profile.html">My Nest</a><a href="friends.html">Friends</a><a href="albums.html">Photos</a><a href="groups.html">Groups</a><a href="events.html">Events</a></nav><div id="account"></div></header><main class="section"><p class="eyebrow">MAKE IT YOURS</p><h1>Customize My Nest</h1><section class="card"><form id="f"><label>Tagline<input id="tagline" maxlength="160" placeholder="Your space. Your story."></label><label>About Me<textarea id="about_me" maxlength="3000"></textarea></label><label>Favorite Song<input id="favorite_song"></label><label>Favorite Movies<input id="favorite_movies"></label><label>Favorite Shows<input id="favorite_shows"></label><label>Favorite Music<input id="favorite_music"></label><label>Background Image URL<input id="background_url" type="url"></label><button class="btn primary">Save My Nest</button><p id="msg" class="muted"></p></form></section><section class="card"><h2>Interests</h2><form id="interestForm"><input id="interest" placeholder="Add an interest, e.g. filmmaking"><select id="category"><option>general</option><option>music</option><option>movies</option><option>tv</option><option>sports</option><option>games</option><option>creative</option></select><button class="btn">Add Interest</button></form><div id="interests"></div></section></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>let u;async function load(){const {data}=await crowSupabase.from("crowspace_nest_settings").select("*").eq("user_id",u.id).maybeSingle();if(data)Object.keys(data).forEach(k=>{if(document.getElementById(k))document.getElementById(k).value=data[k]||""});const {data:i}=await crowSupabase.from("crowspace_interests").select("*").eq("user_id",u.id).order("created_at");interests.innerHTML=(i||[]).map(x=>'<span class="event-tag" style="display:inline-block;margin:5px">'+CS.escape(x.interest)+' · '+CS.escape(x.category)+'</span>').join("")||'<p class="muted">No interests added yet.</p>'}f.onsubmit=async e=>{e.preventDefault();const {error}=await crowSupabase.from("crowspace_nest_settings").upsert({user_id:u.id,tagline:tagline.value,about_me:about_me.value,favorite_song:favorite_song.value,favorite_movies:favorite_movies.value,favorite_shows:favorite_shows.value,favorite_music:favorite_music.value,background_url:background_url.value,updated_at:new Date().toISOString()},{onConflict:"user_id"});msg.textContent=error?error.message:"Nest saved.";};interestForm.onsubmit=async e=>{e.preventDefault();if(!interest.value.trim())return;const {error}=await crowSupabase.from("crowspace_interests").insert({user_id:u.id,category:category.value,interest:interest.value.trim()});interest.value="";if(error)alert(error.message);load()};document.addEventListener("DOMContentLoaded",async()=>{u=await CS.user();if(!u){location.href="login.html";return}load()});</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enemies · CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-page="enemies"><header class="topbar"><a class="brand" href="index.html">CROW<span>SPACE</span></a><nav id="nav" class="nav"></nav><a class="membership" href="membership.html">Universal Membership</a></header><main class="shell"><section class="card"><div class="eyebrow">Personal controls</div><h1 class="title">Enemies</h1><p class="subtitle">Keep a private list of members you do not want to interact with.</p><input id="enemyId" class="input" placeholder="Member UUID"><button class="btn danger" style="margin-top:10px" onclick="addEnemy()">Add Enemy</button><div id="enemies" class="list" style="margin-top:15px"></div></section><script>async function addEnemy(){if(!cs.user)return;const id=enemyId.value.trim();if(!id)return;await cs.client.from('crowspace_enemies').insert({user_id:cs.user.id,enemy_id:id});loadEnemies()}async function loadEnemies(){if(!cs.user)return;const r=await cs.client.from('crowspace_enemies').select('*').eq('user_id',cs.user.id);document.querySelector('#enemies').innerHTML=(r.data||[]).map(x=>'<div class="item">'+esc(x.enemy_id)+'</div>').join('')||'<div class="muted">No enemies listed.</div>'}document.addEventListener('DOMContentLoaded',loadEnemies)</script><div class="footer">CrowRules Entertainment · CrowSpace · One Account · One Universe</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/crowrules-membership.js"></script><script src="js/crowspace.js"></script></body></html>

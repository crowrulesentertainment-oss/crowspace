<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Go Live | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"><a href="login.html">Sign In</a></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">PHASE 4 · LIVE</p><h1>Go Live</h1><p class="muted">Start a CrowSpace broadcast and connect it to a Circle or Creator Project.</p></div><a class="btn" href="live.html">Live Hub</a></div><section class="comm-card"><div class="list"><input id="title" placeholder="Live title"><textarea id="description" placeholder="Description"></textarea><select id="circle"><option value="">No Circle</option></select><select id="project"><option value="">No Creator Project</option></select><button id="start" class="btn primary">Start Live Session</button><p id="msg" class="muted"></p></div></section></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await CS.user();if(!u){location.href='login.html';return}await CS.refreshHeader();const esc=CS.escape;const c=await crowSupabase.from('crowspace_circles').select('id,name').order('name').limit(100);circle.innerHTML='<option value="">No Circle</option>'+(c.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');const p=await crowSupabase.from('crowspace_creator_projects').select('id,title').eq('owner_id',u.id).order('title').limit(100);project.innerHTML='<option value="">No Creator Project</option>'+(p.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.title)+'</option>').join('');start.onclick=async()=>{const titleValue=title.value.trim();if(!titleValue){msg.textContent='Enter a title.';return}const r=await crowSupabase.from('crowspace_live_sessions').insert({creator_id:u.id,title:titleValue,description:description.value.trim(),status:'starting',category:'crowspace',circle_id:circle.value||null,project_id:project.value||null}).select('id').single();if(r.error){msg.textContent=r.error.message;return}location.href='live-watch.html?id='+encodeURIComponent(r.data.id)};});</script><script src="js/global-nav.js"></script></body></html>

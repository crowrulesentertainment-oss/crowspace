<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group Invite — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body><header class="topbar"></header><main class="page"><section class="panel" id="inviteBox"><span class="eyebrow">CROWSPACE GROUP</span><h1>Group Invitation</h1><p id="inviteText" class="muted">Loading invitation…</p><button class="primary" id="requestJoin">Request to Join</button><div id="inviteStatus" class="auth-status"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/navigation.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const sb=supabase.createClient(window.CROW_CONFIG.supabaseUrl,window.CROW_CONFIG.supabaseKey),p=new URLSearchParams(location.search),token=p.get("token"),status=document.getElementById("inviteStatus"),txt=document.getElementById("inviteText"),btn=document.getElementById("requestJoin");if(!token){txt.textContent="Invalid invitation.";btn.hidden=true;return}const {data:{user}}=await sb.auth.getUser();if(!user){txt.textContent="Sign in to request access.";btn.textContent="Sign In";btn.onclick=()=>location.href="login.html?next="+encodeURIComponent(location.href);return}const {data:i}=await sb.from("crowspace_group_invites").select("id,conversation_id,expires_at,revoked_at").eq("token",token).maybeSingle();if(!i||i.revoked_at||(i.expires_at&&new Date(i.expires_at)<new Date())){txt.textContent="This invitation is invalid or expired.";btn.hidden=true;return}txt.textContent="You’ve been invited to join a CrowSpace group.";const {data:m}=await sb.from("crowspace_conversation_members").select("user_id").eq("conversation_id",i.conversation_id).eq("user_id",user.id).maybeSingle();if(m){btn.textContent="Already a member";btn.disabled=true;return}btn.onclick=async()=>{btn.disabled=true;const {error}=await sb.from("crowspace_group_join_requests").insert({conversation_id:i.conversation_id,user_id:user.id,invite_id:i.id});status.textContent=error?(error.code==="23505"?"Join request already exists.":error.message):"Join request sent. A group admin will review it.";if(error)btn.disabled=false}});</script></body></html>

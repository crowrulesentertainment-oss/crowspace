<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group Invite — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body><header class="topbar"></header><main class="page"><section class="panel" id="inviteBox"><span class="eyebrow">CROWSPACE GROUP</span><h1>Group Invitation</h1><p id="inviteText" class="muted">Loading invitation…</p><div id="inviteMeta" class="invite-expiry-preview" hidden></div><button class="primary" id="requestJoin">Request to Join</button><div id="inviteStatus" class="auth-status"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/navigation.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const sb=supabase.createClient(window.CROW_CONFIG.supabaseUrl,window.CROW_CONFIG.supabaseKey),p=new URLSearchParams(location.search),token=p.get("token"),status=document.getElementById("inviteStatus"),txt=document.getElementById("inviteText"),meta=document.getElementById("inviteMeta"),btn=document.getElementById("requestJoin");if(!token){txt.textContent="Invalid invitation.";btn.hidden=true;return}const viewedKey="crowspace_invite_viewed_"+token;if(!sessionStorage.getItem(viewedKey)){await sb.rpc("crowspace_record_invite_view",{p_token:token});sessionStorage.setItem(viewedKey,"1")}const {data:{user}}=await sb.auth.getUser();if(!user){txt.textContent="Sign in to request access.";btn.textContent="Sign In";btn.onclick=()=>location.href="login.html?next="+encodeURIComponent(location.href);return}const {data:i,error}=await sb.from("crowspace_group_invites").select("id,conversation_id,label,expires_at,revoked_at,max_uses,use_count").eq("token",token).maybeSingle();if(error||!i){txt.textContent="This invitation could not be found.";btn.hidden=true;return}const expired=i.expires_at&&new Date(i.expires_at)<=new Date(),usedUp=i.max_uses!=null&&Number(i.use_count||0)>=Number(i.max_uses);if(i.revoked_at||expired||usedUp){txt.textContent=i.revoked_at?"This invitation has been revoked.":usedUp?"This invitation has reached its usage limit.":"This invitation has expired.";btn.hidden=true;return}txt.textContent="You’ve been invited to join a CrowSpace group"+(i.label?" — “"+i.label+"”":".");meta.hidden=false;meta.textContent=i.max_uses==null?"Unlimited invitations · "+Number(i.use_count||0)+" used":Number(i.use_count||0)+" of "+i.max_uses+" uses used";const {data:m}=await sb.from("crowspace_conversation_members").select("user_id").eq("conversation_id",i.conversation_id).eq("user_id",user.id).maybeSingle();if(m){btn.textContent="Already a member";btn.disabled=true;return}btn.onclick=async()=>{btn.disabled=true;const {data:ok,error:useError}=await sb.rpc("crowspace_use_group_invite",{p_token:token});if(useError||!ok?.ok){status.textContent=useError?.message||({invalid_or_expired:"This invitation is no longer available.",usage_limit_reached:"This invitation has reached its usage limit.",not_authenticated:"Please sign in again."}[ok?.error]||"This invitation is no longer available.");btn.disabled=false;return}const {error}=await sb.from("crowspace_group_join_requests").insert({conversation_id:i.conversation_id,user_id:user.id,invite_id:i.id});if(error){status.textContent=error.code==="23505"?"Join request already exists.":error.message;btn.disabled=false;return}status.textContent="Join request sent. A group admin will review it.";btn.textContent="Request Sent"}});</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Production Pipeline | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.pipe{background:linear-gradient(145deg,#11182b,#090d18);border:1px solid var(--line);border-radius:18px;padding:18px}.pipe h2{margin-top:0}.entry{padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:9px}.activity{display:grid;gap:9px}.activity .entry{margin:0}@media(max-width:900px){.pipeline{grid-template-columns:1fr 1fr}}@media(max-width:600px){.pipeline{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">PHASE 5 · CROWRULES INTEGRATION</p><h1>Production Pipeline</h1><p class="muted">Dreamscapes ideas and projects flowing toward CrowRules productions and CrowRules TV.</p></div><a class="btn" href="dreamscapes.html">Dreamscapes</a></div><section class="pipeline"><div class="pipe"><h2>🌌 Dreamscapes</h2><div id="dreams" class="list">Loading…</div></div><div class="pipe"><h2>🎬 Projects</h2><div id="projects" class="list">Loading…</div></div><div class="pipe"><h2>📺 CrowRules TV</h2><div id="tv" class="list">Loading…</div></div><div class="pipe"><h2>⚡ Activity</h2><div id="activity" class="activity">Loading…</div></div></section></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await CS.user();if(!u){location.href='login.html';return}await CS.refreshHeader();const esc=CS.escape;const [d,p,t,a]=await Promise.all([crowSupabase.from('ds_projects').select('id,title,slug,status,progress').order('updated_at',{ascending:false}).limit(8),crowSupabase.from('crowspace_creator_projects').select('id,title,status,project_type,cover_url').order('updated_at',{ascending:false}).limit(8),crowSupabase.from('crowrules_tv_catalog').select('id,title,slug,content_type,category,is_published').eq('is_published',true).order('sort_order',{ascending:true}).limit(8),crowSupabase.from('cr_platform_activity_feed').select('id,event_type,entity_type,message,division_key,created_at').order('created_at',{ascending:false}).limit(12)]);const card=(x,sub)=>'<div class="entry"><strong>'+esc(x.title||'Untitled')+'</strong><div class="muted">'+esc(sub||x.status||'')+'</div></div>';dreams.innerHTML=(d.data||[]).map(x=>card(x,(x.status||'')+(x.progress!=null?' · '+x.progress+'%':''))).join('')||'<div class="empty">No Dreamscapes projects yet.</div>';projects.innerHTML=(p.data||[]).map(x=>card(x,x.project_type||x.status)).join('')||'<div class="empty">No creator projects yet.</div>';tv.innerHTML=(t.data||[]).map(x=>card(x,x.content_type||x.category)).join('')||'<div class="empty">No published TV catalog entries yet.</div>';activity.innerHTML=(a.data||[]).map(x=>'<div class="entry"><strong>'+esc(x.event_type||'Activity')+'</strong><div>'+esc(x.message||'')+'</div><small class="muted">'+esc(x.division_key||'CrowRules')+' · '+new Date(x.created_at).toLocaleString()+'</small></div>').join('')||'<div class="empty">No platform activity yet.</div>';});</script><script src="js/global-nav.js"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caw — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body><header class="topbar"></header><main class="page"><div class="page-title"><span class="eyebrow">CAW</span><h1>Caw Detail</h1></div><article class="feed-card panel" id="cawCard"><div class="empty">Loading Caw…</div></article></main><footer><b>🐦 CROWSPACE</b><span>One Account. One Universe.</span><span>© 2026 CrowRules Entertainment</span></footer><nav class="mobile-nav"><a href="index.html">⌂<small>Home</small></a><a href="search.html">⌕<small>Search</small></a><a href="caw-feed.html">＋<small>Caw</small></a><a href="notifications.html">◉<small>Alerts</small></a><a href="profile.html">●<small>Profile</small></a></nav><script src="js/navigation.js"></script><script src="js/crowspace.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{
 if(!window.CROW_CONFIG?.supabaseUrl)return;
 const sb=supabase.createClient(CROW_CONFIG.supabaseUrl,CROW_CONFIG.supabaseKey);
 const id=new URLSearchParams(location.search).get("id"),card=document.getElementById("cawCard");
 if(!id){card.innerHTML='<div class="empty">No Caw selected.</div>';return}
 const {data:x,error}=await sb.from("crowspace_posts").select("id,user_id,body,created_at,media_url").eq("id",id).maybeSingle();
 if(error||!x){card.innerHTML='<div class="empty">Caw not found.</div>';return}
 const {data:p}=await sb.from("crowspace_profiles").select("username,display_name,avatar_url").eq("user_id",x.user_id).maybeSingle();
 const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
 const name=p?.display_name||p?.username||"CrowSpace Member", href=p?.username?"profile.html?username="+encodeURIComponent(p.username):"profile.html?user="+encodeURIComponent(x.user_id);
 const avatar=p?.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'" alt="">':'<div class="avatar">'+esc(name.slice(0,2).toUpperCase())+'</div>';
 card.innerHTML='<div class="user-row"><a href="'+href+'">'+avatar+'</a><div><a href="'+href+'"><b>'+esc(name)+'</b></a><div class="muted"><a href="'+href+'">@'+esc(p?.username||"member")+'</a></div></div><span class="muted">'+new Date(x.created_at).toLocaleString()+'</span></div>'+(x.media_url?'<div class="media-placeholder">MEDIA ATTACHED</div>':'')+'<p>'+esc(x.body)+'</p><div class="reaction-bar"><button>♡ Like</button><button>💬 Comment</button><button>↗ Repost</button><button>🔖 Save</button></div><div class="comment-box"><input placeholder="Write a comment…"><button class="primary">Comment</button></div>';
});
</script></body></html>

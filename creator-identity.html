<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Identity Hub 9.0 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1050px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:var(--p2);border:1px solid #292e42;border-radius:14px;padding:15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.tag{font-size:10px;letter-spacing:.12em;color:#8ff6ff;font-weight:800}.muted{color:var(--m)}input,select{width:100%;background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px;padding:11px}.role{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #292e42}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Creator Identity Hub 9.0</span></div><div class="actions"><a class="btn primary" href="./command-center.html">Command Center</a><a class="btn" href="./profile.html">Profile</a><a class="btn" href="./creator-dashboard.html">Creator Dashboard</a></div></div><section class="card"><span class="tag">UNIVERSAL CREATOR IDENTITY</span><h1 id="name">Loading…</h1><p id="handle" class="muted"></p><div id="verification"></div></section><div class="grid"><section class="card"><h2>🎭 Roles</h2><div id="roles">Loading…</div></section><section class="card"><h2>🔐 Permissions</h2><div id="permissions">Loading…</div></section></div><section class="card"><h2>➕ Add Creator Role</h2><div class="grid"><select id="role"><option>creator</option><option>writer</option><option>producer</option><option>host</option><option>editor</option><option>designer</option><option>developer</option><option>photographer</option><option>videographer</option><option>musician</option><option>actor</option><option>moderator</option><option>staff</option><option>admin</option></select><select id="division"><option>crowspace</option><option>dreamscapes</option><option>podcasting</option><option>sports</option><option>tv</option><option>memorials</option><option>business</option></select></div><br><button class="btn primary" id="add">Add Role</button> <span id="msg" class="muted"></span></section><section class="card"><h2>🌐 Division Access</h2><div class="actions"><a class="btn" href="https://crowrulesentertainment-oss.github.io/dreamscapes/">Dreamscapes</a><a class="btn" href="https://crowrulesentertainment-oss.github.io/podcasting/">Podcasting</a><a class="btn" href="https://crowrulesentertainment-oss.github.io/memorials/">Memorials</a><a class="btn" href="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/">CrowRules</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const E=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let me;async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const [p,r,pm]=await Promise.all([db.from("crowspace_profiles").select("display_name,username,verification_type,verification_status,verified_display_label").eq("user_id",me.id).maybeSingle(),db.from("crowspace_creator_roles").select("id,role,division,status,created_at").eq("user_id",me.id).order("created_at",{ascending:false}),db.from("crowspace_creator_permissions").select("permission,division,created_at").eq("user_id",me.id).order("division")]);const profile=p.data||{};E("name").textContent=profile.display_name||profile.username||"Creator";E("handle").textContent=profile.username?"@"+profile.username:"";E("verification").innerHTML=profile.verification_status==="verified"?'<span class="tag">✓ VERIFIED · '+esc(profile.verified_display_label||profile.verification_type||"Creator")+"</span>":'<span class="muted">Creator verification: '+esc(profile.verification_status||"not verified")+"</span>";E("roles").innerHTML=(r.data||[]).map(x=>'<div class="role"><span><b>'+esc(x.role)+'</b><br><small class="muted">'+esc(x.division)+'</small></span><span class="muted">'+esc(x.status)+'</span></div>').join("")||'<div class="muted">No creator roles yet.</div>';E("permissions").innerHTML=(pm.data||[]).map(x=>'<div class="role"><span>🔐 '+esc(x.permission.replaceAll("_"," "))+'</span><span class="muted">'+esc(x.division)+'</span></div>').join("")||'<div class="muted">Permissions will appear as your creator access grows.</div>'}E("add").onclick=async()=>{const r=await db.from("crowspace_creator_roles").insert({user_id:me.id,role:E("role").value,division:E("division").value,granted_by:me.id});E("msg").textContent=r.error?r.error.message:"Role added.";if(!r.error)init()};init();</script><script src="./js/crowspace-holiday-themes.js"></script>

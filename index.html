<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace — The Crow Feed</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="scanlines"></div><div class="ambient"></div><header class="topbar"><a class="brand" href="index.html"><span class="mark">C</span><span>CROW<span>SPACE</span></span></a><nav><a class="active" href="index.html">Feed</a><a href="profile.html">Profile</a><a href="notifications.html">Notifications <span id="notifBadge" style="display:none"></span></a></nav><div class="account"><span id="memberState">CONNECTING…</span><button id="authBtn">Sign In</button></div></header><main class="shell"><section class="card" style="padding:28px;max-width:760px;margin:auto"><div class="eyebrow">CROWRULES SOCIAL FEED</div><h1 style="font:800 34px Orbitron;margin:14px 0">THE CROW FEED</h1><p style="color:var(--muted)">Your first social layer. Simple now, expandable later.</p><form id="postForm" style="display:none;margin-top:25px"><textarea id="body" maxlength="500" placeholder="What's happening in your universe?" style="width:100%;min-height:110px;padding:16px;background:#070a10;color:white;border:1px solid var(--line);border-radius:10px;resize:vertical"></textarea><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><small id="count" style="color:var(--muted)">0 / 500</small><button class="btn primary">POST CAW</button></div></form></section><section id="feed" style="max-width:760px;margin:18px auto"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
const feed=document.getElementById("feed"),form=document.getElementById("postForm"),body=document.getElementById("body"),count=document.getElementById("count");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
window.crowCurrentUserId=null;
async function loadFeed(){
 const {data:{session}}=await db.auth.getSession();
 const followed=session?(await db.from("crowspace_follows").select("followed_user_id").eq("follower_id",session.user.id)).data||[]:[];
 const followingIds=followed.map(x=>x.followed_user_id);
 let query=db.from("crowspace_posts").select("id,user_id,body,created_at").order("created_at",{ascending:false}).limit(30);
 if(followingIds.length) query=query.in("user_id",[session.user.id,...followingIds]);
 const {data,error}=await query;
 if(error){feed.innerHTML='<div class="card" style="padding:25px">Feed unavailable.</div>';return}
 if(!data?.length){feed.innerHTML='<div class="card" style="padding:30px;color:var(--muted)">No caws yet. Be the first signal.</div>';return}
 const ids=[...new Set(data.map(x=>x.user_id))];
 const {data:ps}=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids);
 const map=Object.fromEntries((ps||[]).map(p=>[p.user_id,p]));
 const postIds=data.map(x=>x.id);
 const {data:ix}=await db.from("crowspace_social_interactions").select("target_id,user_id,interaction_type").eq("target_type","post").in("target_id",postIds);
 const counts={};const mine=new Set();
 (ix||[]).forEach(v=>{const k=v.target_id+":"+v.interaction_type;counts[k]=(counts[k]||0)+1;if(v.user_id===window.crowCurrentUserId)mine.add(k)});
 feed.innerHTML=data.map(x=>{
  const p=map[x.user_id]||{},lk=counts[x.id+":like"]||0,sv=counts[x.id+":save"]||0,rp=counts[x.id+":repost"]||0;
  const active=t=>mine.has(x.id+":"+t)?" aria-pressed=\"true\"":"";
  return '<article class="card" style="padding:22px;margin-bottom:12px"><div style="display:flex;gap:12px;align-items:center"><a href="profile.html?u='+encodeURIComponent(x.user_id)+'" class="mark" style="text-decoration:none">'+esc((p.display_name||p.username||"C")[0].toUpperCase())+'</a><div><strong><a href="profile.html?u='+encodeURIComponent(x.user_id)+'" style="color:var(--text);text-decoration:none">'+esc(p.display_name||p.username||"Crow")+'</a></strong><div style="font-size:11px;color:var(--muted)">@'+esc(p.username||"crow")+' · '+new Date(x.created_at).toLocaleString()+'</div></div></div><p style="line-height:1.7;margin:18px 0 10px;white-space:pre-wrap">'+esc(x.body)+'</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost react" data-id="'+x.id+'" data-type="like"'+active("like")+'>♥ '+lk+'</button><button class="btn ghost react" data-id="'+x.id+'" data-type="save"'+active("save")+'>☆ '+sv+'</button><button class="btn ghost react" data-id="'+x.id+'" data-type="repost"'+active("repost")+'>↻ '+rp+'</button></div><div style="margin-top:14px"><button class="btn ghost comment-toggle" data-id="'+x.id+'">💬 <span class="comment-count" data-id="'+x.id+'">0</span> Comments</button><div class="comments" id="comments-'+x.id+'" style="display:none;margin-top:12px"></div></div></article>'
 }).join("");
 document.querySelectorAll(".react").forEach(b=>b.onclick=()=>toggleInteraction(b.dataset.id,b.dataset.type));
document.querySelectorAll(".comment-toggle").forEach(b=>b.onclick=async()=>{const box=document.getElementById("comments-"+b.dataset.id);box.style.display=box.style.display==="none"?"block":"none";if(box.style.display==="block")await loadComments(b.dataset.id)});
}
async function toggleInteraction(target_id,interaction_type){
 const {data:{session}}=await db.auth.getSession();
 if(!session){location.href="login.html";return}
 const {data:existing,error:findError}=await db.from("crowspace_social_interactions").select("id").eq("target_type","post").eq("target_id",target_id).eq("user_id",session.user.id).eq("interaction_type",interaction_type).maybeSingle();
 if(findError){alert(findError.message);return}
 if(existing){const {error}=await db.from("crowspace_social_interactions").delete().eq("id",existing.id);if(error){alert(error.message);return}}
 else{const {error}=await db.from("crowspace_social_interactions").insert({target_type:"post",target_id,user_id:session.user.id,interaction_type});if(error){alert(error.message);return}}
 await loadFeed();
}
(async()=>{
 const {data:{session}}=await db.auth.getSession();
 window.crowCurrentUserId=session?.user?.id||null;
 if(session)form.style.display="block";
 body.addEventListener("input",()=>count.textContent=body.value.length+" / 500");
 form.addEventListener("submit",async e=>{e.preventDefault();const {data:{session}}=await db.auth.getSession();if(!session)return;const text=body.value.trim();if(!text)return;const {error}=await db.from("crowspace_posts").insert({user_id:session.user.id,body:text});if(error){alert(error.message);return}body.value="";count.textContent="0 / 500";await loadFeed()});
 await loadFeed();
})();
</script></body></html>

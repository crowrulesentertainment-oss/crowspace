<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070d"><title>CrowSpace — October 1, 2026</title><link rel="stylesheet" href="style.css"><style>body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#05070d}.intro{width:min(1000px,92vw);text-align:center;position:relative;z-index:2}.logo{font:800 clamp(28px,5vw,58px) Orbitron;letter-spacing:5px}.logo span,h1 em{color:var(--cyan)}.kicker{font:700 11px Orbitron;letter-spacing:4px;color:var(--cyan);margin:22px 0}h1{font:800 clamp(32px,7vw,76px) Orbitron;line-height:1.05;margin:0}h1 em{font-style:normal}.subtitle{color:var(--muted);font-size:14px;line-height:1.8;margin:22px auto 34px}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:720px;margin:auto}.unit{padding:25px 10px;border:1px solid var(--line);border-radius:14px;background:rgba(14,18,29,.75);backdrop-filter:blur(16px)}.num{font:800 clamp(30px,6vw,58px) Orbitron}.label{font:700 9px Orbitron;letter-spacing:3px;color:var(--muted);margin-top:8px}.enter{display:inline-block;margin-top:32px;padding:13px 24px;border-radius:9px;color:#061018;background:var(--cyan);font-weight:800;text-decoration:none;opacity:.35;pointer-events:none}.enter.ready{opacity:1;pointer-events:auto}.status{margin-top:15px;color:#657287;font:10px Orbitron;letter-spacing:2px}@media(max-width:520px){.countdown{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><main class="intro"><div class="logo">CROW<span>SPACE</span></div><div class="kicker">A NEW SOCIAL UNIVERSE IS INITIALIZING</div><h1>LAUNCHING<br><em>OCTOBER 1, 2026</em></h1><p class="subtitle">Posts. Caws. Circles. Creators. Communities.<br>The next chapter of CrowSpace begins here.</p><div class="countdown"><div class="unit"><div class="num" id="days">00</div><div class="label">DAYS</div></div><div class="unit"><div class="num" id="hours">00</div><div class="label">HOURS</div></div><div class="unit"><div class="num" id="minutes">00</div><div class="label">MINUTES</div></div><div class="unit"><div class="num" id="seconds">00</div><div class="label">SECONDS</div></div></div><a class="enter" id="enter" href="home.html">ENTER CROWSPACE</a><div class="status" id="status">INITIALIZING LAUNCH SEQUENCE…</div></main><script>const target=new Date("2026-10-01T00:00:00-07:00").getTime();function tick(){const diff=Math.max(0,target-Date.now()),s=Math.floor(diff/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;for(const [id,v] of [["days",d],["hours",h],["minutes",m],["seconds",sec]])document.getElementById(id).textContent=String(v).padStart(2,"0");if(diff<=0){document.getElementById("status").textContent="CROWSPACE IS ONLINE";document.getElementById("enter").classList.add("ready")}}tick();setInterval(tick,1000);</script></body></html>

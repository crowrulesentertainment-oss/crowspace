<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace — The Crow Feed</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="scanlines"></div><div class="ambient"></div><header class="topbar"><a class="brand" href="index.html"><span class="mark">C</span><span>CROW<span>SPACE</span></span></a><nav><a class="active" href="index.html">Feed</a><a href="profile.html">Profile</a></nav><div class="account"><span id="memberState">CONNECTING…</span><button id="authBtn">Sign In</button></div></header><main class="shell"><section class="card" style="padding:28px;max-width:760px;margin:auto"><div class="eyebrow">CROWRULES SOCIAL FEED</div><h1 style="font:800 34px Orbitron;margin:14px 0">THE CROW FEED</h1><p style="color:var(--muted)">Your first social layer. Simple now, expandable later.</p><form id="postForm" style="display:none;margin-top:25px"><textarea id="body" maxlength="500" placeholder="What's happening in your universe?" style="width:100%;min-height:110px;padding:16px;background:#070a10;color:white;border:1px solid var(--line);border-radius:10px;resize:vertical"></textarea><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><small id="count" style="color:var(--muted)">0 / 500</small><button class="btn primary">POST CAW</button></div></form></section><section id="feed" style="max-width:760px;margin:18px auto"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
const feed=document.getElementById("feed"),form=document.getElementById("postForm"),body=document.getElementById("body"),count=document.getElementById("count");
const esc=v=>String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function loadFeed(){const {data,error}=await db.from("crowspace_posts").select("id,user_id,body,created_at").order("created_at",{ascending:false}).limit(30);if(error){feed.innerHTML='<div class="card" style="padding:25px">Feed unavailable.</div>';return}if(!data?.length){feed.innerHTML='<div class="card" style="padding:30px;color:var(--muted)">No caws yet. Be the first signal.</div>';return}const ids=[...new Set(data.map(x=>x.user_id))];const {data:ps}=await db.from("crowspace_profiles").select("user_id,username,display_name").in("user_id",ids);const map=Object.fromEntries((ps||[]).map(p=>[p.user_id,p]));feed.innerHTML=data.map(x=>{const p=map[x.user_id]||{};return '<article class="card" style="padding:22px;margin-bottom:12px"><div style="display:flex;gap:12px;align-items:center"><div class="mark">'+esc((p.display_name||p.username||"C")[0].toUpperCase())+'</div><div><strong>'+esc(p.display_name||p.username||"Crow")+'</strong><div style="font-size:11px;color:var(--muted)">@'+esc(p.username||"crow")+' · '+new Date(x.created_at).toLocaleString()+'</div></div></div><p style="line-height:1.7;margin:18px 0 4px;white-space:pre-wrap">'+esc(x.body)+'</p></article>'}).join("")}
(async()=>{const {data:{session}}=await db.auth.getSession();if(session)form.style.display="block";body.addEventListener("input",()=>count.textContent=body.value.length+" / 500");form.addEventListener("submit",async e=>{e.preventDefault();const {data:{session}}=await db.auth.getSession();if(!session)return;const text=body.value.trim();if(!text)return;const {error}=await db.from("crowspace_posts").insert({user_id:session.user.id,body:text});if(error){alert(error.message);return}body.value="";count.textContent="0 / 500";loadFeed()});loadFeed()})();
</script></body></html>

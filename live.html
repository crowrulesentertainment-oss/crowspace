<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.live-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.live-card{padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#11182b,#090d18)}.live-dot{color:#ff5364;font-weight:900}@media(max-width:800px){.live-grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"><a href="login.html">Sign In</a></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">PHASE 4 · COMMUNICATION</p><h1>Live</h1><p class="muted">Discover active CrowSpace broadcasts.</p></div><a class="btn primary" href="live-create.html">Go Live</a></div><div id="live" class="live-grid"><div class="empty">Loading Live…</div></div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await CS.user();if(!u){location.href='login.html';return}await CS.refreshHeader();async function load(){const q=await crowSupabase.from('crowspace_live_sessions').select('id,title,description,status,viewer_count,started_at,circle_id,project_id,crowspace_circles(name,slug),crowspace_creator_projects(title,id)').in('status',['live','starting']).order('started_at',{ascending:false}).limit(30);const e=document.getElementById('live');e.innerHTML=(q.data||[]).map(x=>'<article class="live-card"><p class="eyebrow"><span class="live-dot">● LIVE</span> · '+Number(x.viewer_count||0)+' viewers</p><h2>'+CS.escape(x.title||'Live Broadcast')+'</h2><p class="muted">'+CS.escape(x.description||'')+'</p><a class="btn primary" href="live-watch.html?id='+encodeURIComponent(x.id)+'">Watch Live →</a></article>').join('')||'<div class="empty">Nobody is live right now.</div>}load();setInterval(load,10000)});</script><script src="js/global-nav.js?v=20260927-4"></script></body></html>

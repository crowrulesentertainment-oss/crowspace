<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Live</title><link rel="stylesheet" href="css/crowspace.css"><style>.live-player{aspect-ratio:16/9;background:#05050b;border:1px solid #222;border-radius:16px;overflow:hidden}.live-player video{width:100%;height:100%}.chat{max-height:420px;overflow:auto}.chat-row{padding:.55rem 0;border-bottom:1px solid #222}.live-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:1rem}@media(max-width:800px){.live-grid{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">◉ CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">Nest</a><a href="caws.html">Caws</a><a href="groups.html">Groups</a><a class="active" href="live.html">Live</a></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">CROWSPACE LIVE</p><h1>Live</h1><p class="muted">Community broadcasts with realtime chat and presence.</p></div><a class="btn primary" href="go-live.html">Go Live</a></div><div id="status" class="card">Loading broadcasts…</div><div id="liveArea" hidden class="live-grid"><section><div id="player" class="live-player"></div><div class="card"><h2 id="liveTitle"></h2><p id="liveDesc"></p><div id="viewerCount" class="muted"></div><button class="btn" id="heartBtn">♥ React</button></div></section><aside class="card"><h2>Live Chat</h2><div id="chat" class="chat"></div><form id="chatForm"><input id="chatInput" maxlength="1000" placeholder="Say something…"><button class="btn primary">Send</button></form></aside></div></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>let sessionId,channel;const esc=CS.escape;async function load(){const id=new URLSearchParams(location.search).get("session");let q=crowSupabase.from("crowspace_live_sessions").select("*").eq("status","live").order("started_at",{ascending:false}).limit(1);if(id)q=crowSupabase.from("crowspace_live_sessions").select("*").eq("id",id).maybeSingle();const {data,error}=await q;if(error||!data||(Array.isArray(data)&&!data.length)){status.textContent="No live broadcast is currently active.";return}const s=Array.isArray(data)?data[0]:data;sessionId=s.id;status.hidden=true;liveArea.hidden=false;liveTitle.textContent=s.title;liveDesc.textContent=s.description||"";viewerCount.textContent=(s.viewer_count||0)+" viewers";if(s.playback_url)player.innerHTML='<video controls autoplay playsinline src="'+esc(s.playback_url)+'"></video>';else player.innerHTML='<div style="height:100%;display:grid;place-items:center;text-align:center"><div><h2>Broadcast ready</h2><p class="muted">Live video provider not connected yet.</p></div></div>';await joinViewer();await loadChat();channel=crowSupabase.channel("crowspace-live-"+sessionId).on("postgres_changes",{event:"INSERT",schema:"public",table:"crowspace_live_chat",filter:"session_id=eq."+sessionId},p=>renderChat(p.new)).subscribe()}async function joinViewer(){const u=await CS.user();if(!u)return;await crowSupabase.from("crowspace_live_viewers").upsert({session_id:sessionId,user_id:u.id,last_seen_at:new Date().toISOString()},{onConflict:"session_id,user_id"});const {count}=await crowSupabase.from("crowspace_live_viewers").select("*",{count:"exact",head:true}).eq("session_id",sessionId);if(count!=null){viewerCount.textContent=count+" viewers";await crowSupabase.from("crowspace_live_sessions").update({viewer_count:count}).eq("id",sessionId)}}async function loadChat(){const {data}=await crowSupabase.from("crowspace_live_chat").select("*").eq("session_id",sessionId).order("created_at",{ascending:true}).limit(100);chat.innerHTML="";(data||[]).forEach(renderChat)}function renderChat(x){chat.insertAdjacentHTML("beforeend",'<div class="chat-row"><strong>Member</strong><div>'+esc(x.body)+'</div></div>');chat.scrollTop=chat.scrollHeight}chatForm.onsubmit=async e=>{e.preventDefault();const u=await CS.user();if(!u){location.href="login.html";return}const body=chatInput.value.trim();if(!body)return;const {error}=await crowSupabase.from("crowspace_live_chat").insert({session_id:sessionId,user_id:u.id,body});if(!error)chatInput.value=""};heartBtn.onclick=async()=>{const u=await CS.user();if(!u){location.href="login.html";return}await crowSupabase.from("crowspace_live_reactions").upsert({session_id:sessionId,user_id:u.id,reaction:"heart"},{onConflict:"session_id,user_id,reaction"});};document.addEventListener("DOMContentLoaded",()=>{CS.refreshHeader();load()});</script></body></html>

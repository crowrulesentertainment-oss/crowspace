<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Changes & Revisions 7.5 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1150px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{background:var(--p2);border:1px solid #292e42;border-radius:15px;padding:15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.muted{color:var(--m)}.tag{font-size:10px;color:#8ff6ff;letter-spacing:.12em;font-weight:800}.open{border-color:#20e6ff}.approved{border-color:#72f0a6}.urgent{border-color:#ff6b8a}input,textarea,select{width:100%;background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px;padding:11px}textarea{min-height:75px}.empty{text-align:center;padding:22px;color:var(--m)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="./css/crowrules-cinematic.css">
</head><body data-crowrules-division="crowspace"><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Changes & Revisions 7.5</span></div><div class="actions"><a class="btn" href="./creator-project-dashboard.html">Dashboard</a><a class="btn" href="./creator-project-decisions.html">Decisions</a><a class="btn" href="./creator-project-discussion.html">Discussion</a><a class="btn" href="./creator-project-assets.html">Assets</a></div></div><section class="card"><label>Project</label><select id="pick"></select><div id="hero"></div></section><section class="card"><h2>➕ Create Change Request</h2><div class="grid"><input id="title" maxlength="200" placeholder="What needs to change?"><select id="priority"><option>normal</option><option>low</option><option>high</option><option>urgent</option></select><select id="assigned"><option value="">Unassigned</option></select><input id="due" type="datetime-local"></div><br><select id="decision"><option value="">No decision linked</option></select><br><br><textarea id="description" maxlength="5000" placeholder="Describe the requested revision…"></textarea><br><br><button class="btn primary" id="add">Create Change Request</button><span id="msg" class="muted"></span></section><section class="card"><h2>🔧 Revision Queue</h2><div id="list" class="grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const E=id=>document.getElementById(id);let me,projects=[],channel,profiles={};const nice=s=>String(s||"").replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase());async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_projects").select("id,title,description,status").eq("owner_id",me.id).order("created_at",{ascending:false});projects=r.data||[];E("pick").innerHTML=projects.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join("")||'<option value="">No projects</option>';await render();connect()}async function render(){const p=projects.find(x=>x.id===E("pick").value);if(!p){E("hero").innerHTML="<h1>No project</h1>";E("list").innerHTML="";return}E("hero").innerHTML='<h1>'+esc(p.title)+'</h1><p class="muted">'+esc(p.description||"")+'</p>';const [cr,dec,tm,pr]=await Promise.all([db.from("crowspace_project_change_requests").select("id,title,description,priority,status,assigned_to,due_at,submitted_at,resolved_at,resolution_note,created_at,decision_id").eq("project_id",p.id).order("created_at",{ascending:false}),db.from("crowspace_project_decisions").select("id,title,status").eq("project_id",p.id).order("created_at",{ascending:false}),db.from("crowspace_project_members").select("user_id,role,status").eq("project_id",p.id).in("status",["active","accepted"]),db.from("crowspace_profiles").select("user_id,display_name,username")]);profiles={};(pr.data||[]).forEach(x=>profiles[x.user_id]=x);E("assigned").innerHTML='<option value="">Unassigned</option>'+(tm.data||[]).map(x=>'<option value="'+x.user_id+'">'+esc(profiles[x.user_id]?.display_name||profiles[x.user_id]?.username||"Creator")+' · '+esc(x.role||"Member")+'</option>').join("");E("decision").innerHTML='<option value="">No decision linked</option>'+(dec.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.title)+' · '+nice(x.status)+'</option>').join("");E("list").innerHTML=(cr.data||[]).map(x=>'<article class="box '+esc(x.status)+'"><span class="tag">'+nice(x.status).toUpperCase()+' · '+nice(x.priority).toUpperCase()+'</span><h3>'+esc(x.title)+'</h3><p class="muted">'+esc(x.description||"")+'</p><p>👤 '+esc(profiles[x.assigned_to]?.display_name||profiles[x.assigned_to]?.username||"Unassigned")+'</p><p class="muted">'+(x.due_at?"Due: "+new Date(x.due_at).toLocaleString():"No deadline")+'</p>'+(x.resolution_note?'<p><b>Resolution:</b> '+esc(x.resolution_note)+'</p>':"")+'<div class="actions">'+(x.status!=="approved"&&x.status!=="cancelled"?'<button class="btn primary" onclick="statusChange(\''+x.id+'\',\'in_progress\')">In Progress</button><button class="btn" onclick="submitChange(\''+x.id+'\')">Submit Revision</button><button class="btn" onclick="resolve(\''+x.id+'\',\'approved\')">Approve</button><button class="btn" onclick="resolve(\''+x.id+'\',\'rejected\')">Reject</button>':"")+'<button class="btn" onclick="removeChange(\''+x.id+'\')">Delete</button></div><div id="rev-'+x.id+'"></div></article>').join("")||'<div class="empty">No change requests yet.</div>';for(const x of cr.data||[])await renderRevisions(x.id)}async function renderRevisions(changeId){const r=await db.from("crowspace_project_revisions").select("id,revision_number,summary,asset_url,created_at,created_by").eq("change_request_id",changeId).order("revision_number",{ascending:false});const el=E("rev-"+changeId);if(!el)return;el.innerHTML=(r.data||[]).map(x=>'<div class="muted" style="margin-top:8px"><b>Revision '+x.revision_number+'</b> — '+esc(x.summary)+(x.asset_url?' · <a class="btn" target="_blank" rel="noopener" href="'+esc(x.asset_url)+'">Asset</a>':"")+'<br>'+new Date(x.created_at).toLocaleString()+'</div>').join("")}function connect(){if(channel)db.removeChannel(channel);channel=db.channel("project-changes-"+E("pick").value).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_project_change_requests",filter:"project_id=eq."+E("pick").value},render).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_project_revisions",filter:"project_id=eq."+E("pick").value},render).subscribe()}E("pick").onchange=()=>{render();connect()};E("add").onclick=async()=>{if(!E("pick").value||!E("title").value.trim()){E("msg").textContent="Project and title are required.";return}const data={project_id:E("pick").value,decision_id:E("decision").value||null,created_by:me.id,assigned_to:E("assigned").value||null,title:E("title").value.trim(),description:E("description").value.trim()||null,priority:E("priority").value,due_at:E("due").value?new Date(E("due").value).toISOString():null};const r=await db.from("crowspace_project_change_requests").insert(data);if(r.error){E("msg").textContent=r.error.message;return}await db.from("crowspace_project_activity").insert({project_id:E("pick").value,actor_id:me.id,activity_type:"change_request",message:"Created change request: "+data.title});E("title").value="";E("description").value="";E("due").value="";E("msg").textContent="Change request created.";render()};async function statusChange(id,status){const r=await db.from("crowspace_project_change_requests").update({status,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)alert(r.error.message);else render()}async function submitChange(id){const summary=prompt("Revision summary:");if(!summary?.trim())return;const q=await db.from("crowspace_project_revisions").select("revision_number").eq("change_request_id",id).order("revision_number",{ascending:false}).limit(1);const n=(q.data?.[0]?.revision_number||0)+1;const change=(await db.from("crowspace_project_change_requests").select("project_id,assigned_to,title,created_by").eq("id",id).single()).data;const r=await db.from("crowspace_project_revisions").insert({change_request_id:id,project_id:change.project_id,created_by:me.id,revision_number:n,summary:summary.trim()});if(r.error){alert(r.error.message);return}await db.from("crowspace_project_change_requests").update({status:"submitted",submitted_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq("id",id);await db.from("crowspace_project_activity").insert({project_id:change.project_id,actor_id:me.id,activity_type:"revision",message:"Submitted revision "+n+" for: "+change.title});if(change.created_by!==me.id)await db.from("crowspace_notifications").insert({user_id:change.created_by,type:"project_revision",actor_id:me.id,reference_id:id,message:"A revision was submitted for your change request.",is_read:false});render()}async function resolve(id,status){const note=prompt(status==="approved"?"Approval note (optional):":"Reason for rejection (optional):","");const r=await db.from("crowspace_project_change_requests").update({status,resolved_at:new Date().toISOString(),resolution_note:note||null,updated_at:new Date().toISOString()}).eq("id",id);if(r.error){alert(r.error.message);return}const d=(await db.from("crowspace_project_change_requests").select("project_id,title,created_by").eq("id",id).single()).data;if(d){await db.from("crowspace_project_activity").insert({project_id:d.project_id,actor_id:me.id,activity_type:"change_request",message:"Change request "+nice(status)+": "+d.title});if(d.created_by!==me.id)await db.from("crowspace_notifications").insert({user_id:d.created_by,type:"project_change_request",actor_id:me.id,reference_id:id,message:"Your project change request was "+nice(status)+".",is_read:false})}render()}async function removeChange(id){if(!confirm("Delete this change request and its revisions?"))return;const r=await db.from("crowspace_project_change_requests").delete().eq("id",id);if(r.error)alert(r.error.message);else render()}init();</script><script src="./js/crowspace-holiday-themes.js"></script>
<script src="./js/crowrules-cinematic.js"></script>
</body></html>

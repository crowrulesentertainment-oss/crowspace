<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthdays — CrowSpace</title>
<link rel="stylesheet" href="crowspace-rebuild.css"><link rel="stylesheet" href="crowspace-universal.css">
<script src="crowspace-auth.js"></script><script src="crowspace-universal.js" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=1" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
</head>
<body data-page="birthdays"><main class="cs-page-shell">
<section class="cs-page-hero"><div class="cs-eyebrow">CROWSPACE // COMMUNITY</div><h1>Birthdays</h1><p>Celebrate CrowSpace members and see upcoming birthdays automatically pulled from the CrowRules membership data.</p></section>
<div class="cs-grid">
<section class="cs-card"><h2>🎂 Today</h2><div id="birthday-today"><p class="cs-muted">Loading birthdays…</p></div></section>
<section class="cs-card"><h2>🎉 Coming Up</h2><div id="birthday-upcoming"><p class="cs-muted">Loading upcoming birthdays…</p></div></section>
<section class="cs-card"><h2>👥 All Member Birthdays</h2><div id="birthday-all"><p class="cs-muted">Loading member birthdays…</p></div></section>
</div>
<script>
(function(){
  "use strict";
  const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const todayBox=document.getElementById("birthday-today");
  const upcomingBox=document.getElementById("birthday-upcoming");
  const allBox=document.getElementById("birthday-all");
  const tables=["members","profiles","member_profiles","creator_profiles"];
  const birthdayKeys=["birthday","birth_date","date_of_birth","dob"];
  const nameKeys=["display_name","full_name","name","username"];
  const avatarKeys=["avatar_url","photo_url","profile_photo_url","image_url"];

  function dateValue(row){
    for(const k of birthdayKeys){
      if(row && row[k]) {
        const d=new Date(row[k]+"T00:00:00");
        if(!Number.isNaN(d.getTime())) return d;
      }
    }
    return null;
  }
  function nameValue(row){
    for(const k of nameKeys) if(row && row[k]) return row[k];
    const meta=row?.user_metadata||{};
    return meta.full_name||meta.name||meta.user_name||"CrowSpace Member";
  }
  function avatarValue(row){
    for(const k of avatarKeys) if(row && row[k]) return row[k];
    const meta=row?.user_metadata||{};
    return meta.avatar_url||meta.picture||"";
  }
  function key(row){
    return String(row?.user_id||row?.id||"")+"|"+nameValue(row).toLowerCase()+"|"+(dateValue(row)?.toISOString().slice(5,10)||"");
  }
  function daysUntil(d,now){
    const target=new Date(now.getFullYear(),d.getMonth(),d.getDate());
    target.setHours(0,0,0,0);
    const base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    if(target<base) target.setFullYear(now.getFullYear()+1);
    return Math.round((target-base)/86400000);
  }
  function birthdayCard(row,now){
    const d=dateValue(row), name=nameValue(row), avatar=avatarValue(row);
    const img=avatar?'<img src="'+esc(avatar)+'" alt="" style="width:42px;height:42px;border-radius:50%;object-fit:cover">':'<div style="width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffffff10;font-weight:800">🎂</div>';
    return '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff10">'+img+'<div><strong>'+esc(name)+'</strong><div class="cs-muted">'+d.toLocaleDateString(undefined,{month:"long",day:"numeric"})+(daysUntil(d,now)>0?' · '+daysUntil(d,now)+' day'+(daysUntil(d,now)===1?'':'s'):'')+'</div></div></div>';
  }
  async function load(){
    const auth=window.CrowRulesAuth;
    if(!auth?.ready){setTimeout(load,100);return;}
    await auth.ready;
    const db=auth.client;
    if(!db){todayBox.innerHTML='<p class="cs-muted">CrowRules membership connection is unavailable.</p>';return;}
    const rows=[];
    for(const table of tables){
      try{
        const r=await db.from(table).select("*").limit(1000);
        if(!r.error && Array.isArray(r.data)) rows.push(...r.data);
      }catch(e){}
    }
    const unique=[...new Map(rows.filter(r=>dateValue(r)).map(r=>[key(r),r])).values()];
    const now=new Date(), today=unique.filter(r=>{const d=dateValue(r);return d.getMonth()===now.getMonth()&&d.getDate()===now.getDate();});
    const upcoming=unique.filter(r=>{const n=daysUntil(dateValue(r),now);return n>0&&n<=30;}).sort((a,b)=>daysUntil(dateValue(a),now)-daysUntil(dateValue(b),now));
    const all=[...unique].sort((a,b)=>daysUntil(dateValue(a),now)-daysUntil(dateValue(b),now));
    todayBox.innerHTML=today.length?today.map(r=>birthdayCard(r,now)).join(""):'<p class="cs-muted">No member birthdays today.</p>';
    upcomingBox.innerHTML=upcoming.length?upcoming.map(r=>birthdayCard(r,now)).join(""):'<p class="cs-muted">No birthdays in the next 30 days.</p>';
    allBox.innerHTML=all.length?all.map(r=>birthdayCard(r,now)).join(""):'<p class="cs-muted">No member birthday data found in Supabase.</p>';
  }
  load();
})();
</script></main></body></html>

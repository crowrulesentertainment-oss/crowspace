<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friend Requests — CrowSpace</title><style>body{margin:0;background:#05050b;color:#fff;font:14px Arial}main{max-width:850px;margin:auto;padding:20px}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:20px;margin-bottom:15px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #25293a}.btn{padding:9px 12px;border-radius:9px;border:1px solid #343c56;background:#182033;color:#fff;cursor:pointer}.ok{background:#126d7a}.muted{color:#9da5bd}.person{display:flex;gap:10px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;background:#252a40;display:grid;place-items:center;overflow:hidden;font-weight:bold}.avatar img{width:100%;height:100%;object-fit:cover}a{color:#fff;text-decoration:none}.actions{display:flex;gap:7px;flex-wrap:wrap}</style><link rel="stylesheet" href="./css/crowrules-cinematic.css">
</head><body data-crowrules-division="crowspace"><main><div class="card"><h1>Friend Requests</h1><p class="muted">Manage incoming and outgoing CrowSpace connections.</p><div id="incoming">Loading…</div></div><div class="card"><h2>Sent Requests</h2><div id="outgoing">Loading…</div><p><a class="btn" href="./">← CrowSpace</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const ini=s=>(s||"M").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();let me;async function profiles(ids){if(!ids.length)return {};const r=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids);const m={};(r.data||[]).forEach(x=>m[x.user_id]=x);return m}function card(p,buttons){return '<div class="row"><div class="person"><div class="avatar">'+(p?.avatar_url?'<img src="'+esc(p.avatar_url)+'">':ini(p?.display_name))+'</div><div><a href="./profile.html?u='+encodeURIComponent(p?.username||"")+'"><b>'+esc(p?.display_name||"Member")+'</b></a><div class="muted">@'+esc(p?.username||"member")+'</div></div></div><div class="actions">'+buttons+'</div></div>'}async function load(){const a=await db.from("crowspace_friends").select("requester_id,recipient_id").eq("recipient_id",me.id).eq("status","pending");const amap=await profiles((a.data||[]).map(x=>x.requester_id));incoming.innerHTML=(a.data||[]).map(x=>card(amap[x.requester_id],'<button class="btn ok" onclick="respond(\''+x.requester_id+'\',\'accepted\')">Accept</button><button class="btn" onclick="respond(\''+x.requester_id+'\',\'declined\')">Decline</button>')).join("")||'<p class="muted">No incoming requests.</p>';const o=await db.from("crowspace_friends").select("requester_id,recipient_id").eq("requester_id",me.id).eq("status","pending");const omap=await profiles((o.data||[]).map(x=>x.recipient_id));outgoing.innerHTML=(o.data||[]).map(x=>card(omap[x.recipient_id],'<button class="btn" onclick="cancelReq(\''+x.recipient_id+'\')">Cancel</button>')).join("")||'<p class="muted">No sent requests.</p>'}window.respond=async(id,status)=>{const r=await db.from("crowspace_friends").update({status,updated_at:new Date().toISOString()}).eq("requester_id",id).eq("recipient_id",me.id).eq("status","pending");if(r.error)alert(r.error.message);else load()};window.cancelReq=async(id)=>{const r=await db.from("crowspace_friends").delete().eq("requester_id",me.id).eq("recipient_id",id).eq("status","pending");if(r.error)alert(r.error.message);else load()};(async()=>{me=(await db.auth.getSession()).data.session?.user;if(!me){incoming.textContent="Sign in to manage friend requests.";outgoing.textContent="";return}load()})();</script><script src="./js/crowspace-holiday-themes.js"></script>
<script src="./js/crowrules-cinematic.js"></script>
</body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Email | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"><a href="login.html">Sign In</a></div></header><main class="auth"><div class="auth-card"><a class="brand" href="index.html">◉ CROWSPACE</a><p class="eyebrow">ONE ACCOUNT. ONE UNIVERSE.</p><h1>Email verification</h1><div id="status" class="auth-note"><strong>Checking your verification…</strong><p>Please wait while CrowSpace completes your email confirmation.</p></div><p><a href="login.html">Return to Sign In</a> · <a href="signup.html">Create another account</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script src="js/global-nav.js?v=20260927-4"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const s=document.getElementById("status"),c=window.crowSupabase;if(!c){s.innerHTML="<strong>Verification could not start.</strong><p>Supabase is unavailable.</p>";return}try{const hash=new URLSearchParams(location.hash.replace(/^#/,""));const q=new URLSearchParams(location.search);const err=hash.get("error_description")||q.get("error_description");if(err){s.innerHTML="<strong>Verification link could not be completed.</strong><p>"+CS.escape(decodeURIComponent(err).replace(/\\+/g," "))+"</p>";return}const {data}=await c.auth.getSession();if(data.session?.user){localStorage.removeItem("crowspace_pending_verification_email");s.innerHTML="<strong>Email verified!</strong><p>Your CrowSpace account is confirmed. Taking you to your Nest…</p>";setTimeout(()=>location.href="profile.html",900)}else{s.innerHTML="<strong>Check your email.</strong><p>If you clicked the confirmation

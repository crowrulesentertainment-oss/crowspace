<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Analytics — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/navigation.js"></script><style>.hero{padding:46px 0 25px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{padding:20px}.stat b{font-size:30px;display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.panel{padding:22px}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.bar{height:9px;border-radius:99px;background:linear-gradient(90deg,#8cf7ff,#7d5cff)}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div id="app"><header class="topbar"></header><main><section class="hero"><span class="eyebrow">CREATOR INSIGHTS</span><h1>Your <em>Universe.</em></h1><p class="lead">A single view of how your collections are being discovered.</p></section><section class="stats"><article class="panel stat"><span class="eyebrow">COLLECTIONS</span><b id="collections">0</b></article><article class="panel stat"><span class="eyebrow">VIEWS</span><b id="views">0</b></article><article class="panel stat"><span class="eyebrow">SHARES</span><b id="shares">0</b></article><article class="panel stat"><span class="eyebrow">SAVES</span><b id="saves">0</b></article><article class="panel stat"><span class="eyebrow">DISCOVERY</span><b id="score">0</b></article></section><div class="grid"><section class="panel"><span class="eyebrow">TOP COLLECTIONS</span><h2>Performance</h2><div id="ranking"></div></section><section class="panel"><span class="eyebrow">RECENT ACTIVITY</span><h2>Last 14 Days</h2><div id="recent"></div></section></div></main></div><script>
document.addEventListener("DOMContentLoaded",async()=>{const cfg=window.CROW_CONFIG||{};if(!cfg.supabaseUrl)return;const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey),{data:{user}}=await sb.auth.getUser();if(!user){document.querySelector("main").innerHTML='<section class="panel empty"><h2>Sign in to view creator analytics</h2><a class="primary" href="login.html">Sign In</a></section>';return}const {data:cols,error}=await sb.from("crowspace_saved_collections").select("id,name,discovery_score,visibility").eq("user_id",user.id);if(error){document.querySelector("main").innerHTML='<section class="panel empty">Analytics could not be loaded.</section>';return}const ids=(cols||[]).map(c=>c.id);document.getElementById("collections").textContent=ids.length;document.getElementById("score").textContent=(cols||[]).reduce((a,c)=>a+Number(c.discovery_score||0),0).toFixed(1);if(!ids.length){document.getElementById("ranking").innerHTML='<div class="empty">Create a collection to start measuring discovery.</div>';return}const {data:events}=await sb.from("crowspace_collection_events").select("collection_id,event_type,created_at").in("collection_id",ids).order("created_at",{ascending:false});const ev=events||[];const count=t=>ev.filter(e=>e.event_type===t).length;document.getElementById("views").textContent=count("view");document.getElementById("shares").textContent=count("share");document.getElementById("saves").textContent=count("save");const perf=cols.map(c=>{const e=ev.filter(x=>x.collection_id===c.id);return {...c,views:e.filter(x=>x.event_type==="view").length,shares:e.filter(x=>x.event_type==="share").length,saves:e.filter(x=>x.event_type==="save").length}}).sort((a,b)=>(b.views+b.shares*3+b.saves*2)-(a.views+a.shares*3+a.saves*2));document.getElementById("ranking").innerHTML=perf.slice(0,8).map((c,i)=>'<div class="row"><div><strong>'+String(c.name).replace(/[&<>"]/g,"")+'</strong><div class="muted">'+c.views+' views · '+c.shares+' shares · '+c.saves+' saves</div></div><strong>#'+(i+1)+'</strong></div>').join("");const cut=Date.now()-14*86400000,recent=ev.filter(e=>new Date(e.created_at).getTime()>=cut);const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(13-i));const k=d.toISOString().slice(0,10);return [k,recent.filter(e=>e.created_at.slice(0,10)===k).length]});document.getElementById("recent").innerHTML=days.map(d=>'<div class="row"><span>'+d[0]+'</span><strong>'+d[1]+'</strong></div>').join("")});
</script></body></html>

name: CrowRules Universal Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crowrules-universal-navigation
  cancel-in-progress: true

jobs:
  inject-universal-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate CrowRules / Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_URL='https://cevylpnoexugwgygvtgu.supabase.co'
          NAV_URL='https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=4'

          test -n "$SUPABASE_URL"
          test "${SUPABASE_URL#https://}" != "$SUPABASE_URL"

          # /rest/v1/ is not a reliable health endpoint for Supabase and can
          # return 401 even when the project is healthy. Validate the public
          # Auth health endpoint instead; application pages use their own
          # publishable/anon key when talking to PostgREST.
          curl -fsS --max-time 15 "$SUPABASE_URL/auth/v1/health" -o /dev/null
          curl -fsS --max-time 15 "$NAV_URL" -o /dev/null

          echo "Supabase health endpoint and universal navigation asset are reachable."

      - name: Sync Universal CrowRules navigation
        shell: bash
        run: |
          set -euo pipefail
          export NAV_URL='https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=4'
          python3 <<'PY'
          from pathlib import Path
          import re

          nav = '<script src="' + __import__('os').environ['NAV_URL'] + '" defer></script>'
          changed = []

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              text = re.sub(
                  r'\s*<script\b[^>]*src=["\'][^"\']*crowrules-sitewide\.js[^"\']*["\'][^>]*>\s*</script>',
                  '',
                  text,
                  flags=re.I
              )

              if re.search(r'</head>', text, flags=re.I):
                  text = re.sub(r'</head>', nav + '\n</head>', text, count=1, flags=re.I)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f"Updated {len(changed)} HTML files.")
          for item in changed:
              print(" -", item)
          PY

      - name: Validate generated HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --version
          git diff --check
          node --check crowspace-auth.js
          node --check crowspace-universal.js
          node --check crowspace-rebuild.js
          python3 <<'PY'
          from pathlib import Path
          import sys

          failures = []
          canonical = 'https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=4'

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue

              text = path.read_text(encoding='utf-8')
              refs = [
                  line.strip()
                  for line in text.splitlines()
                  if '<script' in line.lower() and 'crowrules-sitewide.js' in line.lower()
              ]

              if refs != [f'<script src="{canonical}" defer></script>']:
                  failures.append(
                      f"{path}: expected exactly one canonical sitewide script, found {refs}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("HTML navigation and JavaScript validation passed.")
          PY

      - name: Commit navigation changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CrowRules Universal Navigation'
          git config user.email 'crowrulesentertainment@gmail.com'
          git add --all -- '*.html'

          if git diff --cached --quiet; then
            echo "No navigation changes required."
            exit 0
          fi

          git commit -m 'Sync universal CrowRules navigation'
          git push origin HEAD:main

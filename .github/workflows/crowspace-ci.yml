name: CrowSpace CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - crowspace-3.0-rebuild
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crowspace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript, HTML assets, and migrations
        run: node scripts/qa/validate.mjs

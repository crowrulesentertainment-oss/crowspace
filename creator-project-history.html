<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Production History 7.6 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1150px;margin:auto;padding:18px}.top,.actions,.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.muted{color:var(--m)}select,input{background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px;padding:10px}.event{padding:14px 0;border-bottom:1px solid #292e42}.tag{font-size:10px;color:#8ff6ff;letter-spacing:.12em;font-weight:800}.time{color:var(--m);font-size:12px}.empty{text-align:center;padding:25px;color:var(--m)}.live{color:#8ff6ff;font-weight:800}</style></head><body><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Production History 7.6</span></div><div class="actions"><a class="btn" href="./creator-project-dashboard.html">Dashboard</a><a class="btn" href="./creator-project-discussion.html">Discussion</a><a class="btn" href="./creator-project-decisions.html">Decisions</a><a class="btn" href="./creator-project-changes.html">Revisions</a></div></div><section class="card"><label>Project</label><select id="pick"></select><div id="hero"></div><div id="live" class="live">● Connecting…</div></section><section class="card"><div class="filters"><input id="search" placeholder="Search history…"><select id="type"><option value="">All activity</option><option value="task">Tasks</option><option value="milestone">Milestones</option><option value="discussion">Discussion</option><option value="decision">Decisions</option><option value="change_request">Change Requests</option><option value="revision">Revisions</option><option value="asset">Assets</option><option value="team">Team</option></select><select id="range"><option value="all">All time</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last year</option></select></div></section><section class="card"><h2>📜 Production Timeline</h2><div id="list"><div class="empty">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const E=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let me,projects=[],channel;async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const r=await db.from("crowspace_projects").select("id,title,description,status").eq("owner_id",me.id).order("created_at",{ascending:false});projects=r.data||[];E("pick").innerHTML=projects.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join("")||'<option value="">No projects</option>';await render();connect()}async function render(){const p=projects.find(x=>x.id===E("pick").value);if(!p){E("hero").innerHTML="<h1>No project</h1>";E("list").innerHTML="";return}E("hero").innerHTML='<h1>'+esc(p.title)+'</h1><p class="muted">'+esc(p.description||"")+' · '+esc(p.status||"")+'</p>';const since=E("range").value==="all"?null:new Date(Date.now()-Number(E("range").value)*86400000).toISOString();const q=db.from("crowspace_project_activity").select("id,actor_id,activity_type,message,created_at").eq("project_id",p.id).order("created_at",{ascending:false}).limit(500);if(since)q.gte("created_at",since);const r=await q;let rows=r.data||[];const wanted=E("type").value,needle=E("search").value.trim().toLowerCase();if(wanted)rows=rows.filter(x=>x.activity_type===wanted);if(needle)rows=rows.filter(x=>(x.message||"").toLowerCase().includes(needle)||x.activity_type.toLowerCase().includes(needle));const ids=[...new Set(rows.map(x=>x.actor_id).filter(Boolean))];let names={};if(ids.length){const pr=await db.from("crowspace_profiles").select("user_id,display_name,username").in("user_id",ids);(pr.data||[]).forEach(x=>names[x.user_id]=x)}E("list").innerHTML=rows.map(x=>'<article class="event"><div class="tag">'+esc(x.activity_type.replaceAll("_"," ").toUpperCase())+'</div><strong>'+esc(names[x.actor_id]?.display_name||names[x.actor_id]?.username||"CrowSpace Creator")+'</strong><p>'+esc(x.message||"Project activity")+'</p><div class="time">'+new Date(x.created_at).toLocaleString()+'</div></article>').join("")||'<div class="empty">No matching production history.</div>'}function connect(){if(channel)db.removeChannel(channel);channel=db.channel("project-history-76-"+E("pick").value).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_project_activity",filter:"project_id=eq."+E("pick").value},()=>render()).subscribe(s=>E("live").textContent=s==="SUBSCRIBED"?"● LIVE — Production history updates automatically":"● "+s)}E("pick").onchange=()=>{render();connect()};["search","type","range"].forEach(id=>E(id).addEventListener("input",render));init();</script></body></html>

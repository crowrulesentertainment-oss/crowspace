<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Community 5.0 — CrowSpace</title><style>:root{--a:#20e6ff;--p:#0d0f18;--p2:#151827;--m:#9da5bd}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.top,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.accent{color:#8ff6ff}.card{background:var(--p);border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.btn{padding:10px 13px;border:1px solid #363c55;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#031014;border:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.creator{background:var(--p2);border:1px solid #292e42;border-radius:15px;padding:15px}.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#202438}.row{display:flex;gap:12px;align-items:center}.muted{color:var(--m)}.tag{font-size:10px;color:#8ff6ff;letter-spacing:.1em;font-weight:800}.empty{text-align:center;padding:28px;color:var(--m)}input{width:100%;box-sizing:border-box;background:#171a29;color:#fff;border:1px solid #363c55;border-radius:10px;padding:11px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){main{padding:9px}.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">🌌 CrowSpace <span class="accent">Creator Community 5.0</span></div><a class="btn" href="./creator-dashboard.html">← Command Center</a></div><section class="card"><h1>🤝 Creator Network</h1><p class="muted">Discover people building across the CrowRules Universe, follow creators, and find potential collaborators.</p><input id="search" placeholder="Search creators by name, username, bio, or location…"></section><section class="card"><div class="actions"><a class="btn primary" href="./creators.html">Following</a><a class="btn" href="./search.html">Member Directory</a><a class="btn" href="./creator-dashboard.html">Dashboard</a></div></section><section class="card"><h2>✨ Suggested Creators</h2><div id="suggestions" class="grid"><div class="empty">Loading…</div></div></section><section class="card"><h2>🔗 Mutual Connections</h2><div id="mutual" class="grid"><div class="empty">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me,all=[],following=new Set(),followerSet=new Set();const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function card(p,mutual=false){const followed=following.has(p.user_id);const av=p.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'" alt="">':'<div class="avatar">👤</div>';return '<article class="creator"><div class="row">'+av+'<div><span class="tag">CREATOR</span><h3 style="margin:4px 0">'+esc(p.display_name||p.username||"Creator")+'</h3><div class="muted">@'+esc(p.username||"member")+(mutual?" · Mutual connection":"")+'</div></div></div><p class="muted">'+esc(p.bio||"Building in the CrowRules Universe.")+'</p><div class="actions"><a class="btn" href="./profile.html?u='+encodeURIComponent(p.username||"")+'">View Profile</a><button class="btn '+(!followed?"primary":"")+'" onclick="toggleFollow(\''+p.user_id+'\')">'+(followed?"Following":"Follow")+'</button></div></article>'}async function toggleFollow(id){if(following.has(id)){await db.from("crowspace_follows").delete().eq("follower_id",me.id).eq("following_id",id);following.delete(id)}else{const r=await db.from("crowspace_follows").insert({follower_id:me.id,following_id:id});if(!r.error)following.add(id)}render()}function render(){const q=search.value.toLowerCase();const matches=all.filter(p=>p.user_id!==me.id&&[p.display_name,p.username,p.bio,p.location].join(" ").toLowerCase().includes(q));const suggested=matches.filter(p=>!following.has(p.user_id)).slice(0,12);suggestions.innerHTML=suggested.map(p=>card(p)).join("")||'<div class="empty">No new creator suggestions match your search.</div>';const mutuals=matches.filter(p=>followerSet.has(p.user_id)&&following.has(p.user_id)).slice(0,9);mutual.innerHTML=mutuals.map(p=>card(p,true)).join("")||'<div class="empty">Mutual connections will appear as your creator network grows.</div>'}async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){location.href="../login.html";return}const [prof,fo,fr]=await Promise.all([db.from("crowspace_profiles").select("user_id,username,display_name,bio,avatar_url,location").eq("is_public",true).order("display_name").limit(200),db.from("crowspace_follows").select("following_id").eq("follower_id",me.id),db.from("crowspace_follows").select("follower_id").eq("following_id",me.id)]);all=prof.data||[];following=new Set((fo.data||[]).map(x=>x.following_id));followerSet=new Set((fr.data||[]).map(x=>x.follower_id));render()}search.oninput=render;init();</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Messages</title><style>body{margin:0;background:#05050b;color:#fff;font:14px Arial}main{max-width:900px;margin:25px auto;padding:15px}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:20px;margin-bottom:15px}.thread{padding:14px;border-bottom:1px solid #25293a}.muted{color:#9da5bd}input,textarea{width:100%;box-sizing:border-box;padding:12px;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px;margin:6px 0}button{padding:11px 15px;border:0;border-radius:10px;background:#183f52;color:#fff}</style></head><body><main><div class="card"><h1>💬 CrowSpace Messages</h1><div id="target"></div><div id="presence" class="muted"></div><textarea id="text" placeholder="Write a message..."></textarea><button id="send">Send Message</button></div><div class="card"><h2>Recent Messages</h2><div id="list">Loading...</div><a href="./">← CrowSpace</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me,to;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){list.textContent="Sign in to use messages.";return}to=new URLSearchParams(location.search).get("to");target.innerHTML=to?'<p class="muted">Messaging member: '+esc(to)+'</p>': '<p class="muted">Choose a member from their profile to start a conversation.</p>';load();markRead();startLive()}
let liveChannel;
async function markRead(){if(!to)return;await db.from("crowspace_messages").update({is_read:true}).eq("recipient_id",me.id).eq("sender_id",to).eq("is_read",false)}
function startLive(){if(!to)return;liveChannel=db.channel("crowspace-dm-"+[me.id,to].sort().join("-")).on("postgres_changes",{event:"INSERT",schema:"public",table:"crowspace_messages",filter:"recipient_id=eq."+me.id},payload=>{if(payload.new.sender_id===to){load();markRead()}}).subscribe()}
async function load(){const r=await db.from("crowspace_messages").select("*").or("sender_id.eq."+me.id+",recipient_id.eq."+me.id).order("created_at",{ascending:false}).limit(30);if(r.error){list.textContent="Messages are unavailable.";return}list.innerHTML=(r.data||[]).map(x=>'<div class="thread"><b>'+ (x.sender_id===me.id?"You":"CrowSpace Member")+'</b><div>'+esc(x.content)+'</div><small class="muted">'+new Date(x.created_at).toLocaleString()+'</small></div>').join("")||'<span class="muted">No messages yet.</span>'}
send.onclick=async()=>{if(!to)return alert("Open a member profile and choose Message.");const v=text.value.trim();if(!v)return;const r=await db.from("crowspace_messages").insert({sender_id:me.id,recipient_id:to,content:v,is_read:false});if(r.error)alert(r.error.message);else{text.value="";load()}};init();
</script></body></html>

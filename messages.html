<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace — Messages</title><link rel="stylesheet" href="style.css"></head><body><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><header class="topbar"><a class="brand" href="home.html"><span class="brand-mark">◉</span><span>CROW<span>SPACE</span></span></a><div class="search"><span>⌕</span><input placeholder="Search messages"></div><nav class="top-actions"><button>🔔</button><button>✉</button><a class="avatar" href="profile.html">JR</a></nav></header><div class="shell"><aside class="sidebar"><a class="nav" href="home.html"><span>⌂</span> Home</a><a class="nav" href="explore.html"><span>⌕</span> Explore</a><a class="nav" href="caws.html"><span>▶</span> Caws</a><a class="nav" href="circles.html"><span>◈</span> Circles</a><a class="nav" href="notifications.html"><span>♢</span> Notifications</a><a class="nav active" href="messages.html"><span>✉</span> Messages</a><a class="nav" href="profile.html"><span>●</span> Profile</a></aside><main class="feed"><section class="hero"><div><div class="eyebrow">MESSAGES // PRIVATE</div><h1>Talk to your<br><em>people.</em></h1><p>Your private conversations use the same Universal CrowRules identity.</p></div><div class="hero-orbit">✉</div></section><section id="messageList" class="message-list"><div class="message card">Loading conversations…</div></section></main></div><script src="crowspace-core.js"></script><script src="crowspace-social.js"></script><script>
(async()=>{const list=document.getElementById("messageList");try{const rows=await CrowSpaceSocial.loadConversations();list.innerHTML=rows.length?rows.map(c=>{const x=c.latest,p=x?.profile||{},name=p.display_name||p.username||c.title||"Conversation";return '<article class="message card"><div class="avatar">'+CrowSpaceSocial.esc(name.slice(0,2).toUpperCase())+'</div><div><b>'+CrowSpaceSocial.esc(name)+'</b><small>'+new Date(c.created_at).toLocaleString()+'</small><p>'+CrowSpaceSocial.esc(x?.body||"No messages yet.")+'</p></div></article>'}).join(""):'<div class="message card"><div><b>No conversations yet.</b><p>When you start a CrowSpace conversation, it will appear here.</p></div></div>'}catch(e){list.innerHTML='<div class="message card"><div><b>Sign in to use messages.</b><p>Your conversations are private to your CrowRules account.</p></div></div>'}})();</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrowSpace Messages 2.0</title>
<style>
:root{--a:#20e6ff}*{box-sizing:border-box}body{margin:0;background:#05050b;color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.brand{font-size:25px;font-weight:900}.pill{color:#8ff6ff}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:18px;margin-bottom:15px}.layout{display:grid;grid-template-columns:310px 1fr;gap:15px}.search input,input,textarea{width:100%;box-sizing:border-box;padding:11px;background:#080a12;color:#fff;border:1px solid #292e42;border-radius:10px}.search{display:flex;gap:8px}.btn,a.btn{display:inline-block;padding:10px 13px;border:1px solid #343c56;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(90deg,#126d7a,#56358c)!important;border:0!important}.list{max-height:65vh;overflow:auto}.conversation{display:flex;gap:10px;padding:11px;border-bottom:1px solid #25293a;cursor:pointer;border-radius:10px}.conversation.active{background:#111b2b;outline:1px solid #263b55}.avatar{width:44px;height:44px;border-radius:50%;background:#252a40;display:grid;place-items:center;overflow:hidden;font-weight:bold;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.convmain{min-width:0;flex:1}.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.online{color:#80ffb0;font-size:11px}.unread{background:#18243a;border-radius:20px;padding:2px 6px;font-size:10px}.chat{display:flex;flex-direction:column;min-height:65vh}.chatHead{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid #292e42}.chatHead h2{margin:0}.messages{flex:1;overflow:auto;padding:14px 2px}.bubbleRow{display:flex;margin:7px 0}.bubbleRow.mine{justify-content:flex-end}.bubble{max-width:75%;padding:10px 13px;border-radius:15px;background:#151a2a;border:1px solid #2a3348}.mine .bubble{background:#173d49}.time{font-size:10px;color:#9da5bd;margin-top:4px}.composer{display:flex;gap:8px;align-items:end;border-top:1px solid #292e42;padding-top:12px}.composer textarea{min-height:48px;max-height:140px;resize:vertical}.typing{height:18px;color:#9da5bd;font-size:12px}.empty{text-align:center;padding:30px;color:#9da5bd}.toast{position:fixed;right:20px;bottom:20px;background:#111827;border:1px solid #405078;padding:14px 18px;border-radius:12px;z-index:99}@media(max-width:800px){.layout{grid-template-columns:1fr}.list{max-height:35vh}.chat{min-height:55vh}}@media(max-width:500px){main{padding:10px}.top{align-items:flex-start;flex-direction:column}.bubble{max-width:88%}}
</style></head><body><main>
<div class="top"><div class="brand">🖤 CrowSpace <span class="pill">Messages 2.0</span></div><a class="btn" href="./">← CrowSpace</a></div>
<div id="auth" class="card">Loading…</div>
<div id="app" class="layout" style="display:none">
<section class="card"><h2>💬 Conversations</h2><div class="search"><input id="search" placeholder="Search conversations…"></div><div id="conversationList" class="list" style="margin-top:10px"></div></section>
<section class="card chat"><div id="chatHead" class="chatHead"><div class="avatar">💬</div><div><h2>Select a conversation</h2><div class="muted">Choose a member to start messaging.</div></div></div><div id="messages" class="messages"><div class="empty">Your conversations will appear here.</div></div><div id="typing" class="typing"></div><div class="composer"><textarea id="text" placeholder="Write a message…" disabled></textarea><button id="send" class="btn primary" disabled>Send</button></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me=null,profiles={},conversations=[],activeId=null,live=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const ini=s=>(s||"Member").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
async function init(){me=(await db.auth.getSession()).data.session?.user;if(!me){auth.textContent="Sign in to use CrowSpace Messages.";return}auth.innerHTML='<span class="pill">● Signed in</span>';app.style.display="grid";await loadConversations();startRealtime();const target=new URLSearchParams(location.search).get("u");if(target){const p=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").eq("username",target).maybeSingle();if(p.data)selectConversation(p.data.user_id)}}
async function loadConversations(){
 const r=await db.from("crowspace_messages").select("id,sender_id,recipient_id,content,is_read,created_at").or("sender_id.eq."+me.id+",recipient_id.eq."+me.id).order("created_at",{ascending:false}).limit(500);if(r.error)return;
 const rows=r.data||[], ids=[...new Set(rows.flatMap(x=>[x.sender_id,x.recipient_id]).filter(x=>x!==me.id))];profiles={};if(ids.length){const p=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids);(p.data||[]).forEach(x=>profiles[x.user_id]=x)}
 const map={};rows.forEach(x=>{const other=x.sender_id===me.id?x.recipient_id:x.sender_id;if(!map[other])map[other]={otherId:other,last:x,unread:0};if(x.recipient_id===me.id&&!x.is_read)map[other].unread++});conversations=Object.values(map).sort((a,b)=>new Date(b.last.created_at)-new Date(a.last.created_at));renderConversations()
}
function renderConversations(){const term=search.value.trim().toLowerCase();const rows=conversations.filter(c=>{const p=profiles[c.otherId]||{};return !term||[p.display_name,p.username,c.last.content].some(v=>String(v||"").toLowerCase().includes(term))});if(!rows.length){conversationList.innerHTML='<div class="empty">No conversations yet.</div>';return}conversationList.innerHTML=rows.map(c=>{const p=profiles[c.otherId]||{};return '<div class="conversation '+(activeId===c.otherId?"active":"")+'" onclick="selectConversation(\''+c.otherId+'\')"><div class="avatar">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'">':ini(p.display_name))+'</div><div class="convmain"><b>'+esc(p.display_name||"CrowSpace Member")+'</b><div class="muted">@'+esc(p.username||"member")+'</div><div class="truncate muted">'+esc(c.last.content)+'</div></div>'+(c.unread?'<span class="unread">'+c.unread+'</span>':"")+'</div>'}).join("")}
async function selectConversation(id){if(!id||id===me.id)return;activeId=id;let p=profiles[id];if(!p){const r=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").eq("user_id",id).maybeSingle();p=r.data||{};profiles[id]=p}chatHead.innerHTML='<div class="avatar">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'">':ini(p.display_name))+'</div><div><h2>'+esc(p.display_name||"CrowSpace Member")+'</h2><div class="muted">@'+esc(p.username||"member")+' · <span id="presenceStatus">Checking…</span></div></div>';text.disabled=false;send.disabled=false;await loadChat();await db.from("crowspace_messages").update({is_read:true}).eq("sender_id",id).eq("recipient_id",me.id).eq("is_read",false);await loadConversations();presenceFor(id)}
async function loadChat(){const r=await db.from("crowspace_messages").select("id,sender_id,recipient_id,content,is_read,created_at").or("sender_id.eq."+me.id+",recipient_id.eq."+me.id).order("created_at",{ascending:true}).limit(300);if(r.error)return;const rows=(r.data||[]).filter(x=>(x.sender_id===me.id&&x.recipient_id===activeId)||(x.sender_id===activeId&&x.recipient_id===me.id));messages.innerHTML=rows.map(x=>'<div class="bubbleRow '+(x.sender_id===me.id?"mine":"")+'"><div class="bubble">'+esc(x.content)+'<div class="time">'+new Date(x.created_at).toLocaleString()+'</div></div></div>').join("")||'<div class="empty">No messages yet. Say hello!</div>';messages.scrollTop=messages.scrollHeight}
async function sendMessage(){if(!activeId)return;const v=text.value.trim();if(!v)return;send.disabled=true;const r=await db.from("crowspace_messages").insert({sender_id:me.id,recipient_id:activeId,content:v,is_read:false});send.disabled=false;if(r.error){toast(r.error.message);return}text.value="";await loadChat();await loadConversations()}
send.onclick=sendMessage;text.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});search.oninput=renderConversations;
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent="💬 "+msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4000)}
function startRealtime(){live=db.channel("crowspace-messages-"+me.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"crowspace_messages",filter:"recipient_id=eq."+me.id},async p=>{if(p.new.sender_id===activeId){await loadChat();await db.from("crowspace_messages").update({is_read:true}).eq("id",p.new.id)}else toast("New message");await loadConversations()}).on("postgres_changes",{event:"UPDATE",schema:"public",table:"crowspace_messages",filter:"recipient_id=eq."+me.id},loadConversations).subscribe()}
let presence;
function presenceFor(id){if(presence){db.removeChannel(presence);presence=null}presence=db.channel("crowspace-dm-presence-"+[me.id,id].sort().join("-"),{config:{presence:{key:me.id}}}).on("presence",{event:"sync"},()=>{const state=presence.presenceState();const online=Object.values(state).flat().some(x=>x.userId===id);const el=document.getElementById("presenceStatus");if(el)el.textContent=online?"🟢 Online":"Offline"}).subscribe(async s=>{if(s==="SUBSCRIBED")await presence.track({userId:me.id,onlineAt:new Date().toISOString()})})}
init();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Group | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">BUILD YOUR COMMUNITY</p><h1>Create a Group</h1><p class="muted">Start a MySpace-style community inside CrowSpace.</p></div><a class="btn" href="groups.html">Back to Groups</a></div><section class="card"><form id="groupForm"><label>Group name<input id="name" maxlength="120" required></label><label>Description<textarea id="description" maxlength="3000"></textarea></label><button class="btn primary">Create Group</button><p id="msg" class="muted"></p></form></section></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{await CS.refreshHeader();groupForm.onsubmit=async e=>{e.preventDefault();const u=await CS.user();if(!u){location.href="login.html";return}const {error}=await crowSupabase.from("crowspace_groups").insert({created_by:u.id,name:name.value.trim(),description:description.value.trim()||null});msg.textContent=error?error.message:"Group created!";if(!error)setTimeout(()=>location.href="groups.html",600)}});</script></body></html>

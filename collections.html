<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collections — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/navigation.js"></script>
<style>
body{overflow-x:hidden}.collections-hero{padding:48px 0 28px}.collections-hero h1{margin:.2em 0}.collections-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.collection-card{position:relative;overflow:hidden;padding:22px;min-height:170px;background:linear-gradient(145deg,var(--panel),var(--panel2))}.collection-card:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-80px;top:-90px;background:radial-gradient(circle,#8cf7ff20,transparent 68%);animation:collectionGlow 5s ease-in-out infinite}.collection-card h3{position:relative;margin:8px 0}.collection-card .count{font-size:12px;color:var(--muted)}.collection-cover{height:80px;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--bg)}.collection-cover img{width:100%;height:100%;object-fit:cover}.collection-cover .placeholder{display:grid;place-items:center;font-size:24px}.collection-open{margin-top:14px}.collection-view{display:none}.collection-view.active{display:block}.collection-items{display:grid;gap:14px}.collection-back{margin-bottom:14px}.collection-detail-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.collection-detail-head .orb{width:72px;height:72px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:28px}.collection-item{padding:18px}.collection-item img,.collection-item video{width:100%;max-height:480px;object-fit:contain;background:#000;border-radius:12px;margin-top:10px}.collection-item p{white-space:pre-wrap;line-height:1.55}.collection-cover{width:100%;height:180px;object-fit:cover;border-radius:14px;margin-bottom:14px;display:block}.collection-cover-fallback{height:180px;border-radius:14px;margin-bottom:14px;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,#101522,#24112c)}.collection-edit-modal{position:fixed;inset:0;z-index:1000;background:#000b;display:grid;place-items:center;padding:18px}.collection-edit-modal[hidden]{display:none}.collection-edit-card{width:min(560px,100%);padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.collection-edit-card input,.collection-edit-card textarea,.collection-edit-card select{width:100%;margin:7px 0 14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:inherit}.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.theme-grid button{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:inherit}.empty{padding:50px;text-align:center;color:var(--muted)}@keyframes collectionGlow{50%{transform:scale(1.2);opacity:.7}}@media(max-width:650px){.collections-hero{padding-top:28px}}
</style></head><body><div id="app"><header class="topbar"></header><main>
<section class="collections-hero"><span class="eyebrow">YOUR PERSONAL ARCHIVE</span><h1>Collections <em>of Caws.</em></h1><p class="lead">Curate the things worth keeping, your way.</p></section>
<section id="directory" class="panel"><div class="section-head"><div><span class="eyebrow">LIBRARY</span><h2>Your Collections</h2></div><a href="saved.html">Saved Library →</a></div><div id="grid" class="collections-grid"><div class="empty">Loading collections…</div></div></section>
<section id="view" class="panel collection-view"><div class="collection-back"><button id="back" class="secondary">← All Collections</button></div><div id="detail"></div><div id="editModal" class="collection-edit-modal" hidden></div></section>
</main></div>
<script>
document.addEventListener("DOMContentLoaded",async()=>{
 const {supabaseUrl,supabaseKey}=window.CROW_CONFIG||{};const grid=document.getElementById("grid");
 if(!supabaseUrl){grid.innerHTML='<div class="empty">CrowSpace is still initializing.</div>';return}
 const sb=supabase.createClient(supabaseUrl,supabaseKey);const {data:{user}}=await sb.auth.getUser();
 if(!user){grid.innerHTML='<div class="empty"><h3>Sign in to view your collections</h3><a class="primary" href="login.html">Sign In</a></div>';return}
 const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 let cols=[],items=[],profiles=new Map();
 async function load(){const [{data:c},{data:i}]=await Promise.all([
  sb.from("crowspace_saved_collections").select("id,name,description,cover_url,theme,created_at,visibility").eq("user_id",user.id).order("created_at",{ascending:true}),
  sb.from("crowspace_saved_collection_items").select("collection_id,target_type,target_id,created_at").eq("user_id",user.id)
 ]);cols=c||[];items=i||[];const ids=[...new Set(items.map(x=>x.target_id))];const {data:p}=ids.length?await sb.from("crowspace_posts").select("id,user_id,body,media_url,created_at,title").in("id",ids):{data:[]};const map=new Map((p||[]).map(x=>[x.id,{...x,kind:"post"}]));
 const commIds=items.filter(x=>x.target_type==="community_post").map(x=>x.target_id);const [{data:cp},{data:gp}]=await Promise.all([
  commIds.length?sb.from("crowspace_circle_posts").select("id,user_id,body,media_url,created_at,title").in("id",commIds):Promise.resolve({data:[]}),
  commIds.length?sb.from("crowspace_group_posts").select("id,user_id,body,media_url,created_at,title").in("id",commIds):Promise.resolve({data:[]})
 ]);(cp||[]).forEach(x=>map.set(x.id,{...x,kind:"community_post"}));(gp||[]).forEach(x=>{if(!map.has(x.id))map.set(x.id,{...x,kind:"community_post"})});
 items=items.map(x=>({...x,post:map.get(x.target_id)})).filter(x=>x.post);const uids=[...new Set(items.map(x=>x.post.user_id))];const {data:pr}=uids.length?await sb.from("crowspace_profiles").select("user_id,display_name,username,avatar_url").in("user_id",uids):{data:[]};profiles=new Map((pr||[]).map(x=>[x.user_id,x]));renderDirectory()}
 function cover(col){const xs=items.filter(x=>x.collection_id===col.id).slice(0,3);return '<div class="collection-cover">'+[0,1,2].map(i=>{const p=xs[i]?.post;if(!p)return '<div class="placeholder">𓅃</div>';return p.media_url?'<img src="'+esc(p.media_url)+'" alt="">':'<div class="placeholder">🐦</div>'}).join("")+'</div>'}
 function collectionCover(c){return c.cover_url?'<img class="collection-cover" src="'+esc(c.cover_url)+'" alt="">':'<div class="collection-cover-fallback">◈</div>'}
function renderDirectory(){grid.innerHTML=cols.length?cols.map(c=>{const n=items.filter(x=>x.collection_id===c.id).length;return '<article class="feed-card collection-card">'+cover(c)+'<h3>'+esc(c.name)+'</h3><div class="count">'+n+' saved item'+(n===1?'':'s')+'</div><div class="count">'+esc(c.description||"")+'</div><button class="primary collection-open" data-id="'+c.id+'">Open Collection →</button></article>'}).join(""):'<div class="empty"><h3>No collections yet</h3><p>Create one from your Saved Library.</p><a class="secondary" href="saved.html">Go to Saved Library</a></div>';grid.querySelectorAll(".collection-open").forEach(b=>b.onclick=()=>openCollection(b.dataset.id));grid.querySelectorAll(".collection-share").forEach(b=>b.onclick=()=>shareCollection(b.dataset.id))}
 async function shareCollection(id){const col=cols.find(x=>x.id===id);if(!col)return;const url=location.origin+location.pathname.replace("collections.html","public-collection.html")+"?collection="+encodeURIComponent(col.id);try{if(navigator.share)await navigator.share({title:col.name+" — CrowSpace",text:"View my CrowSpace collection",url});else{await navigator.clipboard.writeText(url);alert("Collection link copied.")}}catch(e){}}\n function openCollection(id){const c=cols.find(x=>x.id===id);if(!c)return;document.getElementById("directory").style.display="none";const view=document.getElementById("view");view.classList.add("active");const xs=items.filter(x=>x.collection_id===id);document.getElementById("detail").innerHTML='<div class="collection-detail-head"><div><span class="eyebrow">COLLECTION</span><h2>'+esc(c.name)+'</h2><p class="muted">'+xs.length+' saved item'+(xs.length===1?'':'s')+'</p></div><div class="orb">𓅃</div></div><div class="saved-tools"><input id="collectionSearch" type="search" placeholder="Search this collection…"><select id="collectionSort"><option value="new">Newest</option><option value="old">Oldest</option></select></div><div id="collectionItems" class="collection-items"></div>';const render=()=>{let ys=xs.filter(x=>(x.post.body||"").toLowerCase().includes((document.getElementById("collectionSearch").value||"").toLowerCase())||(x.post.title||"").toLowerCase().includes((document.getElementById("collectionSearch").value||"").toLowerCase()));ys.sort((a,b)=>new Date((document.getElementById("collectionSort").value==="old"?a.post.created_at:b.post.created_at))-new Date((document.getElementById("collectionSort").value==="old"?b.post.created_at:a.post.created_at)));document.getElementById("collectionItems").innerHTML=ys.length?ys.map(x=>{const p=x.post,pr=profiles.get(p.user_id)||{},media=p.media_url?(String(p.media_url).match(/\.(mp4|webm|mov|m4v)(\?|$)/i)?'<video src="'+esc(p.media_url)+'" controls preload="metadata"></video>':'<img src="'+esc(p.media_url)+'" alt="" loading="lazy">'):"";return '<article class="feed-card collection-item"><strong>'+esc(pr.display_name||pr.username||"CrowSpace Member")+'</strong><small class="muted"> · '+new Date(p.created_at).toLocaleString()+'</small><p>'+esc(p.body)+'</p>'+media+'<div class="saved-actions"><a class="secondary" href="profile.html?user='+encodeURIComponent(p.user_id)+'">Profile</a><a class="secondary" href="'+(p.kind==="post"?'caw.html?id='+p.id:'community-post.html?id='+p.id)+'">Open →</a></div></article>'}).join(""):'<div class="empty">This collection is empty.</div>'};document.getElementById("collectionSearch").oninput=render;document.getElementById("collectionSort").onchange=render;render()}
 document.getElementById("editModal").addEventListener("click",e=>{if(e.target.id==="closeEdit")document.getElementById("editModal").hidden=true;});
async function editCollection(c){const modal=document.getElementById("editModal");modal.hidden=false;modal.innerHTML='<div class="collection-edit-card"><span class="eyebrow">COLLECTION SETTINGS</span><h2>Edit Collection</h2><label>Name</label><input id="editName" maxlength="80" value="'+esc(c.name)+'"><label>Description</label><textarea id="editDescription" maxlength="240" rows="4">'+esc(c.description||"")+'</textarea><label>Cover image URL</label><input id="editCover" type="url" placeholder="https://…" value="'+esc(c.cover_url||"")+'"><input id="editCoverFile" type="file" accept="image/*"><small>Upload an image, or paste an existing image URL.</small><label>Theme</label><div class="theme-grid">'+["cinematic","midnight","tacoma","dreamscapes","retro","halloween"].map(t=>'<button type="button" data-theme="'+t+'">'+t.charAt(0).toUpperCase()+t.slice(1)+(c.theme===t?" ✓":"")+'</button>').join("")+'</div><div class="saved-actions"><button class="secondary" id="closeEdit">Cancel</button><button class="primary" id="saveEdit">Save Changes</button></div></div>';let selected=c.theme||"cinematic";modal.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{selected=b.dataset.theme;modal.querySelectorAll("[data-theme]").forEach(x=>x.textContent=x.dataset.theme.charAt(0).toUpperCase()+x.dataset.theme.slice(1));b.textContent=b.dataset.theme.charAt(0).toUpperCase()+b.dataset.theme.slice(1)+" ✓"});document.getElementById("closeEdit").onclick=()=>modal.hidden=true;document.getElementById("saveEdit").onclick=async()=>{let cover=document.getElementById("editCover").value.trim()||null;const file=document.getElementById("editCoverFile").files[0];if(file){if(!file.type.startsWith("image/")){alert("Please choose an image.");return}if(file.size>10*1024*1024){alert("Cover images must be 10 MB or smaller.");return}const ext=(file.name.split(".").pop()||"jpg").toLowerCase();const path=user.id+"/collections/"+c.id+"-"+Date.now()+"."+ext;const up=await sb.storage.from("crowspace-media").upload(path,file,{upsert:true,contentType:file.type});if(up.error){alert(up.error.message);return}cover=sb.storage.from("crowspace-media").getPublicUrl(path).data.publicUrl}const patch={name:document.getElementById("editName").value.trim(),description:document.getElementById("editDescription").value.trim(),cover_url:cover,theme:selected};if(!patch.name){alert("Collection name is required.");return}const {error}=await sb.from("crowspace_saved_collections").update(patch).eq("id",c.id).eq("user_id",user.id);if(error){alert(error.message);return}Object.assign(c,patch);modal.hidden=true;renderDirectory();openCollection(c.id)}}
document.getElementById("back").onclick=()=>{document.getElementById("view").classList.remove("active");document.getElementById("directory").style.display="";};load();
});
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Post — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body><header class="topbar"></header><main class="page"><section class="panel" id="postPanel"><div class="empty"><h2>Loading post…</h2></div></section></main><footer><b>🐦 CROWSPACE</b><span>One Account. One Universe.</span><span>© 2026 CrowRules Entertainment</span></footer><script src="js/navigation.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{
const cfg=window.CROW_CONFIG;if(!cfg?.supabaseUrl)return;
const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey),q=new URLSearchParams(location.search);
const type=q.get("type")==="circle"?"circle":"group",community=q.get("community"),postId=q.get("id");
const table=type==="circle"?"crowspace_circle_posts":"crowspace_group_posts",key=type==="circle"?"circle_id":"group_id",panel=document.getElementById("postPanel");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(!community||!postId){panel.innerHTML='<div class="empty"><h2>Post not found</h2></div>';return}
const {data:p}=await sb.from(table).select("id,user_id,body,title,media_url,created_at").eq("id",postId).eq(key,community).maybeSingle();
if(!p){panel.innerHTML='<div class="empty"><h2>Post not found</h2><p class="muted">This post may have been removed.</p></div>';return}
const {data:pr}=await sb.from("crowspace_profiles").select("display_name,username,avatar_url").eq("user_id",p.user_id).maybeSingle();
const {data:{user}}=await sb.auth.getUser();
const {data:likes}=await sb.from("crowspace_social_interactions").select("user_id").eq("target_type","community_post").eq("target_id",p.id).eq("interaction_type","like");
const liked=(likes||[]).some(x=>x.user_id===user?.id);
const {data:comments}=await sb.from("crowspace_comments").select("id,user_id,body,created_at").eq("post_id",p.id).order("created_at",{ascending:true});
const cids=(comments||[]).map(c=>c.user_id);
const {data:cp}=cids.length?await sb.from("crowspace_profiles").select("user_id,display_name,username,avatar_url").in("user_id",cids):{data:[]};
const cm=new Map((cp||[]).map(x=>[x.user_id,x]));
const av=pr?.avatar_url?'<img class="community-post-avatar" src="'+esc(pr.avatar_url)+'" alt="">':'<span class="community-post-avatar">🐦</span>';
const media=p.media_url?(String(p.media_url).match(/\.(mp4|webm|mov|m4v)(\?|$)/i)?'<video class="community-post-media" src="'+esc(p.media_url)+'" controls></video>':'<img class="community-post-media" src="'+esc(p.media_url)+'" alt="Post media">'):"";
panel.innerHTML='<div class="section-head"><a class="secondary" href="'+type+'.html?id='+encodeURIComponent(community)+'">← Back</a><span class="eyebrow">'+type.toUpperCase()+' POST</span></div><article class="feed-card community-feed-card"><div class="community-post-head">'+av+'<div><strong>'+esc(pr?.display_name||pr?.username||"Community Member")+'</strong><small class="muted">'+new Date(p.created_at).toLocaleString()+'</small></div></div>'+(p.title?'<h2>'+esc(p.title)+'</h2>':"")+'<p>'+esc(p.body)+'</p>'+media+'<div class="community-post-actions"><button class="secondary" id="likeBtn">'+(liked?"♥":"♡")+' '+(likes||[]).length+'</button><button class="secondary" id="shareBtn">↗ Share</button><button class="secondary" id="repostBtn">↻ Repost</button></div></article><section class="community-comments"><h3>Comments</h3><div id="comments">'+(comments||[]).map(c=>{const u=cm.get(c.user_id)||{};return '<div class="community-comment"><div>'+(u.avatar_url?'<img class="community-comment-avatar" src="'+esc(u.avatar_url)+'" alt="">':'<span class="community-comment-avatar">🐦</span>')+'</div><div><strong>'+esc(u.display_name||u.username||"Member")+'</strong><small class="muted"> '+new Date(c.created_at).toLocaleString()+'</small><p>'+esc(c.body)+'</p></div></div>'}).join("")+'</div>'+(user?'<div class="community-comment-box"><input id="commentInput" maxlength="1000" placeholder="Add a comment…"><button class="primary" id="commentBtn">Post</button></div>':'<p class="muted">Sign in to comment.</p>')+'</section>';
document.getElementById("likeBtn").onclick=async()=>{if(!user){location.href="login.html";return}if(liked)await sb.from("crowspace_social_interactions").delete().eq("user_id",user.id).eq("target_type","community_post").eq("target_id",p.id).eq("interaction_type","like");else await sb.from("crowspace_social_interactions").insert({user_id:user.id,target_type:"community_post",target_id:p.id,interaction_type:"like"});location.reload()};
document.getElementById("shareBtn").onclick=async()=>{const url=location.href;try{if(navigator.share)await navigator.share({title:"CrowSpace community post",url});else{await navigator.clipboard.writeText(url);document.getElementById("shareBtn").textContent="✓ Copied"}}catch(e){}};
document.getElementById("repostBtn").onclick=async()=>{if(!user){location.href="login.html";return}const {error}=await sb.from("crowspace_posts").insert({user_id:user.id,body:"↻ Reposted from "+type+"\n\n"+p.body,media_url:p.media_url||null,title:p.title||null});if(error)alert(error.message);else document.getElementById("repostBtn").textContent="✓ Reposted"};
document.getElementById("commentBtn")?.addEventListener("click",async()=>{const input=document.getElementById("commentInput"),body=input.value.trim();if(!body)return;const {error}=await sb.from("crowspace_comments").insert({post_id:p.id,user_id:user.id,body});if(error)alert(error.message);else location.reload()});
});
</script></body></html>

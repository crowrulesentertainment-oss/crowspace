<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Groups | CrowSpace</title>
<link rel="stylesheet" href="css/crowspace.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.group-tools{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;margin:20px 0}
.group-search{width:100%;box-sizing:border-box;padding:14px 16px;border:1px solid rgba(0,220,255,.25);border-radius:12px;background:#080b14;color:#fff;font:inherit;outline:none}
.group-search:focus{border-color:#00dcff;box-shadow:0 0 0 3px rgba(0,220,255,.08)}
.group-filter{display:flex;gap:8px;flex-wrap:wrap}
.group-filter .active{border-color:#00dcff;color:#00dcff}
.group-card-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.group-stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
.group-stat{padding:7px 11px;border:1px solid rgba(255,255,255,.09);border-radius:999px;background:rgba(255,255,255,.03);font-size:.85rem;color:#b8c2d8}
.results-note{margin:10px 0 18px}
@media(max-width:760px){.group-tools{grid-template-columns:1fr}.group-filter{width:100%}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header>

<main class="section">
  <div class="section-head">
    <div>
      <p class="eyebrow">COMMUNITIES</p>
      <h1>Groups</h1>
      <p class="muted">Discover CrowSpace communities, see groups you created, join groups, and participate in member-only conversations.</p>
    </div>
    <a class="btn primary" href="create-group.html">Create Group</a>
  </div>

  <div id="filter" class="filter-banner"></div>

  <section class="card group-tools" aria-label="Group search and filters">
    <input id="groupSearch" class="group-search" type="search" placeholder="Search groups by name, description, or creator…" autocomplete="off">
    <div class="group-filter">
      <button class="btn filter-btn active" data-filter="all" type="button">All Groups</button>
      <button class="btn filter-btn" data-filter="mine" type="button">Created by Me</button>
      <button class="btn filter-btn" data-filter="joined" type="button">My Groups</button>
    </div>
    <a class="btn" href="create-group.html">+ New Group</a>
  </section>

  <div id="stats" class="group-stats"></div>
  <p id="resultsNote" class="muted results-note"></p>
  <div id="groups" class="grid three"></div>
</main>

<footer>CrowSpace · One Account. One Universe.</footer>

<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/crowspace.js"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{
  const u=await CS.user();
  if(!u){location.href="login.html";return}
  await CS.refreshHeader();

  const esc=CS.escape;
  const params=new URLSearchParams(location.search);
  const creatorFilter=params.get("user");

  const [{data:groupRows,error},{data:memberRows,error:memberError}]=await Promise.all([
    crowSupabase.from("crowspace_groups").select("*").order("created_at",{ascending:false}),
    crowSupabase.from("crowspace_group_members").select("group_id,user_id")
  ]);

  if(error){
    document.getElementById("groups").innerHTML='<div class="card"><p>'+esc(error.message)+'</p></div>';
    return;
  }
  if(memberError){
    document.getElementById("groups").innerHTML='<div class="card"><p>'+esc(memberError.message)+'</p></div>';
    return;
  }

  const allGroups=groupRows||[];
  const members=memberRows||[];
  const graph=await CS.socialGraphMap(500);
  const counts={},mine={};

  members.forEach(x=>{
    counts[x.group_id]=(counts[x.group_id]||0)+1;
    if(x.user_id===u.id) mine[x.group_id]=true;
  });

  const createdByMe=allGroups.filter(x=>x.created_by===u.id).length;
  const joinedCount=allGroups.filter(x=>mine[x.id]).length;

  document.getElementById("stats").innerHTML=
    '<span class="group-stat"><strong>'+allGroups.length+'</strong> total groups</span>'+
    '<span class="group-stat"><strong>'+createdByMe+'</strong> created by you</span>'+
    '<span class="group-stat"><strong>'+joinedCount+'</strong> groups joined</span>';

  const filter=document.getElementById("filter");
  let initialFilter="all";

  if(creatorFilter){
    initialFilter="creator";
    filter.innerHTML='<div class="card"><strong>Showing groups created by this member.</strong> <a href="groups.html">Show all groups</a></div>';
  }

  const state={search:"",filter:initialFilter};

  const render=()=>{
    let data=allGroups.slice();

    if(creatorFilter) data=data.filter(x=>x.created_by===creatorFilter);
    if(state.filter==="mine") data=data.filter(x=>x.created_by===u.id);
    if(state.filter==="joined") data=data.filter(x=>!!mine[x.id]);

    const q=state.search.trim().toLowerCase();
    if(q){
      data=data.filter(x=>{
        const p=graph[x.created_by]||{};
        return [x.name,x.description,p.display_name,p.username].filter(Boolean).join(" ").toLowerCase().includes(q);
      });
    }

    document.getElementById("resultsNote").textContent=
      data.length+" group"+(data.length===1?"":"s")+" shown"+(state.search?" for “"+state.search+"”":"");

    const container=document.getElementById("groups");
    if(!data.length){
      container.innerHTML='<div class="card"><h3>No groups found.</h3><p class="muted">'+
        (state.search?'Try a different search.':'Create a group or join a community to get started.')+
        '</p><a class="btn primary" href="create-group.html">Create Group</a></div>';
      return;
    }

    container.innerHTML=data.map(x=>{
      const p=graph[x.created_by]||{};
      const joined=!!mine[x.id];
      const creatorName=p.display_name||p.username||"Member";
      return '<article class="card social-card">'+
        (x.image_url?'<img class="card-media" src="'+esc(x.image_url)+'" alt="">':"")+
        '<p class="eyebrow">GROUP</p>'+
        '<h3>'+esc(x.name)+'</h3>'+
        '<p>'+esc(x.description||"No description yet.")+'</p>'+
        '<p class="group-members">'+Number(counts[x.id]||0)+' members · '+(joined?"Member":"Not a member")+'</p>'+
        '<div class="media-owner">'+
          '<span class="avatar sm">'+esc(creatorName.slice(0,1).toUpperCase())+'</span>'+
          '<span>Created by <a href="profile.html?id='+encodeURIComponent(x.created_by)+'">'+esc(creatorName)+'</a><br>'+CS.socialPersonMeta(p)+'</span>'+
        '</div>'+
        '<div class="group-card-actions">'+
          '<a class="btn primary" href="group.html?id='+encodeURIComponent(x.id)+'">'+(joined?"Open Group":"View / Join")+'</a>'+
          (joined?"":'<button class="btn join-btn" data-id="'+esc(x.id)+'">Join Group</button>')+
        '</div>'+
      '</article>';
    }).join("");

    container.querySelectorAll(".join-btn").forEach(btn=>btn.addEventListener("click",async()=>{
      btn.disabled=true;
      btn.textContent="Joining…";
      const {error}=await crowSupabase.from("crowspace_group_members").upsert(
        {group_id:btn.dataset.id,user_id:u.id,role:"member"},
        {onConflict:"group_id,user_id"}
      );
      if(error){
        alert(error.message);
        btn.disabled=false;
        btn.textContent="Join Group";
      }else{
        mine[btn.dataset.id]=true;
        render();
      }
    }));
  };

  const buttons=document.querySelectorAll(".filter-btn");
  buttons.forEach(btn=>btn.addEventListener("click",()=>{
    buttons.forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    state.filter=btn.dataset.filter;
    render();
  }));

  document.getElementById("groupSearch").addEventListener("input",e=>{
    state.search=e.target.value;
    render();
  });

  if(initialFilter==="creator"){
    buttons.forEach(x=>x.classList.remove("active"));
  }

  render();
});
</script>
<script src="js/global-nav.js"></script>
</body>
</html>

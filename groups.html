<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrowSpace Groups 2.0</title>
<style>
:root{--a:#20e6ff;--p:#8d5cff;--bg:#05050b;--card:#0d101a;--line:#292e42;--muted:#9da5bd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#17132d,transparent 38%),var(--bg);color:#f5f7ff;font:14px Arial,sans-serif}main{max-width:1200px;margin:auto;padding:18px}
.top,.toolbar,.actions,.member{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:15px}.brand{font-size:25px;font-weight:900}.pill{color:var(--a)}
.card{background:rgba(13,16,26,.95);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 12px 35px #0005}.hero{background:linear-gradient(135deg,#101d2c,#30194b,#0d0f18)}
.muted{color:var(--muted)}h1,h2,h3{margin-top:0}.search{flex:1;min-width:240px}.search input,input,textarea,select{width:100%;padding:11px;background:#080a12;color:#fff;border:1px solid var(--line);border-radius:10px}.search{display:flex;gap:8px}
.btn,a.btn{display:inline-block;padding:10px 13px;border:1px solid #343c56;border-radius:10px;background:#171a29;color:#fff;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(90deg,#126d7a,#56358c)!important;border:0!important}.filter.active{outline:2px solid var(--a)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.group{background:#10131f;border:1px solid var(--line);border-radius:15px;padding:16px;cursor:pointer}.group:hover{border-color:#4d5879;transform:translateY(-2px)}.group.selected{outline:2px solid var(--a)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#111522;padding:10px;border-radius:10px;text-align:center}.stat b{font-size:20px;display:block}
.layout{display:grid;grid-template-columns:280px 1fr;gap:15px}.side{position:sticky;top:12px;height:max-content}.member{padding:9px;border-bottom:1px solid #25293a}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#20253a;display:grid;place-items:center;font-weight:800;font-size:11px}.post{border-top:1px solid #25293a;padding:14px 0}.posthead{display:flex;gap:9px;align-items:center}.postbody{white-space:pre-wrap;line-height:1.5;margin:10px 0}.composer textarea{min-height:90px;resize:vertical}.empty{text-align:center;padding:35px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.side{position:static}}@media(max-width:600px){main{padding:10px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}}
</style></head><body><main>
<div class="top"><div class="brand">🖤 CrowSpace <span class="pill">Groups 2.0</span></div><a class="btn" href="./">← CrowSpace</a></div>
<section class="card hero"><h1>👥 CrowSpace Groups</h1><p class="muted">Find communities, join conversations, and build inside the CrowRules universe.</p><div class="stats"><div class="stat"><b id="groupCount">0</b><span class="muted">Groups</span></div><div class="stat"><b id="memberCount">0</b><span class="muted">Members</span></div><div class="stat"><b id="postCount">0</b><span class="muted">Group Posts</span></div></div></section>

<section class="card"><div class="toolbar"><div class="search"><input id="q" placeholder="Search groups…"><button class="btn primary" id="go">Search</button></div><button class="btn filter active" data-filter="all">All</button><button class="btn filter" data-filter="joined">Joined</button><button class="btn filter" data-filter="mine">My Groups</button><button class="btn filter" data-filter="public">Public</button></div></section>
<section id="directory" class="card"><h2>Discover Communities</h2><div id="list" class="grid"><div class="empty">Loading…</div></div></section>
<section id="community" class="card" style="display:none"><div class="top"><div><h2 id="groupName"></h2><div id="groupDesc" class="muted"></div></div><button class="btn" id="back">← Groups</button></div><div class="toolbar"><span id="groupMeta" class="muted"></span><button id="joinBtn" class="btn primary"></button><a id="ownerBtn" class="btn" href="#">Owner Profile</a></div></section>

<section id="communityLayout" class="layout" style="display:none">
<aside class="card side"><h3>Members</h3><div id="members"></div></aside>
<section>
<div class="card composer"><h3>Post to this group</h3><textarea id="postBody" placeholder="Share something with the group…"></textarea><div class="actions" style="margin-top:9px"><button id="postBtn" class="btn primary">Publish Post</button></div><div id="postStatus" class="muted"></div></div>
<div class="card"><div class="toolbar"><h3 style="margin:0">Group Feed</h3><button class="btn filterPost active" data-sort="latest">Latest</button><button class="btn filterPost" data-sort="popular">Popular</button></div><div id="feed"><div class="empty">Select a group.</div></div></div>
</section></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");
let me=null,groups=[],members=[],posts=[],selected=null,filter="all",sort="latest",profiles={};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const ini=s=>(s||"Member").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
async function init(){me=(await db.auth.getSession()).data.session?.user||null;await loadGroups();const p=new URLSearchParams(location.search);if(p.get("group"))openGroup(p.get("group"));subscribe()}
async function loadGroups(){
 const r=await db.from("crowspace_groups").select("id,name,slug,description,owner_id,visibility,status,created_at").eq("status","active").order("created_at",{ascending:false});
 if(r.error){list.innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}groups=r.data||[];
 const ids=[...new Set(groups.map(g=>g.owner_id).filter(Boolean))];if(ids.length){const p=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids);profiles={};(p.data||[]).forEach(x=>profiles[x.user_id]=x)}
 let gm=[];const mr=await db.from("crowspace_group_members").select("group_id,user_id,status");gm=mr.data||[];memberCount.textContent=gm.length;postCount.textContent=0;groupCount.textContent=groups.length;
 const term=q.value.trim().toLowerCase();let rows=groups.filter(g=>g.visibility==="public"||g.owner_id===me?.id);
 if(filter==="joined"&&me)rows=rows.filter(g=>gm.some(m=>m.group_id===g.id&&m.user_id===me.id&&m.status==="active"));
 if(filter==="mine"&&me)rows=rows.filter(g=>g.owner_id===me.id);if(term)rows=rows.filter(g=>[g.name,g.description,g.slug].some(v=>String(v||"").toLowerCase().includes(term)));
 list.innerHTML=rows.length?rows.map(g=>'<article class="group '+(selected===g.id?"selected":"")+'" onclick="openGroup(\''+g.id+'\')"><h3>'+esc(g.name)+'</h3><p class="muted">'+esc(g.description||"Community")+'</p><small>'+esc(g.visibility)+' · '+gm.filter(m=>m.group_id===g.id&&m.status==="active").length+' members</small></article>').join(""):'<div class="empty">No groups found.</div>';
}
async function openGroup(id){selected=id;history.replaceState({},'',"?group="+encodeURIComponent(id));const g=groups.find(x=>x.id===id)||((await db.from("crowspace_groups").select("*").eq("id",id).maybeSingle()).data);if(!g)return;selected=g.id;directory.style.display="none";community.style.display="block";communityLayout.style.display="grid";groupName.textContent=g.name;groupDesc.textContent=g.description||"Community";groupMeta.textContent=g.visibility+" group";ownerBtn.href="./profile.html?u="+encodeURIComponent(profiles[g.owner_id]?.username||"");await loadGroupData(g)}
async function loadGroupData(g){
 const mr=await db.from("crowspace_group_members").select("group_id,user_id,role,status,created_at").eq("group_id",g.id).eq("status","active").order("created_at",{ascending:true});members=mr.data||[];
 const ids=[...new Set(members.map(x=>x.user_id).concat(g.owner_id).filter(Boolean))];if(ids.length){const p=await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids);(p.data||[]).forEach(x=>profiles[x.user_id]=x)}
 const joined=members.some(x=>x.user_id===me?.id);joinBtn.textContent=joined?"Leave Group":"Join Group";joinBtn.onclick=()=>joined?leaveGroup(g.id):joinGroup(g.id);
 renderMembers();
 const pr=await db.from("crowspace_posts").select("id,author_id,body,media_url,media_type,visibility,status,like_count,comment_count,created_at").eq("group_id",g.id).eq("status","published").order("created_at",{ascending:false}).limit(100);posts=pr.data||[];
 postCount.textContent=posts.length;renderFeed();
}
function renderMembers(){membersEl.innerHTML=members.length?members.map(m=>{const p=profiles[m.user_id]||{};const av=p.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'">':'<span class="avatar">'+ini(p.display_name||p.username)+'</span>';return '<div class="member">'+av+'<a href="./profile.html?u='+encodeURIComponent(p.username||"")+'" class="muted">'+esc(p.display_name||p.username||"Member")+'</a><span class="muted" style="margin-left:auto">'+esc(m.role)+'</span></div>'}).join(""):'<div class="muted">No members yet.</div>'}
function renderFeed(){let p=[...posts];if(sort==="popular")p.sort((a,b)=>(b.like_count+b.comment_count)-(a.like_count+a.comment_count));feed.innerHTML=p.length?p.map(x=>{const a=profiles[x.author_id]||{};const av=a.avatar_url?'<img class="avatar" src="'+esc(a.avatar_url)+'">':'<span class="avatar">'+ini(a.display_name||a.username)+'</span>';return '<article class="post"><div class="posthead">'+av+'<a href="./profile.html?u='+encodeURIComponent(a.username||"")+'"><b>'+esc(a.display_name||a.username||"Member")+'</b></a><span class="muted">'+new Date(x.created_at).toLocaleString()+'</span></div><div class="postbody">'+esc(x.body||"")+'</div><div class="meta muted">'+x.like_count+' ♥ · '+x.comment_count+' 💬</div></article>'}).join(""):'<div class="empty">No posts yet. Start the conversation.</div>'}
async function joinGroup(id){if(!me)return alert("Sign in to join groups.");const r=await db.from("crowspace_group_members").upsert({group_id:id,user_id:me.id,role:"member",status:"active"});if(r.error)alert(r.error.message);else{postStatus.textContent="You joined the group.";await loadGroups();await loadGroupData(groups.find(g=>g.id===id))}}
async function leaveGroup(id){if(!me)return;const r=await db.from("crowspace_group_members").delete().eq("group_id",id).eq("user_id",me.id);if(r.error)alert(r.error.message);else{postStatus.textContent="You left the group.";await loadGroups();await loadGroupData(groups.find(g=>g.id===id))}}
postBtn.onclick=async()=>{if(!me)return alert("Sign in to post.");if(!members.some(x=>x.user_id===me.id&&x.status==="active"))return alert("Join the group before posting.");const body=postBody.value.trim();if(!body)return;postBtn.disabled=true;const r=await db.from("crowspace_posts").insert({author_id:me.id,group_id:selected,body,visibility:"public",status:"published"});postBtn.disabled=false;if(r.error)return alert(r.error.message);postBody.value="";postStatus.textContent="Post published.";await loadGroupData(groups.find(g=>g.id===selected))}
back.onclick=()=>{selected=null;history.replaceState({},'',location.pathname);directory.style.display="block";community.style.display="none";communityLayout.style.display="none";loadGroups()}
go.onclick=loadGroups;q.addEventListener("keydown",e=>{if(e.key==="Enter")loadGroups()});
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));loadGroups()});
document.querySelectorAll(".filterPost").forEach(b=>b.onclick=()=>{sort=b.dataset.sort;document.querySelectorAll(".filterPost").forEach(x=>x.classList.toggle("active",x===b));renderFeed()});
function subscribe(){db.channel("groups2").on("postgres_changes",{event:"*",schema:"public",table:"crowspace_group_members"},()=>{loadGroups();if(selected)loadGroupData(groups.find(g=>g.id===selected))}).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_posts"},p=>{if(p.new?.group_id===selected||p.old?.group_id===selected)loadGroupData(groups.find(g=>g.id===selected))}).subscribe()}
const membersEl=document.getElementById("members");init();
</script></body></html>

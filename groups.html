<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Groups | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">COMMUNITIES</p><h1>Groups</h1><p class="muted">Communities connected to the same people, profiles and activity graph.</p></div><a class="btn primary" href="create-group.html">Create Group</a></div><div id="filter" class="filter-banner"></div><div id="groups" class="grid three"></div></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{if(!await CS.user()){location.href="login.html";return}await CS.refreshHeader();const params=new URLSearchParams(location.search),user=params.get("user");const [{data,error},{data:members}]=await Promise.all([crowSupabase.from("crowspace_groups").select("*").order("created_at",{ascending:false}),crowSupabase.from("crowspace_group_members").select("group_id,user_id")]);if(error){groups.innerHTML='<div class="card"><p>'+CS.escape(error.message)+'</p></div>';return}let data=data||[];if(user){data=data.filter(x=>x.created_by===user);filter.innerHTML='<div class="card"><strong>Showing groups created by this member.</strong> <a href="groups.html">Show all groups</a></div>'}const graph=await CS.socialGraphMap(250),counts={};const esc=CS.escape;(members||[]).forEach(x=>counts[x.group_id]=(counts[x.group_id]||0)+1);groups.innerHTML=data.map(x=>{const p=graph[x.created_by]||{};return '<article class="card social-card">'+(x.image_url?'<img class="card-media" src="'+CS.escape(x.image_url)+'" alt="">':"")+'<p class="eyebrow">GROUP</p><h3>'+CS.escape(x.name)+'</h3><p>'+CS.escape(x.description||"")+'</p><p class="group-members">'+Number(counts[x.id]||0)+' members</p><div class="media-owner"><span class="avatar sm">'+esc((p.display_name||p.username||"C").slice(0,1).toUpperCase())+'</span><span>Created by <a href="profile.html?id='+encodeURIComponent(x.created_by)+'">'+esc(p.display_name||p.username||"Member")+'</a><br>'+CS.socialPersonMeta(p)+'</span></div><div class="social-actions"><button class="btn primary" onclick="joinGroup(\''+x.id+'\')">Join Group</button><a class="btn" href="profile.html?id='+encodeURIComponent(x.created_by)+'">Creator Nest →</a></div></article>'}).join("")||'<div class="card"><h3>No groups yet.</h3></div>'});const esc=CS.escape;async function joinGroup(id){const u=await CS.user();if(!u)return;const {error}=await crowSupabase.from("crowspace_group_members").upsert({group_id:id,user_id:u.id},{onConflict:"group_id,user_id"});if(error)alert(error.message);else location.reload()}
</script></body></html>

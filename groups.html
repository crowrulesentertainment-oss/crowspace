<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Groups | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">My Nest</a><a href="people.html">People</a><a href="friends.html">Friends</a><a href="caws.html">Caws</a><a href="albums.html">Photos</a><a href="groups.html">Groups</a><a href="events.html">Events</a><a href="notifications.html">Messages</a></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">MYSPACE-STYLE COMMUNITIES</p><h1>Groups</h1><p class="muted">Find your people, join communities and build your CrowSpace circle.</p></div><a class="btn primary" href="create-group.html">Create Group</a></div><div id="groups" class="grid three"></div></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{await CS.refreshHeader();const {data}=await crowSupabase.from("crowspace_groups").select("*").order("created_at");const ids=[...new Set((data||[]).map(x=>x.created_by).filter(Boolean))];const {data:ps}=ids.length?await crowSupabase.rpc("crowspace_public_profiles_by_ids",{ids}):{data:[]};const map=Object.fromEntries((ps||[]).map(p=>[p.id,p]));groups.innerHTML=(data||[]).map(x=>{const p=map[x.created_by]||{};return '<article class="card"><p class="eyebrow">GROUP</p><h3>'+CS.escape(x.name)+'</h3><p>'+CS.escape(x.description||"")+'</p><p class="muted">Created by <a href="profile.html?id='+encodeURIComponent(x.created_by)+'">'+CS.escape(p.display_name||p.username||"Member")+'</a></p><button class="btn" onclick="joinGroup(\''+x.id+'\')">Join Group</button></article>'}).join("")||'<p class="muted">No groups yet.</p>'});async function joinGroup(id){const u=await CS.user();if(!u){location.href="login.html";return}const {error}=await crowSupabase.from("crowspace_group_members").upsert({group_id:id,user_id:u.id},{onConflict:"group_id,user_id"});alert(error?error.message:"You joined the group.");}</script></body></html>

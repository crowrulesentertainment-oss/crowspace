<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Groups</title><style>body{margin:0;background:#05050b;color:#fff;font:14px Arial;padding:25px}main{max-width:950px;margin:auto}.card{background:#0d0f18;border:1px solid #292e42;border-radius:18px;padding:20px;margin-bottom:15px}.group{padding:16px;border-bottom:1px solid #25293a}.muted{color:#9da5bd}button{padding:9px 13px;background:#183f52;color:#fff;border:0;border-radius:9px}</style></head><body><main><div class="card"><h1>👥 CrowSpace Groups</h1><p class="muted">Find your communities inside the CrowRules universe.</p><div id="list">Loading...</div><a href="./" style="color:#fff">← CrowSpace</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");let me;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function init(){me=(await db.auth.getSession()).data.session?.user;const r=await db.from("crowspace_groups").select("*").eq("status","active").order("created_at",{ascending:false});if(r.error){list.textContent="Groups are being prepared.";return}list.innerHTML=(r.data||[]).map(x=>'<div class="group"><h3>'+esc(x.name)+'</h3><p class="muted">'+esc(x.description||"CrowSpace community")+'</p><small>'+esc(x.visibility)+'</small>'+(me?'<br><button onclick="join(\''+x.id+'\')">Join Group</button>':"")+'</div>').join("")||'<p class="muted">No groups yet. Create the first community.</p>'}
async function join(id){if(!me)return;const r=await db.from("crowspace_group_members").upsert({group_id:id,user_id:me.id,role:"member",status:"active"});if(r.error)alert(r.error.message);else alert("You joined the group.");}init();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Groups | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="site-header"><a class="brand" href="index.html">◉ CROWSPACE</a><nav><a href="index.html">Home</a><a href="profile.html">Nest</a><a href="caws.html">Caws</a><a class="active" href="groups.html">Groups</a><a href="notifications.html">Notifications</a></nav><div id="account"></div></header><main class="section"><p class="eyebrow">COMMUNITIES</p><h1>Groups</h1><div id="groups" class="grid three"></div></main><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{let {data}=await crowSupabase.from("crowspace_groups").select("*").order("created_at");if(!data?.length){const u=await CS.user();if(u){for(const g of [{name:"Dreamscapes Creators",slug:"dreamscapes-creators",description:"Stories, worlds and ideas developed through CrowRules Dreamscapes."},{name:"Tacoma Community",slug:"tacoma-community",description:"Connect with the Tacoma CrowRules community."},{name:"CrowRules Community",slug:"crowrules-community",description:"Discuss the growing CrowRules universe."}])await crowSupabase.from("crowspace_groups").upsert({...g,created_by:u.id},{onConflict:"slug"});({data}=await crowSupabase.from("crowspace_groups").select("*").order("created_at"))}}groups.innerHTML=(data||[]).map(g=>'<article class="card"><p class="eyebrow">GROUP</p><h3>'+CS.escape(g.name)+'</h3><p>'+CS.escape(g.description||"")+'</p><button class="btn" onclick="joinGroup(\''+g.id+'\')">Join Group</button></article>').join("")||'<p class="muted">No groups yet.</p>'});async function joinGroup(id){const u=await CS.user();if(!u){location.href="login.html";return}const {error}=await crowSupabase.from("crowspace_group_members").upsert({group_id:id,user_id:u.id},{onConflict:"group_id,user_id"});alert(error?error.message:"You joined the group.");}</script></body></html>

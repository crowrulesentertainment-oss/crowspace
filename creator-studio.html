<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Studio — CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/navigation.js"></script><style>.studio{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.tile,.composer{padding:22px}.metric{font-size:30px;font-weight:800}.composer textarea{width:100%;min-height:120px;margin:12px 0;padding:14px;box-sizing:border-box}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.actions{display:flex;gap:10px;flex-wrap:wrap}.empty{text-align:center;padding:40px;color:var(--muted)}.hero{padding:42px 0 24px}</style></head><body><div id="app"><header class="topbar"></header><main><section class="hero"><span class="eyebrow">CROWRULES CREATOR SYSTEM</span><h1>Creator <em>Studio.</em></h1><p class="lead">Create Caws, manage your collections, and monitor your CrowSpace presence.</p><div class="actions"><a class="primary" href="creator-analytics.html">Analytics</a><a class="secondary" href="profile.html">Profile</a></div></section><section class="studio"><section class="panel composer"><span class="eyebrow">PUBLISH</span><h2>Create a Caw</h2><textarea id="body" maxlength="5000" placeholder="Write your next Caw…"></textarea><div class="actions"><button class="primary" id="publish">Publish Caw</button><button class="secondary" id="draft">Save Draft</button></div><p id="status" class="muted"></p></section><section class="panel tile"><span class="eyebrow">YOUR WORK</span><h2>Dashboard</h2><div class="row"><span>Published Caws</span><b id="caws">0</b></div><div class="row"><span>Collections</span><b id="collections">0</b></div><div class="row"><span>Followers</span><b id="followers">0</b></div><div class="row"><span>Following</span><b id="following">0</b></div></section></section><section class="panel" style="margin-top:18px"><span class="eyebrow">DISCOVERY</span><h2>Collection Pulse</h2><div id="pulse" class="empty">Loading…</div></section></main></div><script>
document.addEventListener("DOMContentLoaded",async()=>{const cfg=window.CROW_CONFIG||{};if(!cfg.supabaseUrl)return;const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey),{data:{user}}=await sb.auth.getUser();if(!user){document.querySelector("main").innerHTML='<section class="panel empty"><h2>Sign in to open Creator Studio</h2><a class="primary" href="login.html">Sign In</a></section>';return}async function stats(){const [p,c,f]=await Promise.all([sb.from("crowspace_posts").select("id",{count:"exact",head:true}).eq("user_id",user.id),sb.from("crowspace_saved_collections").select("id,name,discovery_score").eq("user_id",user.id),sb.from("crowspace_follows").select("follower_id,followed_user_id").or("followed_user_id.eq."+user.id+",follower_id.eq."+user.id)]);document.getElementById("caws").textContent=p.count||0;document.getElementById("collections").textContent=c.data?.length||0;const x=f.data||[];document.getElementById("followers").textContent=x.filter(v=>v.followed_user_id===user.id).length;document.getElementById("following").textContent=x.filter(v=>v.follower_id===user.id).length;const top=(c.data||[]).slice().sort((a,b)=>Number(b.discovery_score||0)-Number(a.discovery_score||0)).slice(0,5);document.getElementById("pulse").innerHTML=top.length?top.map(v=>'<div class="row"><a href="public-collection.html?collection='+v.id+'">'+String(v.name).replace(/[&<>"]/g,"")+'</a><strong>'+Number(v.discovery_score||0).toFixed(1)+'</strong></div>').join(""):'No collections yet. <a href="collections.html">Create one →</a>'}async function publish(){const body=document.getElementById("body").value.trim();if(!body)return;document.getElementById("status").textContent="Publishing…";const {error}=await sb.from("crowspace_posts").insert({user_id:user.id,body});document.getElementById("status").textContent=error?error.message:"Caw published.";if(!error){document.getElementById("body").value="";stats()}}document.getElementById("publish").onclick=publish;document.getElementById("draft").onclick=()=>document.getElementById("status").textContent="Draft workspace coming next.";stats()});
</script></body></html>

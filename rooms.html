<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rooms | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.comm-grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.comm-card{background:linear-gradient(145deg,#11182b,#090d18);border:1px solid var(--line);border-radius:18px;padding:18px}.list{display:grid;gap:8px}.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}.item.active{border-color:#55b8ff}.messages{min-height:360px;max-height:58vh;overflow:auto;display:grid;align-content:start;gap:8px}.bubble{max-width:75%;padding:10px 13px;border-radius:14px;background:rgba(255,255,255,.06)}.mine{margin-left:auto;background:rgba(85,184,255,.14)}.composer{display:flex;gap:8px;margin-top:12px}.composer input{flex:1}.room-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.live-card{position:relative}.live-dot{color:#ff5364;font-weight:900}@media(max-width:800px){.comm-grid,.room-grid{grid-template-columns:1fr}} </style></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">PHASE 4 · COMMUNICATION</p><h1>Rooms</h1><p class="muted">Persistent community spaces for real-time conversation.</p></div><button id="create" class="btn primary">+ Create Room</button></div><div id="rooms" class="room-grid"></div><section class="comm-card" style="margin-top:18px"><p class="eyebrow">COMMUNITY POWER</p><h2>Connect Rooms to your CrowSpace</h2><p class="muted">Rooms can become the conversation layer for Circles and Creator Projects.</p><div class="actions"><a class="btn" href="circles.html">Explore Circles</a><a class="btn" href="creator-hub.html">Creator Hub</a></div></section></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await CS.user();if(!u){location.href='login.html';return}await CS.refreshHeader();const esc=CS.escape;async function load(){const q=await crowSupabase.from('crowspace_rooms').select('*').order('created_at');document.getElementById('rooms').innerHTML=(q.data||[]).map(r=>'<article class="comm-card"><p class="eyebrow">ROOM</p><h2>'+esc(r.name)+'</h2><p class="muted">'+esc(r.description||'')+'</p><a class="btn primary" href="room.html?slug='+encodeURIComponent(r.slug)+'">Enter Room →</a></article>').join('')||'<div class="empty">No rooms yet.</div>'}document.getElementById('create').onclick=async()=>{const name=prompt('Room name');if(!name)return;const slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const r=await crowSupabase.from('crowspace_rooms').insert({name:name.trim(),slug,created_by:u.id,is_public:true});if(r.error)alert(r.error.message);else load()};load()});</script><script src="js/global-nav.js"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rooms | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.comm-grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.comm-card{background:linear-gradient(145deg,#11182b,#090d18);border:1px solid var(--line);border-radius:18px;padding:18px}.list{display:grid;gap:8px}.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}.item.active{border-color:#55b8ff}.messages{min-height:360px;max-height:58vh;overflow:auto;display:grid;align-content:start;gap:8px}.bubble{max-width:75%;padding:10px 13px;border-radius:14px;background:rgba(255,255,255,.06)}.mine{margin-left:auto;background:rgba(85,184,255,.14)}.composer{display:flex;gap:8px;margin-top:12px}.composer input{flex:1}.room-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.live-card{position:relative}.live-dot{color:#ff5364;font-weight:900}@media(max-width:800px){.comm-grid,.room-grid{grid-template-columns:1fr}} </style></head><body><header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"><a href="login.html">Sign In</a></div></header><main class="section"><div class="section-head"><div><p class="eyebrow">PHASE 4 · COMMUNICATION</p><h1>Rooms</h1><p class="muted">Persistent community spaces for real-time conversation.</p></div><button id="create" class="btn primary">+ Create Room</button></div><div id="rooms" class="room-grid"></div><section class="comm-card" style="margin-top:18px"><p class="eyebrow">CREATE A CONNECTED ROOM</p><h2>Circle + Creator Project Rooms</h2><p class="muted">Attach a room to a Circle, a Creator Project, or both.</p><div class="list"><input id="roomName" placeholder="Room name"><input id="roomDesc" placeholder="Description"><select id="circle"><option value="">No Circle</option></select><select id="project"><option value="">No Creator Project</option></select><button id="saveRoom" class="btn primary">Create Connected Room</button></div><p id="roomMsg" class="muted"></p></section></main><footer>CrowSpace · One Account. One Universe.</footer><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/crowspace.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await CS.user();if(!u){location.href='login.html';return}await CS.refreshHeader();const esc=CS.escape;async function loadContext(){const a=await crowSupabase.from('crowspace_circles').select('id,name').order('name').limit(100);document.getElementById('circle').innerHTML='<option value="">No Circle</option>'+(a.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');const p=await crowSupabase.from('crowspace_creator_projects').select('id,title').eq('owner_id',u.id).order('title').limit(100);document.getElementById('project').innerHTML='<option value="">No Creator Project</option>'+(p.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.title)+'</option>').join('')}async function load(){const q=await crowSupabase.from('crowspace_rooms').select('*,crowspace_circles(name),crowspace_creator_projects(title)').order('created_at');document.getElementById('rooms').innerHTML=(q.data||[]).map(r=>'<article class="comm-card"><p class="eyebrow">ROOM</p><h2>'+esc(r.name)+'</h2><p class="muted">'+esc(r.description||'')+'</p><p class="muted">'+(r.crowspace_circles?'Circle: '+esc(r.crowspace_circles.name):'')+(r.crowspace_creator_projects?' · Project: '+esc(r.crowspace_creator_projects.title):'')+'</p><a class="btn primary" href="room.html?slug='+encodeURIComponent(r.slug)+'">Enter Room →</a></article>').join('')||'<div class="empty">No rooms yet.</div>}document.getElementById('saveRoom').onclick=async()=>{const name=document.getElementById('roomName').value.trim();if(!name)return;const slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString(36);const r=await crowSupabase.from('crowspace_rooms').insert({name,slug,description:document.getElementById('roomDesc').value.trim(),created_by:u.id,is_public:true,circle_id:document.getElementById('circle').value||null,project_id:document.getElementById('project').value||null});document.getElementById('roomMsg').textContent=r.error?r.error.message:'Room created.';if(!r.error){document.getElementById('roomName').value='';document.getElementById('roomDesc').value='';load()}};await loadContext();load()});</script><script src="js/global-nav.js"></script></body></html>

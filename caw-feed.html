<body>
<header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"><a href="login.html">Sign In</a></div></header>
<main class="page">
<section class="hero"><div><div class="kicker">CROWSPACE / CAWS</div><h1>Caw Feed</h1><p>Discover the latest Caws from the CrowSpace community.</p></div><button class="refresh" id="refresh">↻ Refresh</button></section>
<div id="feed" class="feed"><div class="empty"><h2>Loading Caws…</h2><p>Connecting to CrowSpace.</p></div></div>
</main><div id="status" class="status">Starting…</div>
<section id="comments" class="comments" aria-hidden="true"><div class="comments-head"><strong>COMMENTS</strong><button id="close" class="close">×</button></div><div id="commentList" class="comment-list"></div><form id="commentForm" class="comment-form"><input id="commentInput" maxlength="2000" placeholder="Add a comment…"><button>Post</button></form></section>
<script>
(()=>{"use strict";
const URL_BASE="https://cevylpnoexugwgygvtgu.supabase.co",KEY="sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-",feed=document.getElementById("feed"),status=document.getElementById("status");let db,user,caws=[],profiles={},stats={},commentCaw=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),initial=v=>(String(v||"C").trim()[0]||"C").toUpperCase(),setStatus=v=>status.textContent=v;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function loadLibrary(){return new Promise((resolve,reject)=>{if(window.supabase?.createClient)return resolve();const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js";s.onload=resolve;s.onerror=()=>reject(Error("CrowSpace library failed to load"));document.head.appendChild(s)})}
async function boot(){setStatus("Connecting to CrowSpace…");await loadLibrary();if(!window.supabase?.createClient)throw Error("Supabase client unavailable");db=window.supabase.createClient(URL_BASE,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});window.crowSupabase=db;const r=await db.auth.getSession();if(r.error)throw r.error;user=r.data?.session?.user||null;if(!user){location.href="login.html?next="+encodeURIComponent(location.href);return false}return true}
function videoUrl(x){if(x.video_url)return x.video_url;if(x.storage_path)return URL_BASE+"/storage/v1/object/public/crowspace-caws/"+String(x.storage_path).split("/").map(encodeURIComponent).join("/");return ""}
function st(id){return stats[id]||{like_count:0,comment_count:0,viewer_liked:false,viewer_follows:false,creator_followers:0}}
function card(x,i){const p=profiles[x.user_id]||{},s=st(x.id),name=p.display_name||p.username||"CrowSpace Member";return '<article class="caw" data-id="'+esc(x.id)+'"><div class="video-wrap"><video class="video" src="'+esc(videoUrl(x))+'" playsinline muted loop preload="'+(i<2?"auto":"metadata")+'"></video><div class="shade"></div><div class="creator"><a class="avatar" href="profile.html?id='+encodeURIComponent(x.user_id)+'">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="">':esc(initial(name)))+'</a><div><strong>'+esc(name)+'</strong><span>'+(p.username?"@"+esc(p.username):"")+'</span></div></div><button class="play" data-play="'+esc(x.id)+'">▶</button></div><div class="info"><h2>'+esc(x.title||"Untitled Caw")+'</h2><div class="caption">'+esc(x.caption||"")+'</div><div class="meta"><span class="views">'+Number(x.views||0).toLocaleString()+'</span> views · '+Number(s.like_count||0).toLocaleString()+' likes · '+Number(s.comment_count||0).toLocaleString()+' comments</div></div><div class="actions"><button class="act '+(s.viewer_liked?"active":"")+'" data-like="'+esc(x.id)+'">♥ <span>'+Number(s.like_count||0)+'</span></button><button class="act" data-comments="'+esc(x.id)+'">💬 <span>'+Number(s.comment_count||0)+'</span></button><button class="act" data-share="'+esc(x.id)+'">↗</button><button class="act follow '+(s.viewer_follows?"active":"")+'" data-follow="'+esc(x.user_id)+'">'+(s.viewer_follows?"Following":"Follow")+'</button></div></article>'}
async function load(){try{setStatus("Loading Caws…");const r=await db.from("crowspace_caws").select("id,user_id,title,caption,video_url,thumbnail_url,views,created_at,storage_path").order("created_at",{ascending:false}).limit(100);if(r.error)throw r.error;caws=(r.data||[]).filter(x=>videoUrl(x));profiles={};stats={};const ids=[...new Set(caws.map(x=>x.user_id).filter(Boolean))];if(ids.length){const p=await db.rpc("crowspace_public_profiles_by_ids",{ids});if(!p.error)(p.data||[]).forEach(x=>profiles[x.id]=x)}if(caws.length){const s=await db.rpc("crowspace_caw_social_stats",{p_caw_ids:caws.map(x=>x.id)});if(!s.error)(s.data||[]).forEach(x=>stats[x.caw_id]=x)}feed.innerHTML=caws.length?caws.map(card).join(""):'<div class="empty"><h2>No Caws Yet</h2><p>There are no playable Caws available to members.</p></div>';bind();setStatus(caws.length?"CrowSpace · "+caws.length+" Caw"+(caws.length===1?"":"s"):"No Caws")}catch(e){console.error("Caw Feed",e);feed.innerHTML='<div class="empty"><h2>Feed Error</h2><p>'+esc(e.message||"Unable to load the feed.")+'</p><button class="refresh" id="retry">Retry</button></div>';document.getElementById("retry").onclick=load;setStatus("Feed error")}}
function bind(){feed.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{const v=b.closest(".caw").querySelector(".video");if(v.paused){v.play().catch(()=>{});b.textContent="❚❚"}else{v.pause();b.textContent="▶"}});feed.querySelectorAll("[data-like]").forEach(b=>b.onclick=()=>like(b.dataset.like));feed.querySelectorAll("[data-comments]").forEach(b=>b.onclick=()=>openComments(b.dataset.comments));feed.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>share(b.dataset.share));feed.querySelectorAll("[data-follow]").forEach(b=>b.onclick=()=>follow(b.dataset.follow));}
async function like(id){const s=st(id),on=!!s.viewer_liked,r=on?await db.from("crowspace_caw_likes").delete().eq("caw_id",id).eq("user_id",user.id):await db.from("crowspace_caw_likes").insert({caw_id:id,user_id:user.id});if(r.error)return alert(r.error.message);s.viewer_liked=!on;s.like_count=Math.max(0,Number(s.like_count||0)+(on?-1:1));stats[id]=s;const b=feed.querySelector('[data-like="'+CSS.escape(id)+'"]');b.classList.toggle("active",s.viewer_liked);b.querySelector("span").textContent=s.like_count}
async function follow(uid){if(uid===user.id)return;const x=caws.find(q=>q.user_id===uid),s=x&&st(x.id);if(!s)return;const on=!!s.viewer_follows,r=on?await db.from("crowspace_follows").delete().eq("follower_id",user.id).eq("followed_user_id",uid):await db.from("crowspace_follows").insert({follower_id:user.id,followed_user_id:uid});if(r.error)return alert(r.error.message);caws.filter(q=>q.user_id===uid).forEach(q=>{const z=st(q.id);z.viewer_follows=!on;stats[q.id]=z});feed.querySelectorAll('[data-follow="'+CSS.escape(uid)+'"]').forEach(b=>{b.classList.toggle("active",!on);b.textContent=!on?"Following":"Follow"})}
async function share(id){const u=new URL("caw-feed.html",location.href);u.searchParams.set("caw",id);try{if(navigator.share)await navigator.share({title:"CrowSpace Caw",url:u.href});else{await navigator.clipboard.writeText(u.href);alert("Caw link copied")}}catch(e){}}
async function openComments(id){commentCaw=id;const panel=document.getElementById("comments"),list=document.getElementById("commentList");panel.classList.add("open");panel.setAttribute("aria-hidden","false");list.innerHTML="<div class=comment>Loading…</div>";const r=await db.from("crowspace_caw_comments").select("id,user_id,body,created_at").eq("caw_id",id).order("created_at",{ascending:true}).limit(100);if(r.error){list.innerHTML='<div class="comment">'+esc(r.error.message)+'</div>';return}if(!r.data?.length){list.innerHTML='<div class="comment">No comments yet.</div>';return}const ids=[...new Set(r.data.map(x=>x.user_id).filter(Boolean))];let pp={};if(ids.length){const p=await db.rpc("crowspace_public_profiles_by_ids",{ids});if(!p.error)(p.data||[]).forEach(x=>pp[x.id]=x)}list.innerHTML=r.data.map(x=>'<div class="comment"><span class="comment-user">'+esc(pp[x.user_id]?.display_name||pp[x.user_id]?.username||"CrowSpace Member")+'</span><span class="comment-time">'+new Date(x.created_at).toLocaleString()+'</span><div class="comment-body">'+esc(x.body)+'</div></div>').join("")}
document.getElementById("close").onclick=()=>{document.getElementById("comments").classList.remove("open");commentCaw=null};document.getElementById("commentForm").onsubmit=async e=>{e.preventDefault();if(!commentCaw)return;const input=document.getElementById("commentInput"),body=input.value.trim();if(!body)return;const r=await db.from("crowspace_caw_comments").insert({caw_id:commentCaw,user_id:user.id,body});if(r.error)return alert(r.error.message);input.value="";await openComments(commentCaw)};document.getElementById("refresh").onclick=load;
(async()=>{try{if(await boot())await load()}catch(e){console.error("Caw Feed startup",e);feed.innerHTML='<div class="empty"><h2>CrowSpace Connection Error</h2><p>'+esc(e.message)+'</p><button class="refresh" onclick="location.reload()">Retry</button></div>';setStatus("Connection error")}})();
})();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caw Feed | CrowSpace</title>
<link rel="stylesheet" href="css/crowspace.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#03050a;--panel:#0b0f18;--line:#ffffff20;--cyan:#59e7ff;--pink:#ff65c7;--muted:#aab5c6}
body{margin:0;background:#03050a;color:#fff;overflow:hidden}
.site-header{position:fixed;z-index:100;top:0;left:0;right:0;background:linear-gradient(180deg,#03050af5,#03050acc 72%,transparent);border-bottom:1px solid #ffffff0d}
.caw-feed-shell{height:100svh;position:relative}
.feed-top{position:fixed;z-index:30;top:72px;left:50%;transform:translateX(-50%);width:min(100% - 28px,980px);display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.feed-top>*{pointer-events:auto}
.feed-title{font:800 14px Orbitron;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 2px 15px #000}.feed-title span{color:var(--cyan)}
.feed-help{font-size:11px;color:#dbe4ef;background:#03050ab8;border:1px solid var(--line);padding:8px 11px;border-radius:999px}
.caw-feed{height:100svh;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior-y:contain;scrollbar-width:none}.caw-feed::-webkit-scrollbar{display:none}
.caw-slide{min-height:100svh;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center;padding:80px 14px 22px;box-sizing:border-box}
.caw-frame{position:relative;width:min(430px,100%);height:min(78svh,760px);min-height:520px;border-radius:24px;overflow:hidden;background:#080b13;border:1px solid #ffffff20;box-shadow:0 30px 90px #000b}
.caw-video{width:100%;height:100%;display:block;object-fit:cover;background:#010207}
.caw-shade{position:absolute;inset:0;background:linear-gradient(180deg,#0008 0%,transparent 25%,transparent 54%,#000e 100%);pointer-events:none}
.caw-info{position:absolute;left:18px;right:76px;bottom:18px;z-index:3;text-shadow:0 2px 12px #000}
.creator{display:flex;align-items:center;gap:10px;margin-bottom:10px}.creator-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#59e7ff44,#a878ff55);border:1px solid #ffffff35;font:800 14px Orbitron;overflow:hidden}.creator-avatar img{width:100%;height:100%;object-fit:cover}
.creator-name{font-weight:900;font-size:13px}.creator-user{font-size:10px;color:#c1ccda;margin-top:2px}
.caw-info h2{font:800 21px Orbitron;margin:0 0 7px;line-height:1.15}.caw-info p{margin:0;color:#e3e8f1;font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.caw-date{display:block;color:#aeb8c8;font-size:9px;margin-top:8px}
.actions{position:absolute;right:10px;bottom:18px;z-index:8;display:grid;gap:8px;justify-items:center}
.feed-action{width:48px;height:48px;border-radius:50%;border:1px solid #ffffff28;background:#03050ac9;color:#fff;display:grid;place-items:center;text-decoration:none;font-size:18px;backdrop-filter:blur(10px);cursor:pointer;transition:.18s ease}.feed-action:hover{border-color:#59e7ff88;transform:translateY(-2px)}.feed-action.active{border-color:#ff65c7aa;background:#ff65c71c;color:#ff8ad5}
.action-count{font-size:9px;color:#eef3fb;text-shadow:0 1px 8px #000;min-height:11px}
.follow-btn{width:48px;height:28px;border-radius:999px;border:1px solid #59e7ff88;background:#59e7ff18;color:#c9f7ff;font-size:9px;font-weight:900;cursor:pointer}.follow-btn.following{background:#ffffff16;border-color:#ffffff38;color:#fff}
.swipe-hint{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:5;display:grid;gap:5px;text-align:center;color:#c9d4e3;font-size:9px;letter-spacing:.08em;opacity:.75}.swipe-arrow{font-size:21px;animation:up 1.5s infinite}@keyframes up{50%{transform:translateY(5px);opacity:.45}}
.feed-status{position:fixed;z-index:25;bottom:14px;left:50%;transform:translateX(-50%);font-size:10px;color:#aeb8c8;background:#03050ac7;border:1px solid var(--line);border-radius:999px;padding:7px 12px;backdrop-filter:blur(8px)}
.empty-feed{min-height:100svh;display:grid;place-items:center;padding:30px;text-align:center}.empty-feed .card{max-width:520px;padding:30px}
.comments-panel{position:fixed;z-index:200;inset:auto 0 0;max-height:min(72svh,720px);background:linear-gradient(180deg,#0a0d16f8,#05070dfb);border-top:1px solid #ffffff22;border-radius:22px 22px 0 0;box-shadow:0 -30px 90px #000b;transform:translateY(105%);transition:transform .24s ease;display:flex;flex-direction:column}.comments-panel.open{transform:translateY(0)}
.comments-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #ffffff12}.comments-head strong{font:800 12px Orbitron;letter-spacing:.08em}.comments-close{border:0;background:#ffffff12;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer}
.comments-list{overflow:auto;padding:8px 18px;display:grid;gap:10px}.comment{padding:10px 12px;background:#ffffff08;border:1px solid #ffffff0d;border-radius:13px}.comment-top{display:flex;justify-content:space-between;gap:10px}.comment-user{font-weight:800;font-size:11px}.comment-time{font-size:9px;color:#8793a7}.comment-body{font-size:12px;line-height:1.45;color:#e3e8f1;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}
.comment-form{display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #ffffff12}.comment-form input{flex:1;min-width:0;background:#fff0;border:1px solid #ffffff22;color:#fff;border-radius:999px;padding:11px 14px;outline:none}.comment-form button{border:1px solid #59e7ff66;background:#59e7ff18;color:#c9f7ff;border-radius:999px;padding:0 17px;font-weight:900;cursor:pointer}.comments-empty{padding:30px;text-align:center;color:#9aa7bb;font-size:12px}
.toast{position:fixed;z-index:250;left:50%;bottom:60px;transform:translate(-50%,20px);opacity:0;background:#0b101aee;border:1px solid #ffffff22;color:#fff;border-radius:999px;padding:9px 13px;font-size:11px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:620px){.site-header{padding-top:env(safe-area-inset-top)}.feed-top{top:calc(62px + env(safe-area-inset-top));width:calc(100% - 20px)}.feed-help{display:none}.caw-slide{padding:calc(76px + env(safe-area-inset-top)) 0 0}.caw-frame{width:100%;height:calc(100svh - 76px);min-height:0;border-radius:0;border-left:0;border-right:0}.caw-info{left:16px;right:70px;bottom:22px}.actions{right:9px;bottom:22px}.feed-status{bottom:calc(10px + env(safe-area-inset-bottom))}.comments-panel{max-height:78svh}}
@media(prefers-reduced-motion:reduce){.caw-feed{scroll-behavior:auto}.swipe-arrow{animation:none}.comments-panel{transition:none}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"><a href="login.html">Sign In</a></div></header>
<div class="caw-feed-shell">
<div class="feed-top"><div class="feed-title">CAW <span>FEED</span></div><div class="feed-help">Swipe / scroll to watch</div></div>
<main id="feed" class="caw-feed" aria-label="CrowSpace Caw Feed"></main>
<div id="status" class="feed-status">Loading Caws…</div>
</div>
<section id="commentsPanel" class="comments-panel" aria-label="Caw comments" aria-hidden="true">
 <div class="comments-head"><strong id="commentsTitle">COMMENTS</strong><button class="comments-close" id="commentsClose" type="button">×</button></div>
 <div id="commentsList" class="comments-list"></div>
 <form id="commentForm" class="comment-form"><input id="commentInput" maxlength="2000" placeholder="Add a comment…" autocomplete="off"><button type="submit">Post</button></form>
</section>
<div id="toast" class="toast" role="status"></div>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/crowspace.js"></script>
<script>
const feed=document.getElementById("feed"),status=document.getElementById("status"),commentsPanel=document.getElementById("commentsPanel"),commentsList=document.getElementById("commentsList"),commentInput=document.getElementById("commentInput"),toast=document.getElementById("toast");
let caws=[],people={},stats={},currentCommentCaw=null,observer=null,viewTimers=new Map();
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const db=()=>window.crowSupabase||window.CS?.client;
const initial=v=>(String(v||"C").trim().slice(0,1)||"C").toUpperCase();
function showToast(msg){toast.textContent=msg;toast.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.remove("show"),1800)}
function avatar(p){const name=p?.display_name||p?.username||"CrowSpace Member";return p?.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="'+esc(name)+'">':esc(initial(name))}
function statFor(x){return stats[x.id]||{like_count:0,comment_count:0,viewer_liked:false,creator_followers:0,viewer_follows:false}}
function slide(x,p,i){
 const s=statFor(x),name=p?.display_name||p?.username||"CrowSpace Member",title=esc(x.title||"Untitled Caw"),caption=esc(x.caption||"");
 return '<section class="caw-slide" data-caw-id="'+esc(x.id)+'" data-index="'+i+'"><article class="caw-frame">'+
 '<video class="caw-video" playsinline preload="'+(i<2?"auto":"metadata")+'" loop muted controlslist="nodownload noplaybackrate" src="'+esc(x.video_url||"")+'"></video><div class="caw-shade"></div>'+
 '<div class="caw-info"><div class="creator"><a class="creator-avatar" href="profile.html?id='+encodeURIComponent(x.user_id)+'">'+avatar(p)+'</a><div><div class="creator-name">'+esc(name)+'</div><div class="creator-user">'+(p?.username?"@"+esc(p.username):"")+'</div></div></div>'+
 '<h2>'+title+'</h2>'+(caption?'<p>'+caption+'</p>':'')+'<small class="caw-date">'+new Date(x.created_at).toLocaleDateString()+" · <span class="view-count">"+Number(x.views||0).toLocaleString()+"</span> views · "+Number(s.creator_followers||0).toLocaleString()+" followers</small></div>"+
 '<div class="actions">'+
 '<button class="feed-action like-btn '+(s.viewer_liked?"active":"")+'" data-action="like" data-caw="'+esc(x.id)+'" aria-label="Like" title="Like">♥</button><span class="action-count like-count">'+Number(s.like_count||0).toLocaleString()+'</span>'+
 '<button class="feed-action comment-btn" data-action="comment" data-caw="'+esc(x.id)+'" aria-label="Comments" title="Comments">💬</button><span class="action-count comment-count">'+Number(s.comment_count||0).toLocaleString()+'</span>'+
 '<button class="feed-action share-btn" data-action="share" data-caw="'+esc(x.id)+'" aria-label="Share" title="Share">↗</button><span class="action-count">Share</span>'+
 '<button class="follow-btn '+(s.viewer_follows?"following":"")+'" data-action="follow" data-user="'+esc(x.user_id)+'">'+(s.viewer_follows?"Following":"Follow")+'</button>'+
 '<a class="feed-action" href="profile.html?id='+encodeURIComponent(x.user_id)+'" aria-label="Creator profile" title="Creator profile">◉</a><span class="action-count">Nest</span>'+
 '</div>'+(i===0?'<div class="swipe-hint"><span>SWIPE</span><span class="swipe-arrow">↓</span></div>':'')+
 '</article></section>';
}
function render(){feed.innerHTML=caws.map((x,i)=>slide(x,people[x.user_id]||{},i)).join("");bindActions()}
function bindActions(){
 feed.querySelectorAll("[data-action=like]").forEach(b=>b.onclick=()=>toggleLike(b.dataset.caw));
 feed.querySelectorAll("[data-action=comment]").forEach(b=>b.onclick=()=>openComments(b.dataset.caw));
 feed.querySelectorAll("[data-action=share]").forEach(b=>b.onclick=()=>shareCaw(b.dataset.caw));
 feed.querySelectorAll("[data-action=follow]").forEach(b=>b.onclick=()=>toggleFollow(b.dataset.user));
}
function updateStat(cawId,field,value){const slideEl=feed.querySelector('[data-caw-id="'+CSS.escape(cawId)+'"]');if(!slideEl)return;const el=slideEl.querySelector(field);if(el)el.textContent=Number(value||0).toLocaleString()}
async function requireUser(){const u=await CS.user();if(!u){location.href="login.html";return null}return u}
async function toggleLike(id){
 const u=await requireUser();if(!u)return;const s=statFor({id});let r;
 if(s.viewer_liked)r=await db().from("crowspace_caw_likes").delete().eq("caw_id",id).eq("user_id",u.id);else r=await db().from("crowspace_caw_likes").insert({caw_id:id,user_id:u.id});
 if(r.error){showToast(r.error.message);return}
 s.viewer_liked=!s.viewer_liked;s.like_count=Math.max(0,Number(s.like_count||0)+(s.viewer_liked?1:-1));stats[id]=s;
 const el=feed.querySelector('[data-caw-id="'+CSS.escape(id)+'"]');el?.querySelector(".like-btn")?.classList.toggle("active",s.viewer_liked);updateStat(id,".like-count",s.like_count)
}
async function toggleFollow(userId){
 const u=await requireUser();if(!u||u.id===userId)return;
 const s=caws.map(x=>statFor(x)).find(()=>false);void s;
 const existing=Object.values(stats).find(()=>false);void existing;
 const anyCaw=caws.find(x=>x.user_id===userId),st=anyCaw?statFor(anyCaw):null;if(!st)return;
 let r;
 if(st.viewer_follows)r=await db().from("crowspace_follows").delete().eq("follower_id",u.id).eq("followed_user_id",userId);else r=await db().from("crowspace_follows").insert({follower_id:u.id,followed_user_id:userId});
 if(r.error){showToast(r.error.message);return}
 caws.filter(x=>x.user_id===userId).forEach(x=>{const q=statFor(x);q.viewer_follows=!st.viewer_follows;q.creator_followers=Math.max(0,Number(q.creator_followers||0)+(q.viewer_follows?1:-1));stats[x.id]=q});
 feed.querySelectorAll('[data-action=follow][data-user="'+CSS.escape(userId)+'"]').forEach(b=>{const on=statFor(anyCaw).viewer_follows;b.classList.toggle("following",on);b.textContent=on?"Following":"Follow"});
 caws.filter(x=>x.user_id===userId).forEach(x=>{const q=statFor(x);const el=feed.querySelector('[data-caw-id="'+CSS.escape(x.id)+'"]');el?.querySelector(".caw-date").innerHTML=new Date(x.created_at).toLocaleDateString()+" · <span class=\"view-count\">"+Number(x.views||0).toLocaleString()+"</span> views · "+Number(q.creator_followers||0).toLocaleString()+" followers"});
}
async function shareCaw(id){
 const url=new URL("caw-feed.html",location.href);url.searchParams.set("caw",id);
 const x=caws.find(v=>v.id===id),text=x?.title?x.title+" · CrowSpace":"Watch this Caw on CrowSpace";
 try{if(navigator.share)await navigator.share({title:text,text,url:url.href});else{await navigator.clipboard.writeText(url.href);showToast("Caw link copied")}}catch(e){if(e?.name!=="AbortError")showToast("Share unavailable")}
}
async function openComments(id){
 currentCommentCaw=id;commentsPanel.classList.add("open");commentsPanel.setAttribute("aria-hidden","false");commentsList.innerHTML='<div class="comments-empty">Loading comments…</div>';commentsPanel.querySelector("#commentsTitle").textContent="COMMENTS";
 const {data,error}=await db().from("crowspace_caw_comments").select("id,caw_id,user_id,body,created_at").eq("caw_id",id).order("created_at",{ascending:true}).limit(100);
 if(error){commentsList.innerHTML='<div class="comments-empty">'+esc(error.message)+'</div>';return}
 const rows=data||[];if(!rows.length){commentsList.innerHTML='<div class="comments-empty">No comments yet. Start the conversation.</div>';return}
 const ids=[...new Set(rows.map(x=>x.user_id))];let prof={};try{const {data:p}=await db().from("membership_profiles").select("id,display_name,username,avatar_url").in("id",ids);(p||[]).forEach(x=>prof[x.id]=x)}catch{}
 commentsList.innerHTML=rows.map(x=>'<article class="comment"><div class="comment-top"><span class="comment-user">'+esc(prof[x.user_id]?.display_name||prof[x.user_id]?.username||"CrowSpace Member")+'</span><span class="comment-time">'+new Date(x.created_at).toLocaleString()+'</span></div><div class="comment-body">'+esc(x.body)+'</div></article>').join("");
}
function closeComments(){commentsPanel.classList.remove("open");commentsPanel.setAttribute("aria-hidden","true");currentCommentCaw=null}
document.getElementById("commentsClose").onclick=closeComments;
document.getElementById("commentForm").onsubmit=async e=>{e.preventDefault();if(!currentCommentCaw)return;const u=await requireUser();if(!u)return;const body=commentInput.value.trim();if(!body)return;const {error}=await db().from("crowspace_caw_comments").insert({caw_id:currentCommentCaw,user_id:u.id,body});if(error){showToast(error.message);return}commentInput.value="";const s=statFor(caws.find(x=>x.id===currentCommentCaw)||{id:currentCommentCaw});s.comment_count=Number(s.comment_count||0)+1;stats[currentCommentCaw]=s;updateStat(currentCommentCaw,".comment-count",s.comment_count);await openComments(currentCommentCaw)};
async function recordView(x){
 const key="caw-view:"+x.id; if(localStorage.getItem(key)==="1")return;
 const u=await CS.user();const payload={caw_id:x.id};if(u)payload.user_id=u.id;else{let token=localStorage.getItem("crowspace_viewer_token");if(!token){token=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2));localStorage.setItem("crowspace_viewer_token",token)}payload.viewer_token=token}
 const {error}=await db().from("crowspace_caw_views").insert(payload);
 if(!error){localStorage.setItem(key,"1");x.views=Number(x.views||0)+1;const el=feed.querySelector('[data-caw-id="'+CSS.escape(x.id)+'"]');if(el)el.querySelector(".view-count").textContent=Number(x.views).toLocaleString()}
}
function setupObserver(){
 observer=new IntersectionObserver(entries=>entries.forEach(entry=>{const v=entry.target,s=v.closest(".caw-slide"),id=s?.dataset.cawId,x=caws.find(q=>q.id===id);if(!x)return;if(entry.isIntersecting&&entry.intersectionRatio>.7){document.querySelectorAll(".caw-video").forEach(other=>{if(other!==v)other.pause()});v.play().catch(()=>{});if(!viewTimers.has(id))viewTimers.set(id,setTimeout(()=>{viewTimers.delete(id);recordView(x)},1400))}else{v.pause();if(id&&viewTimers.has(id)){clearTimeout(viewTimers.get(id));viewTimers.delete(id)}}}),{threshold:[.2,.7,.9]});
 feed.querySelectorAll(".caw-video").forEach(v=>observer.observe(v));
}
async function load(){
 const c=db();if(!c){status.textContent="CrowSpace database client unavailable.";return}
 try{await CS.refreshHeader()}catch(e){}
 const {data,error}=await c.from("crowspace_caws").select("id,user_id,title,caption,video_url,created_at,views").not("video_url","is",null).neq("video_url","").order("created_at",{ascending:false}).limit(100);
 if(error){console.error(error);feed.innerHTML='<div class="empty-feed"><div class="card"><h2>Caw Feed unavailable</h2><p>'+esc(error.message)+'</p><a class="btn" href="caws.html">Open Caw Studio</a></div></div>';status.textContent="Unable to load Caws";return}
 caws=data||[];if(!caws.length){feed.innerHTML='<div class="empty-feed"><div class="card"><p class="eyebrow">CAW FEED</p><h2>No Caws yet.</h2><p>Be the first creator to publish a Caw.</p><a class="btn primary" href="caws.html">Create a Caw</a></div></div>';status.textContent="No Caws published yet";return}
 const ids=[...new Set(caws.map(x=>x.user_id).filter(Boolean))];
 try{const {data:profiles}=await c.from("membership_profiles").select("id,display_name,username,avatar_url").in("id",ids);(profiles||[]).forEach(p=>people[p.id]=p)}catch(e){console.warn("Caw creator profiles unavailable",e)}
 try{const {data:rows}=await c.rpc("crowspace_caw_social_stats",{p_caw_ids:caws.map(x=>x.id)});(rows||[]).forEach(s=>stats[s.caw_id]=s)}catch(e){console.warn("Caw social stats unavailable",e)}
 render();status.textContent=caws.length+" Caw"+(caws.length===1?"":"s")+" · Swipe to continue";setupObserver();
 const wanted=new URLSearchParams(location.search).get("caw");if(wanted){const el=feed.querySelector('[data-caw-id="'+CSS.escape(wanted)+'"]');if(el)setTimeout(()=>el.scrollIntoView({behavior:"smooth"}),250)}
 feed.addEventListener("scroll",()=>{clearTimeout(window.__cawScroll);window.__cawScroll=setTimeout(()=>{const index=Math.round(feed.scrollTop/window.innerHeight);status.textContent=Math.min(index+1,caws.length)+" / "+caws.length+" Caws · Swipe to continue"},120)},{passive:true});
 const realtime=c.channel("crowspace-caw-social");
 realtime.on("postgres_changes",{event:"INSERT",schema:"public",table:"crowspace_caw_likes"},p=>{const s=stats[p.new.caw_id];if(s&&!s.viewer_liked)s.like_count=Number(s.like_count||0)+1;updateStat(p.new.caw_id,".like-count",s?.like_count||0)}).on("postgres_changes",{event:"DELETE",schema:"public",table:"crowspace_caw_likes"},p=>{const id=p.old?.caw_id,s=stats[id];if(s)s.like_count=Math.max(0,Number(s.like_count||0)-1);updateStat(id,".like-count",s?.like_count||0)}).on("postgres_changes",{event:"INSERT",schema:"public",table:"crowspace_caw_comments"},p=>{const s=stats[p.new.caw_id];if(s)s.comment_count=Number(s.comment_count||0)+1;updateStat(p.new.caw_id,".comment-count",s?.comment_count||0)}).subscribe();
}
document.addEventListener("DOMContentLoaded",load);
</script>
</body>
</html>

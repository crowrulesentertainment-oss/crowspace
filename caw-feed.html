<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03040a">
<title>Caw Feed | CrowSpace</title>
<link rel="stylesheet" href="css/crowspace.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#03040a;--panel:#080b14;--line:#ffffff20;--cyan:#59e7ff;--purple:#a879ff;--pink:#ff4fd8;--muted:#9aa7bb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff}body{overflow:hidden;font-family:Montserrat,Arial,sans-serif}
.site-header{position:fixed!important;top:0;left:0;right:0;z-index:1000}
.caw-feed{position:fixed;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding-top:0}
.caw-feed::-webkit-scrollbar{display:none}
.caw-slide{height:100svh;min-height:560px;scroll-snap-align:start;display:grid;place-items:center;padding:78px 14px 18px}
.caw-card{position:relative;width:min(430px,100%);height:min(82svh,760px);min-height:500px;overflow:hidden;border:1px solid #ffffff20;border-radius:24px;background:#05070d;box-shadow:0 30px 100px #000b}
.caw-video{width:100%;height:100%;display:block;object-fit:cover;background:#010207;cursor:pointer}
.caw-gradient{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0009 0%,transparent 25%,transparent 52%,#000f 100%)}
.caw-info{position:absolute;left:18px;right:76px;bottom:18px;z-index:4;text-shadow:0 2px 12px #000}
.creator{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#59e7ff44,#a879ff55);border:1px solid #ffffff40;color:#fff;font:800 14px Orbitron;text-decoration:none;flex:0 0 42px}
.avatar img{width:100%;height:100%;object-fit:cover}
.creator-name{font-size:13px;font-weight:900}.creator-user{font-size:10px;color:#c0cada;margin-top:2px}
.caw-title{font:800 20px/1.15 Orbitron,Montserrat,sans-serif;margin:0 0 7px}
.caw-caption{font-size:12px;line-height:1.45;color:#e3e8f1;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.caw-meta{display:block;margin-top:8px;color:#aeb8c8;font-size:9px}
.actions{position:absolute;right:10px;bottom:18px;z-index:8;display:grid;gap:5px;justify-items:center}
.action{width:48px;height:48px;border-radius:50%;border:1px solid #ffffff28;background:#03050acc;color:#fff;display:grid;place-items:center;cursor:pointer;font-size:18px;backdrop-filter:blur(10px)}
.action:hover,.action.active{border-color:#59e7ff88;background:#59e7ff16}.action.like.active{color:#ff8ad5;border-color:#ff65c7aa;background:#ff65c71c}
.count{font-size:9px;min-height:11px;color:#eef3fb;text-shadow:0 1px 8px #000}
.follow{height:28px;padding:0 10px;border-radius:999px;border:1px solid #59e7ff88;background:#59e7ff18;color:#c9f7ff;font-size:9px;font-weight:900;cursor:pointer}
.follow.following{background:#ffffff12;border-color:#ffffff38;color:#fff}
.empty{height:100svh;display:grid;place-items:center;padding:90px 20px 30px;text-align:center}.empty-box{width:min(520px,100%);padding:32px;border:1px solid #ffffff18;background:linear-gradient(145deg,#090c15,#05070d);border-radius:18px}.empty h1{font:800 22px Orbitron;margin:0 0 10px}.empty p{color:#aeb8c8;font-size:13px;line-height:1.5}.retry{margin-top:10px;border:1px solid #59e7ff55;background:#59e7ff12;color:#d7faff;border-radius:8px;padding:11px 16px;font-weight:800;cursor:pointer}
.status{position:fixed;z-index:1100;left:50%;bottom:14px;transform:translateX(-50%);padding:7px 12px;border:1px solid #ffffff18;border-radius:999px;background:#03050ad9;color:#aeb8c8;font-size:10px;backdrop-filter:blur(10px);white-space:nowrap}
.toast{position:fixed;z-index:2000;left:50%;bottom:58px;transform:translate(-50%,15px);opacity:0;pointer-events:none;padding:9px 13px;border:1px solid #ffffff22;border-radius:999px;background:#0b101aee;font-size:11px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.comments{position:fixed;z-index:1500;left:0;right:0;bottom:0;max-height:75svh;display:flex;flex-direction:column;background:#070a12f7;border-top:1px solid #ffffff20;border-radius:22px 22px 0 0;box-shadow:0 -30px 90px #000c;transform:translateY(105%);transition:transform .22s}.comments.open{transform:translateY(0)}
.comments-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #ffffff12}.comments-head strong{font:800 12px Orbitron}.close{width:34px;height:34px;border:0;border-radius:50%;background:#ffffff12;color:#fff;font-size:20px;cursor:pointer}.comment-list{overflow:auto;padding:10px 18px;display:grid;gap:9px}.comment{padding:10px 12px;border:1px solid #ffffff0d;background:#ffffff07;border-radius:12px}.comment-user{font-size:11px;font-weight:800}.comment-time{float:right;font-size:9px;color:#7f8ca1}.comment-body{margin-top:5px;font-size:12px;line-height:1.45;color:#e3e8f1;white-space:pre-wrap;overflow-wrap:anywhere}.comment-form{display:flex;gap:8px;padding:11px 18px calc(11px + env(safe-area-inset-bottom));border-top:1px solid #ffffff12}.comment-form input{flex:1;min-width:0;min-height:44px;border:1px solid #ffffff22;border-radius:999px;background:#0004;color:#fff;padding:0 14px;outline:0}.comment-form button{border:1px solid #59e7ff55;background:#59e7ff12;color:#d7faff;border-radius:999px;padding:0 16px;font-weight:900}
@media(max-width:700px){.caw-slide{padding:58px 0 0}.caw-card{width:100%;height:calc(100svh - 58px);min-height:0;border-radius:0;border-left:0;border-right:0}.caw-info{bottom:20px}.actions{bottom:20px}.status{bottom:calc(8px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){.comments{transition:none}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html">● CROWSPACE</a><nav></nav><div id="account"><a href="login.html">Sign In</a></div></header>
<main id="feed" class="caw-feed" aria-label="CrowSpace Caw Feed"></main>
<div id="status" class="status">Checking membership…</div>
<div id="toast" class="toast" role="status"></div>
<section id="comments" class="comments" aria-hidden="true">
 <div class="comments-head"><strong>COMMENTS</strong><button id="closeComments" class="close" type="button" aria-label="Close comments">×</button></div>
 <div id="commentList" class="comment-list"></div>
 <form id="commentForm" class="comment-form"><input id="commentInput" maxlength="2000" autocomplete="off" placeholder="Add a comment…"><button type="submit">Post</button></form>
</section>
<script>
window.CROW_CONFIG={supabaseUrl:"https://cevylpnoexugwgygvtgu.supabase.co",supabaseKey:"sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-"};
window.crowSupabase=window.supabase.createClient(window.CROW_CONFIG.supabaseUrl,window.CROW_CONFIG.supabaseKey);
</script>
<script src="js/global-nav.js"></script>
<script>
(()=>{"use strict";
const client=window.crowSupabase,feed=document.getElementById("feed"),status=document.getElementById("status"),toast=document.getElementById("toast"),comments=document.getElementById("comments"),commentList=document.getElementById("commentList"),commentForm=document.getElementById("commentForm"),commentInput=document.getElementById("commentInput");
let user=null,caws=[],profiles={},stats={},observer=null,currentComment=null,viewTimers=new Map();

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const initial=v=>(String(v||"C").trim()[0]||"C").toUpperCase();
const say=v=>{toast.textContent=v;toast.classList.add("show");clearTimeout(window.__cawToast);window.__cawToast=setTimeout(()=>toast.classList.remove("show"),1800)};
const stat=x=>stats[x.id]||{like_count:0,comment_count:0,viewer_liked:false,creator_followers:0,viewer_follows:false};

async function requireMember(){
 status.textContent="Checking member session…";
 try{
  const result=await Promise.race([
   client.auth.getSession(),
   new Promise((_,reject)=>setTimeout(()=>reject(new Error("Authentication timed out")),8000))
  ]);
  user=result.data?.session?.user||null;
  if(!user){location.replace("login.html?next="+encodeURIComponent(location.href));return false}
  status.textContent="Member verified";
  return true;
 }catch(e){
  console.error("CrowSpace auth:",e);
  status.textContent="Authentication error";
  feed.innerHTML='<div class="empty"><div class="empty-box"><h1>Member Sign-In Required</h1><p>Your CrowSpace session could not be verified. Please sign in again.</p><button class="retry" id="retryLogin">Sign In</button></div></div>';
  document.getElementById("retryLogin").onclick=()=>location.href="login.html?next="+encodeURIComponent(location.href);
  return false;
 }
}
function profile(id){return profiles[id]||{}}
function card(x,i){
 const p=profile(x.user_id),s=stat(x),name=p.display_name||p.username||"CrowSpace Member";
 return '<section class="caw-slide" data-id="'+esc(x.id)+'"><article class="caw-card">'+
 '<video class="caw-video" src="'+esc(x.video_url)+'" playsinline muted loop preload="'+(i<2?"auto":"metadata")+'"></video><div class="caw-gradient"></div>'+
 '<div class="caw-info"><div class="creator"><a class="avatar" href="profile.html?id='+encodeURIComponent(x.user_id)+'">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="'+esc(name)+'">':esc(initial(name)))+'</a><div><div class="creator-name">'+esc(name)+'</div><div class="creator-user">'+(p.username?"@"+esc(p.username):"")+'</div></div></div><h2 class="caw-title">'+esc(x.title||"Untitled Caw")+'</h2>'+(x.caption?'<p class="caw-caption">'+esc(x.caption)+'</p>':"")+'<small class="caw-meta">'+new Date(x.created_at).toLocaleDateString()+" · <span class="views">"+Number(x.views||0).toLocaleString()+"</span> views · "+Number(s.creator_followers||0).toLocaleString()+" followers</small></div>'+
 '<div class="actions"><button class="action like '+(s.viewer_liked?"active":"")+'" data-a="like" data-id="'+esc(x.id)+'" aria-label="Like">♥</button><span class="count like-count">'+Number(s.like_count||0).toLocaleString()+'</span><button class="action" data-a="comment" data-id="'+esc(x.id)+'" aria-label="Comments">💬</button><span class="count comment-count">'+Number(s.comment_count||0).toLocaleString()+'</span><button class="action" data-a="share" data-id="'+esc(x.id)+'" aria-label="Share">↗</button><span class="count">Share</span><button class="follow '+(s.viewer_follows?"following":"")+'" data-a="follow" data-user="'+esc(x.user_id)+'">'+(s.viewer_follows?"Following":"Follow")+'</button><a class="action" href="profile.html?id='+encodeURIComponent(x.user_id)+'" aria-label="Creator Nest">◉</a><span class="count">Nest</span></div>'+
 '</article></section>'
}
function render(){
 if(observer)observer.disconnect();
 feed.innerHTML=caws.length?caws.map(card).join(""):'<div class="empty"><div class="empty-box"><h1>No Caws Yet</h1><p>There are no playable Caws available for members right now.</p><button class="retry" id="retry">Retry</button></div></div>';
 document.getElementById("retry")?.addEventListener("click",load);
 bind(); if(caws.length)observe();
}
function bind(){
 feed.querySelectorAll("[data-a=like]").forEach(b=>b.onclick=()=>like(b.dataset.id));
 feed.querySelectorAll("[data-a=comment]").forEach(b=>b.onclick=()=>openComments(b.dataset.id));
 feed.querySelectorAll("[data-a=share]").forEach(b=>b.onclick=()=>share(b.dataset.id));
 feed.querySelectorAll("[data-a=follow]").forEach(b=>b.onclick=()=>follow(b.dataset.user));
 feed.querySelectorAll(".caw-video").forEach(v=>v.onclick=()=>v.paused?v.play().catch(()=>{}):v.pause());
}
function update(id,sel,val){const e=feed.querySelector('[data-id="'+CSS.escape(id)+'"] '+sel);if(e)e.textContent=Number(val||0).toLocaleString()}
async function like(id){
 const s=stat({id}),was=!!s.viewer_liked;
 const r=was?await client.from("crowspace_caw_likes").delete().eq("caw_id",id).eq("user_id",user.id):await client.from("crowspace_caw_likes").insert({caw_id:id,user_id:user.id});
 if(r.error){say(r.error.message);return}
 s.viewer_liked=!was;s.like_count=Math.max(0,Number(s.like_count||0)+(was?-1:1));stats[id]=s;
 feed.querySelector('[data-id="'+CSS.escape(id)+'"] .like')?.classList.toggle("active",s.viewer_liked);update(id,".like-count",s.like_count)
}
async function follow(uid){
 if(uid===user.id)return;
 const x=caws.find(v=>v.user_id===uid),s=x?stat(x):null;if(!s)return;
 const on=!!s.viewer_follows;
 const r=on?await client.from("crowspace_follows").delete().eq("follower_id",user.id).eq("followed_user_id",uid):await client.from("crowspace_follows").insert({follower_id:user.id,followed_user_id:uid});
 if(r.error){say(r.error.message);return}
 caws.filter(v=>v.user_id===uid).forEach(v=>{const q=stat(v);q.viewer_follows=!on;q.creator_followers=Math.max(0,Number(q.creator_followers||0)+(on?-1:1));stats[v.id]=q});
 feed.querySelectorAll('[data-a=follow][data-user="'+CSS.escape(uid)+'"]').forEach(b=>{b.classList.toggle("following",!on);b.textContent=!on?"Following":"Follow"})
}
async function share(id){
 const url=new URL("caw-feed.html",location.href);url.searchParams.set("caw",id);const x=caws.find(v=>v.id===id);
 try{if(navigator.share)await navigator.share({title:x?.title||"CrowSpace Caw",text:"Watch this Caw on CrowSpace",url:url.href});else{await navigator.clipboard.writeText(url.href);say("Caw link copied")}}catch(e){if(e?.name!=="AbortError")say("Share unavailable")}
}
async function openComments(id){
 currentComment=id;comments.classList.add("open");comments.setAttribute("aria-hidden","false");commentList.innerHTML='<div class="comment">Loading comments…</div>';
 const r=await client.from("crowspace_caw_comments").select("id,user_id,body,created_at").eq("caw_id",id).order("created_at",{ascending:true}).limit(100);
 if(r.error){commentList.innerHTML='<div class="comment">'+esc(r.error.message)+'</div>';return}
 if(!r.data?.length){commentList.innerHTML='<div class="comment">No comments yet. Start the conversation.</div>';return}
 const ids=[...new Set(r.data.map(v=>v.user_id).filter(Boolean))];let pp={};
 if(ids.length){const p=await client.rpc("crowspace_public_profiles_by_ids",{ids});if(!p.error)(p.data||[]).forEach(v=>pp[v.id]=v)}
 commentList.innerHTML=r.data.map(v=>'<article class="comment"><span class="comment-user">'+esc(pp[v.user_id]?.display_name||pp[v.user_id]?.username||"CrowSpace Member")+'</span><span class="comment-time">'+new Date(v.created_at).toLocaleString()+'</span><div class="comment-body">'+esc(v.body)+'</div></article>').join("")
}
function closeComments(){comments.classList.remove("open");comments.setAttribute("aria-hidden","true");currentComment=null}
document.getElementById("closeComments").onclick=closeComments;
commentForm.onsubmit=async e=>{e.preventDefault();if(!currentComment)return;const body=commentInput.value.trim();if(!body)return;const r=await client.from("crowspace_caw_comments").insert({caw_id:currentComment,user_id:user.id,body});if(r.error){say(r.error.message);return}commentInput.value="";say("Comment posted");await openComments(currentComment)}
async function view(x){
 const key="crow-view:"+x.id;if(localStorage.getItem(key)==="1")return;
 const r=await client.from("crowspace_caw_views").insert({caw_id:x.id,user_id:user.id});
 if(!r.error){localStorage.setItem(key,"1");x.views=Number(x.views||0)+1;update(x.id,".views",x.views)}
}
function observe(){
 observer=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target,x=caws.find(q=>q.id===v.closest(".caw-slide")?.dataset.id);if(!x)return;if(e.isIntersecting&&e.intersectionRatio>.7){feed.querySelectorAll(".caw-video").forEach(o=>{if(o!==v)o.pause()});v.play().catch(()=>{});if(!viewTimers.has(x.id))viewTimers.set(x.id,setTimeout(()=>{viewTimers.delete(x.id);view(x)},1200))}else{v.pause();if(viewTimers.has(x.id)){clearTimeout(viewTimers.get(x.id));viewTimers.delete(x.id)}}}),{threshold:[.2,.7,.9]});
 feed.querySelectorAll(".caw-video").forEach(v=>observer.observe(v));
 const target=new URLSearchParams(location.search).get("caw");if(target){const s=feed.querySelector('[data-id="'+CSS.escape(target)+'"]');s?.scrollIntoView({block:"start"})}
}
async function load(){
 status.textContent="Loading Caws…";
 try{
  const r=await client.from("crowspace_caws").select("id,user_id,title,caption,video_url,thumbnail_url,views,created_at,source_type,mime_type").not("video_url","is",null).neq("video_url","").order("created_at",{ascending:false}).limit(100);
  if(r.error)throw r.error;
  caws=r.data||[];
  const ids=[...new Set(caws.map(v=>v.user_id).filter(Boolean))];
  if(ids.length){const p=await client.rpc("crowspace_public_profiles_by_ids",{ids});if(!p.error)(p.data||[]).forEach(v=>profiles[v.id]=v)}
  if(caws.length){const s=await client.rpc("crowspace_caw_social_stats",{p_caw_ids:caws.map(v=>v.id)});if(!s.error)(s.data||[]).forEach(v=>stats[v.caw_id]=v)}
  render();status.textContent=caws.length?("Member Caw Feed · "+caws.length+" Caw"+(caws.length===1?"":"s")):"No playable Caws";
 }catch(e){console.error(e);feed.innerHTML='<div class="empty"><div class="empty-box"><h1>Caw Feed Error</h1><p>'+esc(e.message||"Unable to load the Caw Feed.")+'</p><button class="retry" id="retry">Retry</button></div></div>';document.getElementById("retry").onclick=load;status.textContent="Feed error"}
}
(async()=>{if(!client){status.textContent="CrowSpace connection unavailable";return}if(await requireMember()){try{await client.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"||!session)location.replace("login.html?next="+encodeURIComponent(location.href))})}catch{}await load()}})();
})();
</script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizer HQ — CrowSpace</title><link rel="stylesheet" href="crowspace-rebuild.css"><link rel="stylesheet" href="crowspace-universal.css"><script src="crowspace-auth.js"></script><script src="crowspace-universal.js" defer></script><script src="crowspace-pages.js" defer></script><style>body{background:#03040a}.ohq{max-width:1180px;margin:auto;padding:35px 20px 90px}.hero{border:1px solid #78efff22;border-radius:20px;padding:25px;background:radial-gradient(circle at 90% 10%,#a779ff18,transparent 30%),linear-gradient(135deg,#0b1327,#050811);margin-bottom:18px}.ey{font:900 8px Orbitron;color:#78efff;letter-spacing:.15em}.hero h1{font:900 clamp(28px,5vw,46px) Orbitron;margin:8px 0}.hero p{color:#a9b6c8;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{display:inline-block;padding:10px 13px;border-radius:9px;border:1px solid #ffffff14;background:#080f1d;color:#b9c7d8;font:800 9px Orbitron;text-decoration:none}.primary{background:#78efff;color:#061016;border-color:#78efff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:13px}.card{border:1px solid #ffffff0d;border-radius:15px;padding:16px;background:linear-gradient(145deg,#0b1221,#050811)}.card h2{font:900 15px Orbitron;margin:0 0 7px}.meta{color:#748399;font-size:10px;line-height:1.7}.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tool{border:1px solid #ffffff12;background:#0a1020;color:#b9c7d8;border-radius:7px;padding:8px 9px;font:800 8px Orbitron;cursor:pointer}.live{color:#ff9caf}.empty{padding:35px;border:1px dashed #ffffff16;border-radius:12px;color:#748399;text-align:center}</style></head><body><main class="ohq"><section class="hero"><div class="ey">CROWSPACE // ORGANIZER HQ</div><h1>Event Operations</h1><p>Create, monitor, and manage the events you own. Review RSVP activity, live broadcast status, and attendee activity from one place.</p><div class="actions"><a class="btn primary" href="create-event.html">＋ CREATE EVENT</a><a class="btn" href="events.html">← EVENT CENTER</a></div></section><div id="status" class="empty">INITIALIZING ORGANIZER HQ…</div><section id="grid" class="grid" style="margin-top:15px"></section></main><script>(async function(){const $=id=>document.getElementById(id),db=window.CrowSpaceUniversal?.db||window.CrowSpaceAuth?.client,esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));if(!db){$('status').textContent='CrowSpace database unavailable.';return}const u=await db.auth.getUser(),user=u.data?.user;if(!user){$('status').innerHTML='Sign in to access Organizer HQ.<div class="actions"><a class="btn primary" href="login.html">SIGN IN</a></div>';return}const ev=await db.from('crowspace_events').select('*').eq('created_by',user.id).order('starts_at',{ascending:true});if(ev.error){$('status').textContent=ev.error.message;return}const events=ev.data||[];if(!events.length){$('status').innerHTML='You have not created any events yet.<div class="actions"><a class="btn primary" href="create-event.html">CREATE YOUR FIRST EVENT</a></div>';return}$('status').className='';$('status').textContent=events.length+' EVENT'+(events.length===1?'':'S')+' UNDER YOUR CONTROL';const counts=await Promise.all(events.map(async e=>{const r=await db.from('crowspace_event_rsvps').select('status').eq('event_id',e.id);return[e,r.data||[]]}));$('grid').innerHTML=counts.map(([e,rs])=>{const going=rs.filter(x=>x.status==='going').length,interest=rs.filter(x=>x.status==='interested').length,open='event.html?id='+encodeURIComponent(e.id),edit='create-event.html?id='+encodeURIComponent(e.id);return '<article class="card"><h2>'+esc(e.title)+'</h2><div class="meta">'+new Date(e.starts_at).toLocaleString([],{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})+'<br>'+esc(e.event_type||'event')+(e.is_online?' · ONLINE':'')+(e.is_live?' · <span class="live">● LIVE</span>':'')+'<br>✓ '+going+' going · ★ '+interest+' interested'+(e.youtube_url?' · ▶ YouTube enabled':'')+'</div><div class="tools"><button class="tool" onclick="location.href='+JSON.stringify(open)+'">OPEN</button><button class="tool" onclick="location.href='+JSON.stringify(edit)+'">EDIT</button></div></article>'}).join('')})();</script></body></html>
